<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>litt.md Gallery</title>
<meta name="description" content="The litt.md components gallery: every component on the locked v0.5 motion and shape tokens, documented and installable, plus a Playground for trying other values.">
<link rel="icon" href="data:,">
<script>
  /* Apply the saved theme before first paint. */
  (function () {
    try {
      var t = localStorage.getItem("litt-gallery:theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
</head>
<body>
<script>
  /* Apply the saved Customize choices (type, shape, the accent and the material) before first paint. Shape lives on
     <body>; the face is --font-choice on <html>, which every world's face reads first; the material goes on <html>
     like data-theme, since it changes the canvas: src/gallery/customize-state.tsx says why, and owns them once the app
     runs. The accent and the material are gathered into littLook and painted by the last script, since the accent's
     attribute depends on the world. The gallery opens in Flat's own (GALLERY_LOOK in src/gallery/look.ts). */
  var littLook = { accent: "world", material: "flat" };
  (function () {
    try {
      var c = JSON.parse(localStorage.getItem("litt-gallery:customize") || "null");
      if (!c) return;
      var s = document.body.style;
      if (c.face && typeof c.face.stack === "string") {
        document.documentElement.style.setProperty("--font-choice", c.face.stack);
        var href = c.face.href;
        if (typeof href === "string" && href.indexOf("https://fonts.googleapis.com/") === 0) {
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = href;
          l.setAttribute("data-litt-face", href);
          document.head.appendChild(l);
        }
      }
      /* The radius steps and the pill (28, with 16px surfaces): SHAPES and shapeSurface in src/motion/rules.ts. */
      if (c.radius === 0 || c.radius === 2 || c.radius === 4 || c.radius === 6 || c.radius === 28) {
        s.setProperty("--radius-control", c.radius + "px");
        s.setProperty("--radius-surface", (c.radius === 28 ? 16 : c.radius === 0 ? 0 : c.radius + 4) + "px");
      }
      if (c.accent === "blue4" || c.accent === "mono" || c.accent === "pink") littLook.accent = c.accent;
      if (c.material === "press" || c.material === "flat" || c.material === "device") littLook.material = c.material;
    } catch (e) {}
  })();
</script>
<script>
  /* A link's look (?look=flat, ?look=pink-flat-fun) paints over the saved accent and material, and is never saved. Its
     own script, since the one above stops when nothing is saved. The grammar is SLUG in src/gallery/look.ts, and
     scripts/test-look.mjs runs this copy against it: the world alone is its own accent, an accent without a material is
     press. Fun mode has nothing to paint. */
  (function () {
    try {
      var m = /^(?:(press|flat|device)|(blue4|mono|pink)(?:-(flat|device))?)(-fun)?$/.exec(new URLSearchParams(location.search).get("look") || "");
      if (m) littLook = { accent: m[2] || "world", material: m[1] || m[3] || "press" };
    } catch (e) {}
  })();
</script>
<script>
  /* A world page (#press, #flat, #device) opens in its own material, whatever is saved or linked: arriving there
     writes it (src/gallery/world.tsx, proposals/worlds.md decision 1), so the first paint says the same. Then the
     look is painted: no data-accent for the world's own, and none for an accent asked for in the world whose own it
     is (accentAttribute in src/gallery/look.ts). */
  (function () {
    var w = /^#(press|flat|device)$/.exec(location.hash);
    if (w) littLook.material = w[1];
    var m = littLook.material, a = littLook.accent;
    a = a === "blue4" ? (m === "press" ? "" : "blue") : a === "mono" ? (m === "flat" ? "" : "mono") : a === "pink" ? "pink" : "";
    if (a) document.body.dataset.accent = a;
    else delete document.body.dataset.accent;
    if (m === "press") delete document.documentElement.dataset.material;
    else document.documentElement.dataset.material = m;
  })();
</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
