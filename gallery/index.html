<meta name="description" content="litt.md components gallery: eight components and a motion dial for finding the sweet spot.">
<script>
  /* Apply the saved theme before first paint. */
  (function () {
    try {
      var t = localStorage.getItem("litt-ui-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
