<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>litt.md Gallery</title>
<meta name="description" content="The litt.md components gallery: every component on the locked v0.5 motion and shape tokens, documented and installable, plus a Playground for trying other values.">
<link rel="icon" href="data:,">
<script>
  /* Apply the saved theme before first paint. */
  (function () {
    try {
      var t = localStorage.getItem("litt-gallery:theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Saira:wght@400;500;600&display=swap">
</head>
<body>
<script>
  /* Each world is closed (plans/019): a page in a world, #device or #device/button, opens in that world alone, in its
     own accent, face, shape and motion, whatever was once saved or linked; every other page in the gallery's, Flat.
     So the first paint writes only the material, on <html> like data-theme. The rule is worldOfHash in
     src/gallery/look.ts, and scripts/test-look.mjs runs this copy against it. */
  (function () {
    var w = /^#(press|flat|device|plain|rack|heat)(?:\/|$)/.exec(location.hash);
    var m = w ? w[1] : "flat";
    delete document.body.dataset.accent;
    if (m === "press") delete document.documentElement.dataset.material;
    else document.documentElement.dataset.material = m;
  })();
</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
