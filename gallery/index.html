<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>litt.md Gallery</title>
<meta name="description" content="The litt.md components gallery: every component on the locked v0.5 motion and shape tokens, documented and installable, plus a Playground for trying other values.">
<link rel="icon" href="data:,">
<script>
  /* Apply the saved theme before first paint. */
  (function () {
    try {
      var t = localStorage.getItem("litt-gallery:theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
</head>
<body>
<script>
  /* Apply the saved Customize choices (type, shape and the accent) before first paint. They live on <body>:
     src/gallery/customize-state.tsx says why, and owns them once the app runs. The gallery opens in monochrome
     (GALLERY_LOOK in src/gallery/look.ts), so it is set first and a saved accent replaces it. */
  document.body.dataset.accent = "mono";
  (function () {
    try {
      var c = JSON.parse(localStorage.getItem("litt-gallery:customize") || "null");
      if (!c) return;
      var s = document.body.style;
      if (c.face && typeof c.face.stack === "string") {
        s.setProperty("--font-sans", c.face.stack);
        var href = c.face.href;
        if (typeof href === "string" && href.indexOf("https://fonts.googleapis.com/") === 0) {
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = href;
          l.setAttribute("data-litt-face", href);
          document.head.appendChild(l);
        }
      }
      /* The radius steps and the pill (28, with 16px surfaces): SHAPES and shapeSurface in src/motion/rules.ts. */
      if (c.radius === 0 || c.radius === 2 || c.radius === 4 || c.radius === 6 || c.radius === 28) {
        s.setProperty("--radius-control", c.radius + "px");
        s.setProperty("--radius-surface", (c.radius === 28 ? 16 : c.radius === 0 ? 0 : c.radius + 4) + "px");
      }
      /* The accent: Blue 4 is tokens.css with no attribute, pink is [data-accent="pink"]. */
      if (c.accent === "blue4") delete document.body.dataset.accent;
      else if (c.accent === "pink") document.body.dataset.accent = "pink";
    } catch (e) {}
  })();
</script>
<script>
  /* A link's look (?look=pink, ?look=pink-fun) paints over the saved accent, and is never saved. Its own script, since
     the one above stops when nothing is saved. The grammar is LOOKS in src/gallery/look.ts, and scripts/test-look.mjs
     runs this copy against it. Fun mode has nothing to paint. */
  (function () {
    try {
      var m = /^(mono|blue4|pink)(-fun)?$/.exec(new URLSearchParams(location.search).get("look") || "");
      if (!m) return;
      if (m[1] === "blue4") delete document.body.dataset.accent;
      else document.body.dataset.accent = m[1];
    } catch (e) {}
  })();
</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
