            msgEl.hidden = nextHidden;
            msgEl.textContent = isErr ? "Invalid passkey · deploy stays locked" : "";
          };
          if (immediate) toggle();
          else ctx.flip(gateEl, toggle);
        } else if (isErr) {
          msgEl.textContent = "Invalid passkey · deploy stays locked";
        }
      }

      function applyCode(next, opts) {
        const o = Object.assign({ immediate: false, byUser: false, fromDemo: false }, opts);
        if (unlocked || busy) return;
        clearTimeout(unlockTimer);
        code = String(next).replace(/\D/g, "").slice(0, 6);
        input.value = code;
        syncSlots(o.immediate);

        if (code === TARGET) {
          const finish = () => {
            if (unlocked || busy || code !== TARGET) return;
            unlocked = true;
            busy = true;
            ctx.swapText(subEl, "Unlocked");
            ctx.pareOut(gateEl, () => {
              busy = false;
              if (!unlocked) return;
              gateEl.hidden = true;
              doneEl.hidden = false;
              if (o.byUser) {
                sr.textContent = "Verified. Deploying v2.14.0.";
                lockBtn.focus({ preventScroll: true });
              }
            });
          };
          if (ctx.reduced() || o.immediate) finish();
          else unlockTimer = o.fromDemo ? ctx.demoAfter(220, finish) : ctx.after(200, finish);
        } else if (code.length === 6 && o.byUser) {
          sr.textContent = "Invalid passkey, deploy stays locked";
        }
      }

      function lockAgain(byUser) {
        if (!unlocked || busy) return;
        unlocked = false;
        clearTimeout(unlockTimer);
        ctx.flip(stageEl, () => {
          doneEl.hidden = true;
          if (gateEl.getAnimations) gateEl.getAnimations().forEach((a) => a.cancel());
          gateEl.hidden = false;
          gateEl.style.pointerEvents = "";
          gateEl.style.opacity = "";
          gateEl.style.transform = "";
          code = "4829";
          input.value = code;
          syncSlots(true);
        });
        ctx.swapText(subEl, "Confirm passkey");
        if (byUser) {
          sr.textContent = "Deploy locked again";
          input.focus({ preventScroll: true });
          try { input.setSelectionRange(code.length, code.length); } catch (e) {}
        }
      }

      input.addEventListener("focus", () => {
        try { input.setSelectionRange(code.length, code.length); } catch (e) {}
      }, { signal: ctx.signal });

      input.addEventListener("keydown", (e) => {
        if (/^\d$/.test(e.key) && code.length === 6 && code !== TARGET) {
          e.preventDefault();
          applyCode("4829" + e.key, { byUser: true });
        }
      }, { signal: ctx.signal });

      input.addEventListener("input", () => {
        applyCode(input.value, { byUser: true });
      }, { signal: ctx.signal });

      input.addEventListener("paste", (e) => {
        const raw = (e.clipboardData && e.clipboardData.getData("text")) || "";
        const digits = raw.replace(/\D/g, "");
        if (!digits) return;
        e.preventDefault();
        const combined = digits.length >= 6 ? digits.slice(0, 6) : (code.length === 6 ? digits : code + digits).slice(0, 6);
        applyCode(combined, { byUser: true });
      }, { signal: ctx.signal });

      pasteBtn.addEventListener("click", () => applyCode(TARGET, { byUser: true }), { signal: ctx.signal });
      wrongBtn.addEventListener("click", () => {
        applyCode("482907", { byUser: true });
        input.focus({ preventScroll: true });
      }, { signal: ctx.signal });
      lockBtn.addEventListener("click", () => lockAgain(true), { signal: ctx.signal });

      syncSlots(true);

      function cycle() {
        ctx.demoAfter(1800, () => {
          applyCode("482907", { fromDemo: true });
          ctx.demoAfter(1800, () => {
            applyCode(TARGET, { fromDemo: true });
            ctx.demoAfter(2800, () => {
              lockAgain(false);
              cycle();
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* autonomy-switch.js */
/* Workspace Permissions, redesigned in Plain (Subtraction): an agent's capabilities as three On/Off rows, with no
   footer strip. Each row has one living 4-corner frame that glides between On and Off (200ms, bounce 0) and clamps
   inward on press; Off rows step their label back so active capabilities scan at a glance. */
(function () {
  const PERMS = [
    { key: "edit", label: "Edit files", on: "Writes directly to workspace", off: "Stages diffs for review", start: true },
    { key: "test", label: "Run tests", on: "Runs vitest after edits", off: "Asks before shell commands", start: false },
    { key: "push", label: "Push branches", on: "Updates open PRs automatically", off: "Commits stay local", start: false },
  ];
  let uid = 0;
  PlainPlayer.register({
    slug: "autonomy-switch",
    title: "Workspace Permissions",
    tagline: "Agent capabilities, each On or Off in words.",
    css: `
.ps-autonomy-switch .aw { width: min(100%, 400px) }
.ps-autonomy-switch .aw-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 0 10px; border-bottom: 1px solid var(--line) }
.ps-autonomy-switch .aw-head h3 { margin: 0; font: 500 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em }
.ps-autonomy-switch .aw-tally { font-size: 13px }
.ps-autonomy-switch .aw-list { list-style: none; margin: 0; padding: 0 }
.ps-autonomy-switch .aw-list li { border-bottom: 1px solid var(--line) }
.ps-autonomy-switch .aw-row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 24px; width: 100%;
  padding: 12px 0; cursor: pointer; -webkit-tap-highlight-color: transparent }
.ps-autonomy-switch .aw-row:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.ps-autonomy-switch .aw-label { font-size: 14px; font-weight: 500; color: var(--ink); transition: opacity var(--dur-pare) var(--ease-out) }
.ps-autonomy-switch .aw-note { grid-column: 1; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity var(--dur-pare) var(--ease-out) }
.ps-autonomy-switch .aw-row[aria-checked="false"] .aw-label { font-weight: 400; opacity: 0.52 }
.ps-autonomy-switch .aw-row[aria-checked="false"] .aw-note { opacity: 0.52 }
.ps-autonomy-switch .aw-row[aria-checked="false"]:hover .aw-label,
.ps-autonomy-switch .aw-row[aria-checked="false"]:hover .aw-note { opacity: 0.85 }
.ps-autonomy-switch .aw-pair { position: relative; grid-column: 2; grid-row: 1 / span 2; display: inline-flex; gap: 20px; padding: 3px 10px; color: var(--ink); font-size: 14px }
.ps-autonomy-switch .aw-pair span { opacity: 0.38; transition: opacity var(--dur-pare) var(--ease-out) }
.ps-autonomy-switch .aw-row[aria-checked="true"] .aw-on, .ps-autonomy-switch .aw-row[aria-checked="false"] .aw-off { opacity: 1; font-weight: 500 }
.ps-autonomy-switch.is-tile .aw { width: 100% }
.ps-autonomy-switch.is-tile .aw-row { padding: 10px 0 }
`,
    mount(host, ctx) {
      const id = "ps-aw-" + ++uid;
      host.innerHTML = `
<div class="aw">
  <div class="aw-head"><h3 id="${id}">Permissions</h3><span class="aw-tally muted" aria-hidden="true"></span></div>
  <ul class="aw-list" role="group" aria-labelledby="${id}">
    ${PERMS.map((p) => `<li><button type="button" class="aw-row" role="switch" aria-checked="false" data-k="${p.key}" aria-describedby="${id}-${p.key}">
      <span class="aw-label">${p.label}</span><span class="aw-note" id="${id}-${p.key}"></span>
      <span class="aw-pair" aria-hidden="true"><span class="aw-on">On</span><span class="aw-off">Off</span></span></button></li>`).join("")}
  </ul>
  <p class="sr-only" aria-live="polite"></p>
</div>`;
      const tallyEl = host.querySelector(".aw-tally");
      const sr = host.querySelector("[aria-live]");
      const rows = {};

      for (const p of PERMS) {
        const btn = host.querySelector(`.aw-row[data-k="${p.key}"]`);
        const pair = btn.querySelector(".aw-pair");
        const onEl = btn.querySelector(".aw-on"), offEl = btn.querySelector(".aw-off");
        const note = btn.querySelector(".aw-note");
        const frame = ctx.brackets(pair, { padX: 9, padY: 2, exactPad: true });
        let cur = p.start;
        const set = (on, immediate, byUser) => {
          cur = on;
          btn.setAttribute("aria-checked", on ? "true" : "false");
          if (immediate) note.textContent = on ? p.on : p.off;
          else ctx.swapText(note, on ? p.on : p.off);
          frame.moveTo(on ? onEl : offEl, { immediate });
          if (byUser) sr.textContent = `${p.label} ${on ? "on" : "off"}`;
        };
        set(p.start, true, false);
        btn.addEventListener("click", () => { set(!cur, false, true); sync(false); }, { signal: ctx.signal });
        rows[p.key] = { get on() { return cur; }, set };
      }

      function sync(immediate) {
        const count = Object.values(rows).filter((r) => r.on).length;
        const txt = count === 0 ? "Read-only" : `${count} of ${PERMS.length} on`;
        if (immediate) tallyEl.textContent = txt;
        else ctx.swapText(tallyEl, txt);
      }
      sync(true);

      const seq = [["test", true], ["push", true], ["push", false], ["test", false]];
      let step = 0;
      ctx.demoAfter(1500, () => {
        const run = () => {
          const [k, on] = seq[step++ % seq.length];
          rows[k].set(on, false, false);
          sync(false);
        };
        run();
        ctx.demoEvery(2400, run);
      });
    },
  });
})();

</script>
<script>
/* command-menu.js */
/* Slash Palette, redesigned in Plain (Subtraction): an open specification list with a 1px bottom-ruled search field and
   1px hairline-divided commands and workspace files. Typing pares non-matching rows away via FLIP, arrow keys glide one
   shared 4-corner frame across options, and Enter subtracts the whole palette into a one-line execution receipt. */
(function () {
  const ITEMS = [
    { key: "compact", group: "Session", kind: "cmd", cmd: "/compact", desc: "Summarize old turns", receipt: "freed 43k tokens" },
    { key: "rollback", group: "Session", kind: "cmd", cmd: "/rollback", desc: "Rewind to checkpoint", receipt: "rewound to step 02" },
    { key: "clear", group: "Session", kind: "cmd", cmd: "/clear", desc: "Reset context", receipt: "reset to 14k system" },
    { key: "review", group: "Agents", kind: "cmd", cmd: "/review", desc: "Audit staged diff", receipt: "2 notes on verify.ts" },
    { key: "spawn", group: "Agents", kind: "cmd", cmd: "/spawn", desc: "Start background run", receipt: "started background run" },
    { key: "test", group: "Agents", kind: "cmd", cmd: "/test", desc: "Run failing specs", receipt: "14 passed in vitest" },
    { key: "verify", group: "Files", kind: "file", cmd: "@src/auth/verify.ts", desc: "Pin file · 2.1k", receipt: "pinned (+2.1k)" },
    { key: "session", group: "Files", kind: "file", cmd: "@src/auth/session.ts", desc: "Pin file · 1.4k", receipt: "pinned (+1.4k)" },
  ];
  const GROUPS = ["Session", "Agents", "Files"];
  let uid = 0;

  PlainPlayer.register({
    slug: "command-menu",
    title: "Slash Palette",
    tagline: "Type to pare commands down; arrows move the frame.",
    css: `
.ps-command-menu .cm { width: min(100%, 440px); min-height: 368px; display: grid; align-content: start }
.ps-command-menu .cm.is-closed { min-height: 0; align-content: center }
.ps-command-menu .cm-box { width: 100%; border: 0; padding: 0; background: transparent }
.ps-command-menu .cm-top { position: relative }
.ps-command-menu .cm-input { font-family: var(--mono); font-size: 14px; padding-right: 96px }
.ps-command-menu .cm-count { position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); pointer-events: none }
.ps-command-menu .cm-list { position: relative; padding: 6px 0 0; display: grid; gap: 0 }
.ps-command-menu .cm-group { padding: 12px 0 4px }
.ps-command-menu .cm-group:first-child { padding-top: 4px }
.ps-command-menu .cm-opt { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 9px 10px;
  border-bottom: 1px solid var(--line); opacity: 0.42; cursor: pointer; font-size: 14px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
  transition: opacity var(--dur-pare) var(--ease-out) }
.ps-command-menu .cm-opt:hover { opacity: 0.82 }
.ps-command-menu .cm-opt[aria-selected="true"] { opacity: 1 }
.ps-command-menu .cm-cmd { font-family: var(--mono); font-size: 13px; color: var(--ink); white-space: nowrap; flex: none }
.ps-command-menu .cm-opt[aria-selected="true"] .cm-cmd { font-weight: 500 }
.ps-command-menu .cm-desc { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; text-align: right }
.ps-command-menu .cm-opt[aria-selected="true"] .cm-desc { color: var(--ink) }
.ps-command-menu .cm-empty { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted) }
.ps-command-menu .cm-receipt { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px;
  padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.4 }
.ps-command-menu .cm-ran code { font-family: var(--mono); font-size: 13px; font-weight: 500 }
.ps-command-menu .cm-reopen { min-height: 26px; margin-right: 10px; font-size: 13px }
.ps-command-menu.is-tile .cm { width: 100%; min-height: 196px }
.ps-command-menu.is-tile .cm.is-closed { min-height: 0 }
.ps-command-menu.is-tile .cm-input { min-height: 36px; padding: 6px 92px 6px 0 }
.ps-command-menu.is-tile .cm-group { display: none }
.ps-command-menu.is-tile .cm-list { padding: 6px 0 0; gap: 0 }
.ps-command-menu.is-tile .cm-opt { padding: 8px 8px }
`,
    mount(host, ctx) {
      const id = "ps-cm-" + ++uid;
      const pool = ctx.tile ? ITEMS.slice(0, 4) : ITEMS;
      const poolGroups = ctx.tile ? [] : GROUPS;
      host.innerHTML = `
<div class="cm">
  <div class="cm-box">
    <div class="cm-top">
      <input type="text" class="field cm-input" role="combobox" aria-expanded="true" aria-autocomplete="list"
        aria-controls="${id}-list" aria-label="Slash command palette" value="/" spellcheck="false" autocomplete="off">
      <span class="cm-count" aria-hidden="true">${ctx.tile ? "4 commands" : "6 commands"}</span>
    </div>
    <div class="cm-list" id="${id}-list" role="listbox" aria-label="Commands and files">
      ${ctx.tile
        ? pool.map((it) => `<div class="cm-opt" id="${id}-opt-${it.key}" role="option" aria-selected="false" data-key="${it.key}" data-group="${it.group}">
            <span class="cm-cmd">${it.cmd}</span>
            <span class="cm-desc">${it.desc}</span>
          </div>`).join("")
        : GROUPS.map((g) => {
            const gItems = pool.filter((it) => it.group === g);
            return `<div class="cm-group label" role="presentation" data-group="${g}">${g}</div>` +
              gItems.map((it) => `<div class="cm-opt" id="${id}-opt-${it.key}" role="option" aria-selected="false" data-key="${it.key}" data-group="${g}">
                <span class="cm-cmd">${it.cmd}</span>
                <span class="cm-desc">${it.desc}</span>
              </div>`).join("");
          }).join("")}
      <div class="cm-empty" hidden>No matching commands or files</div>
    </div>
  </div>
  <div class="cm-receipt" hidden>
    <span class="cm-ran"></span>
    <button type="button" class="q is-main cm-reopen">Open palette</button>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const boxEl = host.querySelector(".cm-box");
      const inputEl = host.querySelector(".cm-input");
      const countEl = host.querySelector(".cm-count");
      const listEl = host.querySelector(".cm-list");
      const groupEls = new Map(poolGroups.map((g) => [g, listEl.querySelector(`.cm-group[data-group="${g}"]`)]));
      const optEls = new Map(pool.map((it) => [it.key, listEl.querySelector(`.cm-opt[data-key="${it.key}"]`)]));
      const emptyEl = listEl.querySelector(".cm-empty");
      const receiptEl = host.querySelector(".cm-receipt");
      const ranEl = host.querySelector(".cm-ran");
      const reopenBtn = host.querySelector(".cm-reopen");
      const sr = host.querySelector("[aria-live]");

      const frame = ctx.brackets(listEl, { padX: 0, padY: -2, exactPad: true });
      let activeKey = "compact";
      let closed = false;
      let busy = false;

      function matchItems(raw) {
        const q = raw.trim().toLowerCase();
        if (!q) return pool.slice();
        if (q.startsWith("/")) {
          const rest = q.slice(1).trim();
          return pool.filter((it) => it.kind === "cmd" && (!rest || (it.cmd.slice(1) + " " + it.desc).toLowerCase().includes(rest)));
        }
        if (q.startsWith("@")) {
          const rest = q.slice(1).trim();
          return pool.filter((it) => it.kind === "file" && (!rest || (it.cmd.slice(1) + " " + it.desc).toLowerCase().includes(rest)));
        }
        return pool.filter((it) => (it.cmd + " " + it.desc + " " + it.group).toLowerCase().includes(q));
      }

      function countLabel(matches, raw) {
        const q = raw.trim();
        const n = matches.length;
        if (q.startsWith("@")) return `${n} ${n === 1 ? "file" : "files"}`;
        if (q.startsWith("/")) return `${n} ${n === 1 ? "command" : "commands"}`;
        return `${n} ${n === 1 ? "item" : "items"}`;
      }

      function applySelection(nextKey, immediate) {
        activeKey = nextKey;
        for (const it of pool) {
          const el = optEls.get(it.key);
          const sel = it.key === activeKey && !el.hidden;
          el.setAttribute("aria-selected", sel ? "true" : "false");
        }
        const activeEl = activeKey ? optEls.get(activeKey) : null;
        if (activeEl && !activeEl.hidden) {
          inputEl.setAttribute("aria-activedescendant", activeEl.id);
          frame.moveTo(activeEl, { immediate: !!immediate });
        } else {
          inputEl.removeAttribute("aria-activedescendant");
          frame.pare();
        }
      }

      function filterList(opts) {
        const o = opts || {};
        const raw = inputEl.value;
        const matches = matchItems(raw);
        const matchSet = new Set(matches.map((m) => m.key));
        const groupsShown = new Set(matches.map((m) => m.group));

        const mutate = () => {
          for (const g of poolGroups) {
            groupEls.get(g).hidden = !groupsShown.has(g);
          }
          for (const it of pool) {
            optEls.get(it.key).hidden = !matchSet.has(it.key);
          }
          emptyEl.hidden = matches.length > 0;
        };

        if (o.immediate) mutate();
        else ctx.flip(listEl, mutate);

        const cText = countLabel(matches, raw);
        if (o.immediate) countEl.textContent = cText;
        else ctx.swapText(countEl, cText);

        let nextKey = activeKey;
        if (!matchSet.has(nextKey)) {
          const pref = matches.find((m) => m.cmd.toLowerCase().startsWith(raw.trim().toLowerCase()));
          nextKey = (pref || matches[0] || {}).key || null;
        } else if (raw.trim().length > 1) {
          const pref = matches.find((m) => m.cmd.toLowerCase().startsWith(raw.trim().toLowerCase()));
          if (pref) nextKey = pref.key;
        }
        applySelection(nextKey, o.immediate);
        if (!o.immediate && !ctx.reduced()) {
          ctx.after(225, () => {
            if (!closed && !busy) applySelection(activeKey, true);
          });
        }
        if (o.announce) sr.textContent = cText;
      }

      function executeKey(key, byUser) {
        const item = pool.find((it) => it.key === key);
        if (!item || closed || busy) return;
        closed = true;
        busy = true;
        const rootEl = host.querySelector(".cm");
        inputEl.setAttribute("aria-expanded", "false");
        frame.pare();

        const prefix = item.kind === "file" ? "Pinned" : "Ran";
        ctx.pareOut(boxEl, () => {
          busy = false;
          rootEl.classList.add("is-closed");
          if (boxEl.getAnimations) boxEl.getAnimations().forEach((a) => a.cancel());
          boxEl.style.pointerEvents = "";
          boxEl.style.opacity = "";
          boxEl.style.transform = "";
          boxEl.hidden = true;
          ranEl.innerHTML = `${prefix} <code>${item.cmd}</code> · ${item.receipt}`;
          receiptEl.hidden = false;
          if (!ctx.reduced() && receiptEl.animate) {
            receiptEl.animate([{ opacity: 0, transform: "translateY(3px)" }, { opacity: 1, transform: "none" }], {
              duration: 150,
              easing: PlainPlayer.EASE_OUT,
            });
          }
          if (byUser) {
            sr.textContent = `${prefix} ${item.cmd}, ${item.receipt}.`;
            reopenBtn.focus({ preventScroll: true });
          }
        });
      }

      function reopen(byUser) {
        if (!closed || busy) return;
        closed = false;
        busy = true;
        ctx.after(180, () => { busy = false; });
        const rootEl = host.querySelector(".cm");
        ctx.flip(rootEl, () => {
          rootEl.classList.remove("is-closed");
          receiptEl.hidden = true;
          if (boxEl.getAnimations) boxEl.getAnimations().forEach((a) => a.cancel());
          boxEl.style.pointerEvents = "";
          boxEl.style.opacity = "";
          boxEl.style.transform = "";
          boxEl.hidden = false;
          inputEl.value = "/";
          inputEl.setAttribute("aria-expanded", "true");
          activeKey = "compact";
          filterList({ immediate: true });
        });
        if (!ctx.reduced()) {
          ctx.after(225, () => {
            if (!closed && !busy) applySelection(activeKey, true);
          });
        }
        if (byUser) {
          sr.textContent = `Slash palette open, ${ctx.tile ? "4" : "6"} commands.`;
          inputEl.focus({ preventScroll: true });
          inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
        }
      }

      inputEl.addEventListener("input", () => filterList({ immediate: false, announce: true }), { signal: ctx.signal });
      inputEl.addEventListener("keydown", (e) => {
        const vis = matchItems(inputEl.value);
        if (e.key === "ArrowDown" && vis.length) {
          e.preventDefault();
          const idx = vis.findIndex((it) => it.key === activeKey);
          const next = vis[(idx + 1) % vis.length];
          applySelection(next.key, false);
        } else if (e.key === "ArrowUp" && vis.length) {
          e.preventDefault();
          const idx = vis.findIndex((it) => it.key === activeKey);
          const next = vis[(idx - 1 + vis.length) % vis.length];
          applySelection(next.key, false);
        } else if (e.key === "Enter" && activeKey) {
          e.preventDefault();
          executeKey(activeKey, true);
        } else if (e.key === "Escape" && inputEl.value !== "/" && inputEl.value !== "") {
          e.preventDefault();
          inputEl.value = "/";
          filterList({ immediate: false, announce: true });
        }
      }, { signal: ctx.signal });

      for (const it of pool) {
        const el = optEls.get(it.key);
        el.addEventListener("pointerenter", () => {
          if (!closed && !busy && !el.hidden) applySelection(it.key, false);
        }, { signal: ctx.signal });
        el.addEventListener("click", () => executeKey(it.key, true), { signal: ctx.signal });
      }

      reopenBtn.addEventListener("click", () => reopen(true), { signal: ctx.signal });

      filterList({ immediate: true });

      function cycle() {
        ctx.demoAfter(1500, () => {
          applySelection("rollback", false);
          ctx.demoAfter(1100, () => {
            inputEl.value = "/c";
            filterList({ immediate: false });
            ctx.demoAfter(1100, () => {
              inputEl.value = "/co";
              filterList({ immediate: false });
              ctx.demoAfter(1200, () => {
                executeKey("compact", false);
                ctx.demoAfter(2500, () => {
                  reopen(false);
                  cycle();
                });
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* composer.js */
/* Prompt Composer, redesigned in Plain (Subtraction): context files sit above a 1px input rule and three quiet prompt
   starters. Removing a file pares it away; picking a starter or typing subtracts the suggestions so only your prompt
   and Send remain. */
(function () {
  const ALL_FILES = [
    { id: "verify", label: "@verify.ts", tok: 1.1 },
    { id: "session", label: "@session.ts", tok: 0.7 },
    { id: "test", label: "@test.ts", tok: 0.9 },
  ];

  const SUGGESTIONS = [
    { label: "Add regression test", prompt: "Add regression test for expired cookie handling" },
    { label: "Check all callers", prompt: "Check all callers of parseCookie across src/auth" },
    { label: "Explain diff", prompt: "Explain the expired cookie fallback diff in verify.ts" },
  ];

  let uid = 0;

  PlainPlayer.register({
    slug: "composer",
    title: "Prompt Composer",
    tagline: "Attach files, pare suggestions on input, and send.",
    css: `
.ps-composer .cp { width: min(100%, 430px); display: grid; gap: 14px }
.ps-composer .cp-ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-height: 24px }
.ps-composer .cp-chip { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 2px 0; border: 0;
  background: none; font-family: var(--mono); font-size: 12.5px; color: var(--ink); opacity: 0.72; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: opacity var(--dur-instant) var(--ease-out) }
.ps-composer .cp-chip:hover:not(:disabled), .ps-composer .cp-chip:focus-visible { opacity: 1 }
.ps-composer .cp-chip:disabled { opacity: 0.35; cursor: not-allowed }
.ps-composer .cp-chip-x { color: var(--muted); font-family: var(--font) }
.ps-composer .cp-chip:hover:not(:disabled) .cp-chip-x { color: var(--ink) }
.ps-composer .cp-add { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 0; border: 0; background: none;
  font-family: var(--mono); font-size: 12.5px; color: var(--ink); opacity: var(--unselected); cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: opacity var(--dur-instant) var(--ease-out) }
.ps-composer .cp-add:hover:not(:disabled) { opacity: 1; text-decoration: underline; text-underline-offset: 2px }
.ps-composer .cp-body { display: grid; gap: 14px }
.ps-composer .cp-input { font-size: 15px; line-height: 1.45; padding: 10px 0; min-height: 42px; resize: none }
.ps-composer .cp-input::placeholder { color: var(--muted); opacity: 1 }
.ps-composer .cp-input[readonly] { color: var(--muted) }
.ps-composer .cp-sugs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px }
.ps-composer .cp-sug { min-height: 26px; padding: 0; border: 0; background: none; font-size: 13px; color: var(--ink); opacity: var(--unselected); cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: opacity var(--dur-pare) var(--ease-out) }
.ps-composer .cp-sug:hover, .ps-composer .cp-sug:focus-visible { opacity: 1; text-decoration: underline; text-underline-offset: 3px }
.ps-composer .cp-foot { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding-right: 10px }
.ps-composer .cp-meta { margin-right: auto; font-size: var(--t-meta); color: var(--muted) }
.ps-composer .cp-meta.is-live { color: var(--ink); font-weight: 500 }
.ps-composer .cp-acts { display: inline-flex; align-items: center; gap: 20px }
.ps-composer.is-tile .cp { width: 100%; gap: 14px }
.ps-composer.is-tile .cp-body { gap: 14px }
.ps-composer.is-tile .cp-input { font-size: 14px; min-height: 40px }
`,
    mount(host, ctx) {
      const inputId = "ps-cp-in-" + ++uid;
      host.innerHTML = `
<div class="cp">
  <div class="cp-ctx" role="group" aria-label="Attached context files"></div>
  <div class="cp-body">
    <div>
      <label class="sr-only" for="${inputId}">Agent prompt</label>
      <input type="text" id="${inputId}" class="field cp-input" placeholder="Check expired cookie handling in…" autocomplete="off" />
    </div>
    <div class="cp-sugs" role="group" aria-label="Prompt suggestions">
      ${SUGGESTIONS.map((s, i) => `<button type="button" class="cp-sug" data-sug="${i}">${s.label}</button>`).join("")}
    </div>
    <div class="cp-foot">
      <span class="cp-meta" hidden></span>
      <span class="cp-acts">
        <button type="button" class="q is-main cp-send">Send</button>
        <button type="button" class="q cp-stop" hidden>Stop</button>
        <button type="button" class="q is-main cp-new" hidden>New prompt</button>
      </span>
    </div>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const ctxRow = host.querySelector(".cp-ctx");
      const bodyEl = host.querySelector(".cp-body");
      const inputEl = host.querySelector(".cp-input");
      const sugsEl = host.querySelector(".cp-sugs");
      const metaEl = host.querySelector(".cp-meta");
      const sendBtn = host.querySelector(".cp-send");
      const stopBtn = host.querySelector(".cp-stop");
      const newBtn = host.querySelector(".cp-new");
      const sr = host.querySelector("[aria-live]");

      let attached = ["verify", "session"];
      let paredOnce = false;
      let sugsHidden = false;
      let sugsParing = false;
      let state = "idle";
      let runToken = 0;

      function restoreEl(el) {
        el.style.pointerEvents = "";
        if (el.getAnimations) el.getAnimations().forEach((a) => a.cancel());
        el.hidden = false;
      }

      function renderChips() {
        ctxRow.textContent = "";
        for (const id of attached) {
          const f = ALL_FILES.find((x) => x.id === id);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "cp-chip";
          btn.dataset.file = id;
          btn.disabled = state !== "idle";
          btn.setAttribute("aria-label", `Remove ${f.label}`);
          btn.innerHTML = `<span>${f.label}</span><span class="cp-chip-x" aria-hidden="true">×</span>`;
          btn.addEventListener("click", () => removeChip(id, btn, true), { signal: ctx.signal });
          ctxRow.appendChild(btn);
        }
        if (paredOnce && attached.length < 2 && state === "idle") {
          const candidate = ALL_FILES.find((x) => x.id === "test" && !attached.includes("test"))
            || ALL_FILES.find((x) => !attached.includes(x.id));
          if (candidate) {
            const addBtn = document.createElement("button");
            addBtn.type = "button";
            addBtn.className = "cp-add";
            addBtn.textContent = `+ Add ${candidate.label}`;
            addBtn.addEventListener("click", () => addChip(candidate.id, true), { signal: ctx.signal });
            ctxRow.appendChild(addBtn);
          }
        }
      }

      function removeChip(id, chipEl, byUser) {
        if (state !== "idle" || !attached.includes(id) || chipEl.dataset.paring) return;
        chipEl.dataset.paring = "1";
        paredOnce = true;
        ctx.pareOut(chipEl, () => {
          attached = attached.filter((x) => x !== id);
          renderChips();
          if (byUser) {
            const f = ALL_FILES.find((x) => x.id === id);
            sr.textContent = `Removed ${f.label}.`;
            const nextFocus = ctxRow.querySelector("button") || inputEl;
            nextFocus.focus({ preventScroll: true });
          }
        });
      }

      function addChip(id, byUser) {
        if (state !== "idle" || attached.includes(id)) return;
        ctx.flip(ctxRow, () => {
          attached.push(id);
          renderChips();
        });
        if (byUser) {
          const f = ALL_FILES.find((x) => x.id === id);
          sr.textContent = `Added ${f.label}.`;
          const added = ctxRow.querySelector(`[data-file="${id}"]`);
          if (added) added.focus({ preventScroll: true });
        }
      }

      function hideSuggestions() {
        if (sugsHidden || sugsParing) return;
        sugsParing = true;
        ctx.pareOut(sugsEl, () => {
          if (!sugsParing) return;
          sugsEl.hidden = true;
          sugsHidden = true;
          sugsParing = false;
        });
      }

      function showSuggestions() {
        if (!sugsHidden && !sugsParing) return;
        sugsParing = false;
        sugsHidden = false;
        ctx.flip(bodyEl, () => {
          restoreEl(sugsEl);
        });
      }

      function pickSuggestion(idx, byUser) {
        if (state !== "idle") return;
        inputEl.value = SUGGESTIONS[idx].prompt;
        hideSuggestions();
        if (byUser) {
          sr.textContent = `Prompt set: ${SUGGESTIONS[idx].prompt}. Suggestions hidden.`;
          sendBtn.focus({ preventScroll: true });
        }
      }

      function sendPrompt(byUser) {
        if (state !== "idle") return;
        if (!inputEl.value.trim()) {
          inputEl.value = "Check expired cookie handling in verify.ts";
        }
        hideSuggestions();
        state = "running";
        const myToken = ++runToken;
        inputEl.readOnly = true;
        renderChips();
        sendBtn.hidden = true;
        stopBtn.hidden = false;
        newBtn.hidden = true;
        metaEl.hidden = false;
        metaEl.classList.add("is-live");
        metaEl.textContent = "Running · 0.4 s";
        if (byUser) {
          sr.textContent = "Dispatching prompt to agent.";
          stopBtn.focus({ preventScroll: true });
        }

        const wait = byUser ? ctx.after : ctx.demoAfter;
        wait(400, () => {
          if (runToken !== myToken || state !== "running") return;
          metaEl.textContent = "Running · 0.8 s";
          wait(400, () => {
            if (runToken !== myToken || state !== "running") return;
            metaEl.textContent = "Running · 1.2 s";
            wait(420, () => {
              if (runToken !== myToken || state !== "running") return;
              completeSend(byUser);
              if (!byUser) scheduleCycle();
            });
          });
        });
      }

      function completeSend(byUser) {
        state = "sent";
        runToken++;
        stopBtn.hidden = true;
        newBtn.hidden = false;
        metaEl.hidden = false;
        metaEl.classList.remove("is-live");
        ctx.swapText(metaEl, "Sent · +8 −3");
        if (byUser) {
          sr.textContent = "Prompt completed: +8 −3.";
          newBtn.focus({ preventScroll: true });
        }
      }

      function stopRun(byUser) {
        if (state !== "running") return;
        state = "sent";
        runToken++;
        stopBtn.hidden = true;
        newBtn.hidden = false;
        metaEl.hidden = false;
        metaEl.classList.remove("is-live");
        ctx.swapText(metaEl, "Stopped · 0 changes");
        if (byUser) {
          sr.textContent = "Agent stopped.";
          newBtn.focus({ preventScroll: true });
        }
      }

      function resetPrompt(byUser) {
        state = "idle";
        runToken++;
        inputEl.readOnly = false;
        inputEl.value = "";
        if (!byUser) {
          attached = ["verify", "session"];
          paredOnce = false;
        }
        renderChips();
        sendBtn.hidden = false;
        stopBtn.hidden = true;
        newBtn.hidden = true;
        metaEl.hidden = true;
        metaEl.classList.remove("is-live");
        metaEl.textContent = "";
        showSuggestions();
        if (byUser) {
          sr.textContent = "Ready for a new prompt.";
          inputEl.focus({ preventScroll: true });
        }
      }

      inputEl.addEventListener("input", () => {
        if (inputEl.value.trim().length > 0) hideSuggestions();
        else if (state === "idle") showSuggestions();
      }, { signal: ctx.signal });

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && state === "idle") {
          e.preventDefault();
          sendPrompt(true);
        }
      }, { signal: ctx.signal });

      for (const btn of sugsEl.querySelectorAll("[data-sug]")) {
        btn.addEventListener("click", () => pickSuggestion(+btn.dataset.sug, true), { signal: ctx.signal });
      }
      sendBtn.addEventListener("click", () => sendPrompt(true), { signal: ctx.signal });
      stopBtn.addEventListener("click", () => stopRun(true), { signal: ctx.signal });
      newBtn.addEventListener("click", () => resetPrompt(true), { signal: ctx.signal });

      ctx.onHand(() => {
        if (state === "running") {
          const myToken = ++runToken;
          ctx.after(600, () => {
            if (runToken === myToken && state === "running") completeSend(false);
          });
        }
      });

      renderChips();

      function scheduleCycle() {
        ctx.demoAfter(2500, () => {
          resetPrompt(false);
          cycle();
        });
      }

      function cycle() {
        ctx.demoAfter(1800, () => {
          pickSuggestion(0, false);
          ctx.demoAfter(1100, () => {
            sendPrompt(false);
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* context-budget.js */
/* Context Window, redesigned in Plain (Subtraction): token pressure shown as one standing figure and one 1px bar
   driven purely by translateX. Compacting old turns or dropping unused files pares heavy breakdown rows into quiet
   summary receipts and pulls the meter back with zero bounce. */
(function () {
  const LIMIT = 128;
  const SYS = 14;

  PlainPlayer.register({
    slug: "context-budget",
    title: "Context Window",
    tagline: "Compact old turns to subtract tokens from context.",
    css: `
.ps-context-budget .cb { width: min(100%, 420px); display: grid; gap: 12px }
.ps-context-budget .cb-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line) }
.ps-context-budget .cb-head h3 { margin: 0; font: 500 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em }
.ps-context-budget .cb-limit { font-size: 13px }
.ps-context-budget .cb-meter { display: grid; gap: 12px }
.ps-context-budget .cb-readout { display: flex; align-items: baseline; justify-content: space-between; gap: 12px }
.ps-context-budget .cb-stat { display: flex; align-items: baseline; gap: 10px; min-width: 0 }
.ps-context-budget .cb-pct { font-size: 13px; white-space: nowrap }
.ps-context-budget .cb-free { font-size: 13px; white-space: nowrap }
.ps-context-budget .cb-list { display: grid }
.ps-context-budget .cb-row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.4; transition: opacity var(--dur-pare) var(--ease-out) }
.ps-context-budget .cb-row.is-pared { opacity: 0.48 }
.ps-context-budget .cb-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-context-budget .cb-row.is-heavy .cb-name { color: var(--ink); font-weight: 500 }
.ps-context-budget .cb-act, .ps-context-budget .cb-reset { min-height: 24px; margin-right: 10px; font-size: 13px }
.ps-context-budget .cb-saved { font-size: 13px; color: var(--muted); white-space: nowrap }
.ps-context-budget .cb-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; line-height: 1.4 }
.ps-context-budget.is-tile .cb { width: 100%; gap: 12px }
.ps-context-budget.is-tile .cb-head { padding-bottom: 8px }
.ps-context-budget.is-tile .cb-row { padding: 8px 0 }
`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="cb">
  <div class="cb-head">
    <h3>Context window</h3>
    <span class="cb-limit muted">128k limit</span>
  </div>
  <div class="cb-meter">
    <div class="cb-readout">
      <div class="cb-stat">
        <span class="fig cb-fig">104k used</span>
        <span class="cb-pct muted">81 %</span>
      </div>
      <span class="cb-free muted">24k free</span>
    </div>
    <div class="bar-track" role="meter" aria-label="Context window usage" aria-valuemin="0" aria-valuemax="128" aria-valuenow="104" aria-valuetext="104k of 128k tokens used, 81 percent">
      <div class="bar-fill" style="--p: 0.8125"></div>
    </div>
  </div>
  <div class="cb-list">
    <div class="cb-row is-pared" data-row="sys">
      <span class="cb-name">System &amp; tools · 14k</span>
    </div>
    <div class="cb-row" data-row="files"></div>
    <div class="cb-row" data-row="turns"></div>
  </div>
  <div class="cb-foot" hidden>
    <span class="cb-note muted"></span>
    <button type="button" class="q is-ink cb-reset">Reset</button>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const figEl = host.querySelector(".cb-fig");
      const pctEl = host.querySelector(".cb-pct");
      const freeEl = host.querySelector(".cb-free");
      const meterEl = host.querySelector(".bar-track");
      const fillEl = host.querySelector(".bar-fill");
      const listEl = host.querySelector(".cb-list");
      const footEl = host.querySelector(".cb-foot");
      const noteEl = host.querySelector(".cb-note");
      const resetBtn = host.querySelector(".cb-reset");
      const sr = host.querySelector("[aria-live]");

      let dropped = false;
      let compacted = false;
      let busy = false;

      function totals() {
        const files = dropped ? 24 : 38;
        const turns = compacted ? 9 : 52;
        const used = SYS + files + turns;
        const pct = Math.round((used / LIMIT) * 100);
        const free = LIMIT - used;
        const saved = 104 - used;
        return { used, pct, free, saved };
      }

      function renderFilesRow(row) {
        if (dropped) {
          row.className = "cb-row is-pared";
          row.innerHTML = `<span class="cb-name">Pinned files (2) · 24k</span><span class="cb-saved">−14k</span>`;
        } else {
          row.className = "cb-row";
          row.innerHTML = `<span class="cb-name">Pinned files (4) · 38k</span><button type="button" class="q cb-act" data-act="drop">Drop unused</button>`;
          row.querySelector("button").addEventListener("click", () => dropUnused(true), { signal: ctx.signal });
        }
      }

      function renderTurnsRow(row) {
        if (compacted) {
          row.className = "cb-row is-pared";
          row.innerHTML = `<span class="cb-name">Summary (18 turns) · 9k</span><span class="cb-saved">−43k</span>`;
        } else {
          row.className = "cb-row is-heavy";
          row.innerHTML = `<span class="cb-name">Earlier 18 turns · 52k</span><button type="button" class="q is-main cb-act" data-act="compact">Compact</button>`;
          row.querySelector("button").addEventListener("click", () => compactTurns(true), { signal: ctx.signal });
        }
      }

      function syncMeter(immediate) {
        const { used, pct, free, saved } = totals();
        const figText = `${used}k used`;
        const pctText = `${pct} %`;
        const freeText = `${free}k free`;
        fillEl.style.setProperty("--p", (used / LIMIT).toFixed(4));
        meterEl.setAttribute("aria-valuenow", String(used));
        meterEl.setAttribute("aria-valuetext", `${used}k of 128k tokens used, ${pct} percent`);
        if (immediate) {
          figEl.textContent = figText;
          pctEl.textContent = pctText;
          freeEl.textContent = freeText;
        } else {
          ctx.swapText(figEl, figText);
          ctx.swapText(pctEl, pctText);
          ctx.swapText(freeEl, freeText);
        }
        if (saved > 0) {
          footEl.hidden = false;
          const noteText = `Freed ${saved}k tokens`;
          if (immediate) noteEl.textContent = noteText;
          else ctx.swapText(noteEl, noteText);
        } else {
          footEl.hidden = true;
        }
      }

      function settleRow(el) {
        if (!ctx.reduced() && el.animate) {
          el.animate([{ opacity: 0, transform: "translateY(3px)" }, { opacity: 1, transform: "none" }], { duration: 150, easing: PlainPlayer.EASE_OUT });
        }
      }

      function compactTurns(byUser) {
        if (compacted || busy) return;
        busy = true;
        compacted = true;
        syncMeter(false);
        const oldRow = listEl.querySelector('[data-row="turns"]');
        ctx.pareOut(oldRow, () => {
          busy = false;
          const next = document.createElement("div");
          next.dataset.row = "turns";
          renderTurnsRow(next);
          oldRow.replaceWith(next);
          settleRow(next);
          if (byUser) {
            const { used, pct } = totals();
            sr.textContent = `Compacted 18 turns to 9k summary. ${used}k used, ${pct} percent.`;
            const dropBtn = listEl.querySelector('[data-act="drop"]');
            (dropBtn || resetBtn).focus({ preventScroll: true });
          }
        });
      }

      function dropUnused(byUser) {
        if (dropped || busy) return;
        busy = true;
        dropped = true;
        syncMeter(false);
        const oldRow = listEl.querySelector('[data-row="files"]');
        ctx.pareOut(oldRow, () => {
          busy = false;
          const next = document.createElement("div");
          next.dataset.row = "files";
          renderFilesRow(next);
          oldRow.replaceWith(next);
          settleRow(next);
          if (byUser) {
            const { used, pct } = totals();
            sr.textContent = `Dropped 2 unused files, freed 14k tokens. ${used}k used, ${pct} percent.`;
            const compactBtn = listEl.querySelector('[data-act="compact"]');
            (compactBtn || resetBtn).focus({ preventScroll: true });
          }
        });
      }

      function reset(byUser) {
        if ((!compacted && !dropped) || busy) return;
        compacted = false;
        dropped = false;
        ctx.flip(host.querySelector(".cb"), () => {
          const fRow = listEl.querySelector('[data-row="files"]');
          const tRow = listEl.querySelector('[data-row="turns"]');
          renderFilesRow(fRow);
          renderTurnsRow(tRow);
          syncMeter(false);
        });
        if (byUser) {
          sr.textContent = "Restored full context, 104k used, 81 percent.";
          const compactBtn = listEl.querySelector('[data-act="compact"]');
          if (compactBtn) compactBtn.focus({ preventScroll: true });
        }
      }

      renderFilesRow(listEl.querySelector('[data-row="files"]'));
      renderTurnsRow(listEl.querySelector('[data-row="turns"]'));
      syncMeter(true);
      resetBtn.addEventListener("click", () => reset(true), { signal: ctx.signal });

      function cycle() {
        ctx.demoAfter(2200, () => {
          compactTurns(false);
          ctx.demoAfter(2200, () => {
            dropUnused(false);
            ctx.demoAfter(2500, () => {
              reset(false);
              cycle();
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* destructive-guard.js */
/* Destructive Guard, redesigned in Plain (Subtraction): the safety bar begins full and drains toward zero only while
   held; releasing early springs it back to full, and reaching zero pares the entire warning gate into one receipt line. */
(function () {
  const HOLD_SEC = 1.2;

  PlainPlayer.register({
    slug: "destructive-guard",
    title: "Destructive Guard",
    tagline: "Hold until the safety bar drains to zero.",
    css: `
.ps-destructive-guard .dg { width: min(100%, 400px); display: grid; gap: 14px }
.ps-destructive-guard .dg-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line) }
.ps-destructive-guard .dg-label { font-size: 14px; font-weight: 500; color: var(--danger) }
.ps-destructive-guard .dg-label.is-done { font-weight: 400; color: var(--muted) }
.ps-destructive-guard .dg-stage { display: grid }
.ps-destructive-guard .dg-gate { display: grid; gap: 14px }
.ps-destructive-guard .dg-cmd { padding: 2px 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.45; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-destructive-guard .dg-meta { margin: -4px 0 0; font-size: 13px; color: var(--muted) }
.ps-destructive-guard .dg-bar-fill { transition: none }
.ps-destructive-guard .dg-actions { display: flex; align-items: center; padding: 2px 10px 0 }
.ps-destructive-guard .dg-hold { user-select: none; touch-action: none }
.ps-destructive-guard .dg-done { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); font-size: 14px }
.ps-destructive-guard .dg-done code { font-family: var(--mono); font-size: 12.5px }
.ps-destructive-guard.is-tile .dg { width: 100%; gap: 12px }
.ps-destructive-guard.is-tile .dg-gate { gap: 12px }
`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="dg">
  <div class="dg-head">
    <span class="dg-label">Destructive action</span>
    <span class="fig dg-time">1.2 s left</span>
  </div>
  <div class="dg-stage">
    <div class="dg-gate">
      <div class="dg-cmd">DROP TABLE session_archive</div>
      <p class="dg-meta">18,420 expired rows · staging-db</p>
      <div class="bar-track" role="progressbar" aria-label="Safety hold remaining" aria-valuemin="0" aria-valuemax="1.2" aria-valuenow="1.2">
        <div class="bar-fill dg-bar-fill" style="--p: 1"></div>
      </div>
      <div class="dg-actions">
        <button type="button" class="q is-main is-danger dg-hold">Hold to drop</button>
      </div>
    </div>
    <div class="dg-done" hidden>
      <span>Dropped <code>session_archive</code></span>
      <button type="button" class="q is-main dg-undo">Undo snapshot</button>
    </div>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const labelEl = host.querySelector(".dg-label");
      const timeEl = host.querySelector(".dg-time");
      const stageEl = host.querySelector(".dg-stage");
      const gateEl = host.querySelector(".dg-gate");
      const trackEl = host.querySelector(".bar-track");
      const fillEl = host.querySelector(".dg-bar-fill");
      const holdBtn = host.querySelector(".dg-hold");
      const doneEl = host.querySelector(".dg-done");
      const undoBtn = host.querySelector(".dg-undo");
      const sr = host.querySelector("[aria-live]");

      let p = 1;
      let mode = "idle";
      let busy = false;
      let holdLoop = null;
      let demoLoop = null;
      let activeSpring = null;

      function renderProgress(val) {
        p = Math.max(0, Math.min(1, val));
        fillEl.style.setProperty("--p", p.toFixed(4));
        const sec = Math.max(0, p * HOLD_SEC);
        trackEl.setAttribute("aria-valuenow", sec.toFixed(1));
        timeEl.textContent = p <= 0.001 ? "0.0 s" : `${sec.toFixed(1)} s left`;
      }

      function stopLoops() {
        if (holdLoop) { holdLoop.stop = true; holdLoop = null; }
        if (demoLoop) { demoLoop.stop = true; demoLoop = null; }
        if (activeSpring) { activeSpring.stop(); activeSpring = null; }
      }

      function beginHold(byUser) {
        if (mode === "dropped" || mode === "holding" || busy) return;
        stopLoops();
        mode = "holding";
        holdBtn.setAttribute("aria-pressed", "true");
        holdLoop = ctx.loop((dt) => {
          if (mode !== "holding") return false;
          const next = Math.max(0, p - dt / HOLD_SEC);
          renderProgress(next);
          if (next <= 0) {
            completeDrop(byUser);
            return false;
          }
          return true;
        });
      }

      function releaseEarly(byUser) {
        if (mode !== "holding") return;
        stopLoops();
        mode = "returning";
        holdBtn.removeAttribute("aria-pressed");
        const sp = ctx.spring(p, (val) => {
          if (mode !== "returning") return;
          renderProgress(val);
          if (Math.abs(val - 1) < 0.001) {
            renderProgress(1);
            mode = "idle";
          }
        }, { duration: 0.22 });
        activeSpring = sp;
        sp.set(1);
        if (byUser) sr.textContent = "Held back, table untouched";
      }

      function completeDrop(byUser) {
        if (mode === "dropped" || busy) return;
        stopLoops();
        mode = "dropped";
        busy = true;
        renderProgress(0);
        holdBtn.removeAttribute("aria-pressed");
        labelEl.classList.add("is-done");
        ctx.swapText(labelEl, "Migration executed");
        ctx.swapText(timeEl, "0.0 s");
        ctx.pareOut(gateEl, () => {
          busy = false;
          gateEl.hidden = true;
          doneEl.hidden = false;
          if (byUser) {
            sr.textContent = "Dropped session_archive. Undo snapshot available.";
            undoBtn.focus({ preventScroll: true });
          }
        });
      }

      function restore(byUser) {
        if (mode !== "dropped" || busy) return;
        stopLoops();
        mode = "idle";
        ctx.flip(stageEl, () => {
          doneEl.hidden = true;
          if (gateEl.getAnimations) gateEl.getAnimations().forEach((a) => a.cancel());
          gateEl.hidden = false;
          gateEl.style.pointerEvents = "";
          gateEl.style.opacity = "";
          gateEl.style.transform = "";
          renderProgress(1);
        });
        labelEl.classList.remove("is-done");
        ctx.swapText(labelEl, "Destructive action");
        if (byUser) {
          sr.textContent = "Restored session_archive from snapshot";
          holdBtn.focus({ preventScroll: true });
        }
      }

      holdBtn.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        e.preventDefault();
        try { holdBtn.setPointerCapture(e.pointerId); } catch (err) {}
        beginHold(true);
      }, { signal: ctx.signal });

      for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) {
        holdBtn.addEventListener(ev, () => releaseEarly(true), { signal: ctx.signal });
      }

      holdBtn.addEventListener("keydown", (e) => {
        if (e.key !== " " && e.key !== "Enter") return;
        e.preventDefault();
        if (!e.repeat) beginHold(true);
      }, { signal: ctx.signal });

      holdBtn.addEventListener("keyup", (e) => {
        if (e.key === " " || e.key === "Enter") releaseEarly(true);
      }, { signal: ctx.signal });

      holdBtn.addEventListener("blur", () => releaseEarly(false), { signal: ctx.signal });
      undoBtn.addEventListener("click", () => restore(true), { signal: ctx.signal });

      ctx.onHand(() => {
        if (demoLoop) {
          demoLoop.stop = true;
          demoLoop = null;
          if (mode === "holding") releaseEarly(false);
        }
      });

      function demoHoldFor(durationMs, onDone) {
        if (ctx.handed() || mode === "dropped") return;
        mode = "holding";
        holdBtn.setAttribute("aria-pressed", "true");
        let elapsed = 0;
        demoLoop = ctx.loop((dt) => {
          if (ctx.handed() || mode !== "holding") return false;
          elapsed += dt * 1000;
          const next = Math.max(0, p - dt / HOLD_SEC);
          renderProgress(next);
          if (next <= 0) {
            demoLoop = null;
            completeDrop(false);
            if (onDone) onDone();
            return false;
          }
          if (elapsed >= durationMs) {
            demoLoop = null;
            releaseEarly(false);
            if (onDone) onDone();
            return false;
          }
          return true;
        });
      }

      function cycle() {
        ctx.demoAfter(1600, () => {
          demoHoldFor(640, () => {
            ctx.demoAfter(1700, () => {
              demoHoldFor(1400, () => {
                ctx.demoAfter(2600, () => {
                  restore(false);
                  cycle();
                });
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* effort-mode.js */
/* Effort & Depth, redesigned in Plain (Subtraction): pick Fast, Balanced or Deep; four corner hairlines glide across
   the effort strip, the thinking-token ceiling updates, and unused reasoning phases pare away so the dispatch line
   closes the gap. */
(function () {
  const MODES = [
    {
      key: "fast",
      label: "Fast",
      budget: "0 thinking tok",
      meta: "~2 s · $0.01 est.",
      steps: [
        { num: "01", name: "Direct edit", detail: "Single pass on verify.ts" },
      ],
    },
    {
      key: "balanced",
      label: "Balanced",
      budget: "8k thinking tok",
      meta: "~9 s · $0.06 est.",
      steps: [
        { num: "01", name: "Plan", detail: "Map session call sites" },
        { num: "02", name: "Edit & test", detail: "Run vitest on touched files" },
      ],
    },
    {
      key: "deep",
      label: "Deep",
      budget: "32k thinking tok",
      meta: "~28 s · $0.24 est.",
      steps: [
        { num: "01", name: "Plan", detail: "Check cross-file invariants" },
        { num: "02", name: "Multi-file edit", detail: "Update auth & session callers" },
        { num: "03", name: "Self-critique & test", detail: "Full suite + edge cases" },
      ],
    },
  ];
  let uid = 0;

  PlainPlayer.register({
    slug: "effort-mode",
    title: "Effort & Depth",
    tagline: "Pick effort depth; unused reasoning steps subtract.",
    css: `
.ps-effort-mode .em { width: min(100%, 400px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px }
.ps-effort-mode .em-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); min-width: 0 }
.ps-effort-mode .em-head h3 { margin: 0; font: 500 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em; white-space: nowrap }
.ps-effort-mode .em-target { font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.ps-effort-mode .em-modes { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; padding: 2px 9px }
.ps-effort-mode .em-modes .q { min-height: 24px }
.ps-effort-mode .em-modes .q[aria-checked="true"] { font-weight: 500; color: var(--ink) }
.ps-effort-mode .em-body { display: grid; grid-template-columns: minmax(0, 1fr) }
.ps-effort-mode .em-readout { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding: 2px 0 10px; border-bottom: 1px solid var(--line); min-width: 0 }
.ps-effort-mode .em-meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.ps-effort-mode .em-flow { display: grid; grid-template-columns: minmax(0, 1fr) }
.ps-effort-mode .em-step { display: grid; grid-template-columns: 24px auto minmax(0, 1fr); align-items: baseline; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; min-width: 0 }
.ps-effort-mode .em-num { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums }
.ps-effort-mode .em-name { font-weight: 500; color: var(--ink); white-space: nowrap }
.ps-effort-mode .em-detail { font-size: 13px; color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.ps-effort-mode .em-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px 0 }
.ps-effort-mode.is-tile .em { width: 100%; gap: 8px }
.ps-effort-mode.is-tile .em-head { padding-bottom: 7px }
.ps-effort-mode.is-tile .em-foot .q { min-height: 28px }
.ps-effort-mode.is-tile .em-readout { padding: 0 0 8px }
.ps-effort-mode.is-tile .em-step { padding: 8px 0 }
.ps-effort-mode.is-tile .em-foot { padding-top: 6px }
`,
    mount(host, ctx) {
      const id = "ps-em-" + ++uid;
      host.innerHTML = `
<div class="em">
  <div class="em-head">
    <h3 id="${id}-lbl">Refactor session auth</h3>
    <span class="em-target">src/auth/verify.ts</span>
  </div>
  <div class="em-modes" role="radiogroup" aria-labelledby="${id}-lbl">
    ${MODES.map((m) => `<button type="button" class="q in-frame" role="radio" aria-checked="false" tabindex="-1" data-mode="${m.key}">${m.label}</button>`).join("")}
  </div>
  <div class="em-body">
    <div class="em-readout">
      <span class="fig em-fig"></span>
      <span class="em-meta"></span>
    </div>
    <div class="em-flow" data-focus-group>
      <div class="em-step" data-idx="0"><span class="em-num">01</span><span class="em-name"></span><span class="em-detail"></span></div>
      <div class="em-step" data-idx="1"><span class="em-num">02</span><span class="em-name"></span><span class="em-detail"></span></div>
      <div class="em-step" data-idx="2"><span class="em-num">03</span><span class="em-name"></span><span class="em-detail"></span></div>
      <div class="em-foot" data-active>
        <button type="button" class="q is-ink em-run">Dispatch run</button>
        <button type="button" class="q em-stop" hidden>Reset</button>
      </div>
    </div>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const modesEl = host.querySelector(".em-modes");
      const radios = [...modesEl.querySelectorAll('[role="radio"]')];
      const figEl = host.querySelector(".em-fig");
      const metaEl = host.querySelector(".em-meta");
      const flowEl = host.querySelector(".em-flow");
      const stepEls = [...flowEl.querySelectorAll(".em-step")];
      const runBtn = host.querySelector(".em-run");
      const stopBtn = host.querySelector(".em-stop");
      const sr = host.querySelector("[aria-live]");
      const frame = ctx.brackets(modesEl, { padX: 9, padY: 2, exactPad: true });

      let curIdx = 1;
      let dispatched = false;
      let animSeq = 0;
      let pendingAnims = [];

      function clearPending() {
        for (const a of pendingAnims) {
          try { a.cancel(); } catch (e) {}
        }
        pendingAnims = [];
        for (const s of stepEls) {
          s.style.opacity = "";
          s.style.transform = "";
          s.style.pointerEvents = "";
        }
      }

      function clearDispatch(immediate) {
        if (!dispatched) return;
        dispatched = false;
        flowEl.removeAttribute("data-focusing");
        stepEls[0].removeAttribute("data-active");
        const m = MODES[curIdx];
        stepEls[0].querySelector(".em-detail").textContent = m.steps[0].detail;
        stopBtn.hidden = true;
        runBtn.disabled = false;
        runBtn.classList.add("is-ink");
        if (immediate) runBtn.textContent = "Dispatch run";
        else ctx.swapText(runBtn, "Dispatch run");
      }

      function applyMode(idx, opts) {
        const o = Object.assign({ immediate: false, byUser: false, focusRadio: false }, opts);
        const prevCount = stepEls.filter((el) => !el.hidden).length;
        curIdx = idx;
        const m = MODES[idx];
        const seq = ++animSeq;
        clearPending();
        clearDispatch(o.immediate);

        radios.forEach((btn, i) => {
          const on = i === idx;
          btn.setAttribute("aria-checked", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
          if (on && o.focusRadio) btn.focus({ preventScroll: true });
        });
        frame.moveTo(radios[idx], { immediate: o.immediate });

        if (o.immediate) {
          figEl.textContent = m.budget;
          metaEl.textContent = m.meta;
          stepEls.forEach((el, i) => {
            const st = m.steps[i];
            el.hidden = !st;
            if (st) {
              el.querySelector(".em-name").textContent = st.name;
              el.querySelector(".em-detail").textContent = st.detail;
            }
          });
          return;
        }

        ctx.swapText(figEl, m.budget);
        ctx.swapText(metaEl, m.meta);

        const nextCount = m.steps.length;
        if (nextCount < prevCount && !ctx.reduced()) {
          for (let i = 0; i < nextCount; i++) {
            const st = m.steps[i];
            ctx.swapText(stepEls[i].querySelector(".em-name"), st.name);
            ctx.swapText(stepEls[i].querySelector(".em-detail"), st.detail);
          }
          const leaving = stepEls.slice(nextCount, prevCount);
          let done = 0;
          for (const el of leaving) {
            el.style.pointerEvents = "none";
            if (el.animate) {
              const a = el.animate(
                [{ opacity: 1, transform: "translateX(0)" }, { opacity: 0, transform: "translateX(-6px)" }],
                { duration: 140, easing: PlainPlayer.EASE_OUT, fill: "forwards" }
              );
              pendingAnims.push(a);
              a.onfinish = () => {
                done++;
                if (done === leaving.length && seq === animSeq && !ctx.signal.aborted) {
                  clearPending();
                  ctx.flip(flowEl, () => {
                    stepEls.forEach((s, i) => { s.hidden = i >= nextCount; });
                  });
                }
              };
            } else {
              el.hidden = true;
            }
          }
        } else {
          ctx.flip(flowEl, () => {
            stepEls.forEach((el, i) => {
              const st = m.steps[i];
              const wasHidden = el.hidden;
              el.hidden = !st;
              if (st) {
                if (wasHidden) {
                  el.querySelector(".em-name").textContent = st.name;
                  el.querySelector(".em-detail").textContent = st.detail;
                  if (!ctx.reduced() && el.animate) {
                    const a = el.animate(
                      [{ opacity: 0, transform: "translateX(-4px)" }, { opacity: 1, transform: "translateX(0)" }],
                      { duration: 160, easing: PlainPlayer.EASE_OUT }
                    );
                    pendingAnims.push(a);
                  }
                } else {
                  ctx.swapText(el.querySelector(".em-name"), st.name);
                  ctx.swapText(el.querySelector(".em-detail"), st.detail);
                }
              }
            });
          });
        }

        if (o.byUser) {
          sr.textContent = `${m.label}: ${m.budget}, ${m.steps.length} ${m.steps.length === 1 ? "phase" : "phases"}`;
        }
      }

      function dispatch(byUser) {
        if (dispatched) return;
        dispatched = true;
        stepEls[0].setAttribute("data-active", "");
        if (MODES[curIdx].steps.length > 1) flowEl.setAttribute("data-focusing", "");
        ctx.swapText(stepEls[0].querySelector(".em-detail"), "Running now");
        ctx.swapText(runBtn, "Dispatched · step 1");
        runBtn.disabled = true;
        runBtn.classList.remove("is-ink");
        stopBtn.hidden = false;
        if (byUser) {
          sr.textContent = `Dispatched ${MODES[curIdx].label} run, step 1 active`;
          stopBtn.focus({ preventScroll: true });
        }
      }

      radios.forEach((btn, i) => {
        btn.addEventListener("click", () => applyMode(i, { byUser: true }), { signal: ctx.signal });
      });

      modesEl.addEventListener("keydown", (e) => {
        let next = -1;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (curIdx + 1) % MODES.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (curIdx - 1 + MODES.length) % MODES.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = MODES.length - 1;
        if (next >= 0) {
          e.preventDefault();
          applyMode(next, { byUser: true, focusRadio: true });
        }
      }, { signal: ctx.signal });

      runBtn.addEventListener("click", () => dispatch(true), { signal: ctx.signal });
      stopBtn.addEventListener("click", () => {
        clearDispatch(false);
        sr.textContent = "Run reset";
        runBtn.focus({ preventScroll: true });
      }, { signal: ctx.signal });

      applyMode(1, { immediate: true });

      function cycle() {
        ctx.demoAfter(2000, () => {
          applyMode(0);
          ctx.demoAfter(2200, () => {
            applyMode(2);
            ctx.demoAfter(2200, () => {
              dispatch(false);
              ctx.demoAfter(2200, () => {
                applyMode(1);
                cycle();
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
