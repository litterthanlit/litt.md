  transition: color var(--dur-instant) var(--ease-out) }
.ps-eval-matrix .em-col.is-scan { color: var(--ink); font-weight: 500 }
.ps-eval-matrix .em-suite { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; min-width: 0;
  transition: opacity var(--dur-pare) var(--ease-out) }
.ps-eval-matrix .em-sw { width: 8px; height: 8px; background: var(--suite); flex: none }
.ps-eval-matrix .em-cell { position: relative; aspect-ratio: 1; width: 100%; max-width: 26px; justify-self: center; padding: 0; border: 0; background: none;
  display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: opacity var(--dur-pare) var(--ease-out), transform var(--dur-instant) var(--ease-out) }
.ps-eval-matrix .em-cell:active { transform: scale(0.92) }
.ps-eval-matrix .em-cell:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px }
.ps-eval-matrix .em-mark { display: grid; place-items: center; width: 13px; height: 13px; background: var(--suite); color: transparent; font-size: 12px; line-height: 1;
  transition: opacity var(--dur-pare) var(--ease-out), transform var(--dur-pare) var(--ease-out) }
.ps-eval-matrix .em-cell[data-fail="1"] .em-mark { width: 18px; height: 18px; background: transparent; border: 1px solid var(--danger); color: var(--danger); font-weight: 500 }
.ps-eval-matrix .em-cell:hover .em-mark { outline: 1px solid var(--ink); outline-offset: 2px }
.ps-eval-matrix .em-cell[data-fail="1"]:hover .em-mark { outline-color: var(--danger); outline-offset: 1px }
.ps-eval-matrix .em-grid[data-filter="fail"] .em-cell[data-fail="0"] { opacity: 0.14 }
.ps-eval-matrix .em-grid[data-filter="fail"] .em-row[data-clean="1"] .em-suite { opacity: 0.36 }
.ps-eval-matrix .em-note { min-height: 20px; font-size: 12.5px; font-family: var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-eval-matrix .em-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 6px 10px 0; border-top: 1px solid var(--line) }
.ps-eval-matrix .em-filter[aria-checked="false"] { opacity: var(--unselected) }
.ps-eval-matrix .em-filter[aria-checked="false"]:hover:not(:disabled) { opacity: 0.85 }
.ps-eval-matrix .em-filter[aria-checked="true"] { color: var(--ink); font-weight: 500; opacity: 1 }
.ps-eval-matrix .em-filter[aria-checked="true"]:not(:hover)::before { opacity: 0 }
.ps-eval-matrix .em-rerun:disabled::before { opacity: 0 }
.ps-eval-matrix.is-tile .em { width: 100%; gap: 12px }
.ps-eval-matrix.is-tile .em-head { padding-bottom: 9px }
.ps-eval-matrix.is-tile .em-grid { gap: 6px }
.ps-eval-matrix.is-tile .em-suite { font-size: 13.5px }
.ps-eval-matrix.is-tile .em-cell { max-width: 24px }
.ps-eval-matrix.is-tile .em-mark { width: 12px; height: 12px }
.ps-eval-matrix.is-tile .em-cell[data-fail="1"] .em-mark { width: 17px; height: 17px; font-size: 11.5px }
.ps-eval-matrix.is-tile .em-note { display: none }
.ps-eval-matrix.is-tile .em-foot { padding-top: 6px }
.ps-eval-matrix.is-tile .em-foot .q { min-height: 30px; font-size: 13.5px }
@container (max-width: 270px) {
  .ps-eval-matrix .em-cols, .ps-eval-matrix .em-row { grid-template-columns: 52px repeat(8, minmax(0, 1fr)); gap: 2px }
  .ps-eval-matrix .em-mark { width: 10px; height: 10px }
  .ps-eval-matrix .em-cell[data-fail="1"] .em-mark { width: 15px; height: 15px; font-size: 10.5px }
}
`,
    mount(host, ctx) {
      const fails = new Set(INITIAL_FAILS);
      let filterFail = false;
      let running = false;
      let focusR = 0;
      let focusC = 3;
      let runTimers = [];

      host.innerHTML = `
<div class="em">
  <div class="em-head">
    <div class="em-lead">
      <span class="fig em-fig">30 of 32</span>
      <span class="em-verdict is-fail">2 failing</span>
    </div>
  </div>
  <div class="em-grid" role="grid" aria-label="Capability evaluation suites">
    <div class="em-cols" aria-hidden="true">
      <span class="em-col-spacer"></span>
      ${Array.from({ length: 8 }, (_, c) => `<span class="em-col" data-col="${c}">${c + 1}</span>`).join("")}
    </div>
    ${SUITES.map((s, r) => `
    <div class="em-row" role="row" data-r="${r}" style="--suite:${s.hue}">
      <span class="em-suite" role="rowheader"><i class="em-sw" aria-hidden="true"></i>${s.name}</span>
      ${s.checks.map((chk, c) => `<button type="button" class="em-cell" role="gridcell" data-r="${r}" data-c="${c}" data-fail="0" tabindex="-1"><span class="em-mark" aria-hidden="true"></span></button>`).join("")}
    </div>`).join("")}
  </div>
  <div class="em-note"></div>
  <div class="em-foot">
    <button type="button" class="q em-filter" role="switch" aria-checked="false">Failing only \u00b7 Off</button>
    <button type="button" class="q is-main em-rerun">Re-run</button>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const figEl = host.querySelector(".em-fig");
      const verdictEl = host.querySelector(".em-verdict");
      const gridEl = host.querySelector(".em-grid");
      const colsWrap = host.querySelector(".em-cols");
      const colEls = [...colsWrap.querySelectorAll(".em-col")];
      const rowEls = [...gridEl.querySelectorAll(".em-row")];
      const noteEl = host.querySelector(".em-note");
      const filterBtn = host.querySelector(".em-filter");
      const rerunBtn = host.querySelector(".em-rerun");
      const sr = host.querySelector("[aria-live]");
      const cells = SUITES.map((_, r) => [...rowEls[r].querySelectorAll(".em-cell")]);
      const colFrame = ctx.brackets(colsWrap, { padX: 2, padY: 1, size: 5, exactPad: true });

      function cellKey(r, c) { return r + ":" + c; }

      function paintCell(r, c) {
        const btn = cells[r][c];
        const mark = btn.firstElementChild;
        const fail = fails.has(cellKey(r, c));
        btn.dataset.fail = fail ? "1" : "0";
        mark.textContent = fail ? "\u00d7" : "";
        btn.setAttribute("aria-label", `${SUITES[r].name} ${c + 1}, ${SUITES[r].checks[c]}: ${fail ? "failing" : "passing"}`);
      }

      function syncRoving(focusDom) {
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 8; c++) {
            cells[r][c].tabIndex = r === focusR && c === focusC ? 0 : -1;
          }
        }
        if (focusDom) cells[focusR][focusC].focus({ preventScroll: true });
      }

      function defaultNote() {
        if (fails.size === 0) return "32 checks verified in 1.2 s \u00b7 0 regressions";
        const first = [...fails][0].split(":").map(Number);
        const s = SUITES[first[0]];
        return `${s.name} #${first[1] + 1} \u00b7 ${s.checks[first[1]]} \u2014 failed`;
      }

      function syncSummary(immediate, customNote) {
        const failCount = fails.size;
        const passCount = 32 - failCount;
        const figText = `${passCount} of 32`;
        const verdictText = failCount > 0 ? `${failCount} failing` : "All passing";
        verdictEl.classList.toggle("is-fail", failCount > 0);
        if (immediate) {
          figEl.textContent = figText;
          verdictEl.textContent = verdictText;
        } else {
          ctx.swapText(figEl, figText);
          ctx.swapText(verdictEl, verdictText);
        }
        for (let r = 0; r < 4; r++) {
          const rowHasFail = cells[r].some((_, c) => fails.has(cellKey(r, c)));
          rowEls[r].dataset.clean = rowHasFail ? "0" : "1";
        }
        if (customNote !== false) {
          const n = customNote || defaultNote();
          if (immediate) noteEl.textContent = n;
          else ctx.swapText(noteEl, n);
        }
      }

      function setFilter(on, immediate, byUser) {
        filterFail = on;
        filterBtn.setAttribute("aria-checked", on ? "true" : "false");
        const label = on ? "Failing only \u00b7 On" : "Failing only \u00b7 Off";
        if (immediate) filterBtn.textContent = label;
        else ctx.swapText(filterBtn, label);
        if (on) gridEl.dataset.filter = "fail";
        else delete gridEl.dataset.filter;
        if (byUser) sr.textContent = label + `. ${fails.size} failing of 32.`;
      }

      function clearRun() {
        runTimers.forEach(clearTimeout);
        runTimers = [];
        running = false;
        rerunBtn.disabled = false;
        colEls.forEach((el) => el.classList.remove("is-scan"));
        colFrame.pare();
      }

      function toggleCell(r, c, byUser) {
        if (running) return;
        const k = cellKey(r, c);
        if (fails.has(k)) fails.delete(k);
        else fails.add(k);
        paintCell(r, c);
        const nowFail = fails.has(k);
        const msg = `${SUITES[r].name} #${c + 1} \u00b7 ${SUITES[r].checks[c]} \u2014 ${nowFail ? "failed" : "passed"}`;
        syncSummary(false, msg);
        if (byUser) sr.textContent = msg;
      }

      function rerun(byUser, onDone) {
        if (running) return;
        running = true;
        rerunBtn.disabled = true;
        const schedule = byUser ? ctx.after : ctx.demoAfter;
        const stepMs = 135;

        const stepCol = (c) => {
          if (c >= 8) {
            colEls.forEach((el) => el.classList.remove("is-scan"));
            colFrame.pare();
            running = false;
            rerunBtn.disabled = false;
            if (filterFail) setFilter(false, false, false);
            syncSummary(false, "32 checks verified in 1.2 s \u00b7 0 regressions");
            if (byUser) sr.textContent = "Re-run complete. 32 of 32 passing.";
            if (onDone) onDone();
            return;
          }
          colEls.forEach((el, idx) => el.classList.toggle("is-scan", idx === c));
          colFrame.moveTo(colEls[c], { immediate: c === 0 });
          let healed = false;
          for (let r = 0; r < 4; r++) {
            const k = cellKey(r, c);
            if (fails.has(k)) {
              fails.delete(k);
              paintCell(r, c);
              healed = true;
            }
          }
          if (healed) syncSummary(false, `Fixed column ${c + 1} \u00b7 ${32 - fails.size} of 32 passing`);
          else if (c === 0) ctx.swapText(noteEl, "Running 32 checks across 4 suites\u2026");
          const t = schedule(stepMs, () => stepCol(c + 1));
          if (t) runTimers.push(t);
        };
        stepCol(0);
      }

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 8; c++) {
          paintCell(r, c);
          const btn = cells[r][c];
          btn.addEventListener("pointerenter", () => {
            if (running) return;
            const fail = fails.has(cellKey(r, c));
            noteEl.textContent = `${SUITES[r].name} #${c + 1} \u00b7 ${SUITES[r].checks[c]} \u2014 ${fail ? "failed" : "passed"}`;
          }, { signal: ctx.signal });
          btn.addEventListener("click", () => {
            focusR = r; focusC = c;
            syncRoving(false);
            toggleCell(r, c, true);
          }, { signal: ctx.signal });
        }
      }
      gridEl.addEventListener("pointerleave", () => {
        if (!running) noteEl.textContent = defaultNote();
      }, { signal: ctx.signal });

      gridEl.addEventListener("keydown", (e) => {
        let nr = focusR, nc = focusC;
        if (e.key === "ArrowRight") nc = (nc + 1) % 8;
        else if (e.key === "ArrowLeft") nc = (nc + 7) % 8;
        else if (e.key === "ArrowDown") nr = (nr + 1) % 4;
        else if (e.key === "ArrowUp") nr = (nr + 3) % 4;
        else if (e.key === "Home") nc = 0;
        else if (e.key === "End") nc = 7;
        else return;
        e.preventDefault();
        focusR = nr; focusC = nc;
        syncRoving(true);
        const fail = fails.has(cellKey(nr, nc));
        noteEl.textContent = `${SUITES[nr].name} #${nc + 1} \u00b7 ${SUITES[nr].checks[nc]} \u2014 ${fail ? "failed" : "passed"}`;
      }, { signal: ctx.signal });

      filterBtn.addEventListener("click", () => setFilter(!filterFail, false, true), { signal: ctx.signal });
      rerunBtn.addEventListener("click", () => rerun(true), { signal: ctx.signal });

      ctx.onHand(() => {
        if (running) clearRun();
      });

      syncRoving(false);
      syncSummary(true);

      function cycle() {
        ctx.demoAfter(2000, () => {
          setFilter(true, false, false);
          ctx.demoAfter(2100, () => {
            rerun(false, () => {
              ctx.demoAfter(2600, () => {
                fails.clear();
                INITIAL_FAILS.forEach((k) => fails.add(k));
                for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++) paintCell(r, c);
                syncSummary(false);
                cycle();
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* event-inbox.js */
/* Agent Inbox, redesigned in Plain (Subtraction): background run events sit as clean open rows parted by 1px hairlines;
   dismissing pares each row away and surviving rows glide upward via FLIP until only one quiet empty line remains. */
(function () {
  const INITIAL = [
    { title: "PR #184 ready", detail: "+14 −4, all checks green" },
    { title: "Billing agent paused", detail: "Needs schema OK" },
    { title: "Docs sync done", detail: "6 pages updated" },
  ];

  const EXTRA_POOL = [
    { title: "Test runner green", detail: "42 passed in 1.1 s" },
    { title: "Auth audit finished", detail: "0 leaked secrets" },
    { title: "Branch rebased", detail: "agent/session-ttl onto main" },
  ];

  PlainPlayer.register({
    slug: "event-inbox",
    title: "Agent Inbox",
    tagline: "Background run events; dismissing pares each away.",
    css: `
.ps-event-inbox .ei { width: min(100%, 420px); display: grid; gap: 6px }
.ps-event-inbox .ei-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--line) }
.ps-event-inbox .ei-title { margin: 0; font: 500 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em; white-space: nowrap }
.ps-event-inbox .ei-actions { display: inline-flex; align-items: center; gap: 22px; padding: 0 10px }
.ps-event-inbox .ei-list { display: grid }
.ps-event-inbox .ei-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--line) }
.ps-event-inbox .ei-copy { display: grid; gap: 2px; min-width: 0 }
.ps-event-inbox .ei-copy b { font-size: 14px; font-weight: 500; line-height: 1.3; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-event-inbox .ei-copy span { font-size: 13px; line-height: 1.35; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-event-inbox .ei-dismiss { min-height: 28px; margin-right: 10px; font-size: 13px }
.ps-event-inbox .ei-more-wrap { padding: 4px 0 0 10px }
.ps-event-inbox .ei-more { min-height: 28px; font-size: 13px }
.ps-event-inbox .ei-empty { padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted) }
.ps-event-inbox.is-tile .ei { width: 100%; gap: 4px }
.ps-event-inbox.is-tile .ei-head { padding-bottom: 7px }
.ps-event-inbox.is-tile .ei-actions { padding-right: 10px }
.ps-event-inbox.is-tile .ei-actions .q { min-height: 28px }
.ps-event-inbox.is-tile .ei-clear { display: none }
`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="ei">
  <div class="ei-head">
    <h3 class="ei-title">Agent events</h3>
    <div class="ei-actions">
      <button type="button" class="q is-main ei-queue">Queue</button>
      <button type="button" class="q ei-clear">Clear</button>
    </div>
  </div>
  <div class="ei-list" role="region" aria-label="Agent events"></div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const queueBtn = host.querySelector(".ei-queue");
      const clearBtn = host.querySelector(".ei-clear");
      const listEl = host.querySelector(".ei-list");
      const sr = host.querySelector("[aria-live]");

      const maxVisible = ctx.tile ? 2 : 3;
      const baseItems = ctx.tile ? INITIAL.slice(0, 2) : INITIAL;
      let seq = 0;
      let poolIdx = 0;
      let expanded = false;
      let clearing = false;
      let items = baseItems.map((x) => ({ id: ++seq, title: x.title, detail: x.detail }));
      const rowNodes = new Map();

      const emptyNode = document.createElement("div");
      emptyNode.className = "ei-empty";
      emptyNode.textContent = "Inbox clear";

      const moreWrap = document.createElement("div");
      moreWrap.className = "ei-more-wrap";
      const moreBtn = document.createElement("button");
      moreBtn.type = "button";
      moreBtn.className = "q ei-more";
      moreWrap.appendChild(moreBtn);

      moreBtn.addEventListener("click", () => {
        if (clearing) return;
        expanded = !expanded;
        ctx.flip(listEl, () => renderRows());
      }, { signal: ctx.signal });

      function getRowNode(item) {
        let el = rowNodes.get(item.id);
        if (el) return el;
        el = document.createElement("div");
        el.className = "ei-row";
        el.dataset.id = String(item.id);
        el.innerHTML = `<div class="ei-copy"><b></b><span></span></div><button type="button" class="q ei-dismiss">Dismiss</button>`;
        el.querySelector("b").textContent = item.title;
        el.querySelector("span").textContent = item.detail;
        const btn = el.querySelector(".ei-dismiss");
        btn.setAttribute("aria-label", "Dismiss " + item.title);
        btn.addEventListener("click", () => dismissOne(item.id, true), { signal: ctx.signal });
        rowNodes.set(item.id, el);
        return el;
      }

      function syncHeader() {
        clearBtn.disabled = items.length === 0 || clearing;
      }

      function renderRows(newItemId) {
        if (items.length === 0) {
          expanded = false;
          listEl.replaceChildren(emptyNode);
          return;
        }
        const limit = expanded ? items.length : Math.min(maxVisible, items.length);
        const visible = items.slice(0, limit);
        const desired = visible.map(getRowNode);
        if (!ctx.tile && items.length > maxVisible) {
          const hiddenCount = items.length - maxVisible;
          moreBtn.textContent = expanded ? `Show latest ${maxVisible}` : `+${hiddenCount} older`;
          desired.push(moreWrap);
        }
        if (emptyNode.parentElement === listEl) emptyNode.remove();
        for (const child of [...listEl.children]) {
          if (!desired.includes(child)) child.remove();
        }
        desired.forEach((node, idx) => {
          if (listEl.children[idx] !== node) {
            listEl.insertBefore(node, listEl.children[idx] || null);
          }
          if (newItemId && node.dataset && Number(node.dataset.id) === newItemId && !ctx.reduced() && node.animate) {
            node.animate(
              [{ opacity: 0, transform: "translateX(-6px)" }, { opacity: 1, transform: "translateX(0)" }],
              { duration: 160, easing: PlainPlayer.EASE_OUT }
            );
          }
        });
      }

      function dismissOne(id, byUser) {
        if (clearing) return;
        const idx = items.findIndex((x) => x.id === id);
        if (idx < 0) return;
        const removed = items[idx];
        const el = rowNodes.get(id);
        items.splice(idx, 1);
        rowNodes.delete(id);
        syncHeader();
        ctx.pareOut(el, () => {
          if (el) el.remove();
          if (clearing) return;
          renderRows();
          if (byUser) {
            sr.textContent = items.length === 0
              ? `Dismissed ${removed.title}. Inbox clear.`
              : `Dismissed ${removed.title}. ${items.length} remaining.`;
            const nextBtn = listEl.querySelector(".ei-dismiss") || queueBtn;
            if (nextBtn) nextBtn.focus({ preventScroll: true });
          }
        });
      }

      function queueNext(byUser) {
        if (clearing) return;
        const src = EXTRA_POOL[poolIdx++ % EXTRA_POOL.length];
        const item = { id: ++seq, title: src.title, detail: src.detail };
        items.unshift(item);
        syncHeader();
        ctx.flip(listEl, () => renderRows(item.id));
        if (byUser) sr.textContent = `Queued ${item.title}. ${items.length} events.`;
      }

      function clearAll(byUser) {
        if (items.length === 0 || clearing) return;
        clearing = true;
        const rows = [...listEl.querySelectorAll(".ei-row")];
        items = [];
        rowNodes.clear();
        syncHeader();

        const finish = () => {
          clearing = false;
          if (ctx.signal.aborted) return;
          syncHeader();
          ctx.flip(listEl, () => renderRows());
          if (byUser) {
            sr.textContent = "Inbox clear";
            queueBtn.focus({ preventScroll: true });
          }
        };

        if (!rows.length || ctx.reduced() || !rows[0].animate) {
          finish();
          return;
        }
        let done = 0;
        rows.forEach((r) => {
          r.style.pointerEvents = "none";
          const a = r.animate(
            [{ opacity: 1, transform: "translateX(0)" }, { opacity: 0, transform: "translateX(-6px)" }],
            { duration: 140, easing: PlainPlayer.EASE_OUT, fill: "forwards" }
          );
          a.onfinish = () => {
            if (++done === rows.length) finish();
          };
        });
      }

      function restoreInitial() {
        items = baseItems.map((x) => ({ id: ++seq, title: x.title, detail: x.detail }));
        rowNodes.clear();
        expanded = false;
        syncHeader();
        ctx.flip(listEl, () => renderRows());
      }

      queueBtn.addEventListener("click", () => queueNext(true), { signal: ctx.signal });
      clearBtn.addEventListener("click", () => clearAll(true), { signal: ctx.signal });

      syncHeader();
      renderRows();

      function cycle() {
        ctx.demoAfter(1900, () => {
          if (items[0]) dismissOne(items[0].id, false);
          ctx.demoAfter(1900, () => {
            queueNext(false);
            ctx.demoAfter(1900, () => {
              clearAll(false);
              ctx.demoAfter(2200, () => {
                restoreInitial();
                cycle();
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* file-changes.js */
/* File Changes, redesigned in Plain (Subtraction): three changed files reviewed one at a time. The active pending file
   shows a two-line diff hunk inside four living corner hairlines; keeping or undoing pares the hunk away into a single
   receipt word and glides the frame onto the next file. */
(function () {
  const FILES = [
    {
      path: "src/auth/verify.ts",
      stat: "+1 −1",
      lines: [
        { kind: "del", text: "- if (!token) return guest();" },
        { kind: "add", text: "+ if (!token || expired) return reject();" },
      ],
    },
    {
      path: "src/auth/session.ts",
      stat: "+1 −1",
      lines: [
        { kind: "del", text: "- return user ?? guest();" },
        { kind: "add", text: "+ return user ?? clearCookie(res);" },
      ],
    },
    {
      path: "tests/verify.test.ts",
      stat: "+2 −0",
      lines: [
        { kind: "add", text: '+ it("rejects expired token", () => {' },
        { kind: "add", text: "+   expect(verify(stale)).toBe(reject());" },
      ],
    },
  ];

  PlainPlayer.register({

      const titleEl = host.querySelector(".fc-title");
      const keepRestBtn = host.querySelector(".fc-keep-rest");

          if (busy || decisions[idx] === null) return;
          reopen(idx);
        }, { signal: ctx.signal });
        return el;
      });

      const frame = ctx.brackets(listEl, { padX: 0, padY: -1, exactPad: true });

      function buildDetail(idx) {
        const wrap = document.createElement("div");
        wrap.className = "fc-detail";
        const linesHtml = FILES[idx].lines
          .map((l) => `<div class="fc-line${l.kind === "add" ? " is-add" : l.kind === "del" ? " is-del" : ""}"></div>`)
          .join("");
        wrap.innerHTML = `
  <div class="fc-hunk">${linesHtml}</div>
  <div class="fc-acts" role="group" aria-label="Review ${FILES[idx].path}">

        const lineNodes = wrap.querySelectorAll(".fc-line");
        FILES[idx].lines.forEach((l, i) => { lineNodes[i].textContent = l.text; });
        for (const btn of wrap.querySelectorAll("[data-act]")) {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            decide(idx, btn.dataset.act, true);
          }, { signal: ctx.signal });
        }
        return wrap;
      }

      function syncHeader(immediate) {
        const pending = decisions.filter((d) => d === null).length;
        const decided = FILES.length - pending;
        const nextTitle = pending === 0 ? "All 3 reviewed" : pending === 3 ? "3 files changed" : `${pending} ${pending === 1 ? "file" : "files"} left`;
        if (immediate) titleEl.textContent = nextTitle;
        else ctx.swapText(titleEl, nextTitle);
        keepRestBtn.hidden = pending === 0;
        resetBtn.hidden = decided === 0;
      }

      function syncFrame(immediate) {
        if (activeIdx >= 0 && activeIdx < FILES.length) {
          listEl.setAttribute("data-focusing", "");
          itemEls.forEach((el, i) => {
            if (i === activeIdx) el.setAttribute("data-active", "");
            else el.removeAttribute("data-active");
          });
          frame.moveTo(itemEls[activeIdx], { immediate });
          if (!immediate) {
            ctx.after(225, () => {
              if (activeIdx >= 0) frame.moveTo(itemEls[activeIdx]);
            });
          }
        } else {
          listEl.removeAttribute("data-focusing");
          itemEls.forEach((el) => el.removeAttribute("data-active"));
          frame.pare();
        }
      }

      function mountInitial() {
        decisions = [null, null, null];
        activeIdx = 0;
        itemEls.forEach((el, i) => {
          el.removeAttribute("data-decided");
          const v = el.querySelector(".fc-verdict");
          v.hidden = true;
          v.textContent = "";
          v.classList.remove("is-undo");
          const old = el.querySelector(".fc-detail");
          if (old) old.remove();
          if (i === 0) el.appendChild(buildDetail(0));
        });
        syncHeader(true);
        syncFrame(true);
      }

      function decide(idx, kind, byUser) {
        if (busy || decisions[idx] !== null || activeIdx !== idx) return;
        busy = true;
        decisions[idx] = kind;
        const nextIdx = decisions.findIndex((d) => d === null);
        activeIdx = nextIdx;
        const detail = itemEls[idx].querySelector(".fc-detail");
        const verdictWord = kind === "undo" ? "Undone" : "Kept";

        ctx.pareOut(detail, () => {
          ctx.flip(listEl, () => {
            if (detail) detail.remove();
            itemEls[idx].setAttribute("data-decided", kind);
            const v = itemEls[idx].querySelector(".fc-verdict");
            v.textContent = verdictWord;
            v.classList.toggle("is-undo", kind === "undo");
            v.hidden = false;

            if (nextIdx >= 0) {
              itemEls[nextIdx].appendChild(buildDetail(nextIdx));
            }
            syncHeader(false);
            syncFrame(false);
          });
          busy = false;
          if (byUser) {
            sr.textContent = `${FILES[idx].path} ${verdictWord.toLowerCase()}. ` + (nextIdx >= 0 ? `Next: ${FILES[nextIdx].path}.` : "All 3 files reviewed.");
            if (nextIdx >= 0) {
              const nextKeep = itemEls[nextIdx].querySelector('[data-act="keep"]');
              if (nextKeep) nextKeep.focus({ preventScroll: true });
            } else {
              resetBtn.focus({ preventScroll: true });
            }
          }
        });
      }

      function keepRest(byUser) {
        if (busy) return;
        const cur = activeIdx >= 0 ? itemEls[activeIdx].querySelector(".fc-detail") : null;

        const finishAll = () => {
          ctx.flip(listEl, () => {
            decisions = decisions.map((d) => d || "keep");
            activeIdx = -1;
            itemEls.forEach((el, i) => {
              const det = el.querySelector(".fc-detail");
              if (det) det.remove();
              el.setAttribute("data-decided", decisions[i]);
              const v = el.querySelector(".fc-verdict");
              v.textContent = decisions[i] === "undo" ? "Undone" : "Kept";
              v.classList.toggle("is-undo", decisions[i] === "undo");
              v.hidden = false;
            });
            syncHeader(false);
            syncFrame(false);
          });
          busy = false;
          if (byUser) {
            sr.textContent = "Kept remaining files. All 3 reviewed.";
            resetBtn.focus({ preventScroll: true });
          }
        };
        if (cur) ctx.pareOut(cur, finishAll);
        else finishAll();
      }

      function reopen(idx) {
        ctx.flip(listEl, () => {
          if (activeIdx >= 0) {
            const prevDet = itemEls[activeIdx].querySelector(".fc-detail");
            if (prevDet) prevDet.remove();
          }
          decisions[idx] = null;
          activeIdx = idx;
          itemEls[idx].removeAttribute("data-decided");
          const v = itemEls[idx].querySelector(".fc-verdict");
          v.hidden = true;
          itemEls[idx].appendChild(buildDetail(idx));
          syncHeader(false);
          syncFrame(false);
        });
        const keepBtn = itemEls[idx].querySelector('[data-act="keep"]');
        if (keepBtn) keepBtn.focus({ preventScroll: true });
      }

      function resetAll(byUser) {
        if (busy) return;
        ctx.flip(listEl, () => {
          mountInitial();
        });
        if (byUser) {
          sr.textContent = "Reset all 3 file changes.";
          const keepBtn = itemEls[0].querySelector('[data-act="keep"]');
          if (keepBtn) keepBtn.focus({ preventScroll: true });
        }
      }

      keepRestBtn.addEventListener("click", () => keepRest(true), { signal: ctx.signal });
      resetBtn.addEventListener("click", () => resetAll(true), { signal: ctx.signal });

      mountInitial();

      function cycle() {
        ctx.demoAfter(2000, () => {
          decide(0, "keep", false);
          ctx.demoAfter(1800, () => {
            decide(1, "keep", false);
            ctx.demoAfter(1800, () => {
              decide(2, "keep", false);
              ctx.demoAfter(2600, () => {
                resetAll(false);
                cycle();
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* handoff-command.js */
/* Session Handoff, redesigned in Plain (Subtraction): switch between Resume CLI and Checkout branch; pressing Copy
   swaps Copy -> Copied inside clean corner hairlines and steps surrounding chrome back so the command stands alone. */
(function () {
  const MODES = [
    {
      key: "cli",
      label: "Resume CLI",
      cmd: "claude --resume run_9f4c2a",
      note: "Replays 41k tok context in your local terminal",
    },
    {
      key: "git",
      label: "Checkout branch",
      cmd: "git switch -c agent/session-ttl origin/agent/session-ttl",
      note: "Fetches PR #184 branch with 2 staged edits",
    },
  ];
  let uid = 0;

  function writeClip(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    } catch (e) {}
  }

  PlainPlayer.register({
    slug: "handoff-command",
    title: "Session Handoff",
    tagline: "Copy the resume command to take over locally.",
    css: `
.ps-handoff-command .hc { width: min(100%, 420px); display: grid; gap: 14px }
.ps-handoff-command .hc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line) }
.ps-handoff-command .hc-tabs { display: flex; align-items: baseline; gap: 20px }
.ps-handoff-command .hc-tab { all: unset; box-sizing: border-box; position: relative; padding: 0 0 10px; margin-bottom: -1px;
  font: 400 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em; color: var(--ink); opacity: var(--unselected); border-bottom: 2px solid transparent;
  white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: opacity var(--dur-pare) var(--ease-out), border-color var(--dur-instant) var(--ease-out) }
.ps-handoff-command .hc-tab:hover { opacity: 0.85 }
.ps-handoff-command .hc-tab[aria-selected="true"] { font-weight: 500; opacity: 1; border-bottom-color: var(--ink) }
.ps-handoff-command .hc-tab:focus-visible { opacity: 1; outline: 2px solid var(--focus); outline-offset: 3px }
.ps-handoff-command .hc-status { font-size: 13px; color: var(--muted); white-space: nowrap }
.ps-handoff-command .hc-box { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px;
  padding: 12px 10px 12px 0; border-bottom: 1px solid var(--line) }
.ps-handoff-command .hc-cmd { font-family: var(--mono); font-size: 12.5px; line-height: 1.45; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all }
.ps-handoff-command .hc-copy { min-height: 28px }
.ps-handoff-command .hc-note { margin: 0; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-handoff-command.is-tile .hc { width: 100%; gap: 12px }
.ps-handoff-command.is-tile .hc-tabs { gap: 18px }
@container (max-width: 295px) {
  .ps-handoff-command .hc-status { display: none }
}
`,
    mount(host, ctx) {
      const id = "ps-hc-" + ++uid;
      host.innerHTML = `
<div class="hc" data-focus-group>
  <div class="hc-head">
    <div class="hc-tabs" role="tablist" aria-label="Session handoff mode">
      ${MODES.map((m) => `<button type="button" class="hc-tab" role="tab" id="${id}-${m.key}" aria-selected="false" aria-controls="${id}-panel" tabindex="-1" data-mode="${m.key}">${m.label}</button>`).join("")}
    </div>
    <span class="hc-status">Paused</span>
  </div>
  <div class="hc-box" id="${id}-panel" role="tabpanel" data-active>
    <code class="hc-cmd"></code>
    <button type="button" class="q is-main hc-copy">Copy</button>
  </div>
  <p class="hc-note"></p>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const rootEl = host.querySelector(".hc");
      const tabsEl = host.querySelector(".hc-tabs");
      const tabs = [...tabsEl.querySelectorAll('[role="tab"]')];
      const panelEl = host.querySelector(".hc-box");
      const cmdEl = host.querySelector(".hc-cmd");
      const copyBtn = host.querySelector(".hc-copy");
      const noteEl = host.querySelector(".hc-note");
      const sr = host.querySelector("[aria-live]");

      let curIdx = 0;
      let copyTimer = 0;

      function resetCopyState(immediate) {
        clearTimeout(copyTimer);
        copyTimer = 0;
        rootEl.removeAttribute("data-focusing");
        if (copyBtn._pmSwap) {
          try { copyBtn._pmSwap.cancel(); } catch (e) {}
          copyBtn._pmSwap = null;
        }
        if (copyBtn.getAnimations) copyBtn.getAnimations().forEach((a) => a.cancel());
        if (immediate) copyBtn.textContent = "Copy";
        else ctx.swapText(copyBtn, "Copy");
      }

      function selectMode(idx, opts) {
        const o = Object.assign({ immediate: false, byUser: false, focusTab: false }, opts);
        curIdx = idx;
        const m = MODES[idx];
        resetCopyState(o.immediate);

        tabs.forEach((btn, i) => {
          const on = i === idx;
          btn.setAttribute("aria-selected", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
          if (on) {
            panelEl.setAttribute("aria-labelledby", btn.id);
            if (o.focusTab) btn.focus({ preventScroll: true });
          }
        });

        if (o.immediate) {
          cmdEl.textContent = m.cmd;
          noteEl.textContent = m.note;
        } else {
          ctx.swapText(cmdEl, m.cmd);
          ctx.swapText(noteEl, m.note);
        }

        if (o.byUser) sr.textContent = `${m.label}: ${m.cmd}`;
      }

      function triggerCopy(byUser, fromDemo) {
        clearTimeout(copyTimer);
        const m = MODES[curIdx];
        if (byUser) writeClip(m.cmd);
        rootEl.setAttribute("data-focusing", "");
        ctx.swapText(copyBtn, "Copied");
        if (byUser) sr.textContent = `Copied ${m.cmd}`;

        const restore = () => resetCopyState(false);
        copyTimer = fromDemo ? ctx.demoAfter(1600, restore) : ctx.after(1600, restore);
      }

      tabs.forEach((btn, i) => {
        btn.addEventListener("click", () => selectMode(i, { byUser: true }), { signal: ctx.signal });
      });

      tabsEl.addEventListener("keydown", (e) => {
        let next = -1;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (curIdx + 1) % MODES.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (curIdx - 1 + MODES.length) % MODES.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = MODES.length - 1;
        if (next >= 0) {
          e.preventDefault();
          selectMode(next, { byUser: true, focusTab: true });
        }
      }, { signal: ctx.signal });

      copyBtn.addEventListener("click", () => triggerCopy(true, false), { signal: ctx.signal });

      selectMode(0, { immediate: true });

      function cycle() {
        ctx.demoAfter(1800, () => {
          triggerCopy(false, true);
          ctx.demoAfter(2300, () => {
            selectMode(1);
            ctx.demoAfter(1800, () => {
              triggerCopy(false, true);
              ctx.demoAfter(2300, () => {
                selectMode(0);
                cycle();
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>

      let justRedacted = false;

      function exposedCount() {
        return SECRETS.filter((s) => !redacted[s.key]).length;
      }

      function syncUI(immediate) {
        const exp = exposedCount();
        const allClean = exp === 0;
        boxEl.classList.toggle("is-redacted", allClean);

        let stText;
        if (dispatched) {
          stText = "Sent · 0 exposed";
          statusEl.classList.remove("is-safe");
          statusEl.classList.add("is-sent");
        } else if (allClean) {
          stText = "0 exposed · Ready";
          statusEl.classList.add("is-safe");
          statusEl.classList.remove("is-sent");
        } else {
          stText = `${exp} ${exp === 1 ? "secret" : "secrets"} detected`;
          statusEl.classList.remove("is-safe", "is-sent");
        }

        const mainText = allClean ? "Send redacted" : `Redact ${exp} ${exp === 1 ? "secret" : "secrets"}`;

        mainBtn.hidden = dispatched;
        restoreBtn.hidden = exp === SECRETS.length && !dispatched;

        if (immediate) {
          statusEl.textContent = stText;
          mainBtn.textContent = mainText;
        } else {
          ctx.swapText(statusEl, stText);
          ctx.swapText(mainBtn, mainText);
        }
      }

      function setSecret(key, isRedacted, immediate) {
        if (redacted[key] === isRedacted) return;
        redacted[key] = isRedacted;
        const s = SECRETS.find((x) => x.key === key);
        const btn = valBtns[key];
        btn.setAttribute("aria-pressed", isRedacted ? "true" : "false");
        btn.setAttribute("aria-label", `${isRedacted ? "Restore" : "Redact"} ${s.label}`);
        const nextVal = isRedacted ? s.mask : s.raw;
        if (immediate) btn.textContent = nextVal;
        else ctx.swapText(btn, nextVal);
      }

      function redactAll(byUser) {
        dispatched = false;
        justRedacted = true;
        ctx.after(220, () => { justRedacted = false; });
        for (const s of SECRETS) setSecret(s.key, true, false);
        syncUI(false);
        if (byUser) {
          sr.textContent = "Redacted 3 secrets. 0 exposed, ready to send.";
          mainBtn.focus({ preventScroll: true });
        }
      }

      function restoreAll(byUser) {
        dispatched = false;
        justRedacted = false;
        for (const s of SECRETS) setSecret(s.key, false, false);
        syncUI(false);
        if (byUser) {
          sr.textContent = "Restored 3 raw values. 3 secrets detected.";
          mainBtn.focus({ preventScroll: true });
        }
      }

      function sendRedacted(byUser) {
        if (justRedacted) return;
        dispatched = true;
        syncUI(false);
        if (byUser) {
          sr.textContent = "Sent redacted context with 0 secrets exposed.";
          restoreBtn.focus({ preventScroll: true });
        }
      }

      for (const s of SECRETS) {
        valBtns[s.key].addEventListener("click", () => {
          if (dispatched) dispatched = false;
          const next = !redacted[s.key];
          setSecret(s.key, next, false);
          syncUI(false);
          sr.textContent = `${s.label} ${next ? "redacted" : "restored"}.`;
        }, { signal: ctx.signal });
      }

      mainBtn.addEventListener("click", () => {
        if (exposedCount() > 0) redactAll(true);
        else sendRedacted(true);
      }, { signal: ctx.signal });

      restoreBtn.addEventListener("click", () => restoreAll(true), { signal: ctx.signal });

      syncUI(true);

      function cycle() {
        ctx.demoAfter(2000, () => {
          redactAll(false);
          ctx.demoAfter(2600, () => {
            restoreAll(false);
            cycle();
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* rate-meter.js */
/* Token Throughput, redesigned in Plain (Subtraction): live input and output tok/s meters driven solely by translateX
   inside 1px tracks. Clicking Throttle clamps runaway output bursts to 120 tok/s, sliding --p down and clearing the
   rate-limit warning into one calm capped figure. */
(function () {
  const MAX_TOK = 4000;
  const STATES = {
    normal: { inTok: 1220, outTok: 620, cost: "$0.04 / min" },
    burst: { inTok: 1140, outTok: 2680, cost: "$0.14 / min" },
  };
  const CAP_OUT = 120;

  PlainPlayer.register({
    slug: "rate-meter",
    title: "Token Throughput",
    tagline: "Input and output tok/s meters; throttle under cap.",
    css: `
.ps-rate-meter .rm { width: min(100%, 400px); display: grid; gap: 14px }
.ps-rate-meter .rm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line) }
.ps-rate-meter .rm-head h3 { margin: 0; font: 500 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em }
.ps-rate-meter .rm-acts { display: flex; align-items: center; gap: 24px; padding-right: 10px }
.ps-rate-meter .rm-acts .q { min-height: 30px }
.ps-rate-meter .rm-burst[aria-pressed="false"] { opacity: var(--unselected) }
.ps-rate-meter .rm-burst[aria-pressed="false"]:hover:not(:disabled) { opacity: 0.85 }
.ps-rate-meter .rm-burst[aria-pressed="true"] { color: var(--ink); font-weight: 500; opacity: 1; text-decoration: underline; text-underline-offset: 4px }
.ps-rate-meter .rm-burst[aria-pressed="true"]:not(:hover)::before { opacity: 0 }
.ps-rate-meter .rm-hero { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px }
.ps-rate-meter .rm-lead { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 10px }
.ps-rate-meter .rm-verdict { font-size: 13.5px; color: var(--muted); transition: color var(--dur-instant) var(--ease-out) }
.ps-rate-meter .rm-verdict.is-warn { color: var(--danger); font-weight: 500 }
.ps-rate-meter .rm-cost { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap }
.ps-rate-meter .rm-meters { display: grid; gap: 14px }
.ps-rate-meter .rm-row { display: grid; gap: 6px }
.ps-rate-meter .rm-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 14px; line-height: 1.35 }
.ps-rate-meter .rm-name { font-weight: 500 }
.ps-rate-meter .rm-val { color: var(--muted); font-variant-numeric: tabular-nums }
.ps-rate-meter .rm-row.is-warn .bar-fill { background: var(--danger) }
.ps-rate-meter .rm-row.is-warn .rm-val { color: var(--danger); font-weight: 500 }
.ps-rate-meter .bar-fill { transition: transform var(--dur-settle) var(--ease-settle), background-color var(--dur-instant) var(--ease-out) }
.ps-rate-meter .rm-scale { position: relative; height: 16px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; user-select: none }
.ps-rate-meter .rm-scale span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap }
.ps-rate-meter .rm-scale .s0 { left: 0; transform: none }
.ps-rate-meter .rm-scale .s1 { left: 25% }
.ps-rate-meter .rm-scale .s2 { left: 50% }
.ps-rate-meter .rm-scale .s4 { right: 0; left: auto; transform: none }
.ps-rate-meter.is-tile .rm { width: 100%; gap: 14px }
.ps-rate-meter.is-tile .rm-burst { display: none }
`,
    mount(host, ctx) {
      let throttled = false;
      let bursting = false;
      let jitter = 0;

      host.innerHTML = `
<div class="rm">
  <div class="rm-head">
    <h3>Stream telemetry</h3>
    <div class="rm-acts">
      <button type="button" class="q rm-burst" aria-pressed="false">Burst</button>
      <button type="button" class="q is-main rm-throttle" aria-pressed="false">Throttle</button>
    </div>
  </div>
  <div class="rm-hero">
    <div class="rm-lead">
      <span class="fig rm-fig">1,840 tok/s</span>
      <span class="rm-verdict">Within cap</span>
    </div>
    <span class="rm-cost">$0.04 / min</span>
  </div>
  <div class="rm-meters">
    <div class="rm-row rm-in-row">
      <div class="rm-row-top"><span class="rm-name" id="rm-in-lbl">Input</span><span class="rm-val rm-in-val">1,220 tok/s</span></div>
      <div class="bar-track rm-in-meter" role="meter" aria-labelledby="rm-in-lbl" aria-valuemin="0" aria-valuemax="4000" aria-valuenow="1220" aria-valuetext="1,220 tokens per second"><div class="bar-fill rm-in-fill"></div></div>
    </div>
    <div class="rm-row rm-out-row">
      <div class="rm-row-top"><span class="rm-name" id="rm-out-lbl">Output</span><span class="rm-val rm-out-val">620 tok/s</span></div>
      <div class="bar-track rm-out-meter" role="meter" aria-labelledby="rm-out-lbl" aria-valuemin="0" aria-valuemax="4000" aria-valuenow="620" aria-valuetext="620 tokens per second"><div class="bar-fill rm-out-fill"></div></div>
    </div>
  </div>
  <div class="rm-scale" aria-hidden="true">
    <span class="s0">0</span>
    <span class="s1">1k</span>
    <span class="s2">2k</span>
    <span class="s4">4k tok/s</span>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const uid = Math.random().toString(36).slice(2, 7);
      const inLbl = host.querySelector("#rm-in-lbl");
      const outLbl = host.querySelector("#rm-out-lbl");
      inLbl.id = "rm-in-" + uid;
      outLbl.id = "rm-out-" + uid;

      const figEl = host.querySelector(".rm-fig");
      const verdictEl = host.querySelector(".rm-verdict");
      const costEl = host.querySelector(".rm-cost");
      const inValEl = host.querySelector(".rm-in-val");
      const outValEl = host.querySelector(".rm-out-val");
      const outRow = host.querySelector(".rm-out-row");
      const inMeter = host.querySelector(".rm-in-meter");
      const outMeter = host.querySelector(".rm-out-meter");
      inMeter.setAttribute("aria-labelledby", inLbl.id);
      outMeter.setAttribute("aria-labelledby", outLbl.id);
      const inFill = host.querySelector(".rm-in-fill");
      const outFill = host.querySelector(".rm-out-fill");
      const burstBtn = host.querySelector(".rm-burst");
      const throttleBtn = host.querySelector(".rm-throttle");
      const sr = host.querySelector("[aria-live]");

      const fmt = (n) => Math.round(n).toLocaleString("en-US");

      function compute() {
        const base = bursting ? STATES.burst : STATES.normal;
        const inTok = throttled ? (bursting ? 1140 : 640) : Math.max(80, base.inTok + jitter);
        const outTok = throttled ? CAP_OUT : Math.max(60, base.outTok - Math.round(jitter * 0.5));
        const total = inTok + outTok;
        const warn = !throttled && total >= 3200;
        const verdict = throttled
          ? `Capped \u00b7 ${CAP_OUT} tok/s`
          : warn
            ? "Near rate limit"
            : "Within cap";
        const cost = throttled
          ? (bursting ? "$0.02 / min" : "$0.01 / min")
          : base.cost;
        return { inTok, outTok, total, warn, verdict, cost };
      }

      function render(opts) {
        const o = Object.assign({ immediate: false, swapVerdict: false }, opts);
        const s = compute();
        const totalText = `${fmt(s.total)} tok/s`;
        const inText = `${fmt(s.inTok)} tok/s`;
        const outText = `${fmt(s.outTok)} tok/s`;

        figEl.textContent = totalText;
        inValEl.textContent = inText;
        outValEl.textContent = outText;

        verdictEl.classList.toggle("is-warn", s.warn);
        outRow.classList.toggle("is-warn", s.warn);

        if (o.immediate || !o.swapVerdict) {
          verdictEl.textContent = s.verdict;
          costEl.textContent = s.cost;
        } else {
          ctx.swapText(verdictEl, s.verdict);
          ctx.swapText(costEl, s.cost);
        }

        inMeter.setAttribute("aria-valuenow", String(s.inTok));
        inMeter.setAttribute("aria-valuetext", `${fmt(s.inTok)} tokens per second`);
        outMeter.setAttribute("aria-valuenow", String(s.outTok));
        outMeter.setAttribute("aria-valuetext", `${fmt(s.outTok)} tokens per second${throttled ? ", capped" : ""}`);

        inFill.style.setProperty("--p", Math.min(1, s.inTok / MAX_TOK).toFixed(4));
        outFill.style.setProperty("--p", Math.min(1, s.outTok / MAX_TOK).toFixed(4));

        throttleBtn.setAttribute("aria-pressed", throttled ? "true" : "false");
        const tLabel = throttled ? "Uncap" : "Throttle";
        if (o.immediate) throttleBtn.textContent = tLabel;
        else ctx.swapText(throttleBtn, tLabel);

        burstBtn.setAttribute("aria-pressed", bursting ? "true" : "false");
        return s;
      }

      throttleBtn.addEventListener("click", () => {
        throttled = !throttled;
        jitter = 0;
        const s = render({ swapVerdict: true });
        sr.textContent = throttled
          ? `Throttled. Output capped at ${CAP_OUT} tokens per second. Total ${fmt(s.total)} tokens per second.`
          : `Uncapped. ${s.verdict}, ${fmt(s.total)} tokens per second.`;
      }, { signal: ctx.signal });

      burstBtn.addEventListener("click", () => {
        bursting = !bursting;
        jitter = 0;
        const s = render({ swapVerdict: true });
        sr.textContent = bursting
          ? `Stream burst active. ${s.verdict}, ${fmt(s.total)} tokens per second.`
          : `Stream returned to normal. ${s.verdict}, ${fmt(s.total)} tokens per second.`;
      }, { signal: ctx.signal });

      render({ immediate: true });

      function cycle() {
        ctx.demoAfter(2000, () => {
          bursting = true;
          render({ swapVerdict: true });
          ctx.demoAfter(2100, () => {
            throttled = true;
            render({ swapVerdict: true });
            ctx.demoAfter(2500, () => {
              throttled = false;
              bursting = false;
              render({ swapVerdict: true });
              cycle();
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* run-list.js */
/* Parallel Runs, redesigned in Plain (Subtraction): four concurrent agent runs in a roving-tabindex list with one
   gliding 4-corner frame. Archiving finished runs pares them off the page so only agents that need you remain. */
(function () {
  const RUNS = [
    { id: "auth", num: "01", title: "Fix flaky auth spec", meta: "Needs your OK", done: false, urgent: true },
    { id: "billing", num: "02", title: "Migrate billing types", meta: "Step 4 of 6", done: false, urgent: false },
    { id: "docs", num: "03", title: "Sync API reference", meta: "Done", done: true, urgent: false },
    { id: "vite", num: "04", title: "Upgrade Vite to v6", meta: "Done", done: true, urgent: false },
  ];

  PlainPlayer.register({
    slug: "run-list",
    title: "Parallel Runs",
    tagline: "Archive finished runs so only active agents remain.",
    css: `
.ps-run-list .rl { width: min(100%, 440px); display: grid }
.ps-run-list .rl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line) }
.ps-run-list .rl-head h3 { margin: 0; font: 500 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em }
.ps-run-list .rl-count { font-weight: 400; color: var(--muted) }
.ps-run-list .rl-bulk { min-height: 26px; margin-right: 10px; font-size: 13px }
.ps-run-list .rl-list { position: relative; display: grid }
.ps-run-list .rl-item { border-bottom: 1px solid var(--line); transition: opacity var(--dur-pare) var(--ease-out) }
.ps-run-list .rl-item.is-done:not([data-active]) { opacity: 0.48 }
.ps-run-list .rl-list[data-focusing] > .rl-item:not([data-active]) { opacity: 0.38 }
.ps-run-list .rl-row { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto;
  align-items: baseline; gap: 10px; padding: 10px 10px; cursor: pointer; font-size: 14px; line-height: 1.4; -webkit-tap-highlight-color: transparent }
.ps-run-list .rl-row:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.ps-run-list .rl-num { font-size: 12.5px; color: var(--muted) }
.ps-run-list .rl-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-run-list .rl-item.is-done .rl-title { font-weight: 400 }
.ps-run-list .rl-meta { font-size: 13px; color: var(--muted); white-space: nowrap }
.ps-run-list .rl-item.is-urgent .rl-meta { color: var(--ink); font-weight: 500 }
.ps-run-list .rl-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 10px 0; font-size: 13px; line-height: 1.4 }
.ps-run-list.is-tile .rl { width: 100% }
.ps-run-list.is-tile .rl-head { padding-bottom: 7px }
.ps-run-list.is-tile .rl-row { grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; padding: 9px 8px }
.ps-run-list.is-tile .rl-foot { padding: 8px 8px 0 }
@container (max-width: 280px) {
  .ps-run-list .rl-row { grid-template-columns: 20px minmax(0, 1fr); row-gap: 2px }
  .ps-run-list .rl-meta { grid-column: 2; font-size: 12.5px }
  .ps-run-list.is-tile .rl-row { padding: 6px 6px }
}
`,
    mount(host, ctx) {
      const pool = ctx.tile ? RUNS.slice(0, 3) : RUNS;
      host.innerHTML = `
<div class="rl">
  <div class="rl-head">
    <h3>Agents · <span class="rl-count">${pool.length} runs</span></h3>
    <button type="button" class="q is-ink rl-bulk">Archive done</button>
  </div>
  <div class="rl-list" role="list" data-focus-group>
    ${pool.map((r, i) => `
      <div class="rl-item${r.done ? " is-done" : ""}${r.urgent ? " is-urgent" : ""}" role="listitem" data-id="${r.id}">
        <button type="button" class="rl-row" tabindex="${i === 0 ? "0" : "-1"}" data-id="${r.id}">
          <span class="rl-num">${r.num}</span>
          <span class="rl-title">${r.title}</span>
          <span class="rl-meta">${r.meta}</span>
        </button>
      </div>`).join("")}
  </div>
  <div class="rl-foot" hidden>
    <span class="rl-note muted"></span>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const countEl = host.querySelector(".rl-count");
      const bulkBtn = host.querySelector(".rl-bulk");
      const listEl = host.querySelector(".rl-list");
      const footEl = host.querySelector(".rl-foot");
      const noteEl = host.querySelector(".rl-note");
      const sr = host.querySelector("[aria-live]");

      const itemsById = new Map(pool.map((r) => [r.id, listEl.querySelector(`.rl-item[data-id="${r.id}"]`)]));
      const archived = new Set();
      const doneIds = pool.filter((r) => r.done).map((r) => r.id);
      const totalDone = doneIds.length;
      const frame = ctx.brackets(listEl, { padX: 0, padY: -2, exactPad: true });
      let activeId = pool[0].id;
      let busy = false;

      function visibleItems() {
        return pool.filter((r) => !archived.has(r.id)).map((r) => itemsById.get(r.id));
      }

      function setActive(id, opts) {
        const o = opts || {};
        if (archived.has(id)) id = pool.find((r) => !archived.has(r.id)).id;
        activeId = id;
        for (const r of pool) {
          const item = itemsById.get(r.id);
          const btn = item.querySelector(".rl-row");
          const on = r.id === activeId && !archived.has(r.id);
          btn.tabIndex = on ? 0 : -1;
          if (on) item.setAttribute("data-active", "");
          else item.removeAttribute("data-active");
        }
        const targetEl = itemsById.get(activeId);
        frame.moveTo(targetEl, { immediate: !!o.immediate });
        if (o.focus) targetEl.querySelector(".rl-row").focus({ preventScroll: true });
      }

      function syncHeader(immediate) {
        const visCount = pool.length - archived.size;
        const countText = `${visCount} ${visCount === 1 ? "run" : "runs"}`;
        const allDoneArchived = archived.size === totalDone;
        const bulkText = allDoneArchived ? "Restore done" : "Archive done";

        if (immediate) {
          countEl.textContent = countText;
          bulkBtn.textContent = bulkText;
        } else {
          ctx.swapText(countEl, countText);
          ctx.swapText(bulkBtn, bulkText);
        }

        if (archived.size > 0) {
          footEl.hidden = false;
          const noteText = `${archived.size} finished ${archived.size === 1 ? "run" : "runs"} archived`;
          if (immediate) noteEl.textContent = noteText;
          else ctx.swapText(noteEl, noteText);
        } else {
          footEl.hidden = true;
        }
      }

      function archiveIds(ids, byUser) {
        const targets = ids.filter((id) => itemsById.has(id) && !archived.has(id));
        if (!targets.length || busy) return;
        const els = targets.map((id) => itemsById.get(id));
        for (const id of targets) archived.add(id);

        const finish = () => {
          busy = false;
          for (const el of els) {
            el.hidden = true;
            el.style.pointerEvents = "";
            if (el.getAnimations) el.getAnimations().forEach((a) => a.cancel());
          }
          listEl.removeAttribute("data-focusing");
          syncHeader(false);
          setActive(archived.has(activeId) ? pool[0].id : activeId, { immediate: true });
          if (byUser) {
            sr.textContent = `Archived ${targets.length} finished ${targets.length === 1 ? "run" : "runs"}. ${pool.length - archived.size} runs remaining.`;
            bulkBtn.focus({ preventScroll: true });
          }
        };

        if (ctx.reduced()) {
          ctx.flip(host.querySelector(".rl"), finish);
          return;
        }

        busy = true;
        frame.pare();
        for (const extra of els.slice(1)) {
          extra.style.pointerEvents = "none";
          if (extra.animate) {
            extra.animate([{ opacity: 1, transform: "translateX(0)" }, { opacity: 0, transform: "translateX(-6px)" }], {
              duration: 140,
              easing: PlainPlayer.EASE_OUT,
              fill: "forwards",
            });
          }
        }
        ctx.pareOut(els[0], () => {
          ctx.flip(host.querySelector(".rl"), finish);
          if (!ctx.reduced()) ctx.after(225, () => { if (!busy) setActive(activeId, { immediate: true }); });
        });
      }

      function restoreDone(byUser) {
        if (!archived.size || busy) return;
        const count = archived.size;
        archived.clear();
        ctx.flip(host.querySelector(".rl"), () => {
          for (const r of pool) {
            itemsById.get(r.id).hidden = false;
          }
          syncHeader(false);
          setActive(activeId, { immediate: true });
        });
        if (!ctx.reduced()) ctx.after(225, () => { if (!busy) setActive(activeId, { immediate: true }); });
        if (byUser) {
          sr.textContent = `Restored ${count} finished ${count === 1 ? "run" : "runs"}. ${pool.length} runs shown.`;
          bulkBtn.focus({ preventScroll: true });
        }
      }

      bulkBtn.addEventListener("click", () => {
        if (archived.size === totalDone) restoreDone(true);
        else archiveIds(doneIds, true);
      }, { signal: ctx.signal });

      for (const r of pool) {
        const item = itemsById.get(r.id);
        const rowBtn = item.querySelector(".rl-row");
        rowBtn.addEventListener("click", () => {
          setActive(r.id, { focus: true });
          listEl.setAttribute("data-focusing", "");
          sr.textContent = `${r.title}, ${r.meta}`;
        }, { signal: ctx.signal });
        item.addEventListener("pointerenter", () => {
          if (busy || archived.has(r.id)) return;
          setActive(r.id);
          listEl.setAttribute("data-focusing", "");
        }, { signal: ctx.signal });
      }

      listEl.addEventListener("pointerleave", () => {
        if (!listEl.contains(document.activeElement)) listEl.removeAttribute("data-focusing");
      }, { signal: ctx.signal });
      listEl.addEventListener("focusin", (e) => {
        const item = e.target.closest(".rl-item");
        if (item && !archived.has(item.dataset.id)) {
          setActive(item.dataset.id);
          listEl.setAttribute("data-focusing", "");
        }
      }, { signal: ctx.signal });
      listEl.addEventListener("focusout", (e) => {
        if (!listEl.contains(e.relatedTarget)) listEl.removeAttribute("data-focusing");
      }, { signal: ctx.signal });

      listEl.addEventListener("keydown", (e) => {
        if (!e.target.classList.contains("rl-row")) return;
        const vis = visibleItems();
        const idx = vis.findIndex((el) => el.dataset.id === activeId);
        let next = -1;
        if (e.key === "ArrowDown") next = (idx + 1) % vis.length;
        else if (e.key === "ArrowUp") next = (idx - 1 + vis.length) % vis.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = vis.length - 1;
        if (next >= 0) {
          e.preventDefault();
          setActive(vis[next].dataset.id, { focus: true });
        }
      }, { signal: ctx.signal });

      syncHeader(true);
      setActive(pool[0].id, { immediate: true });

      function cycle() {
        ctx.demoAfter(1700, () => {
          setActive("billing");
          listEl.setAttribute("data-focusing", "");
          ctx.demoAfter(1200, () => {
            listEl.removeAttribute("data-focusing");
            setActive("auth");
            ctx.demoAfter(1100, () => {
              archiveIds(doneIds, false);
              ctx.demoAfter(2600, () => {
                restoreDone(false);
                cycle();
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* run-telemetry.js */
/* Run Telemetry, redesigned in Plain (Subtraction): workspace agent metrics in a 2x2 hairline grid over Today, 7 days,
   and 30 days. Pointing at or focusing one metric frames that cell in four corner hairlines while the other three step
   back to 0.36 opacity; leaving returns all four to crisp rest. */
(function () {
  const PERIODS = [
    {
      key: "today",
      label: "Today",
      cells: [
        { label: "Runs merged", fig: "9", delta: "+2 vs prior" },
        { label: "Diffs kept", fig: "94 %", delta: "64 of 68" },
        { label: "Median turn", fig: "3.9 s", delta: "\u22120.5 s" },

      label: "7 days",
      cells: [
        { label: "Runs merged", fig: "48", delta: "+6 vs prior" },
        { label: "Diffs kept", fig: "91 %", delta: "312 of 342" },
        { label: "Median turn", fig: "4.2 s", delta: "\u22120.8 s" },
        { label: "Agent spend", fig: "$6.80", delta: "$0.14 / run" },
      ],
    },
    {
      key: "30d",
      label: "30 days",
      cells: [
        { label: "Runs merged", fig: "196", delta: "+28 vs prior" },
        { label: "Diffs kept", fig: "89 %", delta: "1,284 of 1,442" },
        { label: "Median turn", fig: "4.5 s", delta: "\u22121.1 s" },
        { label: "Agent spend", fig: "$29.40", delta: "$0.15 / run" },
      ],
    },

  PlainPlayer.register({
    slug: "run-telemetry",
    title: "Run Telemetry",
    tagline: "Point at one metric and the other three step back.",
    css: `
.ps-run-telemetry .rt { width: min(100%, 400px); display: grid; gap: 12px }

.ps-run-telemetry .rt-head h3 { margin: 0; font: 500 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em }
.ps-run-telemetry .rt-periods { position: relative; display: inline-flex; align-items: center; gap: 20px; padding: 2px 9px; margin-left: auto }
.ps-run-telemetry .rt-periods .q { min-height: 24px }
.ps-run-telemetry .rt-grid { position: relative; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: transparent }
.ps-run-telemetry .rt-grid > .pm-frame:not(.is-shown) { display: none }
.ps-run-telemetry .rt-cell { padding: 12px 12px 12px 6px; display: grid; cursor: default; -webkit-tap-highlight-color: transparent }
.ps-run-telemetry .rt-cell:nth-child(odd) { border-right: 1px solid var(--line) }
.ps-run-telemetry .rt-cell:nth-child(even) { padding: 12px 6px 12px 14px }
.ps-run-telemetry .rt-cell:nth-child(-n+2) { border-bottom: 1px solid var(--line) }
.ps-run-telemetry .rt-body { display: grid; gap: 4px; min-width: 0 }
.ps-run-telemetry .rt-cell:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px }
.ps-run-telemetry .rt-name { margin: 0; font-size: 13.5px; font-weight: 400; line-height: 1.3; color: var(--muted) }

.ps-run-telemetry.is-tile .rt { width: 100%; gap: 10px }
.ps-run-telemetry.is-tile .rt-cell { padding: 10px 10px 10px 6px }
.ps-run-telemetry.is-tile .rt-cell:nth-child(even) { padding: 10px 6px 10px 12px }

@container (max-width: 280px) {
  .ps-run-telemetry .rt-cell, .ps-run-telemetry.is-tile .rt-cell { padding: 8px 8px 8px 6px }
  .ps-run-telemetry .rt-cell:nth-child(even), .ps-run-telemetry.is-tile .rt-cell:nth-child(even) { padding: 8px 6px 8px 10px }
  .ps-run-telemetry .rt-periods { gap: 18px }
}
`,
    mount(host, ctx) {
      let periodIdx = 1;
      let activeCell = -1;
      let rovingIdx = 0;

      host.innerHTML = `
<div class="rt">
  <div class="rt-head">
    <h3>Agent runs</h3>
    <div class="rt-periods" role="radiogroup" aria-label="Telemetry period">
      ${PERIODS.map((p, i) => `<button type="button" class="q in-frame" role="radio" data-idx="${i}" aria-checked="${i === 1 ? "true" : "false"}" tabindex="${i === 1 ? "0" : "-1"}">${p.label}</button>`).join("")}
    </div>
  </div>
  <dl class="rt-grid" data-focus-group>
    ${PERIODS[1].cells.map((c, i) => `
    <div class="rt-cell" data-cell="${i}" tabindex="${i === 0 ? "0" : "-1"}">
      <div class="rt-body">
        <dt class="rt-name">${c.label}</dt>
        <dd class="fig rt-fig">${c.fig}</dd>
        <dd class="rt-delta">${c.delta}</dd>
      </div>
    </div>`).join("")}
  </dl>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const periodsEl = host.querySelector(".rt-periods");
      const periodBtns = [...periodsEl.querySelectorAll('[role="radio"]')];
      const gridEl = host.querySelector(".rt-grid");
      const cellEls = [...gridEl.querySelectorAll(".rt-cell")];
      const bodyEls = cellEls.map((c) => c.querySelector(".rt-body"));
      const sr = host.querySelector("[aria-live]");

      const periodFrame = ctx.brackets(periodsEl, { padX: 9, padY: 2, exactPad: true });
      const gridFrame = ctx.brackets(gridEl, { padX: 6, padY: 4, exactPad: true });

      function setPeriod(idx, immediate, byUser) {
        periodIdx = idx;
        const p = PERIODS[idx];
        periodBtns.forEach((btn, i) => {
          const on = i === idx;
          btn.setAttribute("aria-checked", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
          if (on) periodFrame.moveTo(btn, { immediate });
        });
        cellEls.forEach((cell, i) => {
          const figEl = cell.querySelector(".rt-fig");
          const deltaEl = cell.querySelector(".rt-delta");
          if (immediate) {
            figEl.textContent = p.cells[i].fig;
            deltaEl.textContent = p.cells[i].delta;
          } else {
            ctx.swapText(figEl, p.cells[i].fig);
            ctx.swapText(deltaEl, p.cells[i].delta);
          }
        });
        if (byUser) {
          sr.textContent = `${p.label}: ${p.cells.map((c) => `${c.label} ${c.fig}`).join(", ")}.`;
        }
      }

      function focusCell(idx, immediate) {
        activeCell = idx;
        rovingIdx = idx;
        gridEl.setAttribute("data-focusing", "");
        cellEls.forEach((cell, i) => {
          if (i === idx) cell.setAttribute("data-active", "");
          else cell.removeAttribute("data-active");
          cell.tabIndex = i === idx ? 0 : -1;
        });
        gridFrame.moveTo(bodyEls[idx], { immediate });
      }

      function clearFocus() {
        activeCell = -1;
        gridEl.removeAttribute("data-focusing");
        cellEls.forEach((cell, i) => {
          cell.removeAttribute("data-active");
          cell.tabIndex = i === rovingIdx ? 0 : -1;
        });
        gridFrame.pare();
      }

      periodBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => setPeriod(i, false, true), { signal: ctx.signal });
      });

      periodsEl.addEventListener("keydown", (e) => {
        let next = periodIdx;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (periodIdx + 1) % PERIODS.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (periodIdx + PERIODS.length - 1) % PERIODS.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = PERIODS.length - 1;
        else return;
        e.preventDefault();
        periodBtns[next].focus({ preventScroll: true });
        setPeriod(next, false, true);
      }, { signal: ctx.signal });

      cellEls.forEach((cell, i) => {
        cell.addEventListener("pointerenter", (e) => {
          if (e.pointerType === "touch") return;
          focusCell(i, false);
        }, { signal: ctx.signal });
        cell.addEventListener("click", () => {
          if (activeCell === i && !cell.matches(":focus-visible")) clearFocus();
          else focusCell(i, false);
        }, { signal: ctx.signal });
        cell.addEventListener("focus", () => {
          if (cell.matches(":focus-visible")) focusCell(i, false);
        }, { signal: ctx.signal });
      });

      gridEl.addEventListener("pointerleave", () => {
        if (!gridEl.contains(document.activeElement) || !document.activeElement.matches(":focus-visible")) {
          clearFocus();
        }
      }, { signal: ctx.signal });

      gridEl.addEventListener("focusout", (e) => {
        if (!gridEl.contains(e.relatedTarget)) clearFocus();
      }, { signal: ctx.signal });

      gridEl.addEventListener("keydown", (e) => {
        let next = rovingIdx;
        if (e.key === "ArrowRight") next = (rovingIdx + 1) % 4;
        else if (e.key === "ArrowLeft") next = (rovingIdx + 3) % 4;
        else if (e.key === "ArrowDown") next = (rovingIdx + 2) % 4;
        else if (e.key === "ArrowUp") next = (rovingIdx + 2) % 4;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = 3;
        else if (e.key === "Escape") { clearFocus(); return; }
        else return;
        e.preventDefault();
        cellEls[next].focus({ preventScroll: true });
        focusCell(next, false);
      }, { signal: ctx.signal });

      ctx.onHand(() => {
        if (activeCell >= 0 && !gridEl.matches(":hover") && !gridEl.contains(document.activeElement)) {
          clearFocus();
        }
      });

      setPeriod(1, true, false);

      function cycle() {
        ctx.demoAfter(1800, () => {
          focusCell(0, false);
          ctx.demoAfter(1750, () => {
            focusCell(2, false);
            ctx.demoAfter(1750, () => {
              clearFocus();
              ctx.demoAfter(1500, () => {
                setPeriod(2, false, false);
                ctx.demoAfter(2200, () => {
                  setPeriod(1, false, false);
                  cycle();
                });
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>

/* Sources & Citations, redesigned in Plain (Subtraction): an agent's answer divided into three cited claims above a
   numbered source list. Resting a hand or focus on [k] or row k steps uncited claims and rows back while four 1px
   corner hairlines glide onto the matching proof. */
(function () {
  const SOURCES = [
    {
      k: 1,

.ps-sources .sc-claim { transition: opacity var(--dur-pare) var(--ease-out) }
.ps-sources .sc-cite { display: inline; padding: 1px 2px; margin: 0 0 0 1px; border: 0; background: none; font: 500 12.5px/1 var(--mono);
  color: var(--ink); opacity: 0.45; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: opacity var(--dur-instant) var(--ease-out) }
.ps-sources .sc-cite:hover, .ps-sources .sc-cite[aria-pressed="true"], .ps-sources .sc-claim[data-active] .sc-cite { opacity: 1 }
.ps-sources .sc-list { position: relative; list-style: none; margin: 0; padding: 0; display: grid }
.ps-sources .sc-row:first-child { border-top: 1px solid var(--line) }
.ps-sources .sc-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: baseline; gap: 10px;

`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="sc">
  <div class="sc-head">
    <h3>Session fallback</h3>
    <span class="sc-meta">3 sources</span>
  </div>
  <p class="sc-prose" data-focus-group>
    <span class="sc-claim" data-k="1">Null users fall back to <span class="mono">guest()</span> <button type="button" class="sc-cite" data-k="1" aria-pressed="false" aria-label="Citation 1: src/auth/session.ts:92">[1]</button>. </span><span class="sc-claim" data-k="2">Expired tokens return <span class="mono">null</span> <button type="button" class="sc-cite" data-k="2" aria-pressed="false" aria-label="Citation 2: src/auth/verify.ts:44">[2]</button>, </span><span class="sc-claim" data-k="3">while cookies persist 7 days <button type="button" class="sc-cite" data-k="3" aria-pressed="false" aria-label="Citation 3: docs/auth-cookies.md">[3]</button>.</span>
  </p>
  <ol class="sc-list" data-focus-group>
    ${SOURCES.map((s) => `<li class="sc-row" data-k="${s.k}">
      <span class="sc-num">${s.k}</span>
      <a class="sc-link" href="${s.href}" target="_blank" rel="noreferrer">${s.title}</a>
      <span class="sc-note">${s.note}</span>
    </li>`).join("")}
  </ol>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const proseEl = host.querySelector(".sc-prose");
      const listEl = host.querySelector(".sc-list");
      const metaEl = host.querySelector(".sc-meta");
      const sr = host.querySelector("[aria-live]");
      const claimEls = [...proseEl.querySelectorAll(".sc-claim")];
      const citeBtns = [...proseEl.querySelectorAll(".sc-cite")];
      const rowEls = [...listEl.querySelectorAll(".sc-row")];
      const frame = ctx.brackets(listEl, { padX: 0, padY: -1, exactPad: true });

      let hoverK = 0;
      let focusK = 0;
      let pinK = 0;
      let demoK = 0;
      let paintedK = -1;

      function paint() {
        const k = hoverK || focusK || pinK || demoK;
        if (k === paintedK) return;
        paintedK = k;

        citeBtns.forEach((b) => b.setAttribute("aria-pressed", +b.dataset.k === pinK ? "true" : "false"));

        if (k > 0) {
          proseEl.setAttribute("data-focusing", "");
          listEl.setAttribute("data-focusing", "");
          claimEls.forEach((el) => {
            if (+el.dataset.k === k) el.setAttribute("data-active", "");
            else el.removeAttribute("data-active");
          });
          rowEls.forEach((el) => {
            if (+el.dataset.k === k) el.setAttribute("data-active", "");
            else el.removeAttribute("data-active");
          });
          const targetRow = rowEls.find((el) => +el.dataset.k === k);
          frame.moveTo(targetRow);
          ctx.swapText(metaEl, `Source ${k} of 3`);
        } else {
          proseEl.removeAttribute("data-focusing");
          listEl.removeAttribute("data-focusing");
          claimEls.forEach((el) => el.removeAttribute("data-active"));
          rowEls.forEach((el) => el.removeAttribute("data-active"));
          frame.pare();
          ctx.swapText(metaEl, "3 sources");
        }
      }

      for (const btn of citeBtns) {
        const k = +btn.dataset.k;
        btn.addEventListener("pointerenter", () => { hoverK = k; paint(); }, { signal: ctx.signal });
        btn.addEventListener("pointerleave", () => { if (hoverK === k) hoverK = 0; paint(); }, { signal: ctx.signal });
        btn.addEventListener("focus", () => { focusK = k; paint(); }, { signal: ctx.signal });
        btn.addEventListener("blur", () => { if (focusK === k) focusK = 0; paint(); }, { signal: ctx.signal });
        btn.addEventListener("click", () => {
          pinK = pinK === k ? 0 : k;
          citeBtns.forEach((b) => b.setAttribute("aria-pressed", +b.dataset.k === pinK ? "true" : "false"));
          paintedK = -1;
          paint();
          const src = SOURCES[k - 1];
          sr.textContent = pinK ? `Pinned citation ${k}: ${src.title}, ${src.note}.` : "Cleared pinned citation.";
        }, { signal: ctx.signal });
      }

      for (const row of rowEls) {
        const k = +row.dataset.k;
        row.addEventListener("pointerenter", () => { hoverK = k; paint(); }, { signal: ctx.signal });
        row.addEventListener("pointerleave", () => { if (hoverK === k) hoverK = 0; paint(); }, { signal: ctx.signal });
        row.addEventListener("focusin", () => { focusK = k; paint(); }, { signal: ctx.signal });
        row.addEventListener("focusout", (e) => {
          if (!row.contains(e.relatedTarget) && focusK === k) { focusK = 0; paint(); }
        }, { signal: ctx.signal });
      }

      host.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && pinK) {
          e.preventDefault();
          e.stopPropagation();
          pinK = 0;
          focusK = 0;
          paintedK = -1;
          paint();
          sr.textContent = "Cleared pinned citation.";
        }
      }, { signal: ctx.signal });

      ctx.onHand(() => {
        if (demoK) {
          demoK = 0;
          paint();
        }
      });

      paint();

      /* Calm demo loop: gently inspects 1 -> 2 -> clear. */
      function cycle() {
        ctx.demoAfter(1500, () => {
          demoK = 1; paint();
          ctx.demoAfter(1900, () => {
            demoK = 2; paint();
            ctx.demoAfter(1900, () => {
              demoK = 0; paint();
              ctx.demoAfter(1600, cycle);
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>

      <span class="mono">parseCookie</span> returns <span class="mono">null</span> once max-age lapses, so <span class="mono">session.ts:92</span> treats an expired cookie like a missing one. Throw an expiry error before the <span class="mono">guest()</span> branch to require sign-in.
