      const barEl = host.querySelector(".ai-bar");
      const phasesEl = host.querySelector(".ai-phases");
      const phaseBtns = [...phasesEl.querySelectorAll('[role="radio"]')];
      const summaryRow = host.querySelector(".ai-summary-row");
      const againBtn = host.querySelector(".ai-again");
      const sr = host.querySelector("[aria-live]");
      const phaseFrame = ctx.brackets(phasesEl, { padX: 9, padY: 2, exactPad: true });

      function clearSequence() {
        runTimers.forEach(clearTimeout);
        runTimers = [];
      }

      function swapStatusLine(verb, detail, immediate) {
        if (immediate || ctx.reduced() || !lineEl.animate) {
          verbEl.textContent = verb;
          detailEl.textContent = detail;
          return;
        }
        if (lineEl._pmSwap) { try { lineEl._pmSwap.cancel(); } catch (e) {} }
        const out = lineEl.animate([{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(-3px)" }], { duration: 85, easing: PlainPlayer.EASE_OUT });
        lineEl._pmSwap = out;
        out.onfinish = () => {
          if (ctx.signal.aborted) return;
          verbEl.textContent = verb;
          detailEl.textContent = detail;
          lineEl._pmSwap = lineEl.animate([{ opacity: 0, transform: "translateY(3px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 135, easing: PlainPlayer.EASE_OUT });
        };
      }

      function setPhase(idx, immediate, byUser) {
        curIdx = idx;
        const wasDone = completed;
        completed = false;
        if (wasDone) {
          summaryRow.hidden = true;
          if (barEl.getAnimations) barEl.getAnimations().forEach((a) => a.cancel());
          barEl.hidden = false;
          barEl.style.opacity = "";
          barEl.style.transform = "";
          barEl.style.pointerEvents = "";
          stateEl.classList.remove("is-done");
          ctx.swapText(stateEl, "Working");
        }
        const p = PHASES[idx];
        swapStatusLine(p.verb, p.detail, immediate);
        phaseBtns.forEach((btn, i) => {
          const active = i === idx;
          btn.dataset.done = i < idx ? "1" : "0";
          btn.setAttribute("aria-checked", active ? "true" : "false");
          btn.tabIndex = active ? 0 : -1;
        });
        phaseFrame.moveTo(phaseBtns[idx], { immediate: immediate || wasDone });
        if (byUser) sr.textContent = `Phase ${idx + 1} of 4, ${p.label}: ${p.verb}${p.detail}`;
      }

      function finishRun(byUser) {
        if (completed) return;
        completed = true;
        phaseFrame.pare();
        stateEl.classList.add("is-done");
        ctx.swapText(stateEl, "Done");
        swapStatusLine("Passed", " verify.ts \u00b7 3 rules", false);
        ctx.pareOut(barEl, () => {
          if (!completed) return;
          barEl.hidden = true;
          summaryRow.hidden = false;
          if (byUser) {
            sr.textContent = "Done. Reviewed 3 files, 0 issues found.";
            againBtn.focus({ preventScroll: true });
          }
        });
      }

      phaseBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => {
          clearSequence();
          setPhase(i, false, true);
        }, { signal: ctx.signal });
      });

      phasesEl.addEventListener("keydown", (e) => {
        let next = curIdx;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (curIdx + 1) % PHASES.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (curIdx + PHASES.length - 1) % PHASES.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = PHASES.length - 1;
        else return;
        e.preventDefault();
        clearSequence();
        phaseBtns[next].focus({ preventScroll: true });
        setPhase(next, false, true);
      }, { signal: ctx.signal });

      againBtn.addEventListener("click", () => {
        clearSequence();
        setPhase(0, false, true);
        phaseBtns[0].focus({ preventScroll: true });
        const step = (i) => {
          const t = ctx.after(950, () => {
            if (i < PHASES.length) {
              setPhase(i, false, false);
              step(i + 1);
            } else {
              finishRun(false);
              sr.textContent = "Review complete. Reviewed 3 files, 0 issues found.";
            }
          });
          runTimers.push(t);
        };
        step(1);
      }, { signal: ctx.signal });

      ctx.onHand(clearSequence);

      setPhase(3, true, false);

      function cycle() {
        ctx.demoAfter(2100, () => {
          finishRun(false);
          ctx.demoAfter(2600, () => {
            setPhase(0, false, false);
            ctx.demoAfter(1450, () => {
              setPhase(1, false, false);
              ctx.demoAfter(1450, () => {
                setPhase(2, false, false);
                ctx.demoAfter(1450, () => {
                  setPhase(3, false, false);
                  cycle();
                });
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* agent-loaders.js */
/* Determinate Work, redesigned in Plain (Subtraction): one repository indexing task read four spinner-free ways —
   Elapsed, Count, Bar, or tailing Log — framed by gliding corner hairlines. When 240/240 completes, the active
   scaffolding pares away into a single quiet receipt line. */
(function () {
  const TOTAL = 240;
  const START = 184;
  const MODES = [
    { key: "elapsed", label: "Elapsed" },
    { key: "count", label: "Count" },
    { key: "bar", label: "Bar" },
    { key: "log", label: "Log" },
  ];
  const PATHS = [
    "src/auth/session.ts",
    "src/auth/verify.ts",
    "src/router/dispatch.ts",
    "src/agent/planner.ts",
    "src/agent/sandbox.ts",
    "src/tools/diff-apply.ts",
    "src/tools/shell-guard.ts",
    "src/store/transcript.ts",
    "docs/architecture.md",
    "docs/permissions.md",
    "docs/telemetry.md",
    "docs/eval-suites.md",
  ];

  PlainPlayer.register({
    slug: "agent-loaders",
    title: "Determinate Work",
    tagline: "Elapsed, count, bar or log \u2014 zero spinners.",
    css: `
.ps-agent-loaders .al { width: min(100%, 400px); display: grid; gap: 16px }
.ps-agent-loaders .al-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line) }
.ps-agent-loaders .al-tabs { position: relative; display: inline-flex; align-items: center; gap: 22px; padding: 2px 9px }
.ps-agent-loaders .al-tabs .q { min-height: 24px }
.ps-agent-loaders .al-task { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-agent-loaders .al-task span { font-family: var(--mono); font-size: 12.5px }
.ps-agent-loaders .al-stage { min-height: 76px; display: grid; align-content: center }
.ps-agent-loaders .al-stage.is-done { min-height: 0 }
.ps-agent-loaders .al-view { display: grid; gap: 10px }
.ps-agent-loaders .al-pair { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px }
.ps-agent-loaders .al-sub { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums }
.ps-agent-loaders .al-log { border-left: 1px solid var(--line-control); padding: 2px 0 2px 12px; display: grid; gap: 4px; overflow: hidden }
.ps-agent-loaders .al-line { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: baseline; gap: 8px;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.45; opacity: 0.42; transition: opacity var(--dur-pare) var(--ease-out) }
.ps-agent-loaders .al-line.is-cur { opacity: 1 }
.ps-agent-loaders .al-idx { color: var(--muted); font-variant-numeric: tabular-nums }
.ps-agent-loaders .al-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-agent-loaders .al-st { color: var(--muted); font-family: var(--font); font-size: 12.5px }
.ps-agent-loaders .al-line.is-cur .al-st { color: var(--ink); font-weight: 500 }
.ps-agent-loaders .al-receipt { font-size: 15px; font-weight: 500; padding: 8px 0; font-variant-numeric: tabular-nums }
.ps-agent-loaders .al-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 10px 0; border-top: 1px solid var(--line) }
.ps-agent-loaders .al-left-acts { display: flex; align-items: center; gap: 24px }
.ps-agent-loaders .al-foot .q { min-height: 30px }
.ps-agent-loaders.is-tile .al { width: 100%; gap: 16px }
.ps-agent-loaders.is-tile .al-stage { min-height: 70px }
@container (max-width: 260px) {
  .ps-agent-loaders .al-tabs { gap: 14px }
}
`,
    mount(host, ctx) {
      let mode = "elapsed";
      let done = START;
      let running = false;
      let runTimer = 0;
      let logSeq = START;

      host.innerHTML = `
<div class="al">
  <div class="al-top">
    <div class="al-tabs" role="radiogroup" aria-label="Progress readout mode">
      ${MODES.map((m, i) => `<button type="button" class="q in-frame" role="radio" data-mode="${m.key}" aria-checked="${i === 0 ? "true" : "false"}" tabindex="${i === 0 ? "0" : "-1"}">${m.label}</button>`).join("")}
    </div>
  </div>
  <div class="al-task">Indexing repository \u00b7 <span>src/ &amp; docs/</span></div>
  <div class="al-stage"></div>
  <div class="al-foot">
    <div class="al-left-acts">
      <button type="button" class="q is-ink al-run">Run</button>
      <button type="button" class="q al-step">Step</button>
    </div>
    <button type="button" class="q al-reset">Reset</button>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const tabsEl = host.querySelector(".al-tabs");
      const tabBtns = [...tabsEl.querySelectorAll('[role="radio"]')];
      const stageEl = host.querySelector(".al-stage");
      const runBtn = host.querySelector(".al-run");
      const stepBtn = host.querySelector(".al-step");
      const resetBtn = host.querySelector(".al-reset");
      const sr = host.querySelector("[aria-live]");
      const modeFrame = ctx.brackets(tabsEl, { padX: 9, padY: 2, exactPad: true });

      function statsFor(n) {
        const clamped = Math.max(0, Math.min(TOTAL, n));
        const elapsed = clamped <= START
          ? (clamped / START) * 11.4
          : 11.4 + (clamped - START) * 0.05;
        const rem = Math.max(0, 14.2 - elapsed);
        const pct = Math.round((clamped / TOTAL) * 100);
        const left = TOTAL - clamped;
        return {
          done: clamped,
          elapsed: elapsed.toFixed(1),
          rem: rem < 0.6 ? "<1 s remaining" : `~${Math.max(1, Math.round(rem))} s remaining`,
          pct,
          p: (clamped / TOTAL).toFixed(4),
          left,
        };
      }

      function pathAt(idx) {
        return PATHS[((idx % PATHS.length) + PATHS.length) % PATHS.length];
      }

      function logRowHTML(num, isCur) {
        const n = Math.max(1, Math.min(TOTAL, num));
        return `<div class="al-line${isCur ? " is-cur" : ""}" data-n="${n}"><span class="al-idx">${String(n).padStart(3, "0")}</span><span class="al-path">${pathAt(n)}</span><span class="al-st">${isCur ? "reading" : "indexed"}</span></div>`;
      }

      function buildActiveView() {
        const s = statsFor(done);
        stageEl.classList.remove("is-done");
        if (mode === "elapsed") {
          stageEl.innerHTML = `<div class="al-view" data-view="elapsed"><div class="al-pair"><span class="fig al-fig">${s.elapsed} s</span><span class="al-sub">${s.rem}</span></div></div>`;
        } else if (mode === "count") {
          stageEl.innerHTML = `<div class="al-view" data-view="count"><div class="al-pair"><span class="fig al-fig">${s.done} of ${TOTAL}</span><span class="al-sub">${s.left} files left</span></div></div>`;
        } else if (mode === "bar") {
          stageEl.innerHTML = `<div class="al-view" data-view="bar"><div class="al-pair"><span class="fig al-fig">${s.pct} %</span><span class="al-sub">${s.done} of ${TOTAL} files</span></div><div class="bar-track" role="progressbar" aria-label="Repository indexing progress" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="${s.done}" aria-valuetext="${s.pct} percent, ${s.done} of ${TOTAL} files"><div class="bar-fill" style="--p:${s.p}"></div></div></div>`;
        } else {
          const base = Math.max(3, s.done);
          stageEl.innerHTML = `<div class="al-view" data-view="log"><div class="al-log">${logRowHTML(base - 2, false)}${logRowHTML(base - 1, false)}${logRowHTML(base, true)}</div></div>`;
        }
      }

      function syncControls() {
        const finished = done >= TOTAL;
        runBtn.disabled = finished;
        runBtn.classList.toggle("is-ink", !finished);
        resetBtn.classList.toggle("is-ink", finished);
        stepBtn.disabled = finished || running;
        runBtn.textContent = running ? "Pause" : "Run";
      }

      function showReceipt(animate, byUser) {
        stopRun();
        syncControls();
        const current = stageEl.firstElementChild;
        const mountReceipt = () => {
          stageEl.classList.add("is-done");
          stageEl.innerHTML = `<div class="al-receipt">Indexed 240 files in 14.2 s \u00b7 0 skipped</div>`;
          if (byUser) sr.textContent = "Indexed 240 files in 14.2 seconds, 0 skipped.";
        };
        if (animate && current && !current.classList.contains("al-receipt")) {
          ctx.pareOut(current, mountReceipt);
        } else {
          mountReceipt();
        }
      }

      function updateView(prevDone, byUser) {
        syncControls();
        if (done >= TOTAL) {
          showReceipt(true, byUser);
          return;
        }
        const view = stageEl.querySelector(".al-view");
        if (!view || view.dataset.view !== mode) {
          buildActiveView();
          return;
        }
        const s = statsFor(done);
        if (mode === "elapsed") {
          view.querySelector(".al-fig").textContent = `${s.elapsed} s`;
          view.querySelector(".al-sub").textContent = s.rem;
        } else if (mode === "count") {
          view.querySelector(".al-fig").textContent = `${s.done} of ${TOTAL}`;
          view.querySelector(".al-sub").textContent = `${s.left} files left`;
        } else if (mode === "bar") {
          view.querySelector(".al-fig").textContent = `${s.pct} %`;
          view.querySelector(".al-sub").textContent = `${s.done} of ${TOTAL} files`;
          const pb = view.querySelector('[role="progressbar"]');
          pb.setAttribute("aria-valuenow", String(s.done));
          pb.setAttribute("aria-valuetext", `${s.pct} percent, ${s.done} of ${TOTAL} files`);
          view.querySelector(".bar-fill").style.setProperty("--p", s.p);
        } else if (mode === "log" && done !== prevDone) {
          const logBox = view.querySelector(".al-log");
          const first = logBox && logBox.querySelector(".al-line:not([data-paring])");
          const rowNum = (logSeq = s.done);
          if (first) {
            first.dataset.paring = "1";
            ctx.pareOut(first, () => {
              first.remove();
              for (const line of logBox.querySelectorAll(".al-line")) {
                line.classList.remove("is-cur");
                const st = line.querySelector(".al-st");
                if (st) st.textContent = "indexed";
              }
              const wrap = document.createElement("div");
              wrap.innerHTML = logRowHTML(rowNum, true);
              logBox.appendChild(wrap.firstElementChild);
            });
          }
        }
      }

      function setMode(nextMode, immediate, byUser) {
        mode = nextMode;
        for (const b of tabBtns) {
          const on = b.dataset.mode === mode;
          b.setAttribute("aria-checked", on ? "true" : "false");
          b.tabIndex = on ? 0 : -1;
          if (on) modeFrame.moveTo(b, { immediate });
        }
        if (done < TOTAL) buildActiveView();
        if (byUser) {
          const s = statsFor(done);
          sr.textContent = done >= TOTAL
            ? `${mode} view. Indexed 240 files in 14.2 seconds.`
            : `${mode} view, ${s.done} of ${TOTAL} files.`;
        }
      }

      function stopRun() {
        if (runTimer) { clearInterval(runTimer); runTimer = 0; }
        running = false;
      }

      function toggleRun(byUser) {
        if (done >= TOTAL) return;
        if (running) {
          stopRun();
          syncControls();
          if (byUser) sr.textContent = `Paused at ${done} of ${TOTAL} files.`;
          return;
        }
        running = true;
        syncControls();
        const stepSize = mode === "log" ? 8 : 7;
        runTimer = ctx.every(mode === "log" ? 260 : 120, () => {
          const prev = done;
          done = Math.min(TOTAL, done + stepSize);
          updateView(prev, byUser);
          if (done >= TOTAL) stopRun();
        });
      }

      for (const b of tabBtns) {
        b.addEventListener("click", () => setMode(b.dataset.mode, false, true), { signal: ctx.signal });
      }
      tabsEl.addEventListener("keydown", (e) => {
        const idx = tabBtns.findIndex((b) => b.dataset.mode === mode);
        let next = idx;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (idx + 1) % tabBtns.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (idx + tabBtns.length - 1) % tabBtns.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = tabBtns.length - 1;
        else return;
        e.preventDefault();
        tabBtns[next].focus({ preventScroll: true });
        setMode(tabBtns[next].dataset.mode, false, true);
      }, { signal: ctx.signal });

      stepBtn.addEventListener("click", () => {
        if (done >= TOTAL || running) return;
        const prev = done;
        done = Math.min(TOTAL, done + 14);
        updateView(prev, true);
        if (done < TOTAL) sr.textContent = `${done} of ${TOTAL} files indexed.`;
      }, { signal: ctx.signal });

      runBtn.addEventListener("click", () => toggleRun(true), { signal: ctx.signal });

      resetBtn.addEventListener("click", () => {
        stopRun();
        done = done === START ? 0 : START;
        ctx.flip( host.querySelector(".al"), () => {
          buildActiveView();
          syncControls();
        });
        sr.textContent = `Reset to ${done} of ${TOTAL} files.`;
      }, { signal: ctx.signal });

      setMode("elapsed", true, false);
      syncControls();

      function cycle() {
        ctx.demoAfter(1900, () => {
          setMode("count", false, false);
          const p1 = done; done = 198; updateView(p1, false);
          ctx.demoAfter(1900, () => {
            setMode("bar", false, false);
            const p2 = done; done = 216; updateView(p2, false);
            ctx.demoAfter(1900, () => {
              setMode("log", false, false);
              ctx.demoAfter(900, () => {
                const p3 = done; done = 232; updateView(p3, false);
                ctx.demoAfter(1100, () => {
                  const p4 = done; done = TOTAL; updateView(p4, false);
                  ctx.demoAfter(2500, () => {
                    done = START;
                    setMode("elapsed", false, false);
                    syncControls();
                    cycle();
                  });
                });
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* agent-plan.js */
/* Task Plan, redesigned in Plain (Subtraction): a three-branch agent plan where open sub-steps hang under a 1px left
   rule and one 4-corner frame tracks the running step. As branches complete, their sub-lists pare away into one quiet
   count so only unfinished work stays tall. */
(function () {
  const GROUPS = [
    {
      num: "1",
      title: "Inspect cookie parser",
      subs: ["Read src/auth/cookies.ts", "Audit session maxAge flags"],
    },
    {
      num: "2",
      title: "Enforce token TTL",
      subs: ["Reject expired JWTs", "Rotate refresh cookie"],
    },
    {
      num: "3",
      title: "Add integration tests",
      subs: ["Test 401 on stale cookie", "Run vitest src/auth/"],
    },
  ];
  const TOTAL = GROUPS.reduce((n, g) => n + g.subs.length, 0);

  PlainPlayer.register({
    slug: "agent-plan",
    title: "Task Plan",
    tagline: "Completed branches fold into one count.",
    css: `
.ps-agent-plan .ap { width: min(100%, 430px); display: grid; grid-template-columns: minmax(0, 1fr) }
.ps-agent-plan .ap-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-width: 0;
  padding-bottom: 10px; border-bottom: 1px solid var(--line) }
.ps-agent-plan .ap-head h3 { margin: 0; font: 500 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-agent-plan .ap-tally { font-size: 13px; color: var(--muted); white-space: nowrap }
.ps-agent-plan .ap-groups { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) }
.ps-agent-plan .ap-group { padding: 9px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px;
  transition: opacity var(--dur-pare) var(--ease-out) }
.ps-agent-plan .ap-group:not(.is-active) { opacity: 0.45 }
.ps-agent-plan .ap-ghead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0; font-size: 14px; line-height: 1.4 }
.ps-agent-plan .ap-gname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink) }
.ps-agent-plan .ap-group.is-active .ap-gname { font-weight: 500; color: var(--ink) }
.ps-agent-plan .ap-gcount { font-size: 13px; color: var(--muted); white-space: nowrap }
.ps-agent-plan .ap-sub { list-style: none; margin: 0 0 0 6px; padding: 0 0 0 14px; border-left: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px }
.ps-agent-plan .ap-step { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0; padding: 6px 8px; font-size: 14px; line-height: 1.4;
  transition: opacity var(--dur-pare) var(--ease-out) }
.ps-agent-plan .ap-step:not(.is-cur) { opacity: 0.42 }
.ps-agent-plan .ap-sname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink) }
.ps-agent-plan .ap-step.is-cur .ap-sname { color: var(--ink); font-weight: 500 }
.ps-agent-plan .ap-sstate { font-size: 13px; color: var(--muted); white-space: nowrap }
.ps-agent-plan .ap-step.is-cur .ap-sstate { color: var(--ink); font-weight: 500 }
.ps-agent-plan .ap-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 10px }
.ps-agent-plan .ap-adv, .ps-agent-plan .ap-reset { min-height: 26px; font-size: 13px }
.ps-agent-plan .ap-adv { margin-left: 10px }
.ps-agent-plan .ap-reset { margin-right: 10px }
.ps-agent-plan.is-tile .ap { width: 100% }
.ps-agent-plan.is-tile .ap-head { padding-bottom: 8px }
.ps-agent-plan.is-tile .ap-group { padding: 8px 0; gap: 4px }
.ps-agent-plan.is-tile .ap-ghead { font-size: 13.5px }
.ps-agent-plan.is-tile .ap-sub { margin-left: 5px; padding-left: 12px; gap: 1px }
.ps-agent-plan.is-tile .ap-step { padding: 5px 7px; font-size: 13.5px }
.ps-agent-plan.is-tile .ap-foot { padding-top: 8px }
`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="ap">
  <div class="ap-head">
    <h3>Auth hardening plan</h3>
    <span class="ap-tally">2 of 6 done</span>
  </div>
  <div class="ap-groups">
    ${GROUPS.map((g, gi) => {
      const base = gi * 2;
      return `
      <div class="ap-group" data-gi="${gi}">
        <div class="ap-ghead">
          <span class="ap-gname"></span>
          <span class="ap-gcount"></span>
        </div>
        <ul class="ap-sub">
          ${g.subs.map((s, si) => `<li class="ap-step" data-si="${base + si}"><span class="ap-sname">${s}</span><span class="ap-sstate"></span></li>`).join("")}
        </ul>
      </div>`;
    }).join("")}
  </div>
  <div class="ap-foot">
    <button type="button" class="q is-ink ap-adv">Advance step</button>
    <button type="button" class="q ap-reset">Reset</button>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const tallyEl = host.querySelector(".ap-tally");
      const groupsEl = host.querySelector(".ap-groups");
      const groupEls = [...groupsEl.querySelectorAll(".ap-group")];
      const stepEls = [...groupsEl.querySelectorAll(".ap-step")];
      const advBtn = host.querySelector(".ap-adv");
      const resetBtn = host.querySelector(".ap-reset");
      const sr = host.querySelector("[aria-live]");

      const frame = ctx.brackets(groupsEl, { padX: 0, padY: 0, exactPad: true });
      let doneCount = 2;
      let busy = false;

      function resyncFrameAfterFlip() {
        if (ctx.reduced()) return;
        ctx.after(225, () => {
          if (busy) return;
          const activeStepEl = doneCount < TOTAL ? stepEls[doneCount] : null;
          if (activeStepEl && activeStepEl.offsetParent !== null) frame.moveTo(activeStepEl, { immediate: true });
        });
      }

      function syncDOM(opts) {
        const o = opts || {};
        const tallyText = `${doneCount} of ${TOTAL} done`;
        if (o.immediate) tallyEl.textContent = tallyText;
        else ctx.swapText(tallyEl, tallyText);

        GROUPS.forEach((g, gi) => {
          const gEl = groupEls[gi];
          const gName = gEl.querySelector(".ap-gname");
          const gCount = gEl.querySelector(".ap-gcount");
          const subEl = gEl.querySelector(".ap-sub");
          const start = gi * 2;
          const subDone = Math.max(0, Math.min(g.subs.length, doneCount - start));
          const allGroupDone = subDone === g.subs.length;
          const isActiveGroup = doneCount >= start && doneCount < start + g.subs.length;
          const folded = !isActiveGroup;

          gEl.classList.toggle("is-done", allGroupDone);
          gEl.classList.toggle("is-active", isActiveGroup);

          if (folded) {
            gName.textContent = `${g.num}. ${g.title} · ${subDone} of ${g.subs.length} done`;
            gCount.textContent = "";
            subEl.hidden = true;
          } else {
            gName.textContent = `${g.num}. ${g.title}`;
            gCount.textContent = `${subDone} of ${g.subs.length} done`;
            subEl.hidden = false;
          }
          subEl.style.pointerEvents = "";
          if (subEl.getAnimations) subEl.getAnimations().forEach((a) => a.cancel());

          g.subs.forEach((_, si) => {
            const idx = start + si;
            const li = stepEls[idx];
            const st = li.querySelector(".ap-sstate");
            const isDone = idx < doneCount;
            const isCur = idx === doneCount;
            li.classList.toggle("is-done", isDone);
            li.classList.toggle("is-cur", isCur);
            st.textContent = isDone ? "Done" : isCur ? "Active" : "Queued";
          });
        });

        const allDone = doneCount >= TOTAL;
        advBtn.disabled = allDone;
        advBtn.classList.toggle("is-ink", !allDone);
        resetBtn.classList.toggle("is-ink", allDone);

        const activeStepEl = doneCount < TOTAL ? stepEls[doneCount] : null;
        if (activeStepEl && activeStepEl.offsetParent !== null) {
          frame.moveTo(activeStepEl, { immediate: !!o.immediate });
        } else {
          frame.pare();
        }
      }

      function advance(byUser) {
        if (busy || doneCount >= TOTAL) return;
        const prevStepIdx = doneCount;
        const gi = Math.floor(prevStepIdx / 2);
        const completesGroup = prevStepIdx % 2 === 1;
        doneCount += 1;

        if (completesGroup && !ctx.reduced()) {
          busy = true;
          const subEl = groupEls[gi].querySelector(".ap-sub");
          frame.pare();
          ctx.pareOut(subEl, () => {
            busy = false;
            ctx.flip(host.querySelector(".ap"), () => {
              syncDOM({ immediate: false });
            });
            resyncFrameAfterFlip();
            if (byUser) {
              sr.textContent = `Completed ${GROUPS[gi].title}, 2 of 2 done. ${doneCount} of ${TOTAL} done.`;
              if (doneCount >= TOTAL) resetBtn.focus({ preventScroll: true });
            }
          });
          return;
        }

        syncDOM({ immediate: false });
        if (byUser) {
          sr.textContent = `${doneCount} of ${TOTAL} steps done.`;
          if (doneCount >= TOTAL) resetBtn.focus({ preventScroll: true });
        }
      }

      function reset(byUser) {
        if (busy || doneCount === 2) return;
        doneCount = 2;
        ctx.flip(host.querySelector(".ap"), () => {
          syncDOM({ immediate: false });
        });
        resyncFrameAfterFlip();
        if (byUser) {
          sr.textContent = "Plan reset to 2 of 6 done.";
          advBtn.focus({ preventScroll: true });
        }
      }

      advBtn.addEventListener("click", () => advance(true), { signal: ctx.signal });
      resetBtn.addEventListener("click", () => reset(true), { signal: ctx.signal });

      syncDOM({ immediate: true });

      function cycle() {
        ctx.demoAfter(1800, () => {
          advance(false);
          ctx.demoAfter(1600, () => {
            advance(false);
            ctx.demoAfter(1800, () => {
              advance(false);
              ctx.demoAfter(1600, () => {
                advance(false);
                ctx.demoAfter(2400, () => {
                  reset(false);
                  cycle();
                });
              });
            });
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* agent-run.js */
/* Agent Run, redesigned in Plain (Subtraction): four numbered tool steps run under a gliding 4-corner frame while
   uninvolved steps step back; once step 04 passes, the steps fold into a single receipt line above the report. */
(function () {
  const STEPS = [
    { num: "01", verb: "Read", target: "src/auth/session.ts", done: "148 lines", live: "Reading…" },
    { num: "02", verb: "Search", target: "guest() callers", done: "3 files", live: "Scanning…" },
    { num: "03", verb: "Edit", target: "src/auth/verify.ts", done: "+8 −3", live: "+8 −3" },
    { num: "04", verb: "Test", target: "auth/verify.test.ts", done: "14 passed", live: "Running…" },
  ];

  let uid = 0;

  PlainPlayer.register({
    slug: "agent-run",
    title: "Agent Run",
    tagline: "Four tool steps that fold once tests pass.",
    css: `
.ps-agent-run .ar { width: min(100%, 430px); display: grid }
.ps-agent-run .ar-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line) }
.ps-agent-run .ar-head h3 { margin: 0; font: 500 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em }
.ps-agent-run .ar-status { font-size: var(--t-meta); color: var(--ink); font-weight: 500; white-space: nowrap }
.ps-agent-run .ar-status.is-done { color: var(--muted); font-weight: 400 }
.ps-agent-run .ar-body { display: grid; gap: 12px }
.ps-agent-run .ar-summary { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding-top: 14px }
.ps-agent-run .ar-receipt { font-size: var(--t-meta); color: var(--ink); font-weight: 500 }
.ps-agent-run .ar-acts { display: inline-flex; align-items: center; gap: 22px; padding-right: 10px; font-size: var(--t-meta) }
.ps-agent-run .ar-list { position: relative; list-style: none; margin: 0; padding: 0; display: grid }
.ps-agent-run .ar-summary:not([hidden]) ~ .ar-list .ar-row:first-child { border-top: 1px solid var(--line) }
.ps-agent-run .ar-row { display: grid; grid-template-columns: 24px 54px minmax(0, 1fr) auto; align-items: baseline; gap: 10px;
  padding: 9px 8px; border-bottom: 1px solid var(--line); font-size: 14px }
.ps-agent-run .ar-list[data-focusing] > .ar-row:not([data-active]) { opacity: 0.38 }
.ps-agent-run .ar-list:not([data-focusing]) > .ar-row { opacity: 0.65 }
.ps-agent-run .ar-num { font-size: 12.5px; color: var(--muted) }
.ps-agent-run .ar-verb { font-weight: 500 }
.ps-agent-run .ar-target { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-agent-run .ar-meta { font-size: var(--t-meta); color: var(--muted); white-space: nowrap }
.ps-agent-run .ar-row[data-active] .ar-meta { color: var(--ink); font-weight: 500 }
.ps-agent-run .ar-report { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink) }
.ps-agent-run .ar-report .mono { font-size: 12.5px }
.ps-agent-run.is-tile .ar { width: 100% }
.ps-agent-run.is-tile .ar-row { padding: 8px 6px; font-size: 13.5px; grid-template-columns: 22px 50px minmax(0, 1fr) auto; gap: 8px }
.ps-agent-run.is-tile .ar-meta { font-size: 12.5px }
.ps-agent-run.is-tile .ar-report { font-size: 13.5px; line-height: 1.5 }
`,
    mount(host, ctx) {
      const listId = "ps-ar-list-" + ++uid;
      host.innerHTML = `
<div class="ar">
  <div class="ar-head">
    <h3>Fix expired cookie fallback</h3>
    <span class="ar-status">Step 3 of 4</span>
  </div>
  <div class="ar-body">
    <div class="ar-summary" hidden>
      <span class="ar-receipt">4 steps · +8 −3 · 2.6 s</span>
      <span class="ar-acts">
        <button type="button" class="q ar-toggle" aria-expanded="false" aria-controls="${listId}">Show steps</button>
        <button type="button" class="q ar-replay">Replay</button>
      </span>
    </div>
    <ol class="ar-list" id="${listId}" data-focus-group data-focusing>
      ${STEPS.map((s) => `<li class="ar-row"><span class="ar-num">${s.num}</span><span class="ar-verb">${s.verb}</span><span class="ar-target">${s.target}</span><span class="ar-meta">${s.done}</span></li>`).join("")}
    </ol>
    <p class="ar-report" hidden>Expired cookies now throw <span class="mono">TokenExpiredError</span> instead of falling back to <span class="mono">guest()</span>.</p>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const statusEl = host.querySelector(".ar-status");
      const bodyEl = host.querySelector(".ar-body");
      const summaryEl = host.querySelector(".ar-summary");
      const toggleBtn = host.querySelector(".ar-toggle");
      const replayBtn = host.querySelector(".ar-replay");
      const listEl = host.querySelector(".ar-list");
      const reportEl = host.querySelector(".ar-report");
      const sr = host.querySelector("[aria-live]");
      const rowEls = [...listEl.querySelectorAll(".ar-row")];
      const frame = ctx.brackets(listEl, { padX: 0, padY: -1, exactPad: true });

      let state = "running";
      let curStep = 2;
      let stepsShown = false;
      let busy = false;
      let runToken = 0;

      function restoreEl(el) {
        el.style.pointerEvents = "";
        if (el.getAnimations) el.getAnimations().forEach((a) => a.cancel());
        el.hidden = false;
      }

      function paintStep(idx, immediate) {
        curStep = idx;
        listEl.setAttribute("data-focusing", "");
        rowEls.forEach((row, i) => {
          const meta = row.querySelector(".ar-meta");
          if (i === idx) row.setAttribute("data-active", "");
          else row.removeAttribute("data-active");
          const nextMeta = i < idx ? STEPS[i].done : i === idx ? STEPS[i].live : "Queued";
          if (immediate) meta.textContent = nextMeta;
          else ctx.swapText(meta, nextMeta);
        });
        frame.moveTo(rowEls[idx], { immediate });
        const st = `Step ${idx + 1} of 4`;
        statusEl.classList.remove("is-done");
        if (immediate) statusEl.textContent = st;
        else ctx.swapText(statusEl, st);
      }

      function finishRun(byUser) {
        if (state === "done" || busy) return;
        state = "done";
        busy = true;
        stepsShown = false;
        runToken++;
        rowEls.forEach((row, i) => {
          row.removeAttribute("data-active");
          row.querySelector(".ar-meta").textContent = STEPS[i].done;
        });
        listEl.removeAttribute("data-focusing");
        frame.pare();
        statusEl.classList.add("is-done");
        ctx.swapText(statusEl, "Passed");

        ctx.pareOut(listEl, () => {
          busy = false;
          if (state !== "done") return;
          listEl.hidden = true;
          summaryEl.hidden = false;
          toggleBtn.setAttribute("aria-expanded", "false");
          toggleBtn.classList.remove("is-on");
          toggleBtn.textContent = "Show steps";
          restoreEl(reportEl);
          if (!ctx.reduced() && reportEl.animate) {
            reportEl.animate([{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 170, easing: PlainPlayer.EASE_OUT });
          }
          if (byUser) {
            sr.textContent = "Run passed. 4 steps folded into summary.";
            toggleBtn.focus({ preventScroll: true });
          }
        });
      }

      function toggleSteps() {
        if (state !== "done" || busy) return;
        stepsShown = !stepsShown;
        toggleBtn.setAttribute("aria-expanded", stepsShown ? "true" : "false");
        toggleBtn.classList.toggle("is-on", stepsShown);
        ctx.swapText(toggleBtn, stepsShown ? "Hide steps" : "Show steps");
        if (stepsShown) {
          ctx.flip(bodyEl, () => {
            restoreEl(listEl);
            listEl.removeAttribute("data-focusing");
            rowEls.forEach((row, i) => {
              row.removeAttribute("data-active");
              row.querySelector(".ar-meta").textContent = STEPS[i].done;
            });
          });
          if (!ctx.reduced() && listEl.animate) {
            listEl.animate([{ opacity: 0, transform: "translateY(-3px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 150, easing: PlainPlayer.EASE_OUT });
          }
          sr.textContent = "4 tool steps shown.";
        } else {
          ctx.pareOut(listEl, () => {
            if (!stepsShown && state === "done") listEl.hidden = true;
          });
          sr.textContent = "Tool steps hidden.";
        }
      }

      function replay(byUser) {
        if (busy) return;
        const myToken = ++runToken;
        state = "running";
        stepsShown = false;
        ctx.flip(bodyEl, () => {
          summaryEl.hidden = true;
          reportEl.hidden = true;
          restoreEl(listEl);
          paintStep(0, true);
        });
        if (byUser) sr.textContent = "Replaying 4 agent steps.";

        const wait = byUser ? ctx.after : ctx.demoAfter;
        wait(560, () => {
          if (runToken !== myToken || state !== "running") return;
          paintStep(1, false);
          wait(560, () => {
            if (runToken !== myToken || state !== "running") return;
            paintStep(2, false);
            wait(620, () => {
              if (runToken !== myToken || state !== "running") return;
              paintStep(3, false);
              ctx.after(320, () => {
                if (runToken !== myToken || state !== "running") return;
                ctx.swapText(rowEls[3].querySelector(".ar-meta"), STEPS[3].done);
              });
              wait(720, () => {
                if (runToken !== myToken || state !== "running") return;
                finishRun(byUser);
                if (!byUser) scheduleCycle();
              });
            });
          });
        });
      }

      toggleBtn.addEventListener("click", toggleSteps, { signal: ctx.signal });
      replayBtn.addEventListener("click", () => replay(true), { signal: ctx.signal });

      ctx.onHand(() => {
        if (state === "running") {
          const myToken = ++runToken;
          ctx.after(550, () => {
            if (runToken !== myToken || state !== "running") return;
            if (curStep < 3) {
              paintStep(3, false);
              ctx.after(650, () => {
                if (runToken === myToken && state === "running") finishRun(false);
              });
            } else {
              finishRun(false);
            }
          });
        }
      });

      function scheduleCycle() {
        ctx.demoAfter(2800, () => {
          replay(false);
        });
      }

      /* Initial mount rests mid-run with step 03 framed. */
      paintStep(2, true);
      if (!ctx.reduced()) {
        ctx.demoAfter(1500, () => {
          if (state !== "running") return;
          paintStep(3, false);
          ctx.demoAfter(350, () => {
            if (state !== "running") return;
            ctx.swapText(rowEls[3].querySelector(".ar-meta"), STEPS[3].done);
          });
          ctx.demoAfter(950, () => {
            finishRun(false);
            scheduleCycle();
          });
        });
      } else {
        /* Under reduced motion, allow clicking the framed list to advance/complete cleanly too. */
        listEl.style.cursor = "pointer";
        listEl.addEventListener("click", () => { if (state === "running") finishRun(true); }, { signal: ctx.signal });
      }
    },
  });
})();

</script>
<script>
/* agent-transcript.js */
/* Checkpoint Ledger, redesigned in Plain (Subtraction): an agent run's steps as a compact ledger with one gliding
   4-corner filter frame. Rolling back to any checkpoint pares every later step off the page and leaves one receipt line. */
(function () {
  const STEPS = [
    { num: "01", verb: "Read", target: "session.ts", status: "Applied" },
    { num: "02", verb: "Edit", target: "verify.ts", status: "Applied" },
    { num: "03", verb: "Run", target: "vitest", status: "Applied" },
    { num: "04", verb: "Push", target: "origin/fix", status: "Waiting" },
  ];
  const FILTERS = ["All", "Applied", "Waiting"];

  PlainPlayer.register({
    slug: "agent-transcript",
    title: "Checkpoint Ledger",
    tagline: "Roll back to any step; later steps pare away.",
    css: `
.ps-agent-transcript .at { width: min(100%, 440px); display: grid }
.ps-agent-transcript .at-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 12px;
  padding-bottom: 10px; border-bottom: 1px solid var(--line) }
.ps-agent-transcript .at-head h3 { margin: 0; font: 500 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em }
.ps-agent-transcript .at-filters { position: relative; display: inline-flex; align-items: center; gap: 20px; padding: 2px 9px }
.ps-agent-transcript .at-filter { min-height: 22px; font-size: 13px; line-height: 1.4 }
.ps-agent-transcript .at-list { display: grid }
.ps-agent-transcript .at-row { position: relative; display: grid; grid-template-columns: 24px 42px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.4 }
.ps-agent-transcript .at-num { font-size: 12.5px; color: var(--muted) }
.ps-agent-transcript .at-verb { font-weight: 500 }
.ps-agent-transcript .at-target { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ps-agent-transcript .at-tail { position: relative; display: inline-flex; align-items: center; justify-content: flex-end; padding-right: 10px; white-space: nowrap }
.ps-agent-transcript .at-state { font-size: 13px; color: var(--muted); transition: opacity var(--dur-instant) var(--ease-out) }
.ps-agent-transcript .at-row[data-status="Waiting"] .at-state { color: var(--ink); font-weight: 500 }
.ps-agent-transcript .at-rb, .ps-agent-transcript .at-restore { min-height: 24px; font-size: 13px }
.ps-agent-transcript .at-row.is-featured .at-state { display: none }
.ps-agent-transcript .at-row:not(.is-featured) .at-rb { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); opacity: 0; pointer-events: none }
.ps-agent-transcript .at-row:not(.is-featured):hover .at-rb,
.ps-agent-transcript .at-row:not(.is-featured):focus-within .at-rb { opacity: 1; pointer-events: auto }
.ps-agent-transcript .at-row:not(.is-featured):hover .at-state,
.ps-agent-transcript .at-row:not(.is-featured):focus-within .at-state { opacity: 0 }
.ps-agent-transcript .at-empty { padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--muted) }
.ps-agent-transcript .at-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 10px 0 0; font-size: 13px; line-height: 1.4 }
.ps-agent-transcript.is-tile .at { width: 100% }
.ps-agent-transcript.is-tile .at-head { padding-bottom: 8px }
.ps-agent-transcript.is-tile .at-row { grid-template-columns: 22px 40px minmax(0, 1fr) auto; gap: 8px; padding: 8px 0; font-size: 13.5px }
.ps-agent-transcript.is-tile .at-foot { padding-top: 8px }
`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="at">
  <div class="at-head">
    <h3>Session fix</h3>
    <div class="at-filters" role="radiogroup" aria-label="Filter checkpoints">
      ${FILTERS.map((f, i) => `<button type="button" class="q in-frame at-filter" role="radio" aria-checked="${i === 0 ? "true" : "false"}" tabindex="${i === 0 ? "0" : "-1"}" data-filter="${f}">${f}</button>`).join("")}
    </div>
  </div>
  <div class="at-list"></div>
  <div class="at-foot" hidden>
    <span class="at-summary muted"></span>
    <button type="button" class="q is-ink at-restore">Restore 4 steps</button>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const filterWrap = host.querySelector(".at-filters");
      const filterBtns = [...filterWrap.querySelectorAll(".at-filter")];
      const listEl = host.querySelector(".at-list");
      const footEl = host.querySelector(".at-foot");
      const summaryEl = host.querySelector(".at-summary");
      const restoreBtn = host.querySelector(".at-restore");
      const sr = host.querySelector("[aria-live]");

      const filterFrame = ctx.brackets(filterWrap, { padX: 9, padY: 2, exactPad: true });
      let curFilter = "All";
      let keepCount = STEPS.length;
      let busy = false;

      function visibleSteps() {
        return STEPS.slice(0, keepCount).filter((s) => curFilter === "All" || s.status === curFilter);
      }

      const rowEls = STEPS.map((step, idx) => {
        const row = document.createElement("div");
        row.className = "at-row";
        row.dataset.num = step.num;
        row.dataset.idx = String(idx);
        row.dataset.status = step.status;
        row.innerHTML = `
          <span class="at-num">${step.num}</span>
          <span class="at-verb">${step.verb}</span>
          <span class="at-target">${step.target}</span>
          <span class="at-tail">
            <span class="at-state">${step.status}</span>
            <button type="button" class="q is-ink at-rb" data-rb="${idx}" aria-label="Roll back to step ${step.num} ${step.verb} ${step.target}">Rollback</button>
          </span>`;
        row.querySelector(".at-rb").addEventListener("click", () => rollbackTo(idx, true), { signal: ctx.signal });
        listEl.appendChild(row);
        return row;
      });
      const emptyEl = document.createElement("div");
      emptyEl.className = "at-empty";
      emptyEl.hidden = true;
      listEl.appendChild(emptyEl);

      function renderList() {
        const vis = visibleSteps();
        const visSet = new Set(vis);
        STEPS.forEach((step, idx) => {
          const row = rowEls[idx];
          const shown = visSet.has(step);
          const canRollback = idx < keepCount - 1;
          const featured = canRollback && step.num === "02" && keepCount === STEPS.length;
          row.hidden = !shown;
          row.style.pointerEvents = "";
          if (row.getAnimations) row.getAnimations().forEach((a) => a.cancel());
          row.classList.toggle("is-featured", featured);
          row.querySelector(".at-rb").hidden = !canRollback;
        });
        if (!vis.length) {
          emptyEl.hidden = false;
          emptyEl.textContent = keepCount < STEPS.length
            ? `No ${curFilter.toLowerCase()} steps after rewind to ${STEPS[keepCount - 1].num}`
            : `No ${curFilter.toLowerCase()} steps`;
        } else {
          emptyEl.hidden = true;
        }
      }

      function syncFoot(immediate) {
        if (keepCount < STEPS.length) {
          const undone = STEPS.length - keepCount;
          const targetNum = STEPS[keepCount - 1].num;
          const text = `Rewound to ${targetNum} · ${undone} ${undone === 1 ? "step" : "steps"} undone`;
          footEl.hidden = false;
          if (immediate) summaryEl.textContent = text;
          else ctx.swapText(summaryEl, text);
        } else {
          footEl.hidden = true;
        }
      }

      function setFilter(next, immediate, byUser) {
        if (curFilter === next && !immediate) return;
        curFilter = next;
        for (const b of filterBtns) {
          const on = b.dataset.filter === next;
          b.setAttribute("aria-checked", on ? "true" : "false");
          b.tabIndex = on ? 0 : -1;
          if (on) filterFrame.moveTo(b, { immediate });
        }
        if (immediate) {
          renderList();
        } else {
          ctx.flip(host.querySelector(".at"), () => {
            ctx.flip(listEl, () => {
              renderList();
            });
          });
        }
        if (byUser) {
          const n = visibleSteps().length;
          sr.textContent = `${next}, ${n} ${n === 1 ? "step" : "steps"} shown`;
        }
      }

      function rollbackTo(stepIdx, byUser) {
        const nextKeep = stepIdx + 1;
        if (busy || nextKeep >= keepCount) return;
        const rowsAfter = rowEls.filter((r, idx) => !r.hidden && idx > stepIdx);
        keepCount = nextKeep;

        const finish = () => {
          busy = false;
          renderList();
          syncFoot(false);
          if (byUser) {
            const undone = STEPS.length - keepCount;
            sr.textContent = `Rewound to ${STEPS[stepIdx].num}, ${undone} ${undone === 1 ? "step" : "steps"} undone.`;
            restoreBtn.focus({ preventScroll: true });
          }
        };

        if (!rowsAfter.length || ctx.reduced()) {
          ctx.flip(host.querySelector(".at"), finish);
          return;
        }

        busy = true;
        for (const extra of rowsAfter.slice(1)) {
          extra.style.pointerEvents = "none";
          if (extra.animate) {
            extra.animate([{ opacity: 1, transform: "translateX(0)" }, { opacity: 0, transform: "translateX(-6px)" }], {
              duration: 140,
              easing: PlainPlayer.EASE_OUT,
              fill: "forwards",
            });
          }
        }
        ctx.pareOut(rowsAfter[0], () => {
          ctx.flip(host.querySelector(".at"), finish);
        });
      }

      function restoreAll(byUser) {
        if (busy || keepCount === STEPS.length) return;
        keepCount = STEPS.length;
        ctx.flip(host.querySelector(".at"), () => {
          if (curFilter !== "All" && !visibleSteps().length) {
            setFilter("All", true, false);
          } else {
            renderList();
          }
          syncFoot(false);
        });
        if (byUser) {
          sr.textContent = "Restored all 4 steps.";
          const rb02 = listEl.querySelector('[data-rb="1"]');
          if (rb02) rb02.focus({ preventScroll: true });
        }
      }

      for (const btn of filterBtns) {
        btn.addEventListener("click", () => setFilter(btn.dataset.filter, false, true), { signal: ctx.signal });
      }
      filterWrap.addEventListener("keydown", (e) => {
        const i = filterBtns.findIndex((b) => b.dataset.filter === curFilter);
        let next = -1;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (i + 1) % filterBtns.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (i - 1 + filterBtns.length) % filterBtns.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = filterBtns.length - 1;
        if (next >= 0) {
          e.preventDefault();
          filterBtns[next].focus({ preventScroll: true });
          setFilter(filterBtns[next].dataset.filter, false, true);
        }
      }, { signal: ctx.signal });

      restoreBtn.addEventListener("click", () => restoreAll(true), { signal: ctx.signal });

      setFilter("All", true, false);
      syncFoot(true);

      function cycle() {
        ctx.demoAfter(2300, () => {
          rollbackTo(1, false);
          ctx.demoAfter(2700, () => {
            restoreAll(false);
            cycle();
          });
        });
      }
      cycle();
    },
  });
})();

</script>
<script>
/* agent-tuning.js */
/* Agent Tuning, redesigned in Plain (Subtraction): three presets share one living 4-corner frame above three 1px
   hairline sliders; touching any thumb follows 1:1 and pares the preset frame away into Custom · Reset. */
(function () {
  const PRESETS = [
    { key: "patch", label: "Patch", vals: { budget: 4, workers: 1, files: 3 } },
    { key: "refactor", label: "Refactor", vals: { budget: 8, workers: 2, files: 6 } },
    { key: "audit", label: "Audit", vals: { budget: 24, workers: 4, files: 16 } },
  ];

  const SLIDERS = [
    {
      key: "budget",
      label: "Reasoning budget",
      min: 0,
      max: 32,
      step: 1,
      fmt: (v) => (v === 0 ? "0 tok" : `${v}k tok`),
      speech: (v) => (v === 0 ? "0 tokens" : `${v} thousand tokens`),
    },
    {
      key: "workers",
      label: "Parallel workers",
      min: 1,
      max: 6,
      step: 1,
      fmt: (v) => `${v} ${v === 1 ? "agent" : "agents"}`,
      speech: (v) => `${v} ${v === 1 ? "agent" : "agents"}`,
    },
    {
      key: "files",
      label: "Max touched files",
      min: 1,
      max: 20,
      step: 1,
      fmt: (v) => `${v} ${v === 1 ? "file" : "files"}`,
      speech: (v) => `${v} ${v === 1 ? "file" : "files"}`,
    },
  ];
  let uid = 0;

  PlainPlayer.register({
    slug: "agent-tuning",
    title: "Agent Tuning",
    tagline: "Presets and three hairline sliders for agent scope.",
    css: `
.ps-agent-tuning .at { width: min(100%, 400px); display: grid }
.ps-agent-tuning .at-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px;
  padding: 0 0 8px; border-bottom: 1px solid var(--line) }
.ps-agent-tuning .at-presets { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 24px; padding: 2px 9px }
.ps-agent-tuning .at-presets .q { min-height: 24px }
.ps-agent-tuning .at-presets .q[aria-checked="true"] { font-weight: 500; color: var(--ink) }
.ps-agent-tuning .at-custom { display: inline-flex; align-items: center; gap: 6px; padding-right: 10px; font-size: 13px; color: var(--muted) }
.ps-agent-tuning .at-est { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.ps-agent-tuning .at-rows { display: grid }
.ps-agent-tuning .at-row { display: grid; gap: 6px; padding: 10px 0 8px; border-bottom: 1px solid var(--line) }
.ps-agent-tuning .at-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 14px }
.ps-agent-tuning .at-name { color: var(--ink) }
.ps-agent-tuning .at-val { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums }
.ps-agent-tuning .at-slider { position: relative; height: 24px; cursor: pointer; touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent }
.ps-agent-tuning .at-slider:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.ps-agent-tuning .at-rail { position: absolute; left: 0; right: 0; top: 50%; height: 1px; margin-top: -0.5px; background: var(--line-control); overflow: hidden; pointer-events: none }
.ps-agent-tuning .at-fill { display: block; width: 100%; height: 100%; background: var(--ink); transform-origin: left center; transform: scaleX(0); will-change: transform }
.ps-agent-tuning .at-thumb { position: absolute; left: 0; top: 50%; width: 10px; height: 10px; margin-top: -5px; background: var(--ink);
  pointer-events: none; will-change: transform }
.ps-agent-tuning.is-tile .at { width: 100% }
.ps-agent-tuning.is-tile .at-top { padding-bottom: 6px; gap: 2px 10px }
.ps-agent-tuning.is-tile .at-custom .q { min-height: 26px }
.ps-agent-tuning.is-tile .at-row { padding: 9px 0 7px; gap: 4px }
.ps-agent-tuning.is-tile .at-slider { height: 22px }
`,
    mount(host, ctx) {
      const id = "ps-at-" + ++uid;
      host.innerHTML = `
<div class="at">
  <div class="at-top">
    <div class="at-presets" role="radiogroup" aria-label="Agent tuning presets">
      ${PRESETS.map((p) => `<button type="button" class="q in-frame" role="radio" aria-checked="false" tabindex="-1" data-preset="${p.key}">${p.label}</button>`).join("")}
    </div>
    <span class="at-est"></span>
    <span class="at-custom" hidden><span>Custom ·</span><button type="button" class="q at-reset">Reset</button></span>
  </div>
  <div class="at-rows">
    ${SLIDERS.map((s) => `
    <div class="at-row">
      <div class="at-meta">
        <span class="at-name" id="${id}-${s.key}">${s.label}</span>
        <span class="at-val" data-val="${s.key}"></span>
      </div>
      <div class="at-slider" role="slider" tabindex="0" data-slider="${s.key}"
        aria-labelledby="${id}-${s.key}" aria-valuemin="${s.min}" aria-valuemax="${s.max}" aria-valuenow="0" aria-valuetext="">
        <span class="at-rail" aria-hidden="true"><span class="at-fill"></span></span>
        <span class="at-thumb" aria-hidden="true"></span>
      </div>
    </div>`).join("")}
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const presetsEl = host.querySelector(".at-presets");
      const radios = [...presetsEl.querySelectorAll('[role="radio"]')];
      const estEl = host.querySelector(".at-est");
      const customEl = host.querySelector(".at-custom");
      const resetBtn = host.querySelector(".at-reset");
      const sr = host.querySelector("[aria-live]");
      const frame = ctx.brackets(presetsEl, { padX: 9, padY: 2, exactPad: true });

      let presetIdx = 1;
      let lastPresetIdx = 1;
      const state = { budget: 8, workers: 2, files: 6 };
      const controls = {};

      function costText() {
        const cents = Math.max(1, Math.round(state.budget * 0.55 + state.workers * 0.9 + state.files * 0.15));
        return `~$${(cents / 100).toFixed(2)} est.`;
      }

      function syncHeader(immediate) {
        if (presetIdx >= 0) {
          customEl.hidden = true;
          estEl.hidden = false;
          const next = costText();
          if (immediate) estEl.textContent = next;
          else ctx.swapText(estEl, next);
        } else {
          estEl.hidden = true;
          customEl.hidden = false;
        }
      }

      function enterCustom() {
        if (presetIdx >= 0) {
          lastPresetIdx = presetIdx;
          presetIdx = -1;
          radios.forEach((btn, i) => {
            btn.setAttribute("aria-checked", "false");
            btn.tabIndex = i === lastPresetIdx ? 0 : -1;
          });
          frame.pare();
        }
        syncHeader(false);
      }

      for (const spec of SLIDERS) {
        const sliderEl = host.querySelector(`[data-slider="${spec.key}"]`);
        const valEl = host.querySelector(`[data-val="${spec.key}"]`);
        const fillEl = sliderEl.querySelector(".at-fill");
        const thumbEl = sliderEl.querySelector(".at-thumb");
        const span = spec.max - spec.min;

        const paint = (p) => {
          const clamped = Math.max(0, Math.min(1, p));
          const travel = Math.max(0, sliderEl.clientWidth - 10);
          thumbEl.style.transform = `translate3d(${(clamped * travel).toFixed(2)}px, 0, 0)`;
          fillEl.style.transform = `scaleX(${clamped.toFixed(4)})`;
        };

        const sp = ctx.spring((state[spec.key] - spec.min) / span, paint, { duration: 0.2 });

        const syncMeta = (v) => {
          state[spec.key] = v;
          valEl.textContent = spec.fmt(v);
          sliderEl.setAttribute("aria-valuenow", String(v));
          sliderEl.setAttribute("aria-valuetext", spec.speech(v));
        };

        syncMeta(state[spec.key]);
        requestAnimationFrame(() => { if (!ctx.signal.aborted) paint(sp.value()); });

        if (typeof ResizeObserver !== "undefined") {
          const ro = new ResizeObserver(() => paint(sp.value()));
          ro.observe(sliderEl);
          ctx.signal.addEventListener("abort", () => ro.disconnect(), { once: true });
        }

        let dragging = false;
        const fromPointer = (e) => {
          const rect = sliderEl.getBoundingClientRect();
          const rawP = Math.max(0, Math.min(1, (e.clientX - rect.left - 5) / Math.max(1, rect.width - 10)));
          const snapped = Math.round((spec.min + rawP * span) / spec.step) * spec.step;
          const v = Math.max(spec.min, Math.min(spec.max, snapped));
          sp.jump(rawP);
          syncMeta(v);
          enterCustom();
        };

        sliderEl.addEventListener("pointerdown", (e) => {
          if (e.button !== 0 && e.pointerType === "mouse") return;
          e.preventDefault();
          dragging = true;
          sliderEl.focus({ preventScroll: true });
          try { sliderEl.setPointerCapture(e.pointerId); } catch (err) {}
          fromPointer(e);
        }, { signal: ctx.signal });

        sliderEl.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          fromPointer(e);
        }, { signal: ctx.signal });

        const finishDrag = () => {
          if (!dragging) return;
          dragging = false;
          sp.set((state[spec.key] - spec.min) / span);
          sr.textContent = `${spec.label}: ${spec.speech(state[spec.key])}`;
        };
        sliderEl.addEventListener("pointerup", finishDrag, { signal: ctx.signal });
        sliderEl.addEventListener("pointercancel", finishDrag, { signal: ctx.signal });
        sliderEl.addEventListener("lostpointercapture", finishDrag, { signal: ctx.signal });

        sliderEl.addEventListener("keydown", (e) => {
          let next = state[spec.key];
          const big = Math.max(1, Math.round(span / 5));
          if (e.key === "ArrowRight" || e.key === "ArrowUp") next += spec.step;
          else if (e.key === "ArrowLeft" || e.key === "ArrowDown") next -= spec.step;
          else if (e.key === "PageUp") next += big;
          else if (e.key === "PageDown") next -= big;
          else if (e.key === "Home") next = spec.min;
          else if (e.key === "End") next = spec.max;
          else return;
          e.preventDefault();
          next = Math.max(spec.min, Math.min(spec.max, next));
          if (next === state[spec.key] && presetIdx < 0) return;
          syncMeta(next);
          sp.set((next - spec.min) / span);
          enterCustom();
          sr.textContent = `${spec.label}: ${spec.speech(next)}`;
        }, { signal: ctx.signal });

        controls[spec.key] = {
          set(v, immediate) {
            syncMeta(v);
            const p = (v - spec.min) / span;
            if (immediate) sp.jump(p);
            else sp.set(p);
          },
        };
      }

      function selectPreset(idx, opts) {
        const o = Object.assign({ immediate: false, byUser: false, focusRadio: false }, opts);
        presetIdx = idx;
        lastPresetIdx = idx;
        const p = PRESETS[idx];
        radios.forEach((btn, i) => {
          const on = i === idx;
          btn.setAttribute("aria-checked", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
          if (on && o.focusRadio) btn.focus({ preventScroll: true });
        });
        frame.moveTo(radios[idx], { immediate: o.immediate });
        for (const s of SLIDERS) {
          controls[s.key].set(p.vals[s.key], o.immediate);
        }
        syncHeader(o.immediate);
        if (o.byUser) {
          sr.textContent = `${p.label} preset: ${controlsText(p.vals)}`;
        }
      }

      function controlsText(v) {
        return `${v.budget === 0 ? "0" : v.budget + "k"} tok, ${v.workers} ${v.workers === 1 ? "agent" : "agents"}, ${v.files} ${v.files === 1 ? "file" : "files"}`;
      }

      radios.forEach((btn, i) => {
        btn.addEventListener("click", () => selectPreset(i, { byUser: true }), { signal: ctx.signal });
      });

      presetsEl.addEventListener("keydown", (e) => {
        const base = presetIdx >= 0 ? presetIdx : lastPresetIdx;
        let next = -1;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (base + 1) % PRESETS.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (base - 1 + PRESETS.length) % PRESETS.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = PRESETS.length - 1;
        if (next >= 0) {
          e.preventDefault();
          selectPreset(next, { byUser: true, focusRadio: true });
        }
      }, { signal: ctx.signal });

      resetBtn.addEventListener("click", () => {
        selectPreset(lastPresetIdx, { byUser: true, focusRadio: true });
      }, { signal: ctx.signal });

      selectPreset(1, { immediate: true });

      const seq = [2, 0, 1];
      let step = 0;
      ctx.demoAfter(1800, () => {
        const run = () => selectPreset(seq[step++ % seq.length]);
        run();
        ctx.demoEvery(2400, run);
      });
    },
  });
})();

</script>
<script>

   wrong codes warn in danger ink, and entering 482913 pares all six slots down into one deploy receipt line. */

.ps-approval-code .ac-entry:focus-within .ac-slot.is-cursor { border-bottom: 2px solid var(--focus) }
.ps-approval-code .ac-slots.is-error .ac-slot { border-bottom: 2px solid var(--danger); color: var(--danger); opacity: 1 }
.ps-approval-code .ac-msg { margin: -2px 0 0; font-size: 13px; color: var(--danger) }
.ps-approval-code .ac-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 24px; padding: 2px 10px 0 }
.ps-approval-code .ac-done { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); font-size: 14px }
.ps-approval-code.is-tile .ac { width: 100%; gap: 12px }

.ps-approval-code.is-tile .ac-slot { height: 40px }
`,
    mount(host, ctx) {
      const id = "ps-ac-" + ++uid;
      host.innerHTML = `
<div class="ac">
  <div class="ac-head">
    <h3>Production deploy · v2.14.0</h3>
    <span class="ac-sub">Confirm passkey</span>
  </div>
  <div class="ac-stage">
    <div class="ac-gate">
      <div class="ac-entry">
        <label class="sr-only" for="${id}-in">Six-digit deploy passkey</label>
        <div class="ac-slots" aria-hidden="true">
          ${[0, 1, 2, 3, 4, 5].map((i) => `<span class="ac-slot" data-slot="${i}"></span>`).join("")}
        </div>
        <input id="${id}-in" class="ac-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="4829" aria-invalid="false">
      </div>
      <p class="ac-msg" hidden></p>
      <div class="ac-actions">
        <button type="button" class="q is-main ac-paste">Paste 482 913</button>
        <button type="button" class="q ac-wrong">Test wrong</button>
      </div>
    </div>
    <div class="ac-done" hidden>
      <span>Verified · Deploying v2.14.0</span>
      <button type="button" class="q is-main ac-lock">Lock again</button>
    </div>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const subEl = host.querySelector(".ac-sub");
      const stageEl = host.querySelector(".ac-stage");
      const gateEl = host.querySelector(".ac-gate");
      const slotsWrap = host.querySelector(".ac-slots");
      const slots = [...slotsWrap.querySelectorAll(".ac-slot")];
      const input = host.querySelector(".ac-input");
      const msgEl = host.querySelector(".ac-msg");
      const pasteBtn = host.querySelector(".ac-paste");

      const doneEl = host.querySelector(".ac-done");
      const lockBtn = host.querySelector(".ac-lock");
      const sr = host.querySelector("[aria-live]");

      let code = "4829";
      let unlocked = false;
      let busy = false;
      let unlockTimer = 0;

      function syncSlots(immediate) {
        const isErr = code.length === 6 && code !== TARGET;

        slots.forEach((el, i) => {

          el.classList.toggle("is-empty", !ch);
          el.classList.toggle("is-cursor", i === cursorIdx);

        const nextHidden = !isErr;
