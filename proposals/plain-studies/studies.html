<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plain — Data, Diagrams & Agentic Components</title>
<style>
/* Plain (litt-md, taste/litt-principles.md, "Plain, the document"; proposals/plain-studies.md): a specification page
   set in Helvetica Neue on white paper. 1px hairlines, 0px corners, zero unnecessary boxes, zero chartjunk, zero
   floating tooltip bubbles.
   Motion language: Subtraction. Unselected choices and sibling components step back in opacity; four 1px corner marks
   frame the one active element; finished scaffolding pares away via FLIP translateY with zero bounce. */
:root {
  --page: #ffffff; --surface-2: #f6f6f6; --surface-3: #ececec;
  --line: #dfdfdf; --line-strong: #a8a8a8; --line-control: #767676;
  --ink: #000000; --muted: #595959; --disabled: #a3a3a3;
  --link: #0000ee; --link-hover: #0000b0; --focus: #0000ee;
  --success: #007c3b; --warning: #9c5a00; --danger: #be2e31;
  --data-blue: #2d90e9; --data-amber: #c47d04; --data-teal: #099d95; --data-violet: #9579ef; --data-rose: #e25f93;
  --ink-8: color-mix(in oklab, var(--ink) 8%, var(--page));
  --ink-18: color-mix(in oklab, var(--ink) 18%, var(--page));
  --ink-42: color-mix(in oklab, var(--ink) 42%, var(--page));
  --ink-82: color-mix(in oklab, var(--ink) 82%, var(--page));
  --font-helvetica: "Helvetica Neue", Helvetica, "TeX Gyre Heros", "Inter", Arial, sans-serif;
  --font-system: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font: var(--font-helvetica);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --t-fig: 26px;
  --t-h3: 15px;
  --t-body: 14px;
  --t-meta: 13px;
  --unselected: 0.40;
  --step-back: 0.25;
  --sibling-dim: 0.32;
  --dur-instant: 100ms;
  --dur-pare: 150ms;
  --dur-settle: 220ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-settle: linear(0, 0.0609, 0.1306, 0.2509, 0.3322, 0.4472, 0.5167, 0.6085, 0.6615, 0.7293,
    0.7846, 0.8154, 0.854, 0.8753, 0.9017, 0.9163, 0.9342, 0.944, 0.956, 0.9626,
    0.9707, 0.977, 0.9805, 0.9847, 0.987, 0.9898, 0.9914, 0.9932, 0.9943, 0.9955,
    0.9965, 0.997, 0.9977, 0.998, 0.9984, 0.9987, 0.999, 0.9991, 0.9993, 0.9994, 1);
  color-scheme: light;
}
:root[data-face="system"] { --font: var(--font-system) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not(.light) {
  --page: #0b0b0b; --surface-2: #161616; --surface-3: #222222;
  --line: #282828; --line-strong: #474747; --line-control: #858585;
  --ink: #ffffff; --muted: #b8b8b8; --disabled: #666666;
  --link: #b3c7ff; --link-hover: #ccd8ff; --focus: #b3c7ff;
  --success: #4bc680; --warning: #d79540; --danger: #ff756f;
  --data-blue: #2c90e8; --data-amber: #c07b03; --data-teal: #09a198; --data-violet: #8f78df; --data-rose: #d55c8c;
  color-scheme: dark } }
:root[data-theme="dark"], :root.dark {
  --page: #0b0b0b; --surface-2: #161616; --surface-3: #222222;
  --line: #282828; --line-strong: #474747; --line-control: #858585;
  --ink: #ffffff; --muted: #b8b8b8; --disabled: #666666;
  --link: #b3c7ff; --link-hover: #ccd8ff; --focus: #b3c7ff;
  --success: #4bc680; --warning: #d79540; --danger: #ff756f;
  --data-blue: #2c90e8; --data-amber: #c07b03; --data-teal: #09a198; --data-violet: #8f78df; --data-rose: #d55c8c;
  color-scheme: dark }
@media (prefers-reduced-motion: reduce) {
  :root { --dur-instant: 0ms; --dur-pare: 0ms; --dur-settle: 0ms }
}

*, *::before, *::after { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--page); color: var(--ink); font: 400 var(--t-body)/1.5 var(--font); letter-spacing: -0.004em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-variant-numeric: tabular-nums;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)) }
button, input, select, textarea { font: inherit; letter-spacing: inherit; color: inherit }
a { color: var(--link); text-decoration: underline; text-underline-offset: 2px }
a:hover { color: var(--link-hover) }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
[hidden] { display: none !important }
.pp-mount.is-tile { --t-fig: 21px; --t-h3: 14.5px }
.pp-mount > * { min-width: 0; max-width: 100% }

/* Shared kit: Plain's quiet controls + Subtraction motion primitives.
   Unselected controls sit at --unselected (0.40) opacity so the one active choice or action reads at once. */
.pm-frame { position: absolute; inset: 0; pointer-events: none; opacity: 0; color: var(--ink);
  transition: opacity var(--dur-pare) var(--ease-out) }
.pm-frame.is-shown { opacity: 1 }
.pm-frame > i { position: absolute; left: 0; top: 0; width: 6px; height: 6px; font-style: normal; will-change: transform;
  background-repeat: no-repeat }
.pm-frame > .tl { background-image: linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor);
  background-size: 6px 1px, 1px 6px; background-position: left top, left top }
.pm-frame > .tr { background-image: linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor);
  background-size: 6px 1px, 1px 6px; background-position: right top, right top }
.pm-frame > .bl { background-image: linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor);
  background-size: 6px 1px, 1px 6px; background-position: left bottom, left bottom }
.pm-frame > .br { background-image: linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor);
  background-size: 6px 1px, 1px 6px; background-position: right bottom, right bottom }

.mk { position: relative }
.mk::before { content: ""; position: absolute; inset: var(--mk-y, 3px) var(--mk-x, -11px); pointer-events: none; opacity: 0;
  transform: scale(1.06);
  transition: opacity var(--dur-instant) var(--ease-out), transform var(--dur-pare) var(--ease-out);
  background-image: linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor),
    linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor);
  background-repeat: no-repeat;
  background-size: 6px 1px, 1px 6px, 6px 1px, 1px 6px, 6px 1px, 1px 6px, 6px 1px, 1px 6px;
  background-position: left top, left top, right top, right top, left bottom, left bottom, right bottom, right bottom }
.mk[data-on]::before, .mk.is-on::before { opacity: 1; transform: scale(1) }

.q { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0; border: 0;
  background: none; color: var(--ink); opacity: var(--unselected); font-weight: 400; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: color var(--dur-instant) var(--ease-out), opacity var(--dur-pare) var(--ease-out) }
/* Fixed 26px vertical bracket clearance around the glyph line so short buttons never crush ascenders or descenders. */
.q::before { content: ""; position: absolute; top: calc(50% - 13px); bottom: calc(50% - 13px); left: -10px; right: -10px;
  pointer-events: none; opacity: 0; transform: scale(1.06);
  transition: opacity var(--dur-instant) var(--ease-out), transform var(--dur-instant) var(--ease-out);
  background-image: linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor),
    linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor), linear-gradient(currentColor,currentColor);
  background-repeat: no-repeat;
  background-size: 6px 1px, 1px 6px, 6px 1px, 1px 6px, 6px 1px, 1px 6px, 6px 1px, 1px 6px;
  background-position: left top, left top, right top, right top, left bottom, left bottom, right bottom, right bottom }
.q:hover:not(:disabled) { opacity: 0.88 }
.q[aria-pressed="true"], .q[aria-checked="true"], .q[aria-selected="true"], .q.is-on, .q.is-main, .q.is-ink { opacity: 1; font-weight: 500 }
.q:hover:not(:disabled)::before, .q.is-main::before, .q[aria-checked="true"]::before, .q[aria-selected="true"]::before, .q[aria-pressed="true"]::before, .q.is-on::before { opacity: 1; transform: scale(1) }
.q:active:not(:disabled)::before { transform: scale(0.96) }
.q.in-frame::before { display: none }
.q.is-danger { color: var(--danger); opacity: 0.92 }
.q.is-danger:hover:not(:disabled), .q.is-danger.is-main { color: var(--danger); opacity: 1 }
.q:disabled { opacity: 0.24; cursor: not-allowed }
.q:focus-visible { outline-offset: 4px; opacity: 1 }

.field { display: block; width: 100%; min-height: 38px; padding: 6px 0; border: 0; border-radius: 0; background: transparent no-repeat left bottom / 100% 1px;
  background-image: linear-gradient(var(--line-control), var(--line-control)); outline: none }
.field:focus { background-image: linear-gradient(var(--focus), var(--focus)); background-size: 100% 2px }
.field[aria-invalid="true"] { background-image: linear-gradient(var(--danger), var(--danger)); background-size: 100% 2px }
.box { border: 1px solid var(--line); background: var(--page) }
/* Boxless Tufte bar track: a clean 4px hairline rail, never a hollow 4-sided rectangle. */
.bar-track { position: relative; height: 4px; border: 0; background: var(--surface-3); overflow: hidden }
.bar-fill { width: 100%; height: 100%; background: var(--ink); transform: translateX(calc((var(--p, 0) - 1) * 100%));
  transition: transform var(--dur-settle) var(--ease-settle); will-change: transform }
.fig { font-size: var(--t-fig); font-weight: 500; line-height: 1.12; letter-spacing: -0.025em; color: var(--ink); font-variant-numeric: tabular-nums }
.label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em }
.muted { color: var(--muted) }
.mono { font-family: var(--mono); font-size: 12.5px }
[data-focus-group] > * { transition: opacity var(--dur-pare) var(--ease-out) }
[data-focus-group][data-focusing] > :not([data-active]):not(.pm-frame) { opacity: var(--step-back) }

/* Page shell & top navigation */
.pg { max-width: 1240px; margin: 0 auto; padding: 40px 12px 88px; transition: opacity var(--dur-pare) var(--ease-out) }
body.sheet-open .pg { opacity: 0; pointer-events: none }
.pg-head { display: grid; gap: 22px; margin: 0 0 44px; padding: 0 0 20px; border-bottom: 1px solid var(--line) }
.pg-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px }
.pg-head h1 { margin: 0; font: 500 28px/1.12 var(--font); letter-spacing: -0.025em }
.pg-head p { margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: var(--muted); max-width: 60ch }
.pg-nav-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px }
.pg-views { position: relative; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 24px; padding: 2px 10px }
.pg-tools { display: flex; align-items: center; gap: 24px; padding: 0 10px 0 0 }
.pg-face-group { position: relative; display: inline-flex; align-items: center; gap: 20px; padding: 2px 10px }

/* View 1: Data, Diagrams & Charts — live open Swiss specification grid (zero outer boxes). */
.dd-page { display: grid; gap: 64px }
.dd-chapter { display: grid; gap: 28px }
.dd-ch-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px;
  padding-bottom: 10px; border-bottom: 1px solid var(--ink) }
.dd-ch-head h2 { margin: 0; font: 500 17px/1.25 var(--font); letter-spacing: -0.015em }
.dd-ch-head span { font-size: 13.5px; color: var(--muted) }
.dd-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px 48px }
/* Sibling component dimming: pointing at one component steps the other components in the chapter back. */
.dd-grid > .dd-card { min-width: 0; display: grid; align-content: start; gap: 16px; padding-top: 16px; border-top: 1px solid var(--line);
  transition: opacity var(--dur-pare) var(--ease-out) }
.dd-grid > .dd-card.is-full { grid-column: 1 / -1; border-top: 0; padding-top: 4px }
.dd-grid:hover > .dd-card:not(:hover) { opacity: var(--sibling-dim) }
.dd-card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px }
.dd-card-title { display: grid; gap: 2px }
.dd-card-title h3 { margin: 0; font: 500 15px/1.3 var(--font); letter-spacing: -0.01em }
.dd-card-title p { margin: 0; font-size: 13px; color: var(--muted) }
.dd-mount { width: 100%; min-width: 0; container-type: inline-size }

/* View 2: Agentic Controls — boxless open-paper tiles parted by a single top hairline; non-hovered tiles step back to 0.32. */
.pg-wall { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 352px), 1fr)); gap: 52px 40px }
.pg-wall > li { transition: opacity var(--dur-pare) var(--ease-out) }
.pg-wall:hover > li:not(:hover) { opacity: var(--sibling-dim) }
.pg-tile { display: grid; gap: 14px; width: 100%; padding: 0; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer }
.pg-stage { position: relative; height: 296px; border: 0; border-top: 1px solid var(--line); background: var(--page); overflow: hidden; display: grid; place-items: center }
.pg-stage::after { content: ""; position: absolute; inset: 8px 0 0 0; pointer-events: none; opacity: 0; transform: scale(1.02);
  transition: opacity var(--dur-instant) var(--ease-out), transform var(--dur-pare) var(--ease-out);
  background-image: linear-gradient(var(--ink),var(--ink)), linear-gradient(var(--ink),var(--ink)), linear-gradient(var(--ink),var(--ink)), linear-gradient(var(--ink),var(--ink)),
    linear-gradient(var(--ink),var(--ink)), linear-gradient(var(--ink),var(--ink)), linear-gradient(var(--ink),var(--ink)), linear-gradient(var(--ink),var(--ink));
  background-repeat: no-repeat;
  background-size: 10px 1px, 1px 10px, 10px 1px, 1px 10px, 10px 1px, 1px 10px, 10px 1px, 1px 10px;
  background-position: left top, left top, right top, right top, left bottom, left bottom, right bottom, right bottom }
.pg-tile:hover .pg-stage::after { opacity: 1; transform: scale(1) }
.pg-tile:active .pg-stage::after { transform: scale(0.985) }
.pg-stage > .pp-mount { width: 100%; height: 100%; display: grid; place-items: center; padding: 20px 4px; container-type: inline-size; pointer-events: none }
.pg-name { display: grid; gap: 2px; min-width: 0; padding-top: 8px; border-top: 1px solid var(--line) }
.pg-name b { font-size: 15px; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; color: var(--ink) }
.pg-name span { color: var(--muted); font-size: 13.5px; line-height: 1.4; min-width: 0 }
.pg-tile:focus-visible { outline-offset: 4px }

/* Open study sheet */
.pg-sheet { position: fixed; inset: 0; z-index: 10; display: none; background: var(--page); overflow: auto; overscroll-behavior: contain }
.pg-sheet.is-open { display: grid; grid-template-rows: auto 1fr auto }
.pg-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--line) }
.pg-bar h2 { margin: 0; font: 500 15px/1.3 var(--font); letter-spacing: -0.01em; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pg-bar .pg-close { justify-self: start } .pg-bar .pg-steps { justify-self: end; display: flex; gap: 24px }
.pg-open { display: grid; place-items: center; min-height: 0; padding: 48px 24px }
.pg-open > .pp-mount { width: min(100%, 960px); min-height: min(500px, 100%); display: grid; place-items: center; container-type: inline-size }
.pg-about { max-width: 560px; margin: 0 auto; padding: 0 24px 36px; text-align: center; color: var(--muted); font-size: 14px }
.pg-foot { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px }
@media (max-width: 860px) {
  .dd-grid { grid-template-columns: minmax(0, 1fr); gap: 40px }
}
@media (max-width: 720px) {
  .pg { padding: 24px 4px 56px }
  .pg-head h1 { font-size: 24px }
  .pg-stage { height: 288px }
  .pg-bar { padding: 10px 20px } .pg-bar .pg-steps { gap: 20px }
  .pg-open { padding: 32px 16px }
}
@media (forced-colors: active) { .pm-frame, .mk::before, .q::before, .pg-stage::after { forced-color-adjust: none; color: CanvasText } }
</style>
</head>
<body>
<main class="pg">
  <header class="pg-head">
    <div class="pg-top">
      <div>
        <h1>Plain</h1>
        <p id="pg-lede">Data, diagrams and agentic components on white paper: 1px hairlines, direct labels, zero unnecessary boxes, and focus by subtraction.</p>
      </div>
      <div class="pg-tools">
        <div class="pg-face-group" id="pg-faces" role="radiogroup" aria-label="Typeface">
          <button class="q in-frame" type="button" role="radio" aria-checked="true" data-face="helvetica">Helvetica</button>
          <button class="q in-frame" type="button" role="radio" aria-checked="false" data-face="system">System</button>
        </div>
        <button class="q" type="button" id="pg-theme">Dark</button>
      </div>
    </div>
    <nav class="pg-nav-bar" aria-label="Component sets">
      <div class="pg-views" id="pg-views" role="tablist" aria-label="Plain views">
        <button class="q in-frame" type="button" role="tab" aria-selected="true" data-view="data">Data &amp; diagrams</button>
        <button class="q in-frame" type="button" role="tab" aria-selected="false" data-view="controls">Agentic controls</button>
      </div>
    </nav>
  </header>

  <section id="pg-data-view" class="dd-page" aria-label="Data, charts and diagrams"></section>
  <section id="pg-controls-view" hidden aria-label="Agentic controls">
    <ul class="pg-wall" id="pg-wall"></ul>
  </section>

  <p class="pg-foot" id="pg-foot">Point at any series, bar, node or row to subtract the rest. Switch to Agentic controls above for all 24 interactive control studies.</p>
</main>
<div class="pg-sheet" id="pg-sheet" role="dialog" aria-modal="true" aria-labelledby="pg-sheet-title">
  <div class="pg-bar">
    <button class="q pg-close" type="button" id="pg-close">Close</button>
    <h2 id="pg-sheet-title"></h2>
    <div class="pg-steps">
      <button class="q" type="button" id="pg-prev" aria-label="Previous study">Previous</button>
      <button class="q" type="button" id="pg-next" aria-label="Next study">Next</button>
    </div>
  </div>
  <div class="pg-open" id="pg-open"></div>
  <p class="pg-about" id="pg-about"></p>
</div>
<p class="sr-only" id="pg-live" aria-live="polite"></p>
<script>
/* PlainPlayer: shared Subtraction motion engine for both Data/Diagram components and Agentic Control studies. */
window.PlainPlayer = (function () {
  const studies = [];
  const dataItems = [];
  const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
  const EASE_SETTLE = "cubic-bezier(0.16, 1, 0.3, 1)";

  /* Critically damped spring (bounce forced to 0). */
  function spring(initial, onUpdate, opts) {
    const dur = Math.max(0.06, (opts && opts.duration) || 0.2);
    const w = (2 * Math.PI) / dur, k = w * w, c = 2 * w;
    let x = initial, v = 0, target = initial, raf = 0, last = 0, dead = false;
    const step = (now) => {
      if (dead) return;
      let dt = Math.max(0, Math.min(0.064, (now - last) / 1000)); last = now;
      while (dt > 0) { const h = Math.min(dt, 1 / 240); v += (-k * (x - target) - c * v) * h; x += v * h; dt -= h; }
      if (Math.abs(x - target) < 0.0005 && Math.abs(v) < 0.0005) { x = target; v = 0; raf = 0; onUpdate(x); return; }
      onUpdate(x); raf = requestAnimationFrame(step);
    };
    const api = {
      set(t, velocity) {
        target = t; if (velocity !== undefined) v = velocity;
        if (reduced() || dead) { x = t; v = 0; if (raf) cancelAnimationFrame(raf); raf = 0; onUpdate(x); return; }
        if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); }
      },
      jump(t) { x = target = t; v = 0; if (raf) cancelAnimationFrame(raf); raf = 0; onUpdate(x); },
      value: () => x, target: () => target,
      stop() { dead = true; if (raf) cancelAnimationFrame(raf); raf = 0; },
    };
    if (opts && opts.signal) opts.signal.addEventListener("abort", () => api.stop(), { once: true });
    return api;
  }

  function addStyle(slug, css) {
    if (!css) return;
    const st = document.createElement("style");
    st.dataset.study = slug;
    st.textContent = css;
    document.head.appendChild(st);
  }

  return {
    studies,
    dataItems,
    reduced,
    spring,
    EASE_OUT,
    EASE_SETTLE,
    register(s) { studies.push(s); addStyle(s.slug, s.css); },
    registerData(d) { dataItems.push(d); addStyle("dd-" + d.slug, d.css); },
  };
})();
</script>
<script>
/* 01-stat-strip.js */
/* Standing Figures & Sparklines (Plain Data): open 4-column workspace telemetry strip with zero outer box,
   gliding period brackets (24h · 7d · 30d), 1px dashed mean baselines, 1.5px ink polylines, 4.5x4.5 square
   point markers, and direct in-place scrub readouts while sibling cells step back to 0.25 opacity. */
(function () {
  const PERIODS = [
    {
      key: "24h",

    mount(host, ctx) {
      let periodIdx = 0;
      let activeCell = -1;
      let rovingCell = 0;
      const scrubIdx = [-1, -1, -1, -1];
      const widths = [240, 240, 240, 240];

      host.innerHTML = `
<div class="ss">
  <div class="ss-head">
    <h3>Workspace overview</h3>
    <div class="ss-periods" role="radiogroup" aria-label="Overview period">
      ${PERIODS.map((p, i) => `${i > 0 ? '<span class="ss-dot" aria-hidden="true">\u00b7</span>' : ""}<button type="button" class="q in-frame" role="radio" data-idx="${i}" aria-checked="${i === 0 ? "true" : "false"}" tabindex="${i === 0 ? "0" : "-1"}">${p.label}</button>`).join("")}
    </div>
  </div>
  <div class="ss-strip" data-focus-group role="region" aria-label="Key workspace metrics">
    ${PERIODS[0].metrics.map((m, i) => `
    <div class="ss-cell" data-cell="${i}" tabindex="${i === 0 ? "0" : "-1"}" role="group" aria-label="${m.name}">
      <div class="ss-top">
        <span class="ss-name">${m.name}</span>
        <span class="ss-delta">${m.delta}</span>
      </div>
      <div class="fig ss-fig">${m.fig}</div>
      <div class="ss-spark" aria-hidden="true">
        <svg viewBox="0 0 240 36">
          <line class="ss-mean" x1="0" x2="240" y1="18" y2="18" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3 3" shape-rendering="crispEdges"></line>
          <line class="ss-cursor" x1="0" x2="0" y1="0" y2="36" stroke="var(--line-control)" stroke-width="1" shape-rendering="crispEdges" opacity="0"></line>
          <polyline class="ss-line" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="butt"></polyline>
          <rect class="ss-pt" width="4.5" height="4.5" fill="var(--ink)"></rect>
        </svg>
      </div>
    </div>`).join("")}
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const periodsEl = host.querySelector(".ss-periods");
      const periodBtns = [...periodsEl.querySelectorAll('[role="radio"]')];
      const stripEl = host.querySelector(".ss-strip");
      const cellEls = [...stripEl.querySelectorAll(".ss-cell")];
      const sr = host.querySelector("[aria-live]");
      const periodFrame = ctx.brackets(periodsEl, { padX: 7, padY: 2, exactPad: true });

      const refs = cellEls.map((cell) => ({
        cell,
        fig: cell.querySelector(".ss-fig"),
        delta: cell.querySelector(".ss-delta"),
        spark: cell.querySelector(".ss-spark"),
        svg: cell.querySelector("svg"),
        mean: cell.querySelector(".ss-mean"),
        cursor: cell.querySelector(".ss-cursor"),
        line: cell.querySelector(".ss-line"),
        pt: cell.querySelector(".ss-pt"),
      }));

      function geomFor(cellIdx) {
        const p = PERIODS[periodIdx];
        const m = p.metrics[cellIdx];
        const vals = m.values;
        const w = Math.max(120, widths[cellIdx] || 240);
        const h = 36;
        const padX = 3;
        const padY = 5.5;
        const min = Math.min(...vals);
        const max = Math.max(...vals);
        const span = max - min || 1;
        const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
        const xAt = (k) => padX + (k / (vals.length - 1)) * (w - padX * 2);
        const yAt = (v) => h - padY - ((v - min) / span) * (h - padY * 2);
        return { p, m, vals, w, h, xAt, yAt, yMean: yAt(avg) };
      }

      function paintSpark(cellIdx) {
        const r = refs[cellIdx];
        const g = geomFor(cellIdx);
        r.svg.setAttribute("viewBox", `0 0 ${g.w} ${g.h}`);
        r.mean.setAttribute("x1", "0");
        r.mean.setAttribute("x2", String(g.w));
        r.mean.setAttribute("y1", g.yMean.toFixed(1));
        r.mean.setAttribute("y2", g.yMean.toFixed(1));

        const pts = g.vals.map((v, k) => `${g.xAt(k).toFixed(1)},${g.yAt(v).toFixed(1)}`).join(" ");
        r.line.setAttribute("points", pts);

        const k = scrubIdx[cellIdx] >= 0 ? scrubIdx[cellIdx] : g.vals.length - 1;
        const px = g.xAt(k);
        const py = g.yAt(g.vals[k]);
        r.pt.setAttribute("x", (px - 2.25).toFixed(2));
        r.pt.setAttribute("y", (py - 2.25).toFixed(2));

        if (scrubIdx[cellIdx] >= 0) {
          r.cursor.setAttribute("x1", px.toFixed(1));
          r.cursor.setAttribute("x2", px.toFixed(1));
          r.cursor.setAttribute("opacity", "1");
          r.fig.textContent = g.m.fmt(g.vals[k]);
          r.delta.textContent = g.p.times[k];
        } else {
          r.cursor.setAttribute("opacity", "0");
        }
      }

      function setFocusCell(idx) {
        activeCell = idx;
        if (idx >= 0) {
          rovingCell = idx;
          stripEl.setAttribute("data-focusing", "");
          cellEls.forEach((c, i) => {
            if (i === idx) c.setAttribute("data-active", "");
            else c.removeAttribute("data-active");
            c.tabIndex = i === idx ? 0 : -1;
          });
        } else {
          stripEl.removeAttribute("data-focusing");
          cellEls.forEach((c, i) => {
            c.removeAttribute("data-active");
            c.tabIndex = i === rovingCell ? 0 : -1;
          });
        }
      }

      function resetScrub(idx) {
        if (scrubIdx[idx] === -1) return;
        scrubIdx[idx] = -1;
        const m = PERIODS[periodIdx].metrics[idx];
        refs[idx].fig.textContent = m.fig;
        refs[idx].delta.textContent = m.delta;
        paintSpark(idx);
      }

      function setPeriod(idx, immediate, byUser) {
        periodIdx = idx;
        const p = PERIODS[idx];
        periodBtns.forEach((btn, i) => {
          const on = i === idx;
          btn.setAttribute("aria-checked", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
          if (on) periodFrame.moveTo(btn, { immediate });
        });
        for (let i = 0; i < 4; i++) {
          scrubIdx[i] = -1;
          const m = p.metrics[i];
          if (immediate) {
            refs[i].fig.textContent = m.fig;
            refs[i].delta.textContent = m.delta;
          } else {
            ctx.swapText(refs[i].fig, m.fig);
            ctx.swapText(refs[i].delta, m.delta);
          }
          paintSpark(i);
        }
        if (byUser) {
          sr.textContent = `${p.label}: ${p.metrics.map((m) => `${m.name} ${m.fig}`).join(", ")}.`;
        }
      }

      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver((entries) => {
          for (const e of entries) {
            const idx = refs.findIndex((r) => r.spark === e.target);
            if (idx >= 0 && e.contentRect.width > 0) {
              widths[idx] = Math.round(e.contentRect.width);
              paintSpark(idx);
            }
          }
        });
        refs.forEach((r) => ro.observe(r.spark));
        ctx.signal.addEventListener("abort", () => ro.disconnect(), { once: true });
      }

      periodBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => setPeriod(i, false, true), { signal: ctx.signal });
      });

      periodsEl.addEventListener("keydown", (e) => {
        let next = periodIdx;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (periodIdx + 1) % PERIODS.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (periodIdx + PERIODS.length - 1) % PERIODS.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = PERIODS.length - 1;
        else return;
        e.preventDefault();
        periodBtns[next].focus({ preventScroll: true });
        setPeriod(next, false, true);
      }, { signal: ctx.signal });

      refs.forEach((r, i) => {
        const onScrubPointer = (e) => {
          const rect = r.spark.getBoundingClientRect();
          if (!rect.width) return;
          const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          const len = PERIODS[periodIdx].metrics[i].values.length;
          const k = Math.round(ratio * (len - 1));
          if (activeCell !== i) {
            for (let j = 0; j < 4; j++) if (j !== i) resetScrub(j);
            setFocusCell(i);
          }
          if (scrubIdx[i] !== k) {
            scrubIdx[i] = k;
            paintSpark(i);
          }
        };

        r.cell.addEventListener("pointerenter", (e) => {
          if (e.pointerType === "touch") return;
          onScrubPointer(e);
        }, { signal: ctx.signal });

        r.cell.addEventListener("pointermove", (e) => {
          if (e.pointerType === "touch") return;
          onScrubPointer(e);
        }, { signal: ctx.signal });

        r.cell.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "touch") onScrubPointer(e);
        }, { signal: ctx.signal });

        r.cell.addEventListener("pointerleave", () => {
          resetScrub(i);
        }, { signal: ctx.signal });

        r.cell.addEventListener("focus", () => {
          if (r.cell.matches(":focus-visible")) setFocusCell(i);
        }, { signal: ctx.signal });
      });

      stripEl.addEventListener("pointerleave", () => {
        for (let i = 0; i < 4; i++) resetScrub(i);
        if (!stripEl.contains(document.activeElement) || !document.activeElement.matches(":focus-visible")) {
          setFocusCell(-1);
        }
      }, { signal: ctx.signal });

      stripEl.addEventListener("focusout", (e) => {
        if (!stripEl.contains(e.relatedTarget)) {
          for (let i = 0; i < 4; i++) resetScrub(i);
          setFocusCell(-1);
        }
      }, { signal: ctx.signal });

      stripEl.addEventListener("keydown", (e) => {
        const len = PERIODS[periodIdx].metrics[rovingCell].values.length;
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
          e.preventDefault();
          resetScrub(rovingCell);
          const next = e.key === "ArrowRight" ? (rovingCell + 1) % 4 : (rovingCell + 3) % 4;
          cellEls[next].focus({ preventScroll: true });
          setFocusCell(next);
        } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
          e.preventDefault();
          setFocusCell(rovingCell);
          const cur = scrubIdx[rovingCell] >= 0 ? scrubIdx[rovingCell] : len - 1;
          const nextK = e.key === "ArrowUp" ? Math.min(len - 1, cur + 1) : Math.max(0, cur - 1);
          scrubIdx[rovingCell] = nextK;
          paintSpark(rovingCell);
          const p = PERIODS[periodIdx];
          const m = p.metrics[rovingCell];
          sr.textContent = `${m.name}, ${p.times[nextK]}: ${m.fmt(m.values[nextK])}`;
        } else if (e.key === "Escape") {
          resetScrub(rovingCell);
          setFocusCell(-1);
        }
      }, { signal: ctx.signal });

      requestAnimationFrame(() => {
        refs.forEach((r, i) => {
          if (r.spark.clientWidth > 0) widths[i] = Math.round(r.spark.clientWidth);
          paintSpark(i);
        });
      });

      setPeriod(0, true, false);
    },
  });
})();

.dd-line-chart .lc-vertex { transform-box: fill-box; transform-origin: center; transition: transform var(--dur-instant) var(--ease-out) }
.dd-line-chart .lc-vertex.is-scrub { transform: scale(1.35) }

.dd-line-chart .lc-direct { cursor: pointer }
.dd-line-chart .lc-direct-name { font: 500 12.5px/1 var(--font); fill: var(--ink); font-variant-numeric: tabular-nums; user-select: none }
.dd-line-chart .lc-direct-val { font-weight: 400; fill: var(--muted) }
.dd-line-chart .lc-svg[data-isolate] .lc-group[data-active] .lc-direct-val { fill: var(--ink); font-weight: 500 }
`,
    mount(host, ctx) {
      let pinnedKey = "all";
      let hoverKey = null;
      let scrubWeek = -1;
      /* Default desktop coordinate frame: viewBox="0 0 540 210", right margin 112px (x = 428..540).
         On narrow mobile (< 480px), adapts viewBox width to container px so all 12px SVG labels stay 1:1 legible. */
      let vbW = 540;
      let x0 = 44;
      let x1 = 420;
      let lblX = 428;

      const xAt = (i) => x0 + (i / (WEEKS.length - 1)) * (x1 - x0);

      host.innerHTML = `
<div class="lc">
  <div class="lc-top">
    <h3>Benchmark pass rate</h3>
    <div class="lc-series-nav" role="radiogroup" aria-label="Isolate model series">
      <button type="button" class="q in-frame" role="radio" data-key="all" aria-checked="true" tabindex="0">All</button>
      ${SERIES.map((s) => `<span class="lc-dot" aria-hidden="true">\u00b7</span><button type="button" class="q in-frame" role="radio" data-key="${s.key}" aria-checked="false" tabindex="-1">${s.name}</button>`).join("")}
    </div>
  </div>
  <div class="lc-readout">
    <span class="fig lc-fig">Week 8 \u00b7 Opus 96.4 %</span>
    <span class="lc-sub">Sonnet 91.8 % \u00b7 Haiku 79.2 %</span>
  </div>
  <div class="lc-plot" tabindex="0" role="group" aria-label="Benchmark pass rate across 8 weeks. Use Left and Right arrows to scrub weeks.">
    <svg class="lc-svg" viewBox="0 0 540 210" aria-hidden="true">
      <g class="lc-grid">
        ${Y_TICKS.map((t) => {
          const y = yAt(t).toFixed(1);
          return `<line class="lc-hrule" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1" shape-rendering="crispEdges"></line>
          <text x="${x0 - 8}" y="${y}" text-anchor="end" dominant-baseline="central" class="lc-axis-lbl">${t} %</text>`;
        }).join("")}
      </g>
      <g class="lc-weeks">
        ${WEEKS.map((w, i) => `<text x="${xAt(i).toFixed(1)}" y="198" text-anchor="middle" class="lc-week-lbl" data-w="${i}">${w}</text>`).join("")}
      </g>
      <line class="lc-scrub" x1="0" x2="0" y1="${Y_TOP}" y2="${Y_BOT}" stroke="var(--ink)" stroke-width="1" shape-rendering="crispEdges" opacity="0"></line>
      <g class="lc-series-wrap">
        ${SERIES.map((s) => {
          const pts = s.values.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(" ");
          const lastVal = s.values[s.values.length - 1];
          const yEnd = yAt(lastVal).toFixed(1);
          return `
          <g class="lc-group" data-series="${s.key}">
            <polyline class="lc-poly" points="${pts}" fill="none" stroke="${s.hue}" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="butt"></polyline>
            ${s.values.map((v, i) => `<rect class="lc-vertex" data-w="${i}" x="${(xAt(i) - 2.25).toFixed(2)}" y="${(yAt(v) - 2.25).toFixed(2)}" width="4.5" height="4.5" fill="${s.hue}"></rect>`).join("")}
            <g class="lc-direct" data-series="${s.key}">
              <rect class="lc-direct-hit" x="${lblX - 4}" y="${(Number(yEnd) - 12).toFixed(1)}" width="${vbW - lblX + 4}" height="24" fill="transparent"></rect>
              <text x="${lblX}" y="${yEnd}" dominant-baseline="central" class="lc-direct-name">${s.name} <tspan class="lc-direct-val">${lastVal.toFixed(1)}%</tspan></text>
            </g>
          </g>`;
        }).join("")}
      </g>
      <rect class="lc-hit" x="${x0 - 10}" y="${Y_TOP - 8}" width="${x1 - x0 + 20}" height="${Y_BOT - Y_TOP + 28}" fill="transparent" style="cursor:crosshair"></rect>
    </svg>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const navEl = host.querySelector(".lc-series-nav");
      const navBtns = [...navEl.querySelectorAll('[role="radio"]')];
      const figEl = host.querySelector(".lc-fig");
      const subEl = host.querySelector(".lc-sub");
      const plotEl = host.querySelector(".lc-plot");
      const svgEl = host.querySelector(".lc-svg");
      const hRules = [...svgEl.querySelectorAll(".lc-hrule")];
      const axisLbls = [...svgEl.querySelectorAll(".lc-axis-lbl")];
      const scrubLine = host.querySelector(".lc-scrub");
      const weekLbls = [...host.querySelectorAll(".lc-week-lbl")];
      const groups = [...host.querySelectorAll(".lc-group")];
      const directEls = [...host.querySelectorAll(".lc-direct")];
      const hitRect = host.querySelector(".lc-hit");
      const sr = host.querySelector("[aria-live]");

      const navFrame = ctx.brackets(navEl, { padX: 6, padY: 2, exactPad: true });

      function applyGeometry(containerW) {
        if (containerW > 0 && containerW < 480) {
          vbW = Math.max(276, Math.round(containerW));
          x0 = 40;
          const rightMargin = vbW < 320 ? 86 : 96;
          x1 = vbW - rightMargin;
          lblX = x1 + 8;
        } else {
          vbW = 540;
          x0 = 44;
          x1 = 420;
          lblX = 428;
        }

        svgEl.setAttribute("viewBox", `0 0 ${vbW} 210`);
        hRules.forEach((ln) => {
          ln.setAttribute("x1", String(x0));
          ln.setAttribute("x2", String(x1));
        });
        axisLbls.forEach((tx) => tx.setAttribute("x", String(x0 - 6)));
        weekLbls.forEach((tx, i) => tx.setAttribute("x", xAt(i).toFixed(1)));
        hitRect.setAttribute("x", String(x0 - 10));
        hitRect.setAttribute("width", String(x1 - x0 + 20));

        groups.forEach((g) => {
          const s = SERIES.find((item) => item.key === g.dataset.series);
          const poly = g.querySelector(".lc-poly");
          poly.setAttribute("points", s.values.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(" "));
          const rects = g.querySelectorAll(".lc-vertex");
          rects.forEach((r, i) => {
            r.setAttribute("x", (xAt(i) - 2.25).toFixed(2));
            r.setAttribute("y", (yAt(s.values[i]) - 2.25).toFixed(2));
          });
          const dHit = g.querySelector(".lc-direct-hit");
          const dTxt = g.querySelector(".lc-direct-name");
          dHit.setAttribute("x", String(lblX - 4));
          dHit.setAttribute("width", String(Math.max(76, vbW - lblX + 4)));
          dTxt.setAttribute("x", String(lblX));
        });

        if (scrubWeek >= 0) {
          const sx = xAt(scrubWeek).toFixed(1);
          scrubLine.setAttribute("x1", sx);
          scrubLine.setAttribute("x2", sx);
        }
      }

      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver((entries) => {
          for (const e of entries) {
            if (e.contentRect.width > 0) applyGeometry(e.contentRect.width);
          }
        });
        ro.observe(plotEl);
        ctx.signal.addEventListener("abort", () => ro.disconnect(), { once: true });
      }

      function effectiveSeries() {
        if (hoverKey) return hoverKey;
        return pinnedKey === "all" ? null : pinnedKey;
      }

      function syncState(animateText) {
        const iso = effectiveSeries();
        if (iso) {
          svgEl.setAttribute("data-isolate", iso);
          groups.forEach((g) => {
            if (g.dataset.series === iso) g.setAttribute("data-active", "");
            else g.removeAttribute("data-active");
          });
        } else {
          svgEl.removeAttribute("data-isolate");
          groups.forEach((g) => g.removeAttribute("data-active"));
        }

        const w = scrubWeek >= 0 ? scrubWeek : WEEKS.length - 1;
        if (scrubWeek >= 0) {
          const x = xAt(scrubWeek).toFixed(1);
          scrubLine.setAttribute("x1", x);
          scrubLine.setAttribute("x2", x);
          scrubLine.setAttribute("opacity", "1");
        } else {
          scrubLine.setAttribute("opacity", "0");
        }

        weekLbls.forEach((lbl, idx) => lbl.classList.toggle("is-on", idx === scrubWeek));
        groups.forEach((g) => {
          const s = SERIES.find((x) => x.key === g.dataset.series);
          const dval = g.querySelector(".lc-direct-val");
          dval.textContent = s.values[w].toFixed(1) + "%";
          const rects = g.querySelectorAll(".lc-vertex");
          rects.forEach((r, idx) => r.classList.toggle("is-scrub", idx === scrubWeek));
        });

        let figStr = "";
        let subStr = "";
        if (scrubWeek >= 0) {
          const focusS = iso ? SERIES.find((s) => s.key === iso) : SERIES[0];
          figStr = `Week ${w + 1} \u00b7 ${focusS.name} ${focusS.values[w].toFixed(1)} %`;
          subStr = SERIES.map((s) => `${s.name} ${s.values[w].toFixed(1)} %`).join(" \u00b7 ");
        } else if (iso) {
          const s = SERIES.find((x) => x.key === iso);
          const delta = (s.values[7] - s.values[0]).toFixed(1);
          figStr = `Week 8 \u00b7 ${s.name} ${s.values[7].toFixed(1)} %`;
          subStr = `+${delta} pts vs W1 (${s.values[0].toFixed(1)} %)`;
        } else {
          figStr = "Week 8 \u00b7 Opus 96.4 %";
          subStr = "Sonnet 91.8 % \u00b7 Haiku 79.2 %";
        }

        if (animateText) {
          ctx.swapText(figEl, figStr);
          ctx.swapText(subEl, subStr);
        } else {
          figEl.textContent = figStr;
          subEl.textContent = subStr;
        }
      }

      function setPinned(key, immediate, byUser) {
        pinnedKey = key;
        navBtns.forEach((btn) => {
          const on = btn.dataset.key === key;
          btn.setAttribute("aria-checked", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
          if (on) navFrame.moveTo(btn, { immediate });
        });
        syncState(!immediate);
        if (byUser) {
          if (key === "all") sr.textContent = "Showing all three models.";
          else {
            const s = SERIES.find((x) => x.key === key);
            sr.textContent = `Isolated ${s.name}: Week 8 ${s.values[7].toFixed(1)} %.`;
          }
        }
      }

      navBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const next = btn.dataset.key === pinnedKey && pinnedKey !== "all" ? "all" : btn.dataset.key;
          setPinned(next, false, true);
        }, { signal: ctx.signal });
      });

      navEl.addEventListener("keydown", (e) => {
        const idx = navBtns.findIndex((b) => b.dataset.key === pinnedKey);
        let next = idx;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (idx + 1) % navBtns.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (idx + navBtns.length - 1) % navBtns.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = navBtns.length - 1;
        else return;
        e.preventDefault();
        navBtns[next].focus({ preventScroll: true });
        setPinned(navBtns[next].dataset.key, false, true);
      }, { signal: ctx.signal });

      directEls.forEach((el) => {
        const key = el.dataset.series;
        el.addEventListener("pointerenter", (e) => {
          if (e.pointerType === "touch") return;
          hoverKey = key;
          syncState(false);
        }, { signal: ctx.signal });
        el.addEventListener("pointerleave", () => {
          hoverKey = null;
          syncState(false);
        }, { signal: ctx.signal });
        el.addEventListener("click", () => {
          hoverKey = null;
          const next = pinnedKey === key ? "all" : key;
          setPinned(next, false, true);
        }, { signal: ctx.signal });
      });

      function scrubFromPointer(e) {
        const rect = svgEl.getBoundingClientRect();
        if (!rect.width) return;
        const svgX = ((e.clientX - rect.left) / rect.width) * vbW;
        const ratio = Math.max(0, Math.min(1, (svgX - x0) / (x1 - x0)));
        const idx = Math.round(ratio * (WEEKS.length - 1));
        if (scrubWeek !== idx) {
          scrubWeek = idx;
          syncState(false);
        }
      }

      hitRect.addEventListener("pointerenter", (e) => {
        if (e.pointerType === "touch") return;
        scrubFromPointer(e);
      }, { signal: ctx.signal });
      hitRect.addEventListener("pointermove", (e) => {
        if (e.pointerType === "touch") return;
        scrubFromPointer(e);
      }, { signal: ctx.signal });
      hitRect.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "touch") scrubFromPointer(e);
      }, { signal: ctx.signal });
      hitRect.addEventListener("pointerleave", () => {
        scrubWeek = -1;
        syncState(false);
      }, { signal: ctx.signal });

      plotEl.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
          const cur = scrubWeek >= 0 ? scrubWeek : WEEKS.length - 1;
          scrubWeek = e.key === "ArrowLeft" ? Math.max(0, cur - 1) : Math.min(WEEKS.length - 1, cur + 1);
          syncState(false);
          sr.textContent = `Week ${scrubWeek + 1}: ${SERIES.map((s) => `${s.name} ${s.values[scrubWeek].toFixed(1)} %`).join(", ")}.`;
        } else if (e.key === "Escape") {
          scrubWeek = -1;
          syncState(false);
        }
      }, { signal: ctx.signal });

      plotEl.addEventListener("blur", () => {
        if (scrubWeek >= 0) {
          scrubWeek = -1;
          syncState(false);
        }
      }, { signal: ctx.signal });

      requestAnimationFrame(() => {
        if (plotEl.clientWidth > 0) applyGeometry(plotEl.clientWidth);
      });
      setPinned("all", true, false);
    },
  });
})();

</script>
<script>
/* 03-bar-chart.js */
/* Tufte Cut Bar Chart (Plain Data): single-quantity token breakdown across 6 agent turn stages in pure --ink,
   rising from a 1px --line-control baseline via scaleY, sliced by 1.5px --page white-paper scale cuts at 10k,
   20k, and 30k so zero gridlines clutter empty air. */
(function () {
  const STAGES = ["Read", "Search", "Plan", "Edit", "Test", "Review"];
  const MODES = [
    {
      key: "mean",
      label: "Mean",
      total: 84.2,
      sub: "total per turn",
      values: [14.6, 9.8, 28.4, 16.2, 10.4, 4.8],
    },
    {
      key: "p95",
      label: "p95",
      total: 129.0,
      sub: "p95 total per turn",
      values: [21.2, 15.4, 36.8, 26.5, 19.6, 9.5],
    },
  ];
  const MAX_SCALE = 38;
  const CUTS = [10, 20, 30];

  PlainPlayer.registerData({
    slug: "bar-chart",
    chapter: "charts",
    span: "half",
    title: "Tufte Cut Bar Chart",
    css: `
.dd-bar-chart .bc { display: grid; gap: 14px }
.dd-bar-chart .bc-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px }
.dd-bar-chart .bc-top h3 { margin: 0; font: 500 15px/1.3 var(--font); letter-spacing: -0.01em; color: var(--ink) }
.dd-bar-chart .bc-modes { position: relative; display: inline-flex; align-items: center; gap: 12px; padding: 2px 8px }
.dd-bar-chart .bc-modes .q { min-height: 28px; font-size: 13px }
.dd-bar-chart .bc-dot { font-size: 13px; color: var(--muted); opacity: var(--unselected); user-select: none; pointer-events: none }

.dd-bar-chart .bc-readout { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 14px; min-height: 28px }
.dd-bar-chart .bc-fig { font-size: 22px; font-weight: 500; line-height: 1.15; letter-spacing: -0.022em }
.dd-bar-chart .bc-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }

.dd-bar-chart .bc-chart { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 0 10px; padding-top: 6px }
.dd-bar-chart .bc-yaxis { position: relative; height: 170px; pointer-events: none; user-select: none }
.dd-bar-chart .bc-ytick { position: absolute; right: 0; transform: translateY(50%); font-size: 12px; line-height: 1;
  color: var(--muted); font-variant-numeric: tabular-nums }

.dd-bar-chart .bc-stage-area { position: relative; min-width: 0 }
/* Tufte white-paper scale cuts: 1.5px --page lines slice cleanly across ink bars while staying invisible over empty air. */
.dd-bar-chart .bc-cuts { position: absolute; left: 0; right: 0; top: 0; height: 170px; pointer-events: none; z-index: 2 }
.dd-bar-chart .bc-cut { position: absolute; left: 0; right: 0; height: 1.5px; background: var(--page); transform: translateY(50%) }
.dd-bar-chart .bc-baseline { position: absolute; left: 0; right: 0; top: 170px; height: 1px; background: var(--line-control); pointer-events: none; z-index: 3 }

.dd-bar-chart .bc-cols { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px }
.dd-bar-chart .bc-col { position: relative; display: grid; grid-template-rows: 170px auto; justify-items: center; padding: 0; border: 0;
  background: none; cursor: pointer; -webkit-tap-highlight-color: transparent }
.dd-bar-chart .bc-col:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px }

.dd-bar-chart .bc-well { width: 100%; height: 170px; display: flex; align-items: flex-end; justify-content: center }
.dd-bar-chart .bc-bar { width: 100%; max-width: 46px; height: 100%; background: var(--ink);
  transform-origin: bottom; transform: scaleY(var(--sy, 0));
  transition: transform var(--dur-settle) var(--ease-settle), opacity var(--dur-pare) var(--ease-out);
  will-change: transform, opacity }

.dd-bar-chart .bc-lbl { margin-top: 10px; font-size: 12.5px; line-height: 1.2; color: var(--muted); white-space: nowrap;
  transition: color var(--dur-instant) var(--ease-out), opacity var(--dur-pare) var(--ease-out) }
.dd-bar-chart .bc-col[data-active] .bc-lbl { color: var(--ink); font-weight: 500 }

.dd-bar-chart .bc-cols[data-focusing] .bc-col:not([data-active]) .bc-bar,
.dd-bar-chart .bc-cols[data-focusing] .bc-col:not([data-active]) .bc-lbl { opacity: 0.20 }

@container (max-width: 360px) {
  .dd-bar-chart .bc-chart { grid-template-columns: 28px minmax(0, 1fr); gap: 0 6px }
  .dd-bar-chart .bc-cols { gap: 5px }
  .dd-bar-chart .bc-lbl { font-size: 11.5px }
}
`,
    mount(host, ctx) {
      let modeIdx = 0;
      let activeIdx = -1;
      let rovingIdx = 2;

      host.innerHTML = `
<div class="bc">
  <div class="bc-top">
    <h3>Tokens by turn stage</h3>
    <div class="bc-modes" role="radiogroup" aria-label="Token aggregation">
      ${MODES.map((m, i) => `${i > 0 ? '<span class="bc-dot" aria-hidden="true">\u00b7</span>' : ""}<button type="button" class="q in-frame" role="radio" data-idx="${i}" aria-checked="${i === 0 ? "true" : "false"}" tabindex="${i === 0 ? "0" : "-1"}">${m.label}</button>`).join("")}
    </div>
  </div>
  <div class="bc-readout">
    <span class="fig bc-fig">84.2k tok</span>
    <span class="bc-sub">total per turn</span>
  </div>
  <div class="bc-chart">
    <div class="bc-yaxis" aria-hidden="true">
      ${CUTS.map((k) => `<span class="bc-ytick" style="bottom:${((k / MAX_SCALE) * 100).toFixed(2)}%">${k}k</span>`).join("")}
    </div>
    <div class="bc-stage-area">
      <div class="bc-cuts" aria-hidden="true">
        ${CUTS.map((k) => `<i class="bc-cut" style="bottom:${((k / MAX_SCALE) * 100).toFixed(2)}%"></i>`).join("")}
      </div>
      <div class="bc-baseline" aria-hidden="true"></div>
      <div class="bc-cols" role="group" aria-label="Turn stages">
        ${STAGES.map((st, i) => `
        <button type="button" class="bc-col" data-idx="${i}" tabindex="${i === 2 ? "0" : "-1"}">
          <span class="bc-well" aria-hidden="true"><span class="bc-bar"></span></span>
          <span class="bc-lbl">${st}</span>
        </button>`).join("")}
      </div>
    </div>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const modesEl = host.querySelector(".bc-modes");
      const modeBtns = [...modesEl.querySelectorAll('[role="radio"]')];
      const figEl = host.querySelector(".bc-fig");
      const subEl = host.querySelector(".bc-sub");
      const colsWrap = host.querySelector(".bc-cols");
      const colBtns = [...colsWrap.querySelectorAll(".bc-col")];
      const barEls = colBtns.map((b) => b.querySelector(".bc-bar"));
      const lblEls = colBtns.map((b) => b.querySelector(".bc-lbl"));
      const sr = host.querySelector("[aria-live]");

      const modeFrame = ctx.brackets(modesEl, { padX: 7, padY: 2, exactPad: true });
      const stageFrame = ctx.brackets(colsWrap, { padX: 5, padY: 2, size: 5, exactPad: true });

      function syncReadout(animate) {
        const m = MODES[modeIdx];
        let figStr = `${m.total.toFixed(1)}k tok`;
        let subStr = m.sub;

        if (activeIdx >= 0) {
          const val = m.values[activeIdx];
          const pct = Math.round((val / m.total) * 100);
          figStr = `${STAGES[activeIdx]} \u00b7 ${val.toFixed(1)}k tok \u00b7 ${pct} %`;
          subStr = `of ${m.total.toFixed(1)}k ${m.label.toLowerCase()} turn`;
        }

        if (animate) {
          ctx.swapText(figEl, figStr);
          ctx.swapText(subEl, subStr);
        } else {
          figEl.textContent = figStr;
          subEl.textContent = subStr;
        }
      }

      function paintBars() {
        const m = MODES[modeIdx];
        colBtns.forEach((btn, i) => {
          const v = m.values[i];
          const pct = Math.round((v / m.total) * 100);
          barEls[i].style.setProperty("--sy", (v / MAX_SCALE).toFixed(4));
          btn.setAttribute("aria-label", `${STAGES[i]}: ${v.toFixed(1)}k tokens (${pct} % of ${m.label})`);
        });
      }

      function setMode(idx, immediate, byUser) {
        modeIdx = idx;
        modeBtns.forEach((btn, i) => {
          const on = i === idx;
          btn.setAttribute("aria-checked", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
          if (on) modeFrame.moveTo(btn, { immediate });
        });
        paintBars();
        syncReadout(!immediate);
        if (byUser) {
          const m = MODES[idx];
          sr.textContent = `${m.label}: ${m.total.toFixed(1)}k tokens per turn.`;
        }
      }

      function setActiveBar(idx, immediate) {
        activeIdx = idx;
        if (idx >= 0) {
          rovingIdx = idx;
          colsWrap.setAttribute("data-focusing", "");
          colBtns.forEach((btn, i) => {
            if (i === idx) btn.setAttribute("data-active", "");
            else btn.removeAttribute("data-active");
            btn.tabIndex = i === idx ? 0 : -1;
          });
          stageFrame.moveTo(lblEls[idx], { immediate });
        } else {
          colsWrap.removeAttribute("data-focusing");
          colBtns.forEach((btn, i) => {
            btn.removeAttribute("data-active");
            btn.tabIndex = i === rovingIdx ? 0 : -1;
          });
          stageFrame.pare();
        }
        syncReadout(false);
      }

      modeBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => setMode(i, false, true), { signal: ctx.signal });
      });

      modesEl.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight" && e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
        e.preventDefault();
        const next = (modeIdx + 1) % MODES.length;
        modeBtns[next].focus({ preventScroll: true });
        setMode(next, false, true);
      }, { signal: ctx.signal });

      colBtns.forEach((btn, i) => {
        btn.addEventListener("pointerenter", (e) => {
          if (e.pointerType === "touch") return;
          setActiveBar(i, false);
        }, { signal: ctx.signal });
        btn.addEventListener("click", () => {
          if (activeIdx === i && !btn.matches(":focus-visible")) setActiveBar(-1, false);
          else setActiveBar(i, false);
        }, { signal: ctx.signal });
        btn.addEventListener("focus", () => {
          if (btn.matches(":focus-visible")) setActiveBar(i, false);
        }, { signal: ctx.signal });
      });

      colsWrap.addEventListener("pointerleave", () => {
        if (!colsWrap.contains(document.activeElement) || !document.activeElement.matches(":focus-visible")) {
          setActiveBar(-1, false);
        }
      }, { signal: ctx.signal });

      colsWrap.addEventListener("focusout", (e) => {
        if (!colsWrap.contains(e.relatedTarget)) setActiveBar(-1, false);
      }, { signal: ctx.signal });

      colsWrap.addEventListener("keydown", (e) => {
        let next = rovingIdx;
        if (e.key === "ArrowRight") next = (rovingIdx + 1) % STAGES.length;
        else if (e.key === "ArrowLeft") next = (rovingIdx + STAGES.length - 1) % STAGES.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = STAGES.length - 1;
        else if (e.key === "Escape") { setActiveBar(-1, false); return; }
        else return;
        e.preventDefault();
        colBtns[next].focus({ preventScroll: true });
        setActiveBar(next, false);
      }, { signal: ctx.signal });

      setMode(0, true, false);
    },
  });
})();

</script>
<script>

  PlainPlayer.registerData({

    span: "half",
    title: "Stacked Composition",
    css: `
.dd-stacked-breakdown .sb { display: grid; gap: 14px }

.dd-stacked-breakdown .sb-day-lbl.is-on { color: var(--ink); font-weight: 500 }

.dd-stacked-breakdown .sb-table { position: relative; display: grid; margin-top: 2px; border-bottom: 1px solid var(--line) }
.dd-stacked-breakdown .sb-row { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto 44px; align-items: center;
  gap: 10px; width: 100%; padding: 8px 0; border: 0; border-top: 1px solid var(--line); background: none;
  text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: opacity var(--dur-pare) var(--ease-out) }
.dd-stacked-breakdown .sb-row:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.dd-stacked-breakdown .sb-sw { width: 8px; height: 8px; background: var(--hue) }
.dd-stacked-breakdown .sb-name { display: inline-block; justify-self: start; font-size: 14px; font-weight: 400; color: var(--ink) }
.dd-stacked-breakdown .sb-row[data-active] .sb-name { font-weight: 500 }
.dd-stacked-breakdown .sb-amt { font-size: 13.5px; color: var(--ink); font-variant-numeric: tabular-nums; text-align: right }
.dd-stacked-breakdown .sb-pct { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right }

/* Subtract the other 3 categories across ALL 7 columns AND in the table to 0.16 opacity. */
.dd-stacked-breakdown .sb[data-focusing] .sb-seg:not([data-active]),
.dd-stacked-breakdown .sb[data-focusing] .sb-row:not([data-active]) { opacity: 0.16 }

@container (max-width: 360px) {
  .dd-stacked-breakdown .sb-cols,
  .dd-stacked-breakdown .sb-days { gap: 6px }

`,
    mount(host, ctx) {
      let pinnedIdx = -1;
      let hoverIdx = -1;
      let hoverDay = -1;
      let rovingIdx = 0;

      const dayTotals = DAYS.map((_, d) => TOOLS.reduce((sum, t) => sum + t.daily[d], 0));

      host.innerHTML = `
<div class="sb">
  <div class="sb-top">
    <h3>Weekly spend by tool</h3>
    <span class="sb-meta">7 days \u00b7 894 runs</span>
  </div>
  <div class="sb-readout">
    <span class="fig sb-fig">$98.40</span>
    <span class="sb-sub">total across 4 tools</span>
  </div>
  <div class="sb-bars-wrap" aria-hidden="true">
    <div class="sb-cols">
      ${DAYS.map((_, d) => `
      <div class="sb-day-col" data-day="${d}">
        ${TOOLS.map((t, ti) => {
          const h = Math.max(2, (t.daily[d] / MAX_DAY) * USABLE_H);
          return `<span class="sb-seg" data-tool="${ti}" data-day="${d}" style="--hue:${t.hue};height:${h.toFixed(2)}px"></span>`;
        }).join("")}
      </div>`).join("")}
    </div>
    <div class="sb-days">
      ${DAYS.map((day, d) => `<span class="sb-day-lbl" data-day="${d}">${day}</span>`).join("")}
    </div>
  </div>
  <div class="sb-table" role="group" aria-label="Spend breakdown by tool">
    ${TOOLS.map((t, i) => `
    <button type="button" class="sb-row" data-tool="${i}" tabindex="${i === 0 ? "0" : "-1"}" aria-pressed="false" style="--hue:${t.hue}">
      <i class="sb-sw" aria-hidden="true"></i>
      <span class="sb-name">${t.name}</span>
      <span class="sb-amt">$${t.total.toFixed(2)}</span>
      <span class="sb-pct">${t.share} %</span>

  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const rootEl = host.querySelector(".sb");
      const figEl = host.querySelector(".sb-fig");
      const subEl = host.querySelector(".sb-sub");
      const segEls = [...host.querySelectorAll(".sb-seg")];
      const dayLbls = [...host.querySelectorAll(".sb-day-lbl")];
      const tableEl = host.querySelector(".sb-table");
      const rowEls = [...tableEl.querySelectorAll(".sb-row")];
      const nameEls = rowEls.map((r) => r.querySelector(".sb-name"));
      const sr = host.querySelector("[aria-live]");

      const rowFrame = ctx.brackets(tableEl, { padX: 6, padY: 2, size: 5, exactPad: true });

      function currentTool() {
        return hoverIdx >= 0 ? hoverIdx : pinnedIdx;
      }

      function syncUI(animateText) {
        const idx = currentTool();
        if (idx >= 0) {
          rootEl.setAttribute("data-focusing", "");
          segEls.forEach((s) => {
            if (Number(s.dataset.tool) === idx) s.setAttribute("data-active", "");
            else s.removeAttribute("data-active");
          });
          rowEls.forEach((r, i) => {
            if (i === idx) r.setAttribute("data-active", "");
            else r.removeAttribute("data-active");
          });
          rowFrame.moveTo(nameEls[idx], { immediate: false });
        } else {
          rootEl.removeAttribute("data-focusing");
          segEls.forEach((s) => s.removeAttribute("data-active"));
          rowEls.forEach((r) => r.removeAttribute("data-active"));
          rowFrame.pare();
        }

        rowEls.forEach((r, i) => {
          r.setAttribute("aria-pressed", pinnedIdx === i ? "true" : "false");
        });
        dayLbls.forEach((l, d) => l.classList.toggle("is-on", d === hoverDay));

        let figStr = `$${GRAND_TOTAL.toFixed(2)}`;
        let subStr = "total across 4 tools";
        if (idx >= 0) {
          const t = TOOLS[idx];
          figStr = `${t.name} \u00b7 $${t.total.toFixed(2)} \u00b7 ${t.share} %`;
          if (hoverDay >= 0) {
            subStr = `${DAYS[hoverDay]} \u00b7 $${t.daily[hoverDay].toFixed(2)} of $${dayTotals[hoverDay].toFixed(2)}`;
          } else {
            subStr = `$${(t.total / 7).toFixed(2)} / day avg \u00b7 peak Wed $${t.daily[2].toFixed(2)}`;
          }
        }

        if (animateText) {
          ctx.swapText(figEl, figStr);
          ctx.swapText(subEl, subStr);
        } else {
          figEl.textContent = figStr;
          subEl.textContent = subStr;
        }
      }

      function togglePin(idx, byUser) {
        pinnedIdx = pinnedIdx === idx ? -1 : idx;
        rovingIdx = idx;
        rowEls.forEach((r, i) => (r.tabIndex = i === rovingIdx ? 0 : -1));
        syncUI(true);
        if (byUser) {
          if (pinnedIdx >= 0) {
            const t = TOOLS[pinnedIdx];
            sr.textContent = `${t.name}: $${t.total.toFixed(2)}, ${t.share} percent of weekly spend.`;
          } else {
            sr.textContent = `All tools: $${GRAND_TOTAL.toFixed(2)} weekly spend.`;
          }
        }
      }

      segEls.forEach((seg) => {
        const ti = Number(seg.dataset.tool);
        const di = Number(seg.dataset.day);
        seg.addEventListener("pointerenter", (e) => {
          if (e.pointerType === "touch") return;
          hoverIdx = ti;
          hoverDay = di;
          syncUI(false);
        }, { signal: ctx.signal });
        seg.addEventListener("pointerleave", () => {
          hoverIdx = -1;
          hoverDay = -1;
          syncUI(false);
        }, { signal: ctx.signal });
        seg.addEventListener("click", () => {
          hoverIdx = -1;
          hoverDay = -1;
          togglePin(ti, true);
        }, { signal: ctx.signal });
      });

      rowEls.forEach((row, i) => {
        row.addEventListener("pointerenter", (e) => {
          if (e.pointerType === "touch") return;
          hoverIdx = i;
          hoverDay = -1;
          syncUI(false);
        }, { signal: ctx.signal });
        row.addEventListener("pointerleave", () => {
          hoverIdx = -1;
          syncUI(false);
        }, { signal: ctx.signal });
        row.addEventListener("click", () => {
          hoverIdx = -1;
          togglePin(i, true);
        }, { signal: ctx.signal });
        row.addEventListener("focus", () => {
          if (row.matches(":focus-visible")) {
            rovingIdx = i;
            hoverIdx = i;
            syncUI(false);
          }
        }, { signal: ctx.signal });
      });

      tableEl.addEventListener("focusout", (e) => {
        if (!tableEl.contains(e.relatedTarget)) {
          hoverIdx = -1;
          syncUI(false);
        }
      }, { signal: ctx.signal });

      tableEl.addEventListener("keydown", (e) => {
        let next = rovingIdx;
        if (e.key === "ArrowDown" || e.key === "ArrowRight") next = (rovingIdx + 1) % TOOLS.length;
        else if (e.key === "ArrowUp" || e.key === "ArrowLeft") next = (rovingIdx + TOOLS.length - 1) % TOOLS.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = TOOLS.length - 1;
        else if (e.key === "Escape") {
          pinnedIdx = -1;
          hoverIdx = -1;
          syncUI(false);
          return;
        } else return;
        e.preventDefault();
        rovingIdx = next;
        rowEls.forEach((r, i) => (r.tabIndex = i === next ? 0 : -1));
        rowEls[next].focus({ preventScroll: true });
        hoverIdx = next;
        syncUI(false);
      }, { signal: ctx.signal });
    },
  });
})();
