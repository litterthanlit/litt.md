      const statusEl = host.querySelector(".th-status");
      const bodyEl = host.querySelector(".th-body");
      const barEl = host.querySelector(".th-bar");
      const toggleBtn = host.querySelector(".th-toggle");
      const replayBtn = host.querySelector(".th-replay");
      const notesEl = host.querySelector(".th-notes");
      const answerEl = host.querySelector(".th-answer");

      const noteEls = [...notesEl.querySelectorAll(".th-note")];

      let phase = "thinking";

      let busy = false;

        el.style.pointerEvents = "";

        el.hidden = false;

      function setLiveNote(idx) {
        notesEl.classList.remove("is-expanded");
        noteEls.forEach((li, i) => {
          li.hidden = i > idx;
          li.classList.toggle("is-live", i === idx);
        });
      }

      function landAnswer(byUser) {
        if (phase !== "thinking" || busy) return;
        phase = "done";
        busy = true;
        openNotes = false;
        runToken++;
        noteEls.forEach((li) => { li.hidden = false; li.classList.remove("is-live"); });
        ctx.swapText(statusEl, "Answered");
        ctx.pareOut(notesEl, () => {

            sr.textContent = "Answered. Thought for 4 seconds, 3 notes folded.";
            toggleBtn.focus({ preventScroll: true });

        });

        } else {
          ctx.pareOut(notesEl, () => {
            if (!openNotes && phase === "done") notesEl.hidden = true;
          });
          sr.textContent = "Reasoning notes hidden.";
        }

      function startThinking(byUser) {
        if (busy) return;
        const myToken = ++runToken;
        phase = "thinking";
        openNotes = false;
        ctx.flip(bodyEl, () => {
          barEl.hidden = true;
          answerEl.hidden = true;
          restoreEl(notesEl);
          setLiveNote(0);

        if (byUser) sr.textContent = "Thinking through 3 notes.";

        const step = byUser ? ctx.after : ctx.demoAfter;
        step(650, () => {
          if (runToken !== myToken || phase !== "thinking") return;
          ctx.flip(notesEl, () => setLiveNote(1));
          ctx.swapText(statusEl, "Thinking · 2 s");

            ctx.flip(notesEl, () => setLiveNote(2));

      toggleBtn.addEventListener("click", toggleNotes, { signal: ctx.signal });
      replayBtn.addEventListener("click", () => startThinking(true), { signal: ctx.signal });

      ctx.onHand(() => {
        if (phase === "thinking") {
          const t = ++runToken;
          ctx.after(700, () => {
            if (runToken === t && phase === "thinking") landAnswer(false);
          });

      function scheduleCycle() {
        ctx.demoAfter(2800, () => {
          startThinking(false);
        });
      }

      if (ctx.reduced()) {
        phase = "done";
        notesEl.hidden = true;
        barEl.hidden = false;
        answerEl.hidden = false;
        statusEl.textContent = "Answered";
      } else {
        ctx.demoAfter(1800, () => {
          landAnswer(false);
          scheduleCycle();
        });
      }
    },
  });

  <div class="ta-head">
    <h3>Fix session expiry</h3>

    </div>
  </div>
  <div class="ta-foot" hidden>
    <span class="ta-summary muted"></span>

  </div>
  <p class="sr-only" aria-live="polite"></p>

      const list = host.querySelector(".ta-list");
      const status = host.querySelector(".ta-status");
      const foot = host.querySelector(".ta-foot");
      const summary = host.querySelector(".ta-summary");
      const replay = host.querySelector(".ta-replay");
      const sr = host.querySelector("[aria-live]");
      let state = "waiting";
      let busy = false;

      function decide(kind, byUser) {
        if (state !== "waiting" || busy) return;
        state = kind;
        busy = true;
        const gate = list.querySelector(".ta-gate");
        const word = kind === "skip" ? "Skipped" : kind === "session" ? "Allowed (always)" : "Allowed";
        const note = kind === "skip" ? "Kept local" : "PR #184 updated";
        list.removeAttribute("data-focusing");

          list.appendChild(row);

          summary.textContent = note;
          status.classList.add("is-done");
          ctx.swapText(status, kind === "skip" ? "Stopped" : "Done");
          if (byUser) { sr.textContent = word + ". " + note; replay.focus({ preventScroll: true }); }
        });
      }

      function reset(byUser) {
        if (state === "waiting" || busy) return;
        state = "waiting";
        ctx.flip(list, () => {
          list.querySelectorAll(".ta-gate").forEach((g) => g.remove());
          const second = list.querySelectorAll(".ta-row")[1];
          if (second) second.remove();

        <button type="button" class="q" data-act="session">Always allow</button>
        <button type="button" class="q" data-act="skip">Skip</button>
      </div>`;
          list.appendChild(gate);
          list.setAttribute("data-focusing", "");
          bindGate(gate);
        });
        status.classList.remove("is-done");
        ctx.swapText(status, "Needs your OK");
        if (byUser) {
          const allowBtn = list.querySelector('[data-act="allow"]');
          if (allowBtn) allowBtn.focus({ preventScroll: true });
        }
      }

      function bindGate(gate) {
        for (const btn of gate.querySelectorAll("[data-act]")) {
          btn.addEventListener("click", () => decide(btn.dataset.act, true), { signal: ctx.signal });
        }
      }
      bindGate(list.querySelector(".ta-gate"));
      replay.addEventListener("click", () => reset(true), { signal: ctx.signal });

      function cycle() {
        ctx.demoAfter(2400, () => {
          decide("allow", false);
          ctx.demoAfter(2800, () => {
            reset(false);
            cycle();
          });
        });
      }
      cycle();
    },
  });
})();

(function () {
  const P = window.PlainPlayer;
  const ORDER = [
    "thinking", "tool-approval", "file-changes",
    "agent-run", "sources", "composer",
    "context-budget", "agent-transcript", "prompt-redact",
    "autonomy-switch", "effort-mode", "agent-tuning",
    "command-menu", "run-list", "agent-plan",
    "eval-matrix", "rate-meter", "agent-loaders",
    "agent-indicators", "event-inbox", "destructive-guard",
    "approval-code", "run-telemetry", "handoff-command"
  ];
  const ordered = ORDER.map((slug) => P.studies.find((s) => s.slug === slug)).filter(Boolean);
  const extras = P.studies.filter((s) => !ORDER.includes(s.slug));
  const set = ordered.concat(extras);
  const n = set.length;
  const $ = (id) => document.getElementById(id);
  const wall = $("pg-wall"), sheet = $("pg-sheet"), openEl = $("pg-open"), live = $("pg-live");
  const dataView = $("pg-data-view"), controlsView = $("pg-controls-view");

  /* Layout-offset box relative to container (immune to running WAAPI/CSS transforms during FLIP or entrance!). */
  function layoutBoxIn(el, container) {
    let x = 0, y = 0, n = el;
    while (n && n !== container && n instanceof HTMLElement) {
      x += n.offsetLeft - n.scrollLeft;
      y += n.offsetTop - n.scrollTop;
      n = n.offsetParent;
    }
    if (n === container && el.offsetWidth > 0 && el.offsetHeight > 0) {
      return { left: x, top: y, width: el.offsetWidth, height: el.offsetHeight };
    }

    if (!cr.width || !er.width) return null;
    return { left: er.left - cr.left, top: er.top - cr.top, width: er.width, height: er.height };
  }

  function makeCtx(host, ac, rec, tile, index) {
    let handed = false;
    const demoDelay = tile ? (index % 6) * 520 + 350 : 250;
    let firstDemo = true;

    /* Four 1px corner hairlines: observes BOTH container AND active target element so dynamic text swaps (e.g. Copy -> Copied)
       always resize the brackets smoothly without cramping glyphs. */
    function brackets(container, opts) {
      const raw = Object.assign({ padX: 10, padY: 4, size: 6 }, opts);
      const o = { padX: raw.padX < 0 ? raw.padX : Math.max(8, raw.padX), padY: raw.padY < 0 ? Math.max(2, raw.padY) : Math.max(3, raw.padY), size: raw.size || 6 };
      if (opts && opts.exactPad) { o.padX = raw.padX; o.padY = raw.padY; }
      if (getComputedStyle(container).position === "static") container.style.position = "relative";
      const wrap = document.createElement("span");
      wrap.className = "pm-frame"; wrap.setAttribute("aria-hidden", "true");
      wrap.innerHTML = '<i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>';
      container.appendChild(wrap);
      const [tl, tr, bl, br] = wrap.children;
      let curEl = null, shown = false, pressed = false;
      let bx0 = 0, by0 = 0, bx1 = 0, by1 = 0;
      const paint = () => {
        const x0 = sx0.value(), y0 = sy0.value(), x1 = sx1.value(), y1 = sy1.value();
        tl.style.transform = `translate3d(${x0.toFixed(2)}px,${y0.toFixed(2)}px,0)`;
        tr.style.transform = `translate3d(${x1.toFixed(2)}px,${y0.toFixed(2)}px,0)`;
        bl.style.transform = `translate3d(${x0.toFixed(2)}px,${y1.toFixed(2)}px,0)`;
        br.style.transform = `translate3d(${x1.toFixed(2)}px,${y1.toFixed(2)}px,0)`;
      };
      const sig = { duration: 0.2, signal: ac.signal };
      const sx0 = P.spring(0, paint, sig), sy0 = P.spring(0, paint, sig), sx1 = P.spring(0, paint, sig), sy1 = P.spring(0, paint, sig);

      function measure(el) {
        if (!el || !el.isConnected) return null;
        const b = layoutBoxIn(el, container);
        if (!b) return null;
        const p = pressed ? 1.5 : 0;
        return [b.left - o.padX + p, b.top - o.padY + p, b.left + b.width + o.padX - o.size - p, b.top + b.height + o.padY - o.size - p];
      }

      let ro = null, mo = null;
      function refit(animate) {
        if (!curEl || !shown || ac.signal.aborted) return;

        if (!m) return;
        [bx0, by0, bx1, by1] = m;
        if (animate && !P.reduced()) { sx0.set(m[0]); sy0.set(m[1]); sx1.set(m[2]); sy1.set(m[3]); }
        else { sx0.jump(m[0]); sy0.jump(m[1]); sx1.jump(m[2]); sy1.jump(m[3]); }
      }
      if (typeof ResizeObserver !== "undefined") {

          const isTarget = entries.some((e) => e.target === curEl);
          refit(isTarget);
        });

        ac.signal.addEventListener("abort", () => ro.disconnect(), { once: true });
      }
      if (typeof MutationObserver !== "undefined") {
        mo = new MutationObserver(() => requestAnimationFrame(() => refit(true)));
        ac.signal.addEventListener("abort", () => mo.disconnect(), { once: true });
      }

          if (el) { try { ro.observe(el); } catch (e) {} }
        }
        if (mo) {
          mo.disconnect();
          if (el) { try { mo.observe(el, { childList: true, characterData: true, subtree: true }); } catch (e) {} }
        }

      function moveTo(el, mOpts) {
        if (!el) return pare();

        curEl = el;
        const m = measure(el);
        if (!m) { requestAnimationFrame(() => { if (curEl === el && !ac.signal.aborted) moveTo(el, { immediate: true }); }); return; }
        [bx0, by0, bx1, by1] = m;
        const imm = (mOpts && mOpts.immediate) || !shown || P.reduced();
        shown = true; wrap.classList.add("is-shown");
        if (imm) { sx0.jump(bx0); sy0.jump(by0); sx1.jump(bx1); sy1.jump(by1); }
        else { sx0.set(bx0); sy0.set(by0); sx1.set(bx1); sy1.set(by1); }
      }
      function clamp(down) {
        if (pressed === down || !curEl || !shown) return;
        pressed = down;
        const m = measure(curEl); if (!m) return;
        sx0.set(m[0]); sy0.set(m[1]); sx1.set(m[2]); sy1.set(m[3]);
      }
      function pare() {
        watchTarget(null);
        curEl = null; shown = false; pressed = false; wrap.classList.remove("is-shown");
        if (!P.reduced()) { sx0.set(bx0 + 3); sy0.set(by0 + 3); sx1.set(bx1 - 3); sy1.set(by1 - 3); }
      }
      container.addEventListener("pointerdown", () => clamp(true), { signal: ac.signal });
      window.addEventListener("pointerup", () => clamp(false), { signal: ac.signal });
      window.addEventListener("pointercancel", () => clamp(false), { signal: ac.signal });
      window.addEventListener("plainfacechange", () => refit(false), { signal: ac.signal });
      return { moveTo, clamp, pare, refresh: () => refit(false), el: wrap, current: () => curEl };
    }

    function flip(listEl, mutateFn) {
      if (!listEl || P.reduced()) { mutateFn(); return; }
      const kids = [...listEl.children].filter((c) => !c.classList.contains("pm-frame") && c.offsetParent !== null);
      const before = new Map(kids.map((c) => [c, c.getBoundingClientRect()]));
      mutateFn();
      for (const c of [...listEl.children]) {
        const b = before.get(c);
        if (!b || c.offsetParent === null) continue;
        const a = c.getBoundingClientRect();
        const dx = b.left - a.left, dy = b.top - a.top;
        if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) continue;
        if (c.animate) c.animate([{ transform: `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)` }, { transform: "none" }], { duration: 210, easing: P.EASE_SETTLE });
      }
    }

    function pareOut(el, onRemoved) {
      let anim = null;
      const finish = () => {
        if (ac.signal.aborted) return;
        const parent = el && el.parentElement;
        flip(parent, () => { if (onRemoved) onRemoved(); else if (el) el.remove(); });
        if (anim) { try { anim.cancel(); } catch (e) {} }
        if (el) el.style.pointerEvents = "";
      };
      if (!el || P.reduced() || !el.animate) { finish(); return; }
      el.style.pointerEvents = "none";
      anim = el.animate([{ opacity: 1, transform: "translateX(0)" }, { opacity: 0, transform: "translateX(-6px)" }], { duration: 140, easing: P.EASE_OUT, fill: "forwards" });
      anim.onfinish = finish;
      ac.signal.addEventListener("abort", () => { try { anim.cancel(); } catch (e) {} }, { once: true });
    }

    function swapText(el, nextText, onSwapped) {
      const str = String(nextText);
      if (!el || el.textContent === str) { if (onSwapped) onSwapped(); return; }
      if (P.reduced() || !el.animate) { el.textContent = str; if (onSwapped) onSwapped(); return; }
      if (el._pmSwap) { try { el._pmSwap.cancel(); } catch (e) {} }
      const out = el.animate([{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(-3px)" }], { duration: 85, easing: P.EASE_OUT });
      el._pmSwap = out;
      out.onfinish = () => {
        if (ac.signal.aborted) return;
        el.textContent = str;
        if (onSwapped) onSwapped();
        el._pmSwap = el.animate([{ opacity: 0, transform: "translateY(3px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 135, easing: P.EASE_OUT });
      };
    }

    const ctx = {
      host, signal: ac.signal, tile: !!tile, reduced: P.reduced,
      spring: (init, fn, opts) => P.spring(init, fn, Object.assign({ signal: ac.signal }, opts)),
      brackets, flip, pareOut, swapText,
      handed: () => handed,
      after(ms, fn) { const t = setTimeout(() => { if (!ac.signal.aborted) fn(); }, ms); rec.timers.push(t); return t; },
      every(ms, fn) { const t = setInterval(() => { if (!ac.signal.aborted) fn(); }, ms); rec.intervals.push(t); return t; },
      demoAfter(ms, fn) {
        if (P.reduced() || handed) return 0;
        const wait = firstDemo ? ms + demoDelay : ms; firstDemo = false;
        const t = setTimeout(() => { if (!ac.signal.aborted && !handed && !P.reduced()) fn(); }, wait);
        rec.demoTimers.push(t); return t;
      },
      demoEvery(ms, fn) {
        if (P.reduced() || handed) return 0;
        const t = setInterval(() => { if (!ac.signal.aborted && !handed && !P.reduced()) fn(); }, ms);
        rec.demoIntervals.push(t); return t;
      },
      loop(fn) {
        const r = { stop: false }; rec.rafs.push(r); let last = performance.now();
        const f = (now) => { if (r.stop || ac.signal.aborted) return; const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now; if (fn(dt, now) === false) { r.stop = true; return; } requestAnimationFrame(f); };
        requestAnimationFrame(f); return r;
      },
      onHand(fn) { rec.hands.push(fn); },
    };

    const stopDemo = () => {
      if (handed) return;
      handed = true;
      rec.demoTimers.forEach(clearTimeout); rec.demoTimers.length = 0;
      rec.demoIntervals.forEach(clearInterval); rec.demoIntervals.length = 0;
      rec.hands.forEach((f) => { try { f(); } catch (e) { console.error(e); } });
    };
    if (!tile) {
      for (const ev of ["pointerdown", "keydown", "wheel"]) {
        host.addEventListener(ev, stopDemo, { signal: ac.signal, capture: true, passive: ev === "wheel" });
      }
    }
    return ctx;
  }

  function mountInto(box, s, tile, index, clsPrefix) {
    box.textContent = "";
    const host = document.createElement("div");
    host.className = (clsPrefix || "pp-mount ps-") + s.slug + (tile ? " is-tile" : "");
    host.dataset.study = s.slug;
    box.appendChild(host);
    const ac = new AbortController();
    const rec = { ac, timers: [], intervals: [], demoTimers: [], demoIntervals: [], rafs: [], hands: [], api: null, host };
    const ctx = makeCtx(host, ac, rec, tile, index || 0);
    try { rec.api = s.mount(host, ctx) || null; } catch (e) { console.error(s.slug, e); host.textContent = s.title; }
    return rec;
  }

  function unmount(rec) {
    if (!rec) return;
    try { rec.api && rec.api.destroy && rec.api.destroy(); } catch (e) { console.error(e); }
    rec.ac.abort();
    rec.timers.forEach(clearTimeout); rec.intervals.forEach(clearInterval);
    rec.demoTimers.forEach(clearTimeout); rec.demoIntervals.forEach(clearInterval);
    rec.rafs.forEach((r) => (r.stop = true));
    rec.host.remove();
  }

  /* Mount the Data, Diagrams & Charts chapters */
  const CHAPTERS = [
    { key: "charts", title: "Charts & distributions", sub: "Direct labels, 1px baselines, white-paper scale cuts, and scrub without tooltip boxes." },
    { key: "diagrams", title: "Diagrams, flows & traces", sub: "Frameless Helvetica nodes on orthogonal 1px hairlines; causal paths isolate by subtraction." },
    { key: "tables", title: "Tables & density matrices", sub: "Right-aligned tabular figures, FLIP column sort, and monochrome ink-step heatmaps." },
  ];
  const dataRecs = [];
  function mountDataPage() {
    if (dataRecs.length || !P.dataItems.length) return;
    dataView.textContent = "";
    CHAPTERS.forEach((ch) => {
      const items = P.dataItems.filter((d) => d.chapter === ch.key);
      if (!items.length) return;
      const sec = document.createElement("section");
      sec.className = "dd-chapter";
      sec.innerHTML = `<header class="dd-ch-head"><h2>${ch.title}</h2><span>${ch.sub}</span></header><div class="dd-grid"></div>`;
      const grid = sec.querySelector(".dd-grid");
      items.forEach((item, idx) => {
        const card = document.createElement("article");
        card.className = "dd-card" + (item.span === "full" ? " is-full" : "");
        card.dataset.slug = item.slug;
        card.innerHTML = `<div class="dd-mount"></div>`;
        const mountBox = card.querySelector(".dd-mount");
        grid.appendChild(card);
        dataRecs.push(mountInto(mountBox, item, false, idx, "dd-host dd-"));
      });
      dataView.appendChild(sec);
    });
  }

  /* Agentic Controls wall */
  const tiles = set.map((s, i) => {
    const li = document.createElement("li");
    li.innerHTML = '<button class="pg-tile" type="button"><div class="pg-stage" inert></div><span class="pg-name"><b></b><span></span></span></button>';
    const btn = li.firstChild, stage = btn.querySelector(".pg-stage");
    btn.querySelector("b").textContent = s.title;
    btn.querySelector(".pg-name span").textContent = s.tagline || "";
    btn.setAttribute("aria-label", "Open " + s.title);
    btn.addEventListener("click", () => open(i));
    wall.appendChild(li);
    return { s, i, btn, stage, rec: null, visible: false };
  });
  let sheetOpen = false, currentView = "data";
  const sync = (t) => {
    const want = currentView === "controls" && t.visible && !sheetOpen;
    if (want && !t.rec) t.rec = mountInto(t.stage, t.s, true, t.i);
    if (!want && t.rec) { unmount(t.rec); t.rec = null; }
  };
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) { const t = tiles.find((x) => x.stage === e.target); if (t) { t.visible = e.isIntersecting; sync(t); } }
  }, { rootMargin: "400px 0px" });
  tiles.forEach((t) => io.observe(t.stage));

  /* Top view switcher: Data, charts & diagrams | Agentic controls */
  const viewGroup = $("pg-views");
  const viewBtns = [...viewGroup.querySelectorAll("[data-view]")];
  const navAc = new AbortController();
  const navCtx = makeCtx(viewGroup, navAc, { timers: [], intervals: [], demoTimers: [], demoIntervals: [], rafs: [], hands: [] }, true, 0);
  const viewFrame = navCtx.brackets(viewGroup, { padX: 10, padY: 3, exactPad: true });

  function setView(v, immediate) {
    currentView = v;
    const isData = v === "data";
    dataView.hidden = !isData;
    controlsView.hidden = isData;
    for (const b of viewBtns) {
      const on = b.dataset.view === v;
      b.setAttribute("aria-selected", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
      if (on) viewFrame.moveTo(b, { immediate });
    }
    $("pg-foot").textContent = isData
      ? "Point at any series, bar, node or row to subtract the rest. Switch to Agentic controls above for all 24 interactive control studies."
      : "Each control sits directly on white paper; hover one to step the rest back, or open any study to steer it.";
    if (isData) mountDataPage();
    tiles.forEach(sync);
    requestAnimationFrame(() => window.dispatchEvent(new Event("plainfacechange")));
  }
  for (const b of viewBtns) b.addEventListener("click", () => {
    setView(b.dataset.view, false);
    try { history.replaceState(null, "", b.dataset.view === "controls" ? "#controls" : location.pathname + location.search); } catch (e) {}
  });
  viewGroup.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const idx = viewBtns.findIndex((b) => b.getAttribute("aria-selected") === "true");
    const next = viewBtns[(idx + 1) % viewBtns.length];
    setView(next.dataset.view, false);
    next.focus();
  });

  /* Open study sheet */
  let cur = -1, openRec = null;
  function show(i, dir) {
    cur = ((i % n) + n) % n;
    const s = set[cur];
    unmount(openRec);
    openRec = mountInto(openEl, s, false, cur);
    if (!P.reduced() && openRec.host.animate) {
      const dx = dir ? dir * 10 : 0;
      openRec.host.animate([{ opacity: 0, transform: `translate(${dx}px, ${dir ? 0 : 4}px)` }, { opacity: 1, transform: "none" }], { duration: 200, easing: P.EASE_SETTLE });
    }
    $("pg-sheet-title").textContent = s.title;
    $("pg-about").textContent = s.tagline || "";
    try { history.replaceState(null, "", "#" + s.slug); } catch (e) {}
    document.title = s.title + " · Plain";
    live.textContent = s.title + ", " + (cur + 1) + " of " + n;
  }
  function open(i) {
    if (currentView !== "controls") setView("controls", true);
    sheetOpen = true; tiles.forEach(sync);
    document.body.classList.add("sheet-open");
    sheet.classList.add("is-open"); document.body.style.overflow = "hidden";
    $("pg-wall").inert = true;
    if (!P.reduced() && sheet.animate) {
      sheet.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: P.EASE_OUT });
    }
    show(i, 0);
    $("pg-close").focus({ preventScroll: true });
  }
  function close() {
    if (!sheetOpen) return;
    const finish = () => {
      unmount(openRec); openRec = null;
      sheet.classList.remove("is-open"); document.body.style.overflow = "";
      document.body.classList.remove("sheet-open");
      $("pg-wall").inert = false;
      sheetOpen = false;
      const back = tiles[cur] && tiles[cur].btn;
      tiles.forEach(sync);
      if (back) { back.focus({ preventScroll: true }); back.scrollIntoView({ block: "nearest" }); }
      try { history.replaceState(null, "", "#controls"); } catch (e) {}
      document.title = "Plain — Data, Diagrams & Agentic Components";
    };
    if (!P.reduced() && sheet.animate) {
      const a = sheet.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 135, easing: P.EASE_OUT });
      a.onfinish = finish;
    } else finish();
  }
  $("pg-close").addEventListener("click", close);
  $("pg-prev").addEventListener("click", () => show(cur - 1, -1));
  $("pg-next").addEventListener("click", () => show(cur + 1, 1));
  sheet.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !e.defaultPrevented) { e.preventDefault(); close(); }
    if (e.key === "Tab") {
      const f = [...sheet.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"]), select, textarea')].filter((el) => !el.disabled && el.offsetParent !== null);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });

  /* Helvetica / System toggle */
  const faceGroup = $("pg-faces");
  const faceBtns = [...faceGroup.querySelectorAll("[data-face]")];
  const faceCtx = makeCtx(faceGroup, navAc, { timers: [], intervals: [], demoTimers: [], demoIntervals: [], rafs: [], hands: [] }, true, 0);
  const faceFrame = faceCtx.brackets(faceGroup, { padX: 9, padY: 3, exactPad: true });
  function setFace(face, immediate) {
    document.documentElement.dataset.face = face;
    for (const b of faceBtns) {
      const on = b.dataset.face === face;
      b.setAttribute("aria-checked", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
      if (on) faceFrame.moveTo(b, { immediate });
    }
    requestAnimationFrame(() => window.dispatchEvent(new Event("plainfacechange")));
  }
  for (const b of faceBtns) b.addEventListener("click", () => setFace(b.dataset.face, false));
  faceGroup.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const idx = faceBtns.findIndex((b) => b.getAttribute("aria-checked") === "true");
    const next = faceBtns[(idx + 1) % faceBtns.length];
    setFace(next.dataset.face, false);
    next.focus();
  });
  setFace("helvetica", true);

  const themeBtn = $("pg-theme");
  const isDark = () => {
    const r = document.documentElement;
    if (r.dataset.theme) return r.dataset.theme === "dark";
    if (r.classList.contains("dark")) return true;
    if (r.classList.contains("light")) return false;
    return matchMedia("(prefers-color-scheme: dark)").matches;
  };
  const paintTheme = () => (themeBtn.textContent = isDark() ? "Light" : "Dark");
  themeBtn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    document.documentElement.classList.toggle("dark", next === "dark");
    document.documentElement.classList.toggle("light", next === "light");
    paintTheme();
  });
  window.addEventListener("themechange", paintTheme);
  paintTheme();

  /* Initial route */
  const hash = location.hash.slice(1);
  const studyIdx = set.findIndex((s) => s.slug === hash);
  if (studyIdx >= 0) {
    setView("controls", true);
    open(studyIdx);
  } else if (hash === "controls" || !P.dataItems.length) {
    setView("controls", true);
  } else {
    setView("data", true);
  }

  window.PlainGallery = {
    view: (v) => setView(v, false),
    open: (slug) => { const i = set.findIndex((s) => s.slug === slug); if (i >= 0) open(i); },
    close,
  };
})();
</script>
</body>
</html>
