          <i class="qp-p50" style="left:${pct(t.p50)}"></i>
        </span>
        <span class="qp-stats">${fmtMs(t.p50)} <span>/ ${fmtMs(t.p99)}</span></span>
      </button>`;
    }).join("")}
  </div>
  <div class="qp-axis-row" aria-hidden="true">
    <span class="qp-axis-spacer"></span>
    <div class="qp-axis">
      ${TICKS.map((v, i) => i === TICKS.length - 1 ? `<span class="qp-tick is-end">${fmtMs(v)}</span>` : `<span class="qp-tick" style="left:${pct(v)}">${fmtMs(v)}</span>`).join("")}
    </div>
    <span class="qp-axis-spacer"></span>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const figEl = host.querySelector(".qp-fig");
      const subEl = host.querySelector(".qp-sub");
      const listEl = host.querySelector(".qp-list");
      const rowEls = [...listEl.querySelectorAll(".qp-row")];
      const nameEls = rowEls.map((r) => r.querySelector(".qp-name"));
      const sr = host.querySelector("[aria-live]");

      const rowFrame = ctx.brackets(listEl, { padX: 6, padY: 2, size: 5, exactPad: true });

      function setActive(idx, byKeyboard) {
        activeIdx = idx;
        if (idx >= 0) {
          rovingIdx = idx;
          listEl.setAttribute("data-focusing", "");
          rowEls.forEach((r, i) => {
            if (i === idx) r.setAttribute("data-active", "");
            else r.removeAttribute("data-active");
            r.tabIndex = i === idx ? 0 : -1;
          });
          rowFrame.moveTo(nameEls[idx], { immediate: false });
          const t = TOOLS[idx];
          figEl.textContent = `${t.name} \u00b7 ${fmtMs(t.p50)}`;
          subEl.textContent = `min ${fmtMs(t.min)} \u00b7 p50 ${fmtMs(t.p50)} \u00b7 p95 ${fmtMs(t.p95)} \u00b7 p99 ${fmtMs(t.p99)}`;
          if (byKeyboard) {
            sr.textContent = `${t.name}: min ${fmtMs(t.min)}, p50 ${fmtMs(t.p50)}, p95 ${fmtMs(t.p95)}, p99 ${fmtMs(t.p99)}.`;
          }
        } else {
          listEl.removeAttribute("data-focusing");
          rowEls.forEach((r, i) => {
            r.removeAttribute("data-active");
            r.tabIndex = i === rovingIdx ? 0 : -1;
          });
          rowFrame.pare();
          figEl.textContent = "42 \u2013 620 ms";
          subEl.textContent = "p50 median \u00b7 p99 tail on right";
        }
      }

      rowEls.forEach((row, i) => {
        row.addEventListener("pointerenter", (e) => {
          if (e.pointerType === "touch") return;
          setActive(i, false);
        }, { signal: ctx.signal });
        row.addEventListener("click", () => {
          if (activeIdx === i && !row.matches(":focus-visible")) setActive(-1, false);
          else setActive(i, true);
        }, { signal: ctx.signal });
        row.addEventListener("focus", () => {
          if (row.matches(":focus-visible")) setActive(i, false);
        }, { signal: ctx.signal });
      });

      listEl.addEventListener("pointerleave", () => {
        if (!listEl.contains(document.activeElement) || !document.activeElement.matches(":focus-visible")) {
          setActive(-1, false);
        }
      }, { signal: ctx.signal });

      listEl.addEventListener("focusout", (e) => {
        if (!listEl.contains(e.relatedTarget)) setActive(-1, false);
      }, { signal: ctx.signal });

      listEl.addEventListener("keydown", (e) => {
        let next = rovingIdx;
        if (e.key === "ArrowDown" || e.key === "ArrowRight") next = (rovingIdx + 1) % TOOLS.length;
        else if (e.key === "ArrowUp" || e.key === "ArrowLeft") next = (rovingIdx + TOOLS.length - 1) % TOOLS.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = TOOLS.length - 1;
        else if (e.key === "Escape") { setActive(-1, false); return; }
        else return;
        e.preventDefault();
        rowEls[next].focus({ preventScroll: true });
        setActive(next, true);
      }, { signal: ctx.signal });
    },
  });
})();

</script>
<script>
/* 06-agent-dag.js */
/* Directed Agent Graph (DAG), in Plain (Subtraction): frameless Helvetica Neue nodes set in white-paper gaps along
   orthogonal 1px SVG hairlines with open 45° arrowheads. Selecting or pointing at any node frames it in four 6px
   corner marks, highlights its upstream + downstream causal path in 1.5px --ink, and steps non-causal sibling
   branches down to 0.20 opacity. */
(function () {
  const NODES = [
    {
      id: "prompt",
      title: "Prompt",
      metric: "0.0 s · 180 tok",
      shortMetric: "180 tok",
      trace: 'Prompt · "Enforce strict maxAge on refresh cookies and sync OpenAPI types" · 180 tok · Received',
    },
    {
      id: "planner",
      title: "Planner",
      metric: "0.42 s · 1.2k tok",
      shortMetric: "0.42 s",
      trace: "Planner · decomposed into 3 isolated worktrees · 0.42 s · 1.2k tok",
    },
    {
      id: "auth",
      title: "Auth patch",
      metric: "1.38 s · 3.4k tok",
      shortMetric: "1.38 s",
      branch: true,
      trace: "Auth patch · edited src/auth/cookies.ts (+18 −6) to reject stale JWTs · 1.38 s · Passed",
    },
    {
      id: "types",
      title: "API types",
      metric: "0.94 s · 2.1k tok",
      shortMetric: "0.94 s",
      branch: true,
      trace: "API types · regenerated schema/session.d.ts strict cookie flags · 0.94 s · Passed",
    },
    {
      id: "spec",
      title: "Spec writer",
      metric: "1.12 s · 2.6k tok",
      shortMetric: "1.12 s",
      branch: true,
      trace: "Spec writer · added 14 vitest cases for expired & rotated cookies · 1.12 s · Passed",
    },
    {
      id: "verifier",
      title: "Verifier",
      metric: "0.89 s · 1.5k tok",
      shortMetric: "0.89 s",
      trace: "Verifier · ran 42 assertions across 3 branches · 0.89 s · Passed",
    },
    {
      id: "pr",
      title: "Open PR #184",
      metric: "0.31 s · +64 −11",
      shortMetric: "0.31 s",
      trace: "Open PR #184 · pushed fix/cookie-ttl with 42 green checks · 0.31 s · Ready",
    },
  ];

  const EDGES = [
    ["prompt", "planner"],
    ["planner", "auth"],
    ["planner", "types"],
    ["planner", "spec"],
    ["auth", "verifier"],
    ["types", "verifier"],
    ["spec", "verifier"],
    ["verifier", "pr"],
  ];

  function computeCausal(targetId) {
    const nodes = new Set([targetId]);
    const edges = new Set();
    let changed = true;
    /* Walk upstream ancestors */
    const up = new Set([targetId]);
    while (changed) {
      changed = false;
      EDGES.forEach(([from, to], idx) => {
        if (up.has(to) && !up.has(from)) {
          up.add(from);
          changed = true;
        }
        if (up.has(to) && up.has(from)) edges.add(idx);
      });
    }
    /* Walk downstream descendants */
    const down = new Set([targetId]);
    changed = true;
    while (changed) {
      changed = false;
      EDGES.forEach(([from, to], idx) => {
        if (down.has(from) && !down.has(to)) {
          down.add(to);
          changed = true;
        }
        if (down.has(from) && down.has(to)) edges.add(idx);
      });
    }
    up.forEach((n) => nodes.add(n));
    down.forEach((n) => nodes.add(n));
    return { nodes, edges };
  }

  PlainPlayer.registerData({
    slug: "agent-dag",
    chapter: "diagrams",
    span: "full",
    title: "Directed Agent Graph",
    css: `
.dd-agent-dag .dag { display: grid; gap: 18px; min-width: 0 }
.dd-agent-dag .dag-head-actions { display: flex; align-items: center; padding: 0 12px }
.dd-agent-dag .dag-step-btn { font-size: 13.5px; min-height: 28px }
.dd-agent-dag .dag-stage { position: relative; padding: 14px 10px; min-width: 0 }
.dd-agent-dag .dag-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible }
.dd-agent-dag .dag-edge { fill: none; stroke: var(--line-strong); stroke-width: 1px;
  transition: opacity var(--dur-pare) var(--ease-out), stroke var(--dur-instant) var(--ease-out), stroke-width var(--dur-instant) var(--ease-out) }
.dd-agent-dag .dag-edge.is-causal { stroke: var(--ink); stroke-width: 1.5px; opacity: 1 }
.dd-agent-dag .dag-edge.is-dim { opacity: 0.20 }
.dd-agent-dag .dag-grid { position: relative; z-index: 1; display: grid;
  grid-template-columns: auto auto auto auto auto; align-items: center; justify-content: space-between; gap: 16px 28px }
.dd-agent-dag .dag-branches { display: grid; gap: 24px; justify-items: start }
.dd-agent-dag .dag-node { appearance: none; border: 0; border-radius: 0; background: var(--page); padding: 3px 4px; margin: 0;
  display: grid; gap: 2px; text-align: left; cursor: pointer; color: var(--ink); -webkit-tap-highlight-color: transparent;
  transition: opacity var(--dur-pare) var(--ease-out) }
.dd-agent-dag .dag-node.is-dim { opacity: 0.20 }
.dd-agent-dag .dag-node:focus-visible { outline: 2px solid var(--focus); outline-offset: 6px }
.dd-agent-dag .dag-ntitle { font-size: 14px; font-weight: 500; line-height: 1.28; letter-spacing: -0.008em; color: var(--ink); white-space: nowrap }
.dd-agent-dag .dag-nmeta { font-size: 12px; font-weight: 400; line-height: 1.3; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap }
.dd-agent-dag .dag-nmeta-short { display: none }
.dd-agent-dag .dag-stage.is-vertical { padding: 8px 8px }
.dd-agent-dag .dag-stage.is-vertical .dag-grid { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 36px }
.dd-agent-dag .dag-stage.is-vertical .dag-branches { width: 100%; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; justify-items: center }
.dd-agent-dag .dag-stage.is-vertical .dag-node { text-align: center; justify-items: center; padding: 2px 2px }
@media (max-width: 640px) {
  .dd-agent-dag .dag-stage { padding: 8px 8px }
  .dd-agent-dag .dag-grid { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 36px }
  .dd-agent-dag .dag-branches { width: 100%; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; justify-items: center }
  .dd-agent-dag .dag-node { text-align: center; justify-items: center; padding: 2px 2px }
}
@media (max-width: 440px) {
  .dd-agent-dag .dag-branches .dag-ntitle { font-size: 13px }
  .dd-agent-dag .dag-branches .dag-nmeta-full { display: none }
  .dd-agent-dag .dag-branches .dag-nmeta-short { display: inline }
}
.dd-agent-dag .dag-foot { padding-top: 10px; border-top: 1px solid var(--line); min-width: 0 }
.dd-agent-dag .dag-trace { margin: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.45; color: var(--ink);
  overflow-wrap: anywhere }
`,
    mount(host, ctx) {
      const spineBefore = NODES.slice(0, 2);
      const branches = NODES.slice(2, 5);
      const spineAfter = NODES.slice(5);

      const renderBtn = (n) => `
        <button type="button" class="dag-node" data-id="${n.id}" aria-pressed="false">
          <span class="dag-ntitle">${n.title}</span>
          <span class="dag-nmeta"><span class="dag-nmeta-full">${n.metric}</span><span class="dag-nmeta-short">${n.shortMetric}</span></span>
        </button>`;

      host.innerHTML = `
<div class="dag">
  <header class="dd-card-head">
    <div class="dd-card-title">
      <h3>Directed agent graph</h3>
      <p>3 parallel worktrees · 2.93 s critical wall time (5.06 s total compute)</p>
    </div>
    <div class="dag-head-actions">
      <button type="button" class="q is-ink dag-step-btn">Step trace</button>
    </div>
  </header>
  <div class="dag-stage">
    <svg class="dag-svg" aria-hidden="true"></svg>
    <div class="dag-grid" role="toolbar" aria-label="Agent execution graph nodes">
      ${spineBefore.map(renderBtn).join("")}
      <div class="dag-branches">
        ${branches.map(renderBtn).join("")}
      </div>
      ${spineAfter.map(renderBtn).join("")}
    </div>
  </div>
  <div class="dag-foot">
    <p class="dag-trace"></p>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const stageEl = host.querySelector(".dag-stage");
      const svgEl = host.querySelector(".dag-svg");
      const gridEl = host.querySelector(".dag-grid");
      const traceEl = host.querySelector(".dag-trace");
      const stepBtn = host.querySelector(".dag-step-btn");
      const srEl = host.querySelector("[aria-live]");
      const btnMap = new Map();
      const btns = [...host.querySelectorAll(".dag-node")];
      btns.forEach((b) => btnMap.set(b.dataset.id, b));

      const NS = "http://www.w3.org/2000/svg";
      const edgeEls = EDGES.map((_, idx) => {
        const g = document.createElementNS(NS, "g");
        g.setAttribute("class", "dag-edge");
        g.dataset.edge = String(idx);
        const shaft = document.createElementNS(NS, "path");
        const head = document.createElementNS(NS, "path");
        g.appendChild(shaft);
        g.appendChild(head);
        svgEl.appendChild(g);
        return { g, shaft, head };
      });

      const frame = ctx.brackets(stageEl, { padX: 7, padY: 5, exactPad: true });
      let selectedId = "auth";
      let hoverId = null;

      function activeId() {
        return hoverId || selectedId;
      }

      function boxOf(el) {
        let x = 0;
        let y = 0;
        let n = el;
        while (n && n !== stageEl) {
          x += n.offsetLeft;
          y += n.offsetTop;
          n = n.offsetParent;
        }
        const w = el.offsetWidth;
        const h = el.offsetHeight;
        return { left: x, top: y, width: w, height: h, right: x + w, bottom: y + h, cx: x + w / 2, cy: y + h / 2 };
      }

      const snap = (v) => Math.round(v) + 0.5;
      const rightHead = (x, y) =>
        `M ${(x - 4.5).toFixed(1)} ${(y - 4.5).toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)} L ${(x - 4.5).toFixed(1)} ${(y + 4.5).toFixed(1)}`;
      const downHead = (x, y) =>
        `M ${(x - 4.5).toFixed(1)} ${(y - 4.5).toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)} L ${(x + 4.5).toFixed(1)} ${(y - 4.5).toFixed(1)}`;

      function drawEdges() {
        const w = stageEl.offsetWidth;
        const h = stageEl.offsetHeight;
        if (!w || !h) return;
        const vertical = window.matchMedia("(max-width: 640px)").matches || w < 580;
        stageEl.classList.toggle("is-vertical", vertical);

        const nw = stageEl.offsetWidth;
        const nh = stageEl.offsetHeight;
        svgEl.setAttribute("viewBox", `0 0 ${nw} ${nh}`);

        const b = {};
        NODES.forEach((n) => {
          b[n.id] = boxOf(btnMap.get(n.id));
        });

        if (!vertical) {
          const ySpine = snap(b.types.cy);
          const padOut = 11;
          const padIn = 13;
          const brLeft = Math.min(b.auth.left, b.types.left, b.spec.left);
          const brRight = Math.max(b.auth.right, b.types.right, b.spec.right);
          const xSplit = snap((b.planner.right + padOut + brLeft - padIn) / 2);
          const xMerge = snap((brRight + padOut + b.verifier.left - padIn) / 2);

          const setH = (idx, d, ax, ay) => {
            edgeEls[idx].shaft.setAttribute("d", d);
            edgeEls[idx].head.setAttribute("d", rightHead(ax, ay));
          };

          const xPromptOut = snap(b.prompt.right + padOut);
          const xPlanIn = snap(b.planner.left - padIn);
          setH(0, `M ${xPromptOut} ${ySpine} H ${xPlanIn}`, xPlanIn, ySpine);

          const xPlanOut = snap(b.planner.right + padOut);
          ["auth", "types", "spec"].forEach((id, k) => {
            const target = b[id];
            const ty = k === 1 ? ySpine : snap(target.cy);
            const tx = snap(target.left - padIn);
            const d = Math.abs(ty - ySpine) < 1 ? `M ${xPlanOut} ${ySpine} H ${tx}` : `M ${xPlanOut} ${ySpine} H ${xSplit} V ${ty} H ${tx}`;
            setH(1 + k, d, tx, ty);
          });

          const xVerIn = snap(b.verifier.left - padIn);
          ["auth", "types", "spec"].forEach((id, k) => {
            const src = b[id];
            const sy = k === 1 ? ySpine : snap(src.cy);
            const sx = snap(src.right + padOut);
            const d = Math.abs(sy - ySpine) < 1 ? `M ${sx} ${ySpine} H ${xVerIn}` : `M ${sx} ${sy} H ${xMerge} V ${ySpine} H ${xVerIn}`;
            setH(4 + k, d, xVerIn, ySpine);
          });

          const xVerOut = snap(b.verifier.right + padOut);
          const xPrIn = snap(b.pr.left - padIn);
          setH(7, `M ${xVerOut} ${ySpine} H ${xPrIn}`, xPrIn, ySpine);
        } else {
          const xSpine = snap(b.planner.cx);
          const padOut = 8;
          const padIn = 10;
          const brTop = Math.min(b.auth.top, b.types.top, b.spec.top);
          const brBottom = Math.max(b.auth.bottom, b.types.bottom, b.spec.bottom);
          const ySplit = snap((b.planner.bottom + padOut + brTop - padIn) / 2);
          const yMerge = snap((brBottom + padOut + b.verifier.top - padIn) / 2);

          const setV = (idx, d, ax, ay) => {
            edgeEls[idx].shaft.setAttribute("d", d);
            edgeEls[idx].head.setAttribute("d", downHead(ax, ay));
          };

          const yPromptOut = snap(b.prompt.bottom + padOut);
          const yPlanIn = snap(b.planner.top - padIn);
          setV(0, `M ${xSpine} ${yPromptOut} V ${yPlanIn}`, xSpine, yPlanIn);

          const yPlanOut = snap(b.planner.bottom + padOut);
          ["auth", "types", "spec"].forEach((id, k) => {
            const target = b[id];
            const tx = k === 1 ? xSpine : snap(target.cx);
            const ty = snap(target.top - padIn);
            const d = Math.abs(tx - xSpine) < 1 ? `M ${xSpine} ${yPlanOut} V ${ty}` : `M ${xSpine} ${yPlanOut} V ${ySplit} H ${tx} V ${ty}`;
            setV(1 + k, d, tx, ty);
          });

          const yVerIn = snap(b.verifier.top - padIn);
          ["auth", "types", "spec"].forEach((id, k) => {
            const src = b[id];
            const sx = k === 1 ? xSpine : snap(src.cx);
            const sy = snap(src.bottom + padOut);
            const d = Math.abs(sx - xSpine) < 1 ? `M ${xSpine} ${sy} V ${yVerIn}` : `M ${sx} ${sy} V ${yMerge} H ${xSpine} V ${yVerIn}`;
            setV(4 + k, d, xSpine, yVerIn);
          });

          const yVerOut = snap(b.verifier.bottom + padOut);
          const yPrIn = snap(b.pr.top - padIn);
          setV(7, `M ${xSpine} ${yVerOut} V ${yPrIn}`, xSpine, yPrIn);
        }
      }

      function syncState(opts) {
        const o = opts || {};
        const cur = activeId();
        const causal = computeCausal(cur);
        const curNode = NODES.find((n) => n.id === cur) || NODES[0];

        NODES.forEach((n) => {
          const btn = btnMap.get(n.id);
          const isCur = n.id === cur;
          const isSelected = n.id === selectedId;
          const inCausal = causal.nodes.has(n.id);
          btn.classList.toggle("is-dim", !inCausal);
          btn.setAttribute("aria-pressed", isSelected ? "true" : "false");
          btn.tabIndex = isSelected ? 0 : -1;
          if (isCur) frame.moveTo(btn, { immediate: !!o.immediate });
        });

        /* Paint dimmed edges first, active causal edges last so shared trunks stay 100% --ink */
        edgeEls.forEach((e, idx) => {
          const inCausal = causal.edges.has(idx);
          e.g.classList.toggle("is-causal", inCausal);
          e.g.classList.toggle("is-dim", !inCausal);
          if (!inCausal) svgEl.appendChild(e.g);
        });
        edgeEls.forEach((e, idx) => {
          if (causal.edges.has(idx)) svgEl.appendChild(e.g);
        });

        if (o.immediate) traceEl.textContent = curNode.trace;
        else ctx.swapText(traceEl, curNode.trace);
        if (o.announce) srEl.textContent = curNode.trace;
      }

      btns.forEach((btn) => {
        const id = btn.dataset.id;
        btn.addEventListener("pointerenter", () => {
          hoverId = id;
          syncState({ immediate: false });
        }, { signal: ctx.signal });
        btn.addEventListener("pointerleave", () => {
          if (hoverId === id) {
            hoverId = null;
            syncState({ immediate: false });
          }
        }, { signal: ctx.signal });
        btn.addEventListener("focus", () => {
          if (selectedId !== id) {
            selectedId = id;
            syncState({ immediate: false });
          }
        }, { signal: ctx.signal });
        btn.addEventListener("click", () => {
          selectedId = id;
          hoverId = null;
          syncState({ immediate: false, announce: true });
        }, { signal: ctx.signal });
      });

      gridEl.addEventListener("keydown", (e) => {
        const keys = ["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp", "Home", "End"];
        if (!keys.includes(e.key)) return;
        e.preventDefault();
        const idx = NODES.findIndex((n) => n.id === selectedId);
        let nextIdx = idx;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") nextIdx = (idx + 1) % NODES.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") nextIdx = (idx - 1 + NODES.length) % NODES.length;
        else if (e.key === "Home") nextIdx = 0;
        else if (e.key === "End") nextIdx = NODES.length - 1;
        selectedId = NODES[nextIdx].id;
        hoverId = null;
        syncState({ immediate: false, announce: true });
        btnMap.get(selectedId).focus();
      }, { signal: ctx.signal });

      stepBtn.addEventListener("click", () => {
        const idx = NODES.findIndex((n) => n.id === selectedId);
        selectedId = NODES[(idx + 1) % NODES.length].id;
        hoverId = null;
        syncState({ immediate: false, announce: true });
      }, { signal: ctx.signal });

      const relayout = () => {
        drawEdges();
        frame.refresh();
      };

      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(relayout);
        ro.observe(stageEl);
        ctx.signal.addEventListener("abort", () => ro.disconnect(), { once: true });
      }
      window.addEventListener("plainfacechange", () => requestAnimationFrame(relayout), { signal: ctx.signal });

      syncState({ immediate: true });
      requestAnimationFrame(() => {
        drawEdges();
        syncState({ immediate: true });
      });
    },
  });
})();

</script>
<script>
/* 07-sequence-diagram.js */
/* Protocol Sequence Diagram, in Plain (Subtraction): "Tool call round-trip" across four frameless actor headers with
   vertical 1px lifelines and five descending horizontal exchanges. Pointing at or selecting any step dims the other
   four exchanges and uninvolved lifelines to 0.22, frames the step row, and states its payload in the header readout. */
(function () {
  const ACTORS = ["User", "Agent", "Workspace", "GitHub"];

  const STEPS = [
    {
      num: "01",
      call: 'prompt("Fix cookie TTL")',
      ms: "12 ms",
      from: 0,

      const stageEl = host.querySelector(".seq-stage");
      const svgEl = host.querySelector(".seq-svg");
      const actorsWrap = host.querySelector(".seq-actors");
      const actorEls = [...actorsWrap.querySelectorAll(".seq-actor")];

      const NS = "http://www.w3.org/2000/svg";

      const arrowEls = STEPS.map((s) => {
        const g = document.createElementNS(NS, "g");

        g.appendChild(tip);

      let pinnedIdx = -1;
      let hoverIdx = -1;

      function activeIdx() {
        return hoverIdx >= 0 ? hoverIdx : pinnedIdx;
      }

      const snap = (v) => Math.round(v) + 0.5;

      function offsetInStage(el) {
        let x = 0;
        let y = 0;
        let n = el;
        while (n && n !== stageEl) {
          x += n.offsetLeft;
          y += n.offsetTop;
          n = n.offsetParent;
        }
        return { left: x, top: y, width: el.offsetWidth, height: el.offsetHeight };
      }

        const w = stageEl.offsetWidth;
        const h = stageEl.offsetHeight;
        if (!w || !h) return;
        svgEl.setAttribute("viewBox", `0 0 ${w} ${h}`);

        const xs = actorEls.map((el, i) => {
          const b = offsetInStage(el);
          if (i === 0) return snap(b.left + Math.min(16, b.width * 0.35));
          if (i === 3) return snap(b.left + b.width - Math.min(20, b.width * 0.35));
          return snap(b.left + b.width / 2);
        });

        const actorsBox = offsetInStage(actorsWrap);
        const yTop = Math.round(actorsBox.top + actorsBox.height - 2);
        const yBot = h - 4;
        xs.forEach((x, i) => {
          lifeEls[i].setAttribute("x1", String(x));
          lifeEls[i].setAttribute("x2", String(x));
          lifeEls[i].setAttribute("y1", String(yTop));
          lifeEls[i].setAttribute("y2", String(yBot));

        const rowsBox = offsetInStage(rowsWrap);
        STEPS.forEach((s, i) => {
          const rowEl = rowEls[i];

          const xFrom = xs[s.from];
          const xTo = xs[s.to];
          const yArrow = snap(rb.top + 33);

          /* Position label cleanly above shaft, clamped inside row width so 320px never overflows */
          const minX = Math.min(xFrom, xTo);
          const desiredLeft = minX - rb.left + 3;
          const maxLeft = Math.max(0, rb.width - tagEl.offsetWidth);

          ae.shaft.setAttribute("y2", String(yArrow));

          const dir = xTo > xFrom ? 1 : -1;
          const ax = xTo;
          const bx = xTo - dir * 4.5;

            "d",
            `M ${bx.toFixed(1)} ${(yArrow - 4.5).toFixed(1)} L ${ax.toFixed(1)} ${yArrow.toFixed(1)} L ${bx.toFixed(1)} ${(yArrow + 4.5).toFixed(1)}`
          );
          void rowsBox;
        });
      }

      function syncState(opts) {
        const o = opts || {};
        const cur = activeIdx();
        const hasActive = cur >= 0;
        const step = hasActive ? STEPS[cur] : null;

        actorEls.forEach((el, aIdx) => {
          const involved = !hasActive || step.from === aIdx || step.to === aIdx;
          el.classList.toggle("is-dim", !involved);
          lifeEls[aIdx].classList.toggle("is-dim", !involved);
          lifeEls[aIdx].classList.toggle("is-on", hasActive && involved);
        });

        rowEls.forEach((row, i) => {

          const dim = hasActive && !on;

          arrowEls[i].g.classList.toggle("is-dim", dim);
          arrowEls[i].g.classList.toggle("is-on", on);
        });

        if (hasActive) {
          frame.moveTo(rowEls[cur], { immediate: !!o.immediate });
        } else {
          frame.pare();
        }

        const nextText = hasActive ? step.payload : DEFAULT_READOUT;
        readoutEl.classList.toggle("is-active", hasActive);
        if (o.immediate) readoutEl.textContent = nextText;
        else ctx.swapText(readoutEl, nextText);
        if (o.announce && hasActive) srEl.textContent = step.payload;
      }

      rowEls.forEach((row, i) => {
        row.addEventListener("pointerenter", () => {
          hoverIdx = i;
          syncState({ immediate: false });
        }, { signal: ctx.signal });
        row.addEventListener("pointerleave", () => {
          if (hoverIdx === i) {
            hoverIdx = -1;
            syncState({ immediate: false });
          }
        }, { signal: ctx.signal });
        row.addEventListener("focus", () => {
          hoverIdx = i;
          syncState({ immediate: false });
        }, { signal: ctx.signal });
        row.addEventListener("blur", () => {
          if (hoverIdx === i) {
            hoverIdx = -1;
            syncState({ immediate: false });
          }
        }, { signal: ctx.signal });
        row.addEventListener("click", () => {
          pinnedIdx = pinnedIdx === i ? -1 : i;
          hoverIdx = -1;
          syncState({ immediate: false, announce: pinnedIdx >= 0 });
        }, { signal: ctx.signal });
      });

      rowsWrap.addEventListener("keydown", (e) => {
        const keys = ["ArrowDown", "ArrowUp", "Home", "End", "Escape"];
        if (!keys.includes(e.key)) return;
        e.preventDefault();
        if (e.key === "Escape") {
          pinnedIdx = -1;
          hoverIdx = -1;
          syncState({ immediate: false });
          return;
        }
        const cur = activeIdx() >= 0 ? activeIdx() : 0;
        let next = cur;
        if (e.key === "ArrowDown") next = (cur + 1) % STEPS.length;
        else if (e.key === "ArrowUp") next = (cur - 1 + STEPS.length) % STEPS.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = STEPS.length - 1;
        pinnedIdx = next;
        hoverIdx = next;
        syncState({ immediate: false, announce: true });
        rowEls[next].focus();
      }, { signal: ctx.signal });

      const relayout = () => {
        drawGeometry();
        frame.refresh();
      };

      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(relayout);
        ro.observe(stageEl);
        ctx.signal.addEventListener("abort", () => ro.disconnect(), { once: true });
      }
      window.addEventListener("plainfacechange", () => requestAnimationFrame(relayout), { signal: ctx.signal });

      syncState({ immediate: true });
      requestAnimationFrame(relayout);
    },
  });

        const leftPct = ((s.start / MAX_S) * 100).toFixed(3);
        const widthPct = ((s.dur / MAX_S) * 100).toFixed(3);
        const treeCls = s.root ? "tw-tree" : "tw-tree is-child" + (s.last ? " is-last" : "");
        return `
        <button type="button" class="tw-row${s.critical ? "" : " is-async"}" role="option" aria-selected="false" data-idx="${i}">
          <span class="${treeCls}"><span class="tw-sname">${s.label}</span></span>
          <span class="tw-lane"><span class="tw-bar" style="left: ${leftPct}%; width: ${widthPct}%"></span></span>
          <span class="tw-dur">${s.durText}</span>
        </button>`;
      }).join("")}
    </div>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const critBtn = host.querySelector(".tw-crit-btn");
      const subEl = host.querySelector(".tw-sub");
      const rowsWrap = host.querySelector(".tw-rows");
      const guidesEl = host.querySelector(".tw-guides");
      const c0 = host.querySelector(".tw-c0");
      const c1 = host.querySelector(".tw-c1");
      const rowEls = [...rowsWrap.querySelectorAll(".tw-row")];
      const srEl = host.querySelector("[aria-live]");

      const frame = ctx.brackets(rowsWrap, { padX: 6, padY: 1, exactPad: true });
      let criticalOnly = false;
      let pinnedIdx = -1;
      let hoverIdx = -1;

      function activeIdx() {
        return hoverIdx >= 0 ? hoverIdx : pinnedIdx;
      }

      function syncState(opts) {
        const o = opts || {};
        const cur = activeIdx();
        const hasInspect = cur >= 0;
        const span = hasInspect ? SPANS[cur] : null;

        critBtn.setAttribute("aria-checked", criticalOnly ? "true" : "false");

        rowEls.forEach((row, i) => {
          const s = SPANS[i];
          let dim = false;
          if (hasInspect) dim = i !== cur;
          else if (criticalOnly) dim = !s.critical;
          row.classList.toggle("is-dim", dim);
          row.setAttribute("aria-selected", i === pinnedIdx ? "true" : "false");
          row.tabIndex = (pinnedIdx >= 0 ? i === pinnedIdx : i === 0) ? 0 : -1;
        });

        if (hasInspect) {
          frame.moveTo(rowEls[cur], { immediate: !!o.immediate });
          c0.style.left = `${((span.start / MAX_S) * 100).toFixed(3)}%`;
          c1.style.left = `${(((span.start + span.dur) / MAX_S) * 100).toFixed(3)}%`;
          guidesEl.classList.add("has-cursor");
        } else {
          frame.pare();
          guidesEl.classList.remove("has-cursor");
        }

        const nextSub = hasInspect ? span.detail : criticalOnly ? CRIT_SUMMARY : REST_SUMMARY;
        subEl.classList.toggle("is-ink", hasInspect || criticalOnly);
        if (o.immediate) subEl.textContent = nextSub;
        else ctx.swapText(subEl, nextSub);
        if (o.announce) srEl.textContent = nextSub;
      }

      critBtn.addEventListener("click", () => {
        criticalOnly = !criticalOnly;
        pinnedIdx = -1;
        hoverIdx = -1;
        syncState({ immediate: false, announce: true });
      }, { signal: ctx.signal });

      rowEls.forEach((row, i) => {
        row.addEventListener("pointerenter", () => {
          hoverIdx = i;
          syncState({ immediate: false });
        }, { signal: ctx.signal });
        row.addEventListener("pointerleave", () => {
          if (hoverIdx === i) {
            hoverIdx = -1;
            syncState({ immediate: false });
          }
        }, { signal: ctx.signal });
        row.addEventListener("focus", () => {
          hoverIdx = i;
          syncState({ immediate: false });
        }, { signal: ctx.signal });
        row.addEventListener("blur", () => {
          if (hoverIdx === i) {
            hoverIdx = -1;
            syncState({ immediate: false });
          }
        }, { signal: ctx.signal });
        row.addEventListener("click", () => {
          pinnedIdx = pinnedIdx === i ? -1 : i;
          hoverIdx = -1;
          syncState({ immediate: false, announce: true });
        }, { signal: ctx.signal });
      });

      rowsWrap.addEventListener("keydown", (e) => {
        const keys = ["ArrowDown", "ArrowUp", "Home", "End", "Escape"];
        if (!keys.includes(e.key)) return;
        e.preventDefault();
        if (e.key === "Escape") {
          pinnedIdx = -1;
          hoverIdx = -1;
          syncState({ immediate: false });
          return;
        }
        const cur = activeIdx() >= 0 ? activeIdx() : 0;
        let next = cur;
        if (e.key === "ArrowDown") next = (cur + 1) % SPANS.length;
        else if (e.key === "ArrowUp") next = (cur - 1 + SPANS.length) % SPANS.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = SPANS.length - 1;
        pinnedIdx = next;
        hoverIdx = next;
        syncState({ immediate: false, announce: true });
        rowEls[next].focus();
      }, { signal: ctx.signal });

      window.addEventListener("plainfacechange", () => requestAnimationFrame(() => frame.refresh()), { signal: ctx.signal });
      syncState({ immediate: true });
    },
  });
})();

</script>
<script>
/* 09-state-diagram.js */
/* Lifecycle State Machine, in Plain (Subtraction): "Agent run state machine" with five frameless typographic states
   connected by orthogonal 1px directed hairlines. The current state wears four 6px corner marks; unreachable states
   step down to 0.24 opacity while valid outgoing transition arrows and trigger buttons below stand in --ink. */
(function () {
  const STATES = [
    { id: "idle", label: "Idle", desc: "Idle · awaiting prompt · valid transition: start → Planning" },
    { id: "planning", label: "Planning", desc: "Planning · scoping 3 files · valid transition: ready → Executing" },
    { id: "executing", label: "Executing", desc: "Executing · editing & running vitest · valid: gate → Needs OK or pass → Merged" },
    { id: "needs-ok", label: "Needs OK", desc: "Needs OK · paused on shell approval · valid transition: allow → Executing" },
    { id: "merged", label: "Merged", desc: "Merged · PR #184 landed cleanly · terminal state (Reset to restart)" },
  ];

  const TRANSITIONS = [
    { id: "start", from: "idle", to: "planning", label: "start" },
    { id: "ready", from: "planning", to: "executing", label: "ready" },
    { id: "gate", from: "executing", to: "needs-ok", label: "gate" },
    { id: "allow", from: "needs-ok", to: "executing", label: "allow" },
    { id: "pass", from: "executing", to: "merged", label: "pass" },
  ];

  const TRIGGERS = [
    { key: "step", label: "Start", validIn: ["idle", "planning"], next: (cur) => (cur === "idle" ? "planning" : "executing") },
    { key: "gate", label: "Request gate", validIn: ["executing"], next: () => "needs-ok" },
    { key: "allow", label: "Allow", validIn: ["needs-ok"], next: () => "executing" },
    { key: "finish", label: "Finish", validIn: ["executing"], next: () => "merged" },
    { key: "reset", label: "Reset", validIn: ["planning", "executing", "needs-ok", "merged"], next: () => "idle" },
  ];

  PlainPlayer.registerData({
    slug: "state-diagram",
    chapter: "diagrams",
    span: "half",
    title: "Lifecycle State Machine",
    css: `
.dd-state-diagram .stm { display: grid; gap: 16px; min-width: 0 }
.dd-state-diagram .stm-desc { margin: 2px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted); overflow-wrap: anywhere }
.dd-state-diagram .stm-stage { position: relative; padding: 12px 10px; min-width: 0 }
.dd-state-diagram .stm-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible }
.dd-state-diagram .stm-edge { fill: none; color: var(--line-strong);
  transition: opacity var(--dur-pare) var(--ease-out), color var(--dur-instant) var(--ease-out) }
.dd-state-diagram .stm-edge.is-valid { color: var(--ink); opacity: 1 }
.dd-state-diagram .stm-edge.is-dim { opacity: 0.24 }
.dd-state-diagram .stm-shaft,
.dd-state-diagram .stm-tip { stroke: currentColor; stroke-width: 1px; fill: none }
.dd-state-diagram .stm-edge.is-valid .stm-shaft,
.dd-state-diagram .stm-edge.is-valid .stm-tip { stroke-width: 1.45px }
.dd-state-diagram .stm-tlabel { font-family: var(--mono); font-size: 11.5px; fill: var(--muted);
  transition: fill var(--dur-instant) var(--ease-out) }
.dd-state-diagram .stm-edge.is-valid .stm-tlabel { fill: var(--ink); font-weight: 500 }
.dd-state-diagram .stm-grid { position: relative; z-index: 1; display: grid;
  grid-template-columns: auto auto auto; justify-content: space-between; align-items: center; row-gap: 72px }
.dd-state-diagram .stm-node { appearance: none; border: 0; border-radius: 0; background: var(--page); padding: 3px 4px; margin: 0;
  font-size: 14px; font-weight: 500; line-height: 1.3; letter-spacing: -0.008em; color: var(--ink); white-space: nowrap;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: opacity var(--dur-pare) var(--ease-out) }
.dd-state-diagram .stm-node.is-dim { opacity: 0.24 }
.dd-state-diagram .stm-node:focus-visible { outline: 2px solid var(--focus); outline-offset: 6px }
.dd-state-diagram .stm-node[data-id="idle"] { grid-column: 1; grid-row: 1; justify-self: start }
.dd-state-diagram .stm-node[data-id="planning"] { grid-column: 2; grid-row: 1; justify-self: center }
.dd-state-diagram .stm-node[data-id="executing"] { grid-column: 3; grid-row: 1; justify-self: end }
.dd-state-diagram .stm-node[data-id="needs-ok"] { grid-column: 2; grid-row: 2; justify-self: center }
.dd-state-diagram .stm-node[data-id="merged"] { grid-column: 3; grid-row: 2; justify-self: end }
.dd-state-diagram .stm-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px;
  padding: 10px 12px 0; border-top: 1px solid var(--line) }
.dd-state-diagram .stm-trig { font-size: 13.5px; min-height: 28px }
.dd-state-diagram .stm-trig:disabled { opacity: 0.24 }
@media (max-width: 400px) {
  .dd-state-diagram .stm-stage { padding: 10px 8px }
  .dd-state-diagram .stm-node { font-size: 13.5px }
  .dd-state-diagram .stm-controls { gap: 4px 18px }
}
`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="stm">
  <header class="dd-card-head">
    <div class="dd-card-title">
      <h3>Agent run state machine</h3>
      <p class="stm-desc"></p>
    </div>
  </header>
  <div class="stm-stage">
    <svg class="stm-svg" aria-hidden="true"></svg>
    <div class="stm-grid" role="group" aria-label="Agent lifecycle states">
      ${STATES.map((s) => `<button type="button" class="stm-node" data-id="${s.id}" aria-current="false">${s.label}</button>`).join("")}
    </div>
  </div>
  <div class="stm-controls" role="group" aria-label="State machine triggers">
    ${TRIGGERS.map((t) => `<button type="button" class="q stm-trig" data-trig="${t.key}">${t.label}</button>`).join("")}
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const stageEl = host.querySelector(".stm-stage");
      const svgEl = host.querySelector(".stm-svg");
      const descEl = host.querySelector(".stm-desc");
      const srEl = host.querySelector("[aria-live]");
      const nodeMap = new Map();
      host.querySelectorAll(".stm-node").forEach((el) => nodeMap.set(el.dataset.id, el));
      const trigEls = [...host.querySelectorAll(".stm-trig")];

      const NS = "http://www.w3.org/2000/svg";
      const edgeMap = new Map();
      TRANSITIONS.forEach((tr) => {
        const g = document.createElementNS(NS, "g");
        g.setAttribute("class", "stm-edge");
        const shaft = document.createElementNS(NS, "path");
        shaft.setAttribute("class", "stm-shaft");
        const tip = document.createElementNS(NS, "path");
        tip.setAttribute("class", "stm-tip");
        const txt = document.createElementNS(NS, "text");
        txt.setAttribute("class", "stm-tlabel");
        txt.textContent = tr.label;
        g.appendChild(shaft);
        g.appendChild(tip);
        g.appendChild(txt);
        svgEl.appendChild(g);
        edgeMap.set(tr.id, { g, shaft, tip, txt });
      });

      const frame = ctx.brackets(stageEl, { padX: 7, padY: 4, exactPad: true });
      let current = "executing";

      const snap = (v) => Math.round(v) + 0.5;
      const headRight = (x, y) =>
        `M ${(x - 4.5).toFixed(1)} ${(y - 4.5).toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)} L ${(x - 4.5).toFixed(1)} ${(y + 4.5).toFixed(1)}`;
      const headLeft = (x, y) =>
        `M ${(x + 4.5).toFixed(1)} ${(y - 4.5).toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)} L ${(x + 4.5).toFixed(1)} ${(y + 4.5).toFixed(1)}`;
      const headDown = (x, y) =>
        `M ${(x - 4.5).toFixed(1)} ${(y - 4.5).toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)} L ${(x + 4.5).toFixed(1)} ${(y - 4.5).toFixed(1)}`;
      const headUp = (x, y) =>
        `M ${(x - 4.5).toFixed(1)} ${(y + 4.5).toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)} L ${(x + 4.5).toFixed(1)} ${(y + 4.5).toFixed(1)}`;

      function boxOf(el) {
        let x = 0;
        let y = 0;
        let n = el;
        while (n && n !== stageEl) {
          x += n.offsetLeft;
          y += n.offsetTop;
          n = n.offsetParent;
        }
        const w = el.offsetWidth;
        const h = el.offsetHeight;
        return { left: x, top: y, width: w, height: h, right: x + w, bottom: y + h, cx: x + w / 2, cy: y + h / 2 };
      }

      function drawEdges() {
        const w = stageEl.offsetWidth;
        const h = stageEl.offsetHeight;
        if (!w || !h) return;
        svgEl.setAttribute("viewBox", `0 0 ${w} ${h}`);

        const bIdle = boxOf(nodeMap.get("idle"));
        const bPlan = boxOf(nodeMap.get("planning"));
        const bExec = boxOf(nodeMap.get("executing"));
        const bNeeds = boxOf(nodeMap.get("needs-ok"));
        const bMerged = boxOf(nodeMap.get("merged"));

        const yTop = snap(bPlan.cy);

        /* 1. Idle --start--> Planning */
        {
          const e = edgeMap.get("start");
          const x1 = snap(bIdle.right + 9);
          const x2 = snap(bPlan.left - 10);
          e.shaft.setAttribute("d", `M ${x1} ${yTop} H ${x2}`);
          e.tip.setAttribute("d", headRight(x2, yTop));
          e.txt.setAttribute("x", ((x1 + x2) / 2).toFixed(1));
          e.txt.setAttribute("y", (yTop - 7).toFixed(1));
          e.txt.setAttribute("text-anchor", "middle");
        }

        /* 2. Planning --ready--> Executing */
        {
          const e = edgeMap.get("ready");
          const x1 = snap(bPlan.right + 9);
          const x2 = snap(bExec.left - 10);
          e.shaft.setAttribute("d", `M ${x1} ${yTop} H ${x2}`);
          e.tip.setAttribute("d", headRight(x2, yTop));
          e.txt.setAttribute("x", ((x1 + x2) / 2).toFixed(1));
          e.txt.setAttribute("y", (yTop - 7).toFixed(1));
          e.txt.setAttribute("text-anchor", "middle");
        }

        /* Keep pass shaft 36px inside right edge so "pass" stays 100% inside stage on 320px/390px/1280px,
           and route gate shaft cleanly to the left of Merged so it never grazes Merged's "M". */
        const xPass = snap(Math.max(bMerged.left + 8, bMerged.right - 36));
        const xGateV = snap(Math.min(bMerged.left - 14, xPass - 18));
        const xAllowV = snap(Math.max(bNeeds.right + 20, xGateV - 14));

        /* 3. Executing --gate--> Needs OK (outer single 90° elbow) */
        {
          const e = edgeMap.get("gate");
          const y1 = snap(bExec.bottom + 9);
          const y2 = snap(bNeeds.cy + 6);
          const x2 = snap(bNeeds.right + 11);
          e.shaft.setAttribute("d", `M ${xGateV} ${y1} V ${y2} H ${x2}`);
          e.tip.setAttribute("d", headLeft(x2, y2));
          e.txt.setAttribute("x", ((x2 + xGateV) / 2).toFixed(1));
          e.txt.setAttribute("y", (y2 + 14).toFixed(1));
          e.txt.setAttribute("text-anchor", "middle");
        }

        /* 4. Needs OK --allow--> Executing (inner single 90° elbow, zero crossings) */
        {
          const e = edgeMap.get("allow");
          const x1 = snap(bNeeds.right + 10);
          const y1 = snap(bNeeds.cy - 7);
          const y2 = snap(bExec.bottom + 10);
          const xBend = xAllowV < xGateV - 8 ? xAllowV : snap((x1 + xGateV) / 2);
          e.shaft.setAttribute("d", `M ${x1} ${y1} H ${xBend} V ${y2}`);
          e.tip.setAttribute("d", headUp(xBend, y2));
          e.txt.setAttribute("x", (xBend - 5).toFixed(1));
          e.txt.setAttribute("y", (y1 - 6).toFixed(1));
          e.txt.setAttribute("text-anchor", "end");
        }

        /* 5. Executing --pass--> Merged (straight vertical hairline) */
        {
          const e = edgeMap.get("pass");
          const y1 = snap(bExec.bottom + 9);
          const y2 = snap(bMerged.top - 10);
          e.shaft.setAttribute("d", `M ${xPass} ${y1} V ${y2}`);
          e.tip.setAttribute("d", headDown(xPass, y2));
          e.txt.setAttribute("x", (xPass + 6).toFixed(1));
          e.txt.setAttribute("y", ((y1 + y2) / 2 + 4).toFixed(1));
          e.txt.setAttribute("text-anchor", "start");
        }
      }

      function setState(nextId, opts) {
        const o = opts || {};
        current = nextId;
        const curObj = STATES.find((s) => s.id === current) || STATES[2];

        const reachable = new Set([current]);
        const validEdges = new Set();
        TRANSITIONS.forEach((tr) => {
          if (tr.from === current) {
            reachable.add(tr.to);
            validEdges.add(tr.id);
          }
        });

        STATES.forEach((s) => {
          const btn = nodeMap.get(s.id);
          const isCur = s.id === current;
          const isReachable = reachable.has(s.id);
          btn.classList.toggle("is-dim", !isReachable);
          btn.setAttribute("aria-current", isCur ? "step" : "false");
          if (isCur) frame.moveTo(btn, { immediate: !!o.immediate });
        });

        TRANSITIONS.forEach((tr) => {
          const e = edgeMap.get(tr.id);
          const valid = validEdges.has(tr.id);
          e.g.classList.toggle("is-valid", valid);
          e.g.classList.toggle("is-dim", !valid);
          if (valid) svgEl.appendChild(e.g);
        });

        trigEls.forEach((btn, i) => {
          const trig = TRIGGERS[i];
          const enabled = trig.validIn.includes(current);
          btn.disabled = !enabled;
          if (trig.key === "step") {
            btn.textContent = current === "planning" ? "Run" : "Start";
          }
          const primary =
            enabled && (trig.key !== "reset" || current === "merged");
          btn.classList.toggle("is-ink", primary);
        });

        if (o.immediate) descEl.textContent = curObj.desc;
        else ctx.swapText(descEl, curObj.desc);
        if (o.announce) srEl.textContent = curObj.desc;
      }

      STATES.forEach((s) => {
        nodeMap.get(s.id).addEventListener("click", () => {
          setState(s.id, { immediate: false, announce: true });
        }, { signal: ctx.signal });
      });

      trigEls.forEach((btn, i) => {
        const trig = TRIGGERS[i];
        btn.addEventListener("click", () => {
          if (!trig.validIn.includes(current)) return;
          setState(trig.next(current), { immediate: false, announce: true });
        }, { signal: ctx.signal });
      });

      const relayout = () => {
        drawEdges();
        frame.refresh();
      };

      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(relayout);
        ro.observe(stageEl);
        ctx.signal.addEventListener("abort", () => ro.disconnect(), { once: true });
      }
      window.addEventListener("plainfacechange", () => requestAnimationFrame(relayout), { signal: ctx.signal });

      setState("executing", { immediate: true });
      requestAnimationFrame(() => {
        drawEdges();
        setState(current, { immediate: true });
      });
    },
  });
})();

</script>

  PlainPlayer.registerData({

    css: `

.dd-verification-funnel .vf-drop.is-lit { color: var(--ink); font-weight: 500; opacity: 1 }

  display: grid; gap: 6px; width: 100%; padding: 6px 0; text-align: left; cursor: pointer; color: var(--ink);
  -webkit-tap-highlight-color: transparent; transition: opacity var(--dur-pare) var(--ease-out) }
.dd-verification-funnel .vf-stage.is-dim { opacity: 0.22 }
.dd-verification-funnel .vf-stage:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px }
.dd-verification-funnel .vf-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px }
.dd-verification-funnel .vf-name { font-size: 14px; font-weight: 500; line-height: 1.3; color: var(--ink) }
.dd-verification-funnel .vf-stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap;
  transition: color var(--dur-instant) var(--ease-out) }
.dd-verification-funnel .vf-stage.is-lit .vf-stat { color: var(--ink); font-weight: 500 }
.dd-verification-funnel .vf-track { display: block; width: 100%; height: 5px }
.dd-verification-funnel .vf-track > .bar-fill { display: block }
`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="vf">
  <header class="vf-head">
    <div class="dd-card-title">
      <h3>Autonomous patch funnel</h3>
      <p class="vf-sub">${DEFAULT_READOUT}</p>
    </div>
    <span class="fig vf-fig">56.7 % merged</span>
  </header>
  <div class="vf-list" role="listbox" aria-label="Verification funnel stages">
    ${STAGES.map((s, i) => {
      const p = (s.count / BASE).toFixed(4);
      const dropHtml = s.drop ? `<div class="vf-drop" data-for="${i}" aria-hidden="true">${s.drop}</div>` : "";
      return `
      ${dropHtml}
      <button type="button" class="vf-stage" role="option" aria-selected="false" data-idx="${i}">
        <span class="vf-meta">
          <span class="vf-name">${s.name}</span>
          <span class="vf-stat">${s.stat}</span>
        </span>
        <span class="bar-track vf-track" aria-hidden="true">
          <span class="bar-fill" style="--p: ${p}"></span>
        </span>
      </button>`;
    }).join("")}
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;

      const listEl = host.querySelector(".vf-list");
      const subEl = host.querySelector(".vf-sub");
      const srEl = host.querySelector("[aria-live]");
      const stageEls = [...listEl.querySelectorAll(".vf-stage")];
      const dropMap = new Map();
      listEl.querySelectorAll(".vf-drop").forEach((el) => dropMap.set(Number(el.dataset.for), el));

      const frame = ctx.brackets(listEl, { padX: 6, padY: 1, exactPad: true });
      let pinnedIdx = -1;
      let hoverIdx = -1;

      function activeIdx() {
        return hoverIdx >= 0 ? hoverIdx : pinnedIdx;
      }

      function syncState(opts) {
        const o = opts || {};
        const cur = activeIdx();
        const hasActive = cur >= 0;

        stageEls.forEach((el, i) => {
          const on = i === cur;
          el.classList.toggle("is-lit", on);
          el.classList.toggle("is-dim", hasActive && !on);
          el.setAttribute("aria-selected", i === pinnedIdx ? "true" : "false");
          el.tabIndex = (pinnedIdx >= 0 ? i === pinnedIdx : i === 0) ? 0 : -1;
        });

        dropMap.forEach((dropEl, forIdx) => {
          const isPriorGate = hasActive && forIdx === cur;
          dropEl.classList.toggle("is-lit", isPriorGate);
          dropEl.classList.toggle("is-dim", hasActive && !isPriorGate);
        });

        if (hasActive) {
          frame.moveTo(stageEls[cur], { immediate: !!o.immediate });
        } else {
          frame.pare();
        }

        const nextSub = hasActive ? STAGES[cur].readout : DEFAULT_READOUT;
        subEl.classList.toggle("is-ink", hasActive);
        if (o.immediate) subEl.textContent = nextSub;
        else ctx.swapText(subEl, nextSub);
        if (o.announce && hasActive) srEl.textContent = STAGES[cur].readout;
      }

      stageEls.forEach((el, i) => {
        el.addEventListener("pointerenter", () => {
          hoverIdx = i;
          syncState({ immediate: false });
        }, { signal: ctx.signal });
        el.addEventListener("pointerleave", () => {
          if (hoverIdx === i) {
            hoverIdx = -1;
            syncState({ immediate: false });
          }
        }, { signal: ctx.signal });
        el.addEventListener("focus", () => {
          hoverIdx = i;
          syncState({ immediate: false });
        }, { signal: ctx.signal });
        el.addEventListener("blur", () => {
          if (hoverIdx === i) {
            hoverIdx = -1;
            syncState({ immediate: false });
          }
        }, { signal: ctx.signal });
        el.addEventListener("click", () => {
          pinnedIdx = pinnedIdx === i ? -1 : i;
          hoverIdx = -1;
          syncState({ immediate: false, announce: pinnedIdx >= 0 });
        }, { signal: ctx.signal });
      });

      listEl.addEventListener("keydown", (e) => {
        const keys = ["ArrowDown", "ArrowUp", "Home", "End", "Escape"];
        if (!keys.includes(e.key)) return;
        e.preventDefault();
        if (e.key === "Escape") {
          pinnedIdx = -1;
          hoverIdx = -1;
          syncState({ immediate: false });
          return;
        }
        const cur = activeIdx() >= 0 ? activeIdx() : 0;
        let next = cur;
        if (e.key === "ArrowDown") next = (cur + 1) % STAGES.length;
        else if (e.key === "ArrowUp") next = (cur - 1 + STAGES.length) % STAGES.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = STAGES.length - 1;
        pinnedIdx = next;
        hoverIdx = next;
        syncState({ immediate: false, announce: true });
        stageEls[next].focus();
      }, { signal: ctx.signal });

      window.addEventListener("plainfacechange", () => requestAnimationFrame(() => frame.refresh()), { signal: ctx.signal });
      syncState({ immediate: true });
    },
  });
})();

</script>
<script>
/* 11-data-table.js */
/* Evaluation ledger (Plain / Subtraction): open-paper sortable & filterable benchmark ledger.
   Zero outer border box: 1px --line-control under thead, 1px --line between body rows, 1px --line-strong above tfoot.
   Unselected filters sit at 0.40 opacity; inactive sort headers sit at 0.55 opacity; row hover dims siblings to 0.32. */
(function () {
  const RUNS = [
    { id: "run_8d12", task: "Migrate billing schema", model: "Opus", files: 9, tokens: 68.4, duration: 5.0, cost: 0.48, status: "regressed" },
    { id: "run_6a90", task: "Refactor AST walker", model: "Opus", files: 6, tokens: 48.4, duration: 6.4, cost: 0.37, status: "passed" },
    { id: "run_4c08", task: "Patch OAuth callback", model: "Opus", files: 5, tokens: 58.2, duration: 7.2, cost: 0.32, status: "regressed" },
    { id: "run_5e47", task: "Sync OpenAPI spec", model: "Sonnet", files: 2, tokens: 71.0, duration: 2.8, cost: 0.24, status: "passed" },
    { id: "run_7b3e", task: "Add rate limiter", model: "Sonnet", files: 3, tokens: 53.6, duration: 3.8, cost: 0.22, status: "passed" },
    { id: "run_9f4c", task: "Fix expired session", model: "Sonnet", files: 3, tokens: 41.2, duration: 2.4, cost: 0.18, status: "passed" },
  ];

  const FILTERS = [
    { key: "all", label: "All" },
    { key: "passed", label: "Passed" },
    { key: "regressed", label: "Regressed" },
  ];

  const SORT_COLS = {
    tokens: { label: "Tokens", prop: "tokens" },
    duration: { label: "Duration", prop: "duration" },
    cost: { label: "Cost", prop: "cost" },
  };

  function median(vals) {
    if (!vals.length) return 0;
    const s = vals.slice().sort((a, b) => a - b);
    const m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  function fmtFiles(v) {
    return Number.isInteger(v) ? String(v) : v.toFixed(1);
  }

  PlainPlayer.registerData({
    slug: "data-table",
    chapter: "tables",
    span: "full",
    title: "Evaluation ledger",
    css: `

.dd-data-table .dt-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px }
.dd-data-table .dt-titles { display: grid; gap: 3px; min-width: 0 }
.dd-data-table .dt-titles h3 { margin: 0; font: 500 var(--t-h3)/1.3 var(--font); letter-spacing: -0.01em; color: var(--ink) }
.dd-data-table .dt-sub { margin: 0; font-size: 13px; line-height: 1.4; color: var(--muted); font-variant-numeric: tabular-nums }

.dd-data-table .dt-table th,
.dd-data-table .dt-table td { padding: 10px 12px; text-align: left; vertical-align: baseline; white-space: nowrap; background: transparent }
.dd-data-table .dt-table th:first-child,
.dd-data-table .dt-table td:first-child { padding-left: 0 }
.dd-data-table .dt-table th:last-child,
.dd-data-table .dt-table td:last-child { padding-right: 0 }
.dd-data-table .dt-table .is-num { text-align: right }
.dd-data-table .dt-table .col-status { padding-left: 26px }
.dd-data-table .dt-table thead th { padding-top: 0; padding-bottom: 9px; border: 0; border-bottom: 1px solid var(--line-control);
  font-size: 12px; font-weight: 500; letter-spacing: 0.01em; color: var(--muted) }
.dd-data-table .dt-sort { display: inline-flex; align-items: baseline; justify-content: flex-end; gap: 4px; padding: 0; border: 0;
  background: none; font: 500 12px/1.3 var(--font); letter-spacing: 0.01em; color: var(--ink); opacity: 0.55; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: opacity var(--dur-instant) var(--ease-out) }
.dd-data-table .dt-sort:hover { opacity: 0.9 }
.dd-data-table .dt-sort.is-active { opacity: 1 }
.dd-data-table .dt-sort:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; opacity: 1 }
.dd-data-table .dt-arrow { display: none; font-size: 11.5px }
.dd-data-table .dt-sort.is-active .dt-arrow { display: inline-block }
.dd-data-table .dt-table tbody tr { background: transparent; transition: opacity var(--dur-pare) var(--ease-out) }
.dd-data-table .dt-table tbody:hover tr:not(:hover) { opacity: var(--sibling-dim) }
.dd-data-table .dt-table tbody td { border: 0; font-size: 14px; color: var(--ink) }
.dd-data-table .dt-table tbody tr.has-rule td { border-top: 1px solid var(--line) }
.dd-data-table .dt-run { font-family: var(--mono); font-size: 12.5px; color: var(--muted) }
.dd-data-table .dt-task { font-weight: 400; color: var(--ink) }
.dd-data-table .dt-model { font-size: 13.5px; color: var(--muted) }
.dd-data-table .dt-status-passed { color: var(--ink) }
.dd-data-table .dt-status-regressed { color: var(--danger); font-weight: 500 }
.dd-data-table .dt-table tfoot td { padding-top: 11px; padding-bottom: 2px; border: 0; border-top: 1px solid var(--line-strong);
  font-size: 13.5px; color: var(--ink) }
.dd-data-table .dt-sum-label { font-weight: 500; color: var(--ink) }
.dd-data-table .dt-sum-meta { font-size: 13px; color: var(--muted) }
.dd-data-table .dt-sum-num { font-weight: 500 }
@container (max-width: 480px) {
  .dd-data-table .dt-filters { gap: 18px; padding: 2px 10px }
}
`,
    mount(host, ctx) {
      let currentFilter = "all";
      let sortCol = "cost";
      let sortDir = "desc";

      host.innerHTML = `
<div class="dt-head">
  <div class="dt-titles">
    <h3>Evaluation ledger</h3>
    <p class="dt-sub"></p>
  </div>
  <div class="dt-filters" role="radiogroup" aria-label="Filter runs by status">
    ${FILTERS.map((f) => `<button class="q in-frame" type="button" role="radio" aria-checked="${f.key === "all" ? "true" : "false"}" tabindex="${f.key === "all" ? "0" : "-1"}" data-filter="${f.key}">${f.label}</button>`).join("")}
  </div>
</div>
<div class="dt-scroll">
  <table class="dt-table" aria-label="Evaluation ledger">
    <thead>
      <tr>
        <th scope="col">Run</th>
        <th scope="col">Task</th>
        <th scope="col">Model</th>
        <th scope="col" class="is-num">Files</th>
        <th scope="col" class="is-num" data-th="tokens" aria-sort="none">
          <button type="button" class="dt-sort" data-sort="tokens"><span>Tokens</span><span class="dt-arrow" aria-hidden="true"></span></button>
        </th>
        <th scope="col" class="is-num" data-th="duration" aria-sort="none">
          <button type="button" class="dt-sort" data-sort="duration"><span>Duration</span><span class="dt-arrow" aria-hidden="true"></span></button>
        </th>
        <th scope="col" class="is-num" data-th="cost" aria-sort="descending">
          <button type="button" class="dt-sort is-active" data-sort="cost"><span>Cost</span><span class="dt-arrow" aria-hidden="true">\u2193</span></button>
        </th>
        <th scope="col" class="col-status">Status</th>
      </tr>
    </thead>
    <tbody>
      ${RUNS.map((r) => `
      <tr data-id="${r.id}" data-status="${r.status}">
        <td class="dt-run">${r.id}</td>
        <td class="dt-task">${r.task}</td>
        <td class="dt-model">${r.model}</td>
        <td class="is-num">${r.files}</td>
        <td class="is-num">${r.tokens.toFixed(1)}k</td>
        <td class="is-num">${r.duration.toFixed(1)} s</td>
        <td class="is-num">$${r.cost.toFixed(2)}</td>
        <td class="col-status ${r.status === "regressed" ? "dt-status-regressed" : "dt-status-passed"}">${r.status === "regressed" ? "Regressed" : "Passed"}</td>
      </tr>`).join("")}
    </tbody>
    <tfoot>
      <tr>
        <td class="dt-sum-label">Summary</td>
        <td class="dt-sum-meta" data-sum="scope"></td>
        <td class="dt-sum-meta" data-sum="models"></td>
        <td class="is-num dt-sum-num" data-sum="files"></td>
        <td class="is-num dt-sum-num" data-sum="tokens"></td>
        <td class="is-num dt-sum-num" data-sum="duration"></td>
        <td class="is-num dt-sum-num" data-sum="cost"></td>
        <td class="col-status dt-sum-meta" data-sum="status"></td>
      </tr>
    </tfoot>
  </table>
</div>
<p class="sr-only" aria-live="polite"></p>`;

      const subEl = host.querySelector(".dt-sub");
      const filterWrap = host.querySelector(".dt-filters");
      const filterBtns = [...filterWrap.querySelectorAll("[data-filter]")];
      const sortBtns = [...host.querySelectorAll("[data-sort]")];
      const tbody = host.querySelector("tbody");
      const tfoot = host.querySelector("tfoot");
      const sr = host.querySelector("[aria-live]");
      const rowsById = new Map(RUNS.map((r) => [r.id, tbody.querySelector(`tr[data-id="${r.id}"]`)]));
      const sumEls = {
        scope: tfoot.querySelector('[data-sum="scope"]'),
        models: tfoot.querySelector('[data-sum="models"]'),
        files: tfoot.querySelector('[data-sum="files"]'),
        tokens: tfoot.querySelector('[data-sum="tokens"]'),
        duration: tfoot.querySelector('[data-sum="duration"]'),
        cost: tfoot.querySelector('[data-sum="cost"]'),
        status: tfoot.querySelector('[data-sum="status"]'),
      };

      const filterFrame = ctx.brackets(filterWrap, { padX: 9, padY: 2, exactPad: true });

      function getOrderedRuns() {
        const prop = SORT_COLS[sortCol].prop;
        const mult = sortDir === "asc" ? 1 : -1;
        return RUNS.slice().sort((a, b) => (a[prop] - b[prop]) * mult);
      }

      function getVisibleRuns(ordered) {
        return ordered.filter((r) => currentFilter === "all" || r.status === currentFilter);
      }

      function syncRulesAndSummary(visibleRuns, immediate) {
        let seenVisible = 0;
        for (const tr of [...tbody.children]) {
          if (tr.hidden) {
            tr.classList.remove("has-rule");
          } else {
            tr.classList.toggle("has-rule", seenVisible > 0);
            seenVisible++;
          }
        }

        const total = RUNS.length;
        const vis = visibleRuns.length;
        const regCount = visibleRuns.filter((r) => r.status === "regressed").length;
        const passCount = vis - regCount;
        const sortLabel = SORT_COLS[sortCol].label.toLowerCase() + " " + (sortDir === "asc" ? "\u2191" : "\u2193");

        let subText;
        if (currentFilter === "all") {
          subText = `${total} runs \u00b7 ${passCount} passed, ${regCount} regressed \u00b7 sorted by ${sortLabel}`;
        } else if (currentFilter === "passed") {
          subText = `${vis} of ${total} runs \u00b7 Passed only \u00b7 sorted by ${sortLabel}`;
        } else {
          subText = `${vis} of ${total} runs \u00b7 Regressed only \u00b7 sorted by ${sortLabel}`;
        }

        const opusCount = visibleRuns.filter((r) => r.model === "Opus").length;
        const sonnetCount = vis - opusCount;
        const modelParts = [];
        if (opusCount) modelParts.push(`${opusCount} Opus`);
        if (sonnetCount) modelParts.push(`${sonnetCount} Sonnet`);

        const scopeText = `Median \u00b7 ${vis} ${vis === 1 ? "run" : "runs"}`;
        const modelsText = modelParts.join(" \u00b7 ");
        const filesText = fmtFiles(median(visibleRuns.map((r) => r.files)));
        const tokensText = `${median(visibleRuns.map((r) => r.tokens)).toFixed(1)}k`;
        const durText = `${median(visibleRuns.map((r) => r.duration)).toFixed(1)} s`;
        const costText = `$${median(visibleRuns.map((r) => r.cost)).toFixed(2)}`;
        const statusText = regCount > 0 ? `${regCount} regressed` : "All passed";

        sumEls.status.className = "col-status " + (regCount > 0 ? "dt-status-regressed" : "dt-sum-meta");

        if (immediate) {
          subEl.textContent = subText;
        } else {
          ctx.swapText(subEl, subText);
        }
        sumEls.scope.textContent = scopeText;
        sumEls.models.textContent = modelsText;
        sumEls.files.textContent = filesText;
        sumEls.tokens.textContent = tokensText;
        sumEls.duration.textContent = durText;
        sumEls.cost.textContent = costText;
        sumEls.status.textContent = statusText;
      }

      function syncSortHeaders() {
        for (const btn of sortBtns) {
          const col = btn.dataset.sort;
          const on = col === sortCol;
          const th = btn.closest("th");
          const arrow = btn.querySelector(".dt-arrow");
          btn.classList.toggle("is-active", on);
          th.setAttribute("aria-sort", on ? (sortDir === "asc" ? "ascending" : "descending") : "none");
          arrow.textContent = on ? (sortDir === "asc" ? "\u2191" : "\u2193") : "";
        }
      }

      function applyTableState(opts) {
        const o = opts || {};
        const ordered = getOrderedRuns();
        const visible = getVisibleRuns(ordered);
        const visibleIds = new Set(visible.map((r) => r.id));
        const newlyShown = [];

        for (const r of ordered) {
          const tr = rowsById.get(r.id);
          if (tr.hidden && visibleIds.has(r.id) && !o.immediate) newlyShown.push(tr);
        }

        const footBefore = !o.immediate && !ctx.reduced() ? tfoot.getBoundingClientRect() : null;

        ctx.flip(tbody, () => {
          for (const r of ordered) {
            const tr = rowsById.get(r.id);
            tr.hidden = !visibleIds.has(r.id);
            tbody.appendChild(tr);
          }
          syncRulesAndSummary(visible, !!o.immediate);
        });

        if (footBefore && !ctx.reduced()) {
          const footAfter = tfoot.getBoundingClientRect();
          const dy = footBefore.top - footAfter.top;
          if (Math.abs(dy) > 0.5 && tfoot.animate) {
            tfoot.animate(
              [{ transform: `translateY(${dy.toFixed(1)}px)` }, { transform: "none" }],
              { duration: 210, easing: PlainPlayer.EASE_SETTLE }
            );
          }
          for (const tr of newlyShown) {
            if (tr.animate) {
              tr.animate(
                [{ opacity: 0, transform: "translateX(-4px)" }, { opacity: 1, transform: "none" }],
                { duration: 150, easing: PlainPlayer.EASE_OUT }
              );
            }
          }
        }
      }

      function setFilter(next, immediate, byUser) {
        if (currentFilter === next && !immediate) return;
        currentFilter = next;
        for (const b of filterBtns) {
          const on = b.dataset.filter === next;
          b.setAttribute("aria-checked", on ? "true" : "false");
          b.tabIndex = on ? 0 : -1;
          if (on) filterFrame.moveTo(b, { immediate });
        }
        applyTableState({ immediate });
        if (byUser) {
          const vis = getVisibleRuns(getOrderedRuns()).length;
          sr.textContent = `Showing ${vis} of ${RUNS.length} runs (${next}).`;
        }
      }

      function setSort(col, byUser) {
        if (sortCol === col) {
          sortDir = sortDir === "desc" ? "asc" : "desc";
        } else {
          sortCol = col;
          sortDir = "desc";
        }
        syncSortHeaders();
        applyTableState({ immediate: false });
        if (byUser) {
          sr.textContent = `Sorted by ${SORT_COLS[sortCol].label}, ${sortDir === "asc" ? "ascending" : "descending"}.`;
        }
      }

      for (const b of filterBtns) {
        b.addEventListener("click", () => setFilter(b.dataset.filter, false, true), { signal: ctx.signal });
      }

      filterWrap.addEventListener("keydown", (e) => {
        const idx = filterBtns.findIndex((b) => b.dataset.filter === currentFilter);
        let next = -1;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (idx + 1) % filterBtns.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (idx - 1 + filterBtns.length) % filterBtns.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = filterBtns.length - 1;
        if (next >= 0) {
          e.preventDefault();
          const btn = filterBtns[next];
          setFilter(btn.dataset.filter, false, true);
          btn.focus();
        }
      }, { signal: ctx.signal });

      for (const b of sortBtns) {
        b.addEventListener("click", () => setSort(b.dataset.sort, true), { signal: ctx.signal });
      }

      syncSortHeaders();
      setFilter("all", true, false);
    },
  });
})();

</script>
<script>
/* 12-heatmap.js */
/* 14-day suite reliability (Plain / Subtraction): 5 suites x 14 days monochrome R7 magnitude heatmap.
   4 crisp ink steps (--ink-8, --ink-18, --ink-42, and solid --ink with --page figure for the 3 < 95 % anomalies).
   Zero floating tooltip box: inspecting a cell frames it in 4 corner hairlines, dims other rows to 0.30, and states the datum in the header. */
(function () {

    mount(host, ctx) {
      let currentFilter = "all";
      let focusR = 1;
      let focusC = 8; // Billing · Day 9 (91.2 % · 4 timeouts)
      let activeCell = null;

      const totalRates = SUITES.flatMap((s) => s.days.map((d) => d[0]));
      const overall = (totalRates.reduce((a, b) => a + b, 0) / totalRates.length).toFixed(1);

        ${s.days.map((d, c) => {

          const txt = step === 3 ? `${Math.round(d[0])}%` : "";

      </div>`;
      }).join("")}

  <span class="hm-key-item" data-k="0"><i class="hm-sw hm-sw-0" aria-hidden="true"></i>100 %</span>
  <span class="hm-key-item" data-k="1"><i class="hm-sw hm-sw-1" aria-hidden="true"></i>98\u201399 %</span>

      const readoutEl = host.querySelector(".hm-readout");
      const filterWrap = host.querySelector(".hm-filters");
      const filterBtns = [...filterWrap.querySelectorAll("[data-filter]")];
      const matrixEl = host.querySelector(".hm-matrix");
      const rowsWrap = host.querySelector(".hm-rows");
      const rowEls = [...rowsWrap.querySelectorAll(".hm-row")];
      const dayEls = [...host.querySelectorAll(".hm-day")];
      const keyEl = host.querySelector(".hm-key");
      const sr = host.querySelector("[aria-live]");
      const cells = SUITES.map((_, r) => [...rowEls[r].querySelectorAll(".hm-cell")]);

      const filterFrame = ctx.brackets(filterWrap, { padX: 9, padY: 2, exactPad: true });
      const cellFrame = ctx.brackets(rowsWrap, { padX: 2, padY: 2, size: 6, exactPad: true });

      function defaultReadout() {
        if (currentFilter === "anomalies") {
          return "3 anomalies below 95 % \u00b7 Billing D9 (91.2 %), Search D4 (93.4 %), Webhooks D12 (89.6 %)";
        }
        if (currentFilter === "below99") {
          return "41 degraded suite-days (< 99 %) across 14 days \u00b7 29 clean days stepped back";
        }
        return "5 suites \u00d7 14 days \u00b7 3 anomalies below 95 %";
      }

      function renderCellReadout(r, c) {
        const s = SUITES[r];
        const [rate, note] = s.days[c];
        const step = stepOf(rate);
        readoutEl.classList.add("is-active");
        readoutEl.textContent = "";
        const prefix = document.createTextNode(`${s.name} \u00b7 Day ${c + 1} \u00b7 ${rate.toFixed(1)} % \u00b7 `);
        readoutEl.appendChild(prefix);
        if (step === 3) {
          const span = document.createElement("span");
          span.className = "hm-alert";
          span.textContent = note;
          readoutEl.appendChild(span);
        } else {
          readoutEl.appendChild(document.createTextNode(note));
        }
      }

      function resetReadout() {
        readoutEl.classList.remove("is-active");
        readoutEl.textContent = defaultReadout();
      }

      function syncRoving(focusDom) {
        for (let r = 0; r < SUITES.length; r++) {
          for (let c = 0; c < 14; c++) {
            cells[r][c].tabIndex = r === focusR && c === focusC ? 0 : -1;
          }

        if (focusDom) cells[focusR][focusC].focus({ preventScroll: true });

      function inspectCell(r, c, opts) {
        const o = opts || {};
        const btn = cells[r][c];
        const firstShow = !activeCell;
        activeCell = [r, c];
        rowsWrap.classList.add("is-inspecting");
        rowEls.forEach((el, idx) => el.classList.toggle("is-row-active", idx === r));
        dayEls.forEach((el, idx) => el.classList.toggle("is-active", idx === c));
        for (let rr = 0; rr < SUITES.length; rr++) {
          for (let cc = 0; cc < 14; cc++) {
            cells[rr][cc].classList.toggle("is-cell-active", rr === r && cc === c);
          }
        }
        cellFrame.moveTo(btn, { immediate: !!o.immediate || firstShow });
        renderCellReadout(r, c);
        if (o.announce) {
          const s = SUITES[r];
          const [rate, note] = s.days[c];
          sr.textContent = `${s.name}, Day ${c + 1}, ${rate.toFixed(1)} percent, ${note}.`;
        }
      }

      function clearInspect() {
        if (!activeCell) return;
        activeCell = null;
        rowsWrap.classList.remove("is-inspecting");
        rowEls.forEach((el) => el.classList.remove("is-row-active"));
        dayEls.forEach((el) => el.classList.remove("is-active"));
        for (let rr = 0; rr < SUITES.length; rr++) {
          for (let cc = 0; cc < 14; cc++) cells[rr][cc].classList.remove("is-cell-active");
        }

        currentFilter = next;

        keyEl.dataset.filter = next;
        for (const b of filterBtns) {
          const on = b.dataset.filter === next;

          const btn = cells[r][c];
          btn.addEventListener("pointerenter", () => {
            inspectCell(r, c, { immediate: false });
          }, { signal: ctx.signal });
          btn.addEventListener("click", () => {
            focusR = r;
            focusC = c;
            syncRoving(true);
            inspectCell(r, c, { announce: true });
          }, { signal: ctx.signal });
        }
      }

      rowsWrap.addEventListener("pointerleave", () => {
        if (!rowsWrap.contains(document.activeElement)) clearInspect();
      }, { signal: ctx.signal });

      rowsWrap.addEventListener("focusin", (e) => {
        const btn = e.target.closest(".hm-cell");
        if (!btn) return;
        const r = Number(btn.dataset.r);
        const c = Number(btn.dataset.c);
        focusR = r;
        focusC = c;
        syncRoving(false);
        inspectCell(r, c, { immediate: false });
      }, { signal: ctx.signal });

      rowsWrap.addEventListener("focusout", (e) => {
        if (!rowsWrap.contains(e.relatedTarget)) clearInspect();
      }, { signal: ctx.signal });

      rowsWrap.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && activeCell) {
          e.preventDefault();
          cells[focusR][focusC].blur();
          clearInspect();
          return;
        }
        let nr = focusR;
        let nc = focusC;
        if (e.key === "ArrowRight") nc = (nc + 1) % 14;
        else if (e.key === "ArrowLeft") nc = (nc + 13) % 14;
        else if (e.key === "ArrowDown") nr = (nr + 1) % SUITES.length;
        else if (e.key === "ArrowUp") nr = (nr + SUITES.length - 1) % SUITES.length;
        else if (e.key === "Home") nc = 0;
        else if (e.key === "End") nc = 13;
        else return;
        e.preventDefault();
        focusR = nr;
        focusC = nc;
        syncRoving(true);
        inspectCell(nr, nc, { announce: true });
      }, { signal: ctx.signal });

      for (const b of filterBtns) {
        b.addEventListener("click", () => setFilter(b.dataset.filter, false, true), { signal: ctx.signal });
      }

      filterWrap.addEventListener("keydown", (e) => {
        const idx = filterBtns.findIndex((b) => b.dataset.filter === currentFilter);
        let next = -1;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (idx + 1) % filterBtns.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (idx - 1 + filterBtns.length) % filterBtns.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = filterBtns.length - 1;
        if (next >= 0) {
          e.preventDefault();
          const btn = filterBtns[next];
          setFilter(btn.dataset.filter, false, true);
          btn.focus();
        }
      }, { signal: ctx.signal });

      setFilter("all", true, false);
    },
  });
})();

</script>
