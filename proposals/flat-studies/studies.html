          if (byHand || ctx.reduced()) { moving = false; spring.jump(target); if (!byHand) settled(p.key); }
          else { moving = true; spring.set(target); }
        }
        function turnTo(i) {
          const next = Math.min(p.detents, Math.max(0, i));
          if (next === index && !moving) return;
          travelling.delete(p.key);
          values[p.key] = valueAt(next, p);
          if (status !== "edited") { status = "edited"; drawTop(true); live.textContent = "Preset edited"; }
          show(values[p.key], true);
        }
        const fromX = (x) => { const r = track.getBoundingClientRect(), rad = r.height / 2; return Math.round(((x - r.left - rad) / (r.width - 2 * rad)) * p.detents); };
        track.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          track.setPointerCapture(e.pointerId); drag = e.pointerId; turnTo(fromX(e.clientX));
        }, sig);
        track.addEventListener("pointermove", (e) => { if (drag === e.pointerId) turnTo(fromX(e.clientX)); }, sig);
        const end = (e) => { if (drag === e.pointerId) drag = null; };
        track.addEventListener("pointerup", end, sig); track.addEventListener("pointercancel", end, sig);
        track.addEventListener("keydown", (e) => {
          const page = Math.max(1, Math.round(p.detents / 10));
          const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: page, PageDown: -page }[e.key];
          if (d) turnTo(index + d); else if (e.key === "Home") turnTo(0); else if (e.key === "End") turnTo(p.detents); else return;
          e.preventDefault();
        }, sig);
        show(values[p.key], true);
        return { show, stop: () => spring.stop() };
      }
      const sliders = Object.fromEntries(PARAMS.map((p) => [p.key, Slider(p)]));

      function settled(key) {
        if (!travelling.delete(key) || travelling.size) return;
        status = "loaded"; drawTop(false); live.textContent = PRESETS[preset].name + " preset loaded";
      }
      /* The sliders glide to the preset one after another. */
      function recall(next) {
        timers.forEach(clearTimeout);
        const target = Object.fromEntries(PARAMS.map((p) => [p.key, valueAt(PRESETS[next].at[p.key], p)]));
        const moving = PARAMS.filter((p) => values[p.key] !== target[p.key]).map((p) => p.key);
        travelling.clear(); moving.forEach((k) => travelling.add(k));
        preset = next; status = moving.length ? "moving" : "loaded"; drawTop(true);
        if (!moving.length) live.textContent = PRESETS[next].name + " preset loaded";
        timers = moving.map((key, i) => ctx.after(i * STAGGER, () => { values[key] = target[key]; sliders[key].show(values[key], false); }));
      }
      opts.forEach((o) => o.addEventListener("click", () => recall(o.dataset.p), sig));
      seg.addEventListener("keydown", (e) => {
        const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (!d) return;
        e.preventDefault();
        const next = preset === "voice" ? "music" : "voice";
        recall(next); opts.find((o) => o.dataset.p === next).focus();
      }, sig);
      drawTop(false);

      /* On mount it loads Voice; until a hand arrives it compares the two presets. */
      let handed = false;
      ctx.onHand(() => { handed = true; });
      ctx.after(350, () => recall("voice"));
      if (!ctx.reduced()) ctx.every(2600, () => { if (!handed) recall(preset === "voice" ? "music" : "voice"); });
      return { destroy() { Object.values(sliders).forEach((s) => s.stop()); if (indSpring) indSpring.stop(); } };
    },
  });
})();

</script>
<script>
/* magnetic-button.js */
/* Magnetic Button, redesigned in Flat: a newsletter's sign-up. One white paper with the reader count as its large
   figure and the one ink action, Subscribe, which has a little gravity: as the pointer comes near it leans toward it
   on two bouncy springs (stiffness 260, damping 12, one per axis, so a moving hand keeps the momentum and letting go
   overshoots and settles), its label riding half as far again. Subscribing counts you in. */
FlatPlayer.register({
  slug: "magnetic-button",
  title: "Magnetic Button",
  tagline: "A button with a little gravity.",
  css: `
.fs-magnetic-button .mb { width: min(100%, 400px); background: var(--paper); border-radius: var(--r-paper); padding: 32px 24px 30px;
  display: grid; justify-items: center; gap: 2px; text-align: center }
.fs-magnetic-button .mb-name { font-size: 15px; font-weight: 500 }
.fs-magnetic-button .mb-count { margin-top: 10px; font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums }
.fs-magnetic-button .mb-line { margin: 4px 0 0; font-size: 14px; color: var(--muted) }
.fs-magnetic-button .mb-field { margin-top: 18px; padding: 6px 28px }
.fs-magnetic-button .mb-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 24px;
  border: 0; border-radius: var(--r-pill); background: var(--ink); color: var(--on-ink); font: 500 15px/1 var(--font); letter-spacing: -0.01em;
  cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; transition: background-color var(--dur-responsive), color var(--dur-responsive) }
.fs-magnetic-button .mb-btn[aria-pressed="true"] { background: var(--bubble); color: var(--ink) }
.fs-magnetic-button .mb-scale { display: inline-flex; transition: transform 150ms cubic-bezier(0.23, 1, 0.32, 1) }
.fs-magnetic-button .mb-btn:active .mb-scale { transform: scale(0.97) }
.fs-magnetic-button .mb-label { display: inline-flex; align-items: center; gap: 8px }
.fs-magnetic-button .mb-label svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
.fs-magnetic-button.is-tile .mb { padding: 18px 18px 18px; width: min(100%, 290px) }
.fs-magnetic-button.is-tile .mb-count { font-size: 38px; margin-top: 6px }
.fs-magnetic-button.is-tile .mb-field { margin-top: 10px }
.fs-magnetic-button.is-tile .mb-btn { height: 42px }
`,
  mount(host, ctx) {
    const ARROW = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10m0 0L9 4m4 4-4 4"/></svg>';
    const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg>';
    host.innerHTML = `<div class="mb">
      <span class="mb-name">The Sunday letter</span>
      <span class="mb-count" aria-hidden="true"></span>
      <p class="mb-line">readers get it every week</p>
      <div class="mb-field"><button type="button" class="mb-btn" aria-pressed="false"><span class="mb-scale"><span class="mb-label"></span></span></button></div>
      <p class="sr-only" aria-live="polite"></p>
    </div>`;
    const card = host.querySelector(".mb"), btn = host.querySelector(".mb-btn"), label = host.querySelector(".mb-label");
    const countEl = host.querySelector(".mb-count"), live = host.querySelector("[aria-live]");
    const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    const BASE = 1203;
    let on = false;
    const count = ctx.spring(BASE, (v) => (countEl.textContent = fmt(v)), { duration: 0.4, bounce: 0 });
    count.jump(BASE);
    const paintBtn = () => { label.innerHTML = on ? "Subscribed " + CHECK : "Subscribe " + ARROW; btn.setAttribute("aria-pressed", String(on)); };
    paintBtn();

    /* Flat's arrival: the paper comes in on the expressive spring. */
    if (!ctx.reduced() && card.animate) card.animate([{ transform: "translateY(12px) scale(0.96)", opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 579, easing: "linear(0, 0.0897, 0.2671, 0.4643, 0.6434, 0.7874, 0.8925, 0.9624, 1.004, 1.0249, 1.0322, 1.0295, 1.0237, 1.0173, 1.0115, 1.0068, 1.0034, 1.0012, 0.9998, 0.9992, 1)" });

    const STRENGTH = 0.35, REACH = 150; // the pull fades to nothing this far past the button's edge
    const BOUNCY = { duration: (2 * Math.PI) / Math.sqrt(260), bounce: 1 - 12 / (2 * Math.sqrt(260)) }; // stiffness 260, damping 12
    const pos = { x: 0, y: 0 };
    const write = () => {
      btn.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0)`;
      label.style.transform = `translate3d(${pos.x * 0.5}px, ${pos.y * 0.5}px, 0)`;
    };
    const sx = ctx.spring(0, (v) => { pos.x = v; write(); }, BOUNCY);
    const sy = ctx.spring(0, (v) => { pos.y = v; write(); }, BOUNCY);

    /* Measured without our own transform, so the target never chases itself. */
    function lean(clientX, clientY) {
      const r = btn.getBoundingClientRect();
      const cx = r.left - pos.x + r.width / 2, cy = r.top - pos.y + r.height / 2;
      const dx = clientX - cx, dy = clientY - cy;
      const out = Math.max(0, Math.abs(dx) - r.width / 2) + Math.max(0, Math.abs(dy) - r.height / 2); // distance past the edge, roughly
      const f = Math.max(0, 1 - out / REACH);
      sx.set(dx * STRENGTH * f); sy.set(dy * STRENGTH * f);
    }
    let ghost = !ctx.reduced();
    card.addEventListener("pointermove", (e) => { if (ctx.reduced()) return; ghost = false; lean(e.clientX, e.clientY); }, { signal: ctx.signal });
    card.addEventListener("pointerleave", () => { sx.set(0); sy.set(0); }, { signal: ctx.signal });
    btn.addEventListener("click", () => {
      on = !on; paintBtn();
      count.set(BASE + (on ? 1 : 0));
      if (ctx.reduced()) count.jump(BASE + (on ? 1 : 0));
      live.textContent = on ? "Subscribed. You're reader 1,204." : "Unsubscribed";
    }, { signal: ctx.signal });

    /* The self-run: an unseen hand drifts round the button, tugs it about, then lets go so it overshoots and settles. */
    if (ghost) {
      let t = 0;
      const tug = () => {
        if (!ghost) return;
        const r = btn.getBoundingClientRect(), a = t++ * 2.4 + 0.6;
        lean(r.left - pos.x + r.width / 2 + Math.cos(a) * r.width * 0.6, r.top - pos.y + r.height / 2 + Math.sin(a) * r.height * 1.1);
      };
      const round = () => {
        if (!ghost) return;
        for (let i = 0; i < 3; i++) ctx.after(500 + i * 380, tug);
        ctx.after(500 + 3 * 380 + 200, () => { if (ghost) { sx.set(0); sy.set(0); } });
      };
      round();
      ctx.every(3200, round);
    }
    ctx.onHand(() => { ghost = false; });

    return { destroy() { sx.stop(); sy.stop(); count.stop(); } };
  },
});

</script>
<script>
/* number-ticker.js */
/* Number Ticker, after litterthanlit/components, redesigned for Flat: a newsletter's subscriber count on a
   paper card. The count is the one large figure; each of its digits rolls on its own spring, forward through
   9 to 0 when it counts up (as a counter carries) and back when it counts down, the rightmost first.
   Readers arrive by themselves while it runs; a hand picks the period (Today, This week, All time) and the
   figure rolls to it. Intl.NumberFormat does the formatting, so any locale works. */
(function () {
  const S = ".fs-number-ticker";
  const FIGURES = Array.from({ length: 20 }, (_, i) => String(i % 10)); // two turns, so a digit can carry either way
  const STAGGER = 45; // ms between one digit starting and the next, from the right
  const DIGIT = { duration: (2 * Math.PI) / Math.sqrt(150), bounce: 1 - 21 / (2 * Math.sqrt(150)) }; // the original's k 150, c 21
  const FORMAT = new Intl.NumberFormat("en-US");
  const BASE = [
    { key: "today", label: "Today", value: 38, change: 12, since: "than yesterday" },
    { key: "week", label: "This week", value: 412, change: 64, since: "than last week" },
    { key: "all", label: "All time", value: 12480, change: 1240, since: "this month" },
  ];
  let uid = 0;

  FlatPlayer.register({
    slug: "number-ticker",
    title: "Number Ticker",
    tagline: "A count that rolls, digit by digit, any locale.",
    css: `
${S} .nt { width: min(100%, 360px); background: var(--paper); border-radius: var(--r-paper); padding: 22px 22px 20px; display: grid; gap: 4px; text-align: left }
${S} .nt-label { color: var(--muted); font-size: 14px }
${S} .nt-num { margin: 0; display: flex; align-items: center; font-size: 48px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; height: 1.15em }
${S} .nt-digit { position: relative; height: 1.15em; width: 0.62em; overflow: hidden; flex: none;
  mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent) }
${S} .nt-strip { position: absolute; inset: 0 0 auto; display: flex; flex-direction: column; will-change: transform }
${S} .nt-strip span { display: grid; place-items: center; height: 1.15em }
${S} .nt-sep { flex: none; width: 0.26em; text-align: center }
${S} .nt-change { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); min-height: 20px }
${S} .nt-change b { font-weight: 500; color: var(--ink) }
${S} .nt-seg { position: relative; margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); height: 40px; padding: 0; border-radius: var(--r-pill) }
${S} .nt-thumb { position: absolute; top: 0; bottom: 0; left: 0; width: calc(100% / 3); border-radius: var(--r-pill); background: var(--bubble) }
${S} .nt-opt { position: relative; border: 0; background: transparent; border-radius: var(--r-pill); font-size: 14px; color: var(--muted); cursor: pointer; padding: 0 6px;
  white-space: nowrap; transition: color var(--dur-instant) }
${S} .nt-opt:hover { color: var(--ink) }
${S} .nt-opt[aria-checked="true"] { color: var(--ink); font-weight: 500 }
@container (max-width: 380px) {
  ${S} .nt { padding: 18px 18px 16px }
  ${S} .nt-num { font-size: 42px }
  ${S} .nt-seg { margin-top: 12px; height: 36px }
}
`,
    mount(host, ctx) {
      const id = "nt" + ++uid;
      const PERIODS = BASE.map((p) => Object.assign({}, p));
      host.innerHTML = `
<div class="nt">
  <span class="nt-label" id="${id}-l">Subscribers</span>
  <p class="nt-num"><span class="sr-only nt-said"></span><span class="nt-digits" aria-hidden="true" style="display:contents"></span></p>
  <span class="nt-change"></span>
  <div class="nt-seg" role="radiogroup" aria-label="Period"><span class="nt-thumb" aria-hidden="true"></span></div>
  <p class="sr-only nt-live" aria-live="polite"></p>
</div>`;
      const $ = (s) => host.querySelector(s);
      const digitsEl = $(".nt-digits"), said = $(".nt-said"), live = $(".nt-live"), changeEl = $(".nt-change"), seg = $(".nt-seg"), thumb = $(".nt-thumb");
      const digits = new Map(); // keyed from the right, so digits stay put when the length changes

      function makeDigit(order) {
        const el = document.createElement("span");
        el.className = "nt-digit";
        const strip = document.createElement("span");
        strip.className = "nt-strip";
        strip.innerHTML = FIGURES.map((d) => "<span>" + d + "</span>").join("");
        el.appendChild(strip);
        const d = { el, order, at: 0, target: 0, timer: 0 };
        d.spring = ctx.spring(0, (pos) => {
          d.at = pos;
          strip.style.transform = "translateY(" + (-pos * 5).toFixed(3) + "%)";
          if (pos === d.target && pos >= 10) { d.target = pos - 10; d.spring.jump(pos - 10); } // fold back onto the first turn
        }, DIGIT);
        d.roll = (figure, direction) => {
          clearTimeout(d.timer);
          const from = Math.round(d.at) % 10;
          if (from === figure && Math.abs(d.at - Math.round(d.at)) < 0.01) return;
          if (ctx.reduced()) { d.target = figure; d.spring.jump(figure); return; }
          const start = direction < 0 && figure > from ? from + 10 : from;
          const to = direction > 0 && figure < from ? figure + 10 : figure;
          if (start !== from) d.spring.jump(start);
          d.timer = ctx.after(d.order * STAGGER, () => { d.target = to; d.spring.set(to); });
        };
        return d;
      }

      let at = 2, value = PERIODS[2].value, change = PERIODS[2].change;
      function render(direction, first) {
        const formatted = FORMAT.format(value);
        said.textContent = formatted + " subscribers";
        const chars = formatted.split("");
        const count = chars.filter((c) => /\d/.test(c)).length;
        let seen = 0;
        const nodes = [], keep = new Set();
        for (const c of chars) {
          if (!/\d/.test(c)) { const s = document.createElement("span"); s.className = "nt-sep"; s.textContent = c; nodes.push(s); continue; }
          const fromRight = count - seen++;
          keep.add(fromRight);
          let d = digits.get(fromRight);
          if (!d) {
            d = makeDigit(fromRight - 1); digits.set(fromRight, d);
            if (!first && !ctx.reduced()) d.el.animate([{ width: "0em", opacity: 0 }, { width: "0.62em", opacity: 1 }], { duration: 250, easing: "ease-out" });
          }
          nodes.push(d.el);
          d.next = Number(c);
        }
        for (const [k, d] of digits) if (!keep.has(k)) { d.spring.stop(); clearTimeout(d.timer); digits.delete(k); }
        digitsEl.replaceChildren(...nodes);
        if (!first) for (const d of digits.values()) d.roll(d.next, direction);
        changeEl.innerHTML = "<b>+" + FORMAT.format(change) + "</b><span>" + PERIODS[at].since + "</span>";
      }

      /* The period picker: a radiogroup, the grey bubble gliding under the chosen one. */
      const thumbX = ctx.spring(at, (x) => { thumb.style.transform = "translateX(" + (x * 100).toFixed(2) + "%)"; });
      thumbX.jump(at);
      const opts = PERIODS.map((p, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "nt-opt"; b.setAttribute("role", "radio"); b.textContent = p.label;
        if (ctx.tile) b.tabIndex = -1;
        seg.appendChild(b);
        return b;
      });
      function pick(i, said) {
        const before = value;
        at = i; value = PERIODS[i].value; change = PERIODS[i].change;
        opts.forEach((b, j) => { b.setAttribute("aria-checked", String(j === i)); if (!ctx.tile) b.tabIndex = j === i ? 0 : -1; });
        thumbX.set(i);
        render(value >= before ? 1 : -1);
        if (said) live.textContent = PERIODS[i].label + ": " + FORMAT.format(value) + " subscribers";
      }
      opts.forEach((b, i) => {
        b.addEventListener("click", () => pick(i, true), { signal: ctx.signal });
        b.addEventListener("keydown", (e) => {
          const n = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: PERIODS.length - 1 }[e.key];
          if (n === undefined) return;
          e.preventDefault();
          const k = (n + PERIODS.length) % PERIODS.length;
          pick(k, true); opts[k].focus();
        }, { signal: ctx.signal });
      });
      opts.forEach((b, j) => { b.setAttribute("aria-checked", String(j === at)); if (!ctx.tile) b.tabIndex = j === at ? 0 : -1; });

      // Digits mount at 0 and roll to the count on the first frame.
      render(1, true);
      requestAnimationFrame(() => { if (!ctx.signal.aborted) for (const d of digits.values()) d.roll(d.next, 1); });

      // Readers arrive by themselves (now and then one leaves) until a hand arrives.
      let auto = 0;
      if (!ctx.reduced()) auto = ctx.every(2600, () => {
        const by = Math.random() < 0.2 ? -1 : 1 + Math.floor(Math.random() * (at === 2 ? 40 : 6));
        const before = value;
        value = Math.max(0, value + by);
        PERIODS[at].value = value; // keeps the period's own count for when the hand comes back to it
        if (by > 0) change += by;
        render(value >= before ? 1 : -1);
      });
      ctx.onHand(() => clearInterval(auto));

      return { destroy() { thumbX.stop(); for (const d of digits.values()) { d.spring.stop(); clearTimeout(d.timer); } } };
    },
  });
})();

</script>
<script>
/* one-time-code.js */
/* One-Time Code, after litterthanlit/components, redesigned for Flat: a sign-in's second step for someone
   with a newsletter. Six white rounded squares on the grey ground, one large figure in each. It is one real
   input laid over them, so paste ("482-913" lands as 482913), autofill, password managers, screen readers and
   native selection all work; the squares follow its selection. A right code turns them ink one after another
   on the expressive spring; a wrong one shakes and says so. No keypad: the phone's own keyboard is the keypad. */
(function () {
  const S = ".fs-one-time-code";
  const LENGTH = 6;
  const EXPRESSIVE = "linear(0, 0.0897, 0.2671, 0.4643, 0.6434, 0.7874, 0.8925, 0.9624, 1.004, 1.0249, 1.0322, 1.0295, 1.0237, 1.0173, 1.0115, 1.0068, 1.0034, 1.0012, 0.9998, 0.9992, 1)";
  const SHAKE = [{ transform: "translateX(0)" }, { transform: "translateX(-8px)" }, { transform: "translateX(6px)" },
    { transform: "translateX(-4px)" }, { transform: "translateX(2px)" }, { transform: "translateX(0)" }];
  /* Codes as the email sends them; on the second round the ghost swaps two figures, then fixes them. */
  const ROUNDS = [{ sent: "482913" }, { sent: "730516", slip: "730561" }, { sent: "159260" }, { sent: "604871", slip: "604817" }];
  const VERIFY = 520, START = 650;
  const beat = () => 150 + Math.random() * 90;
  let uid = 0;

  FlatPlayer.register({
    slug: "one-time-code",
    title: "One-Time Code",
    tagline: "The sign-in code field, done right.",
    css: `
${S} .otc { width: min(100%, 440px); display: grid; justify-items: center; text-align: center; gap: 6px }
${S} .otc-title { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2 }
${S} .otc-sub { margin: 0; color: var(--muted); font-size: 15px }
${S} .otc-field { position: relative; width: 100%; margin-top: 20px; border-radius: 18px }
${S} .otc-field:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 4px }
${S} .otc-cells { display: grid; grid-template-columns: repeat(${LENGTH}, minmax(0, 1fr)); gap: clamp(6px, 2cqw, 10px) }
${S} .otc-cell { position: relative; aspect-ratio: 5 / 6; border-radius: 16px; background: var(--paper); color: var(--ink); display: grid; place-items: center;
  font-size: clamp(24px, 9cqw, 40px); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1;
  transition: background-color var(--dur-responsive), color var(--dur-responsive), box-shadow var(--dur-instant) }
${S} .otc-cell.is-caret, ${S} .otc-cell.is-selected { box-shadow: inset 0 0 0 2px var(--ink) }
${S} .otc-cell.is-selected { background: var(--bubble) }
${S} .otc-bar { position: absolute; left: 50%; bottom: 22%; width: 30%; height: 3px; translate: -50% 0; border-radius: 2px; background: var(--ink);
  animation: otc-blink 1s steps(1) infinite }
@keyframes otc-blink { 50% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { ${S} .otc-bar { animation: none } }
${S} .otc-cells[data-s="pending"] .otc-cell { color: var(--disabled) }
${S} .otc-cells[data-s="error"] .otc-cell { color: var(--cherry-text) }
${S} .otc-cells[data-s="success"] .otc-cell { background: var(--ink); color: var(--on-ink); box-shadow: none }
${S} .otc-input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; cursor: text;
  background: transparent; color: transparent; caret-color: transparent; font-size: 16px; outline: none; -webkit-text-fill-color: transparent }
${S} .otc-input::selection { background: transparent; color: transparent }
${S} .otc-status { margin: 14px 0 0; min-height: 22px; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--muted) }
${S} .otc-status[data-s="error"] { color: var(--cherry-text) }
${S} .otc-status[data-s="success"] { color: var(--ink); font-weight: 500 }
${S} .otc-status svg { width: 18px; height: 18px; flex: none }
${S} .otc-resend { margin-top: 6px; height: 40px; padding: 0 18px; border: 0; border-radius: var(--r-pill); background: var(--paper); color: var(--ink);
  font-size: 14px; font-weight: 500; cursor: pointer; transition: transform var(--dur-instant), background-color var(--dur-instant) }
${S} .otc-resend:hover { background: color-mix(in oklab, var(--paper), var(--ink) 4%) }
${S} .otc-resend:active { transform: scale(0.96) }
@container (max-width: 380px) {
  ${S} .otc-title { font-size: 18px }
  ${S} .otc-sub { font-size: 13px }
  ${S} .otc-field { margin-top: 14px }
  ${S} .otc-cell { border-radius: 12px }
  ${S} .otc-status { margin-top: 10px; font-size: 13px }
}
${S}.is-tile .otc-resend { display: none }
`,
    mount(host, ctx) {
      const id = "otc" + ++uid;
      host.innerHTML = `
<div class="otc" role="group" aria-labelledby="${id}-t">
  <h3 class="otc-title" id="${id}-t">Check your email</h3>
  <p class="otc-sub">Enter the code we sent you.</p>
  <div class="otc-field">
    <div class="otc-cells" aria-hidden="true"></div>
    <input class="otc-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="${LENGTH}"
      spellcheck="false" autocorrect="off" autocapitalize="off" aria-label="Sign-in code" aria-describedby="${id}-s">
  </div>
  <p class="otc-status" id="${id}-s"></p>
  <button class="otc-resend" type="button">Send a new code</button>
  <p class="sr-only" role="status"></p>
  <p class="sr-only" role="alert"></p>
</div>`;
      const $ = (s) => host.querySelector(s);
      const root = $(".otc"), cellsEl = $(".otc-cells"), input = $(".otc-input"), statusEl = $(".otc-status"), resend = $(".otc-resend");
      const statusLive = $('[role="status"]'), alertLive = $('[role="alert"]');
      const on = (el, type, fn) => el.addEventListener(type, fn, { signal: ctx.signal });
      if (ctx.tile) input.tabIndex = -1;
      const cells = Array.from({ length: LENGTH }, () => { const c = document.createElement("div"); c.className = "otc-cell"; cellsEl.appendChild(c); return c; });

      let code = "", sel = { start: 0, end: 0 }, status = "idle", engaged = false;
      let round = 0, ghost = true, edits = 0;
      const ghostTimers = [];
      const later = (ms, fn) => { const t = ctx.after(ms, fn); ghostTimers.push(t); return t; };
      const sentNow = () => ROUNDS[round % ROUNDS.length].sent;
      const CHECK = '<svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="9" style="fill:var(--ink)"/><path d="m5.2 9.2 2.5 2.4 5-5.2" style="fill:none;stroke:var(--paper)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      function render() {
        const start = Math.min(sel.start, code.length), end = Math.min(sel.end, code.length);
        const locked = status === "pending";
        const cursor = !locked && start === end && start < LENGTH && (engaged || (code.length > 0 && code.length < LENGTH)) ? start : -1;
        cellsEl.dataset.s = status;
        cells.forEach((c, i) => {
          const ch = code[i] || "";
          c.textContent = ch;
          c.classList.toggle("is-selected", engaged && start !== end && i >= start && i < end);
          c.classList.toggle("is-caret", i === cursor && ch !== "");
          if (i === cursor && ch === "") { const bar = document.createElement("span"); bar.className = "otc-bar"; c.appendChild(bar); }
          c.style.transitionDelay = status === "success" ? i * 55 + "ms" : "";
        });
        if (input.value !== code) input.value = code;
        input.readOnly = locked;
        input.setAttribute("aria-invalid", String(status === "error"));
        input.setAttribute("aria-busy", String(locked));
        statusEl.dataset.s = status;
        statusEl.innerHTML = status === "success" ? CHECK + "<span>You're signed in</span>"
          : status === "error" ? "That code didn't work" : status === "pending" ? "Checking…" : "It's in your inbox for 10 minutes";
        statusLive.textContent = status === "success" ? "You're signed in" : status === "pending" ? "Checking" : "";
        alertLive.textContent = status === "error" ? "That code didn't work" : "";
        if (document.activeElement === input && (input.selectionStart !== start || input.selectionEnd !== end)) input.setSelectionRange(start, end);
      }

      function setStatus(s) {
        const was = status;
        status = s;
        render();
        if (ctx.reduced() || s === was) return;
        if (s === "error") cellsEl.animate(SHAKE, { duration: 380, easing: "cubic-bezier(0.36, 0.07, 0.19, 0.97)" });
        if (s === "success") cells.forEach((c, i) => c.animate([{ transform: "scale(0.86)" }, { transform: "none" }], { duration: 420, delay: i * 55, easing: EXPRESSIVE, fill: "backwards" }));
      }
      function commit(next, caret) {
        sel = { start: caret, end: caret };
        if (next !== code) {
          const grew = next.length > code.length;
          code = next;
          edits++;
          if (status === "error" || status === "success") status = "idle";
          if (grew && !ctx.reduced()) { const c = cells[Math.min(caret, LENGTH) - 1]; c && c.animate([{ transform: "scale(0.9)" }, { transform: "none" }], { duration: 300, easing: EXPRESSIVE }); }
          if (next.length === LENGTH) { verify(next); return; }
        }
        render();
      }
      function insert(text, from, to) {
        const digits = String(text).replace(/\D/g, "");
        if (!digits || status === "pending") return false;
        if (digits.length >= LENGTH) { commit(digits.slice(0, LENGTH), LENGTH); return true; }
        let a = Math.min(from, code.length), b = Math.min(to, code.length);
        if (a === b && code.length >= LENGTH) { if (a >= LENGTH) return false; b = Math.min(LENGTH, a + digits.length); }
        const next = (code.slice(0, a) + digits + code.slice(b)).slice(0, LENGTH);
        commit(next, Math.min(next.length, a + digits.length));
        return true;
      }
      function erase(from, to) {
        if (status === "pending") return false;
        if (from === to) { if (from === 0) return false; from -= 1; }
        commit(code.slice(0, from) + code.slice(to), from);
        return true;
      }
      const ghostPress = (k) => k === "back" ? erase(Math.min(sel.start, code.length), Math.min(sel.end, code.length))
        : k === "clear" ? (status !== "pending" && commit("", 0)) : insert(k, Math.min(sel.start, code.length), Math.min(sel.end, code.length));

      function type(keys, at) { let t = at; for (const k of keys) { later(t, () => ghostPress(k)); t += beat(); } return t; }
      function playRound(r, at) { if (!ghost) return; const { sent, slip } = ROUNDS[r % ROUNDS.length]; type([...(slip || sent)], at); }
      function verify(c) {
        setStatus("pending");
        const r = round, sent = sentNow();
        ctx.after(VERIFY, () => {
          if (code !== c) return;
          const ok = c === sent;
          setStatus(ok ? "success" : "error");
          if (!ghost) {
            const at = edits;
            if (ok) ctx.after(2200, () => { if (edits !== at) return; code = ""; sel = { start: 0, end: 0 }; status = "idle"; round = r + 1; render(); });
            return;
          }
          if (ok) {
            later(1500, () => ghostPress("clear"));
            later(1500 + 380, () => { round = r + 1; render(); playRound(r + 1, 360); });
          } else {
            const t = type(["back", "back"], 900);
            type([...sent.slice(4)], t + 140);
          }
        });
      }
      function takeOver() {
        if (!ghost) return;
        ghost = false;
        ghostTimers.forEach(clearTimeout);
        code = ""; sel = { start: 0, end: 0 }; status = "idle";
        render();
      }
      ctx.onHand(takeOver);
      on(root, "focusin", () => { takeOver(); engaged = true; render(); });
      on(root, "focusout", (e) => { if (!root.contains(e.relatedTarget)) { engaged = false; render(); } });

      on(input, "beforeinput", (e) => {
        if (e.inputType !== "insertText" || e.data == null || !e.cancelable) return;
        e.preventDefault();
        insert(e.data, input.selectionStart ?? code.length, input.selectionEnd ?? code.length);
      });
      on(input, "input", () => {
        const raw = input.value;
        const next = raw.replace(/\D/g, "").slice(0, LENGTH);
        commit(next, Math.min(next.length, raw.slice(0, input.selectionStart ?? raw.length).replace(/\D/g, "").length));
      });
      on(input, "paste", (e) => { e.preventDefault(); insert(e.clipboardData.getData("text"), input.selectionStart ?? code.length, input.selectionEnd ?? code.length); });
      const selectionChanged = () => {
        if (document.activeElement !== input) return;
        const a = input.selectionStart ?? 0, b = input.selectionEnd ?? 0;
        if (sel.start !== a || sel.end !== b) { sel = { start: a, end: b }; render(); }
      };
      on(input, "select", selectionChanged);
      on(document, "selectionchange", selectionChanged);
      // A click lands on the square under it: a filled one is selected, to be typed over.
      on(input, "click", (e) => {
        if (e.detail > 1 || input.selectionStart !== input.selectionEnd) return;
        const i = cells.findIndex((c) => e.clientX < c.getBoundingClientRect().right);
        const at = Math.min(i === -1 ? LENGTH : i, code.length);
        input.setSelectionRange(at, at < code.length ? at + 1 : at);
        selectionChanged();
      });
      on(resend, "click", () => {
        round++; code = ""; sel = { start: 0, end: 0 }; status = "idle"; render();
        statusLive.textContent = "We sent a new code";
        input.focus();
      });

      /* Web OTP, where the browser can read the code from a text message. Only open, never in a tile. */
      if (!ctx.tile && "OTPCredential" in window && navigator.credentials) {
        try {
          navigator.credentials.get({ otp: { transport: ["sms"] }, signal: ctx.signal })
            .then((cred) => { if (cred && cred.code && !ctx.signal.aborted) insert(cred.code, 0, LENGTH); }).catch(() => {});
        } catch (e) {}
      }

      render();
      if (ctx.reduced()) ghost = false;
      else playRound(0, START);
      return { destroy() { ghostTimers.forEach(clearTimeout); } };
    },
  });
})();

</script>
<script>
/* segmented-control.js */
/* Segmented Control, redesigned in Flat: a newsletter's plan picker. The choice sits on the grey ground, where what
   is chosen is white: a white pill glides under the words on two springs (left 520/40, width 420/34, so it stretches
   a little as it travels and keeps its speed if you change your mind mid-flight). Under it one white paper holds the
   price as the one large figure, which counts to the new amount, and the one ink action. */
FlatPlayer.register({
  slug: "segmented-control",
  title: "Segmented Control",
  tagline: "One gliding indicator, full keyboard support.",
  css: `
.fs-segmented-control .sc { display: grid; justify-items: center; gap: 16px; width: min(100%, 380px) }
.fs-segmented-control .sc-group { position: relative; display: inline-flex; align-items: center; padding: 4px; border-radius: var(--r-pill); max-width: 100% }
.fs-segmented-control .sc-opt { position: relative; height: 38px; padding: 0 clamp(12px, 4cqw, 18px); border: 0; border-radius: var(--r-pill);
  background: transparent; color: var(--muted); font: 500 15px/1 var(--font); cursor: pointer; white-space: nowrap;

      else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (i - 1 + n) % n;
      else if (e.key === "Home") next = 0;
      else if (e.key === "End") next = n - 1;

    return { destroy() { ro.disconnect(); sLeft.stop(); sWidth.stop(); sPrice.stop(); } };
  },
});

  mount(host, ctx) {
    const items = [
      { title: "Readers", stat: "12,480", label: "62 joined this week" },
      { title: "Opened", stat: "61%", label: "of Sunday's letter" },

    host.innerHTML = `<div class="sp">${items.map((it) => `
      <div class="sp-card"><span class="sp-well" aria-hidden="true"><span class="sp-light"></span></span>

    function light(clientX, clientY) {

        const scale = r.width / el.offsetWidth || 1;

            paint(); paintTop();
          }
          return running;
        });
        paintTop(); paint();
      }
      function stop() {
        if (!running) return;
        running = false; clearInterval(schedTimer); schedTimer = 0; if (drawLoop) drawLoop.stop = true;
        paintTop(); paint();
      }

      /* Moves. */
      const pin = () => (pinned = performance.now() + PIN);
      grid.addEventListener("click", (e) => {
        const b = e.target.closest(".sq-cell"); if (!b) return;
        const row = +b.dataset.row, col = +b.dataset.col;
        pattern[row][col] = !pattern[row][col]; cursor = { row, col }; pin(); paint();
      }, sig);
      grid.addEventListener("keydown", (e) => {
        const b = e.target.closest(".sq-cell"); if (!b) return;
        let r = +b.dataset.row, c = +b.dataset.col;
        const k = e.key;
        if (k === "ArrowRight") c++; else if (k === "ArrowLeft") c--; else if (k === "ArrowDown") r++; else if (k === "ArrowUp") r--;
        else if (k === "Home") c = 0; else if (k === "End") c = STEPS - 1; else return;
        e.preventDefault();
        if (r < 0 || r >= TRACKS.length || c < 0 || c >= STEPS) return;
        cursor = { row: r, col: c }; pin();
        if (!wide && Math.floor(c / PAGE) !== page) { page = Math.floor(c / PAGE); build(); }
        else paint();
        cellAt(r, c)?.focus({ preventScroll: true });
      }, sig);
      pageBtns.forEach((b) => b.addEventListener("click", () => { pin(); const p = +b.dataset.page; if (p !== page) { page = p; build(); } }, sig));
      play.addEventListener("click", () => {
        if (running) { stop(); live.textContent = "Stopped"; } else { start(); live.textContent = "Playing, " + bpm + " BPM"; }
      }, sig);

      function setTempo(next) { bpm = Math.min(BPM.max, Math.max(BPM.min, Math.round(next))); paintTop(); }
      card.addEventListener("keydown", (e) => {
        const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 10, PageDown: -10 }[e.key];
        if (d) setTempo(bpm + d); else if (e.key === "Home") setTempo(BPM.min); else if (e.key === "End") setTempo(BPM.max); else return;
        e.preventDefault();
      }, sig);
      /* Drag the tempo: right or up is faster, a beat per 4px. */
      let drag = null;
      card.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        card.setPointerCapture(e.pointerId);
        drag = { id: e.pointerId, x: e.clientX, y: e.clientY, from: bpm };
      }, sig);
      card.addEventListener("pointermove", (e) => { if (drag && drag.id === e.pointerId) setTempo(drag.from + (e.clientX - drag.x - (e.clientY - drag.y)) / 4); }, sig);
      const end = (e) => { if (drag && drag.id === e.pointerId) drag = null; };
      card.addEventListener("pointerup", end, sig); card.addEventListener("pointercancel", end, sig);

      /* Sixteen steps once there's room for them. */
      const ro = new ResizeObserver(([entry]) => { const w = entry.contentRect.width >= WIDE; if (w !== wide) { wide = w; build(); } });
      ro.observe(root);
      wide = root.getBoundingClientRect().width >= WIDE;
      build(); paintTop();
      /* It plays from the first frame; under reduced motion it waits for Play. */
      if (!ctx.reduced()) start();
      return { destroy() { ro.disconnect(); running = false; } };
    },
  });
})();

</script>
<script>
/* switch.js */
/* Switch, after litterthanlit/components, redesigned in Flat: a newsletter's settings list on one paper. Each row says
   what it does in words; the switch is a pill (outlined when off, the ink when on) with a white circle that you can tap,
   drag or flick. The feel is the original's over-centre integrator: under a finger the circle lags toward the middle,
   snaps through and lands while you are still holding it; let go short and it falls back unless you flicked it. */
(function () {
  const S = ".fs-switch";
  /* The pill, in px. */
  const TRACK_W = 52, TRACK_H = 32, INSET = 4, CAP = 24;
  const TRAVEL = TRACK_W - 2 * INSET - CAP;

  /* The mechanism, in travel (0 is off, 1 is on) and seconds: the original's numbers. */
  const BREAKOUT = 0.03, SNAP_AT = 0.72, BEND = SNAP_AT - 0.5 - BREAKOUT, RUBBER = 0.1;
  const FOLLOW = { k: 2200, c: 84 }, SPRING = { preload: 40, peak: 260 }, STOP = { k: 16000, c: 180 }, AIR = 6;
  const FLICK = 0.15, FLICK_MIN = 0.8, FLICK_SPEED = 12, STEP = 1 / 480, TAP = { px: 5, ms: 500 };

  function capFor(q) {
    if (q < 0) return -RUBBER * (1 - Math.exp(q / (2.5 * RUBBER)));
    return Math.max(0, q - BREAKOUT - BEND * (q / SNAP_AT) ** 2);
  }
  function fingerFor(r) {
    if (r < 0) return 2.5 * RUBBER * Math.log(1 + Math.max(-0.99 * RUBBER, r) / RUBBER);
    if (r < 1e-3) return 0;
    const a = BEND / SNAP_AT ** 2;
    return (1 - Math.sqrt(Math.max(0, 1 - 4 * a * (BREAKOUT + r)))) / (2 * a);
  }

  const SETTINGS = [
    { key: "welcome", label: "Welcome letter", on: "Sent to every new reader", off: "New readers get nothing yet" },
    { key: "replies", label: "Reply emails", on: "You hear when a reader replies", off: "Replies wait in your inbox" },
    { key: "count", label: "Reader count", on: "Shown on your site", off: "Kept to yourself" },
  ];
  /* The self-run: each switch flicked on in turn and the last back off, as the original's power-up test; then, while
     no hand has come, one row changes its mind every so often, so the wall stays alive. */
  const FIRST = [[300, "welcome", true], [560, "replies", true], [820, "count", true], [1700, "count", false]];
  const IDLE = [["replies", false], ["count", true], ["replies", true], ["count", false]];

  function makeSwitch(btn, ctx, onChange) {
    let x = 0, v = 0, side = 0, user = false, time = 0, raf = 0, last = 0, hand = null, ghost = null;
    const rel = (p) => (side ? 1 - p : p);
    const abs = (r) => (side ? 1 - r : r);
    const draw = () => btn.style.setProperty("--x", x.toFixed(4));
    const light = () => { btn.toggleAttribute("data-on", !!side); btn.setAttribute("aria-checked", side ? "true" : "false"); };

    function target() {
      if (ghost) return abs(capFor(ghost.q0 + ghost.speed * (time - ghost.t0)));
      if (!hand || hand.flying) return null;
      return abs(capFor(rel(hand.anchorP + (hand.lastX - hand.anchorX) / hand.travelPx)));
    }
    function snap() {
      side = side ? 0 : 1;
      light();
      if (user && navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
      ghost = null;
      onChange(side === 1, user);
      if (hand) { hand.flying = time; hand.anchorX = hand.lastX; hand.anchorP = side; }
    }
    function step(h) {
      time += h;
      const to = target();
      let f;
      if (to !== null) f = FOLLOW.k * (to - x) - FOLLOW.c * v;
      else {
        f = (side ? 1 : -1) * (SPRING.preload + SPRING.peak * Math.max(0, 1 - Math.abs(2 * x - 1))) - AIR * v;
        if (x > 1) f -= STOP.k * (x - 1) + STOP.c * v;
        else if (x < 0) f -= STOP.k * x + STOP.c * v;
      }
      v += f * h; x += v * h;
      if (rel(x) >= 0.5) snap();
      if (hand && hand.flying && ((rel(x) < 0.02 && Math.abs(v) < 0.6) || time - hand.flying > 0.25)) hand.flying = 0;
    }
    function frame(now) {
      raf = 0;
      if (ctx.signal.aborted) return;
      let dt = Math.min(0.05, last ? (now - last) / 1000 : STEP);
      last = now;
      while (dt > 1e-9) { const h = Math.min(STEP, dt); step(h); dt -= h; }
      const rest = side + (side ? 1 : -1) * (SPRING.preload / STOP.k);
      if (!hand && !ghost && Math.abs(v) < 0.005 && Math.abs(x - rest) < 0.002) { x = side; v = 0; draw(); last = 0; return; }
      draw();
      raf = requestAnimationFrame(frame);
    }
    const run = () => { if (!raf && !ctx.signal.aborted) raf = requestAnimationFrame(frame); };

    const api = {
      get on() { return ghost ? side === 0 : side === 1; },
      flip(byUser) {
        user = byUser;
        if (ghost) ghost = null;
        else if (ctx.reduced()) return api.place(side === 0, byUser);
        else ghost = { t0: time, q0: fingerFor(Math.max(0, rel(x))), speed: FLICK_SPEED };
        run();
      },
      place(on, byUser) { if ((side === 1) === on) return; user = byUser; ghost = null; x = on ? 1 : 0; v = 0; snap(); draw(); },
      set(on) { if (api.on !== on) ctx.reduced() ? api.place(on, false) : api.flip(false); },
      stop() { if (raf) cancelAnimationFrame(raf); raf = 0; },
    };

    const sig = { signal: ctx.signal };
    btn.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      btn.focus({ preventScroll: true });
      btn.setPointerCapture(e.pointerId);
      const track = btn.querySelector(".sw-pill").getBoundingClientRect();
      user = true; ghost = null;
      const p = side ? 1 - fingerFor(rel(x)) : fingerFor(rel(x));
      hand = { anchorX: e.clientX, anchorP: p, lastX: e.clientX, startX: e.clientX, startT: e.timeStamp, travelPx: (track.width * TRAVEL) / TRACK_W,
        samples: [[e.timeStamp, e.clientX]], moved: false, flying: 0 };
      run();
    }, sig);
    btn.addEventListener("pointermove", (e) => {
      if (!hand) return;
      const t = e.timeStamp;
      hand.lastX = e.clientX; hand.samples.push([t, e.clientX]);
      while (hand.samples.length > 2 && t - hand.samples[0][0] > 100) hand.samples.shift();
      if (Math.abs(e.clientX - hand.startX) > TAP.px) hand.moved = true;
      run();
    }, sig);
    const release = (e, cancelled) => {
      const h = hand;
      if (!h) return;
      hand = null;
      const t = e.timeStamp;
      if (cancelled || h.flying) return run();
      if (!h.moved && t - h.startT < TAP.ms) return api.flip(true);
      const [t0, x0] = h.samples[0];
      const speed = t > t0 + 8 ? ((h.lastX - x0) / h.travelPx / (t - t0)) * 1000 : 0;
      const toward = side ? -speed : speed;
      if (toward > FLICK_MIN && rel(x) + toward * FLICK >= 0.5) ghost = { t0: time, q0: fingerFor(Math.max(0, rel(x))), speed: Math.max(FLICK_SPEED, toward) };
      run();
    };
    btn.addEventListener("pointerup", (e) => release(e, false), sig);
    btn.addEventListener("pointercancel", (e) => release(e, true), sig);
    /* Keys and assistive tech arrive as clicks with no pointer behind them. */
    btn.addEventListener("click", (e) => { if (e.detail === 0) api.flip(true); }, sig);
    light(); draw();
    return api;
  }

  let uid = 0;
  FlatPlayer.register({
    slug: "switch",
    title: "Switch",
    tagline: "A toggle you can flick, with a real over-centre spring.",
    css: `
${S} .sw { width: min(100%, 360px); background: var(--paper); border-radius: var(--r-paper); padding: 18px 8px 8px; user-select: none; -webkit-user-select: none }
${S} .sw-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 12px 10px }
${S} .sw-head h3 { margin: 0; font: 600 18px/1.2 var(--font); letter-spacing: -0.015em }
${S} .sw-head span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap }
${S} .sw-list { list-style: none; margin: 0; padding: 0; display: grid }
${S} .sw-row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 16px; width: 100%;
  padding: 12px; border-radius: 12px; cursor: pointer; touch-action: pan-y; -webkit-tap-highlight-color: transparent; transition: background-color 150ms }
${S} .sw-row:hover { background: color-mix(in oklab, var(--paper), var(--ink) 3%) }
${S} .sw-row:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px }
${S} .sw-label { font-size: 15px; font-weight: 500; line-height: 1.25 }
${S} .sw-note { grid-column: 1; font-size: 13px; line-height: 1.3; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
${S} .sw-pill { grid-column: 2; grid-row: 1 / span 2; position: relative; width: ${TRACK_W}px; height: ${TRACK_H}px; border-radius: var(--r-pill);
  box-shadow: inset 0 0 0 1.5px var(--outline); overflow: hidden }
${S} .sw-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--r-pill); background: var(--ink);
  width: calc(${TRACK_W - TRAVEL}px + var(--x) * ${TRAVEL}px); opacity: clamp(0, calc(var(--x) * 6), 1) }
${S} .sw-row[data-on] .sw-fill { opacity: 1 }
${S} .sw-cap { position: absolute; left: ${INSET}px; top: ${INSET}px; width: ${CAP}px; height: ${CAP}px; border-radius: 50%; background: var(--outline);
  translate: calc(var(--x) * ${TRAVEL}px) 0; transition: background-color 120ms }
${S} .sw-row[data-on] .sw-cap { background: var(--on-ink) }
@container (min-width: 560px) {
  ${S} .sw { width: 440px; padding: 24px 12px 12px }
  ${S} .sw-head { padding: 0 16px 14px } ${S} .sw-head h3 { font-size: 22px }
  ${S} .sw-row { padding: 14px 16px } ${S} .sw-label { font-size: 16px } ${S} .sw-note { font-size: 14px }
}
`,
    mount(host, ctx) {
      const id = "fs-sw-" + ++uid;
      host.innerHTML = `
<div class="sw">
  <div class="sw-head"><h3 id="${id}">Newsletter</h3><span aria-hidden="true"></span></div>
  <ul class="sw-list" role="group" aria-labelledby="${id}">
    ${SETTINGS.map((s) => `<li><button type="button" class="sw-row" role="switch" aria-checked="false" data-k="${s.key}" aria-describedby="${id}-${s.key}">
      <span class="sw-label">${s.label}</span><span class="sw-note" id="${id}-${s.key}">${s.off}</span>
      <span class="sw-pill" aria-hidden="true"><span class="sw-fill"></span><span class="sw-cap"></span></span></button></li>`).join("")}
  </ul>
</div>`;
      const count = host.querySelector(".sw-head span");
      const sw = {};
      const tally = () => { const n = SETTINGS.filter((s) => sw[s.key] && sw[s.key].on).length; count.textContent = n + " of " + SETTINGS.length + " on"; };
      for (const s of SETTINGS) {
        const btn = host.querySelector(`.sw-row[data-k="${s.key}"]`), note = btn.querySelector(".sw-note");
        sw[s.key] = makeSwitch(btn, ctx, (on) => { note.textContent = on ? s.on : s.off; tally(); });
      }
      tally();

      const timers = [];
      if (ctx.reduced()) { sw.welcome.place(true, false); sw.replies.place(true, false); }
      else {
        for (const [at, key, on] of FIRST) timers.push(ctx.after(at, () => sw[key].set(on)));
        let k = 0;
        timers.push(ctx.after(3200, () => timers.push(ctx.every(1900, () => { const [key, on] = IDLE[k++ % IDLE.length]; sw[key].set(on); }))));
      }
      ctx.onHand(() => { timers.forEach((t) => { clearTimeout(t); clearInterval(t); }); });
      return { destroy() { Object.values(sw).forEach((s) => s.stop()); } };
    },
  });
})();

</script>
<script>
/* tape-reels.js */
/* Tape Reels, redesigned for Flat: the progress bar underneath the reels. An archive export on paper: a large percentage,
   a fat pill that fills along the sunset ramp, how many posts are in, and Pause or Resume. Progress arrives in uneven
   steps, as an export reports it, and eases in on the original's critically damped spring (stiffness 140, damping 24),
   so a jump glides instead of snapping. Done, the pill turns into Download. */
(function () {
  const POSTS = 48, SIZE = 12.4;
  const SPRING = { duration: (2 * Math.PI) / Math.sqrt(140), bounce: 0 };
  const STATE = { export: "Exporting", pause: "Paused", done: "Ready", saved: "Downloaded" };

  FlatPlayer.register({
    slug: "tape-reels",
    title: "Tape Reels",
    tagline: "A progress bar that eases in.",
    css: `
.fs-tape-reels .tx { width: min(23em, 100%); font-size: clamp(13px, calc(2.2cqw + 6px), 16px); background: var(--paper); border-radius: var(--r-paper);
  padding: 1.25em; display: grid; gap: 1em; -webkit-user-select: none; user-select: none }
.fs-tape-reels .tx-top { display: flex; align-items: baseline; justify-content: space-between; gap: 1em; min-width: 0 }
.fs-tape-reels .tx-name { display: grid; gap: 0.15em; min-width: 0 }
.fs-tape-reels .tx-name b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.fs-tape-reels .tx-name span { font-size: 0.87em; color: var(--muted) }
.fs-tape-reels .tx-pct { font-size: 2.6em; font-weight: 600; letter-spacing: -0.04em; line-height: 0.9; font-variant-numeric: tabular-nums; white-space: nowrap }
.fs-tape-reels .tx-pct small { font-size: 0.42em; font-weight: 500; letter-spacing: 0; margin-left: 0.1em; color: var(--muted) }
.fs-tape-reels .tx-bar { position: relative; height: 1.25em; border-radius: var(--r-pill); background: var(--bubble); overflow: hidden }
.fs-tape-reels .tx-fill { position: absolute; inset: 0; border-radius: var(--r-pill);
  background: var(--ink);
  clip-path: inset(0 calc(100% - var(--p, 0) * 100%) 0 0 round var(--r-pill)) }
.fs-tape-reels .tx-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.75em; min-width: 0 }
.fs-tape-reels .tx-meta { font-size: 0.93em; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.fs-tape-reels .tx-btn { flex: none; height: 2.6em; padding: 0 1.25em; border: 0; border-radius: var(--r-pill); background: var(--bubble); color: var(--ink);
  font-weight: 500; cursor: pointer; transition: transform 100ms, background-color var(--dur-instant), color var(--dur-instant) }
.fs-tape-reels .tx-btn:active { transform: scale(0.97) }
.fs-tape-reels .tx-btn.is-primary { background: var(--ink); color: var(--on-ink) }
`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="tx">
  <div class="tx-top">
    <div class="tx-name"><b>archive-2026.zip</b><span class="tx-state"></span></div>
    <div class="tx-pct" aria-hidden="true"></div>
  </div>
  <div class="tx-bar" role="progressbar" aria-label="Archive export" aria-valuemin="0" aria-valuemax="100"><span class="tx-fill"></span></div>
  <div class="tx-foot"><span class="tx-meta" aria-hidden="true"></span><button class="tx-btn" type="button"></button></div>
  <p class="sr-only" role="status" aria-live="polite"></p>
</div>`;
      const sig = { signal: ctx.signal };
      const bar = host.querySelector(".tx-bar"), stateEl = host.querySelector(".tx-state"), pctEl = host.querySelector(".tx-pct");
      const meta = host.querySelector(".tx-meta"), btn = host.querySelector(".tx-btn"), live = host.querySelector("[role=status]");
      let progress = 0, phase = "pause", handed = false;

      const spring = ctx.spring(0, (pm) => {
        const p = Math.min(1, Math.max(0, pm / 1000));
        bar.style.setProperty("--p", p.toFixed(4));
        pctEl.innerHTML = Math.round(p * 100) + "<small>%</small>";
      }, SPRING);

      function render() {
        const pct = Math.round(progress * 100), posts = Math.round(progress * POSTS);
        bar.setAttribute("aria-valuenow", String(pct));
        stateEl.textContent = STATE[phase];
        meta.textContent = phase === "done" || phase === "saved" ? SIZE + " MB, " + POSTS + " posts" : posts + " of " + POSTS + " posts";
        btn.textContent = phase === "export" ? "Pause" : phase === "pause" ? "Resume" : phase === "done" ? "Download" : "Export again";
        btn.classList.toggle("is-primary", phase === "done");
      }
      function moveTo(p) { progress = Math.min(1, Math.max(0, p)); ctx.reduced() ? spring.jump(progress * 1000) : spring.set(progress * 1000); render(); }

      let writer = 0, cycle = 0;
      const stop = () => { if (writer) clearInterval(writer); writer = 0; if (cycle) clearTimeout(cycle); cycle = 0; };
      function exportIt() {
        stop(); phase = "export"; render();
        writer = ctx.every(110, () => {
          const next = Math.min(1, progress + 0.018 + Math.random() * 0.024);
          moveTo(next);
          if (next < 1) return;
          clearInterval(writer); writer = 0;
          phase = "done"; render(); live.textContent = "Export ready, " + SIZE + " MB";
          /* Until a hand arrives: hold, then start a fresh export. */
          if (!handed) cycle = ctx.after(1600, () => { if (handed) return; spring.jump(0); progress = 0; exportIt(); });
        });
      }
      btn.addEventListener("click", () => {
        if (phase === "export") { stop(); phase = "pause"; render(); live.textContent = "Paused"; }
        else if (phase === "pause") { exportIt(); live.textContent = "Exporting"; }
        else if (phase === "done") { phase = "saved"; render(); live.textContent = "Downloaded archive-2026.zip"; }
        else { spring.jump(0); progress = 0; exportIt(); live.textContent = "Exporting"; }
      }, sig);

      ctx.onHand(() => { handed = true; if (cycle) { clearTimeout(cycle); cycle = 0; } });
      render(); spring.jump(0);
      if (ctx.reduced()) { moveTo(0.64); phase = "pause"; render(); }
      else ctx.after(300, () => { if (!handed) exportIt(); });
      return { destroy() { stop(); spring.stop(); } };
    },
  });
})();

</script>
<script>
/* ticker.js */
/* Ticker, after litterthanlit/components (ticker.tsx), redesigned in Flat.
 * Notifications as one line: a white pill on the ground that types each message as it arrives, with the count
 * and two small grey circles to step through the queue. A message that fits types on and stays a moment; a longer
 * one holds, slides along at a steady speed, holds at its end and glides back. Warnings and alerts lead with a
 * small coloured word; everything else is just the message. A hand on the line pauses it; the arrows (and Home,
 * End) step through the queue. Opened, Notify and Clear sit under it. Under reduced motion nothing slides: a long
 * message pages through a pillful of whole words at a time. Each message is said once. */
(function () {
  const TYPE_RATE = 42; // characters a second while typing on
  const DWELL = 2000; // ms a message that fits stays, plus a little per character
  const HOLD = 1000; // ms a long message holds at its start and its end
  const PAGE = 2400; // ms per pillful under reduced motion
  const SPEED = 64; // px a second
  const LIMIT = 9;
  const GAP = 2600; // ms between arrivals while untouched
  let uid = 0;

  const TONES = {
    info: { word: "", said: "" },
    warn: { word: "Heads up", said: "Heads up: " },
    alert: { word: "Alert", said: "Alert: " },
  };
  const ARRIVALS = [
    { text: "Draft saved", tone: "info" },
    { text: "Zoë left 2 comments", tone: "info" },
    { text: "Storage is 88% full", tone: "warn" },
    { text: "Your site is over its plan. Upgrade to keep publishing new posts", tone: "alert" },
  ];
  const SAMPLES = [
    { text: "Issue 05 is scheduled", tone: "info" },
    { text: "12 new readers this week", tone: "info" },

  const ARROW = (d) => `<svg viewBox="0 0 14 14" aria-hidden="true"><path d="${d}"/></svg>`;

  function mount(host, ctx) {
    const { signal } = ctx;
    const id = "fs-tk-" + ++uid;
    host.innerHTML = `
      <div class="tk">
        <div class="tk-line" role="group" tabindex="0" aria-label="Notifications" aria-describedby="${id}-now ${id}-hint">
          <span class="tk-word" aria-hidden="true" hidden></span>
          <div class="tk-view" aria-hidden="true"><span class="tk-text"></span><span class="tk-caret" hidden></span>
            <span class="tk-empty">You're all caught up</span></div>
          <span class="tk-count" aria-hidden="true" hidden></span>
          <button type="button" class="tk-step" tabindex="-1" aria-label="Previous notification">${ARROW("M8.5 3.5 5 7l3.5 3.5")}</button>
          <button type="button" class="tk-step" tabindex="-1" aria-label="Next notification">${ARROW("M5.5 3.5 9 7l-3.5 3.5")}</button>
        </div>
        <div class="tk-keys">
          <button type="button" class="tk-notify">Notify me</button>
          <button type="button" class="tk-clear">Clear all</button>
        </div>
        <p class="sr-only" id="${id}-now"></p>
        <p class="sr-only" id="${id}-hint">Hover or focus to pause. Left and right arrows step through the notifications.</p>
        <div class="sr-only" role="status" aria-live="polite"></div>

    const $ = (s) => host.querySelector(s);
    const line = $(".tk-line"), view = $(".tk-view"), textEl = $(".tk-text"), caret = $(".tk-caret"), empty = $(".tk-empty");
    const wordEl = $(".tk-word"), countEl = $(".tk-count"), nowEl = $(`#${id}-now`), statusEl = $("[role=status]");

      update();

      if (!q.messages.length) return;
      q.index = Math.min(q.messages.length - 1, Math.max(0, i));
      q.waiting = false;
      update();
    }
    function clear() { q.messages = []; q.index = -1; q.waiting = false; update(); }
    const current = () => q.messages[q.index] || null;

    let shownId;
    function update() {
      const cur = current();
      const word = cur ? TONES[cur.tone].word : "";
      wordEl.hidden = !word;
      wordEl.textContent = word;
      wordEl.dataset.tone = cur ? cur.tone : "";
      countEl.hidden = !q.messages.length;
      countEl.textContent = q.messages.length ? `${q.index + 1} of ${q.messages.length}` : "";
      prevBtn.setAttribute("aria-disabled", String(q.index <= 0));
      nextBtn.setAttribute("aria-disabled", String(q.index >= q.messages.length - 1));
      nowEl.textContent = cur ? `Notification ${q.index + 1} of ${q.messages.length}: ${TONES[cur.tone].said}${cur.text}` : "No notifications";
      if (cur && !heard.includes(cur.id)) {
        heard.push(cur.id);
        statusEl.textContent = TONES[cur.tone].said + cur.text;
      }
      const sid = cur ? cur.id : undefined;
      if (sid !== shownId) { shownId = sid; show(cur); }

    let message = null, phase = "idle", offset = 0, typed = Infinity, edges = [], pages = [], page = 0;
    let textW = 0, viewW = 0, loop = null;
    const holds = new Set();
    let timer = 0, timerFn = null, timerLeft = 0, timerAt = 0;
    const arm = () => {
      timerAt = performance.now();
      timer = setTimeout(() => { const fn = timerFn; timerFn = null; if (!signal.aborted && fn) fn(); }, timerLeft);
    };
    const wait = (ms, fn) => { clearTimeout(timer); timerFn = fn; timerLeft = ms; if (!holds.size) arm(); };
    const fits = () => textW <= viewW;
    const back = ctx.spring(0, (x) => { offset = x; paint(); }, { duration: 0.5, bounce: 0 });

      textEl.style.transform = `translateX(${-offset}px)`;

      view.classList.toggle("is-moved", !fits() && phase !== "page" && offset > 0.5);
      let right = textW;
      if (phase === "type") right = typed > 0 ? edges[Math.min(edges.length, Math.floor(typed)) - 1] || 0 : 0;

        while (b - start > viewW) { list.push([start, start + viewW]); start += viewW; }

      // Nothing after it: a long message glides back to its start and rests there.
      if (long && message && message.id === mid) wait(HOLD, () => back.set(0));

    function showPage() {
      offset = pages[page][0];
      paint();
      wait(PAGE, () => {
        if (page < pages.length - 1) { page++; showPage(); return; }
        const mid = message && message.id;
        if (message) finished(message.id);
        if (pages.length > 1 && message && message.id === mid) wait(PAGE, () => { page = 0; showPage(); });

    }

      clearTimeout(timer); timerFn = null;
      if (loop) { loop.stop = true; loop = null; }
      back.stop();
      message = m;
      textEl.textContent = m ? m.text : "";
      empty.hidden = !!m;
      offset = 0; typed = Infinity; pages = []; page = 0; phase = "idle";
      measure();
      if (!m) { paint(); return; }
      if (ctx.reduced()) { phase = "page"; pages = paginate(); showPage(); }
      else { phase = "type"; typed = 0; paint(); run(); }

      const was = holds.size > 0;
      if (on) holds.add(reason); else holds.delete(reason);
      const now = holds.size > 0;
      if (now === was) return;
      if (now) {
        if (loop) { loop.stop = true; loop = null; }
        if (timerFn) { clearTimeout(timer); timerLeft = Math.max(0, timerLeft - (performance.now() - timerAt)); }
      } else { if (timerFn) arm(); run(); }
    }

    /* A hand on the line holds it. */
    let hover = false, focus = false;
    const handHold = () => hold("hand", hover || focus);
    line.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") { hover = true; handHold(); } }, { signal });
    line.addEventListener("pointerleave", () => { hover = false; handHold(); }, { signal });
    line.addEventListener("focus", () => { focus = true; handHold(); }, { signal });
    line.addEventListener("blur", () => { focus = false; handHold(); }, { signal });
    line.addEventListener("keydown", (e) => {
      const to = { ArrowLeft: q.index - 1, ArrowRight: q.index + 1, Home: 0, End: q.messages.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      if (!q.messages.length || to < 0 || to >= q.messages.length || to === q.index) return;
      go(to);
    }, { signal });
    prevBtn.addEventListener("click", () => { if (q.index > 0) go(q.index - 1); }, { signal });
    nextBtn.addEventListener("click", () => { if (q.index < q.messages.length - 1) go(q.index + 1); }, { signal });

    const seen = new IntersectionObserver(([entry]) => hold("offscreen", !entry.isIntersecting));
    seen.observe(line);
    const resize = new ResizeObserver(() => {
      if (!message) return;
      const keep = Math.floor(typed);
      measure();
      if (phase === "slide" || phase === "end") offset = Math.min(offset, Math.max(0, textW - viewW));
      typed = phase === "type" ? keep : typed;
      paint();
    });
    resize.observe(view);

    /* --- Notify and Clear. --- */
    let sample = 0;
    $(".tk-notify").addEventListener("click", () => { const m = SAMPLES[sample++ % SAMPLES.length]; push(m.text, m.tone); }, { signal });
    $(".tk-clear").addEventListener("click", () => { if (q.messages.length) clear(); }, { signal });

    /* --- Untouched, the site reports in: four notifications a moment apart, then it starts over. --- */
    let auto = true;
    ctx.onHand(() => { auto = false; });
    if (ctx.reduced()) {
      ctx.after(300, () => ARRIVALS.forEach((m) => push(m.text, m.tone)));
    } else {
      let i = 0;
      const step = () => {
        if (!auto) return;
        if (i < ARRIVALS.length) { push(ARRIVALS[i].text, ARRIVALS[i].tone); i++; ctx.after(GAP, step); }
        else if (!q.waiting) ctx.after(400, step);
        else ctx.after(2600, () => { if (!auto) return; clear(); i = 0; ctx.after(900, step); });
      };
      ctx.after(300, step);
    }

    update();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
      if (signal.aborted || !message) return;
      const keep = typed;
      measure();
      typed = keep;
      paint();
    });

    return {
      destroy() {
        clearTimeout(timer);
        back.stop();
        pop.stop();
        seen.disconnect();
        resize.disconnect();
      },
    };
  }

  FlatPlayer.register({
    slug: "ticker",
    title: "Ticker",
    tagline: "Notifications on one line that types itself.",
    css,
    mount,
  });
})();
