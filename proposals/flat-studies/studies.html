        arm(t);
      }

      function dismiss(t) {
        if (t.leaving) return;
        disarm(t); t.leaving = true;
        const hadFocus = t.el.contains(document.activeElement);
        t.el.classList.add("is-leaving");
        t.el.style.opacity = "0";
        t.el.style.transform += " translateY(-8px) scale(0.96)";
        layout();
        if (hadFocus) { const front = toasts.filter((u) => !u.leaving).pop(); (front ? front.el.querySelector(".ts-x") : send).focus(); }
        ctx.after(reduced ? 0 : 160, () => { t.el.remove(); toasts = toasts.filter((u) => u !== t); });
      }

      function setExpanded(on) {
        if (on === expanded) return;
        expanded = on;
        toasts.forEach(on ? disarm : arm);
        layout();
      }
      section.addEventListener("pointerenter", () => setExpanded(true), { signal: S });
      section.addEventListener("pointerleave", () => setExpanded(false), { signal: S });
      section.addEventListener("focusin", () => setExpanded(true), { signal: S });
      section.addEventListener("focusout", (e) => { if (!section.contains(e.relatedTarget)) setExpanded(false); }, { signal: S });
      send.addEventListener("click", add, { signal: S });

      /* Narrow stages are short too: they fan out two toasts instead of three. */
      const ro = new ResizeObserver(([e]) => { const v = e.contentRect.width < 448 ? 2 : 3; if (v !== visible) { visible = v; layout(); } });
      ro.observe(host);
      visible = host.clientWidth < 448 ? 2 : 3;

      /* The self-run: three arrive, a ghost hand fans them out, then it keeps sending until a real hand arrives. */
      ctx.onHand(() => {
        if (ghost) { ghost = false; if (!section.matches(":hover") && !section.contains(document.activeElement)) setExpanded(false); }
        if (!timersOn) { timersOn = true; toasts.forEach(arm); }
      });
      [300, 700, 1100].forEach((ms) => (reduced ? add() : ctx.after(ms, () => ghost && add())));
      if (!reduced) {
        const press = () => { send.classList.add("is-pressed"); ctx.after(110, () => send.classList.remove("is-pressed")); add(); };
        ctx.after(1900, () => ghost && setExpanded(true));
        ctx.after(3300, () => { if (!ghost) return; setExpanded(false);
          ctx.every(2600, () => ghost && press()); });
      }
      return { destroy() { ro.disconnect(); } };
    },
  });
})();

</script>
<script>
/* vu-meter.js */
/* VU Meter, redesigned for Flat: a mic check before you record, with no needles. A large level figure, two pill bars that
   fill along the sunset ramp, a peak mark that holds and falls, and the level said in words. The bars keep the VU
   standard's ballistics (stiffness 166, damping 20.2: 99% of a steady tone in about 300 ms, about 1.5% overshoot) after a
   60 ms detector, so speech reads steadily and a click never pins them. Flat has no sound, so the signal is a synthetic
   voice until a hand arrives; then the bars read your presses, and Test tone sends a line-up tone that settles on 0 dB. */
(function () {
  const FULL = 10 ** (3 / 20), RELEASE = 0.06, FLOOR = -30, TOP = 3, HOLD = 900, FALL = 12;
  const BALLISTICS = { duration: (2 * Math.PI) / Math.sqrt(166), bounce: 1 - 20.2 / (2 * Math.sqrt(166)) };
  const db = (lin) => (lin > 0 ? 20 * Math.log10(lin) : -Infinity);
  const pos = (d) => Math.min(1, Math.max(0, (d - FLOOR) / (TOP - FLOOR)));
  const fmt = (d) => (d < -0.5 ? "−" : "") + Math.abs(Math.round(d));

  FlatPlayer.register({
    slug: "vu-meter",
    title: "VU Meter",
    tagline: "Levels with real VU ballistics.",
    css: `
.fs-vu-meter .mc { width: min(24em, 100%); font-size: clamp(13px, calc(2.2cqw + 6px), 16px); background: var(--paper); border-radius: var(--r-paper);
  padding: 1.25em; display: grid; gap: 1em; -webkit-user-select: none; user-select: none }
.fs-vu-meter.is-tile .mc { gap: 0.8em; padding: 1.1em }
.fs-vu-meter .mc-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 1em }
.fs-vu-meter .mc-fig { font-size: 2.6em; font-weight: 600; letter-spacing: -0.04em; line-height: 0.9; font-variant-numeric: tabular-nums; white-space: nowrap }
.fs-vu-meter .mc-fig small { font-size: 0.42em; font-weight: 500; letter-spacing: 0; margin-left: 0.2em; color: var(--muted) }
.fs-vu-meter .mc-word { display: grid; justify-items: end; gap: 0.1em; text-align: right }
.fs-vu-meter .mc-word span { font-size: 0.87em; color: var(--muted) }
.fs-vu-meter .mc-word b { font-weight: 500; transition: color var(--dur-instant) }
.fs-vu-meter .mc-word b[data-tone="good"] { color: var(--ink) } .fs-vu-meter .mc-word b[data-tone="loud"] { color: var(--cherry-text) }
.fs-vu-meter .mc-bars { display: grid; gap: 0.45em }
.fs-vu-meter .mc-bar { display: grid; grid-template-columns: 1.1em 1fr; align-items: center; gap: 0.5em; font-size: 0.87em; color: var(--muted) }
.fs-vu-meter .mc-track { position: relative; height: 1.1em; border-radius: var(--r-pill); background: var(--bubble); overflow: hidden }
.fs-vu-meter .mc-fill { position: absolute; inset: 0; border-radius: var(--r-pill);
  background: var(--ink);
  clip-path: inset(0 calc(100% - var(--l, 0) * 100%) 0 0 round var(--r-pill)) }
.fs-vu-meter .mc-peak { position: absolute; top: 0.2em; bottom: 0.2em; width: 0.3em; margin-left: -0.15em; left: calc(var(--k, 0) * 100%); border-radius: var(--r-pill);
  background: var(--ink); opacity: var(--ko, 0) }
.fs-vu-meter .mc-row { display: flex; align-items: center; gap: 0.5em; flex-wrap: wrap }
.fs-vu-meter .mc-btn { height: 2.6em; padding: 0 1.15em; border: 0; border-radius: var(--r-pill); background: var(--bubble); color: var(--ink); font-weight: 500; cursor: pointer;
  transition: transform 100ms, background-color var(--dur-instant), color var(--dur-instant) }
.fs-vu-meter .mc-btn:active { transform: scale(0.97) }
.fs-vu-meter .mc-btn[aria-pressed="true"] { background: var(--ink); color: var(--on-ink) }
.fs-vu-meter.is-tile .mc-row { display: none }
`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="mc">
  <div class="mc-top">
    <div class="mc-fig" aria-hidden="true"></div>
    <div class="mc-word"><span>Mic check</span><b></b></div>
  </div>
  <div class="mc-bars" aria-hidden="true">
    <div class="mc-bar"><span>L</span><span class="mc-track"><span class="mc-fill"></span><span class="mc-peak"></span></span></div>
    <div class="mc-bar"><span>R</span><span class="mc-track"><span class="mc-fill"></span><span class="mc-peak"></span></span></div>
  </div>
  <div class="mc-row">
    <button class="mc-btn" type="button" data-act="voice" aria-pressed="false">Sample voice</button>
    <button class="mc-btn" type="button" data-act="tone" aria-pressed="false">Test tone</button>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;
      const sig = { signal: ctx.signal };
      const tracks = [...host.querySelectorAll(".mc-track")], figEl = host.querySelector(".mc-fig"), wordEl = host.querySelector(".mc-word b");
      const voiceBtn = host.querySelector('[data-act="voice"]'), toneBtn = host.querySelector('[data-act="tone"]'), live = host.querySelector("[aria-live]");

      /* The bars: a spring in deflection (linear in voltage, 1 at +3 dB), shown on a dB scale from −30 to +3. */
      const shown = [0, 0];
      const springs = [0, 1].map((c) => ctx.spring(0, (d) => { shown[c] = d; tracks[c].style.setProperty("--l", pos(db(Math.max(0, d) * FULL)).toFixed(4)); }, BALLISTICS));

      /* A synthetic voice, in levels where 1 reads 0 dB: phrases of syllables with pauses between, now and then a loud one. */
      let speaking = false, sylEnd = 0, sylLen = 0, sylAmp = 0, inPhrase = 0, pauseUntil = 0, t = 0;
      function voice(dt) {
        t += dt;
        if (t >= sylEnd) {
          if (inPhrase <= 0) { pauseUntil = t + 0.3 + Math.random() * 0.6; inPhrase = 5 + Math.floor(Math.random() * 9); }
          const start = Math.max(t, pauseUntil);
          sylLen = 0.12 + Math.random() * 0.14; sylEnd = start + sylLen; inPhrase--;
          sylAmp = Math.random() < 0.05 ? 1.55 : 0.45 + Math.random() * 0.7;
        }
        const into = t - (sylEnd - sylLen);
        const env = into < 0 ? 0 : Math.sin(Math.PI * Math.min(1, into / sylLen)) ** 0.7;
        return 0.02 + sylAmp * env;
      }
      let toneAt = -1, kick = 0;
      function tone(now) {
        if (toneAt < 0) return 0;
        const s = (now - toneAt) / 1000;
        return s < 0.012 ? s / 0.012 : s < 0.912 ? 1 : s < 0.982 ? Math.exp(-(s - 0.912) / 0.02) : 0;
      }

      const env = [0, 0], peak = [FLOOR, FLOOR], peakAt = [0, 0], recent = [];
      let loudUntil = 0, lastFig = 0, word = "";
      ctx.loop((dt, now) => {
        const v = speaking ? voice(dt) : 0;
        kick *= Math.exp(-dt / 0.025);
        for (let c = 0; c < 2; c++) {
          const level = Math.max(v * (c ? 0.92 : 1) * (0.96 + Math.random() * 0.08), tone(now), kick);
          env[c] = Math.max(level, env[c] * Math.exp(-dt / RELEASE));
          springs[c].set(env[c] / FULL);
          if (level > FULL) loudUntil = now + 600;
          /* The peak mark holds 900 ms, then falls 12 dB a second. */
          const d = db(Math.max(0, shown[c]) * FULL);
          if (d >= peak[c]) { peak[c] = d; peakAt[c] = now; }
          else if (now - peakAt[c] > HOLD) peak[c] = Math.max(d, peak[c] - FALL * dt);
          tracks[c].style.setProperty("--k", pos(peak[c]).toFixed(4));
          tracks[c].style.setProperty("--ko", peak[c] > FLOOR + 1 ? "1" : "0");
        }
        if (toneAt >= 0 && now - toneAt > 1000) { toneAt = -1; toneBtn.setAttribute("aria-pressed", "false"); }
        /* The figure and the word, ten times a second, so they can be read. */
        if (now - lastFig > 100) {
          lastFig = now;
          const d = Math.max(FLOOR, db(Math.max(shown[0], shown[1]) * FULL));
          figEl.innerHTML = fmt(d) + "<small>dB</small>";
          recent.push(d); if (recent.length > 15) recent.shift();
          const avg = recent.reduce((a, b) => a + b, 0) / recent.length;
          const next = now < loudUntil ? "loud" : avg < -26 ? "quiet" : avg < -16 ? "low" : "good";
          if (next !== word) {
            word = next;
            wordEl.textContent = { loud: "Too loud", quiet: "Waiting for sound", low: "A little quiet", good: "Good level" }[word];
            wordEl.dataset.tone = word;
            if (!ctx.tile) live.textContent = wordEl.textContent;
          }
        }
      });

      function setVoice(on) { speaking = on; voiceBtn.setAttribute("aria-pressed", String(on)); voiceBtn.textContent = on ? "Stop voice" : "Sample voice"; }
      voiceBtn.addEventListener("click", () => setVoice(!speaking), sig);
      toneBtn.addEventListener("click", () => { toneAt = performance.now(); toneBtn.setAttribute("aria-pressed", "true"); }, sig);

      /* Every press is picked up a little. A hand ends the sample voice, unless it pressed the voice's own button. */
      let handPending = false, touched = false;
      ctx.onHand(() => { handPending = true; touched = true; });
      const press = (e) => {
        if (handPending) { handPending = false; if (!voiceBtn.contains(e.target)) setVoice(false); }
        kick = Math.max(kick, 0.9);
      };
      host.addEventListener("pointerdown", press, { signal: ctx.signal, capture: true });
      host.addEventListener("keydown", (e) => { if (!e.repeat) press(e); }, { signal: ctx.signal, capture: true });
      host.addEventListener("wheel", () => { if (handPending) { handPending = false; setVoice(false); } }, { signal: ctx.signal, capture: true, passive: true });

      setVoice(false);
      if (!ctx.reduced()) ctx.after(400, () => { if (!touched) setVoice(true); });
      return { destroy() { springs.forEach((s) => s.stop()); } };
    },
  });
})();

</script>
<script>
(function () {
  const P = window.FlatPlayer;
  const ORDER = ["gradient-keys", "agent-indicators", "agent-status", "command-menu", "fader", "switch", "one-time-code", "ticker",
    "step-sequencer", "knob", "tape-reels", "vu-meter", "agent-shapes", "agent-run", "agent-loaders", "dither-card",
    "spotlight-card", "toast-stack", "hold-to-confirm", "number-ticker", "segmented-control", "magnetic-button", "copy-button"];
  const set = ORDER.map((slug) => P.studies.find((s) => s.slug === slug)).filter(Boolean);
  const n = set.length;
  const $ = (id) => document.getElementById(id);
  const wall = $("fg-wall"), sheet = $("fg-sheet"), openEl = $("fg-open"), live = $("fg-live");

  /* Mount a study into a container. Everything it starts is tied to the returned handle and torn down by unmount(). */
  function mountInto(box, s, tile) {
    box.textContent = "";
    const host = document.createElement("div");
    host.className = "fp-mount fs-" + s.slug + (tile ? " is-tile" : "");
    host.dataset.study = s.slug;
    box.appendChild(host);
    const ac = new AbortController();
    const rec = { ac, timers: [], intervals: [], rafs: [], hands: [], api: null, host };
    let lastTouch = 0;
    const ctx = {
      host, signal: ac.signal, spring: P.spring, reduced: P.reduced, tile: !!tile,
      after(ms, fn) { const t = setTimeout(fn, ms); rec.timers.push(t); return t; },
      every(ms, fn) { const t = setInterval(fn, ms); rec.intervals.push(t); return t; },
      loop(fn) { const r = { stop: false }; rec.rafs.push(r); let last = performance.now();
        const f = (now) => { if (r.stop || ac.signal.aborted) return; const dt = Math.min(0.1, (now - last) / 1000); last = now; if (fn(dt, now) === false) { r.stop = true; return; } requestAnimationFrame(f); };
        requestAnimationFrame(f); return r; },
      onHand(fn) { rec.hands.push(fn); },
      touched: () => lastTouch,
    };
    let handed = false;
    const hand = () => { lastTouch = performance.now(); if (!handed) { handed = true; rec.hands.forEach((f) => { try { f(); } catch (e) { console.error(e); } }); } };
    if (!tile) for (const t of ["pointerdown", "keydown", "wheel"]) host.addEventListener(t, hand, { signal: ac.signal, capture: true, passive: t === "wheel" });
    try { rec.api = s.mount(host, ctx) || null; } catch (e) { console.error(s.slug, e); host.textContent = s.title; }
    return rec;
  }
  function unmount(rec) {
    if (!rec) return;
    try { rec.api && rec.api.destroy && rec.api.destroy(); } catch (e) { console.error(e); }
    rec.ac.abort(); rec.timers.forEach(clearTimeout); rec.intervals.forEach(clearInterval); rec.rafs.forEach((r) => (r.stop = true));
    rec.host.remove();
  }

  /* The wall: a tile per study, mounted only while it is on screen and no sheet covers it. */
  const tiles = set.map((s, i) => {
    const li = document.createElement("li");
    li.innerHTML = '<button class="fg-tile" type="button"><div class="fg-stage" inert></div><span class="fg-name"><b></b><span></span></span></button>';
    const btn = li.firstChild, stage = btn.querySelector(".fg-stage");
    btn.querySelector("b").textContent = s.title;
    btn.querySelector(".fg-name span").textContent = s.tagline || "";
    btn.setAttribute("aria-label", "Open " + s.title);
    btn.addEventListener("click", () => open(i, btn));
    wall.appendChild(li);
    return { s, btn, stage, rec: null, visible: false };
  });
  let sheetOpen = false;
  const sync = (t) => {
    const want = t.visible && !sheetOpen;
    if (want && !t.rec) t.rec = mountInto(t.stage, t.s, true);
    if (!want && t.rec) { unmount(t.rec); t.rec = null; }
  };
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) { const t = tiles.find((x) => x.stage === e.target); t.visible = e.isIntersecting; sync(t); }
  }, { rootMargin: "120px 0px" });
  tiles.forEach((t) => io.observe(t.stage));

  /* The sheet grows out of the tile that opened it and gathers back into it. */
  let cur = -1, openRec = null, opener = null;
  const EXPRESSIVE = "linear(0, 0.0897, 0.2671, 0.4643, 0.6434, 0.7874, 0.8925, 0.9624, 1.004, 1.0249, 1.0322, 1.0295, 1.0237, 1.0173, 1.0115, 1.0068, 1.0034, 1.0012, 0.9998, 0.9992, 1)";
  function grow(from) {
    if (P.reduced() || !from || !sheet.animate) return;
    const r = from.getBoundingClientRect();
    const sx = r.width / innerWidth, sy = r.height / innerHeight;
    sheet.animate([{ transformOrigin: "0 0", transform: `translate(${r.left}px, ${r.top}px) scale(${sx}, ${sy})`, borderRadius: "40px", opacity: 0.6 },
      { transformOrigin: "0 0", transform: "none", borderRadius: "0px", opacity: 1 }], { duration: 520, easing: EXPRESSIVE });
  }
  function show(i, dir) {
    cur = ((i % n) + n) % n;
    const s = set[cur];
    unmount(openRec);
    openRec = mountInto(openEl, s, false);
    if (dir && !P.reduced() && openRec.host.animate)
      openRec.host.animate([{ transform: `translateX(${dir * 28}px)`, opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 579, easing: EXPRESSIVE });
    $("fg-sheet-title").textContent = s.title;
    $("fg-about").innerHTML = "";
    const b = document.createElement("b"); b.textContent = s.tagline || ""; $("fg-about").appendChild(b);
    try { history.replaceState(null, "", "#" + s.slug); } catch (e) {}
    document.title = s.title + " · Flat Studies";
    live.textContent = s.title + ", " + (cur + 1) + " of " + n;
  }
  function open(i, from) {
    opener = from || tiles[i].btn;
    sheetOpen = true; tiles.forEach(sync);
    sheet.classList.add("is-open"); document.body.style.overflow = "hidden";
    $("fg-wall").inert = true;
    show(i, 0); grow(from);
    $("fg-close").focus({ preventScroll: true });
  }
  function close() {
    if (!sheetOpen) return;
    unmount(openRec); openRec = null;
    sheet.classList.remove("is-open"); document.body.style.overflow = "";
    $("fg-wall").inert = false;
    sheetOpen = false;
    const back = tiles[cur].btn;
    tiles.forEach(sync);
    back.focus({ preventScroll: true });
    back.scrollIntoView({ block: "nearest" });
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    document.title = "Flat Studies";
  }
  $("fg-close").addEventListener("click", close);
  $("fg-prev").addEventListener("click", () => show(cur - 1, -1));
  $("fg-next").addEventListener("click", () => show(cur + 1, 1));
  sheet.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); close(); }
    if (e.key === "Tab") { // keep focus in the sheet
      const f = [...sheet.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"]), select, textarea')].filter((el) => !el.disabled && el.offsetParent !== null);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });

  const themeBtn = $("fg-theme");
  const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const paintTheme = () => (themeBtn.textContent = isDark() ? "Light" : "Dark");
  themeBtn.addEventListener("click", () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; paintTheme(); });
  paintTheme();

  const start = set.findIndex((s) => s.slug === location.hash.slice(1));
  if (start >= 0) open(start, tiles[start].btn);
  window.FlatGallery = { open: (slug) => { const i = set.findIndex((s) => s.slug === slug); if (i >= 0) open(i, tiles[i].btn); }, close };
})();
</script>
