<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flat Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Flat (litt-md, taste/litt-principles.md): ground, then paper, then part. Grey ground, white paper with no edge and
   nothing cast, pills and circles, the ink as the one accent, Candy hues only on data, the sunset ramp for how far.
   Values are litt's tokens.css, Flat's block. */
:root {
  --ground: #ededed; --paper: #ffffff; --bubble: #ededed; --surface-2: #f5f5f5; --wash: rgb(15 15 15 / 0.06);
  --ink: #0f0f0f; --on-ink: #ffffff; --muted: #676767; --disabled: #9e9e9e; --outline: #868686; --line: #e5e5e5;
  --float: 0 1px 2px rgb(0 0 0 / 0.06), 0 12px 32px -8px rgb(0 0 0 / 0.16);
  --blue: #3688f0; --tangerine: #da6203; --mint: #019964; --grape: #b15afe; --cherry: #ff3148;
  --sky: #0090bf; --bubblegum: #f92797; --sun: #a68105;
  --blue-text: #266bbb; --mint-text: #007a4f; --cherry-text: #d50230;
  --seq-1: #de9814; --seq-2: #e15f0a; --seq-3: #ca2356; --seq-4: #892784;
  --success: #019964; --warning: #da6203; --danger: #ff3148;
  --font: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-paper: 16px; --r-control: 28px; --r-pill: 999px;
  --dur-instant: 100ms; --dur-responsive: 250ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #171717; --paper: #090909; --bubble: #1e1e1e; --surface-2: #171717; --wash: rgb(248 248 248 / 0.08);
  --ink: #f8f8f8; --on-ink: #090909; --muted: #c6c6c6; --disabled: #656565; --outline: #686868; --line: #252525;
  --float: 0 1px 2px rgb(0 0 0 / 0.5), 0 12px 32px -8px rgb(0 0 0 / 0.7);
  --blue: #4792fe; --tangerine: #e86904; --mint: #03af73; --grape: #b564ff; --cherry: #ff4451;
  --sky: #03a1d5; --bubblegum: #fd2d9b; --sun: #b68e0a;
  --blue-text: #74acfe; --mint-text: #0bca86; --cherry-text: #ff7e7d;
  --seq-1: #5c46a7; --seq-2: #c547a3; --seq-3: #fa8054; --seq-4: #f7cc4b;
  --success: #03af73; --warning: #e86904; --danger: #ff4451; color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #171717; --paper: #090909; --bubble: #1e1e1e; --surface-2: #171717; --wash: rgb(248 248 248 / 0.08);
  --ink: #f8f8f8; --on-ink: #090909; --muted: #c6c6c6; --disabled: #656565; --outline: #686868; --line: #252525;
  --float: 0 1px 2px rgb(0 0 0 / 0.5), 0 12px 32px -8px rgb(0 0 0 / 0.7);
  --blue: #4792fe; --tangerine: #e86904; --mint: #03af73; --grape: #b564ff; --cherry: #ff4451;
  --sky: #03a1d5; --bubblegum: #fd2d9b; --sun: #b68e0a;
  --blue-text: #74acfe; --mint-text: #0bca86; --cherry-text: #ff7e7d;
  --seq-1: #5c46a7; --seq-2: #c547a3; --seq-3: #fa8054; --seq-4: #f7cc4b;
  --success: #03af73; --warning: #e86904; --danger: #ff4451; color-scheme: dark }
@media (prefers-reduced-motion: reduce) { :root { --dur-instant: 0ms; --dur-responsive: 0ms } }

*, *::before, *::after { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--ground); color: var(--ink); font: 400 15px/1.45 var(--font); letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)) }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }

/* The gallery: Flat's wall. Grey ground; each study live at a small size with its name under it; a tile opens the study
   large in a sheet that grows out of it. */
.fg { max-width: 1240px; margin: 0 auto; padding: 32px 8px 64px }
.fg-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin: 0 0 32px }
.fg-head h1 { margin: 0; font: 600 34px/1.1 var(--font); letter-spacing: -0.03em }
.fg-head p { margin: 6px 0 0; color: var(--muted); max-width: 52ch }
.fg-pill { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border: 0; border-radius: var(--r-pill);
  background: var(--paper); color: var(--ink); font: 500 14px var(--font); cursor: pointer; transition: background-color var(--dur-instant) }
.fg-pill:hover { background: color-mix(in oklab, var(--paper), var(--ink) 4%) }
.fg-wall { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 40px 24px }
.fg-tile { display: grid; gap: 10px; width: 100%; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; border-radius: var(--r-paper) }
.fg-stage { position: relative; height: 280px; border-radius: var(--r-paper); background: var(--ground); overflow: hidden; display: grid; place-items: center;
  transition: background-color var(--dur-responsive) }
.fg-tile:hover .fg-stage { background: color-mix(in oklab, var(--ground), var(--ink) 3%) }
.fg-stage > .fp-mount { width: 100%; height: 100%; display: grid; place-items: center; padding: 16px; container-type: inline-size; pointer-events: none }
.fg-name { display: flex; align-items: baseline; gap: 10px; padding: 0 4px; min-width: 0 }
.fg-name b { font-weight: 500; white-space: nowrap; flex: none }
.fg-name span { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }

/* The sheet: the study open, large, on the ground, over the wall. */
.fg-sheet { position: fixed; inset: 0; z-index: 10; display: none; background: var(--ground); overflow: auto; overscroll-behavior: contain }
.fg-sheet.is-open { display: grid; grid-template-rows: auto 1fr auto }
.fg-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 16px 16px 0 }
.fg-bar h2 { margin: 0; font: 500 16px/1.2 var(--font); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.fg-bar .fg-close { justify-self: start } .fg-bar .fg-steps { justify-self: end; display: flex; gap: 6px }
.fg-circle { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--paper); color: var(--ink); cursor: pointer }
.fg-circle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.fg-open { display: grid; place-items: center; min-height: 0; padding: 24px 16px }
.fg-open > .fp-mount { width: min(100%, 960px); min-height: min(560px, 100%); display: grid; place-items: center; container-type: inline-size }
.fg-about { max-width: 640px; margin: 0 auto; padding: 0 16px 32px; text-align: center; color: var(--muted) }
.fg-about b { display: block; color: var(--ink); font-weight: 500; font-size: 15px }
.fg-foot { margin-top: 48px; color: var(--muted); font-size: 13px }
.fg-foot a { color: inherit }
@media (max-width: 720px) { .fg-head h1 { font-size: 28px } .fg-stage { height: 260px } }
</style>
</head>
<body>
<main class="fg">
  <header class="fg-head">
    <div><h1>Flat studies</h1><p>Small studies in motion, feedback and touch, after litterthanlit/components, redesigned in litt's Flat.</p></div>
    <button class="fg-pill" type="button" id="fg-theme">Dark</button>
  </header>
  <ul class="fg-wall" id="fg-wall"></ul>
  <p class="fg-foot">Each study runs by itself until you touch it. Open one to use it.</p>
</main>
<div class="fg-sheet" id="fg-sheet" role="dialog" aria-modal="true" aria-labelledby="fg-sheet-title">
  <div class="fg-bar">
    <button class="fg-circle fg-close" type="button" id="fg-close" aria-label="Close"><svg viewBox="0 0 14 14"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg></button>
    <h2 id="fg-sheet-title"></h2>
    <div class="fg-steps">
      <button class="fg-circle" type="button" id="fg-prev" aria-label="Previous study"><svg viewBox="0 0 14 14"><path d="M9 3.5 5.5 7 9 10.5"/></svg></button>
      <button class="fg-circle" type="button" id="fg-next" aria-label="Next study"><svg viewBox="0 0 14 14"><path d="M5 3.5 8.5 7 5 10.5"/></svg></button>
    </div>
  </div>
  <div class="fg-open" id="fg-open"></div>
  <p class="fg-about" id="fg-about"></p>
</div>
<p class="sr-only" id="fg-live" aria-live="polite"></p>
<script>
/* The contract every study keeps (FlatPlayer.register), and the one spring they share. */
window.FlatPlayer = (function () {
  const studies = [];
  const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  /* A damped spring, stepped at 1/240s. bounce 0 is critically damped; 0.28 is Flat's expressive arrival. */
  function spring(initial, onUpdate, opts) {
    const o = Object.assign({ duration: 0.35, bounce: 0 }, opts);
    const w = (2 * Math.PI) / o.duration, k = w * w, c = 2 * (1 - o.bounce) * w;
    let x = initial, v = 0, target = initial, raf = 0, last = 0;
    const step = (now) => {
      let dt = Math.min(0.064, (now - last) / 1000); last = now;
      while (dt > 0) { const h = Math.min(dt, 1 / 240); v += (-k * (x - target) - c * v) * h; x += v * h; dt -= h; }
      if (Math.abs(x - target) < 0.0005 && Math.abs(v) < 0.0005) { x = target; v = 0; raf = 0; onUpdate(x); return; }
      onUpdate(x); raf = requestAnimationFrame(step);
    };
    return {
      set(t, velocity) { target = t; if (velocity !== undefined) v = velocity;
        if (reduced()) { x = t; v = 0; onUpdate(x); return; }
        if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } },
      jump(t) { x = target = t; v = 0; if (raf) cancelAnimationFrame(raf); raf = 0; onUpdate(x); },
      value: () => x, velocity: () => v, target: () => target,
      stop() { if (raf) cancelAnimationFrame(raf); raf = 0; },
    };
  }
  return { studies, spring, reduced, register(s) {
    studies.push(s);
    if (s.css) { const st = document.createElement("style"); st.dataset.study = s.slug; st.textContent = s.css; document.head.appendChild(st); }
  } };
})();
</script>
<script>
/* agent-indicators.js */
/* Agent Indicators, after litterthanlit/components, redesigned for Flat: what a writing assistant is doing
   while it drafts your post, said in one white pill on the grey ground. An ink circle holds a small glyph
   that moves its own way for each phase (thinking turns, searching seeks on a spring, reading sweeps the
   lines in bursts, reasoning tumbles, running fills a ring step by step, writing lays down lines), and the
   words say the phase. The pill grows to its words. Open, the six phases are pills to pick from. One frame
   loop draws every glyph; each runs ahead before it paints, so none is ever seen at rest. */
(function () {
  const S = ".fs-agent-indicators";
  const NS = "http://www.w3.org/2000/svg";
  const AHEAD = 1.2, CYCLE = 2400;
  const EXPRESSIVE = "linear(0, 0.0897, 0.2671, 0.4643, 0.6434, 0.7874, 0.8925, 0.9624, 1.004, 1.0249, 1.0322, 1.0295, 1.0237, 1.0173, 1.0115, 1.0068, 1.0034, 1.0012, 0.9998, 0.9992, 1)";
  const ORDER = ["thinking", "searching", "reading", "reasoning", "running", "writing"];
  const INFO = {
    thinking: { label: "Thinking", detail: "about your post" },
    searching: { label: "Searching", detail: "12 sources" },
    reading: { label: "Reading", detail: "your last three issues" },
    reasoning: { label: "Weighing", detail: "two openings" },
    running: { label: "Checking", detail: "8 links" },
    writing: { label: "Writing", detail: "the draft" },
  };
  const attr = (el, n, v) => { if (el.getAttribute(n) !== v) el.setAttribute(n, v); };
  function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  const line = (svg, x1, y, x2, extra) => el("line", Object.assign({ x1, x2, y1: y, y2: y, stroke: "currentColor", "stroke-width": 2, "stroke-linecap": "round" }, extra), svg);
  /* A damped spring stepped at 1/240s, for glyph parts that move on one. */
  const springStep = (s, dt, k, c) => { for (let left = dt; left > 0; left -= 1 / 240) { const h = Math.min(left, 1 / 240); s.v += (k * (s.target - s.x) - c * s.v) * h; s.x += s.v * h; } };

  /* Each glyph draws in a 24 unit box, in currentColor, and returns its frame. */
  const GLYPHS = {
    // A quarter arc turning round a faint ring.
    thinking(svg) {
      el("circle", { cx: 12, cy: 12, r: 7, fill: "none", stroke: "currentColor", "stroke-width": 2.4, opacity: 0.28 }, svg);
      const arc = el("circle", { cx: 12, cy: 12, r: 7, fill: "none", stroke: "currentColor", "stroke-width": 2.4, "stroke-linecap": "round", pathLength: 100, "stroke-dasharray": "28 72" }, svg);
      let a = 0, t = 0;
      return (dt) => { t += dt; a += dt * (300 + 160 * Math.sin(t * 3)); attr(arc, "transform", "rotate(" + (a % 360).toFixed(1) + " 12 12)"); };
    },
    // A lens that seeks between places on a spring (k 110, c 14: it overshoots a little and settles), and holds.
    searching(svg) {
      const g = el("g", {}, svg);
      el("circle", { cx: 11, cy: 11, r: 4.4, fill: "none", stroke: "currentColor", "stroke-width": 2.2 }, g);
      line(g, 14.4, 14.4, 17.4, { y2: 17.4, "stroke-width": 2.4 });
      const STOPS = [0.15, 0.6, 0.35, 0.85];
      const s = { x: 0.15, v: 0, target: 0.15 };
      let at = 0, dwell = 0.5, y = 0;
      return (dt) => {
        if (dwell > 0) { dwell -= dt; if (dwell <= 0) { at = (at + 1) % STOPS.length; } }
        else { const step = 0.9 * dt, goal = STOPS[at]; s.target = Math.abs(goal - s.target) <= step ? goal : s.target + Math.sign(goal - s.target) * step; if (s.target === goal) dwell = 0.5; }
        springStep(s, dt, 110, 14);
        y += dt;
        attr(g, "transform", "translate(" + ((s.x - 0.5) * 9).toFixed(2) + " " + (Math.sin(y * 2.4) * 1.2).toFixed(2) + ")");
      };
    },
    // Three lines, read in bursts: the sweep runs fast, pauses, runs again.
    reading(svg) {
      const ys = [7.5, 12, 16.5], w = [12, 12, 8];
      ys.forEach((y, i) => line(svg, 6, y, 6 + w[i], { opacity: 0.3 }));
      const lit = ys.map((y) => line(svg, 6, y, 6, { opacity: 0 }));
      const total = w.reduce((a, b) => a + b, 0);
      let p = 0, burst = 0.4, gap = 0, hold = 0;
      return (dt) => {
        if (hold > 0) { hold -= dt; if (hold <= 0) p = 0; }
        else if (burst > 0) { burst -= dt; p += dt * (16 + Math.random() * 18); if (burst <= 0) gap = 0.08 + Math.random() * 0.25; }
        else { gap -= dt; if (gap <= 0) burst = 0.15 + Math.random() * 0.35; }
        if (p >= total && hold <= 0) { p = total; hold = 0.35; }
        let left = p;
        lit.forEach((l, i) => {
          const len = Math.max(0, Math.min(w[i], left)); left -= w[i];
          attr(l, "x2", (6 + len).toFixed(2));
          attr(l, "opacity", len > 0.5 ? "1" : "0");
        });
      };
    },
    // A rounded square that tumbles a quarter turn at a time on the expressive spring, rounding as it turns.
    reasoning(svg) {
      const r = el("rect", { x: 7, y: 7, width: 10, height: 10, rx: 2.5, fill: "none", stroke: "currentColor", "stroke-width": 2.4 }, svg);
      const w = (2 * Math.PI) / 0.35, k = w * w, c = 2 * (1 - 0.28) * w;
      const s = { x: 0, v: 0, target: 0 };
      let t = 0;
      return (dt) => {
        t += dt;
        if (t >= 0.7) { t -= 0.7; s.target += 90; }
        springStep(s, dt, k, c);
        const turning = Math.min(1, Math.abs(s.target - s.x) / 45);
        attr(r, "rx", (2.5 + 2.5 * turning).toFixed(2));
        attr(r, "transform", "rotate(" + (s.x % 360).toFixed(1) + " 12 12)");
      };
    },
    // A ring filled step by step, eight steps, held full, then again.
    running(svg) {
      el("circle", { cx: 12, cy: 12, r: 7, fill: "none", stroke: "currentColor", "stroke-width": 2.4, opacity: 0.28 }, svg);
      const arc = el("circle", { cx: 12, cy: 12, r: 7, fill: "none", stroke: "currentColor", "stroke-width": 2.4, "stroke-linecap": "round", pathLength: 80,
        "stroke-dasharray": "0 80", transform: "rotate(-90 12 12)" }, svg);
      const shown = { x: 0, v: 0, target: 0 };
      let t = 0, steps = 0, stage = "run";
      return (dt) => {
        t += dt;
        if (stage === "run" && t >= 0.22) { t = 0; steps++; if (steps >= 8) stage = "hold"; }
        else if (stage === "hold" && t >= 0.5) { stage = "rest"; t = 0; steps = 0; }
        else if (stage === "rest" && t >= 0.2) { stage = "run"; t = 0; }
        shown.target = steps;
        springStep(shown, dt, 900, 60);
        const len = Math.max(0, shown.x * 10 - 3);
        attr(arc, "stroke-dasharray", len.toFixed(2) + " 80");
        attr(arc, "opacity", len > 0.1 ? "1" : "0");
      };
    },
    // Lines laid down one after another with a caret at the end, then the page clears.
    writing(svg) {
      const ys = [7.5, 12, 16.5], w = [12, 10, 7];
      const lines = ys.map((y) => line(svg, 6, y, 6, { opacity: 0 }));
      const caret = el("line", { x1: 6, x2: 6, y1: 4.5, y2: 10.5, stroke: "currentColor", "stroke-width": 1.8, "stroke-linecap": "round" }, svg);
      const total = w.reduce((a, b) => a + b, 0);
      let p = 0, hold = 0, fade = 1, blink = 0;
      return (dt) => {
        blink += dt;
        if (hold > 0) { hold -= dt; fade = Math.min(1, hold / 0.2); if (hold <= 0) { p = 0; fade = 1; } }
        else { p += dt * 14; if (p >= total) { p = total; hold = 0.6; } }
        let left = p, cx = 6, cy = ys[0];
        lines.forEach((l, i) => {
          const len = Math.max(0, Math.min(w[i], left)); left -= w[i];
          attr(l, "x2", (6 + len).toFixed(2));
          attr(l, "opacity", len > 0.3 ? fade.toFixed(2) : "0");
          if (len > 0) { cx = 6 + len + 2; cy = ys[i]; }
        });
        attr(caret, "transform", "translate(" + (cx - 6).toFixed(2) + " " + (cy - 7.5).toFixed(2) + ")");
        attr(caret, "opacity", hold > 0 ? (Math.floor(blink * 3) % 2 ? "0" : fade.toFixed(2)) : "1");
      };
    },
  };

  let uid = 0;
  FlatPlayer.register({
    slug: "agent-indicators",
    title: "Agent Indicators",
    tagline: "Thinking, searching, reading, weighing, checking, writing: one pill says which.",
    css: `
${S} .ai { width: 100%; display: grid; justify-items: center; gap: 28px }
${S} .ai-pill { display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 24px 0 10px; border-radius: var(--r-pill); background: var(--paper); max-width: 100% }
${S} .ai-glyph { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: grid }
${S} .ai-glyph svg { grid-area: 1 / 1; width: 100%; height: 100%; padding: 6px; box-sizing: border-box; opacity: 0; transition: opacity 150ms; overflow: visible }
${S} .ai-glyph svg.is-on { opacity: 1 }
${S} .ai-words { position: relative; overflow: hidden; height: 24px; flex: none; max-width: calc(100cqw - 120px) }
${S} .ai-words span { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 17px; line-height: 24px }
${S} .ai-words b { font-weight: 600 }
${S} .ai-words i { font-style: normal; color: var(--muted) }
${S} .ai-picks { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 100% }
${S} .ai-pick { height: 40px; padding: 0 16px; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--muted); font-size: 14px; cursor: pointer;
  transition: background-color var(--dur-instant), color var(--dur-instant), transform var(--dur-instant) }
${S} .ai-pick:hover { background: var(--wash); color: var(--ink) }
${S} .ai-pick:active { transform: scale(0.96) }
${S} .ai-pick[aria-checked="true"] { background: var(--paper); color: var(--ink); font-weight: 500 }
${S}.is-tile .ai-picks { display: none }
@container (max-width: 380px) {
  ${S} .ai-pill { height: 52px; gap: 10px; padding: 0 18px 0 8px }
  ${S} .ai-glyph { width: 36px; height: 36px }
  ${S} .ai-words { height: 22px; max-width: calc(100cqw - 90px) }
  ${S} .ai-words span { font-size: 15px; line-height: 22px }
  ${S} .ai-pick { padding: 0 12px }
}
`,
    mount(host, ctx) {
      const id = "ai" + ++uid;
      host.innerHTML = `
<div class="ai">
  <div class="ai-pill"><span class="ai-glyph" aria-hidden="true"></span><span class="ai-words" aria-hidden="true"></span></div>
  <div class="ai-picks" role="radiogroup" aria-label="Phase"></div>
  <p class="sr-only" id="${id}-live" aria-live="polite"></p>
</div>`;

        b.addEventListener("keydown", (e) => {

        }, { signal: ctx.signal });
      });
      return { destroy() { width.stop(); } };
    },
  });
})();

        const said = busy() ? (phase === "thinking" ? "Thinking" : cur.verb + " " + cur.target) : phase === "done" ? "Answer ready. " + ANSWER : "";
        if (live.textContent !== said) live.textContent = said;
      }
      function startTicker() {
        if (ticker) return;
        ticker = ctx.every(250, () => {
          if (!busy()) { clearInterval(ticker); ticker = 0; return; }
          const s = Math.floor((Date.now() - started) / 1000);
          if (s !== seconds) { seconds = s; drawHead(); }
        });
      }

      /* The script: each phase schedules the next. */
      function script() {
        clear();
        if (ctx.reduced()) {
          phase = "done"; revealed = finished = STEPS.length; streamed = words.length; open = false;
          seconds = Math.round((THINK + STEPS.length * STEP) / 1000); draw(); return;
        }
        run++;
        started = Date.now(); phase = "thinking"; revealed = finished = streamed = 0; open = true; seconds = 0;
        list.textContent = ""; draw(); startTicker();
        let t = THINK;
        STEPS.forEach((_, i) => {
          at(t, () => { phase = "working"; revealed = i + 1; draw(); });
          t += STEP;
          at(t, () => { finished = i + 1; drawSteps(); });
        });
        at(t + 250, () => { seconds = Math.max(1, Math.round((Date.now() - started) / 1000)); phase = "answering"; open = false; draw(); });
        t += 500;
        words.forEach((_, i) => at(t + i * WORD, () => { streamed = i + 1; drawAnswer(); }));
        t += words.length * WORD;
        at(t, () => { phase = "done"; draw(); if (!looping) again.hidden = false; });
        at(t + LOOP_AFTER, () => { if (looping) script(); });
      }

      head.addEventListener("click", () => { if (busy()) return; open = !open; drawHead(); }, sig);
      again.addEventListener("click", () => { script(); head.focus({ preventScroll: true }); }, sig);
      /* A hand ends the loop: this turn plays out and stays, and Run again is the hand's to press. */
      ctx.onHand(() => { looping = false; if (phase === "done") again.hidden = ctx.reduced(); });
      script();
      return { destroy: clear };
    },
  });
})();

</script>

    return `<span class="as-spin">${rays}</span><span class="as-core"></span>`;

  const ELLIPSE = "M3 16a13 5 0 1 0 26 0a13 5 0 1 0 -26 0";
  const ORBITS = [{ angle: 0, duration: 1800 }, { angle: 60, duration: 2400 }, { angle: 120, duration: 3000 }];
  function orbit() {
    return `<svg viewBox="0 0 32 32" fill="none">${ORBITS.map(({ angle, duration }, i) => `<g transform="rotate(${angle} 16 16)">
      <path d="${ELLIPSE}" class="as-track" stroke-width="1"/>
      <path d="${ELLIPSE}" pathLength="1" stroke-dasharray="0.12 0.88" stroke-width="1.75" stroke-linecap="round" class="as-trace ${i === 0 ? "as-hi" : "as-lo"}"

  const CHORDS = [[1, 4], [2, 5]];

  const NODE_AT = (() => {
    const edges = NODES.map(([x, y], i) => { const [nx, ny] = NODES[(i + 1) % NODES.length]; return Math.hypot(nx - x, ny - y); });
    const total = edges.reduce((s, d) => s + d, 0);

    mount(host, ctx) {

<div class="as">

        if (i === step) return;
        step = i;

        line.textContent = p.line;

          next.animate([{ opacity: 0, transform: "scale(0.82)" }, { opacity: 1, transform: "none" }], { duration: 420, easing: EXPRESSIVE, fill: "backwards" });

        }

      let timer = reduced ? 0 : ctx.every(2400, () => setStep((step + 1) % PHASES.length));
      ctx.onHand(() => { clearInterval(timer); timer = 0; });

      pills.forEach((b, i) => b.addEventListener("click", () => setStep(i), sig));
      host.querySelector(".as-pick").addEventListener("keydown", (e) => {
        const len = PHASES.length;
        const move = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        let to = null;
        if (move) to = (step + move + len) % len;
        else if (e.key === "Home") to = 0;
        else if (e.key === "End") to = len - 1;
        if (to === null) return;
        e.preventDefault();
        setStep(to, true);
      }, sig);
    },

<script>
/* agent-status.js */
/* Agent Status, after litterthanlit/components (agent-status.tsx), redesigned in Flat.
 * An agent's run as one card of paper: the task and the state in words, the time the run has been live as the one
 * large figure (it holds while a call waits on your OK and stops on the tenth Stop goes down), what it's doing now,
 * typed on, and three pills for the phases it passes through: outlined until reached, grey once passed, ink while
 * it's there. The ink breathes with each chunk of tokens through a 90ms detector, so a stall goes quiet. Under them
 * sit the actions, only the ones that apply: Run (or Retry, or Run again) in the ink; Stop; and Allow in the ink
 * when a call waits on you, growing in beside Stop. A ghost runs three tasks until a hand arrives. Escape stops. */
(function () {
  const PHASES = [{ key: "thinking", name: "Think" }, { key: "tool", name: "Use tools" }, { key: "writing", name: "Write" }];
  const DECAY = 0.09; // s: the detector's release
  const FLOOR = 0.55; // the current pill's strength with no tokens arriving
  let uid = 0;

  const isLive = (s) => s === "thinking" || s === "tool" || s === "writing";
  const isEnd = (s) => s === null || s === "ready" || s === "done" || s === "error" || s === "stopped";
  const thousands = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const lineOf = (step) => (step ? [step.verb, step.target].filter(Boolean).join(" ") : "");
  const WORDS = { ready: "Ready", thinking: "Thinking", tool: "Using a tool", writing: "Writing", waiting: "Needs your OK", done: "Done", error: "Didn't finish", stopped: "Stopped" };

  function sayFor(state, line) {
    const w = (word) => (line ? `${word}: ${line}` : word);
    if (state === "thinking") return w("Thinking");
    if (state === "tool") return line || "Running a tool";
    if (state === "writing") return w("Writing");
    if (state === "waiting") return w("Waiting for your OK");
    if (state === "done") return w("Done");
    if (state === "error") return w("Error");
    if (state === "stopped") return "Stopped";
    return "";
  }

  /* --- The demo: three tasks on a small site, and a ghost at the keys. --- */
  const cue = (wait, state, verb, target) => ({ wait, state, verb, target });
  const RUNS = [
    {
      task: "Tidy the drafts",
      cues: [
        cue(0, "thinking", "Planning", "the tidy-up"),
        cue(950, "tool", "Reading", "12 drafts"),
        cue(600, "tool", "Looking for", "duplicates"),
        cue(600, "thinking", "Comparing", "two drafts"),
        cue(650, "tool", "Delete", "“Spring notes (copy)”"),
        cue(120, "waiting", "Delete", "“Spring notes (copy)”"),
        cue(0, "tool", "Delete", "“Spring notes (copy)”"), // allowed: the same call goes on
        cue(600, "tool", "Retitling", "“Untitled 4”"),
        cue(600, "writing", "Writing", "a note for you"),
        cue(1700, "done", "Tidied", "12 drafts, 1 deleted"),
      ],
    },
    {
      task: "Send issue 05",
      cues: [
        cue(0, "thinking", "Planning", "the send"),
        cue(900, "tool", "Resizing", "the cover"),
        cue(700, "tool", "Sending to", "2,140 readers"),
        cue(1100, "error", "Too many at once.", "Try again in a moment"),
      ],
      retry: [
        cue(0, "thinking", "Waiting out", "the limit"),
        cue(800, "tool", "Splitting", "readers into 3 batches"),
        cue(700, "tool", "Sending to", "2,140 readers"),
        cue(900, "done", "Sent", "to 2,140 readers"),
      ],
    },
    {
      task: "Summarise a post",
      cues: [
        cue(0, "thinking", "Planning", "the summary"),
        cue(800, "tool", "Reading", "“Spring notes”"),
        cue(600, "writing", "Writing", "the summary"),
        { wait: 1500, ghost: "stop" }, // the ghost stops it mid-stream; under a hand, the agent finishes
        cue(1500, "done", "Wrote", "a 212-word summary"),
      ],
    },
  ];
  const GHOST = { ready: 700, waiting: 1500, error: 2200, done: 2600, stopped: 2000 };
  const FIRST_PRESS = 280;
  const chunk = (state) => (state === "writing" ? 8 + Math.floor(Math.random() * 13) : 3 + Math.floor(Math.random() * 7));

  const css = `
.fs-agent-status [hidden] { display: none !important; }
.fs-agent-status .as { width: min(100%, 420px); background: var(--paper); border-radius: var(--r-paper); padding: 20px; display: grid; gap: 16px;
  -webkit-user-select: none; user-select: none; }
.fs-agent-status .as-head { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.fs-agent-status .as-task { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fs-agent-status .as-state { flex: none; font-size: 14px; color: var(--muted); }
.fs-agent-status [data-state="thinking"] .as-state, .fs-agent-status [data-state="tool"] .as-state,
.fs-agent-status [data-state="writing"] .as-state, .fs-agent-status [data-state="waiting"] .as-state { color: var(--ink); font-weight: 500; }
.fs-agent-status [data-state="done"] .as-state { color: var(--ink); font-weight: 500; }
.fs-agent-status [data-state="error"] .as-state { color: var(--cherry-text); font-weight: 500; }
.fs-agent-status .as-mid { display: grid; gap: 6px; }
.fs-agent-status .as-figure { display: flex; align-items: baseline; gap: 12px; }
.fs-agent-status .as-time { margin: 0; font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums;
  transition: color 150ms; }
.fs-agent-status [data-state="waiting"] .as-time, .fs-agent-status [data-state="stopped"] .as-time { color: var(--muted); }
.fs-agent-status .as-tokens { margin-left: auto; font-size: 14px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fs-agent-status .as-line { margin: 0; height: 1.4em; line-height: 1.4; min-width: 0; overflow: hidden; }
.fs-agent-status .as-l { display: inline-block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
.fs-agent-status .as-target { color: var(--muted); }
.fs-agent-status .as-caret { display: inline-block; width: 2px; height: 1em; margin-left: 3px; border-radius: 1px; background: var(--ink);
  transform: translateY(0.16em); animation: fs-as-caret 1s steps(1) infinite; }
@keyframes fs-as-caret { 50% { opacity: 0; } }
.fs-agent-status .as-phases { display: flex; gap: 6px; }
.fs-agent-status .as-phase { flex: 1 1 0; min-width: 0; height: 32px; display: grid; place-items: center; border-radius: var(--r-pill);
  font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--outline);
  transition: background-color 150ms, color 150ms, box-shadow 150ms; }
.fs-agent-status .as-phase[data-light="set"] { background: var(--bubble); color: var(--ink); box-shadow: none; }
.fs-agent-status .as-phase[data-light="fire"] { background: color-mix(in oklab, var(--ink) calc(var(--act, 1) * 100%), var(--bubble)); color: var(--on-ink);
  box-shadow: none; transition: none; }
.fs-agent-status .as-phase[data-light="hold"] { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.fs-agent-status .as-phase[data-light="fault"] { background: var(--bubble); color: var(--cherry-text); box-shadow: none; }
.fs-agent-status .as-acts { display: flex; gap: 8px; }
.fs-agent-status .as-acts button { flex: 1; height: 48px; border: 0; border-radius: var(--r-pill); padding: 0 20px; font-size: 15px; font-weight: 500;
  background: var(--bubble); color: var(--ink); cursor: pointer; transform-origin: 50% 50%;
  transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1); -webkit-tap-highlight-color: transparent; }
.fs-agent-status .as-acts .as-go { background: var(--ink); color: var(--on-ink); }
.fs-agent-status .as-acts button:active, .fs-agent-status .as-acts button[data-pressed] { transform: scale(0.96); transition-duration: 75ms; }
@container (max-width: 380px) {
  .fs-agent-status .as { padding: 16px; gap: 12px; }
  .fs-agent-status .as-time { font-size: 40px; }
  .fs-agent-status .as-phase { height: 28px; font-size: 12px; }
  .fs-agent-status .as-acts button { height: 40px; font-size: 14px; }
  .fs-agent-status .as-line { font-size: 14px; }
}
@container (min-width: 600px) {
  .fs-agent-status .as { width: 460px; padding: 24px; gap: 18px; }
  .fs-agent-status .as-time { font-size: 56px; }
}
@media (prefers-reduced-motion: reduce) { .fs-agent-status .as-caret { animation: none; } }
`;

  function mount(host, ctx) {
    const { signal } = ctx;
    const id = "fs-as-" + ++uid;
    host.innerHTML = `
      <div class="as" role="group" aria-label="Agent" data-state="ready">
        <div class="as-head" aria-hidden="true"><span class="as-task"></span><span class="as-state"></span></div>
        <div class="as-mid" aria-hidden="true">
          <div class="as-figure"><p class="as-time">0:00.0</p><span class="as-tokens"></span></div>
          <p class="as-line"><span class="as-l" id="${id}-line"><span class="as-verb"></span><span class="as-target"></span><span class="as-caret" hidden></span></span></p>
        </div>
        <div class="as-phases" aria-hidden="true"></div>
        <div class="as-acts">
          <button type="button" class="as-go">Run</button>
          <button type="button" class="as-stop" aria-keyshortcuts="Escape" hidden>Stop</button>
        </div>
        <div class="sr-only" role="status"></div>
        <p class="sr-only" role="alert"></p>
      </div>`;
    const root = host.querySelector(".as");
    const q = (s) => root.querySelector(s);
    const taskEl = q(".as-task"), stateEl = q(".as-state"), timeEl = q(".as-time"), tokensEl = q(".as-tokens");
    const lineEl = q(".as-l"), verbEl = q(".as-verb"), targetEl = q(".as-target"), caret = q(".as-caret");
    const goBtn = q(".as-go"), stopBtn = q(".as-stop"), statusEl = q("[role=status]"), alertEl = q("[role=alert]");
    const phaseEls = PHASES.map((p) => {
      const el = document.createElement("span");
      el.className = "as-phase";
      el.textContent = p.name;
      q(".as-phases").appendChild(el);
      return el;
    });
    /* Allow grows in on Flat's expressive spring; small moves never bounce. */
    const grow = ctx.spring(1, (s) => { goBtn.style.transform = s === 1 ? "" : `scale(${s})`; goBtn.style.opacity = String(Math.min(1, s)); }, { duration: 0.35, bounce: 0.28 });

    /* --- The time live, and the current pill's breath, from one loop that runs only while something moves. --- */
    const reduced = ctx.reduced();
    let banked = 0, since = 0, env = 0, loop = null;
    function paintTime(seconds) {
      const s = Math.max(0, seconds);
      const m = Math.floor(s / 60);
      const text = reduced && since ? `${m}:${String(Math.floor(s % 60)).padStart(2, "0")}` : `${m}:${(s % 60).toFixed(1).padStart(4, "0")}`;
      if (timeEl.textContent !== text) timeEl.textContent = text;
    }
    function draw(now) {
      paintTime(banked + (since ? Math.max(0, now - since) / 1000 : 0));
      root.style.setProperty("--act", (reduced ? 1 : FLOOR + (1 - FLOOR) * env).toFixed(3));
    }
    function wake() {
      if (loop || !(since || env)) return;
      loop = ctx.loop((dt) => {
        env *= Math.exp(-dt / DECAY);
        if (env < 0.002) env = 0;
        draw(performance.now());
        if (!(since || env)) { loop = null; return false; }
      });
    }
    const clock = {
      go(live, fresh) {
        const now = performance.now();
        if (fresh) banked = 0;
        if (live && !since) since = now;
        else if (!live && since) { banked += (now - since) / 1000; since = 0; }
        draw(now);
        wake();
      },
      reset() { banked = 0; since = 0; draw(performance.now()); },
      seek(s) { const now = performance.now(); banked = s; if (since) since = now; draw(now); },
      kick(n) { if (reduced) return; env = Math.max(env, Math.min(1, 0.5 + n / 24)); wake(); },
    };

    /* --- The component's state, as its props were. --- */
    let task = RUNS[0].task, state = "ready", step = null, tokens = 0, line = "", was = null;
    const track = { state, line, at: null, seen: [], tools: 0, said: 0 };

    function setStatus(nextState, nextStep, opts) {
      const nextLine = lineOf(nextStep);
      const changed = nextState !== track.state || nextLine !== track.line;
      if (changed) {
        const fresh = nextState === "ready" || (isLive(nextState) && isEnd(track.state));
        const resumed = track.state === "waiting" && nextLine === track.line;
        const at = isLive(nextState) ? nextState : nextState === "waiting" ? "tool" : nextState === "ready" ? null : track.at;
        const seen = fresh ? [] : track.seen;
        const call = (nextState === "tool" || nextState === "waiting") && !resumed && (nextLine !== track.line || (track.state !== "tool" && track.state !== "waiting"));
        track.tools = (fresh ? 0 : track.tools) + (call ? 1 : 0);
        track.seen = at && !seen.includes(at) ? [...seen, at] : seen;
        Object.assign(track, { at, state: nextState, line: nextLine, said: track.said + 1 });
      }
      const stateChanged = nextState !== state, lineChanged = nextLine !== line;
      const wasWaiting = state === "waiting";
      state = nextState; step = nextStep; line = nextLine;
      if (stateChanged) {
        const from = was;
        was = state;
        if (state === "ready") clock.reset();
        else clock.go(isLive(state), isLive(state) && isEnd(from));
      }
      if (opts && opts.elapsed !== undefined) clock.seek(opts.elapsed);
      render(lineChanged, changed, state === "waiting" && !wasWaiting);
    }

    function setTokens(n) {
      const from = tokens;
      tokens = n;
      tokensEl.textContent = state === "ready" || !tokens ? "" : `${thousands(tokens)} tokens`;
      if (tokens > from) clock.kick(tokens - from);
    }

    function lightOf(phase) {
      if (phase === track.at && state !== "done") return isLive(state) ? "fire" : state === "waiting" ? "hold" : state === "error" ? "fault" : "set";
      return track.seen.includes(phase) && state !== "ready" ? "set" : "off";
    }
    const canStop = () => isLive(state) || state === "waiting";

    function render(lineChanged, changed, allowArrived) {
      root.dataset.state = state;
      taskEl.textContent = task;
      stateEl.textContent = state === "tool" && track.tools > 1 ? `Tool ${track.tools}` : WORDS[state];
      tokensEl.textContent = state === "ready" || !tokens ? "" : `${thousands(tokens)} tokens`;
      verbEl.textContent = step ? step.verb : "Not started yet";
      verbEl.style.color = step ? "" : "var(--muted)";
      targetEl.textContent = step && step.target ? " " + step.target : "";
      caret.hidden = state !== "writing";
      if (lineChanged && line && !reduced && lineEl.animate) {
        lineEl.animate([{ clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)" }], {
          duration: Math.min(480, Math.max(160, line.length * 18)),
          easing: `steps(${Math.min(line.length, 48)})`,
        });
      }
      PHASES.forEach((p, i) => (phaseEls[i].dataset.light = lightOf(p.key)));
      // Only the actions that apply: Stop while it runs; Allow beside it while a call waits; otherwise Run.
      const focused = root.contains(document.activeElement) && document.activeElement;
      const live = isLive(state), waiting = state === "waiting";
      goBtn.hidden = live;
      stopBtn.hidden = !(live || waiting);
      goBtn.textContent = waiting ? "Allow" : state === "error" ? "Try again" : state === "ready" ? "Run" : "Run next task";
      if (waiting) goBtn.setAttribute("aria-describedby", `${id}-line`);
      else goBtn.removeAttribute("aria-describedby");
      if (allowArrived && !reduced) { grow.jump(0.85); grow.set(1); }
      if (focused && focused.hidden) (goBtn.hidden ? stopBtn : goBtn).focus({ preventScroll: true });
      if (changed && track.said > 1) {
        const said = sayFor(state, line);
        if (state === "error") { statusEl.textContent = ""; alertEl.textContent = said; }
        else { alertEl.textContent = ""; statusEl.textContent = said; }
      }
    }

    /* --- The agent: works through its cues; a call that needs your OK waits there. --- */
    let agentTimer = 0, rest = [], run = 0, ghost = false, ghostTimer = 0, first = true, tokenTimer = 0;
    const later = (ms, fn) => setTimeout(() => { if (!signal.aborted) fn(); }, ms);
    function perform(cues) {
      clearTimeout(agentTimer);
      const [next, ...more] = cues;
      if (!next) return;
      const go = () => {
        if (next.ghost) { if (ghost) press("stop"); else perform(more); return; }
        change(next.state, { verb: next.verb, target: next.target });
        if (next.state === "waiting") rest = more;
        else perform(more);
      };
      if (next.wait) agentTimer = later(next.wait, go);
      else go();
    }
    function start(cues) { setTokens(0); perform(cues); }
    function onRun() {
      if (state === "error") return start(RUNS[run].retry || RUNS[run].cues);
      if (state === "ready") return start(RUNS[run].cues);
      run = (run + 1) % RUNS.length;
      task = RUNS[run].task;
      start(RUNS[run].cues);
    }
    function onStop() { clearTimeout(agentTimer); change("stopped", step); }
    function cueUp() {
      run = (run + 1) % RUNS.length;
      task = RUNS[run].task;
      tokens = 0;
      change("ready", null);
    }
    function change(nextState, nextStep, opts) {
      setStatus(nextState, nextStep, opts);
      clearInterval(tokenTimer);
      if (state === "thinking" || state === "writing") {
        const s = state;
        tokenTimer = setInterval(() => { if (!signal.aborted) setTokens(tokens + chunk(s)); }, 90);
      }
      scheduleGhost();
    }
    function scheduleGhost() {
      clearTimeout(ghostTimer);
      if (!ghost || GHOST[state] === undefined) return;
      const wait = state === "ready" && first ? FIRST_PRESS : GHOST[state];
      first = false;
      ghostTimer = later(wait, () => {
        if (!ghost) return;
        if (state === "ready" || state === "error") press("run");
        else if (state === "waiting") press("allow");
        else if (state === "done" || state === "stopped") cueUp();
      });
    }

    /* --- Keys. --- */
    function act(key) {
      if (key === "stop" && canStop()) onStop();
      else if (key === "run" && !canStop()) onRun();
      else if (key === "allow" && state === "waiting") perform(rest);
    }
    function press(key) {
      const btn = key === "stop" ? stopBtn : goBtn;
      btn.setAttribute("data-pressed", "");
      later(140, () => btn.removeAttribute("data-pressed"));
      act(key);
    }
    goBtn.addEventListener("click", () => act(state === "waiting" ? "allow" : "run"), { signal });
    stopBtn.addEventListener("click", () => act("stop"), { signal });
    root.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || !canStop()) return;
      e.preventDefault();
      e.stopPropagation(); // a run to stop takes Escape; with nothing to stop, the host gets it back
      if (!e.repeat) act("stop");
    }, { signal });

    /* A hand takes over from the ghost for good; the run in flight finishes, or waits for the hand. */
    ctx.onHand(() => { ghost = false; clearTimeout(ghostTimer); });

    render(false, false, false);
    draw(performance.now());
    if (reduced) {
      // One still frame: a call waiting on you, for the hand to answer.
      const cues = RUNS[0].cues;
      const at = cues.findIndex((c) => c.state === "waiting");
      rest = cues.slice(at + 1);
      track.seen = ["thinking", "tool"];
      tokens = 412;
      change("waiting", { verb: cues[at].verb, target: cues[at].target }, { elapsed: 4.4 });
      track.tools = 3;
      render(false, false, false);
    } else {
      ghost = true;
      scheduleGhost();
    }

    return {
      destroy() {
        ghost = false;
        grow.stop();
        clearTimeout(agentTimer);
        clearTimeout(ghostTimer);
        clearInterval(tokenTimer);
      },
    };
  }

  FlatPlayer.register({
    slug: "agent-status",
    title: "Agent Status",
    tagline: "An agent's run: what it's doing, and how long.",
    css,
    mount,
  });
})();

</script>
<script>
/* command-menu.js */
/* Command Menu, redesigned in Flat. A white search pill on the grey ground ("Search or jump to…  ⌘K"). Focus it and
   it grows into a floating white palette (it floats, so it casts) on Flat's expressive spring; the chosen row is a
   grey bubble that glides on a snappy spring (520/40) and keeps its velocity when you keep pressing. Run something
   and the palette folds back into the pill, with what happened said in words under it.
   The matching is the original's: each word of the query has to appear in order in a label, and a dynamic program
   scores the best way it fits (label starts, word starts and runs score; every letter skipped costs one). 2,416
   posts, places and actions rank in well under a millisecond, and only the rows in view are drawn. */
FlatPlayer.register({
  slug: "command-menu",
  title: "Command Menu",
  tagline: "Search or jump to anything on your site.",
  css: `
.fs-command-menu .cm { --fs: 15px; --rows: 6; --row: 2.6em; --field: 3.2em; --foot: 2.6em; position: relative; width: min(100%, 520px);
  font-size: var(--fs); -webkit-user-select: none; user-select: none;
  height: calc(var(--field) + var(--rows) * var(--row) + var(--foot) + 0.8em + 2.2em) }
.fs-command-menu.is-tile .cm { --fs: 13px; --rows: 4; width: 100% }
@container (max-width: 420px) { .fs-command-menu:not(.is-tile) .cm { --fs: 14px } }
.fs-command-menu .cm-shade, .fs-command-menu .cm-card { position: absolute; left: 0; right: 0; top: 0; border-radius: 24px }
.fs-command-menu .cm-shade { box-shadow: var(--float); opacity: 0; pointer-events: none }
.fs-command-menu .cm-card { background: var(--paper); overflow: hidden; height: var(--field) }
.fs-command-menu .cm-field { display: flex; align-items: center; gap: 0.65em; height: var(--field); padding: 0 0.7em 0 1.1em; cursor: text; color: var(--muted) }
.fs-command-menu .cm-field > svg { width: 1.1em; height: 1.1em; flex: none; fill: none; stroke: currentColor; stroke-linecap: round; stroke-width: 1.6 }
.fs-command-menu .cm-in { position: relative; flex: 1; min-width: 0; display: flex; align-items: center }
.fs-command-menu input { width: 100%; min-width: 0; border: 0; padding: 0; background: transparent; color: var(--ink); font: 400 1.05em/1.4 var(--font);
  letter-spacing: -0.01em; outline: none !important }
.fs-command-menu input::placeholder { color: var(--muted) }
.fs-command-menu .cm.is-open input::placeholder { color: var(--disabled) }
.fs-command-menu .cm-ghost { position: absolute; inset: 0 auto 0 0; display: none; align-items: center; pointer-events: none; font-size: 1.05em; letter-spacing: -0.01em }
.fs-command-menu .cm.is-ghost.is-open input:not(:focus) + .cm-ghost { display: flex }
.fs-command-menu .cm-ghost span { visibility: hidden; white-space: pre }
.fs-command-menu .cm-ghost i { margin-left: 1px; width: 2px; height: 1.15em; border-radius: 1px; background: var(--ink); animation: fs-cm-caret 1s steps(1) infinite }
@keyframes fs-cm-caret { 50% { opacity: 0 } }
.fs-command-menu .cm-k { flex: none; height: 1.9em; padding: 0 0.7em; border-radius: var(--r-pill); background: var(--bubble); color: var(--muted);
  display: grid; place-items: center; font: 500 0.8em/1 var(--font); transition: opacity 150ms }
.fs-command-menu .cm.is-open .cm-k { opacity: 0 }
.fs-command-menu .cm-drop { opacity: 0; padding: 0 0.4em }
.fs-command-menu .cm-list { position: relative; height: calc(var(--rows) * var(--row)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; outline: none }
.fs-command-menu .cm-list::-webkit-scrollbar { display: none }
.fs-command-menu .cm-body { position: relative }
.fs-command-menu .cm-hl { position: absolute; left: 0; right: 0; height: var(--row); top: calc(var(--bar, 0) * var(--row)); border-radius: var(--r-pill);
  background: var(--bubble); pointer-events: none }
.fs-command-menu .cm-hl.is-empty { display: none }
.fs-command-menu .cm-hl.is-flash { background: color-mix(in oklab, var(--bubble), var(--ink) 10%) }
.fs-command-menu .cm-row, .fs-command-menu .cm-head { position: absolute; left: 0; right: 0; height: var(--row); display: flex; align-items: center; gap: 0.7em;

      if (key === "escape") {
        // Escape clears the query, then folds the palette; on a folded pill it is left for the page.
        if (query) { e.preventDefault(); e.stopPropagation(); setQuery(""); }
        else if (isOpen) { e.preventDefault(); e.stopPropagation(); setOpen(false); }
        return;
      }
      e.preventDefault();
      if (key === "enter" && e.repeat) return;
      press(key);
    }, opt);
    if (!ctx.tile) window.addEventListener("keydown", (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.altKey || e.shiftKey || e.key.toLowerCase() !== "k") return;
      e.preventDefault(); input.focus(); input.select(); said.textContent = ""; setOpen(true);
    }, opt);
    /* A press anywhere else on the screen folds it away. */
    host.addEventListener("pointerdown", (e) => { if (!card.contains(e.target) && isOpen) { input.blur(); setOpen(false); } }, opt);
    list.addEventListener("mousedown", (e) => e.preventDefault(), opt);
    drop.addEventListener("mousedown", (e) => e.preventDefault(), opt);
    const pointer = { x: -1, y: -1 };
    list.addEventListener("pointermove", (e) => {
      if (e.pointerType !== "mouse") return;
      const row = e.target.closest("[data-opt]");
      if (!row) return;
      takeOver();
      if (e.clientX === pointer.x && e.clientY === pointer.y) return; // rows scrolling under a resting pointer don't steal it
      pointer.x = e.clientX; pointer.y = e.clientY;
      const i = +row.dataset.opt;
      if (i !== current()) moveTo(i, "pointer");
    }, opt);
    list.addEventListener("click", (e) => {
      const row = e.target.closest("[data-opt]");
      if (!row) return;
      const i = +row.dataset.opt;
      if (i !== current()) moveTo(i, "pointer");
      run(i);
    }, opt);
    list.addEventListener("scroll", () => {
      if (!rowPx) return;
      const first = Math.floor(list.scrollTop / rowPx);
      const start = Math.max(0, Math.floor((first - OVERSCAN) / CHUNK) * CHUNK);
      if (start !== view.start) { view.start = start; draw(); }
    }, opt);

    const ro = new ResizeObserver(() => {
      rowPx = parseFloat(getComputedStyle(list).fontSize) * 2.6;
      const fit = Math.max(1, Math.round(list.clientHeight / rowPx));
      if (fit !== view.rows) { view.rows = fit; view.span = fit + 2 * OVERSCAN + CHUNK; draw(); }
      measure(); paintOpen(isOpen ? 1 : 0);
    });
    ro.observe(root);

    setQuery("");
    measure(); paintOpen(0);

    /* --- The self-run: someone opens it, types, moves, opens a thing; the palette folds back; again. -------- */
    const ROUNDS = [
      { query: "new let", keys: ["down", "up", "enter"] },
      { query: "dra", keys: ["enter"] },
      { query: "garden", keys: ["down", "down", "enter"] },
      { query: "", keys: ["down", "down", "down", "enter"] },
    ];
    const LETTER = 150, KEY = 520, BEAT = 1300;
    let live = false, timer = 0, ghostWords = false;
    function takeOver() {
      if (!live) return;
      live = false; clearTimeout(timer); root.classList.remove("is-ghost"); ghostWords = !!query;
    }
    if (!ctx.reduced()) {
      live = true; root.classList.add("is-ghost");
      let round = 0, steps = [];
      const plan = () => {
        const { query: q, keys } = ROUNDS[round++ % ROUNDS.length];
        const out = [[round === 1 ? 500 : 300, () => { said.textContent = ""; setQuery(""); setOpen(true); }]];
        for (let i = 1; i <= q.length; i++) out.push([i === 1 ? 520 : LETTER * (0.7 + Math.random() * 0.6), () => setQuery(q.slice(0, i))]);
        keys.forEach((k, i) => out.push([i === 0 ? 900 : k === "enter" ? 700 : KEY, () => press(k)]));
        out.push([BEAT, () => {}]);
        return out;
      };
      const next = () => {
        if (!steps.length) steps = plan();
        const [wait, act] = steps.shift();
        timer = ctx.after(wait, () => { if (!live) return; act(); next(); });
      };
      next();
    }
    ctx.onHand(takeOver);

    return { destroy() { live = false; clearTimeout(timer); clearTimeout(announceTimer); bar.stop(); openS.stop(); shutS.stop(); ro.disconnect(); } };
  },
});

<script>
/* copy-button.js */
/* Copy Button, after litterthanlit/components (copy-button.tsx), redesigned in Flat.
 * The install command in a white pill on the ground, with the ink circle that copies it at its end. A press comes up
 * with a check that draws itself, and the line swaps in Flat's way: the command leaves upward with no bounce, and
 * "Copied to clipboard" rises into its place on the expressive spring. After a beat they swap back the same way, the
 * command arriving with the bounce. One thing moves at a time. Untouched, the key rehearses once (nothing is copied).
 * Under reduced motion the line swaps at once. */
(function () {
  const HOLD = 1800; // ms the check stays before the command comes back
  const COMMAND = "npx shadcn add copy-button";

  const css = `
.fs-copy-button .cb { position: relative; width: min(100%, 440px); height: 60px; display: flex; align-items: center; gap: 12px;
  padding: 0 8px 0 24px; border-radius: var(--r-pill); background: var(--paper); -webkit-user-select: none; user-select: none; }
.fs-copy-button .cb-line { position: relative; flex: 1; min-width: 0; height: 100%; display: grid; align-items: center; font-size: 15px;
  white-space: nowrap; overflow: hidden; }
.fs-copy-button .cb-layer { grid-area: 1 / 1; display: flex; align-items: center; gap: 0.6em; min-width: 0; will-change: transform, opacity; }
.fs-copy-button .cb-cmd { font-family: var(--mono); }
.fs-copy-button .cb-done { font-weight: 500; color: var(--ink); opacity: 0; }
.fs-copy-button .cb-prompt { color: var(--muted); }
.fs-copy-button code { font: inherit; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.fs-copy-button .cb-key { position: relative; flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; padding: 0;
  background: var(--ink); color: var(--on-ink); cursor: pointer; display: grid; place-items: center;
  transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1); -webkit-tap-highlight-color: transparent; }
.fs-copy-button .cb-key:active, .fs-copy-button .cb-key[data-pressed] { transform: scale(0.9); transition-duration: 75ms; }
.fs-copy-button .cb-key svg { position: absolute; inset: 0; margin: auto; width: 18px; height: 18px; fill: none; stroke: currentColor;
  transition: opacity 210ms cubic-bezier(0.23, 1, 0.32, 1), transform 210ms cubic-bezier(0.23, 1, 0.32, 1); }
.fs-copy-button .cb-key svg.is-off { opacity: 0; transform: scale(0.8); }
.fs-copy-button .cb-tick path { transition: stroke-dashoffset 350ms cubic-bezier(0.23, 1, 0.32, 1) 60ms; }
@container (max-width: 380px) {
  .fs-copy-button .cb { height: 52px; padding-left: 18px; gap: 8px; }
  .fs-copy-button .cb-line { font-size: clamp(11px, 3.6cqw, 13px); }
  .fs-copy-button .cb-key { width: 40px; height: 40px; }
  }
@container (min-width: 600px) {
  .fs-copy-button .cb { height: 64px; }
  .fs-copy-button .cb-line { font-size: 16px; }
  .fs-copy-button .cb-key { width: 48px; height: 48px; }
  }
@media (prefers-reduced-motion: reduce) { .fs-copy-button .cb-key svg, .fs-copy-button .cb-tick path { transition: none; } }
`;

  function mount(host, ctx) {
    const { signal } = ctx;
    host.innerHTML = `
      <div class="cb">
        <div class="cb-line"><span class="cb-layer cb-cmd"><span class="cb-prompt" aria-hidden="true">$</span><code></code></span><span class="cb-layer cb-done" aria-hidden="true">Copied to clipboard</span></div>
        <button type="button" class="cb-key" aria-label="Copy command">
          <svg class="cb-copy" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="5.5" y="5.5" width="8" height="8" rx="2" stroke-width="1.5"/>
            <path d="M10.5 3.5v-.25A1.75 1.75 0 0 0 8.75 1.5h-5.5A1.75 1.75 0 0 0 1.5 3.25v5.5c0 .97.78 1.75 1.75 1.75h.25" stroke-width="1.5"/>
          </svg>
          <svg class="cb-tick is-off" viewBox="0 0 16 16" aria-hidden="true">
            <path d="m3 8.5 3.2 3L13 4.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
          </svg>
        </button>
        <span class="sr-only" role="status" aria-live="polite"></span>
      </div>`;
    const key = host.querySelector(".cb-key");
    const copyIcon = host.querySelector(".cb-copy");
    const tickIcon = host.querySelector(".cb-tick");
    const tickPath = tickIcon.querySelector("path");
    const status = host.querySelector("[role=status]");
    host.querySelector("code").textContent = COMMAND;

    /* The swap: each layer has a shown value (0 gone, 1 here). Arriving rides the expressive spring (0.28); leaving is
       critically damped and quicker, so an exit never bounces. A second press mid-swap turns it round from where it is. */
    const cmd = host.querySelector(".cb-cmd"), done = host.querySelector(".cb-done");
    const paint = (el, dir) => (v) => {
      el.style.opacity = String(Math.max(0, Math.min(1, v)));
      el.style.transform = `translateY(${((1 - v) * 14 * dir).toFixed(2)}px)`;
    };
    const layers = [
      { el: cmd, v: 1, s: null },
      { el: done, v: 0, s: null },
    ];
    function show(layer, on, dir) {
      if (layer.s) layer.s.stop();
      const draw = paint(layer.el, dir);
      layer.s = ctx.spring(layer.v, (v) => { layer.v = v; draw(v); }, on ? { duration: 0.35, bounce: 0.28 } : { duration: 0.2, bounce: 0 });
      layer.s.set(on ? 1 : 0);
    }
    function swap(copied) {
      // the command goes up and out; "Copied" comes up from below. Coming back, it's the other way round.
      show(layers[0], !copied, copied ? -1 : 1);
      show(layers[1], copied, copied ? 1 : -1);
    }

    /* --- The key. --- */
    let timer = 0;
    function setCopied(on) {
      copyIcon.classList.toggle("is-off", on);
      tickIcon.classList.toggle("is-off", !on);
      tickPath.setAttribute("stroke-dashoffset", on ? "0" : "1");
      key.setAttribute("aria-label", on ? "Copied" : "Copy command");
      swap(on);
    }
    function check(real) {
      setCopied(true);
      status.textContent = real ? "Copied" : ""; // a rehearsal copies nothing, so it says nothing
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (signal.aborted) return;
        setCopied(false);
        status.textContent = "";
      }, HOLD);
    }
    async function copy() {
      let ok = false;
      try {
        await navigator.clipboard.writeText(COMMAND);
        ok = true;
      } catch (e) {
        // No async clipboard here (a file, an old browser): the old way.
        const ta = document.createElement("textarea");
        ta.value = COMMAND;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
        host.appendChild(ta);
        ta.select();
        try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
        ta.remove();
        key.focus({ preventScroll: true });
      }
      if (ok && !signal.aborted) {
        status.textContent = "";
        check(true);
      }
    }
    key.addEventListener("click", copy, { signal });

    /* --- Rehearsal: after a beat the key goes down for 110ms and comes up checked. Once; a hand ends it. --- */
    let touched = false;
    ctx.onHand(() => { touched = true; key.removeAttribute("data-pressed"); });
    if (!ctx.reduced()) {
      ctx.after(400, () => { if (!touched) key.setAttribute("data-pressed", ""); });
      ctx.after(510, () => {
        key.removeAttribute("data-pressed");
        if (!touched) check(false);
      });
    }

    return { destroy() { clearTimeout(timer); layers.forEach((l) => l.s && l.s.stop()); } };
  }

  FlatPlayer.register({
    slug: "copy-button",
    title: "Copy Button",
    tagline: "Copy, and the line says so.",
    css,
    mount,
  });
})();

</script>
<script>
/* dither-card.js */
/* Dither Card, after litterthanlit/components, redesigned in Flat: a row of project cards on the ground, each a white
   paper with its picture, a creature in three-tone ordered dither drawn in the ink (the art is the content). The card
   under the hand springs up and its picture quickens; a press sends a ring through it; the project's line is said once

(function () {
  const S = ".fs-dither-card";

#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else

#endif

float bayer2(vec2 a) { a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }

float ellipse(vec2 p, vec2 c, vec2 r) { return length((p - c) / r) - 1.0; }
mat2 rot(float a) { float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }
float wing(vec2 q, vec2 c, vec2 r, float tilt, vec2 eye) {

  float veins = contour(atan(q.y, q.x) * 0.9, 3.0, 24.0) * 0.25; float rim = smoothstep(-0.28, -0.16, d);

  float r = uRes.y * 0.42; float d = distance(px, uMouse); float light = exp(-(d * d) / (r * r)) * uHover;

  if (uRipple.z >= 0.0) { float rad = uRipple.z * uRes.y * 1.4; float rd = abs(distance(px, uRipple.xy) - rad); ring = smoothstep(uRes.y * 0.03, 0.0, rd) * exp(-uRipple.z * 2.2); }

  float scaled = level * 2.0; float tone = min(2.0, floor(scaled) + step(threshold, fract(scaled)));

  const PROJECTS = [
    { title: "Wavr", line: "Shader code in, motion graphics out.", year: "2026", pattern: "butterfly" },
    { title: "Carson", line: "Learn a layout by wrecking one.", year: "2026", pattern: "jellyfish" },
    { title: "litt.works", line: "Prints and long-form pieces.", year: "2024–26", pattern: "bloom" },
  ];

    const d = swatch.getImageData(0, 0, 1, 1).data;

    const canvas = document.createElement("canvas");
    holder.appendChild(canvas);
    const gl = canvas.getContext("webgl", { antialias: false, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true });
    const state = { time: START[pattern], hover: 0, hoverTarget: 0, active: false, mouse: [0, 0], ripple: [0, 0, -1] };
    if (!gl) return { state, draw() {}, resize() {}, ink() {}, centre: () => [0, 0], toLocal: () => [0, 0], dispose() {} };
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const program = gl.createProgram();
    gl.attachShader(program, sh(gl.VERTEX_SHADER, VERTEX)); gl.attachShader(program, sh(gl.FRAGMENT_SHADER, FRAGMENT));

    const centre = () => [canvas.width / 2, canvas.height / 2];

      state, centre,
      ink() { gl.uniform3fv(U.ink, readInk(canvas)); },

    };
    gl.uniform1f(U.pattern, PATTERNS[pattern]);
    f.ink(); f.resize(); f.draw();
    return f;
  }

  let uid = 0;
  FlatPlayer.register({
    slug: "dither-card",
    title: "Dither Card",

/* Fader, after litterthanlit/components, redesigned for Flat (round 2).

   level (at the bottom stop it is a circle), each level a figure above it, a word under the name for who has it

   carries values set from outside, the hand's land at once, a held slider lets go of its motor, 0 dB catches the
   hand within 1.2% and lets go 3.5% clear, a double press sends it home, Shift drags finely. */

          const s = ctx.spring(12, (y) => { draftEl.style.transform = "translateY(" + y.toFixed(2) + "px)"; draftEl.style.opacity = String(Math.max(0, 1 - y / 12)); }, { bounce: 0.28 });
          s.set(0);
        }
      }
      showDraft(false);

      /* The fill: grows while held, runs back when let go, stays full a moment once the action has run. */
      let p = 0, holding = false, ghost = false, litUntil = 0, loop = null;
      const draw = () => btn.style.setProperty("--p", p.toFixed(4));
      function frame(dt, now) {
        if (holding) {
          p = Math.min(1, p + (dt * 1000) / DURATION);
          if (p >= 1) { holding = false; litUntil = now + HOLD_LIT; btn.removeAttribute("data-pressed"); if (!ghost) confirm(); }
        } else if (now >= litUntil) p = Math.max(0, p - (dt * 1000) / REWIND);
        draw();
        if (holding || p > 0) return true;
        loop = null; return false;
      }
      const run = () => { if (!loop) loop = ctx.loop(frame); };
      function press(rehearsal) {
        if (deleted || holding || performance.now() < litUntil) return;
        ghost = !!rehearsal; holding = true; btn.setAttribute("data-pressed", ""); run();
      }
      function release() { if (!holding) return; holding = false; btn.removeAttribute("data-pressed"); run(); }
      function confirm() {
        deleted = true;
        ctx.after(HOLD_LIT, () => { p = 0; draw(); showDraft(false); if (host.contains(document.activeElement) || document.activeElement === document.body) undo.focus({ preventScroll: true }); });
        live.textContent = DRAFTS[which].title + " deleted. Undo is available.";
        nextTimer = ctx.after(HOLD_LIT + 3200, () => { deleted = false; which = (which + 1) % DRAFTS.length; showDraft(true); live.textContent = ""; });
      }
      undo.addEventListener("click", () => {
        clearTimeout(nextTimer); deleted = false; showDraft(true); live.textContent = DRAFTS[which].title + " restored";
        btn.focus({ preventScroll: true });
      }, sig);

      btn.addEventListener("pointerdown", (e) => { if (e.button === 0) press(false); }, sig);
      for (const t of ["pointerup", "pointerleave", "pointercancel"]) btn.addEventListener(t, release, sig);
      btn.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); press(false); } }, sig);
      btn.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") release(); }, sig);
      btn.addEventListener("contextmenu", (e) => e.preventDefault(), sig);
      btn.addEventListener("click", (e) => e.preventDefault(), sig);

      /* Rehearsal: press after a beat, fill about six tenths, let go; again every few seconds until a hand arrives. */
      let handed = false;
      ctx.onHand(() => { handed = true; if (ghost && holding) release(); });
      if (!ctx.reduced()) {
        const rehearse = () => { if (handed || deleted) return; press(true); ctx.after(DURATION * 0.6, () => { if (!handed && ghost) release(); }); };
        ctx.after(500, rehearse);
        ctx.every(3200, rehearse);
      }
    },
  });
})();

</script>
<script>
/* knob.js */
/* Knob, redesigned for Flat: scene recall without the desk. A preset picker (Voice or Music) over three pill sliders.
   Picking a preset glides each slider to it on a spring (the original's motor: stiffness 170, damping 22), one after
   another; a hand on a slider takes it at once and the preset reads Edited. Values keep their detents, Tone keeps its log
   taper and Gain fills out from the centre, because it cuts and boosts. */
(function () {
  const STAGGER = 120;
  const GENTLE = { duration: (2 * Math.PI) / Math.sqrt(170), bounce: 1 - 22 / (2 * Math.sqrt(170)) };
  const indexOf = (v, { min, max, detents, taper }) => {
    const f = taper === "log" ? Math.log(v / min) / Math.log(max / min) : (v - min) / (max - min);
    return Math.round(Math.min(1, Math.max(0, f)) * detents);
  };
  const valueAt = (i, { min, max, detents, taper }) => {
    const v = taper === "log" ? min * Math.pow(max / min, i / detents) : min + ((max - min) * i) / detents;
    return Math.round(v * 100) / 100;
  };
  const PARAMS = [
    { key: "gain", label: "Gain", min: -12, max: 12, detents: 24, bipolar: true, format: (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(Math.round(v)) + " dB" },
    { key: "tone", label: "Tone", min: 200, max: 8000, detents: 24, taper: "log", format: (v) => (v >= 1000 ? (v / 1000).toFixed(1) + " kHz" : Math.round(v) + " Hz") },
    { key: "mix", label: "Mix", min: 0, max: 100, detents: 20, format: (v) => Math.round(v) + "%" },
  ];
  const PRESETS = { voice: { name: "Voice", at: { gain: 18, tone: 16, mix: 8 } }, music: { name: "Music", at: { gain: 9, tone: 8, mix: 15 } } };
  const STATUS = { moving: "Moving", loaded: "Loaded", edited: "Edited" };
  let n = 0;

  FlatPlayer.register({
    slug: "knob",
    title: "Knob",
    tagline: "Presets that glide into place.",
    css: `
.fs-knob .kp { width: min(24em, 100%); font-size: clamp(13px, calc(2.2cqw + 6px), 16px); background: var(--paper); border-radius: var(--r-paper);
  padding: 1.25em; display: grid; gap: 1.1em; -webkit-user-select: none; user-select: none }
.fs-knob .is-tile .kp, .fs-knob.is-tile .kp { gap: 0.8em; padding: 1em 1.1em }
.fs-knob .kp-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75em }
.fs-knob .kp-seg { position: relative; display: inline-flex; padding: 0.25em; border-radius: var(--r-pill); background: var(--bubble) }
.fs-knob .kp-ind { position: absolute; top: 0.25em; bottom: 0.25em; left: 0; border-radius: var(--r-pill); background: var(--paper) }
.fs-knob .kp-ind[hidden] { display: none }
.fs-knob .kp-opt { position: relative; height: 2.2em; padding: 0 1.1em; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--muted);
  font-weight: 500; cursor: pointer; transition: color var(--dur-instant) }
.fs-knob .kp-opt[aria-checked="true"] { color: var(--ink) }
.fs-knob .kp-status { font-size: 0.87em; color: var(--muted); white-space: nowrap }
.fs-knob .kp-rows { display: grid; gap: 0.75em }
.fs-knob .kp-row { display: grid; gap: 0.35em }
.fs-knob .kp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5em }
.fs-knob .kp-head span { color: var(--muted); font-size: 0.93em }
.fs-knob .kp-head b { font-weight: 600; font-variant-numeric: tabular-nums }
.fs-knob .kp-track { --r: 0.875em; position: relative; height: calc(var(--r) * 2); border-radius: var(--r-pill); background: var(--bubble); cursor: pointer; touch-action: none }
.fs-knob .kp-fill { position: absolute; top: 0; bottom: 0; border-radius: var(--r-pill); background: var(--ink) }
.fs-knob .kp-thumb { position: absolute; top: 0.25em; width: calc(var(--r) * 2 - 0.5em); height: calc(var(--r) * 2 - 0.5em); margin-left: calc(-1 * (var(--r) - 0.25em));
  border-radius: 50%; background: var(--paper); transition: transform 100ms }
.fs-knob .kp-track:active .kp-thumb { transform: scale(0.85) }
`,
    mount(host, ctx) {
      const id = "kp" + ++n;
      host.innerHTML = `
<div class="kp">
  <div class="kp-top">
    <div class="kp-seg" role="radiogroup" aria-label="Preset"><span class="kp-ind" aria-hidden="true"></span>
      <button class="kp-opt" type="button" role="radio" data-p="voice">Voice</button><button class="kp-opt" type="button" role="radio" data-p="music">Music</button></div>
    <span class="kp-status" aria-hidden="true"></span>
  </div>
  <div class="kp-rows"></div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;
      const sig = { signal: ctx.signal };
      const seg = host.querySelector(".kp-seg"), ind = host.querySelector(".kp-ind"), opts = [...host.querySelectorAll(".kp-opt")];
      const statusEl = host.querySelector(".kp-status"), rows = host.querySelector(".kp-rows"), live = host.querySelector("[aria-live]");
      const values = Object.fromEntries(PARAMS.map((p) => [p.key, valueAt(0, p)]));
      let preset = "voice", status = "moving";
      const travelling = new Set();
      let timers = [];

      /* The segmented pill: a white pill rides between the options on a spring, and leaves once the preset is edited. */
      let indSpring = null, indW = 0;
      function drawTop(animate) {
        statusEl.textContent = STATUS[status];
        opts.forEach((o) => { const on = o.dataset.p === preset && status !== "edited"; o.setAttribute("aria-checked", String(on)); o.tabIndex = o.dataset.p === preset ? 0 : -1; });
        const on = opts.find((o) => o.dataset.p === preset);

        const x = on.offsetLeft;
        ind.style.width = on.offsetWidth + "px";
        if (!indSpring) indSpring = ctx.spring(x, (v) => (ind.style.transform = "translateX(" + v.toFixed(2) + "px)"), { duration: 0.35, bounce: 0.28 });
        if (animate) indSpring.set(x); else indSpring.jump(x);
      }

      /* One slider: a spring in detents draws the fill, the thumb and the figure. */
      function Slider(p) {
        const row = document.createElement("div");
        row.className = "kp-row";
        row.innerHTML = '<div class="kp-head" aria-hidden="true"><span></span><b></b></div><div class="kp-track" role="slider" tabindex="0"><span class="kp-fill"></span><span class="kp-thumb"></span></div>';
        rows.appendChild(row);
        const track = row.querySelector(".kp-track"), fill = row.querySelector(".kp-fill"), thumb = row.querySelector(".kp-thumb"), fig = row.querySelector("b");
        row.querySelector(".kp-head span").textContent = p.label;
        track.setAttribute("aria-label", p.label); track.setAttribute("aria-valuemin", p.min); track.setAttribute("aria-valuemax", p.max);
        let index = 0, target = 0, moving = false, shown = -1, drag = null;
        const at = (f) => "calc(var(--r) + " + f.toFixed(4) + " * (100% - var(--r) * 2))";
        const spring = ctx.spring(0, (d) => {
          const f = Math.min(1, Math.max(0, d / p.detents));
          thumb.style.left = at(f);
          const a = p.bipolar ? Math.min(f, 0.5) : 0, b = p.bipolar ? Math.max(f, 0.5) : f;
          fill.style.left = "calc(" + at(a) + " - var(--r))";
          fill.style.width = "calc(" + (b - a).toFixed(4) + " * (100% - var(--r) * 2) + var(--r) * 2)";
          const det = Math.round(d);
          if (det !== shown) { shown = det; fig.textContent = p.format(valueAt(Math.min(p.detents, Math.max(0, det)), p)); }
          if (moving && d === target) { moving = false; settled(p.key); }
        }, GENTLE);
        function show(v, byHand) {
