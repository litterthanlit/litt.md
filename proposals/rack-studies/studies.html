<style>
/* Rack (litt-md, taste/litt-principles.md "Rack, the module"; proposals/rack.md): after Ableton Live. A grey body, flat
   panels a step lighter with no edge, every control a square box in a 1px outline, small exact values in tabular
   figures, colour that belongs to what you make (clips, tracks), one yellow lit only inside an on key. Square: 2px
   controls in 6px panels. Values are litt's tokens.css, Rack's block (clip pink added for these studies). */
:root {
  --body: #c8c8c8; --panel: #e2e2e2; --panel-2: #d7d7d7; --panel-3: #cdcdcd; --line: #b5b5b5; --line-strong: #a2a2a2;
  --control: #6c6c6c; --ink: #111111; --muted: #434343; --disabled: #8a8a8a;
  --tray: #b9b9b9; --cut: #f3f3f3; --block: #ededed; --block-hover: #d7d7d7; --slot: #b0b0b0; --slot-fill: #5a5a5a; --cap: #f6f6f6;
  --accent: #ffc933; --accent-hover: #ffd35c; --accent-fg: #111111; --accent-tint: #ebdcb9;
  --success: #00601f; --warning: #824200; --danger: #a60e1d;
  --clip-blue: #0072b0; --clip-blue-text: #005686; --clip-blue-tint: #82d5ff;
  --clip-orange: #b94a00; --clip-orange-text: #913200; --clip-orange-tint: #ffb687;
  --clip-cyan: #007c6d; --clip-cyan-text: #005d52; --clip-cyan-tint: #6de2d0;
  --clip-purple: #8455c6; --clip-purple-text: #643c9b; --clip-purple-tint: #d5baff;
  --clip-green: #227e00; --clip-green-text: #0d6100; --clip-green-tint: #a4dd98;
  --clip-pink: #c0007e; --clip-pink-text: #90005d; --clip-pink-tint: #ffb3dd;
  --edge: 0 0 0 1px rgb(0 0 0 / 0.38); --edge-press: 0 0 0 1px rgb(0 0 0 / 0.7);
  --font: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-control: 2px; --r-panel: 6px;
  /* Motion: on the beat. A thing cuts in by opacity on the instant tier and stops quicker; nothing travels or bounces. */
  --cut-in: 100ms; --cut-out: 75ms; --beat: 60ms; --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --clip-orange: #e06d00; --clip-orange-text: #ff964b; --clip-orange-tint: #562b0d;
  --clip-cyan: #00ab98; --clip-cyan-text: #00d6bf; --clip-cyan-tint: #00433b;
  --clip-purple: #a376e9; --clip-purple-text: #c6a1ff; --clip-purple-tint: #3e2e59;
  --clip-green: #51aa3c; --clip-green-text: #7cd06a; --clip-green-tint: #21411a;
  --clip-pink: #e0379b; --clip-pink-text: #feb9db; --clip-pink-tint: #5a1a3e;
  --edge: 0 0 0 1px rgb(0 0 0 / 0.6); --edge-press: 0 0 0 1px rgb(0 0 0 / 0.85); color-scheme: dark } }
:root[data-theme="dark"] {
  --body: #161616; --panel: #262626; --panel-2: #2d2d2d; --panel-3: #353535; --line: #3a3a3a; --line-strong: #4a4a4a;
  --control: #787878; --ink: #ececec; --muted: #bebebe; --disabled: #5c5c5c;

  --clip-orange: #e06d00; --clip-orange-text: #ff964b; --clip-orange-tint: #562b0d;
  --clip-cyan: #00ab98; --clip-cyan-text: #00d6bf; --clip-cyan-tint: #00433b;
  --clip-purple: #a376e9; --clip-purple-text: #c6a1ff; --clip-purple-tint: #3e2e59;
  --clip-green: #51aa3c; --clip-green-text: #7cd06a; --clip-green-tint: #21411a;
  --clip-pink: #e0379b; --clip-pink-text: #feb9db; --clip-pink-tint: #5a1a3e;
  --edge: 0 0 0 1px rgb(0 0 0 / 0.6); --edge-press: 0 0 0 1px rgb(0 0 0 / 0.85); color-scheme: dark }
@media (prefers-reduced-motion: reduce) { :root { --cut-in: 0ms; --cut-out: 0ms; --beat: 0ms } }

*, *::before, *::after { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--body); color: var(--ink); font: 400 13px/1.45 var(--font); letter-spacing: 0;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)) }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }

/* The gallery: Rack's session. The grey body; each study a panel cell, live at a small size, its name in the strip
   under it; a cell opens the study large in a view that cuts in where it stands. */
.fg { max-width: 1280px; margin: 0 auto; padding: 24px 4px 64px }
.fg-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin: 0 0 20px }
.fg-head h1 { margin: 0; font: 600 20px/1.2 var(--font); letter-spacing: -0.01em }
.fg-head p { margin: 4px 0 0; color: var(--muted); max-width: 60ch }
.fg-pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: var(--r-control);
  background: var(--block); box-shadow: var(--edge); color: var(--ink); font: 500 12px var(--font); cursor: pointer;
  transition: background-color var(--cut-in) var(--ease-out) }
.fg-pill:hover { background: var(--block-hover) }
.fg-pill:active { box-shadow: var(--edge-press) }
.fg-wall { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 8px }
.fg-tile { display: grid; width: 100%; padding: 0; border: 0; background: var(--panel); border-radius: var(--r-panel); text-align: left; cursor: pointer; overflow: hidden }
.fg-stage { position: relative; height: 270px; background: var(--panel); overflow: hidden; display: grid; place-items: center }
.fg-tile:hover .fg-name { background: var(--panel-3) }
.fg-stage > .fp-mount { width: 100%; height: 100%; display: grid; place-items: center; padding: 12px; container-type: inline-size; pointer-events: none }
.fg-name { display: flex; align-items: baseline; gap: 8px; padding: 7px 10px; min-width: 0; background: var(--panel-2); transition: background-color var(--cut-in) var(--ease-out) }
.fg-name b { font-weight: 600; font-size: 12px; white-space: nowrap; flex: none }
.fg-name span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }

/* The open study: a view on the body that cuts in. */
.fg-sheet { position: fixed; inset: 0; z-index: 10; display: none; background: var(--body); overflow: auto; overscroll-behavior: contain }
.fg-sheet.is-open { display: grid; grid-template-rows: auto 1fr auto }
.fg-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 12px; background: var(--panel-2) }
.fg-bar h2 { margin: 0; font: 600 13px/1.2 var(--font); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.fg-bar .fg-close { justify-self: start } .fg-bar .fg-steps { justify-self: end; display: flex; gap: 4px }
.fg-circle { width: 28px; height: 26px; display: grid; place-items: center; border: 0; border-radius: var(--r-control); background: var(--block); box-shadow: var(--edge); color: var(--ink); cursor: pointer }
.fg-circle:hover { background: var(--block-hover) } .fg-circle:active { box-shadow: var(--edge-press) }
.fg-circle svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter }
.fg-open { display: grid; place-items: center; min-height: 0; padding: 20px 12px }
.fg-open > .fp-mount { width: min(100%, 980px); min-height: min(560px, 100%); display: grid; place-items: center; container-type: inline-size }
.fg-about { max-width: 640px; margin: 0 auto; padding: 0 16px 24px; text-align: center; color: var(--muted) }
.fg-about b { display: block; color: var(--ink); font-weight: 500; font-size: 13px }
.fg-foot { margin-top: 32px; color: var(--muted); font-size: 12px }
@media (max-width: 720px) { .fg-stage { height: 250px } }
</style>
</head>
<body>

<script>
/* The contract every study keeps (FlatPlayer.register), and the one spring they share. */
window.FlatPlayer = (function () {
  const studies = [];
  const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  /* A damped spring, stepped at 1/240s. bounce 0 is critically damped; 0.28 is Flat's expressive arrival. */
  function spring(initial, onUpdate, opts) {
    const o = Object.assign({ duration: 0.35, bounce: 0 }, opts);
    const w = (2 * Math.PI) / o.duration, k = w * w, c = 2 * (1 - o.bounce) * w;
    let x = initial, v = 0, target = initial, raf = 0, last = 0;
    const step = (now) => {
      let dt = Math.min(0.064, (now - last) / 1000); last = now;
      while (dt > 0) { const h = Math.min(dt, 1 / 240); v += (-k * (x - target) - c * v) * h; x += v * h; dt -= h; }
      if (Math.abs(x - target) < 0.0005 && Math.abs(v) < 0.0005) { x = target; v = 0; raf = 0; onUpdate(x); return; }
      onUpdate(x); raf = requestAnimationFrame(step);
    };
    return {
      set(t, velocity) { target = t; if (velocity !== undefined) v = velocity;
        if (reduced()) { x = t; v = 0; onUpdate(x); return; }
        if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } },
      jump(t) { x = target = t; v = 0; if (raf) cancelAnimationFrame(raf); raf = 0; onUpdate(x); },
      value: () => x, velocity: () => v, target: () => target,
      stop() { if (raf) cancelAnimationFrame(raf); raf = 0; },
    };
  }
  return { studies, spring, reduced, register(s) {
    studies.push(s);
    if (s.css) { const st = document.createElement("style"); st.dataset.study = s.slug; st.textContent = s.css; document.head.appendChild(st); }
  } };
})();
</script>
<script>
/* agent-indicators.js */
/* Agent Indicators, after litterthanlit/components, redesigned for Rack: an agent's run as a lane of steps in an
   agent console. Each kind of step is a clip in its own colour (think purple, search blue, read cyan, reason
   pink, tool calls orange, write green), its contents a small trace of what it does (lines of thought, results,
   a file, a branching plan, eight tool calls, a diff). The run launches them in turn on a steady tick, four
   ticks each; the playing clip fills in its colour and its trace lights in reading order as it goes, the diff
   written as it plays. The clock reads elapsed seconds; tokens are a level on a meter in the playing step's
   colour, with the original's ballistics (a quick fall, a peak that holds 900ms). A hand launches a step
   itself, quantised to the next tick (it shows queued until then), and the step repeats; Run stops time.
   Nothing travels: clips cut in column by column, a launch is a colour change on the frame. */
(function () {
  const S = ".fs-agent-indicators";
  const BEAT = 0.5, CLIP_BEATS = 4; // a tick is 0.5s; a step runs four ticks
  const PHASES = [
    { key: "think", name: "Think", hue: "purple", line: "Thinking it through" },
    { key: "search", name: "Search", hue: "blue", line: "Searching 12 sources" },
    { key: "read", name: "Read", hue: "cyan", line: "Reading 3 files" },
    { key: "reason", name: "Reason", hue: "pink", line: "Weighing 2 plans" },
    { key: "run", name: "Tools", hue: "orange", line: "Calling 8 tools" },
    { key: "write", name: "Write", hue: "green", line: "Writing the patch" },
  ];
  /* Each clip's trace, as a console draws a step's contents: rows in a 48×20 box (x, y, w, h). Seeded, so tile and open agree. */
  function marks(key) {
    let seed = key.length * 97 + key.charCodeAt(0);
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const out = [];
    const row = (y, x, w, h = 2.2) => out.push([x, y, w, h]);
    if (key === "run") { for (let i = 0; i < 8; i++) row(5, 1 + i * 5.9, 4.4, 10); } // eight tool calls
    else if (key === "search") { for (let i = 0; i < 4; i++) { row(1 + i * 5, 1, 6); row(1 + i * 5, 9, 18 + rnd() * 20); } } // results: a source, a line
    else if (key === "reason") { const ind = [0, 5, 10, 5, 10, 0]; ind.slice(0, 5).forEach((d, i) => row(0.5 + i * 4, 1 + d, 14 + rnd() * 16)); } // a branching plan
    else if (key === "read") { for (let i = 0; i < 5; i++) row(0.5 + i * 4, 1 + (i % 3 === 1 ? 5 : 0), 12 + rnd() * 30, 1.8); } // a file, indented
    else if (key === "write") { for (let i = 0; i < 5; i++) row(0.5 + i * 4, 1 + (i === 2 || i === 3 ? 4 : 0), 14 + rnd() * 28, 1.8); } // the patch, written as it plays
    else { for (let i = 0; i < 4; i++) row(1 + i * 5, 1, 16 + rnd() * 28); } // lines of thought
    return out;
  }
  /* The meter's scale, as the original's: the top end gets the room. */
  const SCALE = [[-60, 0], [-40, 0.2], [-20, 0.4], [-12, 0.6], [-6, 0.8], [0, 1]];
  function toScale(db) {
    if (db <= -60) return 0;
    for (let i = 1; i < SCALE.length; i++) { const [d1, f1] = SCALE[i], [d0, f0] = SCALE[i - 1]; if (db <= d1) return f0 + ((db - d0) / (d1 - d0)) * (f1 - f0); }
    return 1;
  }
  const NS = "http://www.w3.org/2000/svg";

  FlatPlayer.register({
    slug: "agent-indicators",
    title: "Agent Indicators",
    tagline: "An agent's run as a lane of steps: think, search, read, reason, call tools, write.",

${S} .ag-key { height: 20px; min-width: 44px; padding: 0 8px; border: 0; border-radius: var(--r-control); background: var(--block); box-shadow: var(--edge);
  font-size: 11px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px }
${S} .ag-key:hover { background: var(--block-hover) }
${S} .ag-key:active { box-shadow: var(--edge-press); transform: scale(0.98) }

  font: 500 11px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis }

}
`,

    mount(host, ctx) {

      const ruler = [0, 1, 2, 3, 4].map((s) => '<span style="left:' + (s / SPAN) * 100 + '%">' + s + " s</span>").join("");
      host.innerHTML = `
<section class="ar" aria-label="Agent">
  <div class="ar-dev">
    <div class="ar-head">
      <button class="ar-key" type="button" data-k="run" aria-pressed="false"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 0.5 9.5 5l-8 4.5z"/></svg>Run</button>
      <span class="ar-title">Agent</span><span class="ar-box ar-take" aria-hidden="true"></span>

    <button class="ar-key ar-fold" type="button" aria-expanded="true" aria-controls="${id}-steps"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 0.5 8.5 5l-6 4.5z"/></svg><span></span></button>
    <ol class="ar-steps" id="${id}-steps"></ol>

  <p class="sr-only" aria-live="polite"></p>
</section>`;
      const sig = { signal: ctx.signal };
      const root = host.querySelector(".ar"), runKey = host.querySelector('[data-k="run"]'), row = host.querySelector(".ar-row"), fold = host.querySelector(".ar-fold");
      const list = host.querySelector(".ar-steps"), text = host.querySelector(".ar-text"), clockEl = host.querySelector(".ar-clock"), tokEl = host.querySelector(".ar-tok");
      const takeEl = host.querySelector(".ar-take"), live = host.querySelector("[aria-live]");

      let phase = "idle", revealed = 0, finished = 0, streamed = 0, open = true, started = 0, ended = 0, take = 3, tokens = 0, looping = true;

      const at = (ms, fn) => timers.push(ctx.after(ms, fn));
      const busy = () => phase === "thinking" || phase === "working";
      const secs = () => ((ended || performance.now()) - started) / 1000;

      function drawFold() {
        const span = fold.querySelector("span");
        fold.disabled = busy() || phase === "idle";
        fold.setAttribute("aria-expanded", String(open));
        span.textContent = busy() ? (phase === "thinking" ? "Thinking" : STEPS[revealed - 1].verb + " " + STEPS[revealed - 1].target) :

        list.hidden = !open;
      }
      function drawSteps() {
        while (list.children.length < revealed) {
          const s = STEPS[list.children.length], li = document.createElement("li");
          li.className = "ar-step"; li.style.cssText = hueVars(TOOLS[s.verb]);
          li.innerHTML = '<span class="ar-tag"></span><span class="ar-tgt"></span><span class="ar-det"></span>';
          li.querySelector(".ar-tag").textContent = s.verb; li.querySelector(".ar-tgt").textContent = s.target;
          list.appendChild(li);
        }
        [...list.children].forEach((li, i) => {
          const d = li.querySelector(".ar-det");
          if (i < finished) { d.innerHTML = STEPS[i].detail; if (STEPS[i].label) d.setAttribute("aria-label", STEPS[i].label); } else d.textContent = "running";

      function drawHead() {

        tokEl.textContent = (tokens >= 1000 ? (tokens / 1000).toFixed(1) + "k" : Math.round(tokens)) + " tok";
        const s = phase === "idle" ? 0 : secs();
        clockEl.textContent = Math.floor(s / 60) + ":" + (s % 60).toFixed(1).padStart(4, "0");
      }
      function say() {
        const said = busy() ? (phase === "thinking" ? "Thinking" : STEPS[revealed - 1].verb + " " + STEPS[revealed - 1].target) : phase === "done" ? "Answer ready. " + ANSWER : "";
        if (live.textContent !== said) live.textContent = said;
      }
      function draw() { drawFold(); drawSteps(); drawText(); drawHead(); say(); }

      /* A clip cuts in on the lane and grows with the clock until its step ends. */
      function addClip(name, label, hue, from) {
        const el = document.createElement("span");
        el.className = "ar-clip"; el.style.cssText = hueVars(hue) + ";left:" + (from / SPAN) * 100 + "%;width:0";
        el.textContent = label; row.appendChild(el);
        clips.push({ el, from, to: null });
      }
      const closeClip = (t) => { const c = clips[clips.length - 1]; if (c && c.to === null) c.to = t; };
      function drawClips() {
        const t = phase === "idle" ? 0 : Math.min(SPAN, secs());
        clips.forEach((c) => { const end = c.to === null ? t : c.to; c.el.style.width = "calc(" + (Math.max(0, end - c.from) / SPAN) * 100 + "% - 1px)"; });
      }

      function clear() { timers.forEach(clearTimeout); timers = []; if (tick) tick.stop = true; tick = null; }
      function script() {
        clear(); row.textContent = ""; clips = []; list.textContent = "";
        take++; tokens = 0;
        if (ctx.reduced()) {
          phase = "done"; started = performance.now(); ended = started + THINK + STEPS.length * STEP; revealed = finished = STEPS.length; streamed = words.length; open = false;
          let t = 0; addClip("Think", "Think", TOOLS.Think, 0); clips[0].to = THINK / 1000; t = THINK / 1000;
          STEPS.forEach((s) => { addClip(s.verb, s.verb, TOOLS[s.verb], t); t += STEP / 1000; closeClip(t); });
          tokens = 1840; drawClips(); draw(); return;
        }
        phase = "thinking"; started = performance.now(); ended = 0; revealed = finished = streamed = 0; open = true;
        addClip("Think", "Think", TOOLS.Think, 0);
        tick = ctx.loop(() => {
          if (busy()) tokens += 6 + Math.random() * 6;
          drawClips(); drawHead();
          return phase !== "done";
        });
        draw();
        let t = THINK;
        STEPS.forEach((s, i) => {
          at(t, () => { closeClip(secs()); phase = "working"; revealed = i + 1; addClip(s.verb, s.verb + " " + s.target.split("/").pop(), TOOLS[s.verb], secs()); draw(); });
          t += STEP;
          at(t, () => { finished = i + 1; drawSteps(); });
        });
        at(t + 250, () => { closeClip(secs()); ended = performance.now(); phase = "answering"; open = false; draw(); });
        t += 500;
        words.forEach((_, i) => at(t + i * WORD, () => { streamed = i + 1; tokens += 1.3; drawText(); drawHead(); }));
        t += words.length * WORD;
        at(t, () => { phase = "done"; draw(); });
        at(t + LOOP_AFTER, () => { if (looping) script(); });

      fold.addEventListener("click", () => { if (busy()) return; open = !open; drawFold(); }, sig);
      runKey.addEventListener("click", () => { if (busy() || phase === "answering") return; script(); }, sig);
      /* A hand ends the loop: this run plays out and stays; Run starts the next one. */
      ctx.onHand(() => { looping = false; });
      if (ctx.reduced()) script(); else { draw(); drawHead(); ctx.after(200, script); }
      return { destroy: clear };
    },
  });
})();

<script>
/* agent-shapes.js */
/* Agent Shapes, after litterthanlit/components, redesigned in Rack: the shapes become the screens of an agent chain.
   Four agents sit side by side as devices, each in its own colour and each with two ways of working (the original's
   eight shapes). A run passes along the chain on the tick: the device at work lights in its colour, its screen draws
   the shape of what it is doing, its tokens count up, and its trace records when it worked under a shared playhead. A
   device switched off is skipped. Time moves the clock, the traces and the shapes; everything else cuts. */
(function () {
  const offset = (fraction, duration) => `${-(((fraction % 1) + 1) % 1) * duration}ms`;

  /* --- The shapes, as markup. Each takes a size in px. --- */
  const RAYS = 8, STRETCH = 1600;
  function spark(size) {
    let rays = "";
    for (let i = 0; i < RAYS; i++) rays += `<span class="as-ray-arm" style="transform:rotate(${(i * 360) / RAYS}deg)"><span class="as-ray${i % 2 ? " is-odd" : ""}" style="animation-delay:${offset(1 - i / RAYS, STRETCH)}"></span></span>`;
    return `<span class="as-spin">${rays}</span><span class="as-core"></span>`;
  }

  const ELLIPSE = "M3 16a13 5 0 1 0 26 0a13 5 0 1 0 -26 0";
  const ORBITS = [{ angle: 0, duration: 1800 }, { angle: 60, duration: 2400 }, { angle: 120, duration: 3000 }];
  function orbit() {
    return `<svg viewBox="0 0 32 32" fill="none">${ORBITS.map(({ angle, duration }, i) => `<g transform="rotate(${angle} 16 16)">
      <path d="${ELLIPSE}" class="as-track" stroke-width="1"/>
      <path d="${ELLIPSE}" pathLength="1" stroke-dasharray="0.12 0.88" stroke-width="1.75" stroke-linecap="round" class="as-trace ${i === 0 ? "as-hi" : "as-lo"}"
        style="animation-duration:${duration}ms;animation-delay:${offset(i / 3, duration)}"/></g>`).join("")}
      <circle cx="16" cy="16" r="3" class="as-wave as-fill"/></svg>`;
  }

  const NODES = [[6, 7], [18, 4], [28, 12], [23, 26], [9, 27], [4, 17]];
  const CHORDS = [[1, 4], [2, 5]];
  const TRACE = 2400, SIGNAL = 0.16;
  const LOOP = `M${NODES.map(([x, y]) => `${x} ${y}`).join("L")}Z`;
  const NODE_AT = (() => {
    const edges = NODES.map(([x, y], i) => { const [nx, ny] = NODES[(i + 1) % NODES.length]; return Math.hypot(nx - x, ny - y); });
    const total = edges.reduce((s, d) => s + d, 0);
    return NODES.map((_, i) => edges.slice(0, i).reduce((s, d) => s + d, 0) / total);
  })();
  function graph() {
    return `<svg viewBox="0 0 32 32" fill="none"><path d="${LOOP}" class="as-track" stroke-width="1" stroke-linejoin="round"/>
      ${CHORDS.map(([a, b]) => `<line x1="${NODES[a][0]}" y1="${NODES[a][1]}" x2="${NODES[b][0]}" y2="${NODES[b][1]}" class="as-track" stroke-width="1"/>`).join("")}
      <path d="${LOOP}" pathLength="1" stroke-dasharray="${SIGNAL} ${1 - SIGNAL}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="as-trace as-hi" style="animation-duration:${TRACE}ms"/>
      ${NODES.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="2.6" class="as-wave as-fill" style="animation-duration:${TRACE}ms;animation-delay:${offset(0.5 - NODE_AT[i] + SIGNAL, TRACE)}"/>`).join("")}</svg>`;
  }

  const MORPH = 3200;
  function morph() {
    return `<span class="as-morph as-ghost" style="animation-delay:${offset(-0.1, MORPH)}"></span><span class="as-morph as-form"></span>`;
  }

  const CURVE = (() => {
    const steps = 120, pts = [];
    for (let i = 0; i < steps; i++) { const t = (i / steps) * Math.PI * 2; pts.push(`${(16 + 12.5 * Math.cos(3 * t)).toFixed(2)} ${(16 + 10 * Math.sin(2 * t)).toFixed(2)}`); }
    return `M${pts.join("L")}Z`;
  })();
  const THREAD = 3200;
  const STRANDS = [{ length: 0.26, opacity: 0.2 }, { length: 0.14, opacity: 0.5 }, { length: 0.05, opacity: 1 }];
  function thread() {
    const longest = STRANDS[0].length;
    return `<svg viewBox="0 0 32 32" fill="none"><path d="${CURVE}" class="as-track" stroke-width="1"/>
      ${STRANDS.map(({ length, opacity }, i) => `<path d="${CURVE}" pathLength="1" stroke-dasharray="${length} ${1 - length}" stroke-width="1.75" stroke-linecap="round" opacity="${opacity}"
        class="as-trace ${i === STRANDS.length - 1 ? "as-hi" : "as-lo"}" style="animation-duration:${THREAD}ms;animation-delay:${offset(longest - length, THREAD)}"/>`).join("")}</svg>`;
  }

  const ASSEMBLE = 2000;
  const TILES = [{ fx: "-45%", fy: "-45%", turn: 0 }, { fx: "45%", fy: "-45%", turn: 1 }, { fx: "-45%", fy: "45%", turn: 3 }, { fx: "45%", fy: "45%", turn: 2 }];
  function fold() {
    return `<span class="as-fold">${TILES.map(({ fx, fy, turn }, i) => `<span class="as-tile${i === 3 ? " is-hi" : ""}" style="--fx:${fx};--fy:${fy};animation-delay:${offset(-turn / 4, ASSEMBLE)}"></span>`).join("")}</span>`;
  }

  /* Cubes: real CSS 3D, isometric, faces shaded by how much colour they carry, mixed against what is behind them. */
  const ISOMETRIC = "rotateX(-35.26deg) rotateY(45deg)";
  const FACES = [{ turn: "rotateX(90deg)", ink: 100 }, { turn: "rotateY(0deg)", ink: 62 }, { turn: "rotateY(180deg)", ink: 62 }, { turn: "rotateY(90deg)", ink: 38 }, { turn: "rotateY(-90deg)", ink: 38 }];
  const metrics = (size) => { const edge = size * 0.26; return { edge, half: (edge + size * 0.03) / 2 }; };
  const BLOCKS = (half) => [1, -1].flatMap((y) => [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([x, z]) => [x * half, y * half, z * half]));
  function cubelet(at, edge, hi, style = "", faceStyle = "") {
    const color = hi ? "var(--as-hi)" : "var(--as-lo)";
    return `<span class="as-3d" style="transform:translate3d(${at[0]}px,${at[1]}px,${at[2]}px)"><span class="as-3d" style="${style}">${FACES.map(({ turn, ink }) =>
      `<span class="as-face" style="width:${edge}px;height:${edge}px;left:${-edge / 2}px;top:${-edge / 2}px;transform:${turn} translateZ(${edge / 2}px);background:color-mix(in oklab, ${color} ${ink}%, var(--as-bg));${faceStyle}"></span>`).join("")}</span></span>`;
  }
  const scene = (inner, cls = "") => `<span class="as-scene"><span class="as-3d as-iso ${cls}">${inner}</span></span>`;
  function cube(size) {
    const { edge, half } = metrics(size), blocks = BLOCKS(half);
    return scene([blocks.slice(0, 4), blocks.slice(4)].map((layer, i) =>
      `<span class="as-3d as-twist${i === 0 ? " is-rev" : ""}">${layer.map((at, j) => cubelet(at, edge, i === 1 && j === 3)).join("")}</span>`).join(""));
  }
  const DROP_WINDOW = 2 / 9;
  function stack(size) {
    const { edge, half } = metrics(size), lift = edge * 2.2;
    return scene(BLOCKS(half).map((at, i) => {
      const away = `clamp(0, (${(i + 2) / 9} - var(--fs-as-build)) / ${DROP_WINDOW}, 1)`;
      return cubelet(at, edge, i === 7, `transform:translateY(calc(${away} * ${-lift}px))`, `opacity:calc(1 - ${away})`);
    }).join(""), "as-build");
  }

  /* The chain: four agents, each a device in its own colour, each with two ways of working. A run passes along it a
     step at a time; a step is two ticks. */
  const AGENTS = [
    { id: "plan", name: "Planner", hue: "purple", modes: [{ word: "think", line: "Thinking it through", draw: spark }, { word: "plan", line: "Planning the changes", draw: morph }] },
    { id: "research", name: "Researcher", hue: "blue", modes: [{ word: "search", line: "Searching 12 sources", draw: graph }, { word: "organize", line: "Organizing the results", draw: cube }] },
    { id: "code", name: "Coder", hue: "orange", modes: [{ word: "build", line: "Building the project", draw: stack }, { word: "run tools", line: "Running the tests", draw: fold }] },
    { id: "review", name: "Reviewer", hue: "green", modes: [{ word: "reason", line: "Weighing 3 approaches", draw: orbit }, { word: "write", line: "Drafting the answer", draw: thread }] },
  ];
  const STEPS = AGENTS.flatMap((a, ai) => a.modes.map((m, mi) => ({ ai, mi })));
  const TICK = 0.6, PER = 2, TICKS = STEPS.length * PER; // 16 ticks, 9.6 s a run
  const RATE = [38, 22, 61, 30]; // tokens a second while each agent works
  const EASE_IO = "cubic-bezier(0.77, 0, 0.175, 1)";
  const S = ".fs-agent-shapes";
  const fmt = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
  const tok = (n) => (n >= 1000 ? `${(n / 1000).toFixed(1)}k` : `${Math.round(n)}`) + " tok";
  let uid = 0;

  FlatPlayer.register({
    slug: "agent-shapes",
    title: "Agent Shapes",
    tagline: "A chain of agent devices; the one at work lights and draws its shape, and each leaves a trace.",
    css: `
@property --fs-as-build { syntax: "<number>"; inherits: true; initial-value: 1 }
@keyframes fs-as-spin { to { transform: rotate(360deg) } }
@keyframes fs-as-stretch { 0%, 100% { transform: scaleY(0.3); opacity: 0.3 } 50% { transform: scaleY(1); opacity: 1 } }
@keyframes fs-as-trace { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -1 } }
@keyframes fs-as-wave { 0%, 100% { opacity: 0.2; transform: scale(0.7) } 50% { opacity: 1; transform: scale(1) } }
@keyframes fs-as-morph { 0% { border-radius: 50%; transform: rotate(0deg) scale(1) } 25% { border-radius: 28%; transform: rotate(90deg) scale(0.9) }
  50% { border-radius: 6%; transform: rotate(225deg) scale(0.78) } 75% { border-radius: 6% 50%; transform: rotate(315deg) scale(0.92) } 100% { border-radius: 50%; transform: rotate(360deg) scale(1) } }
@keyframes fs-as-assemble { 0%, 25%, 100% { transform: translate(0, 0) scale(1); opacity: 1 } 55%, 65% { transform: translate(var(--fx, 0), var(--fy, 0)) scale(0.6); opacity: 0.35 } }
@keyframes fs-as-twist { 0%, 12.5% { transform: rotateY(0deg) } 25%, 37.5% { transform: rotateY(90deg) } 50%, 62.5% { transform: rotateY(180deg) } 75%, 87.5% { transform: rotateY(270deg) } 100% { transform: rotateY(360deg) } }
@keyframes fs-as-build { 0% { --fs-as-build: 0 } 55%, 82% { --fs-as-build: 1 } 100% { --fs-as-build: 0 } }
${S} .ch { width: min(100%, 330px); padding: 3px; background: var(--body); border-radius: var(--r-panel); display: grid; gap: 3px; user-select: none; -webkit-user-select: none }
${S} .ch-head { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 5px; background: var(--panel-2); border-radius: var(--r-panel) }
${S} .ch-title { font-size: 12px; font-weight: 600 }
${S} .ch-line { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: auto; min-width: 0 }
${S} .ch-clock { font: 600 13px/1 var(--mono); font-variant-numeric: tabular-nums }
${S} .ch-key { all: unset; box-sizing: border-box; width: 22px; height: 20px; display: grid; place-items: center; border-radius: var(--r-control); background: var(--block); box-shadow: var(--edge);
  color: var(--muted); cursor: pointer; flex: none; transition: background-color var(--cut-in) var(--ease-out), color var(--cut-in) var(--ease-out) }
${S} .ch-key svg { width: 8px; height: 8px; fill: currentColor }
${S} .ch-key:hover { background: var(--block-hover) } ${S} .ch-key:active { box-shadow: var(--edge-press); scale: 0.98 }
${S} .ch-key.is-run[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
${S} .ch-key.is-power { width: 16px; height: 16px }

  white-space: nowrap; overflow: hidden; text-overflow: clip; animation: fs-as-cut var(--cut-in) var(--ease-out); }
.fs-agent-status .as-clip.is-failed { box-shadow: inset 0 0 0 1px var(--danger); color: var(--danger); }
.fs-agent-status .as-grid { position: absolute; inset: 0; pointer-events: none; }
.fs-agent-status .as-grid i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.fs-agent-status .as-lanes { grid-column: 2; grid-row: 2 / span 3; position: relative; display: grid; gap: 2px; }
.fs-agent-status .as-playhead { position: absolute; top: -16px; bottom: 0; width: 1px; background: var(--ink); pointer-events: none; z-index: 2; }
.fs-agent-status .as-foot { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 2px 2px; align-items: center; }
.fs-agent-status .as-label { color: var(--muted); font-size: 11px; padding-left: 2px; }
.fs-agent-status .as-now { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 2px; }
.fs-agent-status .as-now span { color: var(--muted); }
.fs-agent-status .as-meter { position: relative; height: 8px; border-radius: var(--r-control); background: var(--slot); overflow: hidden; }
.fs-agent-status .as-meter i { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--hue, var(--slot-fill)); transform-origin: 0 50%;
  transform: scaleX(var(--act, 0)); }
@keyframes fs-as-cut { from { opacity: 0; } }
@container (max-width: 400px) {
  .fs-agent-status .as-clock { font-size: 17px; margin-left: 4px; }
  .fs-agent-status .as-key { padding: 0 7px; min-width: 26px; }

`;

  const PLAY = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1.2v7.6L8.6 5z"/></svg>';
  const STOP = '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7"/></svg>';
  const hue = (el, h) => {
    el.style.setProperty("--hue", `var(--clip-${h})`);
    el.style.setProperty("--tint", `var(--clip-${h}-tint)`);
    el.style.setProperty("--hue-text", `var(--clip-${h}-text)`);
  };

  function mount(host, ctx) {
    const { signal } = ctx;
    const id = "fs-as-" + ++uid;
    host.innerHTML = `
      <div class="as" role="group" aria-label="Agent" data-state="ready">
        <div class="as-strip" aria-hidden="true"><span class="as-title">Agent</span><span class="as-task"></span><span class="as-state"></span></div>
        <div class="as-body">
          <div class="as-transport">
            <button type="button" class="as-key as-play" aria-label="Run" aria-pressed="false">${PLAY}</button>
            <button type="button" class="as-key as-stop" aria-label="Stop" aria-keyshortcuts="Escape" aria-disabled="true">${STOP}</button>
            <button type="button" class="as-key as-allow" aria-disabled="true" aria-describedby="${id}-now">Allow</button>
            <span class="as-clock" aria-hidden="true">0:00.00</span>
            <span class="as-box" aria-hidden="true"><b class="as-tok">0</b><small>tok</small></span>
          </div>
          <div class="as-arr" aria-hidden="true">
            <div style="grid-column:1"></div><div class="as-ruler"></div>
            <div class="as-lanes"><div class="as-playhead"></div></div>
          </div>
          <div class="as-foot" aria-hidden="true">
            <span class="as-label">Now</span><span class="as-now" id="${id}-now"></span>
            <span class="as-label">Rate</span><span class="as-meter"><i></i></span>
          </div>
        </div>
        <div class="sr-only" role="status"></div>
        <p class="sr-only" role="alert"></p>
      </div>`;
    const root = host.querySelector(".as");
    const $ = (s) => root.querySelector(s);
    const taskEl = $(".as-task"), stateEl = $(".as-state"), clockEl = $(".as-clock"), tokEl = $(".as-tok");
    const playBtn = $(".as-play"), stopBtn = $(".as-stop"), allowBtn = $(".as-allow");
    const ruler = $(".as-ruler"), lanesEl = $(".as-lanes"), playhead = $(".as-playhead"), nowEl = $(".as-now"), meter = $(".as-meter");
    const statusEl = $("[role=status]"), alertEl = $("[role=alert]");
    const arr = $(".as-arr");
    const heads = {}, lanes = {};
    TRACKS.forEach((t, i) => {
      const head = document.createElement("div");
      head.className = "as-head";
      head.style.gridColumn = "1";
      head.style.gridRow = String(i + 2);
      head.textContent = t.name;
      hue(head, t.hue);
      arr.insertBefore(head, lanesEl);
      const lane = document.createElement("div");
      lane.className = "as-lane";
      lane.innerHTML = '<div class="as-grid"></div>';
      lanesEl.appendChild(lane);
      heads[t.key] = head;
      lanes[t.key] = lane;
    });

    /* --- Time: the run's clock in live seconds, the view, the playhead and the level, from one loop. --- */
    const reduced = ctx.reduced();
    let banked = 0, since = 0, env = 0, loop = null, viewStart = 0;
    const T = () => banked + (since ? Math.max(0, performance.now() - since) / 1000 : 0);
    const laneW = () => lanes.thinking.clientWidth || 1;
    const pxs = () => laneW() / WINDOW;

    function drawGrid() {
      const scale = pxs();
      ruler.textContent = "";
      Object.values(lanes).forEach((l) => (l.firstChild.textContent = ""));
      for (let s = Math.floor(viewStart); s <= viewStart + WINDOW; s++) {
        const x = (s - viewStart) * scale;
        if (x < 0) continue;
        const sp = document.createElement("span");
        sp.style.left = `${x}px`;
        sp.textContent = `${s}s`;
        ruler.appendChild(sp);
        Object.values(lanes).forEach((l) => { const g = document.createElement("i"); g.style.left = `${x}px`; l.firstChild.appendChild(g); });
      }
    }
    function drawClips(t) {
      const scale = pxs();
      for (const c of clips) {
        const t1 = c.t1 === null ? t : c.t1;
        c.el.style.left = `${(c.t0 - viewStart) * scale}px`;
        c.el.style.width = `${Math.max(3, (t1 - c.t0) * scale)}px`;
      }
    }
    function draw() {
      const t = T();
      // The view pages on when the playhead reaches its edge: it cuts, it never scrolls.
      if (t > viewStart + WINDOW * 0.92) { viewStart = Math.max(0, t - WINDOW * 0.1); drawGrid(); }
      const m = Math.floor(t / 60), s = t % 60;
      const text = reduced && since ? `${m}:${String(Math.floor(s)).padStart(2, "0")}.00` : `${m}:${s.toFixed(2).padStart(5, "0")}`;
      if (clockEl.textContent !== text) clockEl.textContent = text;
      playhead.style.left = `${(t - viewStart) * pxs()}px`;
      drawClips(t);
      root.style.setProperty("--act", (reduced ? (isLive(state) ? 0.6 : 0) : env).toFixed(3));
    }
    function wake() {
      if (loop || !(since || env)) return;
      loop = ctx.loop((dt) => {
        env *= Math.exp(-dt / DECAY);
        if (env < 0.002) env = 0;
        draw();
        if (!(since || env)) { loop = null; return false; }
      });
    }
    const clock = {
      go(live, fresh) {
        const now = performance.now();
        if (fresh) { banked = 0; since = 0; viewStart = 0; clearClips(); drawGrid(); }
        if (live && !since) since = now;
        else if (!live && since) { banked += (now - since) / 1000; since = 0; }
        draw();
        wake();
      },
      reset() { banked = 0; since = 0; viewStart = 0; clearClips(); drawGrid(); draw(); },
      kick(n) { if (reduced) return; env = Math.max(env, Math.min(1, 0.5 + n / 24)); wake(); },
    };

    /* --- Clips: each step of the run lands on its lane. --- */
    let clips = [];
    function clearClips() { clips.forEach((c) => c.el.remove()); clips = []; }
    const openClip = () => clips.find((c) => c.t1 === null);
    function record(nextState, nextLine, resumed, nextStep) {
      const t = T();
      const open = openClip();
      if (resumed && open) return; // Allow: the same call goes on in the same clip
      if (nextState === "waiting" && open && open.line === nextLine) return; // the call that asks for your OK is the same clip
      if (open) open.t1 = t;
      if (nextState === "error" && open) { open.el.classList.add("is-failed"); open.el.textContent = `${open.el.textContent} failed`; }
      const track = trackOf(nextState);
      if (!lanes[track]) return;
      const el = document.createElement("div");
      el.className = "as-clip";
      el.textContent = (nextStep && nextStep.verb) || track;
      hue(el, TRACKS.find((x) => x.key === track).hue);
      lanes[track].appendChild(el);
      clips.push({ el, t0: t, t1: null, line: nextLine });
    }

    /* --- The component's state, as its props were. --- */
    let task = RUNS[0].task, state = "ready", step = null, tokens = 0, line = "", was = null, tools = 0, said = 0;
    function setStatus(nextState, nextStep) {
      const nextLine = lineOf(nextStep);
      const changed = nextState !== state || nextLine !== line;
      if (!changed) return;
      const resumed = state === "waiting" && nextLine === line;
      const fresh = nextState === "ready" || (isLive(nextState) && isEnd(state));
      const call = (nextState === "tool" || nextState === "waiting") && !resumed && (nextLine !== line || (state !== "tool" && state !== "waiting"));
      tools = (fresh ? 0 : tools) + (call ? 1 : 0);
      const stateChanged = nextState !== state;
      if (stateChanged) {
        const from = was;
        was = nextState;
        if (nextState === "ready") clock.reset();
        else if (isLive(nextState) && isEnd(from)) clock.go(true, true);
      }
      if (nextState !== "ready") record(nextState, nextLine, resumed, nextStep);
      state = nextState; step = nextStep; line = nextLine;
      if (stateChanged && nextState !== "ready") clock.go(isLive(state), false);
      said += 1;
      render();
      draw();
    }
    function setTokens(n) {
      const from = tokens;
      tokens = n;
      tokEl.textContent = thousands(tokens);
      if (tokens > from) clock.kick(tokens - from);
    }

    const canStop = () => isLive(state) || state === "waiting";
    function render() {
      root.dataset.state = state;
      taskEl.textContent = task;
      stateEl.textContent = { ready: "Ready", thinking: "Thinking", tool: tools ? `Tool ${tools}` : "Tool", writing: "Writing", waiting: "Needs approval", done: "Done", error: "Failed", stopped: "Stopped" }[state];
      tokEl.textContent = thousands(tokens);
      nowEl.innerHTML = "";
      if (step) { nowEl.append(step.verb + " "); const s = document.createElement("span"); s.textContent = step.target || ""; nowEl.append(s); }
      else nowEl.textContent = "Press play to run the task";
      const track = trackOf(state);
      TRACKS.forEach((t) => heads[t.key].classList.toggle("is-on", t.key === track && (isLive(state) || state === "waiting")));
      const th = TRACKS.find((t) => t.key === track);
      if (th) hue(meter, th.hue);
      const live = isLive(state), waiting = state === "waiting";
      playBtn.setAttribute("aria-pressed", String(live || waiting));
      playBtn.setAttribute("aria-label", state === "error" ? "Retry" : "Run");
      playBtn.setAttribute("aria-disabled", String(live || waiting));
      stopBtn.setAttribute("aria-disabled", String(!canStop()));
      allowBtn.setAttribute("aria-disabled", String(!waiting));
      if (said > 0) {
        const s = sayFor(state, line);
        if (state === "error") { statusEl.textContent = ""; alertEl.textContent = s; }
        else { alertEl.textContent = ""; statusEl.textContent = s; }
      }
    }

    /* --- The agent: works through its cues; a call that needs your OK waits there. --- */
    let agentTimer = 0, rest = [], run = 0, ghost = false, ghostTimer = 0, first = true, tokenTimer = 0;
    const later = (ms, fn) => setTimeout(() => { if (!signal.aborted) fn(); }, ms);
    function perform(cues) {
      clearTimeout(agentTimer);
      const [next, ...more] = cues;
      if (!next) return;
      const go = () => {
        if (next.ghost) { if (ghost) press("stop"); else perform(more); return; }
        change(next.state, { verb: next.verb, target: next.target });
        if (next.state === "waiting") rest = more;
        else perform(more);
      };
      if (next.wait) agentTimer = later(next.wait, go);
      else go();
    }
    function start(cues) { setTokens(0); perform(cues); }
    function onRun() {
      if (state === "error") return start(RUNS[run].retry || RUNS[run].cues);
      if (state === "ready") return start(RUNS[run].cues);
      run = (run + 1) % RUNS.length;
      task = RUNS[run].task;
      start(RUNS[run].cues);
    }
    function onStop() { clearTimeout(agentTimer); change("stopped", step); }
    function cueUp() { run = (run + 1) % RUNS.length; task = RUNS[run].task; tokens = 0; change("ready", null); }
    function change(nextState, nextStep) {
      setStatus(nextState, nextStep);
      clearInterval(tokenTimer);
      if (state === "thinking" || state === "writing") {
        const s = state;
        tokenTimer = setInterval(() => { if (!signal.aborted) setTokens(tokens + chunk(s)); }, 90);
      }
      scheduleGhost();
    }
    function scheduleGhost() {
      clearTimeout(ghostTimer);
      if (!ghost || GHOST[state] === undefined) return;
      const wait = state === "ready" && first ? FIRST_PRESS : GHOST[state];
      first = false;
      ghostTimer = later(wait, () => {
        if (!ghost) return;
        if (state === "ready" || state === "error") press("run");
        else if (state === "waiting") press("allow");
        else if (state === "done" || state === "stopped") cueUp();
      });
    }

    /* --- Keys. --- */
    function act(key) {
      if (key === "stop" && canStop()) onStop();
      else if (key === "run" && !canStop()) onRun();
      else if (key === "allow" && state === "waiting") perform(rest);
    }
    function press(key) {
      const btn = { run: playBtn, stop: stopBtn, allow: allowBtn }[key];
      btn.setAttribute("data-pressed", "");
      later(120, () => btn.removeAttribute("data-pressed"));
      act(key);
    }
    playBtn.addEventListener("click", () => act("run"), { signal });
    stopBtn.addEventListener("click", () => act("stop"), { signal });
    allowBtn.addEventListener("click", () => act("allow"), { signal });
    root.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || !canStop()) return;
      e.preventDefault();
      e.stopPropagation(); // a run to stop takes Escape; with nothing to stop, the host gets it back
      if (!e.repeat) act("stop");
    }, { signal });
    ctx.onHand(() => { ghost = false; clearTimeout(ghostTimer); });

    const resize = new ResizeObserver(() => { drawGrid(); draw(); });
    resize.observe(lanes.thinking);

    render();
    drawGrid();
    draw();
    if (reduced) {
      // One still frame: the first run, up to the call that waits on you.
      const cues = RUNS[0].cues;
      let tAcc = 0;
      for (const c of cues) {
        tAcc += c.wait / 1000;
        banked = tAcc; since = 0;
        setStatus(c.state, { verb: c.verb, target: c.target });
        since = 0; banked = tAcc;
        if (c.state === "waiting") break;
      }
      rest = cues.slice(cues.findIndex((c) => c.state === "waiting") + 1);
      setTokens(412);
      draw();
    } else {
      ghost = true;
      scheduleGhost();
    }

    return {
      destroy() {
        ghost = false;
        clearTimeout(agentTimer);
        clearTimeout(ghostTimer);
        clearInterval(tokenTimer);
        resize.disconnect();
      },
    };
  }

  FlatPlayer.register({
    slug: "agent-status",
    title: "Agent Status",
    tagline: "An agent's run, traced live: every step a clip on its lane.",
    css,
    mount,
  });
})();

</script>
<script>
/* command-menu.js */
/* Command Menu, in Rack: the command palette of an agent console and design tool, docked as a panel: a title strip
   with the count, a value box you type in, and dense results under quiet group names (Commands, Agents,
   Components, Runs). What the person made wears its colour as a strip down the row's left edge, the same everywhere:
   the Planner is purple, the Researcher blue, the Coder orange, the Reviewer green; components are cyan, pink and
   blue by kind. A run that failed says so in red. The chosen row is a box in its outline, set on the frame (nothing
   glides). Enter runs it and the strip says what happened.
   The matching is the original's: each word of the query has to appear in order in a label, and a dynamic program
   scores the best way it fits; 2,422 items rank in well under a millisecond, and only the rows in view are drawn. */
FlatPlayer.register({

  mount(host, ctx) {
    /* --- Data: an agent console's commands, agents, components and 2,400 runs ---------------------------- */
    const AGENTS = [["Planner", "purple"], ["Researcher", "blue"], ["Coder", "orange"], ["Reviewer", "green"]];
    const COMMANDS = [["Run agent", "⌘ ↵", "Started", "a run"], ["Approve all", "⇧ ⌘ A", "Approved", "3 tool calls"], ["Deploy preview", "⌘ D", "Deploying", "preview 0:00.0"],
      ["Export frame", "⇧ ⌘ E", "Exported", "Card.svg"], ["Create component", "⌘ K", "Created", "Untitled"], ["Open trace", "T", "Opened", "the last trace"],
      ["Compare branches", "", "Comparing", "main and ui-tokens"], ["Rerun failed steps", "⇧ R", "Queued", "2 steps"], ["Pause queue", "P", "Paused", "the queue"],
      ["Set budget", "", "Budget", "$4.00 a run"]];
    const COMPONENTS = [["Button", "cyan", "6 variants"], ["Card", "pink", "4 variants"], ["Header", "blue", "3 variants"], ["Toast", "cyan", "4 variants"],
      ["Select", "cyan", "5 variants"], ["Avatar", "pink", "3 variants"], ["Tabs", "blue", "2 variants"], ["Dialog", "pink", "3 variants"]];
    const TASKS = ["Fix login redirect", "Draft release notes", "Audit tokens", "Write tests for cart", "Rename props", "Summarize issues", "Resize hero frame", "Check contrast"];
    function hash(n, salt) {
      let x = Math.imul(n ^ Math.imul(salt, 0x9e3779b1), 0x85ebca6b) >>> 0;
      x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35) >>> 0;
      return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
    }
    const RUNS = 2400;
    const ITEMS = [
      ...COMMANDS.map(([label, keys, a, b]) => ({ id: "c-" + label, label, group: "Commands", meta: keys, done: [a, b] })),
      ...AGENTS.map(([label, c]) => ({ id: "a-" + label, label, group: "Agents", tone: c, meta: "Agent", done: ["Opened", label] })),
      ...COMPONENTS.map(([label, c, v]) => ({ id: "k-" + label, label, group: "Components", tone: c, meta: v, done: ["Inserted", label] })),
      ...Array.from({ length: RUNS }, (_, i) => {
        const n = RUNS - i, [agent, c] = AGENTS[n % 4], task = TASKS[Math.floor(n / 4) % 8];
        const failed = hash(n, 7) < 0.06, secs = 4 + hash(n, 1) * 170;
        const label = `${agent}: ${task.toLowerCase()} #${n}`;
        return { id: "r-" + n, label, group: "Runs", tone: c, bad: failed, meta: failed ? "Failed" : `${Math.floor(secs / 60)}:${(secs % 60).toFixed(1).padStart(4, "0")}`,
          done: ["Opened run", "#" + n] };
      }),
    ];

    /* --- Fuzzy matching (the original's dynamic program, unchanged) --------------------------------------- */
    const BONUS = { start: 12, word: 9, run: 7 }, GAP = 1;
    const codesOf = (t) => Uint16Array.from(t, (c) => c.charCodeAt(0));
    const isSep = (c) => c === " " || c === "_" || c === "-" || c === "." || c === "/" || c === ":" || c === ",";
    const isDigit = (c) => c >= "0" && c <= "9";
    const isLetter = (c) => c.toLowerCase() !== c.toUpperCase();
    function prepare(label) {
      const bonus = new Uint8Array(label.length);
      for (let j = 0; j < label.length; j++) {
        const c = label[j], p = label[j - 1];
        if (j === 0) bonus[j] = BONUS.start;
        else if (isSep(c)) continue;
        else if (isSep(p) || (p === p.toLowerCase() && c !== c.toLowerCase()) || (isDigit(p) !== isDigit(c) && isLetter(p) !== isLetter(c))) bonus[j] = BONUS.word;
      }
      return { codes: codesOf(label.toLowerCase()), bonus };
    }
    let where = new Int32Array(1024), worth = new Float64Array(1024), via = new Int32Array(1024);
    function align(word, { codes, bonus }, out) {
      const m = word.length, n = codes.length;
      let k = 0;
      for (let j = 0; j < n && k < m; j++) if (codes[j] === word[k]) k++;
      if (k < m) return -Infinity;
      if (where.length < m * n) { where = new Int32Array(m * n * 2); worth = new Float64Array(m * n * 2); via = new Int32Array(m * n * 2); }
      let prev = 0, end = 0;
      for (let i = 0; i < m; i++) {
        const c = word[i], row = i * n;
        let count = row, p = prev, gap = -Infinity, gapVia = -1;
        for (let j = i; j <= n - m + i; j++) {
          if (codes[j] !== c) continue;
          let best = -Infinity, from = -1;
          if (i === 0) best = 0;
          else {
            for (; p < end && where[p] <= j - 2; p++) { const reach = worth[p] + GAP * where[p]; if (reach > gap) { gap = reach; gapVia = p; } }
            if (gap > -Infinity) { best = gap - GAP * (j - 1); from = gapVia; }
            if (p < end && where[p] === j - 1 && worth[p] + BONUS.run >= best) { best = worth[p] + BONUS.run; from = p; }
            if (from < 0) continue;
          }
          where[count] = j; worth[count] = best + bonus[j]; via[count] = from; count++;
        }
        if (count === row) return -Infinity;
        prev = row; end = count;
      }
      let last = prev;
      for (let e = prev + 1; e < end; e++) if (worth[e] > worth[last]) last = e;
      if (out) { const first = out.length; out.length += m; for (let i = m - 1, e = last; i >= 0; e = via[e], i--) out[first + i] = where[e]; }
      return worth[last];
    }
    const names = [], groupOf = new Int32Array(ITEMS.length);
    ITEMS.forEach((it, i) => { let g = names.indexOf(it.group); if (g < 0) g = names.push(it.group) - 1; groupOf[i] = g; });
    const prepared = ITEMS.map((it) => prepare(it.label));
    const SLOT = 2 ** 21, OFFSET = 2 ** 20;
    function search(query) {
      const words = query.toLowerCase().split(/\s+/).filter(Boolean).map(codesOf);
      const n = prepared.length;
      let ranked = new Int32Array(n), count = 0;

      else {

          for (let w = 0; w < words.length && score > -Infinity; w++) score += align(words[w], prepared[i]);
          if (score > -Infinity) keys[count++] = (OFFSET - score) * SLOT + i;
        }
        const sorted = keys.subarray(0, count).sort();
        for (let k = 0; k < count; k++) ranked[k] = sorted[k] % SLOT;
      }
      ranked = ranked.subarray(0, count);
      const seen = new Int32Array(names.length).fill(-1), groups = [];
      for (const i of ranked) { const g = groupOf[i]; if (seen[g] < 0) { seen[g] = groups.length; groups.push({ name: names[g], first: 0, size: 0 }); } groups[seen[g]].size++; }
      for (let g = 1; g < groups.length; g++) groups[g].first = groups[g - 1].first + groups[g - 1].size;
      const order = new Int32Array(count), next = groups.map((g) => g.first);
      for (const i of ranked) order[next[seen[groupOf[i]]]++] = i;
      return { words, order, groups };
    }
    function locate(words, p) {
      const out = [];
      for (const w of words) align(w, p, out);
      if (words.length < 2) return out;
      let w = 0;
      for (let r = 0; r < out.length; r++) {
        const v = out[r]; let a = w;
        while (a > 0 && out[a - 1] > v) a--;
        if (a > 0 && out[a - 1] === v) continue;
        for (let b = w; b > a; b--) out[b] = out[b - 1];
        out[a] = v; w++;
      }
      out.length = w;
      return out;
    }
    const rowOf = ({ groups }, i) => { let g = 0; while (g < groups.length - 1 && i >= groups[g + 1].first) g++; return i + g + 1; };
    function atRow({ groups }, r) {
      for (let g = 0; g < groups.length; g++) {
        const heading = groups[g].first + g;
        if (r === heading) return { group: g, option: -1 };
        if (r <= heading + groups[g].size) return { group: g, option: r - g - 1 };
      }
      return { group: -1, option: -1 };
    }
    const thousands = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    /* --- DOM ------------------------------------------------------------------------------------------------ */
    const uid = "cm" + Math.random().toString(36).slice(2, 7);
    const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
    host.innerHTML = `<div class="cm">
      <div class="cm-strip"><b>Command</b><span class="cm-count"></span></div>
      <div class="cm-top"><label class="cm-field"><svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="5" cy="5" r="3.5"/><path d="m8 8 3 3"/></svg>
        <span class="cm-in"><input type="text" role="combobox" aria-label="Search commands" aria-controls="${uid}-list" aria-autocomplete="list" aria-expanded="true"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Run a command or find anything">
          <span class="cm-ghost" aria-hidden="true"><span></span><i></i></span></span>
        <span class="cm-k" aria-hidden="true">${mac ? "⌘ K" : "Ctrl K"}</span></label></div>
      <div class="cm-list" id="${uid}-list" role="listbox" aria-label="Results" tabindex="-1"><div class="cm-body"></div></div>
      <div class="cm-foot" aria-hidden="true"><span class="cm-said"></span><span class="cm-hint">↑ ↓ ↵</span></div>
      <p class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>`;
    const root = host.querySelector(".cm"), input = host.querySelector("input"), list = host.querySelector(".cm-list"), body = host.querySelector(".cm-body");
    const countEl = host.querySelector(".cm-count"), said = host.querySelector(".cm-said"), say = host.querySelector('[role="status"]');
    const ghostText = host.querySelector(".cm-ghost span");

    const OVERSCAN = 3, CHUNK = 4, SETTLE = 450, ROW = 24;
    let query = "", results = search(""), active = 0, follow = false, announceTimer = 0, runTimer = 0;
    let view = { start: 0, rows: 9, span: 9 + 2 * OVERSCAN + CHUNK };

    const total = () => results.order.length;
    const current = () => Math.min(active, total() - 1);
    const countText = () => !results.words.length ? `${thousands(ITEMS.length)} items` : total() ? `${thousands(total())} of ${thousands(ITEMS.length)}` : "0 found";

    function rowHTML(item, matches, row, option) {
      let label;
      if (!matches.length) label = `<span class="cm-label is-plain">${esc(item.label)}</span>`;
      else {
        let s = "", k = 0;
        for (let i = 0; i < item.label.length; ) {
          const on = matches[k] === i; let j = i;
          while (j < item.label.length && (matches[k] === j) === on) { if (on) k++; j++; }
          s += on ? `<em>${esc(item.label.slice(i, j))}</em>` : esc(item.label.slice(i, j));
          i = j;
        }
        label = `<span class="cm-label">${s}</span>`;
      }
      const tone = item.tone ? ` style="top:${row * ROW}px;--tone:var(--clip-${item.tone})"` : ` style="top:${row * ROW}px"`;
      return `<div class="cm-row" id="${uid}-${item.id.replace(/\W/g, "_")}" role="option" aria-selected="${option === current()}" data-opt="${option}"${tone}>${label}<span class="cm-meta"${item.bad ? ' style="color:var(--danger)"' : ""}>${esc(item.meta || "")}</span></div>`;
    }

    function draw() {
      const { order, groups, words } = results, t = total(), cur = current();
      const rowCount = t + groups.length, end = Math.min(rowCount, view.start + view.span);
      const activeRow = cur >= 0 ? rowOf(results, cur) : -1;
      const shown = [];
      const add = (row, at) => shown.push({ row, ...at, item: ITEMS[order[at.option]], matches: locate(words, prepared[order[at.option]]) });
      for (let r = view.start; r < end; r++) { const at = atRow(results, r); if (at.option >= 0) add(r, at); }
      if (activeRow >= 0 && (activeRow < view.start || activeRow >= end)) add(activeRow, atRow(results, activeRow));
      let html = "";
      groups.forEach((g, gi) => {
        const members = shown.filter((s) => s.group === gi);
        if (!members.length) return;
        html += `<div role="group" aria-labelledby="${uid}-g${gi}"><div class="cm-head" id="${uid}-g${gi}" style="top:${(g.first + gi) * ROW}px">${esc(g.name)}<b aria-hidden="true">${thousands(g.size)}</b></div>`;
        html += members.map((m) => rowHTML(m.item, m.matches, m.row, m.option)).join("") + "</div>";
      });
      if (!t) html += `<p class="cm-none">Nothing matches “${esc(query.trim())}”</p>`;
      body.style.height = rowCount * ROW + "px";
      body.innerHTML = html;
      input.setAttribute("aria-expanded", String(t > 0));
      if (cur >= 0) input.setAttribute("aria-activedescendant", `${uid}-${ITEMS[order[cur]].id.replace(/\W/g, "_")}`); else input.removeAttribute("aria-activedescendant");
      countEl.textContent = countText();
      return activeRow;
    }

    /* The chosen row is set on the frame; keys keep a row of context above and below it, and the list jumps there. */
    function update() {
      const activeRow = draw();
      if (activeRow < 0 || !follow) return;
      follow = false;
      const top = (activeRow - 1) * ROW, bottom = (activeRow + 2) * ROW;
      let next = list.scrollTop;
      if (top < next) next = Math.max(0, top);
      else if (bottom > next + list.clientHeight) next = bottom - list.clientHeight;
      if (next !== list.scrollTop) list.scrollTop = next;
    }

    function setQuery(q) {
      query = q;
      if (input.value !== q) input.value = q;
      ghostText.textContent = q;
      results = search(q); active = 0;
      list.scrollTop = 0; view.start = 0;
      update();
      clearTimeout(announceTimer);
      announceTimer = setTimeout(() => { if (query.trim()) say.textContent = total() ? `${thousands(total())} found` : `Nothing matches ${query.trim()}`; }, SETTLE);
    }
    function moveTo(next, by) {
      if (!total()) return;
      const to = clamp(next, 0, total() - 1);
      if (to === current()) return;
      follow = by === "key"; active = to; update();
    }
    function run(i) {
      if (i < 0 || i >= total()) return;
      const item = ITEMS[results.order[i]];
      const row = body.querySelector(`[data-opt="${i}"]`);
      if (row) row.classList.add("is-run");
      clearTimeout(runTimer);
      runTimer = setTimeout(() => { const r = body.querySelector(".is-run"); if (r) r.classList.remove("is-run"); }, 160);
      said.innerHTML = `<b>${esc(item.done[0])}</b> ${esc(item.done[1])}`;
      said.removeAttribute("data-fresh"); void said.offsetWidth; said.setAttribute("data-fresh", "");
      say.textContent = item.done.join(" ");

    function press(key) {
      const page = Math.max(1, view.rows - 1), cur = current();

      else if (key === "pageUp") moveTo(cur - page, "key");

    }

    /* --- Input -------------------------------------------------------------------------------------------- */
    const KEYS = { ArrowDown: "down", ArrowUp: "up", PageDown: "pageDown", PageUp: "pageUp", Home: "home", End: "end", Enter: "enter", Escape: "escape" };
    const opt = { signal: ctx.signal };

    input.addEventListener("input", () => setQuery(input.value), opt);

      if (key === "escape") { if (query) { e.preventDefault(); e.stopPropagation(); setQuery(""); } else input.blur(); return; }
      e.preventDefault();
      if (key === "enter" && e.repeat) return;
      press(key);
    }, opt);
    if (!ctx.tile) window.addEventListener("keydown", (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.altKey || e.shiftKey || e.key.toLowerCase() !== "k") return;
      e.preventDefault(); input.focus(); input.select();
    }, opt);
    list.addEventListener("mousedown", (e) => e.preventDefault(), opt);
    const pointer = { x: -1, y: -1 };
    list.addEventListener("pointermove", (e) => {
      if (e.pointerType !== "mouse") return;
      const row = e.target.closest("[data-opt]");
      if (!row) return;
      takeOver();
      if (e.clientX === pointer.x && e.clientY === pointer.y) return;
      pointer.x = e.clientX; pointer.y = e.clientY;
      const i = +row.dataset.opt;
      if (i !== current()) moveTo(i, "pointer");
    }, opt);
    list.addEventListener("click", (e) => {
      const row = e.target.closest("[data-opt]");
      if (!row) return;
      const i = +row.dataset.opt;
      if (i !== current()) moveTo(i, "pointer");
      run(i);
    }, opt);
    list.addEventListener("scroll", () => {
      const first = Math.floor(list.scrollTop / ROW);
      const start = Math.max(0, Math.floor((first - OVERSCAN) / CHUNK) * CHUNK);
      if (start !== view.start) { view.start = start; draw(); }
    }, opt);
    const ro = new ResizeObserver(() => {
      const fit = Math.max(1, Math.round(list.clientHeight / ROW));
      if (fit !== view.rows) { view.rows = fit; view.span = fit + 2 * OVERSCAN + CHUNK; draw(); }
    });
    ro.observe(list);
    setQuery("");
    said.textContent = "Type to search";

    /* --- The self-run: someone types, steps down, runs it; a beat later, again. A hand ends it for good. ------ */
    const ROUNDS = [
      { query: "fix", keys: ["down", "down", "enter"] },
      { query: "dep", keys: ["enter"] },
      { query: "card", keys: ["enter"] },
      { query: "rev audit", keys: ["down", "enter"] },
    ];
    let live = false, timer = 0, ghostWords = false;
    function takeOver() {
      if (!live) return;
      live = false; clearTimeout(timer); root.classList.remove("is-ghost"); ghostWords = !!query;
    }
    if (!ctx.reduced()) {
      live = true; root.classList.add("is-ghost");
      let round = 0, steps = [];
      const plan = () => {
        const { query: q, keys } = ROUNDS[round++ % ROUNDS.length];
        const out = [[round === 1 ? 300 : 200, () => setQuery("")]];
        for (let i = 1; i <= q.length; i++) out.push([i === 1 ? 400 : 110 + Math.random() * 80, () => setQuery(q.slice(0, i))]);
        keys.forEach((k, i) => out.push([i === 0 ? 600 : 360, () => press(k)]));
        out.push([1400, () => {}]);
        return out;
      };
      const next = () => {
        if (!steps.length) steps = plan();
        const [wait, act] = steps.shift();
        timer = ctx.after(wait, () => { if (!live) return; act(); next(); });
      };
      next();
    }
    ctx.onHand(takeOver);

    return { destroy() { live = false; clearTimeout(timer); clearTimeout(announceTimer); clearTimeout(runTimer); ro.disconnect(); } };
  },
});

</script>
<script>

 * with a square copy key. The part being added is the one thing you're bringing in, so its name wears a clip colour
 * wherever it shows. A copy answers on the frame: the key's glyph cuts to a check, the copied text is selected in the

    title: "Copy Button",

    </div>
  </section>
  <section class="pb-dev" aria-labelledby="${id}-p">
    <div class="pb-strip">
      <button type="button" class="pb-key" aria-pressed="false" aria-label="Play preview">${PLAY}</button>
      <span class="pb-title" id="${id}-p">Preview</span>
      <a class="pb-open" href="https://litt.design" target="_blank" rel="noreferrer">Open<span class="sr-only"> project (opens in a new tab)</span></a>
    </div>
    <div class="pb-view">
      <div class="pb-art" aria-hidden="true"></div>
      <dl class="pb-fields">
        <div class="pb-pair"><dt>Size</dt><dd data-f="size"></dd></div>
        <div class="is-more"><dt>Length</dt><dd data-f="length"></dd></div><div class="is-more"><dt>Frames</dt><dd data-f="frames"></dd></div>
      </dl>
      <p class="pb-line"></p>
    </div>
  </section>
  <p class="sr-only" aria-live="polite"></p>
</div>`;
      const list = host.querySelector(".pb-list"), rows = [...host.querySelectorAll(".pb-row")];
      const view = host.querySelector(".pb-view"), art = host.querySelector(".pb-art"), playKey = host.querySelector(".pb-key");
      const line = host.querySelector(".pb-line"), live = host.querySelector("[aria-live]");
      const fieldEls = Object.fromEntries([...host.querySelectorAll("[data-f]")].map((d) => [d.dataset.f, d]));

      const thumbs = rows.map((r, i) => makeField(r.querySelector(".pb-thumb"), PROJECTS[i].pattern));
      const preview = makeField(art, PROJECTS[0].pattern);
      const sig = { signal: ctx.signal };

      /* The chosen project fills the Preview: its colour, its art, its numbers, cut in on the frame. */
      let at = -1, playing = false;
      function choose(i, user) {
        if (i === at) return;
        at = i;
        const p = PROJECTS[i];

        list.setAttribute("aria-activedescendant", rows[i].id);

        preview.pattern(p.pattern); preview.ink();

        preview.draw();

        if (!reduced && c && c.animate) c.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 100, easing: "cubic-bezier(0.23, 1, 0.32, 1)" });

      }

        playKey.setAttribute("aria-label", playing ? "Pause preview" : "Play preview");
        playKey.innerHTML = playing ? PAUSE : PLAY;
      }

      setPlaying(true);

      rows.forEach((r, i) => {
        const f = thumbs[i];
        r.addEventListener("click", () => { choose(i, true); list.focus({ preventScroll: true }); }, sig);
        r.addEventListener("pointermove", (e) => { f.state.mouse = f.toLocal(e); f.state.hoverTarget = 1; }, sig);
        r.addEventListener("pointerleave", () => (f.state.hoverTarget = 0), sig);
      });
      art.addEventListener("pointermove", (e) => { preview.state.mouse = preview.toLocal(e); preview.state.hoverTarget = 1; }, sig);
      art.addEventListener("pointerleave", () => (preview.state.hoverTarget = 0), sig);
      art.addEventListener("pointerdown", (e) => { if (!reduced) preview.state.ripple = [...preview.toLocal(e), 0]; }, sig);
      list.addEventListener("keydown", (e) => {
        const n = PROJECTS.length;
        const to = { ArrowDown: at + 1, ArrowUp: at - 1, Home: 0, End: n - 1 }[e.key];
        if (to === undefined) return;
        e.preventDefault(); choose((to + n) % n, true);
      }, sig);
      playKey.addEventListener("click", () => setPlaying(!playing), sig);

      /* The ghost walks the list; each pick lands on the next tick. A hand ends it for good. */
      let ghost = !reduced, wait = 0;
      ctx.onHand(() => { ghost = false; clearTimeout(wait); });
      if (!reduced) ctx.every(GHOST, () => {
        if (!ghost) return;
        const next = (at + 1) % PROJECTS.length;
        const delay = TICK - (performance.now() % TICK);
        wait = ctx.after(delay, () => { if (ghost) choose(next); });
      });

      const all = [...thumbs, preview];
      if (reduced) all.forEach((f) => f.draw());
      else ctx.loop((dt) => {
        for (const f of all) {
          const s = f.state;
          s.hover += (s.hoverTarget - s.hover) * (1 - Math.exp(-dt * 20));
          if (f === preview && playing) s.time += dt * 1.2;
          if (s.ripple[2] >= 0) { s.ripple[2] += dt; if (s.ripple[2] > 1.6) s.ripple[2] = -1; }
          f.draw();
        }
      });

      const reink = () => all.forEach((f) => { f.ink(); f.draw(); });
      const mo = new MutationObserver(reink);
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", reink, sig);
      const ro = new ResizeObserver(() => all.forEach((f) => { f.resize(); f.draw(); }));
      host.querySelectorAll(".pb-thumb, .pb-art").forEach((el) => ro.observe(el));
      return { destroy() { mo.disconnect(); ro.disconnect(); all.forEach((f) => f.dispose()); } };
    },
  });
})();

<script>
/* fader.js */
/* Fader, after litterthanlit/components, redesigned in Rack (round 2: agents, not music).
   The product underneath is a run's effort lanes on autopilot: a plan sets how hard each agent works (Planner, Coder,
   Reviewer, each in its own colour) as the run goes, and each lane follows it with the clock until a hand overrides it.
   A lane wears its agent's colour on its title, its effort fill and its usage meter (red when it runs at its limit).
   A hand sets the effort 1:1 and it stays; the lane's key turns to Re-enable, as Live's re-enable automation does.
   Double-click returns to 50 %; Shift drags finely; 50 % catches the hand. The transport is the run: the lit Run key,
   its clock and what it has cost so far. */
(function () {
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const snap = (v) => clamp(Math.round(v * 2) / 2, 0, 100);
  const pct = (v) => Math.round(v) + " % effort";
  const UNITY = 50, CATCH = 1.2, RELEASE = 3.5, FINE = 0.25;
  const LOOP = 12; // s: the autopilot plan, played round
  const smooth = (x) => { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); };
  const swell = (t, a, b, r) => smooth((t - a) / r) * (1 - smooth((t - b) / r));
  const u = (t) => ((t % LOOP) + LOOP) % LOOP;
  /* The plan: the Planner works hard first, the Coder takes over, the Reviewer comes in at the end. */
  const AUTO = {
    planner: (t) => snap(22 + 58 * swell(u(t), -1, 3.4, 0.8) + 3 * Math.sin(t * 2.1)),
    coder: (t) => snap(18 + 62 * swell(u(t), 2.6, 9, 0.9) + 4 * Math.sin(t * 1.3)),
    reviewer: (t) => snap(14 + 56 * swell(u(t), 8.4, 13, 0.7) + 2 * Math.sin(t * 1.7)),
  };
  /* How much of its effort each agent is spending right now: the work the meter shows. */
  const BUSY = {
    planner: (t) => 0.55 + 0.4 * Math.abs(Math.sin(t * 3.1)),
    coder: (t) => 0.6 + 0.45 * Math.abs(Math.sin(t * 4.3) * Math.sin(t * 1.1)),
    reviewer: (t) => 0.5 + 0.35 * Math.abs(Math.sin(t * 2.4)),
  };
  const TRACKS = [{ key: "planner", label: "Planner", hue: "purple" }, { key: "coder", label: "Coder", hue: "orange" }, { key: "reviewer", label: "Reviewer", hue: "green" }];
  const MARKS = [[1, "100"], [0.75, "75"], [0.5, "50"], [0.25, "25"], [0, "0"]];
  const clockText = (t) => Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0");

  FlatPlayer.register({
    slug: "fader",
    title: "Fader",
    tagline: "Agent effort on autopilot until you override a lane.",
    css: `
.fs-fader .rk { width: min(100%, 420px); background: var(--body); border-radius: var(--r-panel); padding: 3px; display: grid; gap: 3px; font-family: var(--font); user-select: none; -webkit-user-select: none; --h: 176px }
.fs-fader.is-tile .rk { --h: 96px }

  transition: background-color var(--cut-in) var(--ease-out), color var(--cut-in) var(--ease-out) }

.fs-fader .rk-key:active { box-shadow: var(--edge-press); transform: scale(0.98) }
.fs-fader .rk-key:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px }
.fs-fader .rk-key svg { width: 11px; height: 11px; fill: currentColor }
.fs-fader .rk-key.is-lit { background: var(--accent); color: var(--accent-fg) }
.fs-fader .rk-pos { font: 600 20px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); min-width: 4.2em; padding-left: 4px }
.fs-fader .rk-play { gap: 6px; grid-auto-flow: column }
.fs-fader .rk-box { height: 22px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: var(--r-control); background: var(--cut); box-shadow: var(--edge);
  font: 500 11px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap }
.fs-fader .rk-song { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }

.fs-fader .rk-title { padding: 4px 7px; font-size: 12px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.fs-fader .rk-body { display: grid; justify-items: center; gap: 6px; padding: 8px 6px 6px }
.fs-fader.is-tile .rk-body { gap: 4px; padding: 6px 5px 5px }
.fs-fader .rk-well { position: relative; display: flex; gap: 6px; height: var(--h); padding: 0 0 0 26px }
.fs-fader.is-tile .rk-well { padding-left: 0 }
.fs-fader .rk-mark { position: absolute; left: 0; width: 22px; text-align: right; translate: 0 -50%; font: 500 9px/1 var(--mono); color: var(--muted) }
.fs-fader.is-tile .rk-mark { display: none }
.fs-fader .rk-meter { position: relative; width: 5px; height: calc(100% - 12px); margin-top: 6px; background: var(--slot); border-radius: 1px; overflow: hidden }
.fs-fader .rk-meter i { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--m, 0) * 100%); background: var(--c) }
.fs-fader .rk-meter.is-over i { background: var(--danger) }
.fs-fader .rk-fader { position: relative; width: 28px; height: 100%; cursor: ns-resize; touch-action: none; --f: 0 }
.fs-fader .rk-fader:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.fs-fader .rk-slot { position: absolute; left: 50%; width: 4px; translate: -50% 0; top: 6px; bottom: 6px; background: var(--slot); border-radius: 1px }
.fs-fader .rk-slot i { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--f) * 100%); background: var(--c) }
.fs-fader .rk-thumb { position: absolute; left: 0; right: 0; height: 12px; bottom: calc(var(--f) * (100% - 12px)); border-radius: var(--r-control); background: var(--block); box-shadow: var(--edge) }

`,
    mount(host, ctx) {
      const reduced = ctx.reduced(), S = ctx.signal, on = (el, t, f) => el.addEventListener(t, f, { signal: S });
      host.innerHTML = `
<div class="rk">
  <div class="rk-panel rk-transport">
    <button type="button" class="rk-key rk-play"></button>
    <span class="rk-pos" aria-hidden="true">0:00.0</span>
    <span class="rk-box rk-cost" aria-hidden="true">$0.000</span>
    <span class="rk-song" aria-hidden="true">Run 12, autopilot</span>
  </div>
  <div class="rk-strips"></div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;
      const costEl = host.querySelector(".rk-cost"), play = host.querySelector(".rk-play"), posEl = host.querySelector(".rk-pos"), strips = host.querySelector(".rk-strips"), live = host.querySelector("[aria-live]");
      let playing = false, cost = 0, time = 0, last = 0, selfRun = !reduced, downTarget = null;

      const tr = {};
      TRACKS.forEach(({ key, label, hue }) => {
        const el = document.createElement("div");
        el.className = "rk-panel";
        el.style.setProperty("--c", `var(--clip-${hue})`);
        el.innerHTML = `<div class="rk-title" style="background:var(--clip-${hue}-tint);color:var(--clip-${hue}-text)">${label}</div>
<div class="rk-body">
  <div class="rk-well">
    ${MARKS.map(([f, l]) => `<span class="rk-mark" aria-hidden="true" style="top:calc(6px + ${(1 - f).toFixed(3)} * (100% - 12px))">${l}</span>`).join("")}
    <span class="rk-meter" aria-hidden="true"><i></i></span>
    <div class="rk-fader" role="slider" tabindex="0" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-label="${label} effort">
      <span class="rk-slot" aria-hidden="true"><i></i></span><span class="rk-thumb" aria-hidden="true"></span>
    </div>
  </div>
  <span class="rk-box rk-val" aria-hidden="true"></span>
  <button type="button" class="rk-key rk-auto" aria-pressed="true"></button>
</div>`;
        strips.appendChild(el);
        const t = { key, label, fader: el.querySelector(".rk-fader"), val: el.querySelector(".rk-val"), auto: el.querySelector(".rk-auto"), meter: el.querySelector(".rk-meter"),
          value: 0, follow: true, level: 0, drag: null, lastDown: { at: -Infinity, y: 0 } };

        tr[key] = t;
      });

      function set(t, v) {
        t.value = v;
        const text = pct(v);

      function renderPlay() {

        play.innerHTML = (playing ? '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7"/></svg>' : '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1v8l7-4z"/></svg>') + (playing ? "Running" : "Run");

      }

      /* Time moves things: the clock, the autopilot and the meters follow the clock and stop when it stops. */
      ctx.loop((dt, now) => {

      window.addEventListener("pointerdown", (e) => { downTarget = e.target; }, { capture: true, signal: S });
      window.addEventListener("keydown", (e) => { downTarget = e.target; }, { capture: true, signal: S });

      TRACKS.forEach(({ key }) => {
        const t = tr[key];
        on(t.auto, "click", () => {
          t.follow = !t.follow; renderAuto(t);

          live.textContent = t.label + (t.follow ? ": back on autopilot" : ": autopilot overridden");
        });
        on(t.fader, "keydown", (e) => {
