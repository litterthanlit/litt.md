<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rack Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Rack Studies (litt.md): crisp architectural software instruments.
   Square geometry (2px controls in 4px panels), sharp 1px outlines, zero shadows or glass,
   electric sunlit yellow (#ffd014) strictly as a lit key fill inside a 1px outline,
   high-chroma electric series fills on clean bright neutrals, and Rack's Emil-Kowalski motion:
   0ms 1:1 under a hand, 100ms ease-out opacity cut-in with 36ms column stagger, 75ms cut-out, zero springs. */
:root {
  --canvas: #e6e8ee;
  --panel: #f7f8fa;
  --surface-2: #eef0f5;
  --surface-3: #e3e6ee;
  --cut: #ffffff;
  --block: #ffffff;
  --block-hover: #eef1f7;
  --ink: #111318;
  --on-ink: #ffffff;
  --muted: #4b5262;
  --disabled: #8f97a8;
  --line: #d4d8e2;
  --border: #8d95a5;
  --border-strong: #111318;

  /* Electric sunlit yellow: lit key fill inside a 1px outline. */
  --accent: #ffd014;
  --accent-hover: #ffdb47;
  --on-accent: #111318;

  /* Vivid electric series hues: strictly on status, tags, data, and active states. */
  --blue: #1a6dff; --blue-text: #0d4ecc; --blue-tint: #dceaff;
  --coral: #ff471a; --coral-text: #c22e08; --coral-tint: #ffe1d9;
  --emerald: #00b377; --emerald-text: #00754d; --emerald-tint: #cef6e8;
  --violet: #7a3cff; --violet-text: #5620c9; --violet-tint: #ebe0ff;
  --pink: #e6268c; --pink-text: #a81263; --pink-tint: #ffd9ed;

  --font: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-panel: 4px;
  --r-control: 2px;
  --dur-in: 100ms;
  --dur-out: 75ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #0f1115;
  --panel: #181b22;
  --surface-2: #20242e;
  --surface-3: #282e3b;
  --cut: #111318;
  --block: #232833;
  --block-hover: #2d3342;
  --ink: #f3f5f8;
  --on-ink: #111318;
  --muted: #9da6b8;
  --disabled: #5d6678;
  --line: #2a303d;
  --border: #555f73;
  --border-strong: #f3f5f8;

  --accent: #ffd014;
  --accent-hover: #ffdb47;
  --on-accent: #111318;

  --blue: #408cff; --blue-text: #85b8ff; --blue-tint: #10254a;
  --coral: #ff6238; --coral-text: #ff9c80; --coral-tint: #45180d;
  --emerald: #00d68f; --emerald-text: #6bf0c2; --emerald-tint: #093829;
  --violet: #a070ff; --violet-text: #cbb0ff; --violet-tint: #28174d;
  --pink: #ff4da6; --pink-text: #ff99cc; --pink-tint: #45102c;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --canvas: #0f1115;
  --panel: #181b22;
  --surface-2: #20242e;
  --surface-3: #282e3b;
  --cut: #111318;
  --block: #232833;
  --block-hover: #2d3342;
  --ink: #f3f5f8;
  --on-ink: #111318;
  --muted: #9da6b8;
  --disabled: #5d6678;
  --line: #2a303d;
  --border: #555f73;
  --border-strong: #f3f5f8;

  --accent: #ffd014;
  --accent-hover: #ffdb47;
  --on-accent: #111318;

  --blue: #408cff; --blue-text: #85b8ff; --blue-tint: #10254a;
  --coral: #ff6238; --coral-text: #ff9c80; --coral-tint: #45180d;
  --emerald: #00d68f; --emerald-text: #6bf0c2; --emerald-tint: #093829;
  --violet: #a070ff; --violet-text: #cbb0ff; --violet-tint: #28174d;
  --pink: #ff4da6; --pink-text: #ff99cc; --pink-tint: #45102c;
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur-in: 0ms; --dur-out: 0ms; }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--canvas);
  color: var(--ink);
  font: 400 14px/1.45 var(--font);
  letter-spacing: -0.008em;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Shared Rack controls: crisp 1px outlines, 2px square corners, zero shadows, 0.98 press feedback. */
.rk-seg {
  display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-control);
  background: var(--surface-2); overflow: hidden;
}
.rk-seg button {
  border: 0; border-right: 1px solid var(--border); background: var(--block); color: var(--ink);
  height: 28px; padding: 0 11px; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.rk-seg button:last-child { border-right: 0; }
.rk-seg button:hover { background: var(--block-hover); }
.rk-seg button:active { transform: scale(0.98); }
.rk-seg button[aria-pressed="true"],
.rk-seg button[aria-checked="true"] { background: var(--ink); color: var(--on-ink); }
.rk-seg.is-yellow button[aria-pressed="true"],
.rk-seg.is-yellow button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }

.rk-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 28px; padding: 0 11px; border: 1px solid var(--border); border-radius: var(--r-control);
  background: var(--block); color: var(--ink); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.rk-btn:hover { background: var(--block-hover); border-color: var(--border-strong); }
.rk-btn:active { transform: scale(0.98); }
.rk-btn.is-accent { background: var(--accent); color: var(--on-accent); border-color: var(--border-strong); font-weight: 600; }
.rk-btn.is-accent:hover { background: var(--accent-hover); }
.rk-btn.is-ink { background: var(--ink); color: var(--on-ink); border-color: var(--ink); font-weight: 500; }
.rk-mono { font-family: var(--mono); }

/* Clean editorial gallery shell — calm like Flat Studies, architectural like Rack. */
.rg { max-width: 1280px; margin: 0 auto; padding: 28px 8px 64px; }
.rg-head {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 16px 24px; margin: 0 0 28px;
}
.rg-head h1 { margin: 0; font: 600 32px/1.1 var(--font); letter-spacing: -0.03em; }
.rg-head p { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 58ch; }
.rg-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* The Rack wall: crisp outlined stages, title & tagline cleanly below each component. */
.rg-wall {
  list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 370px), 1fr));
  gap: 28px 20px;
}
.rg-wall li { display: grid; }
.rg-wall li[hidden] { display: none; }
.rg-tile {
  display: grid; grid-template-rows: auto auto; gap: 9px; width: 100%; padding: 0;
  border: 0; background: transparent; text-align: left; cursor: pointer;
}
.rg-stage {
  position: relative; height: 248px; border-radius: var(--r-panel);
  background: var(--panel); border: 1px solid var(--line);
  overflow: hidden; display: grid; place-items: center;
}
.rg-tile:hover .rg-stage { border-color: var(--border-strong); }
.rg-stage > .rp-mount {
  width: 100%; height: 100%; display: grid; place-items: center;
  padding: 14px; container-type: inline-size; pointer-events: none;
}
.rg-name { display: flex; align-items: baseline; gap: 8px; padding: 0 2px; min-width: 0; }
.rg-name b { font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; }
.rg-name span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* Open sheet: 100ms opacity cut-in, 36ms column stagger, 75ms cut-out. Zero scale/spring travel. */
.rg-sheet {
  position: fixed; inset: 0; z-index: 20; display: none;
  background: var(--canvas); overflow: auto; overscroll-behavior: contain;
}
.rg-sheet.is-open { display: grid; grid-template-rows: auto 1fr auto; }
.rg-sbar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.rg-sbar .l { justify-self: start; } .rg-sbar .r { justify-self: end; }
.rg-stitle { margin: 0; font: 600 14px/1.2 var(--font); text-align: center; }
.rg-open { display: grid; place-items: center; min-height: 0; padding: 28px 16px; }
.rg-open > .rp-mount {
  width: min(100%, 880px); min-height: min(440px, 100%);
  display: grid; place-items: center; container-type: inline-size;
}
.rg-about {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px;
  padding: 12px 18px; background: var(--panel); border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.rg-about b { color: var(--ink); font-weight: 600; margin-right: 8px; }
.rg-foot {
  margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px;
  font-size: 13px; color: var(--muted);
}

@media (max-width: 720px) {
  .rg-head h1 { font-size: 26px; }
  .rg-stage { height: 236px; }
}
</style>
</head>
<body>
<main class="rg">
  <header class="rg-head">
    <div>
      <h1>Rack studies</h1>
      <p>Sixteen agentic &amp; interface-first studies in Rack — square outlines, high-chroma fills, electric yellow lit keys, 0ms direct manipulation, and 100ms cut-in motion.</p>
    </div>
    <div class="rg-tools">
      <div class="rk-seg" id="rg-filter" role="radiogroup" aria-label="Filter studies">
        <button type="button" role="radio" data-cat="all" aria-checked="true">All (16)</button>
        <button type="button" role="radio" data-cat="agent" aria-checked="false">Agentic</button>
        <button type="button" role="radio" data-cat="control" aria-checked="false">Controls</button>
        <button type="button" role="radio" data-cat="data" aria-checked="false">Signals</button>
      </div>
      <div class="rk-seg" role="group" aria-label="Theme">
        <button type="button" id="rg-light">Light</button>
        <button type="button" id="rg-dark">Dark</button>
      </div>
    </div>
  </header>

  <ul class="rg-wall" id="rg-wall"></ul>

  <footer class="rg-foot">
    <span>Each study runs live on the wall until you open and interact with it. Zero springs, zero shadows.</span>
    <span class="rk-mono" style="font-size:12px" id="rg-count">16 / 16</span>
  </footer>
</main>

<div class="rg-sheet" id="rg-sheet" role="dialog" aria-modal="true" aria-labelledby="rg-sheet-title">
  <div class="rg-sbar">
    <div class="l"><button class="rk-btn" type="button" id="rg-close">Close [Esc]</button></div>
    <h2 class="rg-stitle" id="rg-sheet-title"></h2>
    <div class="r rk-seg">
      <button type="button" id="rg-prev" aria-label="Previous study">← Prev</button>
      <button type="button" id="rg-next" aria-label="Next study">Next →</button>
    </div>
  </div>
  <div class="rg-open" id="rg-open"></div>
  <div class="rg-about" id="rg-about"></div>
</div>
<p class="sr-only" id="rg-live" aria-live="polite"></p>

<script>
/* RackPlayer: Rack's Emil-Kowalski motion & direct-manipulation runtime.
   - 0ms under a hand (1:1 pointer-capture drag, toggles, scrubbing, filtering)
   - 100ms ease-out opacity cut-in, 36ms column stagger on panel reveal
   - 75ms ease-out opacity cut-out on dismiss
   - Zero springs, zero overshoot, zero travel. */
window.RackPlayer = (function () {
  const studies = [];
  const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function cutIn(el, delayMs) {
    if (!el || reduced() || !el.animate) return;
    el.animate([{ opacity: 0 }, { opacity: 1 }], {
      duration: 100, delay: delayMs || 0, easing: "ease-out", fill: "backwards",
    });
  }

  function staggerColumns(root, selector) {
    if (!root || reduced()) return;
    const els = [...root.querySelectorAll(selector || "[data-col]")];
    if (!els.length) return;
    const buckets = [];
    for (const el of els) {
      const left = Math.round(el.getBoundingClientRect().left / 16) * 16;
      let b = buckets.find((x) => Math.abs(x.left - left) <= 16);
      if (!b) { b = { left, els: [] }; buckets.push(b); }
      b.els.push(el);
    }
    buckets.sort((a, b) => a.left - b.left);
    buckets.forEach((b, i) => b.els.forEach((el) => cutIn(el, i * 36)));
  }

  function bindDrag(el, opts) {
    const { min, max, step: inc, def, get, set, signal, rangePx = 110 } = opts;
    const clamp = (v) => {
      const snapped = Math.round((v - min) / inc) * inc + min;
      return Math.max(min, Math.min(max, Number(snapped.toFixed(6))));
    };
    let startY = 0, startVal = 0, dragging = false;
    el.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      dragging = true; startY = e.clientY; startVal = get();
      el.setPointerCapture(e.pointerId);
      el.classList.add("is-drag");
      e.preventDefault();
    }, { signal });
    el.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dy = startY - e.clientY;
      const next = clamp(startVal + (dy / rangePx) * (max - min) * (e.shiftKey ? 0.25 : 1));
      if (next !== get()) set(next);
    }, { signal });
    const end = () => { if (dragging) { dragging = false; el.classList.remove("is-drag"); } };
    el.addEventListener("pointerup", end, { signal });
    el.addEventListener("pointercancel", end, { signal });
    el.addEventListener("dblclick", () => set(def), { signal });
    el.addEventListener("wheel", (e) => {
      e.preventDefault();
      set(clamp(get() + (e.deltaY < 0 ? 1 : -1) * inc * (e.shiftKey ? 5 : 1)));
    }, { signal, passive: false });
    el.addEventListener("keydown", (e) => {
      const k = { ArrowUp: inc, ArrowRight: inc, ArrowDown: -inc, ArrowLeft: -inc, PageUp: inc * 5, PageDown: -inc * 5 }[e.key];
      if (k !== undefined) { e.preventDefault(); set(clamp(get() + k)); }
      else if (e.key === "Home") { e.preventDefault(); set(min); }
      else if (e.key === "End") { e.preventDefault(); set(max); }
      else if (e.key === "0" || e.key === "Backspace") { e.preventDefault(); set(def); }
    }, { signal });
  }

  return {
    studies, reduced, cutIn, staggerColumns, bindDrag,
    register(s) {
      studies.push(s);
      if (s.css) {
        const st = document.createElement("style");
        st.dataset.study = s.slug;
        st.textContent = s.css;
        document.head.appendChild(st);
      }
    },
  };
})();
</script>
<script>
/* 01-agent-status.js */
/* 01-agent-status.js — Agent Status:
   Live run header, elapsed timer, crisp square step pills, and electric yellow Allow / Stop keys. */
(function () {
  const S = ".rs-agent-status";
  const STEPS = [
    { id: "plan", label: "Plan", hue: "violet", msg: "Decomposed into 3 file edits", tok: 142 },
    { id: "read", label: "Read", hue: "blue", msg: "Inspecting tokens.css + check.mjs", tok: 486 },
    { id: "patch", label: "Patch", hue: "coral", msg: "Waiting to run: git apply fix.patch", tok: 814 },
    { id: "verify", label: "Verify", hue: "emerald", msg: "18/18 checks passed in 1.2s", tok: 1024 },
  ];

  RackPlayer.register({
    slug: "agent-status",
    title: "Agent Status",
    category: "agent",
    tagline: "What the agent is doing right now, crisp square step pills, and a lit yellow approval key.",
    motion: "0ms step snap · 0.98 key press",
    css: `
${S} .as {
  width: min(100%, 420px); background: var(--cut); border: 1px solid var(--border);
  border-radius: var(--r-panel); overflow: hidden; display: grid;
}
${S} .as-bar { height: 4px; background: var(--coral); }
${S} .as-bar[data-h="violet"] { background: var(--violet); }
${S} .as-bar[data-h="blue"] { background: var(--blue); }
${S} .as-bar[data-h="coral"] { background: var(--coral); }
${S} .as-bar[data-h="emerald"] { background: var(--emerald); }
${S} .as-in { padding: 14px; display: grid; gap: 11px; }
${S} .as-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
${S} .as-title { font-weight: 600; font-size: 13px; }
${S} .as-badge {
  font: 600 10px/1 var(--mono); padding: 4px 6px; border: 1px solid var(--border-strong);
  border-radius: var(--r-control); text-transform: uppercase;
}
${S} .as-badge[data-h="violet"] { background: var(--violet-tint); color: var(--violet-text); border-color: var(--violet); }
${S} .as-badge[data-h="blue"] { background: var(--blue-tint); color: var(--blue-text); border-color: var(--blue); }
${S} .as-badge[data-h="coral"] { background: var(--accent); color: var(--on-accent); border-color: var(--border-strong); }
${S} .as-badge[data-h="emerald"] { background: var(--emerald-tint); color: var(--emerald-text); border-color: var(--emerald); }
${S} .as-mid { display: flex; justify-content: space-between; align-items: baseline; }
${S} .as-time { font: 600 28px/1 var(--mono); letter-spacing: -0.03em; }
${S} .as-tok { font: 500 11px/1 var(--mono); color: var(--muted); }
${S} .as-msg {
  font: 500 11px/1.3 var(--mono); padding: 6px 8px; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--r-control);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
${S} .as-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
${S} .as-st {
  height: 26px; border: 1px solid var(--border); border-radius: var(--r-control);
  background: var(--block); font-size: 11px; font-weight: 500; cursor: pointer;
}
${S} .as-st.is-on[data-h="violet"] { background: var(--violet); color: #fff; border-color: var(--violet); }
${S} .as-st.is-on[data-h="blue"] { background: var(--blue); color: #fff; border-color: var(--blue); }
${S} .as-st.is-on[data-h="coral"] { background: var(--coral); color: #fff; border-color: var(--coral); }
${S} .as-st.is-on[data-h="emerald"] { background: var(--emerald); color: #fff; border-color: var(--emerald); }
${S} .as-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
${S}.is-tile .as-in { padding: 10px; gap: 8px; }
${S}.is-tile .as-time { font-size: 22px; }
${S}.is-tile .as-st { height: 22px; font-size: 10px; }
${S}.is-tile .as-acts .rk-btn { height: 24px; font-size: 11px; }
`,
    mount(host, ctx) {
      let cur = 2;
      let sec = 4.2;

      host.innerHTML =
        '<div class="as" data-col>' +
          '<i class="as-bar" id="as-bar"></i>' +
          '<div class="as-in">' +
            '<div class="as-top"><span class="as-title">Refactor color tokens</span><span class="as-badge" id="as-badge"></span></div>' +
            '<div class="as-mid"><span class="as-time" id="as-time">0:04.2</span><span class="as-tok" id="as-tok"></span></div>' +
            '<div class="as-msg" id="as-msg"></div>' +
            '<div class="as-steps">' +
              STEPS.map((s, i) => '<button type="button" class="as-st" data-i="' + i + '" data-h="' + s.hue + '">' + s.label + '</button>').join("") +
            '</div>' +
            '<div class="as-acts">' +
              '<button type="button" class="rk-btn is-accent" id="as-allow">Allow</button>' +
              '<button type="button" class="rk-btn" id="as-stop">Stop</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      const bar = host.querySelector("#as-bar");
      const badge = host.querySelector("#as-badge");
      const timeEl = host.querySelector("#as-time");
      const tokEl = host.querySelector("#as-tok");
      const msgEl = host.querySelector("#as-msg");
      const stBtns = [...host.querySelectorAll(".as-st")];

      function draw() {
        const s = STEPS[cur];
        bar.dataset.h = s.hue;
        badge.dataset.h = s.hue;
        badge.textContent = cur === 2 ? "Needs OK" : cur === 3 ? "Complete" : "Running";
        timeEl.textContent = "0:" + sec.toFixed(1).padStart(4, "0");
        tokEl.textContent = s.tok + " tok";
        msgEl.textContent = s.msg;
        stBtns.forEach((b, i) => b.classList.toggle("is-on", i === cur));
      }

      stBtns.forEach((b) => b.addEventListener("click", () => { cur = +b.dataset.i; draw(); }, { signal: ctx.signal }));
      host.querySelector("#as-allow").addEventListener("click", () => { cur = 3; draw(); }, { signal: ctx.signal });
      host.querySelector("#as-stop").addEventListener("click", () => { cur = 0; sec = 0.0; draw(); }, { signal: ctx.signal });
      draw();

      let auto = !ctx.reduced();
      ctx.onHand(() => { auto = false; });
      if (auto) {
        ctx.every(200, () => { if (!auto || cur === 3) return; sec = (sec + 0.2) % 24; draw(); });
        ctx.every(2400, () => { if (!auto) return; cur = (cur + 1) % STEPS.length; draw(); });
      }
    },

(function () {

      host.innerHTML =
        '<div class="ai" data-col>' +
          '<div class="ai-stage">' +
            '<div class="ai-glyph" id="ai-g"></div>' +
            '<div><div class="ai-txt" id="ai-txt"></div><div class="ai-sub" id="ai-sub"></div></div>' +

        const m = MODES[cur];
        btns.forEach((b, i) => b.setAttribute("aria-checked", String(i === cur)));
        txtEl.textContent = m.text;
        subEl.textContent = "FRAME " + String((tick % 9) + 1).padStart(2, "0") + " · DISCRETE STEP";
        if (m.id === "matrix") {
          const order = [0, 1, 2, 5, 8, 7, 6, 3, 4];
          const hi = order[tick % order.length], mid = order[(tick + 8) % order.length];
          gEl.innerHTML = '<div class="ai-mat">' + Array.from({ length: 9 }, (_, i) => '<i class="' + (i === hi ? 'is-hi' : i === mid ? 'is-mid' : '') + '"></i>').join("") + '</div>';

          const pos = tick % 6, prev = (pos + 5) % 6;

          const hs = [10, 22, 16, 24].map((h, i) => 6 + ((h + tick * 5 + i * 7) % 18));
          gEl.innerHTML = '<div class="ai-bars">' + hs.map((h) => '<i style="height:' + h + 'px"></i>').join("") + '</div>';
        } else {
          const pos = tick % 4;
          gEl.innerHTML = '<div class="ai-gate">' + Array.from({ length: 4 }, (_, i) => '<i class="' + (i === pos ? 'is-hi' : i < pos ? 'is-ok' : '') + '"></i>').join("") + '</div>';
        }
      }

      btns.forEach((b) => b.addEventListener("click", () => { cur = +b.dataset.i; draw(); }, { signal: ctx.signal }));
      draw();

      let auto = !ctx.reduced();
      ctx.onHand(() => { auto = false; });
      if (!ctx.reduced()) ctx.every(140, () => { tick++; draw(); });
      if (auto) ctx.every(2400, () => { if (!auto) return; cur = (cur + 1) % MODES.length; draw(); });
    },
  });
})();

</script>

(function () {

  const ITEMS = [
    { name: "Run verification suite (18 checks)", cat: "EVAL", hue: "emerald", key: "⌘E" },
    { name: "Open pending diff in tokens.css", cat: "DIFF", hue: "coral", key: "⌘D" },

`,
    mount(host, ctx) {
      let q = "", sel = 1, last = "↑↓ MOVE · ⏎ RUN";

      host.innerHTML =
        '<div class="cm" data-col>' +
          '<div class="cm-top">' +
            '<span class="cm-k">CMD</span>' +
            '<input class="cm-in" id="cm-in" type="text" placeholder="Search commands..." autocomplete="off" aria-label="Search commands">' +
            '<span class="rk-mono" style="font-size:10px;color:var(--muted)" id="cm-cnt"></span>' +
          '</div>' +
          '<div class="cm-list" id="cm-list"></div>' +
          '<div class="cm-foot"><span id="cm-last"></span><span>0MS SNAP</span></div>' +
        '</div>';

      const inEl = host.querySelector("#cm-in");
      const listEl = host.querySelector("#cm-list");
      const cntEl = host.querySelector("#cm-cnt");
      const lastEl = host.querySelector("#cm-last");

      const rowsOf = () => {
        const s = q.trim().toLowerCase();
        return s ? ITEMS.filter((x) => (x.name + " " + x.cat).toLowerCase().includes(s)) : ITEMS;
      };

      function draw() {
        const rows = rowsOf();
        if (sel >= rows.length) sel = Math.max(0, rows.length - 1);
        cntEl.textContent = rows.length + "/" + ITEMS.length;
        lastEl.textContent = last;
        listEl.innerHTML = rows.map((r, i) =>
          '<button type="button" class="cm-row' + (i === sel ? ' is-sel' : '') + '" data-i="' + i + '">' +
            '<span class="cm-tag" data-h="' + r.hue + '">' + r.cat + '</span>' +
            '<span class="cm-txt">' + r.name + '</span>' +
            '<kbd class="cm-key">' + r.key + '</kbd>' +
          '</button>'
        ).join("") || '<div style="padding:12px;font:500 11px var(--mono);color:var(--muted)">No matching commands</div>';
        listEl.querySelectorAll(".cm-row").forEach((b) => {
          b.addEventListener("pointerenter", () => { sel = +b.dataset.i; draw(); });
          b.addEventListener("click", () => { last = "RAN: " + rows[+b.dataset.i].cat; draw(); });
        });
      }

      inEl.addEventListener("input", () => { q = inEl.value; sel = 0; draw(); }, { signal: ctx.signal });
      inEl.addEventListener("keydown", (e) => {
        const rows = rowsOf();
        if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % Math.max(1, rows.length); draw(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + rows.length) % Math.max(1, rows.length); draw(); }
        else if (e.key === "Enter" && rows[sel]) { e.preventDefault(); last = "RAN: " + rows[sel].cat; draw(); }
      }, { signal: ctx.signal });
      draw();

      let auto = !ctx.reduced();
      ctx.onHand(() => { auto = false; });
      if (auto) ctx.every(1300, () => { if (!auto) return; sel = (sel + 1) % 4; draw(); });
    },
  });
})();

</script>

`,
    mount(host, ctx) {
      const vals = FIELDS.map((f) => f.def);

      host.innerHTML =
        '<div class="vc" data-col>' +
          '<div class="vc-top"><span>Model parameters</span><button type="button" class="rk-btn" id="vc-rst">Reset</button></div>' +
          '<div class="vc-grid">' +
            FIELDS.map((f, i) =>
              '<div class="vc-item" data-i="' + i + '">' +
                '<div class="vc-lbl"><span>' + f.name + '</span><i class="vc-pip"></i></div>' +
                '<div class="vc-box" tabindex="0" role="slider" aria-label="' + f.name + '" data-i="' + i + '">' +
                  '<span class="vc-val"></span><span style="font-size:10px;opacity:0.55">↕</span>' +
                  '<i class="vc-bar" data-h="' + f.hue + '"></i>' +
                '</div>' +

        '</div>';

      const boxes = [...host.querySelectorAll(".vc-box")];
      const cnt = host.querySelector("#vc-cnt");

      function draw() {
        let mod = 0;
        FIELDS.forEach((f, i) => {
          const v = vals[i];
          const ch = Math.abs(v - f.def) > 1e-6;

          boxes[i].querySelector(".vc-val").textContent = f.fmt(v);

        });
        cnt.textContent = mod ? mod + " MODIFIED" : "DEFAULT";
      }

      boxes.forEach((b, i) => {
        const f = FIELDS[i];
        ctx.bindDrag(b, {
          min: f.min, max: f.max, step: f.step, def: f.def,
          get: () => vals[i], set: (v) => { vals[i] = v; draw(); }, signal: ctx.signal,
        });
      });
      host.querySelector("#vc-rst").addEventListener("click", () => { FIELDS.forEach((f, i) => { vals[i] = f.def; }); draw(); }, { signal: ctx.signal });

      const snaps = [[0.25, 8192, 30, 4], [0.75, 16384, 60, 8], [0.10, 4096, 15, 2]];

        draw();
      });

${S} .hc {
  width: min(100%, 380px); background: var(--cut); border: 1px solid var(--border);
  border-radius: var(--r-panel); padding: 16px; display: grid; gap: 12px;
}
${S} .hc-hd { display: flex; justify-content: space-between; align-items: baseline; }
${S} .hc-title { font-size: 14px; font-weight: 600; }
${S} .hc-sub { font: 500 11px/1 var(--mono); color: var(--muted); }
${S} .hc-btn {
  position: relative; height: 42px; width: 100%; border: 1px solid var(--border-strong);
  border-radius: var(--r-control); background: var(--surface-2); overflow: hidden;
  cursor: pointer; user-select: none; touch-action: none; padding: 0;
  display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
}
${S} .hc-fill {
  position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--coral); pointer-events: none;
}
${S} .hc-btn.is-done .hc-fill { width: 100%; background: var(--accent); }
${S} .hc-lbl { position: relative; z-index: 1; font-size: 13px; font-weight: 600; }
${S} .hc-pct {
  position: relative; z-index: 1; font: 600 10px/1 var(--mono);
  padding: 3px 6px; border: 1px solid var(--border-strong); border-radius: var(--r-control);
  background: var(--cut); color: var(--ink);
}
${S} .hc-btn.is-hold .hc-lbl { color: #fff; }
${S} .hc-btn.is-done .hc-lbl { color: var(--on-accent); }
${S} .hc-btn.is-done .hc-pct { background: var(--ink); color: var(--on-ink); }
${S}.is-tile .hc { padding: 12px; gap: 9px; }
${S}.is-tile .hc-btn { height: 36px; }
`,
    mount(host, ctx) {
      let pct = 0, holding = false, done = false, raf = 0, t0 = 0;

      host.innerHTML =
        '<div class="hc" data-col>' +
          '<div class="hc-hd"><span class="hc-title">Deploy production build</span><span class="hc-sub">v2.14.0 · 4 files</span></div>' +
          '<button type="button" class="hc-btn" id="hc-btn">' +
            '<i class="hc-fill" id="hc-fill"></i>' +
            '<span class="hc-lbl" id="hc-lbl">Hold to deploy</span>' +
            '<span class="hc-pct" id="hc-pct">0%</span>' +
          '</button>' +
        '</div>';

      const btn = host.querySelector("#hc-btn");
      const fill = host.querySelector("#hc-fill");
      const lbl = host.querySelector("#hc-lbl");
      const pctEl = host.querySelector("#hc-pct");

      function draw() {
        fill.style.width = pct.toFixed(1) + "%";
        btn.classList.toggle("is-hold", pct > 35 && !done);
        btn.classList.toggle("is-done", done);
        lbl.textContent = done ? "Deployed · click to reset" : holding ? "Keep holding..." : "Hold to deploy";
        pctEl.textContent = done ? "DONE" : Math.round(pct) + "%";
      }

      const step = (now) => {
        if (!holding) return;
        pct = Math.min(100, ((now - t0) / 900) * 100);
        if (pct >= 100) { done = true; holding = false; draw(); return; }
        draw();
        raf = requestAnimationFrame(step);
      };

      btn.addEventListener("pointerdown", (e) => {
        if (done) { done = false; pct = 0; draw(); return; }
        holding = true; t0 = performance.now(); btn.setPointerCapture(e.pointerId);
        raf = requestAnimationFrame(step);
      }, { signal: ctx.signal });
      const release = () => {
        if (!holding) return;
        holding = false; cancelAnimationFrame(raf);
        if (!done) { pct = 0; draw(); }
      };
      btn.addEventListener("pointerup", release, { signal: ctx.signal });
      btn.addEventListener("pointercancel", release, { signal: ctx.signal });

      pct = 58; draw();
      let auto = !ctx.reduced();
      ctx.onHand(() => { auto = false; pct = 0; done = false; draw(); });
      if (auto) ctx.every(120, () => {
        if (!auto) return;
        if (done) { done = false; pct = 0; }
        else { pct += 12; if (pct >= 100) { pct = 100; done = true; } }
        draw();
      });
    },
  });
})();

</script>

    mount(host, ctx) {
      let cur = 0, copied = false, timer = 0;

      host.innerHTML =
        '<div class="cbk" data-col>' +
          '<div class="cbk-hd">' +
            '<div class="cbk-tabs">' +
              FORMATS.map((f, i) => '<button type="button" class="cbk-tab" data-i="' + i + '" data-h="' + f.hue + '">' + f.label + '</button>').join("") +
            '</div>' +

          '</div>' +
          '<div class="cbk-body">' +
            '<code class="cbk-code" id="cbk-code"></code>' +
            '<button type="button" class="rk-btn cbk-copy" id="cbk-copy">Copy</button>' +
          '</div>' +
        '</div>';

      const tabs = [...host.querySelectorAll(".cbk-tab")];
      const code = host.querySelector("#cbk-code");
      const btn = host.querySelector("#cbk-copy");

      function draw() {
        const f = FORMATS[cur];
        tabs.forEach((t, i) => t.classList.toggle("is-on", i === cur));
        code.textContent = f.code;
        btn.classList.toggle("is-accent", copied);
        btn.textContent = copied ? "Copied ✓" : "Copy";
      }

      tabs.forEach((t) => t.addEventListener("click", () => { cur = +t.dataset.i; copied = false; draw(); }, { signal: ctx.signal }));
      btn.addEventListener("click", () => {
        copied = true; draw();
        try { navigator.clipboard && navigator.clipboard.writeText(FORMATS[cur].code); } catch (e) {}
        clearTimeout(timer);
        timer = ctx.after(1400, () => { copied = false; draw(); });
      }, { signal: ctx.signal });
      draw();

      let auto = !ctx.reduced();
      ctx.onHand(() => { auto = false; });
      if (auto) ctx.every(2200, () => {
        if (!auto) return;
        if (!copied) { copied = true; }
        else { copied = false; cur = (cur + 1) % FORMATS.length; }
        draw();
      });
    },
  });
})();

            FACETS.map((f) => {

              return '<button type="button" class="fb-chip" data-id="' + f.id + '" data-h="' + f.hue + '">' + f.label + ' <span class="fb-cnt">' + c + '</span></button>';
            }).join("") +
            '<button type="button" class="rk-btn" id="fb-all" style="margin-left:auto;height:24px;padding:0 7px;font-size:10px">All</button>' +
          '</div>' +
          '<div class="fb-list" id="fb-list"></div>' +
        '</div>';

      const chips = [...host.querySelectorAll(".fb-chip")];
      const listEl = host.querySelector("#fb-list");

      function draw() {
        chips.forEach((c) => c.classList.toggle("is-on", on.has(c.dataset.id)));
        const rows = on.size ? ROWS.filter((r) => on.has(r.cat)) : ROWS;
        listEl.innerHTML = rows.map((r) =>
          '<div class="fb-row"><i class="fb-dot" data-h="' + hueOf[r.cat] + '"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + r.title + '</span><span class="rk-mono" style="font-size:10px;color:var(--muted)">' + r.meta + '</span></div>'
        ).join("");
      }

      chips.forEach((c) => c.addEventListener("click", () => {
        const id = c.dataset.id;
        if (on.has(id)) on.delete(id); else on.add(id);
        draw();
      }, { signal: ctx.signal }));
      host.querySelector("#fb-all").addEventListener("click", () => { FACETS.forEach((f) => on.add(f.id)); draw(); }, { signal: ctx.signal });
      draw();

      const seq = [["agent", "diff", "eval"], ["eval", "policy"], ["agent", "coral" ? "diff" : "diff"], ["agent", "diff", "eval", "policy"]];
      let auto = !ctx.reduced(), idx = 0;
      ctx.onHand(() => { auto = false; });
      if (auto) ctx.every(2000, () => {
        if (!auto) return;
        on.clear();
        seq[++idx % seq.length].forEach((x) => on.add(x));
        draw();
      });
    },
  });
})();

</script>

<script>
/* 16-rack-motion.js */
/* 16-rack-motion.js — Cut & Stagger Motion:
   Live interactive lab for Rack's Emil-Kowalski motion language:
   0ms under a hand, 100ms opacity cut-in, 36ms column stagger, 75ms cut-out — zero springs, zero overshoot. */
(function () {
  const S = ".rs-rack-motion";
  const PRESETS = [
    { id: "hand", label: "0ms Hand", dur: 0, stag: 0, d: "M16 74 L16 14 L224 14", note: "Direct manipulation tracks 1:1 on the frame — zero lag." },
    { id: "in", label: "100ms Cut-In", dur: 100, stag: 36, d: "M16 74 Q42 16 132 14 L224 14", note: "Panels cut in by opacity in 100ms, columns launch 36ms apart." },
    { id: "out", label: "75ms Cut-Out", dur: 75, stag: 0, d: "M16 14 Q44 70 108 74 L224 74", note: "Exits finish faster than enters — 75ms crisp ease-out." },
  ];
  const COLS = [
    { k: "C1", h: "blue" }, { k: "C2", h: "violet" }, { k: "C3", h: "emerald" }, { k: "C4", h: "coral" }, { k: "C5", h: "pink" },
  ];

  RackPlayer.register({
    slug: "rack-motion",
    title: "Cut & Stagger Motion",
    category: "control",
    tagline: "Rack's Emil-Kowalski timing bench: 0ms under the hand, 100ms cut-in, 36ms stagger, 75ms exit.",
    motion: "0ms hand · 100ms in · 75ms out",
    css: `
${S} .rm {
  width: min(100%, 490px); background: var(--cut); border: 1px solid var(--border);
  border-radius: var(--r-panel); padding: 12px; display: grid; gap: 10px;
}
${S} .rm-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
${S} .rm-mid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 8px; }
${S} .rm-svg {
  width: 100%; height: 92px; display: block; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--r-control);
}
${S} .rm-cols {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; align-items: stretch;
  padding: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-control);
}
${S} .rm-blk {
  border-radius: var(--r-control); display: grid; place-items: center;
  font: 600 10px/1 var(--mono); color: #fff;
}
${S} .rm-blk[data-h="blue"] { background: var(--blue); }
${S} .rm-blk[data-h="violet"] { background: var(--violet); }
${S} .rm-blk[data-h="emerald"] { background: var(--emerald); }
${S} .rm-blk[data-h="coral"] { background: var(--coral); }
${S} .rm-blk[data-h="pink"] { background: var(--pink); }
${S} .rm-foot {
  display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted);
}
${S} .rm-foot span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
${S}.is-tile .rm { padding: 9px; gap: 7px; }
${S}.is-tile .rm-svg { height: 74px; }
${S}.is-tile .rm-top .rk-seg button, ${S}.is-tile .rm-top .rk-btn { height: 22px; padding: 0 7px; font-size: 10px; }
${S}.is-tile .rm-foot { font-size: 10px; }
`,
    mount(host, ctx) {
      let cur = 1;

      host.innerHTML =
        '<div class="rm" data-col>' +
          '<div class="rm-top">' +
            '<div class="rk-seg is-yellow" role="radiogroup">' +
              PRESETS.map((p, i) => '<button type="button" role="radio" data-i="' + i + '" aria-checked="' + (i === 1) + '">' + p.label + '</button>').join("") +
            '</div>' +
            '<button type="button" class="rk-btn is-accent" id="rm-play">Replay</button>' +
          '</div>' +
          '<div class="rm-mid">' +
            '<svg class="rm-svg" viewBox="0 0 240 88"><path id="rm-fill" fill="var(--blue-tint)"/><path id="rm-path" fill="none" stroke="var(--blue)" stroke-width="2.5"/></svg>' +
            '<div class="rm-cols">' + COLS.map((c) => '<div class="rm-blk" data-h="' + c.h + '">' + c.k + '</div>').join("") + '</div>' +
          '</div>' +
          '<div class="rm-foot"><span id="rm-note"></span><span class="rk-mono" style="color:var(--ink);flex:none">ZERO SPRINGS</span></div>' +
        '</div>';

      const btns = [...host.querySelectorAll("[role=radio]")];
      const path = host.querySelector("#rm-path");
      const fill = host.querySelector("#rm-fill");
      const note = host.querySelector("#rm-note");
      const blks = [...host.querySelectorAll(".rm-blk")];

      function draw() {
        const p = PRESETS[cur];
        btns.forEach((b, i) => b.setAttribute("aria-checked", String(i === cur)));
        path.setAttribute("d", p.d);
        fill.setAttribute("d", p.d + " L224 74 L16 74 Z");
        note.textContent = p.note;
      }

      function play() {
        if (ctx.reduced() || ctx.tile) return;
        const p = PRESETS[cur];
        blks.forEach((el, i) => {
          if (!el.animate) return;
          if (p.id === "out") el.animate([{ opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }], { duration: 150, easing: "ease-out" });
          else el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: Math.max(16, p.dur), delay: i * p.stag, easing: "ease-out", fill: "backwards" });
        });
      }

      btns.forEach((b) => b.addEventListener("click", () => { cur = +b.dataset.i; draw(); play(); }, { signal: ctx.signal }));
      host.querySelector("#rm-play").addEventListener("click", play, { signal: ctx.signal });
      draw();
    },
  });
})();

</script>
<script>
(function () {
  const P = window.RackPlayer;
  const ORDER = [
    "agent-status", "agent-trace", "agent-indicators", "command-menu",
    "value-controls", "segmented-switch", "permission-gate", "context-budget",
    "diff-review", "hold-confirm", "eval-matrix", "toast-queue",
    "copy-block", "facet-bar", "metric-strip", "rack-motion"
  ];
  const set = ORDER.map((slug) => P.studies.find((s) => s.slug === slug)).filter(Boolean);
  const n = set.length;
  const $ = (id) => document.getElementById(id);
  const wall = $("rg-wall"), sheet = $("rg-sheet"), openEl = $("rg-open"), live = $("rg-live");

  function mountInto(box, s, tile) {
    box.textContent = "";
    const host = document.createElement("div");
    host.className = "rp-mount rs-" + s.slug + (tile ? " is-tile" : "");
    host.dataset.study = s.slug;
    box.appendChild(host);
    const ac = new AbortController();
    const rec = { ac, timers: [], intervals: [], hands: [], api: null, host };
    const ctx = {
      host, signal: ac.signal, reduced: P.reduced, tile: !!tile,
      cutIn: P.cutIn, staggerColumns: P.staggerColumns, bindDrag: P.bindDrag,
      after(ms, fn) { const t = setTimeout(fn, ms); rec.timers.push(t); return t; },
      every(ms, fn) { const t = setInterval(fn, ms); rec.intervals.push(t); return t; },
      onHand(fn) { rec.hands.push(fn); },
    };
    let handed = false;
    const hand = () => {
      if (!handed) {
        handed = true;
        rec.hands.forEach((f) => { try { f(); } catch (e) { console.error(e); } });
      }
    };
    if (!tile) {
      for (const t of ["pointerdown", "keydown", "wheel"]) {
        host.addEventListener(t, hand, { signal: ac.signal, capture: true, passive: t === "wheel" });
      }
    }
    try { rec.api = s.mount(host, ctx) || null; }
    catch (e) { console.error(s.slug, e); host.textContent = s.title; }
    return rec;
  }

  function unmount(rec) {
    if (!rec) return;
    try { rec.api && rec.api.destroy && rec.api.destroy(); } catch (e) { console.error(e); }
    rec.ac.abort();
    rec.timers.forEach(clearTimeout);
    rec.intervals.forEach(clearInterval);
    rec.host.remove();
  }

  const tiles = set.map((s, i) => {
    const li = document.createElement("li");
    li.dataset.cat = s.category || "control";
    li.innerHTML =
      '<button class="rg-tile" type="button">' +
        '<div class="rg-stage" inert></div>' +
        '<span class="rg-name"><b></b><span></span></span>' +
      '</button>';
    const btn = li.firstChild, stage = btn.querySelector(".rg-stage");
    btn.querySelector("b").textContent = s.title;
    btn.querySelector(".rg-name span").textContent = s.tagline || "";
    btn.setAttribute("aria-label", "Open " + s.title);
    btn.addEventListener("click", () => open(i));
    wall.appendChild(li);
    return { s, li, btn, stage, rec: null, visible: false };
  });

  let sheetOpen = false;
  const sync = (t) => {
    const want = t.visible && !sheetOpen && !t.li.hidden;
    if (want && !t.rec) t.rec = mountInto(t.stage, t.s, true);
    if (!want && t.rec) { unmount(t.rec); t.rec = null; }
  };
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      const t = tiles.find((x) => x.stage === e.target);
      if (t) { t.visible = e.isIntersecting; sync(t); }
    }
  }, { rootMargin: "200px 0px" });
  tiles.forEach((t) => {
    io.observe(t.stage);
    const r = t.stage.getBoundingClientRect();
    if (r.top < window.innerHeight + 200 && r.bottom > -200) { t.visible = true; sync(t); }
  });

  const filterBtns = [...$("rg-filter").querySelectorAll("button")];
  filterBtns.forEach((b) => b.addEventListener("click", () => {
    const cat = b.dataset.cat; let shown = 0;
    tiles.forEach((t) => {
      const hide = cat !== "all" && t.li.dataset.cat !== cat;
      t.li.hidden = hide; if (!hide) shown++; sync(t);
    });
    filterBtns.forEach((x) => x.setAttribute("aria-checked", String(x.dataset.cat === cat)));
    $("rg-count").textContent = shown + " / " + n;
  }));

  let cur = -1, openRec = null;
  function show(i) {
    cur = ((i % n) + n) % n;
    const s = set[cur];
    unmount(openRec);
    openRec = mountInto(openEl, s, false);
    P.cutIn(openRec.host, 0);
    requestAnimationFrame(() => P.staggerColumns(openRec.host, "[data-col]"));
    $("rg-sheet-title").textContent = s.title + " · " + (cur + 1) + " / " + n;
    $("rg-about").innerHTML = '<div><b></b><span></span></div><span class="rk-mono" style="font-size:11px">' + (s.motion || "0ms under hand · 100ms cut-in") + '</span>';
    $("rg-about").querySelector("b").textContent = s.title;
    $("rg-about").querySelector("div span").textContent = s.tagline || "";
    try { history.replaceState(null, "", "#" + s.slug); } catch (e) {}
    document.title = s.title + " · Rack Studies";
    live.textContent = s.title + ", " + (cur + 1) + " of " + n;
  }

  function open(i) {
    sheetOpen = true; tiles.forEach(sync);
    sheet.classList.add("is-open"); document.body.style.overflow = "hidden";
    $("rg-wall").inert = true;
    P.cutIn(sheet, 0);
    show(i);
    $("rg-close").focus({ preventScroll: true });
  }

  function close() {
    if (!sheetOpen) return;
    const finish = () => {
      unmount(openRec); openRec = null;
      sheet.classList.remove("is-open"); document.body.style.overflow = "";
      $("rg-wall").inert = false; sheetOpen = false;
      const back = tiles[cur].btn; tiles.forEach(sync);
      back.focus({ preventScroll: true }); back.scrollIntoView({ block: "nearest" });
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      document.title = "Rack Studies";
    };
    if (!P.reduced() && sheet.animate) sheet.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 75, easing: "ease-out" }).onfinish = finish;
    else finish();
  }

  $("rg-close").addEventListener("click", close);
  $("rg-prev").addEventListener("click", () => show(cur - 1));
  $("rg-next").addEventListener("click", () => show(cur + 1));
  sheet.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); close(); }
    if (e.key === "ArrowLeft" && !e.target.closest("input,[role=slider],[role=radio]")) { e.preventDefault(); show(cur - 1); }
    if (e.key === "ArrowRight" && !e.target.closest("input,[role=slider],[role=radio]")) { e.preventDefault(); show(cur + 1); }
  });

  const qTheme = new URLSearchParams(location.search).get("theme");
  if (qTheme === "light" || qTheme === "dark") document.documentElement.dataset.theme = qTheme;
  const lightBtn = $("rg-light"), darkBtn = $("rg-dark");
  const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const paintTheme = () => {
    const d = isDark();
    lightBtn.setAttribute("aria-pressed", String(!d));
    darkBtn.setAttribute("aria-pressed", String(d));
  };
  lightBtn.addEventListener("click", () => { document.documentElement.dataset.theme = "light"; paintTheme(); });
  darkBtn.addEventListener("click", () => { document.documentElement.dataset.theme = "dark"; paintTheme(); });
  paintTheme();

  const start = set.findIndex((s) => s.slug === location.hash.slice(1));
  if (start >= 0) open(start);
  window.RackGallery = { open: (slug) => { const i = set.findIndex((s) => s.slug === slug); if (i >= 0) open(i); }, close };
})();
</script>
