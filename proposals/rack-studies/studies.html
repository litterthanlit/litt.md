<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rack 2.0 Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Rack (litt-md, taste/litt-principles.md "Rack, the module"; proposals/rack.md): after Ableton Live. A grey body, flat
   panels a step lighter with no edge, every control a square box in a 1px outline, small exact values in tabular
   figures, colour that belongs to what you make (clips, tracks), one yellow lit only inside an on key. Square: 2px
   controls in 6px panels. Rack 2.0: the clip colours retuned as one family of layer colours (a soft tint, a crisp edge in the hue, its name in the
   hue's text tone; every name 4.5:1 on its tint and every edge 3:1, both themes). */
:root {
  --body: #c8c8c8; --panel: #e2e2e2; --panel-2: #d7d7d7; --panel-3: #cdcdcd; --line: #b5b5b5; --line-strong: #a2a2a2;
  --control: #6c6c6c; --ink: #111111; --muted: #434343; --disabled: #8a8a8a;
  --tray: #b9b9b9; --cut: #f3f3f3; --block: #ededed; --block-hover: #d7d7d7; --slot: #b0b0b0; --slot-fill: #5a5a5a; --cap: #f6f6f6;
  --accent: #ffc933; --accent-hover: #ffd35c; --accent-fg: #111111; --accent-tint: #ebdcb9;
  --success: #00601f; --warning: #824200; --danger: #a60e1d;
  --clip-blue: #2f7bf5; --clip-blue-text: #1a4fb3; --clip-blue-tint: #d9e8ff;
  --clip-orange: #cc610a; --clip-orange-text: #9a4300; --clip-orange-tint: #ffe5cc;
  --clip-cyan: #0e8a82; --clip-cyan-text: #0b6660; --clip-cyan-tint: #d0f2ee;
  --clip-purple: #7c5cf0; --clip-purple-text: #4a2fb8; --clip-purple-tint: #e6defd;
  --clip-green: #2f8a3c; --clip-green-text: #1f6a2b; --clip-green-tint: #daf1d6;
  --clip-pink: #e0438f; --clip-pink-text: #9c1e5e; --clip-pink-tint: #fddbeb;
  --edge: 0 0 0 1px rgb(0 0 0 / 0.38); --edge-press: 0 0 0 1px rgb(0 0 0 / 0.7);
  --font: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-control: 2px; --r-panel: 6px;
  /* Motion: on the beat. A thing cuts in by opacity on the instant tier and stops quicker; nothing travels or bounces. */
  --cut-in: 100ms; --cut-out: 75ms; --beat: 60ms; --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --body: #161616; --panel: #262626; --panel-2: #2d2d2d; --panel-3: #353535; --line: #3a3a3a; --line-strong: #4a4a4a;
  --control: #787878; --ink: #ececec; --muted: #bebebe; --disabled: #5c5c5c;
  --tray: #101010; --cut: #1b1b1b; --block: #3b3b3b; --block-hover: #454545; --slot: #101010; --slot-fill: #9a9a9a; --cap: #cfcfcf;
  --accent: #ffc933; --accent-hover: #ffd35c; --accent-fg: #111111; --accent-tint: #443d2e;
  --success: #4dc882; --warning: #eba42b; --danger: #ff948d;
  --clip-blue: #5a9bff; --clip-blue-text: #b3d0ff; --clip-blue-tint: #16294a;
  --clip-orange: #f59a4a; --clip-orange-text: #ffd0a6; --clip-orange-tint: #3e2711;
  --clip-cyan: #34c2b8; --clip-cyan-text: #98e6df; --clip-cyan-tint: #0f3432;
  --clip-purple: #a08cff; --clip-purple-text: #d1c7ff; --clip-purple-tint: #2b2452;
  --clip-green: #62bb6e; --clip-green-text: #b0e3b4; --clip-green-tint: #17331b;
  --clip-pink: #f070b0; --clip-pink-text: #ffbadb; --clip-pink-tint: #3e1830;
  --edge: 0 0 0 1px rgb(0 0 0 / 0.6); --edge-press: 0 0 0 1px rgb(0 0 0 / 0.85); color-scheme: dark } }
:root[data-theme="dark"] {
  --body: #161616; --panel: #262626; --panel-2: #2d2d2d; --panel-3: #353535; --line: #3a3a3a; --line-strong: #4a4a4a;
  --control: #787878; --ink: #ececec; --muted: #bebebe; --disabled: #5c5c5c;
  --tray: #101010; --cut: #1b1b1b; --block: #3b3b3b; --block-hover: #454545; --slot: #101010; --slot-fill: #9a9a9a; --cap: #cfcfcf;
  --accent: #ffc933; --accent-hover: #ffd35c; --accent-fg: #111111; --accent-tint: #443d2e;
  --success: #4dc882; --warning: #eba42b; --danger: #ff948d;
  --clip-blue: #5a9bff; --clip-blue-text: #b3d0ff; --clip-blue-tint: #16294a;
  --clip-orange: #f59a4a; --clip-orange-text: #ffd0a6; --clip-orange-tint: #3e2711;
  --clip-cyan: #34c2b8; --clip-cyan-text: #98e6df; --clip-cyan-tint: #0f3432;
  --clip-purple: #a08cff; --clip-purple-text: #d1c7ff; --clip-purple-tint: #2b2452;
  --clip-green: #62bb6e; --clip-green-text: #b0e3b4; --clip-green-tint: #17331b;
  --clip-pink: #f070b0; --clip-pink-text: #ffbadb; --clip-pink-tint: #3e1830;
  --edge: 0 0 0 1px rgb(0 0 0 / 0.6); --edge-press: 0 0 0 1px rgb(0 0 0 / 0.85); color-scheme: dark }
@media (prefers-reduced-motion: reduce) { :root { --cut-in: 0ms; --cut-out: 0ms; --beat: 0ms } }

*, *::before, *::after { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--body); color: var(--ink); font: 400 13px/1.45 var(--font); letter-spacing: 0;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)) }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }

/* The gallery: Rack's session. The grey body; each study a panel cell, live at a small size, its name in the strip
   under it; a cell opens the study large in a view that cuts in where it stands. */
.fg { max-width: 1280px; margin: 0 auto; padding: 24px 4px 64px }
.fg-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin: 0 0 20px }
.fg-head h1 { margin: 0; font: 600 20px/1.2 var(--font); letter-spacing: -0.01em }
.fg-head p { margin: 4px 0 0; color: var(--muted); max-width: 60ch }
.fg-pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: var(--r-control);
  background: var(--block); box-shadow: var(--edge); color: var(--ink); font: 500 12px var(--font); cursor: pointer;
  transition: background-color var(--cut-in) var(--ease-out) }
.fg-pill:hover { background: var(--block-hover) }
.fg-pill:active { box-shadow: var(--edge-press) }
.fg-wall { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 8px }
.fg-tile { display: grid; width: 100%; padding: 0; border: 0; background: var(--panel); border-radius: var(--r-panel); text-align: left; cursor: pointer; overflow: hidden }
.fg-stage { position: relative; height: 270px; background: var(--panel); overflow: hidden; display: grid; place-items: center }
.fg-tile:hover .fg-name { background: var(--panel-3) }
.fg-stage > .fp-mount { width: 100%; height: 100%; display: grid; place-items: center; padding: 12px; container-type: inline-size; pointer-events: none }
.fg-name { display: flex; align-items: baseline; gap: 8px; padding: 7px 10px; min-width: 0; background: var(--panel-2); transition: background-color var(--cut-in) var(--ease-out) }
.fg-name b { font-weight: 600; font-size: 12px; white-space: nowrap; flex: none }
.fg-name span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }

/* The open study: a view on the body that cuts in. */
.fg-sheet { position: fixed; inset: 0; z-index: 10; display: none; background: var(--body); overflow: auto; overscroll-behavior: contain }
.fg-sheet.is-open { display: grid; grid-template-rows: auto 1fr auto }
.fg-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 12px; background: var(--panel-2) }
.fg-bar h2 { margin: 0; font: 600 13px/1.2 var(--font); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.fg-bar .fg-close { justify-self: start } .fg-bar .fg-steps { justify-self: end; display: flex; gap: 4px }
.fg-circle { width: 28px; height: 26px; display: grid; place-items: center; border: 0; border-radius: var(--r-control); background: var(--block); box-shadow: var(--edge); color: var(--ink); cursor: pointer }
.fg-circle:hover { background: var(--block-hover) } .fg-circle:active { box-shadow: var(--edge-press) }
.fg-circle svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter }
.fg-open { display: grid; place-items: center; min-height: 0; padding: 20px 12px }
.fg-open > .fp-mount { width: min(100%, 980px); min-height: min(560px, 100%); display: grid; place-items: center; container-type: inline-size }
.fg-about { max-width: 640px; margin: 0 auto; padding: 0 16px 24px; text-align: center; color: var(--muted) }
.fg-about b { display: block; color: var(--ink); font-weight: 500; font-size: 13px }
.fg-foot { margin-top: 32px; color: var(--muted); font-size: 12px }
@media (max-width: 720px) { .fg-stage { height: 250px } }
</style>
</head>
<body>
<main class="fg">
  <header class="fg-head">
    <div><h1>Rack 2.0</h1><p>Small studies in motion, feedback and touch, after litterthanlit/components, redesigned in litt's Rack: a pro tool for agents, design and interfaces, after Live's grammar. Every value in reach, on the beat.</p></div>
    <button class="fg-pill" type="button" id="fg-theme">Dark</button>
  </header>
  <ul class="fg-wall" id="fg-wall"></ul>
  <p class="fg-foot">Each study runs by itself until you touch it. Open one to use it.</p>
</main>
<div class="fg-sheet" id="fg-sheet" role="dialog" aria-modal="true" aria-labelledby="fg-sheet-title">
  <div class="fg-bar">
    <button class="fg-circle fg-close" type="button" id="fg-close" aria-label="Close"><svg viewBox="0 0 14 14"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg></button>
    <h2 id="fg-sheet-title"></h2>
    <div class="fg-steps">
      <button class="fg-circle" type="button" id="fg-prev" aria-label="Previous study"><svg viewBox="0 0 14 14"><path d="M9 3.5 5.5 7 9 10.5"/></svg></button>
      <button class="fg-circle" type="button" id="fg-next" aria-label="Next study"><svg viewBox="0 0 14 14"><path d="M5 3.5 8.5 7 5 10.5"/></svg></button>
    </div>
  </div>
  <div class="fg-open" id="fg-open"></div>
  <p class="fg-about" id="fg-about"></p>
</div>
<p class="sr-only" id="fg-live" aria-live="polite"></p>
<script>
/* The contract every study keeps (FlatPlayer.register), and the one spring they share. */
window.FlatPlayer = (function () {
  const studies = [];
  const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  /* A damped spring, stepped at 1/240s. bounce 0 is critically damped; 0.28 is Flat's expressive arrival. */
  function spring(initial, onUpdate, opts) {
    const o = Object.assign({ duration: 0.35, bounce: 0 }, opts);
    const w = (2 * Math.PI) / o.duration, k = w * w, c = 2 * (1 - o.bounce) * w;
    let x = initial, v = 0, target = initial, raf = 0, last = 0;
    const step = (now) => {
      let dt = Math.min(0.064, (now - last) / 1000); last = now;
      while (dt > 0) { const h = Math.min(dt, 1 / 240); v += (-k * (x - target) - c * v) * h; x += v * h; dt -= h; }
      if (Math.abs(x - target) < 0.0005 && Math.abs(v) < 0.0005) { x = target; v = 0; raf = 0; onUpdate(x); return; }
      onUpdate(x); raf = requestAnimationFrame(step);
    };
    return {
      set(t, velocity) { target = t; if (velocity !== undefined) v = velocity;
        if (reduced()) { x = t; v = 0; onUpdate(x); return; }
        if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } },
      jump(t) { x = target = t; v = 0; if (raf) cancelAnimationFrame(raf); raf = 0; onUpdate(x); },
      value: () => x, velocity: () => v, target: () => target,
      stop() { if (raf) cancelAnimationFrame(raf); raf = 0; },
    };
  }
  return { studies, spring, reduced, register(s) {
    studies.push(s);
    if (s.css) { const st = document.createElement("style"); st.dataset.study = s.slug; st.textContent = s.css; document.head.appendChild(st); }
  } };
})();
</script>
<script>
/* agent-indicators.js */
/* Agent Indicators, after litterthanlit/components, Rack 2.0: what a run is doing, as one lane of four agents.
   Each agent is a clip in its colour (Planner purple, Researcher blue, Coder orange, Reviewer green): a soft tint,
   a 1px edge in its hue, its name in the hue's text tone, and under it what it is doing. The run hands from one to
   the next on a steady 0.5s tick, four ticks each; the working clip carries a progress bar in its hue, the only
   thing time moves. A hand launches an agent itself, on the next tick (it shows queued until then), and it keeps
   working; Run stops time. Nothing travels: a hand-off is a cut on the frame. */
(function () {
  const S = ".fs-agent-indicators";
  const TICK = 0.5, TICKS = 4;
  const AGENTS = [
    { name: "Planner", hue: "purple", doing: "Thinking it through" },
    { name: "Researcher", hue: "blue", doing: "Searching 12 sources" },
    { name: "Coder", hue: "orange", doing: "Writing the patch" },
    { name: "Reviewer", hue: "green", doing: "Checking 8 tests" },
  ];

  FlatPlayer.register({
    slug: "agent-indicators",
    title: "Agent Indicators",
    tagline: "What a run is doing: four agents on one lane, the working one filling.",
    css: `
${S} .ai { width: min(100%, 620px); background: var(--panel); border-radius: var(--r-panel); overflow: hidden; font-size: 12px }
${S} .ai-strip { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 12px; background: var(--panel-2) }
${S} .ai-strip b { font-weight: 600; margin-right: auto }
${S} .ai-box, ${S} .ai-key { height: 22px; padding: 0 8px; border: 0; border-radius: var(--r-control); box-shadow: var(--edge); font: 600 11px/22px var(--mono) }
${S} .ai-box { background: var(--cut); min-width: 58px; text-align: right }
${S} .ai-key { background: var(--block); font-family: var(--font); cursor: pointer }
${S} .ai-key:hover { background: var(--block-hover) }
${S} .ai-key:active { box-shadow: var(--edge-press); transform: scale(0.98) }
${S} .ai-key[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
${S} .ai-lane { margin: 14px; padding: 8px; background: var(--panel-2); border-radius: var(--r-control); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px }
${S} .ai-clip { position: relative; display: grid; align-content: start; gap: 6px; min-width: 0; height: 96px; padding: 7px 8px 12px; border: 0; border-radius: var(--r-control);
  background: var(--tint); box-shadow: inset 0 0 0 1px var(--hue); color: var(--ink); text-align: left; cursor: pointer; overflow: hidden }
${S} .ai-clip.is-in { opacity: 0 }
${S} .ai-clip.is-cut { opacity: 1; transition: opacity var(--cut-in) var(--ease-out) }
${S} .ai-name { color: var(--text); font-weight: 600; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
${S} .ai-doing { font-size: 11px; line-height: 1.35; color: var(--muted) }
${S} .ai-clip[data-state="working"] { box-shadow: inset 0 0 0 2px var(--hue) }
${S} .ai-clip[data-state="working"] .ai-doing { color: var(--ink) }
${S} .ai-clip[data-state="queued"] { box-shadow: inset 0 0 0 1px var(--hue), inset 0 0 0 3px var(--tint), inset 0 0 0 4px var(--hue) }
${S} .ai-track { position: absolute; left: 8px; right: 8px; bottom: 7px; height: 3px; background: color-mix(in oklab, var(--hue) 25%, transparent); visibility: hidden }
${S} .ai-bar { position: absolute; inset: 0; background: var(--hue); transform-origin: left; transform: scaleX(0) }
${S} .ai-clip[data-state="working"] .ai-track { visibility: visible }
${S} .ai-clip[data-state="stopped"] .ai-doing { visibility: hidden }
@container (max-width: 420px) { ${S} .ai-lane { margin: 10px; padding: 6px; gap: 4px } ${S} .ai-clip { height: 88px; padding: 6px 5px 12px } ${S} .ai-name { font-size: 10px } ${S} .ai-track { left: 5px; right: 5px } }
`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="ai">
  <div class="ai-strip"><b>Run 3</b><span class="ai-box" aria-hidden="true">0:00.0</span><button class="ai-key" type="button" aria-pressed="true">Run</button></div>
  <div class="ai-lane" role="radiogroup" aria-label="Agents"></div>
  <p class="sr-only" aria-live="polite"></p>
</div>`;
      const clock = host.querySelector(".ai-box"), key = host.querySelector(".ai-key"), lane = host.querySelector(".ai-lane"), live = host.querySelector("[aria-live]");
      if (ctx.tile) key.tabIndex = -1;
      const clips = AGENTS.map((a, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "ai-clip"; b.setAttribute("role", "radio"); b.setAttribute("aria-label", a.name + ", " + a.doing);
        for (const [k, v] of [["--hue", ""], ["--tint", "-tint"], ["--text", "-text"]]) b.style.setProperty(k, "var(--clip-" + a.hue + v + ")");
        b.innerHTML = '<span class="ai-name"></span><span class="ai-doing"></span><span class="ai-track"><span class="ai-bar"></span></span>';
        b.querySelector(".ai-name").textContent = a.name;
        b.querySelector(".ai-doing").textContent = a.doing;
        b.tabIndex = ctx.tile ? -1 : i === 0 ? 0 : -1;
        lane.appendChild(b);
        return { b, bar: b.querySelector(".ai-bar") };
      });

      let playing = !ctx.reduced(), auto = playing, t = 0, current = 0, queued = -1, since = 0;
      function paint() {
        const p = Math.min(1, ((t - since) / TICK % TICKS) / TICKS);
        clips.forEach((c, i) => {
          const state = i === current ? "working" : i === queued ? "queued" : "stopped";
          if (c.b.dataset.state !== state) { c.b.dataset.state = state; c.b.setAttribute("aria-checked", String(i === current)); }
        });
        clips[current].bar.style.transform = "scaleX(" + p.toFixed(4) + ")";
        const m = Math.floor(t / 60), s = t - m * 60;
        clock.textContent = m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
      }
      function launch(i, said) {
        current = i; queued = -1; since = t;
        if (!ctx.tile) clips.forEach((c, j) => (c.b.tabIndex = j === i ? 0 : -1));
        if (said) live.textContent = AGENTS[i].name + ": " + AGENTS[i].doing;
      }
      paint();
      // The lane comes in a column at a time, a tick (60ms) apart.
      if (!ctx.reduced()) clips.forEach((c, i) => { c.b.classList.add("is-in"); ctx.after(60 * i + 16, () => c.b.classList.add("is-cut")); ctx.after(60 * i + 200, () => c.b.classList.remove("is-in", "is-cut")); });
      if (!playing) key.setAttribute("aria-pressed", "false");

      ctx.loop((dt) => {
        if (!playing) return;
        const before = Math.floor(t / TICK);
        t += dt;
        const tick = Math.floor(t / TICK);
        if (tick !== before) {
          if (queued >= 0) launch(queued, true);
          else if (auto && tick - Math.round(since / TICK) >= TICKS) launch((current + 1) % AGENTS.length, false);
        }
        paint();
      });

      const setPlaying = (on) => { playing = on; key.setAttribute("aria-pressed", String(on)); live.textContent = on ? "Running" : "Stopped"; };
      ctx.onHand(() => { auto = false; });
      key.addEventListener("click", () => { auto = false; setPlaying(!playing); }, { signal: ctx.signal });
      clips.forEach((c, i) => {
        c.b.addEventListener("click", () => {
          auto = false;
          if (!playing) { setPlaying(true); launch(i, true); paint(); return; }
          if (i === current) return;
          queued = i; paint();
          live.textContent = AGENTS[i].name + " queued";
        }, { signal: ctx.signal });
        c.b.addEventListener("keydown", (e) => {
          const n = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: AGENTS.length - 1 }[e.key];
          if (n === undefined) return;
          e.preventDefault();
          const k = (n + AGENTS.length) % AGENTS.length;
          clips.forEach((x, j) => (x.b.tabIndex = j === k ? 0 : -1));
          clips[k].b.focus(); clips[k].b.click();
        }, { signal: ctx.signal });
      });
    },
  });
})();

</script>
<script>
/* agent-loaders.js */
/* Agent Loaders, after litterthanlit/components, redesigned in Rack 2.0.
   The product underneath is how an agent console says work is happening. One surface holds the run's three agents
   (Planner purple, Coder orange, Reviewer green), each one object in its colour. The working one carries the loaders:
   a stepping square spinner beside the tool it is calling, and its steps as a row of segments that fill one by one.
   The others say Waiting or Done. One steady tick drives it all, only while the lit Run key is on. */
(function () {
  const TICK = 120, STEP_TICKS = 8;
  const AGENTS = [
    { name: "Planner", hue: "purple", tools: ["read_spec", "plan", "split_tasks", "plan"] },
    { name: "Coder", hue: "orange", tools: ["read_file", "edit_file", "run_tests", "edit_file", "run_tests", "lint", "commit"] },

    mount(host, ctx) {

</div>`;
      const surface = host.querySelector(".rk-surface"), clockEl = host.querySelector(".rk-clock"), run = host.querySelector(".rk-run"), live = host.querySelector("[aria-live]");
      const lanes = AGENTS.map((a) => {
        const li = document.createElement("li");
        li.className = "rk-a";
        li.style.setProperty("--c", `var(--clip-${a.hue})`); li.style.setProperty("--c-tint", `var(--clip-${a.hue}-tint)`); li.style.setProperty("--c-text", `var(--clip-${a.hue}-text)`);
        li.innerHTML = `<b>${a.name}</b><span class="rk-state" aria-hidden="true"><span class="rk-spin"><i></i><i></i><i></i><i></i></span><span class="rk-tool"></span></span>

        surface.appendChild(li);

      });

      const fmt = (t) => Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0");

      function draw(L) {

      run.addEventListener("click", () => {
        if (!running && lanes.every((L) => L.state === "done")) reset();
        running = !running; last = performance.now(); renderRun();
        live.textContent = running ? "Run 12 running" : "Run 12 paused";
      }, { signal: S });
      ctx.onHand(() => { ghost = false; });

      reset();
      if (reduced) { lanes[0].state = "done"; lanes[1].state = "working"; lanes[1].step = 2; lanes.forEach(draw); }
      renderRun();
    },
  });
})();

<script>
/* agent-run.js */
/* Agent Run, in Rack: one agent turn as a run. The agent's lane gathers clips as it works: Think in purple, then each
   tool call a clip in its tool's colour (Read blue, Search cyan, Edit orange), growing with the clock while it runs. One
   readout is the run's clock; a box counts tokens. Steps list under the lane until the work is done, then fold into
   "3 tool calls, 4.2 s" and the answer streams into the output panel behind a still caret. Run is the lit key while the
   run is going. Time moves the clips and the words; everything else cuts. Screen readers hear each phase, not every word. */
(function () {
  const TOOLS = { Think: "purple", Read: "blue", Search: "cyan", Edit: "orange" };
  const STEPS = [
    { verb: "Read", target: "src/registry/index.ts", detail: "142 lines" },
    { verb: "Search", target: "createSpring", detail: "4 results" },

  let n = 0;

  FlatPlayer.register({
    slug: "agent-run",

    tagline: "Think, run tools, fold it away, stream the answer.",
    css: `
.fs-agent-run .ar { width: min(380px, 100%); font: 400 12px/1.4 var(--font); background: var(--body); padding: 3px; border-radius: 8px; display: grid; gap: 3px;

  font: 500 12px var(--font); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: background-color var(--cut-in) var(--ease-out), color var(--cut-in) var(--ease-out) }

@keyframes ar-in { from { opacity: 0 } }

.fs-agent-run .ar-fold[aria-expanded="true"] svg { transform: rotate(90deg) }

@container (min-width: 560px) { .fs-agent-run .ar { width: 500px; font-size: 13px } }
`,
    mount(host, ctx) {
      const id = "ar" + ++n;
      const ruler = [0, 1, 2, 3, 4].map((s) => '<span style="left:' + (s / SPAN) * 100 + '%">' + s + " s</span>").join("");
      host.innerHTML = `
<section class="ar" aria-label="Agent">
  <div class="ar-dev">
    <div class="ar-head">
      <button class="ar-key" type="button" data-k="run" aria-pressed="false"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 0.5 9.5 5l-8 4.5z"/></svg>Run</button>
      <span class="ar-title">Agent</span><span class="ar-box ar-take" aria-hidden="true"></span>
      <span class="ar-clock" aria-hidden="true">0:00.0</span><span class="ar-box ar-tok" aria-hidden="true"></span>
    </div>
    <div class="ar-lane" aria-hidden="true"><div class="ar-ruler">${ruler}</div><div class="ar-row"></div></div>
    <button class="ar-key ar-fold" type="button" aria-expanded="true" aria-controls="${id}-steps"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 0.5 8.5 5l-6 4.5z"/></svg><span></span></button>
    <ol class="ar-steps" id="${id}-steps"></ol>
  </div>
  <div class="ar-out"><div class="ar-out-h">Output</div><p class="ar-text"></p></div>
  <p class="sr-only" aria-live="polite"></p>
</section>`;
      const sig = { signal: ctx.signal };
      const root = host.querySelector(".ar"), runKey = host.querySelector('[data-k="run"]'), row = host.querySelector(".ar-row"), fold = host.querySelector(".ar-fold");
      const list = host.querySelector(".ar-steps"), text = host.querySelector(".ar-text"), clockEl = host.querySelector(".ar-clock"), tokEl = host.querySelector(".ar-tok");
      const takeEl = host.querySelector(".ar-take"), live = host.querySelector("[aria-live]");

      let phase = "idle", revealed = 0, finished = 0, streamed = 0, open = true, started = 0, ended = 0, take = 3, tokens = 0, looping = true;
      let timers = [], clips = [], tick = null;
      const at = (ms, fn) => timers.push(ctx.after(ms, fn));
      const busy = () => phase === "thinking" || phase === "working";
      const secs = () => ((ended || performance.now()) - started) / 1000;

      function drawFold() {
        const span = fold.querySelector("span");
        fold.disabled = busy() || phase === "idle";
        fold.setAttribute("aria-expanded", String(open));
        span.textContent = busy() ? (phase === "thinking" ? "Thinking" : STEPS[revealed - 1].verb + " " + STEPS[revealed - 1].target) :

        list.hidden = !open;
      }
      function drawSteps() {
        while (list.children.length < revealed) {
          const s = STEPS[list.children.length], li = document.createElement("li");
          li.className = "ar-step"; li.style.cssText = hueVars(TOOLS[s.verb]);
          li.innerHTML = '<span class="ar-tag"></span><span class="ar-tgt"></span><span class="ar-det"></span>';
          li.querySelector(".ar-tag").textContent = s.verb; li.querySelector(".ar-tgt").textContent = s.target;
          list.appendChild(li);
        }
        [...list.children].forEach((li, i) => {
          const d = li.querySelector(".ar-det");
          if (i < finished) { d.innerHTML = STEPS[i].detail; if (STEPS[i].label) d.setAttribute("aria-label", STEPS[i].label); } else d.textContent = "running";
        });

      }

        runKey.setAttribute("aria-pressed", String(phase !== "done" && phase !== "idle"));

        tokEl.textContent = (tokens >= 1000 ? (tokens / 1000).toFixed(1) + "k" : Math.round(tokens)) + " tok";
        const s = phase === "idle" ? 0 : secs();
        clockEl.textContent = Math.floor(s / 60) + ":" + (s % 60).toFixed(1).padStart(4, "0");
      }
      function say() {
        const said = busy() ? (phase === "thinking" ? "Thinking" : STEPS[revealed - 1].verb + " " + STEPS[revealed - 1].target) : phase === "done" ? "Answer ready. " + ANSWER : "";
        if (live.textContent !== said) live.textContent = said;
      }
      function draw() { drawFold(); drawSteps(); drawText(); drawHead(); say(); }

      /* A clip cuts in on the lane and grows with the clock until its step ends. */
      function addClip(name, label, hue, from) {
        const el = document.createElement("span");
        el.className = "ar-clip"; el.style.cssText = hueVars(hue) + ";left:" + (from / SPAN) * 100 + "%;width:0";
        el.textContent = label; row.appendChild(el);
        clips.push({ el, from, to: null });
      }
      const closeClip = (t) => { const c = clips[clips.length - 1]; if (c && c.to === null) c.to = t; };
      function drawClips() {
        const t = phase === "idle" ? 0 : Math.min(SPAN, secs());
        clips.forEach((c) => { const end = c.to === null ? t : c.to; c.el.style.width = "calc(" + (Math.max(0, end - c.from) / SPAN) * 100 + "% - 1px)"; });
      }

      function clear() { timers.forEach(clearTimeout); timers = []; if (tick) tick.stop = true; tick = null; }
      function script() {
        clear(); row.textContent = ""; clips = []; list.textContent = "";
        take++; tokens = 0;
        if (ctx.reduced()) {
          phase = "done"; started = performance.now(); ended = started + THINK + STEPS.length * STEP; revealed = finished = STEPS.length; streamed = words.length; open = false;
          let t = 0; addClip("Think", "Think", TOOLS.Think, 0); clips[0].to = THINK / 1000; t = THINK / 1000;
          STEPS.forEach((s) => { addClip(s.verb, s.verb, TOOLS[s.verb], t); t += STEP / 1000; closeClip(t); });
          tokens = 1840; drawClips(); draw(); return;
        }
        phase = "thinking"; started = performance.now(); ended = 0; revealed = finished = streamed = 0; open = true;
        addClip("Think", "Think", TOOLS.Think, 0);
        tick = ctx.loop(() => {
          if (busy()) tokens += 6 + Math.random() * 6;
          drawClips(); drawHead();
          return phase !== "done";
        });
        draw();
        let t = THINK;
        STEPS.forEach((s, i) => {
          at(t, () => { closeClip(secs()); phase = "working"; revealed = i + 1; addClip(s.verb, s.verb + " " + s.target.split("/").pop(), TOOLS[s.verb], secs()); draw(); });
          t += STEP;
          at(t, () => { finished = i + 1; drawSteps(); });
        });
        at(t + 250, () => { closeClip(secs()); ended = performance.now(); phase = "answering"; open = false; draw(); });
        t += 500;
        words.forEach((_, i) => at(t + i * WORD, () => { streamed = i + 1; tokens += 1.3; drawText(); drawHead(); }));
        t += words.length * WORD;
        at(t, () => { phase = "done"; draw(); });

      }

      fold.addEventListener("click", () => { if (busy()) return; open = !open; drawFold(); }, sig);
      runKey.addEventListener("click", () => { if (busy() || phase === "answering") return; script(); }, sig);
      /* A hand ends the loop: this run plays out and stays; Run starts the next one. */
      ctx.onHand(() => { looping = false; });
      if (ctx.reduced()) script(); else { draw(); drawHead(); ctx.after(200, script); }
      return { destroy: clear };
    },
  });
})();

<script>
/* agent-shapes.js */
/* Agent Shapes, after litterthanlit/components, in Rack 2.0: a run passing along four agents. Each agent is one object
   in its own colour (tint, 1px edge in the hue, name in the hue's text) holding the shape of its way of working, from
   the original's eight. The one at work gets a second edge and its shape runs; the rest hold still. The strip says
   what is happening, with Run (the one yellow) and the clock. */
(function () {
  const offset = (fraction, duration) => `${-(((fraction % 1) + 1) % 1) * duration}ms`;

  /* --- The shapes, as markup. Each takes a size in px. --- */
  const RAYS = 8, STRETCH = 1600;
  function spark(size) {
    let rays = "";
    for (let i = 0; i < RAYS; i++) rays += `<span class="as-ray-arm" style="transform:rotate(${(i * 360) / RAYS}deg)"><span class="as-ray${i % 2 ? " is-odd" : ""}" style="animation-delay:${offset(1 - i / RAYS, STRETCH)}"></span></span>`;
    return `<span class="as-spin">${rays}</span><span class="as-core"></span>`;
  }

  const ELLIPSE = "M3 16a13 5 0 1 0 26 0a13 5 0 1 0 -26 0";
  const ORBITS = [{ angle: 0, duration: 1800 }, { angle: 60, duration: 2400 }, { angle: 120, duration: 3000 }];
  function orbit() {
    return `<svg viewBox="0 0 32 32" fill="none">${ORBITS.map(({ angle, duration }, i) => `<g transform="rotate(${angle} 16 16)">
      <path d="${ELLIPSE}" class="as-track" stroke-width="1"/>
      <path d="${ELLIPSE}" pathLength="1" stroke-dasharray="0.12 0.88" stroke-width="1.75" stroke-linecap="round" class="as-trace ${i === 0 ? "as-hi" : "as-lo"}"
        style="animation-duration:${duration}ms;animation-delay:${offset(i / 3, duration)}"/></g>`).join("")}
      <circle cx="16" cy="16" r="3" class="as-wave as-fill"/></svg>`;
  }

  const NODES = [[6, 7], [18, 4], [28, 12], [23, 26], [9, 27], [4, 17]];
  const CHORDS = [[1, 4], [2, 5]];
  const TRACE = 2400, SIGNAL = 0.16;
  const LOOP = `M${NODES.map(([x, y]) => `${x} ${y}`).join("L")}Z`;
  const NODE_AT = (() => {
    const edges = NODES.map(([x, y], i) => { const [nx, ny] = NODES[(i + 1) % NODES.length]; return Math.hypot(nx - x, ny - y); });
    const total = edges.reduce((s, d) => s + d, 0);
    return NODES.map((_, i) => edges.slice(0, i).reduce((s, d) => s + d, 0) / total);
  })();
  function graph() {
    return `<svg viewBox="0 0 32 32" fill="none"><path d="${LOOP}" class="as-track" stroke-width="1" stroke-linejoin="round"/>
      ${CHORDS.map(([a, b]) => `<line x1="${NODES[a][0]}" y1="${NODES[a][1]}" x2="${NODES[b][0]}" y2="${NODES[b][1]}" class="as-track" stroke-width="1"/>`).join("")}
      <path d="${LOOP}" pathLength="1" stroke-dasharray="${SIGNAL} ${1 - SIGNAL}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="as-trace as-hi" style="animation-duration:${TRACE}ms"/>
      ${NODES.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="2.6" class="as-wave as-fill" style="animation-duration:${TRACE}ms;animation-delay:${offset(0.5 - NODE_AT[i] + SIGNAL, TRACE)}"/>`).join("")}</svg>`;
  }

  const MORPH = 3200;
  function morph() {
    return `<span class="as-morph as-ghost" style="animation-delay:${offset(-0.1, MORPH)}"></span><span class="as-morph as-form"></span>`;
  }

  const CURVE = (() => {
    const steps = 120, pts = [];
    for (let i = 0; i < steps; i++) { const t = (i / steps) * Math.PI * 2; pts.push(`${(16 + 12.5 * Math.cos(3 * t)).toFixed(2)} ${(16 + 10 * Math.sin(2 * t)).toFixed(2)}`); }
    return `M${pts.join("L")}Z`;
  })();
  const THREAD = 3200;
  const STRANDS = [{ length: 0.26, opacity: 0.2 }, { length: 0.14, opacity: 0.5 }, { length: 0.05, opacity: 1 }];
  function thread() {
    const longest = STRANDS[0].length;
    return `<svg viewBox="0 0 32 32" fill="none"><path d="${CURVE}" class="as-track" stroke-width="1"/>
      ${STRANDS.map(({ length, opacity }, i) => `<path d="${CURVE}" pathLength="1" stroke-dasharray="${length} ${1 - length}" stroke-width="1.75" stroke-linecap="round" opacity="${opacity}"
        class="as-trace ${i === STRANDS.length - 1 ? "as-hi" : "as-lo"}" style="animation-duration:${THREAD}ms;animation-delay:${offset(longest - length, THREAD)}"/>`).join("")}</svg>`;
  }

  const ASSEMBLE = 2000;
  const TILES = [{ fx: "-45%", fy: "-45%", turn: 0 }, { fx: "45%", fy: "-45%", turn: 1 }, { fx: "-45%", fy: "45%", turn: 3 }, { fx: "45%", fy: "45%", turn: 2 }];
  function fold() {
    return `<span class="as-fold">${TILES.map(({ fx, fy, turn }, i) => `<span class="as-tile${i === 3 ? " is-hi" : ""}" style="--fx:${fx};--fy:${fy};animation-delay:${offset(-turn / 4, ASSEMBLE)}"></span>`).join("")}</span>`;
  }

  /* Cubes: real CSS 3D, isometric, faces shaded by how much colour they carry, mixed against what is behind them. */
  const ISOMETRIC = "rotateX(-35.26deg) rotateY(45deg)";
  const FACES = [{ turn: "rotateX(90deg)", ink: 100 }, { turn: "rotateY(0deg)", ink: 62 }, { turn: "rotateY(180deg)", ink: 62 }, { turn: "rotateY(90deg)", ink: 38 }, { turn: "rotateY(-90deg)", ink: 38 }];
  const metrics = (size) => { const edge = size * 0.26; return { edge, half: (edge + size * 0.03) / 2 }; };
  const BLOCKS = (half) => [1, -1].flatMap((y) => [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([x, z]) => [x * half, y * half, z * half]));
  function cubelet(at, edge, hi, style = "", faceStyle = "") {
    const color = hi ? "var(--as-hi)" : "var(--as-lo)";
    return `<span class="as-3d" style="transform:translate3d(${at[0]}px,${at[1]}px,${at[2]}px)"><span class="as-3d" style="${style}">${FACES.map(({ turn, ink }) =>
      `<span class="as-face" style="width:${edge}px;height:${edge}px;left:${-edge / 2}px;top:${-edge / 2}px;transform:${turn} translateZ(${edge / 2}px);background:color-mix(in oklab, ${color} ${ink}%, var(--as-bg));${faceStyle}"></span>`).join("")}</span></span>`;
  }
  const scene = (inner, cls = "") => `<span class="as-scene"><span class="as-3d as-iso ${cls}">${inner}</span></span>`;
  function cube(size) {
    const { edge, half } = metrics(size), blocks = BLOCKS(half);
    return scene([blocks.slice(0, 4), blocks.slice(4)].map((layer, i) =>
      `<span class="as-3d as-twist${i === 0 ? " is-rev" : ""}">${layer.map((at, j) => cubelet(at, edge, i === 1 && j === 3)).join("")}</span>`).join(""));
  }
  const DROP_WINDOW = 2 / 9;
  function stack(size) {
    const { edge, half } = metrics(size), lift = edge * 2.2;
    return scene(BLOCKS(half).map((at, i) => {
      const away = `clamp(0, (${(i + 2) / 9} - var(--fs-as-build)) / ${DROP_WINDOW}, 1)`;
      return cubelet(at, edge, i === 7, `transform:translateY(calc(${away} * ${-lift}px))`, `opacity:calc(1 - ${away})`);
    }).join(""), "as-build");
  }

  const AGENTS = [
    { name: "Planner", hue: "purple", modes: [{ line: "Thinking it through", draw: spark }, { line: "Planning the changes", draw: morph }] },
    { name: "Researcher", hue: "blue", modes: [{ line: "Searching 12 sources", draw: graph }, { line: "Organizing the results", draw: cube }] },
    { name: "Coder", hue: "orange", modes: [{ line: "Building the project", draw: stack }, { line: "Running the tests", draw: fold }] },
    { name: "Reviewer", hue: "green", modes: [{ line: "Weighing 3 approaches", draw: orbit }, { line: "Drafting the answer", draw: thread }] },
  ];
  const STEPS = AGENTS.flatMap((a, ai) => a.modes.map((_, mi) => ({ ai, mi })));
  const STEP = 1.2; // s a step; the chain cuts on it
  const EASE_IO = "cubic-bezier(0.77, 0, 0.175, 1)";
  const S = ".fs-agent-shapes";
  const fmt = (s) => { const v = Math.max(0, s); return `${Math.floor(v / 60)}:${(v % 60).toFixed(1).padStart(4, "0")}`; };
  const ICON = { run: '<svg viewBox="0 0 8 8" aria-hidden="true"><path d="M1.5 1v6l5-3z"/></svg>', stop: '<svg viewBox="0 0 8 8" aria-hidden="true"><path d="M1.5 1.5h5v5h-5z"/></svg>' };
  let uid = 0;

  FlatPlayer.register({
    slug: "agent-shapes",
    title: "Agent Shapes",
    tagline: "A run passing along four agents; the one at work draws the shape of what it is doing.",
    css: `
@property --fs-as-build { syntax: "<number>"; inherits: true; initial-value: 1 }
@keyframes fs-as-spin { to { transform: rotate(360deg) } }
@keyframes fs-as-stretch { 0%, 100% { transform: scaleY(0.3); opacity: 0.3 } 50% { transform: scaleY(1); opacity: 1 } }

  50% { border-radius: 6%; transform: rotate(225deg) scale(0.78) } 75% { border-radius: 6% 50%; transform: rotate(315deg) scale(0.92) } 100% { border-radius: 50%; transform: rotate(360deg) scale(1) } }
@keyframes fs-as-assemble { 0%, 25%, 100% { transform: translate(0, 0) scale(1); opacity: 1 } 55%, 65% { transform: translate(var(--fx, 0), var(--fy, 0)) scale(0.6); opacity: 0.35 } }
@keyframes fs-as-twist { 0%, 12.5% { transform: rotateY(0deg) } 25%, 37.5% { transform: rotateY(90deg) } 50%, 62.5% { transform: rotateY(180deg) } 75%, 87.5% { transform: rotateY(270deg) } 100% { transform: rotateY(360deg) } }
@keyframes fs-as-build { 0% { --fs-as-build: 0 } 55%, 82% { --fs-as-build: 1 } 100% { --fs-as-build: 0 } }
${S} .ch { width: min(100%, 330px); background: var(--panel); border-radius: var(--r-panel); overflow: hidden; font-size: 12px; user-select: none; -webkit-user-select: none }

  color: var(--ink); cursor: pointer; transition: background-color var(--cut-in) var(--ease-out) }
${S} .ch-key svg { width: 8px; height: 8px; fill: currentColor }

  font: 600 11px/1 var(--mono); font-variant-numeric: tabular-nums }

  --as-bg: var(--tint); --as-hi: var(--hue); --as-lo: color-mix(in oklab, var(--hue) 55%, var(--tint)); --as-line: color-mix(in oklab, var(--hue) 28%, var(--tint));

@container (min-width: 560px) {
  ${S} .ch { width: 620px } ${S} .ch-surface { gap: 12px; padding: 16px } ${S} .ch-a { padding: 8px } ${S} .ch-name { font-size: 12px }
}
${S} .as-frame { position: relative; display: inline-block; flex: none }

${S} .as-hi { stroke: var(--as-hi) } ${S} .as-lo { stroke: var(--as-lo) }
${S} .as-fill { fill: var(--as-lo) }
${S} .as-wave { transform-origin: center; transform-box: fill-box; animation: fs-as-wave 1.4s ${EASE_IO} infinite }
${S} .as-morph { position: absolute; border-radius: 50%; animation: fs-as-morph ${MORPH}ms ${EASE_IO} infinite }
${S} .as-ghost { inset: 14%; border: 1.5px solid var(--as-hi) }
${S} .as-form { inset: 24%; background: var(--as-lo) }

${S} .as-tile { border-radius: 2px; background: var(--as-lo); animation: fs-as-assemble ${ASSEMBLE}ms ${EASE_IO} infinite }
${S} .as-tile.is-hi { background: var(--as-hi) }
${S} .as-scene { position: absolute; inset: 0; display: grid; place-items: center }
${S} .as-3d { position: absolute; top: 0; left: 0; transform-style: preserve-3d }
${S} .as-iso { position: relative; transform: ${ISOMETRIC} }
${S} .as-face { position: absolute }
${S} .as-twist { animation: fs-as-twist 4.8s ${EASE_IO} infinite }
${S} .as-twist.is-rev { animation-direction: reverse }
${S} .as-build { animation: fs-as-build 4.4s linear infinite }
@media (prefers-reduced-motion: reduce) {
  ${S} .as-spin, ${S} .as-ray, ${S} .as-trace, ${S} .as-wave, ${S} .as-morph, ${S} .as-tile, ${S} .as-twist, ${S} .as-build { animation: none }
  ${S} .as-ray.is-odd { transform: scaleY(0.5) }
}
`,
    mount(host, ctx) {
      const id = "fs-ch3-" + ++uid;
      const size = host.clientWidth >= 560 ? 72 : 40;
      const hueVars = (a) => `--hue: var(--clip-${a.hue}); --tint: var(--clip-${a.hue}-tint); --text: var(--clip-${a.hue}-text)`;
      host.innerHTML = `
<section class="ch" aria-labelledby="${id}">
  <div class="ch-strip">
    <button type="button" class="ch-key" aria-pressed="false" aria-label="Run"></button>
    <span class="ch-line" id="${id}"></span>
    <span class="ch-clock" aria-hidden="true">0:00.0</span>
  </div>
  <div class="ch-surface" role="radiogroup" aria-label="Agents">
    ${AGENTS.map((a, i) => `<button type="button" class="ch-a" role="radio" aria-checked="false" tabindex="${i ? -1 : 0}" style="${hueVars(a)}" aria-label="${a.name}">
      <span class="ch-name" aria-hidden="true">${a.name}</span>
      <span class="ch-shape" aria-hidden="true">${a.modes.map((m) => `<span><span class="as-frame" style="width:${size}px;height:${size}px">${m.draw(size)}</span></span>`).join("")}</span></button>`).join("")}
  </div>
  <p class="sr-only" aria-live="polite"></p>
</section>`;
      const runKey = host.querySelector(".ch-key"), line = host.querySelector(".ch-line"), clock = host.querySelector(".ch-clock"), live = host.querySelector("[aria-live]");
      const objs = [...host.querySelectorAll(".ch-a")];
      const reduced = ctx.reduced();
      const sig = { signal: ctx.signal };
      objs.forEach((o) => o.querySelector(".ch-shape > span").classList.add("is-on"));

      let t = 0, running = false, cur = null, rest = 0;
      function setRunning(x) {
        running = x;
        runKey.setAttribute("aria-pressed", x ? "true" : "false");
        runKey.setAttribute("aria-label", x ? "Stop" : "Run");
        runKey.innerHTML = x ? ICON.stop : ICON.run;
      }
      /* The working agent: its edge doubles and its shape runs; the rest hold a still shape. All cut on the frame. */
      function show(s, say) {
        if (cur && s && cur.ai === s.ai && cur.mi === s.mi) return;
        cur = s;
        objs.forEach((o, i) => {
          o.setAttribute("aria-checked", s && s.ai === i ? "true" : "false");
          if (s && s.ai === i) o.querySelectorAll(".ch-shape > span").forEach((g, j) => g.classList.toggle("is-on", j === s.mi));
        });
        if (s) objs.forEach((o, i) => (o.tabIndex = i === s.ai ? 0 : -1));
        const words = s ? AGENTS[s.ai].modes[s.mi].line : "";
        line.textContent = words;
        if (s && say !== false) live.textContent = `${AGENTS[s.ai].name}: ${words}`;
      }
      const span = STEPS.length * STEP;
      function newRun() { t = 0; rest = 0; setRunning(true); show(STEPS[0]); }

      let ghost = !reduced;
      ctx.onHand(() => (ghost = false));
      if (reduced) { setRunning(false); t = STEP * 2.5; show(STEPS[2], false); clock.textContent = fmt(t); }
      else {
        newRun();
        ctx.loop((dt) => {
          if (running) {
            t = Math.min(span, t + dt);
            clock.textContent = fmt(t);
            if (t >= span) { setRunning(false); show(null); line.textContent = "Run done"; live.textContent = "Run done"; return; }
            show(STEPS[Math.floor(t / STEP)]);
          } else if (ghost && t >= span && (rest += dt) > STEP) newRun();
        });
      }

      runKey.addEventListener("click", () => {
        if (running) { setRunning(false); live.textContent = "Stopped"; return; }
        if (reduced) return;
        if (t >= span) newRun();
        else { t = cur ? STEPS.indexOf(STEPS.find((s) => s.ai === cur.ai && s.mi === cur.mi)) * STEP : t; setRunning(true); }
      }, sig);
      /* A hand on an agent stops the run there; a second press shows its other way of working. */
      const pick = (i, focus) => {
        if (running) setRunning(false);
        const mi = cur && cur.ai === i ? 1 - cur.mi : 0;
        show({ ai: i, mi });
        if (focus) objs[i].focus();
      };
      objs.forEach((o, i) => o.addEventListener("click", () => pick(i), sig));
      host.querySelector(".ch-surface").addEventListener("keydown", (e) => {
        const at = objs.indexOf(document.activeElement);
        const mv = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (at < 0 || !mv) return;
        e.preventDefault();
        const to = (at + mv + objs.length) % objs.length;
        if (running) setRunning(false);
        show({ ai: to, mi: 0 }); objs[to].focus();
      }, sig);
    },
  });
})();

</script>
<script>
/* agent-status.js */
/* Agent Status, after litterthanlit/components (agent-status.tsx), in Rack 2.0.
 * An agent's run, traced on one surface. The title strip holds the transport key (lit while the run is live; press it
 * to stop), the task, the state in a word, Allow (it cuts in only while a tool call waits on your approval) and the
 * run's clock, the one readout: live seconds only, holding while a call waits and stopping on the frame the run is
 * stopped. The surface is three lanes on a light grid, Think purple, Tool blue, Write green: every step of the run
 * lands as a clip on its lane (a soft tint, a 1px edge in the hue, its verb in the hue's text tone), growing with the
 * clock under a playhead. The clip being written deepens with each chunk of tokens through a 90ms detector, so a
 * stall goes pale; a call that fails ends its clip in red. The view pages on when the playhead reaches its edge. A
 * ghost runs three tasks until a hand arrives. Escape stops a run. Under reduced motion one still frame waits on Allow. */
(function () {
  const TRACKS = [
    { key: "thinking", name: "Think", hue: "purple" },
    { key: "tool", name: "Tool", hue: "blue" },
    { key: "writing", name: "Write", hue: "green" },
  ];
  const DECAY = 0.09; // s: the detector's release
  const WINDOW = 6; // seconds the arrangement shows
  let uid = 0;

  const isLive = (s) => s === "thinking" || s === "tool" || s === "writing";
  const isEnd = (s) => s === null || s === "ready" || s === "done" || s === "error" || s === "stopped";
  const lineOf = (step) => (step ? [step.verb, step.target].filter(Boolean).join(" ") : "");
  const trackOf = (s) => (s === "waiting" ? "tool" : s);

  function sayFor(state, line) {
    const w = (word) => (line ? `${word}: ${line}` : word);
    if (state === "thinking") return w("Thinking");
    if (state === "tool") return line || "Running a tool";
    if (state === "writing") return w("Writing");
    if (state === "waiting") return w("Waiting for your approval");
    if (state === "done") return w("Done");
    if (state === "error") return w("Error");
    if (state === "stopped") return "Stopped";
    return "";
  }

  /* --- The demo: an agent working on a codebase, and a ghost at the keys. --- */
  const cue = (wait, state, verb, target) => ({ wait, state, verb, target });
  const RUNS = [
    {
      task: "Fix the flaky login test",
      cues: [
        cue(0, "thinking", "Planning", "the fix"),
        cue(950, "tool", "Read", "auth/session.ts"),
        cue(600, "tool", "Search", "\u201cretry\u201d in 6 files"),
        cue(600, "thinking", "Comparing", "two fixes"),
        cue(650, "tool", "Delete", "tests/login.old.ts"),
        cue(120, "waiting", "Delete", "tests/login.old.ts"),
        cue(0, "tool", "Delete", "tests/login.old.ts"), // approved: the same call goes on
        cue(600, "tool", "Edit", "auth/retry.ts, +18 −4"),
        cue(600, "writing", "Writing", "the pull request"),
        cue(1700, "done", "Opened", "PR #212, 2 files"),
      ],
    },
    {
      task: "Deploy a preview",
      cues: [
        cue(0, "thinking", "Planning", "the deploy"),
        cue(900, "tool", "Build", "web, 42 s"),
        cue(700, "tool", "Upload", "dist, 18 MB"),
        cue(1100, "error", "Out of memory:", "the build needs 4 GB"),
      ],
      retry: [
        cue(0, "thinking", "Raising", "memory to 4 GB"),
        cue(800, "tool", "Build", "web, 39 s"),
        cue(700, "tool", "Upload", "dist, 18 MB"),
        cue(900, "done", "Preview live", "on fix/auth-retry"),
      ],
    },
    {
      task: "Summarise the design review",
      cues: [
        cue(0, "thinking", "Planning", "the summary"),
        cue(800, "tool", "Read", "32 comments on Checkout v3"),
        cue(600, "writing", "Writing", "the summary"),
        { wait: 1500, ghost: "stop" }, // the ghost stops it mid-stream; under a hand, the agent finishes
        cue(1500, "done", "Wrote", "212 words"),
      ],
    },
  ];
  const GHOST = { ready: 700, waiting: 1500, error: 2200, done: 2600, stopped: 2000 };
  const FIRST_PRESS = 280;
  const chunk = (state) => (state === "writing" ? 8 + Math.floor(Math.random() * 13) : 3 + Math.floor(Math.random() * 7));

  const css = `

  -webkit-user-select: none; user-select: none; }

  font: 600 12px/22px var(--mono); font-variant-numeric: tabular-nums; }
.fs-agent-status [data-state="waiting"] .as-clock, .fs-agent-status [data-state="stopped"] .as-clock { color: var(--muted); }
.fs-agent-status .as-surface { position: relative; margin: 14px; padding: 8px 0; border-radius: var(--r-control); background: var(--cut);
  box-shadow: var(--edge); display: grid; gap: 6px; overflow: hidden; }

.fs-agent-status .as-grid i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: 0.6; }
.fs-agent-status .as-lane { position: relative; height: 30px; }

  background: color-mix(in oklab, var(--tint), var(--hue) calc(var(--a, 0) * 28%)); box-shadow: inset 0 0 0 1px var(--hue);
  color: var(--hue-text); font-size: 10px; font-weight: 600; line-height: 1; padding: 5px 5px 0; white-space: nowrap; overflow: hidden;
  animation: fs-as-cut var(--cut-in) var(--ease-out); }

.fs-agent-status .as-clip.is-failed { box-shadow: inset 0 0 0 1px var(--danger); color: var(--danger); }
.fs-agent-status .as-playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink); pointer-events: none; z-index: 2; }

`;

  const PLAY = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1.2v7.6L8.6 5z"/></svg>';
  const STOP = '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7"/></svg>';
  const hue = (el, h) => {
    el.style.setProperty("--hue", `var(--clip-${h})`);
    el.style.setProperty("--tint", `var(--clip-${h}-tint)`);
    el.style.setProperty("--hue-text", `var(--clip-${h}-text)`);
  };

  function mount(host, ctx) {
    const { signal } = ctx;
    const id = "fs-as-" + ++uid;
    host.innerHTML = `
      <div class="as" role="group" aria-label="Agent" data-state="ready">
        <div class="as-strip">
          <button type="button" class="as-key as-play" aria-label="Run" aria-pressed="false">${PLAY}</button>
          <span class="as-task" aria-hidden="true"></span>
          <span class="as-state" aria-hidden="true"></span>
          <button type="button" class="as-key as-allow" aria-describedby="${id}-now" hidden>Allow</button>
          <span class="as-clock" aria-hidden="true">0:00.0</span>
        </div>
        <div class="as-surface" aria-hidden="true"><div class="as-grid"></div><div class="as-playhead"></div></div>
        <p class="sr-only" id="${id}-now"></p>
        <div class="sr-only" role="status"></div>
        <p class="sr-only" role="alert"></p>
      </div>`;
    const root = host.querySelector(".as");
    const $ = (s) => root.querySelector(s);
    const taskEl = $(".as-task"), stateEl = $(".as-state"), clockEl = $(".as-clock");
    const playBtn = $(".as-play"), allowBtn = $(".as-allow");
    const surface = $(".as-surface"), gridEl = $(".as-grid"), playhead = $(".as-playhead"), nowEl = $(`#${id}-now`);
    const statusEl = $("[role=status]"), alertEl = $("[role=alert]");
    const lanes = {};
    TRACKS.forEach((t) => {
      const lane = document.createElement("div");
      lane.className = "as-lane";
      surface.appendChild(lane);
      lanes[t.key] = lane;
    });

    /* --- Time: the run's clock in live seconds, the view, the playhead and the level, from one loop. --- */
    const reduced = ctx.reduced();
    let banked = 0, since = 0, env = 0, loop = null, viewStart = 0;
    const T = () => banked + (since ? Math.max(0, performance.now() - since) / 1000 : 0);
    const laneW = () => lanes.thinking.clientWidth || 1;
    const pxs = () => laneW() / WINDOW;

    function drawGrid() {
      const scale = pxs();
      gridEl.textContent = "";
      for (let k = Math.ceil(viewStart); k <= viewStart + WINDOW; k++) {
        const g = document.createElement("i");
        g.style.left = `${(k - viewStart) * scale}px`;
        gridEl.appendChild(g);
      }
    }
    function drawClips(t) {
      const scale = pxs();
      for (const c of clips) {
        const t1 = c.t1 === null ? t : c.t1;
        c.el.style.left = `${(c.t0 - viewStart) * scale}px`;
        c.el.style.width = `${Math.max(3, (t1 - c.t0) * scale)}px`;
      }
    }
    function draw() {
      const t = T();
      // The view pages on when the playhead reaches its edge: it cuts, it never scrolls.
      if (t > viewStart + WINDOW * 0.92) { viewStart = Math.max(0, t - WINDOW * 0.1); drawGrid(); }
      const m = Math.floor(t / 60), s = t % 60;
      const text = reduced && since ? `${m}:${String(Math.floor(s)).padStart(2, "0")}.0` : `${m}:${s.toFixed(1).padStart(4, "0")}`;
      if (clockEl.textContent !== text) clockEl.textContent = text;
      playhead.style.left = `${(t - viewStart) * pxs()}px`;
      drawClips(t);
      root.style.setProperty("--act", (reduced ? (isLive(state) ? 0.6 : 0) : env).toFixed(3));
    }
    function wake() {
      if (loop || !(since || env)) return;
      loop = ctx.loop((dt) => {
        env *= Math.exp(-dt / DECAY);
        if (env < 0.002) env = 0;
        draw();
        if (!(since || env)) { loop = null; return false; }
      });
    }
    const clock = {
      go(live, fresh) {
        const now = performance.now();
        if (fresh) { banked = 0; since = 0; viewStart = 0; clearClips(); drawGrid(); }
        if (live && !since) since = now;
        else if (!live && since) { banked += (now - since) / 1000; since = 0; }
        draw();
        wake();
      },
      reset() { banked = 0; since = 0; viewStart = 0; clearClips(); drawGrid(); draw(); },
      kick(n) { if (reduced) return; env = Math.max(env, Math.min(1, 0.5 + n / 24)); wake(); },
    };

    /* --- Clips: each step of the run lands on its lane. --- */
    let clips = [];
    function clearClips() { clips.forEach((c) => c.el.remove()); clips = []; }
    const openClip = () => clips.find((c) => c.t1 === null);
    function record(nextState, nextLine, resumed, nextStep) {
      const t = T();
      const open = openClip();
      if (resumed && open) return; // Allow: the same call goes on in the same clip
      if (nextState === "waiting" && open && open.line === nextLine) return; // the call that asks for your OK is the same clip
      if (open) { open.t1 = t; open.el.classList.remove("is-live"); }
      if (nextState === "error" && open) { open.el.classList.add("is-failed"); open.el.textContent = `${open.el.textContent} failed`; }
      if (nextState === "done" || nextState === "stopped" || nextState === "error") return;
      const track = trackOf(nextState);
      if (!lanes[track]) return;
      const el = document.createElement("div");
      el.className = "as-clip is-live";
      el.textContent = (nextStep && nextStep.verb) || track;
      el.title = nextLine;
      hue(el, TRACKS.find((x) => x.key === track).hue);
      lanes[track].appendChild(el);
      clips.push({ el, t0: t, t1: null, line: nextLine });
    }

    /* --- The component's state, as its props were. --- */
    let task = RUNS[0].task, state = "ready", step = null, tokens = 0, line = "", was = null, tools = 0, said = 0;
    function setStatus(nextState, nextStep) {
      const nextLine = lineOf(nextStep);
      const changed = nextState !== state || nextLine !== line;
      if (!changed) return;
      const resumed = state === "waiting" && nextLine === line;
      const fresh = nextState === "ready" || (isLive(nextState) && isEnd(state));
      const call = (nextState === "tool" || nextState === "waiting") && !resumed && (nextLine !== line || (state !== "tool" && state !== "waiting"));
      tools = (fresh ? 0 : tools) + (call ? 1 : 0);
      const stateChanged = nextState !== state;
      if (stateChanged) {
        const from = was;
        was = nextState;
        if (nextState === "ready") clock.reset();
        else if (isLive(nextState) && isEnd(from)) clock.go(true, true);
      }
      if (nextState !== "ready") record(nextState, nextLine, resumed, nextStep);
      state = nextState; step = nextStep; line = nextLine;
      if (stateChanged && nextState !== "ready") clock.go(isLive(state), false);
      said += 1;
      render();
      draw();
    }
    function setTokens(n) {
      const from = tokens;
      tokens = n;
      if (tokens > from) clock.kick(tokens - from);
    }

    const canStop = () => isLive(state) || state === "waiting";
    function render() {
      root.dataset.state = state;
      taskEl.textContent = task;
      stateEl.textContent = { ready: "Ready", thinking: "Thinking", tool: tools ? `Tool call ${tools}` : "Tool call", writing: "Writing", waiting: "Needs approval", done: "Done", error: "Failed", stopped: "Stopped" }[state];
      nowEl.textContent = step ? lineOf(step) : "Not started";
      const live = isLive(state), waiting = state === "waiting";
      playBtn.setAttribute("aria-pressed", String(live || waiting));
      playBtn.setAttribute("aria-label", live || waiting ? "Stop" : state === "error" ? "Retry" : "Run");
      if (live || waiting) playBtn.setAttribute("aria-keyshortcuts", "Escape"); else playBtn.removeAttribute("aria-keyshortcuts");
      playBtn.innerHTML = live || waiting ? STOP : PLAY;
      const hadFocus = document.activeElement === allowBtn;
      allowBtn.hidden = !waiting;
      if (hadFocus && !waiting) playBtn.focus({ preventScroll: true });
      if (said > 0) {
        const s = sayFor(state, line);
        if (state === "error") { statusEl.textContent = ""; alertEl.textContent = s; }
        else { alertEl.textContent = ""; statusEl.textContent = s; }
      }
    }

    /* --- The agent: works through its cues; a call that needs your OK waits there. --- */
    let agentTimer = 0, rest = [], run = 0, ghost = false, ghostTimer = 0, first = true, tokenTimer = 0;
    const later = (ms, fn) => setTimeout(() => { if (!signal.aborted) fn(); }, ms);
    function perform(cues) {
      clearTimeout(agentTimer);
      const [next, ...more] = cues;
      if (!next) return;
      const go = () => {
        if (next.ghost) { if (ghost) press("stop"); else perform(more); return; }
        change(next.state, { verb: next.verb, target: next.target });
        if (next.state === "waiting") rest = more;
        else perform(more);
      };
      if (next.wait) agentTimer = later(next.wait, go);
      else go();
    }
    function start(cues) { setTokens(0); perform(cues); }
    function onRun() {
      if (state === "error") return start(RUNS[run].retry || RUNS[run].cues);
      if (state === "ready") return start(RUNS[run].cues);
      run = (run + 1) % RUNS.length;
      task = RUNS[run].task;
      start(RUNS[run].cues);
    }
    function onStop() { clearTimeout(agentTimer); change("stopped", step); }
    function cueUp() { run = (run + 1) % RUNS.length; task = RUNS[run].task; tokens = 0; change("ready", null); }
    function change(nextState, nextStep) {
      setStatus(nextState, nextStep);
      clearInterval(tokenTimer);
      if (state === "thinking" || state === "writing") {
        const s = state;
        tokenTimer = setInterval(() => { if (!signal.aborted) setTokens(tokens + chunk(s)); }, 90);
      }
      scheduleGhost();
    }
    function scheduleGhost() {
      clearTimeout(ghostTimer);
      if (!ghost || GHOST[state] === undefined) return;
      const wait = state === "ready" && first ? FIRST_PRESS : GHOST[state];
      first = false;
      ghostTimer = later(wait, () => {
        if (!ghost) return;
        if (state === "ready" || state === "error") press("run");
        else if (state === "waiting") press("allow");
        else if (state === "done" || state === "stopped") cueUp();
      });
    }

    /* --- Keys. --- */
    function act(key) {
      if (key === "stop" && canStop()) onStop();
      else if (key === "run" && !canStop()) onRun();
      else if (key === "allow" && state === "waiting") perform(rest);
    }
    function press(key) {
      const btn = key === "allow" ? allowBtn : playBtn;
      btn.setAttribute("data-pressed", "");
      later(120, () => btn.removeAttribute("data-pressed"));
      act(key);
    }
    playBtn.addEventListener("click", () => act(canStop() ? "stop" : "run"), { signal });
    allowBtn.addEventListener("click", () => act("allow"), { signal });
    root.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || !canStop()) return;
      e.preventDefault();
      e.stopPropagation(); // a run to stop takes Escape; with nothing to stop, the host gets it back
      if (!e.repeat) act("stop");
    }, { signal });
    ctx.onHand(() => { ghost = false; clearTimeout(ghostTimer); });

    const resize = new ResizeObserver(() => { drawGrid(); draw(); });
    resize.observe(lanes.thinking);

    render();
    drawGrid();
    draw();
    if (reduced) {
      // One still frame: the first run, up to the call that waits on you.
      const cues = RUNS[0].cues;
      let tAcc = 0;
      for (const c of cues) {
        tAcc += c.wait / 1000;
        banked = tAcc; since = 0;
        setStatus(c.state, { verb: c.verb, target: c.target });
        since = 0; banked = tAcc;
        if (c.state === "waiting") break;
      }
      rest = cues.slice(cues.findIndex((c) => c.state === "waiting") + 1);
      setTokens(412);
      draw();
    } else {
      ghost = true;
      scheduleGhost();
    }

    return {
      destroy() {
        ghost = false;
        clearTimeout(agentTimer);
        clearTimeout(ghostTimer);
        clearInterval(tokenTimer);
        resize.disconnect();
      },
    };
  }

  FlatPlayer.register({
    slug: "agent-status",
    title: "Agent Status",
    tagline: "An agent's run, traced live: each step a clip on its lane.",
    css,
    mount,
  });
})();

</script>

  mount(host, ctx) {
    /* --- Data: an agent console's commands, its four agents and 2,400 runs ---------------------------------- */
    const AGENTS = [["Planner", "purple"], ["Researcher", "blue"], ["Coder", "orange"], ["Reviewer", "green"]];
    const COMMANDS = [["Run agent", "Started a run"], ["Approve all", "Approved 3 tool calls"], ["Deploy preview", "Deploying preview"], ["Export frame", "Exported Card.svg"],
      ["Open trace", "Opened the last trace"], ["Compare branches", "Comparing branches"], ["Rerun failed steps", "Queued 2 steps"], ["Pause queue", "Paused the queue"],
      ["Set budget", "Budget $4.00 a run"], ["New component", "Created Untitled"]];
    const TASKS = ["Fix login redirect", "Draft release notes", "Audit tokens", "Write tests for cart", "Rename props", "Summarize issues", "Resize hero frame", "Check contrast"];
    function hash(n, salt) {
      let x = Math.imul(n ^ Math.imul(salt, 0x9e3779b1), 0x85ebca6b) >>> 0;

    }
    const RUNS = 2400;
    const ITEMS = [
      ...COMMANDS.map(([label, done]) => ({ id: "c-" + label, label, group: "Commands", done })),
      ...AGENTS.map(([name, c]) => ({ id: "a-" + name, label: name, group: "Agents", agent: name, tone: c, cut: name.length, meta: "Agent", done: "Opened " + name })),
      ...Array.from({ length: RUNS }, (_, i) => {
        const n = RUNS - i, [agent, c] = AGENTS[n % 4], task = TASKS[Math.floor(n / 4) % 8];
        const failed = hash(n, 7) < 0.06, secs = 4 + hash(n, 1) * 170;
        /* The agent's name is searchable but drawn as its chip; the label shows the task. */
        return { id: "r-" + n, label: `${agent} ${task} #${n}`, cut: agent.length + 1, agent, tone: c, group: "Runs", bad: failed,

    /* --- Fuzzy matching (the original's dynamic program, unchanged) --------------------------------------- */
    const BONUS = { start: 12, word: 9, run: 7 }, GAP = 1;
    const codesOf = (t) => Uint16Array.from(t, (c) => c.charCodeAt(0));
    const isSep = (c) => c === " " || c === "_" || c === "-" || c === "." || c === "/" || c === ":" || c === ",";

    const isLetter = (c) => c.toLowerCase() !== c.toUpperCase();
    function prepare(label) {
      const bonus = new Uint8Array(label.length);
      for (let j = 0; j < label.length; j++) {

      let prev = 0, end = 0;
      for (let i = 0; i < m; i++) {
        const c = word[i], row = i * n;
        let count = row, p = prev, gap = -Infinity, gapVia = -1;
        for (let j = i; j <= n - m + i; j++) {
          if (codes[j] !== c) continue;
          let best = -Infinity, from = -1;
          if (i === 0) best = 0;
          else {
            for (; p < end && where[p] <= j - 2; p++) { const reach = worth[p] + GAP * where[p]; if (reach > gap) { gap = reach; gapVia = p; } }
            if (gap > -Infinity) { best = gap - GAP * (j - 1); from = gapVia; }

      if (out) { const first = out.length; out.length += m; for (let i = m - 1, e = last; i >= 0; e = via[e], i--) out[first + i] = where[e]; }
      return worth[last];
    }
    const names = [], groupOf = new Int32Array(ITEMS.length);
    ITEMS.forEach((it, i) => { let g = names.indexOf(it.group); if (g < 0) g = names.push(it.group) - 1; groupOf[i] = g; });
    const prepared = ITEMS.map((it) => prepare(it.label));
    const SLOT = 2 ** 21, OFFSET = 2 ** 20;
    function search(query) {
      const words = query.toLowerCase().split(/\s+/).filter(Boolean).map(codesOf);
      const n = prepared.length;
      let ranked = new Int32Array(n), count = 0;
      if (!words.length) for (; count < n; count++) ranked[count] = count;
      else {

          for (let w = 0; w < words.length && score > -Infinity; w++) score += align(words[w], prepared[i]);
          if (score > -Infinity) keys[count++] = (OFFSET - score) * SLOT + i;
        }

      }
      ranked = ranked.subarray(0, count);
      const seen = new Int32Array(names.length).fill(-1), groups = [];
      for (const i of ranked) { const g = groupOf[i]; if (seen[g] < 0) { seen[g] = groups.length; groups.push({ name: names[g], first: 0, size: 0 }); } groups[seen[g]].size++; }
      for (let g = 1; g < groups.length; g++) groups[g].first = groups[g - 1].first + groups[g - 1].size;
      const order = new Int32Array(count), next = groups.map((g) => g.first);
      for (const i of ranked) order[next[seen[groupOf[i]]]++] = i;
      return { words, order, groups };
    }
    function locate(words, p) {
      const out = [];
      for (const w of words) align(w, p, out);
      if (words.length < 2) return out;
      let w = 0;
      for (let r = 0; r < out.length; r++) {
        const v = out[r]; let a = w;

        for (let b = w; b > a; b--) out[b] = out[b - 1];
        out[a] = v; w++;
      }

      return out;
    }
    const rowOf = ({ groups }, i) => { let g = 0; while (g < groups.length - 1 && i >= groups[g + 1].first) g++; return i + g + 1; };
    function atRow({ groups }, r) {
      for (let g = 0; g < groups.length; g++) {
        const heading = groups[g].first + g;
        if (r === heading) return { group: g, option: -1 };
        if (r <= heading + groups[g].size) return { group: g, option: r - g - 1 };
      }
      return { group: -1, option: -1 };
    }
    const thousands = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    /* --- DOM ------------------------------------------------------------------------------------------------ */
    const uid = "cm" + Math.random().toString(36).slice(2, 7);
    host.innerHTML = `<div class="cm">
      <div class="cm-strip"><b>Command</b>
        <label class="cm-field"><svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="5" cy="5" r="3.5"/><path d="m8 8 3 3"/></svg>
          <span class="cm-in"><input type="text" role="combobox" aria-label="Search commands, agents and runs" aria-controls="${uid}-list" aria-autocomplete="list" aria-expanded="true"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Search">
            <span class="cm-ghost" aria-hidden="true"><span></span><i></i></span></span></label>
        <span class="cm-count" aria-hidden="true"></span></div>
      <div class="cm-wrap"><div class="cm-list" id="${uid}-list" role="listbox" aria-label="Results" tabindex="-1"><div class="cm-body"></div></div></div>
      <p class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>`;
    const root = host.querySelector(".cm"), input = host.querySelector("input"), list = host.querySelector(".cm-list"), body = host.querySelector(".cm-body");
    const countEl = host.querySelector(".cm-count"), say = host.querySelector('[role="status"]'), ghostText = host.querySelector(".cm-ghost span");

    const OVERSCAN = 3, CHUNK = 4, SETTLE = 450, ROW = 28;
    let query = "", results = search(""), active = 0, follow = false, announceTimer = 0, runTimer = 0, saidUntil = 0;
    let view = { start: 0, rows: 9, span: 9 + 2 * OVERSCAN + CHUNK };

    const total = () => results.order.length;
    const current = () => Math.min(active, total() - 1);
    const countText = () => !results.words.length ? `${thousands(ITEMS.length)}` : `${thousands(total())} found`;
    const marked = (text, matches, from) => {
      let s = "", k = 0;
      const m = matches.filter((p) => p >= from && p < from + text.length).map((p) => p - from);
      if (!m.length) return esc(text);
      for (let i = 0; i < text.length; ) {

        i = j;
      }
      return s;
    };

    function rowHTML(item, matches, row, option) {
      const cut = item.cut || 0, text = item.label.slice(cut);
      const chip = item.agent ? `<span class="cm-chip" data-tone="${item.tone}">${marked(item.agent, matches, 0)}</span>` : "";
      const label = item.group === "Agents" ? "" : `<span class="cm-label${matches.length ? "" : " is-plain"}">${marked(text, matches, cut)}</span>`;
      const meta = item.meta ? `<span class="cm-meta${item.bad ? " is-bad" : ""}">${esc(item.meta)}</span>` : "";
      const fill = item.group === "Agents" ? `<span class="cm-label"></span>` : "";
      return `<div class="cm-row" id="${uid}-${item.id.replace(/\W/g, "_")}" role="option" aria-label="${esc(item.agent && item.group === "Runs" ? item.agent + ": " + text : item.label)}" aria-selected="${option === current()}" data-opt="${option}" style="top:${row * ROW}px">${chip}${label}${fill}${meta}</div>`;
    }

    function draw() {
      const { order, groups, words } = results, t = total(), cur = current();
      const rowCount = t + groups.length, end = Math.min(rowCount, view.start + view.span);
      const activeRow = cur >= 0 ? rowOf(results, cur) : -1;
      const shown = [];
      const add = (row, at) => shown.push({ row, ...at, item: ITEMS[order[at.option]], matches: locate(words, prepared[order[at.option]]) });
      for (let r = view.start; r < end; r++) { const at = atRow(results, r); if (at.option >= 0) add(r, at); }
      if (activeRow >= 0 && (activeRow < view.start || activeRow >= end)) add(activeRow, atRow(results, activeRow));
      let html = "";
      groups.forEach((g, gi) => {
        const members = shown.filter((s) => s.group === gi);
        if (!members.length) return;
        html += `<div role="group" aria-labelledby="${uid}-g${gi}"><div class="cm-head" id="${uid}-g${gi}" style="top:${(g.first + gi) * ROW}px">${esc(g.name)}</div>`;
        html += members.map((m) => rowHTML(m.item, m.matches, m.row, m.option)).join("") + "</div>";
      });
      if (!t) html += `<p class="cm-none">Nothing matches “${esc(query.trim())}”</p>`;

    }
    function update() {
      const activeRow = draw();

      const top = (activeRow - 1) * ROW, bottom = (activeRow + 2) * ROW;

      if (top < next) next = Math.max(0, top);

      if (next !== list.scrollTop) list.scrollTop = next;

      update();
      clearTimeout(announceTimer);
      announceTimer = setTimeout(() => { if (query.trim()) say.textContent = total() ? `${thousands(total())} found` : `Nothing matches ${query.trim()}`; }, SETTLE);
    }

    function run(i) {

    const KEYS = { ArrowDown: "down", ArrowUp: "up", PageDown: "pageDown", PageUp: "pageUp", Home: "home", End: "end", Enter: "enter", Escape: "escape" };

    list.addEventListener("pointermove", (e) => {

      pointer.x = e.clientX; pointer.y = e.clientY;
      const i = +row.dataset.opt;
      if (i !== current()) moveTo(i, "pointer");
    }, opt);
    list.addEventListener("click", (e) => {
      const row = e.target.closest("[data-opt]");
      if (!row) return;
      const i = +row.dataset.opt;
      if (i !== current()) moveTo(i, "pointer");
      run(i);
    }, opt);
    list.addEventListener("scroll", () => {
      const first = Math.floor(list.scrollTop / ROW);
      const start = Math.max(0, Math.floor((first - OVERSCAN) / CHUNK) * CHUNK);
      if (start !== view.start) { view.start = start; draw(); }
    }, opt);
    const ro = new ResizeObserver(() => {
      const fit = Math.max(1, Math.round(list.clientHeight / ROW));

    });

    setQuery("");

    /* --- The self-run: someone types, steps down, runs it; a beat later, again. A hand ends it for good. ------ */
    const ROUNDS = [
      { query: "fix", keys: ["down", "down", "enter"] },
      { query: "dep", keys: ["enter"] },
      { query: "rev audit", keys: ["down", "enter"] },
      { query: "plan", keys: ["enter"] },
    ];
    let live = false, timer = 0, ghostWords = false;
    function takeOver() {
      if (!live) return;
      live = false; clearTimeout(timer); root.classList.remove("is-ghost"); ghostWords = !!query;
    }
    if (!ctx.reduced()) {
      live = true; root.classList.add("is-ghost");
      let round = 0, steps = [];
      const plan = () => {
        const { query: q, keys } = ROUNDS[round++ % ROUNDS.length];
        const out = [[round === 1 ? 300 : 200, () => setQuery("")]];
        for (let i = 1; i <= q.length; i++) out.push([i === 1 ? 400 : 110 + Math.random() * 80, () => setQuery(q.slice(0, i))]);
        keys.forEach((k, i) => out.push([i === 0 ? 600 : 360, () => press(k)]));

      };

        if (!steps.length) steps = plan();
        const [wait, act] = steps.shift();

    }
    ctx.onHand(takeOver);

    return { destroy() { live = false; clearTimeout(timer); clearTimeout(announceTimer); clearTimeout(runTimer); ro.disconnect(); } };
  },
});

</script>
<script>

    const { signal } = ctx;
    const id = "fs-cb-" + ++uid;
    host.innerHTML = `
      <div class="cb">
        <div class="cb-strip"><b id="${id}-t">Install</b><div class="cb-seg" role="radiogroup" aria-label="Package manager"></div></div>

          <span class="cb-done" aria-hidden="true" hidden>Copied</span>

        </div>
        <span class="sr-only" role="status" aria-live="polite"></span>
      </div>`;
    const $ = (s) => host.querySelector(s);
    const seg = $(".cb-seg"), surface = $(".cb-surface"), runEl = $(".cb-run"), doneEl = $(".cb-done"), key = $(".cb-key"), status = $("[role=status]");

    let pm = 0, timer = 0, copied = false;
    const value = () => `${MANAGERS[pm].run} ${PART}`;

    /* The chooser: one tab stop; the arrows move and choose, as a radiogroup does. */
    const opts = MANAGERS.map((m, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "radio");
      b.textContent = m.id;
      b.addEventListener("click", () => choose(i), { signal });
      seg.appendChild(b);
      return b;
    });

    }
    seg.addEventListener("keydown", (e) => {
      if (e.key === "Home" || e.key === "End") { e.preventDefault(); choose(e.key === "Home" ? 0 : MANAGERS.length - 1, true); return; }

      if (!d) return;
      e.preventDefault();
      choose(pm + d, true);

    /* --- Copy: it answers in place, on the frame, and cuts back after the hold. --- */
    function unmark() {
      clearTimeout(timer);
      copied = false;
      surface.classList.remove("is-copied");
      key.innerHTML = COPY;
      key.setAttribute("aria-label", "Copy command");
      doneEl.hidden = true;
    }
    function mark(real) {
      unmark();
      copied = true;
      surface.classList.add("is-copied");
      key.innerHTML = CHECK;
      key.setAttribute("aria-label", "Copied");
      doneEl.hidden = false;

    }
    async function copy() {
      const text = value();
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
        host.appendChild(ta);

    let ghost = !ctx.reduced();
    ctx.onHand(() => { ghost = false; key.removeAttribute("data-pressed"); });
    let n = 0;

      });
      ctx.after(3000, cycle);
    };
    if (ghost) ctx.after(0, cycle);

    return { destroy() { clearTimeout(timer); ghost = false; } };
  }

  FlatPlayer.register({
    slug: "copy-button",
    title: "Copy Button",
    tagline: "Pick the manager, copy the command: it answers on the frame.",
    css,
    mount,
  });
})();

    mount(host, ctx) {

      host.innerHTML = `

      const $ = (q) => host.querySelector(q);
