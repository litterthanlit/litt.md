      const f = field($(".gk-field"), LOOKS[0].palette, SEED, reduced, S);
      let at = 0, queued = -1, running = !reduced, ghost = !reduced, clock = 0, launchedAt = 0;
      const clips = LOOKS.map((l, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "rk-clip"; b.setAttribute("role", "radio");
        b.style.setProperty("--c", `var(--clip-${l.hue})`); b.style.setProperty("--c-tint", `var(--clip-${l.hue}-tint)`); b.style.setProperty("--c-text", `var(--clip-${l.hue}-text)`);
        b.innerHTML = `<span class="rk-glyph"></span><b></b><small></small><span class="rk-sw" aria-hidden="true"></span><span class="rk-bar" aria-hidden="true"></span>`;

      function launch(i) {

        render();
        live.textContent = LOOKS[i].name + " playing";
      }
      function queue(i, say) {
        if (i === at && queued < 0) return;
        if (reduced || !running) { launch(i); return; }
        queued = i; render();
        if (say) live.textContent = LOOKS[i].name + " queued";

      ctx.onHand(() => { ghost = false; });

<script>
/* hold-to-confirm.js */
/* Hold to Confirm, Rack 2.0: delete a branch. One surface holds four branches, each in its agent's colour (Planner purple,
   Coder orange, Reviewer green); the stale one is selected. The strip's key is the action: hold it and its box fills with
   the danger red, linearly, for 1200 ms; let go early and it runs back in 220 ms. Full, the branch cuts out of the surface
   and the key becomes Undo. A ghost rehearses the hold until a hand arrives. */
(function () {
  const DURATION = 1200, REWIND = 220, HOLD_LIT = 300;
  const BRANCHES = [
    { name: "plan/q4", hue: "purple" },
    { name: "feat/toast", hue: "orange" },
    { name: "spike/dither", hue: "orange", sel: true },
    { name: "review/415", hue: "green" },
  ];
  let n = 0;

  FlatPlayer.register({
    slug: "hold-to-confirm",
    title: "Hold to Confirm",
    tagline: "Hold the key until it fills.",
    css: `
.fs-hold-to-confirm .hb { width: min(100%, 360px); font-size: 12px; background: var(--panel); border-radius: var(--r-panel); overflow: hidden; -webkit-user-select: none; user-select: none }
.fs-hold-to-confirm .hb-strip { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 10px; background: var(--panel-2); white-space: nowrap }
.fs-hold-to-confirm .hb-strip b { font-weight: 600; margin-right: auto }
.fs-hold-to-confirm .hb-key { position: relative; height: 22px; min-width: 132px; padding: 0 8px; border: 0; border-radius: var(--r-control); overflow: hidden; background: var(--block);
  box-shadow: var(--edge); color: var(--ink); font: 600 11px var(--font); cursor: pointer; touch-action: none; -webkit-touch-callout: none;
  transition: background-color var(--cut-in) var(--ease-out) }
.fs-hold-to-confirm .hb-key:hover { background: var(--block-hover) }
.fs-hold-to-confirm .hb-key[data-pressed] { box-shadow: var(--edge-press); transform: scale(0.98) }
.fs-hold-to-confirm .hb-key span { position: absolute; inset: 0; display: grid; place-items: center }
.fs-hold-to-confirm .hb-fill { background: var(--danger); color: var(--cut); clip-path: inset(0 calc(100% - var(--p, 0) * 100%) 0 0) }
.fs-hold-to-confirm .hb-key[hidden] { display: none }
.fs-hold-to-confirm .hb-wrap { padding: 12px }
.fs-hold-to-confirm .hb-surface { list-style: none; margin: 0; padding: 10px; display: grid; gap: 6px; background: var(--cut); border-radius: var(--r-control); box-shadow: var(--edge); min-height: 156px; align-content: start }
.fs-hold-to-confirm .hb-br { height: 28px; padding: 0 8px; display: flex; align-items: center; border-radius: var(--r-control); font: 600 11px var(--mono);
  animation: hb-in var(--cut-in) var(--ease-out) both }
.fs-hold-to-confirm .hb-br[data-tone="purple"] { background: var(--clip-purple-tint); box-shadow: inset 0 0 0 1px var(--clip-purple); color: var(--clip-purple-text) }
.fs-hold-to-confirm .hb-br[data-tone="orange"] { background: var(--clip-orange-tint); box-shadow: inset 0 0 0 1px var(--clip-orange); color: var(--clip-orange-text) }
.fs-hold-to-confirm .hb-br[data-tone="green"] { background: var(--clip-green-tint); box-shadow: inset 0 0 0 1px var(--clip-green); color: var(--clip-green-text) }
.fs-hold-to-confirm .hb-br[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--clip-orange) }
@keyframes hb-in { from { opacity: 0 } }
`,
    mount(host, ctx) {
      const id = "hb" + ++n;
      host.innerHTML = `
<div class="hb">
  <div class="hb-strip"><b>Branches</b>
    <button class="hb-key" type="button" data-k="del" aria-describedby="${id}-hint"><span>Hold to delete</span><span class="hb-fill" aria-hidden="true">Hold to delete</span></button>
    <button class="hb-key" type="button" data-k="undo" hidden><span>Undo</span></button>
  </div>
  <div class="hb-wrap"><ul class="hb-surface" aria-label="Branches"></ul></div>
  <span id="${id}-hint" class="sr-only">Press and hold to delete spike/dither</span>
  <p class="sr-only" role="status" aria-live="polite"></p>
</div>`;
      const sig = { signal: ctx.signal };
      const list = host.querySelector(".hb-surface"), live = host.querySelector("[role=status]");
      const del = host.querySelector('[data-k="del"]'), undo = host.querySelector('[data-k="undo"]');
      let deleted = false, back = 0;
      const SEL = BRANCHES.find((b) => b.sel).name;

      function render() {
        list.textContent = "";
        BRANCHES.forEach((b) => {
          if (b.sel && deleted) return;
          const li = document.createElement("li");
          li.className = "hb-br"; li.dataset.tone = b.hue; li.textContent = b.name;
          if (b.sel) li.setAttribute("aria-current", "true");
          list.appendChild(li);
        });
        del.hidden = deleted; undo.hidden = !deleted;
      }
      render();

      let p = 0, holding = false, ghost = false, litUntil = 0, loop = null;
      const draw = () => del.style.setProperty("--p", p.toFixed(4));
      function frame(dt, now) {
        if (holding) {
          p = Math.min(1, p + (dt * 1000) / DURATION);
          if (p >= 1) { holding = false; litUntil = now + HOLD_LIT; del.removeAttribute("data-pressed"); if (!ghost) ctx.after(HOLD_LIT, confirm); }
        } else if (now >= litUntil) p = Math.max(0, p - (dt * 1000) / REWIND);
        draw();
        if (holding || p > 0) return true;
        loop = null; return false;
      }
      const run = () => { if (!loop) loop = ctx.loop(frame); };
      function press(rehearsal) { if (deleted || holding || performance.now() < litUntil) return; ghost = !!rehearsal; holding = true; del.setAttribute("data-pressed", ""); run(); }
      function release() { if (!holding) return; holding = false; del.removeAttribute("data-pressed"); run(); }
      function confirm() {
        p = 0; draw(); deleted = true; render();
        live.textContent = SEL + " deleted. Undo is available.";
        if (del === document.activeElement || document.activeElement === document.body) undo.focus({ preventScroll: true });
        back = ctx.after(4000, () => { deleted = false; render(); live.textContent = ""; });
      }
      undo.addEventListener("click", () => { clearTimeout(back); deleted = false; render(); live.textContent = SEL + " restored"; del.focus({ preventScroll: true }); }, sig);

      del.addEventListener("pointerdown", (e) => { if (e.button === 0) press(false); }, sig);
      for (const t of ["pointerup", "pointerleave", "pointercancel"]) del.addEventListener(t, release, sig);
      del.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); press(false); } }, sig);
      del.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") release(); }, sig);
      del.addEventListener("contextmenu", (e) => e.preventDefault(), sig);
      del.addEventListener("click", (e) => e.preventDefault(), sig);

      let handed = false;
      ctx.onHand(() => { handed = true; if (ghost && holding) release(); });
      if (!ctx.reduced()) {
        const rehearse = () => { if (handed || deleted) return; press(true); ctx.after(DURATION * 0.6, () => { if (!handed && ghost) release(); }); };
        ctx.after(500, rehearse);
        ctx.every(3000, rehearse);
      }
    },
  });
})();

</script>
<script>
/* knob.js */
/* Knob, Rack 2.0: a design tool's props for one component. The canvas carries the Card (pink, as layers are across the
   wall); beside it, three value boxes: Radius, Padding and Border. Drag a box up or down to set it 1:1 (Shift for fine),
   arrows step, double-click returns to the default, and it stays where the hand left it. While a box is in hand the canvas
   draws the measurement on the card in red. Variations A and B jump every prop on the tick, one after another (60 ms): no
   glide. A ghost compares the two variations until a hand arrives. */
(function () {
  const PROPS = [
    { key: "radius", label: "Radius", min: 0, max: 24, step: 1, home: 8, unit: "px" },
    { key: "pad", label: "Padding", min: 0, max: 32, step: 2, home: 12, unit: "px" },
    { key: "border", label: "Border", min: 0, max: 4, step: 0.5, home: 1, unit: "px" },

  const VARS = { A: { radius: 12, pad: 16, border: 1 }, B: { radius: 2, pad: 6, border: 3 } };
  const fmt = (p, v) => (p.step < 1 ? v.toFixed(1) : String(v)) + " " + p.unit;

  FlatPlayer.register({
    slug: "knob",

    css: `

  font: 600 11px var(--font); cursor: pointer; transition: background-color var(--cut-in) var(--ease-out), color var(--cut-in) var(--ease-out) }
.fs-knob .kp-key:hover { background: var(--block-hover) }
.fs-knob .kp-key:active { box-shadow: var(--edge-press); transform: scale(0.98) }
.fs-knob .kp-key[aria-checked="true"] { background: var(--accent); color: var(--accent-fg) }
.fs-knob .kp-wrap { padding: 12px }
.fs-knob .kp-canvas { position: relative; display: grid; place-items: center; min-height: 168px; background-color: var(--cut); border-radius: var(--r-control); box-shadow: var(--edge);
  background-image: linear-gradient(color-mix(in oklab, var(--line) 55%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in oklab, var(--line) 55%, transparent) 1px, transparent 1px); background-size: 12px 12px; background-position: -1px -1px }

  box-shadow: inset 0 0 0 max(1px, var(--bw, 1px)) var(--clip-pink); border-radius: var(--rad, 0); padding: var(--pd, 0) }
.fs-knob .kp-card b { font-weight: 600; font-size: 11px; line-height: 14px }
.fs-knob .kp-card i { display: block; height: 6px; border-radius: 1px; background: var(--clip-pink); opacity: 0.4 }

.fs-knob .kp-tag { position: absolute; right: -6px; top: -9px; padding: 1px 3px; background: var(--danger); color: var(--cut); border-radius: var(--r-control);
  font: 600 9px/11px var(--mono); white-space: nowrap; display: none }
.fs-knob .kp[data-show] .kp-tag { display: block }
.fs-knob .kp[data-show="pad"] .kp-guide { display: block }
.fs-knob .kp-props { display: grid; gap: 8px; padding: 12px 10px; align-content: start }
.fs-knob .kp-prop { display: grid; gap: 3px }
.fs-knob .kp-prop span { color: var(--muted); font-size: 11px }
.fs-knob .kp-box { height: 24px; padding: 0 8px; display: flex; align-items: center; border-radius: var(--r-control); background: var(--cut); box-shadow: var(--edge);
  font: 600 11px var(--mono); cursor: ns-resize; touch-action: none; white-space: nowrap }

.fs-knob.is-tile .kp-side { display: none }
@container (max-width: 440px) { .fs-knob:not(.is-tile) .kp { grid-template-columns: 1fr } .fs-knob .kp-props { grid-template-columns: repeat(3, 1fr) } }
`,
    mount(host, ctx) {
      host.innerHTML = `
<div class="kp">
  <div class="kp-dev">
    <div class="kp-strip"><b>Card</b>
      <span role="radiogroup" aria-label="Variation" style="display:flex;gap:3px"><button class="kp-key" type="button" role="radio" data-v="A" aria-label="Variation A">A</button><button class="kp-key" type="button" role="radio" data-v="B" aria-label="Variation B">B</button></span>
    </div>
    <div class="kp-wrap"><div class="kp-canvas" aria-hidden="true"><div class="kp-card"><b>Card</b><i></i><i></i><span class="kp-guide"></span><span class="kp-tag"></span></div></div></div>

      const sig = { signal: ctx.signal };
      const root = host.querySelector(".kp"), card = host.querySelector(".kp-card"), tag = host.querySelector(".kp-tag"), props = host.querySelector(".kp-props");
      const vars = [...host.querySelectorAll("[data-v]")], live = host.querySelector("[aria-live]");
      const values = {}, boxes = {};
      let variation = "A", edited = false, timers = [];
      const css = { radius: "--rad", pad: "--pd", border: "--bw" };

      function show(key) {
        if (!key) { root.removeAttribute("data-show"); return; }
        root.dataset.show = key;
        const p = PROPS.find((x) => x.key === key);
        tag.textContent = fmt(p, values[key]);
      }
      function set(p, v, byHand) {
        v = Math.min(p.max, Math.max(p.min, Math.round(v / p.step) * p.step));
        values[p.key] = v;

        const b = boxes[p.key];
        b.textContent = fmt(p, v); b.setAttribute("aria-valuenow", String(v)); b.setAttribute("aria-valuetext", fmt(p, v));
        if (root.dataset.show === p.key) tag.textContent = fmt(p, v);
        if (byHand && !edited) { edited = true; drawVars(); live.textContent = "Variation " + variation + " edited"; }
      }
      PROPS.forEach((p) => {
        const wrap = document.createElement("label");

        wrap.innerHTML = '<span></span><span class="kp-box" role="slider" tabindex="0" aria-orientation="vertical"></span>';
        wrap.querySelector("span").textContent = p.label;

        b.addEventListener("pointerdown", (e) => { if (e.button !== 0) return; b.setPointerCapture(e.pointerId); drag = { id: e.pointerId, y: e.clientY, from: values[p.key] }; show(p.key); }, sig);
        b.addEventListener("pointermove", (e) => { if (drag && drag.id === e.pointerId) set(p, drag.from + ((drag.y - e.clientY) / (e.shiftKey ? 16 : 4)) * p.step, true); }, sig);
        const end = (e) => { if (drag && drag.id === e.pointerId) { drag = null; if (document.activeElement !== b) show(null); } };
        b.addEventListener("pointerup", end, sig); b.addEventListener("pointercancel", end, sig);

        b.addEventListener("focus", () => show(p.key), sig);
        b.addEventListener("blur", () => show(null), sig);
        b.addEventListener("keydown", (e) => {
          const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 4, PageDown: -4 }[e.key];
          if (d) set(p, values[p.key] + d * p.step, true); else if (e.key === "Home") set(p, p.min, true); else if (e.key === "End") set(p, p.max, true); else return;

      function recall(v) {
        timers.forEach(clearTimeout);
        variation = v; edited = false; drawVars();
        const beat = ctx.reduced() ? 0 : 60;
        timers = PROPS.map((p, i) => ctx.after(i * beat, () => set(p, VARS[v][p.key], false)));
        live.textContent = "Variation " + v;
      }
      vars.forEach((b) => b.addEventListener("click", () => recall(b.dataset.v), sig));
      vars[0].parentElement.addEventListener("keydown", (e) => {
        if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;
        e.preventDefault(); const v = variation === "A" ? "B" : "A"; recall(v); vars.find((b) => b.dataset.v === v).focus();
      }, sig);
      drawVars();

      let handed = false;
      ctx.onHand(() => { handed = true; });
      ctx.after(300, () => recall("A"));
      if (!ctx.reduced()) ctx.every(2000, () => { if (!handed) recall(variation === "A" ? "B" : "A"); });
    },
  });

<script>
/* magnetic-button.js */
/* Magnetic Button, in Rack: the gravity becomes a design tool's snapping. On a canvas with a Header (purple) and a
   Sidebar (green), the Card frame (pink) follows the hand 1:1. Within reach of another frame's edge or centre it is
   caught and a guide cuts in along the line it met; otherwise, with Snap lit, it lands on the grid. It stays where it
   is let go: no spring, no inertia. X and Y are value boxes. Arrows nudge a pixel, Shift a grid step; double-click
   puts it back. Each frame keeps its colour on the canvas and in the layer list. */
FlatPlayer.register({
  slug: "magnetic-button",
  title: "Magnetic Button",
  tagline: "A frame with a little gravity: edges and the grid catch it.",
  css: `
.fs-magnetic-button .mg { width: min(100%, 680px); display: grid; grid-template-columns: 1fr 150px; gap: 3px; font-size: 12px }

.fs-magnetic-button .mg-strip { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 10px; background: var(--panel-2); white-space: nowrap }
.fs-magnetic-button .mg-strip > b { font-weight: 600; margin-right: auto }
.fs-magnetic-button .mg-key, .fs-magnetic-button .mg-box { height: 22px; padding: 0 8px; border: 0; border-radius: var(--r-control); box-shadow: var(--edge);
  background: var(--block); color: var(--ink); font: 600 11px/22px var(--font); cursor: pointer; white-space: nowrap; transition: background-color var(--cut-in) var(--ease-out) }
.fs-magnetic-button .mg-box { background: var(--cut); font: 600 11px/22px var(--mono); min-width: 48px; text-align: left }
.fs-magnetic-button .mg-key:hover { background: var(--block-hover) }
.fs-magnetic-button .mg-key:active, .fs-magnetic-button .mg-box:active { box-shadow: var(--edge-press); transform: scale(0.98); transition: none }
.fs-magnetic-button .mg-key[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
.fs-magnetic-button .mg-lbl { color: var(--muted); font-size: 11px }
.fs-magnetic-button .mg-wrap { padding: 8px }
.fs-magnetic-button .mg-canvas { position: relative; aspect-ratio: 2 / 1; background: var(--slot); border-radius: var(--r-control); box-shadow: var(--edge); overflow: hidden; touch-action: none }
.fs-magnetic-button .mg-canvas > svg { position: absolute; inset: 0; width: 100%; height: 100% }
.fs-magnetic-button .mg-f { position: absolute; border-radius: var(--r-control); font: 600 10px/1 var(--font); padding: 4px 5px; overflow: hidden; white-space: nowrap }
.fs-magnetic-button .mg-f[data-tone="purple"] { background: var(--clip-purple-tint); box-shadow: inset 0 0 0 1px var(--clip-purple); color: var(--clip-purple-text) }
.fs-magnetic-button .mg-f[data-tone="green"] { background: var(--clip-green-tint); box-shadow: inset 0 0 0 1px var(--clip-green); color: var(--clip-green-text) }
.fs-magnetic-button .mg-f[data-tone="pink"] { background: var(--clip-pink-tint); box-shadow: inset 0 0 0 1px var(--clip-pink); color: var(--clip-pink-text); cursor: grab }
.fs-magnetic-button .mg-f.is-held { cursor: grabbing; box-shadow: inset 0 0 0 2px var(--clip-pink) }
.fs-magnetic-button .mg-guide { position: absolute; background: var(--ink); pointer-events: none; animation: fs-mg-in var(--cut-in) var(--ease-out) both }
.fs-magnetic-button .mg-guide.is-x { top: 0; bottom: 0; width: 1px }
.fs-magnetic-button .mg-guide.is-y { left: 0; right: 0; height: 1px }
@keyframes fs-mg-in { from { opacity: 0 } }
.fs-magnetic-button .mg-side { display: grid; align-content: start }
.fs-magnetic-button .mg-props { display: grid; grid-template-columns: auto 1fr; gap: 4px 6px; align-items: center; padding: 8px }
.fs-magnetic-button .mg-props b { height: 22px; padding: 0 6px; background: var(--cut); box-shadow: var(--edge); border-radius: var(--r-control); font: 600 11px/22px var(--mono) }
.fs-magnetic-button .mg-layers { list-style: none; margin: 0; padding: 0 8px 8px; display: grid; gap: 2px }
.fs-magnetic-button .mg-layers li { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px; border-radius: var(--r-control); background: var(--panel-2); font-size: 11px;
  box-shadow: inset 3px 0 0 var(--tone) }
.fs-magnetic-button .mg-layers li.is-sel { background: var(--cut); box-shadow: inset 3px 0 0 var(--tone), var(--edge) }
.fs-magnetic-button .mg-say { padding: 0 8px 8px; color: var(--muted); font-size: 11px; margin: 0 }
.fs-magnetic-button .mg-say b { color: var(--ink); font-weight: 600 }
.fs-magnetic-button.is-tile .mg { grid-template-columns: 1fr }
.fs-magnetic-button.is-tile .mg-side { display: none }
@container (max-width: 460px) {
  .fs-magnetic-button:not(.is-tile) .mg { grid-template-columns: 1fr }
  .fs-magnetic-button .mg-layers { display: none }
  .fs-magnetic-button .mg-props { grid-template-columns: auto 1fr auto 1fr }

`,
  mount(host, ctx) {
    const W = 480, H = 240, REACH = 6; // design px; inside REACH an edge or centre catches the card
    const GRIDS = [4, 8, 16];
    const STATIC = [
      { name: "Header", tone: "purple", x: 24, y: 16, w: 432, h: 32 },
      { name: "Sidebar", tone: "green", x: 24, y: 64, w: 112, h: 160 },
    ];
    const HOME = { x: 216, y: 88 }, CW = 160, CH = 96;
    host.innerHTML = `<div class="mg">
      <div class="mg-dev">
        <div class="mg-strip"><b>Canvas</b><span class="mg-lbl">Grid</span><button type="button" class="mg-box" aria-label="Grid size">8 px</button>
          <button type="button" class="mg-key" aria-pressed="true">Snap</button></div>
        <div class="mg-wrap"><div class="mg-canvas">
          <svg aria-hidden="true" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="mg-grid"></svg>
          ${STATIC.map((f) => `<div class="mg-f" data-tone="${f.tone}" aria-hidden="true" style="left:${(f.x / W) * 100}%;top:${(f.y / H) * 100}%;width:${(f.w / W) * 100}%;height:${(f.h / H) * 100}%">${f.name}</div>`).join("")}
          <div class="mg-guides" aria-hidden="true"></div>
          <div class="mg-f mg-card" data-tone="pink" tabindex="0" role="button" aria-roledescription="movable frame" aria-label="Card frame. Arrows move it.">Card</div>
        </div></div>
      </div>
      <div class="mg-dev mg-side">
        <div class="mg-strip"><b>Inspector</b></div>
        <div class="mg-props"><span class="mg-lbl">X</span><b class="mg-x"></b><span class="mg-lbl">Y</span><b class="mg-y"></b><span class="mg-lbl">W</span><b>${CW}</b><span class="mg-lbl">H</span><b>${CH}</b></div>
        <ul class="mg-layers" aria-hidden="true"><li class="is-sel" style="--tone:var(--clip-pink)">Card</li>${STATIC.map((f) => `<li style="--tone:var(--clip-${f.tone})">${f.name}</li>`).join("")}</ul>
        <p class="mg-say" aria-hidden="true"></p>
      </div>
      <p class="sr-only" aria-live="polite"></p>
    </div>`;
    const canvas = host.querySelector(".mg-canvas"), card = host.querySelector(".mg-card"), guides = host.querySelector(".mg-guides"), gridSvg = host.querySelector(".mg-grid");
    const snapKey = host.querySelector(".mg-key"), gridBox = host.querySelector(".mg-box"), xEl = host.querySelector(".mg-x"), yEl = host.querySelector(".mg-y");
    const sayEl = host.querySelector(".mg-say"), live = host.querySelector("[aria-live]");
    const opt = { signal: ctx.signal };

    let snap = true, gi = 1, x = HOME.x, y = HOME.y, caught = "";
    const unit = () => canvas.clientWidth / W;
    function drawGrid() {
      const g = GRIDS[gi] * 2; // one line every two grid steps, so the canvas stays quiet
      let d = "";
      for (let i = g; i < W; i += g) d += `M${i} 0V${H}`;
      for (let i = g; i < H; i += g) d += `M0 ${i}H${W}`;
      gridSvg.innerHTML = `<path d="${d}" stroke="var(--line-strong)" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.35" fill="none"/>`;
      gridBox.textContent = GRIDS[gi] + " px";
    }
    function paint(lines) {
      card.style.left = (x / W) * 100 + "%"; card.style.top = (y / H) * 100 + "%";
      card.style.width = (CW / W) * 100 + "%"; card.style.height = (CH / H) * 100 + "%";
      xEl.textContent = Math.round(x); yEl.textContent = Math.round(y);
      const key = (lines || []).map((l) => l.join(":")).join("|");
      if (key !== guides.dataset.key) {
        guides.dataset.key = key;
        guides.innerHTML = (lines || []).map(([axis, v]) => axis === "x" ? `<i class="mg-guide is-x" style="left:${(v / W) * 100}%"></i>` : `<i class="mg-guide is-y" style="top:${(v / H) * 100}%"></i>`).join("");
      }
    }
    /* One axis at a time: the card's three lines (start, centre, end) against every other frame's three and the
       canvas's; the nearest within reach wins. Otherwise the grid, if Snap is lit. */
    function snapAxis(raw, size, axis) {
      const targets = [0, axis === "x" ? W / 2 : H / 2, axis === "x" ? W : H];
      for (const f of STATIC) { const a = axis === "x" ? f.x : f.y, s = axis === "x" ? f.w : f.h; targets.push(a, a + s / 2, a + s); }
      let best = null;
      for (const off of [0, size / 2, size]) for (const t of targets) {
        const d = Math.abs(raw + off - t);
        if (d <= REACH && (!best || d < best.d)) best = { d, v: t - off, line: t };
      }
      if (best) return best;
      return { v: snap ? Math.round(raw / GRIDS[gi]) * GRIDS[gi] : Math.round(raw), line: null };
    }
    function place(rx, ry) {
      rx = Math.max(0, Math.min(W - CW, rx)); ry = Math.max(0, Math.min(H - CH, ry));
      const sx = snapAxis(rx, CW, "x"), sy = snapAxis(ry, CH, "y");
      x = sx.v; y = sy.v;
      const lines = [];
      if (sx.line !== null) lines.push(["x", sx.line]);
      if (sy.line !== null) lines.push(["y", sy.line]);
      caught = lines.length ? "Aligned" : snap ? "On the grid" : "Placed";
      paint(lines);
    }
    function settle(word) {
      paint(guides.dataset.key ? guides.dataset.key.split("|").map((s) => { const [a, v] = s.split(":"); return [a, +v]; }) : []);
      sayEl.innerHTML = `<b>${word}</b> at ${Math.round(x)}, ${Math.round(y)}`;
      live.textContent = `Card ${word.toLowerCase()} at ${Math.round(x)}, ${Math.round(y)}`;
    }

    /* The hand: 1:1, and the card stays where it is let go. */
    let drag = null, ghost = !ctx.reduced();
    card.addEventListener("pointerdown", (e) => {
      if (e.button > 0) return;
      ghost = false;
      drag = { id: e.pointerId, px: e.clientX, py: e.clientY, x, y };
      card.setPointerCapture(e.pointerId); card.classList.add("is-held"); e.preventDefault(); card.focus({ preventScroll: true });
    }, opt);
    card.addEventListener("pointermove", (e) => { if (drag && e.pointerId === drag.id) place(drag.x + (e.clientX - drag.px) / unit(), drag.y + (e.clientY - drag.py) / unit()); }, opt);
    const up = (e) => { if (!drag || e.pointerId !== drag.id) return; drag = null; card.classList.remove("is-held"); settle(caught); };
    card.addEventListener("pointerup", up, opt); card.addEventListener("pointercancel", up, opt);
    card.addEventListener("dblclick", () => { x = HOME.x; y = HOME.y; paint([]); settle("Back"); }, opt);
    card.addEventListener("keydown", (e) => {
      const d = e.shiftKey ? GRIDS[gi] : 1;
      const m = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[e.key];
      if (!m) return;
      e.preventDefault();
      x = Math.max(0, Math.min(W - CW, x + m[0])); y = Math.max(0, Math.min(H - CH, y + m[1]));
      paint([]); settle("Moved");
    }, opt);
    snapKey.addEventListener("click", () => { snap = !snap; snapKey.setAttribute("aria-pressed", String(snap)); live.textContent = snap ? "Snap on" : "Snap off"; }, opt);
    gridBox.addEventListener("click", () => { gi = (gi + 1) % GRIDS.length; drawGrid(); live.textContent = "Grid " + GRIDS[gi] + " pixels"; }, opt);

    drawGrid(); paint([]); sayEl.textContent = "Drag the card";

    /* The self-run: an unseen hand drags the card around the canvas; edges catch it as it passes, so it moves in cuts
       where it aligns. It lets go every few seconds, and the card stays put while it rests. */
    if (ghost) {
      let t = 0, pause = 0, last = 0;
      ctx.loop((dt) => {
        if (!ghost) return false;
        if (pause > 0) { pause -= dt; return; }
        t += dt;
        place(HOME.x + 130 * Math.sin(t * 0.6), HOME.y + 60 * Math.sin(t * 1.1 + 0.4));
        if (t - last > 3.2) { last = t; pause = 0.9; settle(caught); }
      });
    }
    ctx.onHand(() => { ghost = false; });
  },
});

</script>
<script>
/* number-ticker.js */
/* Number Ticker, after litterthanlit/components, redesigned for Rack: an agent's token usage as a device.
   The count is the study's one readout; when it changes, its digits cut to their new figures from the right,
   a tick (60ms) apart, each by opacity alone: nothing rolls or travels. Intl.NumberFormat does the grouping
   and the currency, so the Locale box (a value you step) regroups the same count and cost for en-US, de-DE,
   fr-FR or en-IN. Tokens per day are the Coder agent's object, in its orange, and today's bar grows as requests come in.
   Live is the lit key: on, requests arrive by themselves; a hand ends that. */
(function () {
  const S = ".fs-number-ticker";
  const LOCALES = ["en-US", "de-DE", "fr-FR", "en-IN"];
  const DAYS = 14;
  const PRICE = 0.000015; // dollars a token
  const moneyIn = (l) => new Intl.NumberFormat(l, { style: "currency", currency: "USD" });
  let uid = 0;

  FlatPlayer.register({
    slug: "number-ticker",
    title: "Number Ticker",
    tagline: "Tokens and cost that cut in digit by digit, in any locale.",
    css: `
${S} .nt { width: min(100%, 440px); background: var(--panel); border-radius: var(--r-panel); overflow: hidden; font-size: 12px }
${S} .nt-strip { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 12px; background: var(--panel-2) }
${S} .nt-strip b { font-weight: 600; margin-right: auto }
${S} .nt-key { height: 22px; padding: 0 8px; border: 0; border-radius: var(--r-control); background: var(--block); box-shadow: var(--edge); font: 600 11px/22px var(--font); cursor: pointer }
${S} .nt-key:hover { background: var(--block-hover) }
${S} .nt-key:active { box-shadow: var(--edge-press); transform: scale(0.98) }
${S} .nt-key[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
${S} .nt-box { height: 22px; min-width: 56px; padding: 0 8px; border-radius: var(--r-control); background: var(--cut); box-shadow: var(--edge); font: 600 11px/22px var(--mono);
  text-align: right; cursor: ns-resize; user-select: none; touch-action: none }
${S} .nt-box:active { box-shadow: var(--edge-press) }
${S} .nt-surface { margin: 14px; padding: 12px; background: var(--panel-2); border-radius: var(--r-control); display: grid; gap: 12px }
${S} .nt-read { display: flex; align-items: baseline; gap: 8px; min-width: 0 }
${S} .nt-num { margin: 0; font: 600 24px/1 var(--mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: pre }
${S} .nt-num span { display: inline-block }
${S} .nt-unit { color: var(--muted) }
${S} .nt-today { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); white-space: nowrap }
${S} .nt-obj { display: grid; gap: 6px; padding: 6px 8px 0; border-radius: var(--r-control); background: var(--clip-orange-tint); box-shadow: inset 0 0 0 1px var(--clip-orange) }
${S} .nt-obj b { color: var(--clip-orange-text); font-size: 11px; font-weight: 600 }
${S} .nt-clip { height: 56px; display: grid; grid-template-columns: repeat(${DAYS}, 1fr); gap: 3px; align-items: end }
${S} .nt-clip i { display: block; background: var(--clip-orange); min-height: 1px }
@container (max-width: 380px) { ${S} .nt-surface { margin: 10px; padding: 10px } ${S} .nt-num { font-size: 22px } ${S} .nt-clip { height: 44px } ${S} .nt-unit { display: none } }
@container (min-width: 600px) { ${S} .nt { width: 480px } ${S} .nt-clip { height: 72px } }
`,
    mount(host, ctx) {
      const id = "nt" + ++uid;
      host.innerHTML = `
<div class="nt" role="group" aria-labelledby="${id}-t">
  <div class="nt-strip"><b id="${id}-t">Usage</b><span class="nt-box" role="spinbutton" aria-label="Locale" tabindex="0"></span><button class="nt-key" type="button" aria-pressed="true">Live</button></div>
  <div class="nt-surface">
    <div class="nt-read"><p class="nt-num" aria-hidden="true"></p><span class="nt-unit">tokens</span><span class="nt-today" aria-hidden="true"></span></div>
    <div class="nt-obj" aria-hidden="true"><b>Coder</b><div class="nt-clip"></div></div>
  </div>
  <p class="sr-only nt-said" role="status"></p>
</div>`;
      const $ = (s) => host.querySelector(s);
      const num = $(".nt-num"), clip = $(".nt-clip"), localeBox = $('[role="spinbutton"]'), todayBox = $(".nt-today"), said = $(".nt-said"), liveKey = $(".nt-key");
      if (ctx.tile) { localeBox.tabIndex = -1; liveKey.tabIndex = -1; }

      // Tokens per day, in hundreds: a seeded clip, today last.
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const days = Array.from({ length: DAYS }, (_, i) => Math.round(900 + 700 * Math.sin(i / 2.3) + rnd() * 500));
      days[DAYS - 1] = 410;
      const bars = days.map(() => { const b = document.createElement("i"); clip.appendChild(b); return b; });
      const paintClip = () => { const max = Math.max(...days); bars.forEach((b, i) => (b.style.height = ((days[i] / max) * 100).toFixed(1) + "%")); };

      let count = 2148032, locale = 0, fmt = new Intl.NumberFormat(LOCALES[0]), money = moneyIn(LOCALES[0]);
      let shownChars = [];
      const cutTimers = [];
      /* Cut to the new figure from the right, a beat apart, each by opacity alone; unchanged digits stay. */
      function paint(first) {
        const text = fmt.format(count);
        const chars = [...text];
        const reshape = chars.length !== shownChars.length || chars.some((c, i) => /\d/.test(c) !== /\d/.test(shownChars[i] || ""));
        if (reshape) num.replaceChildren(...chars.map((c) => { const sp = document.createElement("span"); sp.textContent = c; return sp; }));
        const spans = [...num.children];
        cutTimers.forEach(clearTimeout); cutTimers.length = 0;
        let order = 0;
        for (let i = chars.length - 1; i >= 0; i--) {
          const s = spans[i], c = chars[i];
          if (!reshape && s.textContent === c) continue;
          const delay = first || ctx.reduced() ? 0 : order++ * 60;
          const cut = () => { s.textContent = c; if (!first && !ctx.reduced()) s.animate([{ opacity: 0.35 }, { opacity: 1 }], { duration: 100, easing: "cubic-bezier(0.23, 1, 0.32, 1)" }); };
          if (delay) cutTimers.push(ctx.after(delay, cut)); else cut();
        }
        shownChars = chars;
        said.textContent = text + " tokens this month, " + money.format(count * PRICE);
        localeBox.textContent = LOCALES[locale];
        localeBox.setAttribute("aria-valuetext", LOCALES[locale] + ", " + text);
        localeBox.setAttribute("aria-valuenow", String(locale + 1));
        todayBox.textContent = money.format(count * PRICE);
        paintClip();
      }
      localeBox.setAttribute("aria-valuemin", "1"); localeBox.setAttribute("aria-valuemax", String(LOCALES.length));

      function setLocale(i) {
        locale = (i + LOCALES.length) % LOCALES.length;
        fmt = new Intl.NumberFormat(LOCALES[locale]); money = moneyIn(LOCALES[locale]);
        shownChars = []; // regroup: every digit cuts again, from the right
        paint(false);
      }
      function add(n) { count += n; days[DAYS - 1] += n / 100; paint(false); }

      paint(true);

<script>
/* one-time-code.js */
/* One-Time Code, after litterthanlit/components, Rack 2.0: approving the Deploy agent to push to main. One surface:

  const LENGTH = 6, WINDOW = 30;

  const VERIFY = 480, START = 700;
  const beat = () => 150 + Math.random() * 90;
  let uid = 0;

  FlatPlayer.register({
    slug: "one-time-code",
    title: "One-Time Code",
    tagline: "Let an agent deploy: six boxes, one real input.",
    css: `
${S} .oc { width: min(100%, 440px); background: var(--panel); border-radius: var(--r-panel); overflow: hidden; font-size: 12px }
${S} .oc-strip { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 12px; background: var(--panel-2) }
${S} .oc-strip b { font-weight: 600; margin-right: auto }
${S} .oc-box { height: 22px; min-width: 52px; padding: 0 8px; border-radius: var(--r-control); background: var(--cut); box-shadow: var(--edge); font: 600 11px/22px var(--mono); text-align: right }
${S} .oc-surface { margin: 14px; padding: 12px; background: var(--panel-2); border-radius: var(--r-control); display: grid; gap: 12px }

${S} .oc-field { position: relative }
${S} .oc-cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 10px repeat(3, minmax(0, 1fr)); gap: 4px }
${S} .oc-gap { align-self: center; height: 1px; background: var(--line-strong) }
${S} .oc-cell { position: relative; height: 44px; border-radius: var(--r-control); background: var(--cut); box-shadow: inset 0 0 0 1px var(--line-strong);
  display: grid; place-items: center; font: 600 20px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink) }
${S} .oc-cell.is-at { box-shadow: inset 0 0 0 2px var(--ink) }
${S} .oc-cell.is-sel { background: var(--panel-3); box-shadow: inset 0 0 0 2px var(--ink) }

${S} .oc-cells[data-s="pending"] .oc-cell { color: var(--disabled) }
${S} .oc-cells[data-s="error"] .oc-cell { box-shadow: inset 0 0 0 1px var(--danger) }
${S} .oc-cells[data-s="error"] .oc-cell.is-at { box-shadow: inset 0 0 0 2px var(--danger) }
${S} .oc-cell.is-lit { background: var(--clip-orange-tint); color: var(--clip-orange-text); box-shadow: inset 0 0 0 1px var(--clip-orange);

${S} .oc-input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; cursor: text; border-radius: var(--r-control);

@container (max-width: 380px) { ${S} .oc-surface { margin: 10px; padding: 10px } ${S} .oc-cell { height: 38px; font-size: 18px } }
@container (min-width: 600px) { ${S} .oc { width: 480px } ${S} .oc-cell { height: 52px; font-size: 24px } }

    mount(host, ctx) {
      const id = "oc" + ++uid;
      host.innerHTML = `
<div class="oc" role="group" aria-labelledby="${id}-t">
  <div class="oc-strip"><b id="${id}-t">Authorize</b><span class="oc-box oc-left" aria-label="Time left"></span></div>
  <div class="oc-surface">
    <div class="oc-req"><b>Deploy</b><span>wants to push to main</span></div>

      <div class="oc-cells" aria-hidden="true"></div>
      <input class="oc-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="${LENGTH}"

  </div>
  <p class="sr-only" role="status"></p>

      const $ = (s) => host.querySelector(s);
      const root = $(".oc"), cellsEl = $(".oc-cells"), input = $(".oc-input"), word = $(".oc-word"), left = $(".oc-left");
      const statusLive = $('[role="status"]'), alertLive = $('[role="alert"]');
      const on = (el, type, fn) => el.addEventListener(type, fn, { signal: ctx.signal });

      const cells = [];
      for (let i = 0; i < LENGTH; i++) {

        const c = document.createElement("span"); c.className = "oc-cell"; cellsEl.appendChild(c); cells.push(c);

      const sentNow = () => ROUNDS[round % ROUNDS.length].sent;

      function render() {
        const start = Math.min(sel.start, code.length), end = Math.min(sel.end, code.length);
        const locked = status === "pending" || status === "success";
        const at = !locked && start === end && start < LENGTH && (engaged || (code.length > 0 && code.length < LENGTH)) ? start : -1;
        cellsEl.dataset.s = status;
        cells.forEach((c, i) => {
          const ch = code[i] || "";

        if (digits.length >= LENGTH) { commit(digits.slice(0, LENGTH), LENGTH); return true; }
        let a = Math.min(from, code.length), b = Math.min(to, code.length);
        if (a === b && code.length >= LENGTH) { if (a >= LENGTH) return false; b = Math.min(LENGTH, a + digits.length); }

      }
      function erase(from, to) {
        if (status === "pending" || status === "success") return false;
        if (from === to) { if (from === 0) return false; from -= 1; }
        commit(code.slice(0, from) + code.slice(to), from);

      }
      function fresh() { // a new window and an empty field
        round++; windowStart = performance.now(); code = ""; sel = { start: 0, end: 0 }; status = "idle"; light(false); render();
      }
      const ghostPress = (k) => k === "back" ? erase(Math.min(sel.start, code.length), Math.min(sel.end, code.length)) : insert(k, Math.min(sel.start, code.length), Math.min(sel.end, code.length));
      function type(keys, at) { let t = at; for (const k of keys) { later(t, () => ghostPress(k)); t += beat(); } return t; }
      function playRound(r, at) { if (!ghost) return; const { sent, slip } = ROUNDS[r % ROUNDS.length]; type([...(slip || sent)], at); }

      on(root, "focusout", (e) => { if (!root.contains(e.relatedTarget)) { engaged = false; render(); } });

        e.preventDefault();

    },
  });

      else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (i - 1 + n) % n;

      else if (e.key === "End") next = n - 1;

      e.preventDefault(); select(BPS[next].v, true);

    select("desktop", false, true);

    /* The self-run: someone checks each width in turn, a beat apart, until a hand arrives. */
    let ghost = !ctx.reduced();

    let k = 0;
    if (ghost) ctx.every(1800, () => { if (ghost) select(order[k++ % order.length], false, true); });
    ctx.onHand(() => { ghost = false; });
    return { destroy() { ro.disconnect(); } };
  },
});

  mount(host, ctx) {

    const L = [
      { id: "header", name: "Header", tone: "purple", x: 16, y: 16, w: 448, h: 40 },
      { id: "avatar", name: "Avatar", tone: "blue", x: 424, y: 24, w: 24, h: 24, parent: "header" },
      { id: "sidebar", name: "Sidebar", tone: "green", x: 16, y: 72, w: 120, h: 192 },
      { id: "card", name: "Card", tone: "pink", x: 152, y: 72, w: 208, h: 144 },

    ];

        </div></div>
      </div>
      <div class="rl-dev rl-side">
        <div class="rl-strip"><b>Inspector</b></div>
        <div class="rl-props"><span class="rl-name">No layer</span><span>X</span><b class="rl-x">–</b><span>Y</span><b class="rl-y">–</b><span>W</span><b class="rl-w">–</b><span>H</span><b class="rl-h">–</b><p class="rl-gap"></p></div>
      </div>

          best = { d, to: parent.name };

        if (g.dir === "up") return `<i class="rl-red is-v" style="top:${pct(l.y - g.d, H)};height:${pct(g.d, H)};left:${pct(cx, W)}"><b>${g.d}</b></i>`;

      }).join("");

      gapEl.textContent = m.map((g) => `${g.d} ${words[g.dir]}`).join(", ");

    const hit = (fx, fy) => L.filter((l) => fx >= l.x && fx <= l.x + l.w && fy >= l.y && fy <= l.y + l.h).sort((a, b) => a.w * a.h - b.w * b.h)[0] || null;
    function point(fx, fy, on) {

      cur.textContent = `${Math.round(fx)}, ${Math.round(fy)}`;

      else if (e.key === "Home") next = 0;
      else if (e.key === "End") next = n - 1;

      });

    ctx.onHand(() => { ghost = false; });
  },
});

        const now = performance.now();
        if (at < now - 250) at = now + 20; // back from a hidden tab: pick the tick up from here
        while (at < now + LOOKAHEAD) { queue.push({ step, at }); step = (step + 1) % STEPS; at += stepMs; }
      }
      function start() {
        if (running) return;
        running = true; head = { step: -1, bar: 0 }; queue = []; step = 0; at = performance.now() + 40;
        schedule(); schedTimer = ctx.every(INTERVAL, schedule);
        drawLoop = ctx.loop((dt, now) => {
          let shown = -1;
          while (queue.length && queue[0].at <= now) shown = queue.shift().step;
          if (shown >= 0) {
            head = { step: shown, bar: shown === 0 ? head.bar + 1 : head.bar };
            if (!wide && now > pinned && Math.floor(shown / PAGE) !== page) { page = Math.floor(shown / PAGE); build(); }
            paint(); paintTop();
          }
          return running;
        });
        paintTop(); paint();
      }
      function stop() {
        if (!running) return;
        running = false; clearInterval(schedTimer); schedTimer = 0; if (drawLoop) drawLoop.stop = true;
        paintTop(); paint();
      }

      /* Moves. */
      const pin = () => (pinned = performance.now() + PIN);
      grid.addEventListener("click", (e) => {
        const b = e.target.closest(".sq-cell"); if (!b) return;
        const row = +b.dataset.row, col = +b.dataset.col;
        pattern[row][col] = !pattern[row][col]; cursor = { row, col }; pin(); paint();
      }, sig);
      grid.addEventListener("keydown", (e) => {
        const b = e.target.closest(".sq-cell"); if (!b) return;
        let r = +b.dataset.row, c = +b.dataset.col;
        const k = e.key;
        if (k === "ArrowRight") c++; else if (k === "ArrowLeft") c--; else if (k === "ArrowDown") r++; else if (k === "ArrowUp") r--;
        else if (k === "Home") c = 0; else if (k === "End") c = STEPS - 1; else return;
        e.preventDefault();
        if (r < 0 || r >= TRACKS.length || c < 0 || c >= STEPS) return;
        cursor = { row: r, col: c }; pin();
        if (!wide && Math.floor(c / PAGE) !== page) { page = Math.floor(c / PAGE); build(); }
        else paint();
        cellAt(r, c)?.focus({ preventScroll: true });
      }, sig);
      play.addEventListener("click", () => {
        if (running) { stop(); live.textContent = "Stopped"; } else { start(); live.textContent = "Replaying the schedule"; }
      }, sig);

      /* Sixteen steps once there's room for them. */
      const ro = new ResizeObserver(([entry]) => { const w = entry.contentRect.width >= WIDE; if (w !== wide) { wide = w; build(); } });
      ro.observe(root);
      wide = root.getBoundingClientRect().width >= WIDE;
      build(); paintTop();
      /* It plays from the first frame; under reduced motion it waits for Play. */
      if (!ctx.reduced()) start();
      return { destroy() { ro.disconnect(); running = false; } };
    },
  });
})();

</script>
<script>
/* switch.js */
/* Switch, after litterthanlit/components, in Rack 2.0: one agent's permissions. The surface holds the Coder as one
   orange object (its tint, a 1px edge in the hue, its name in the hue's text) whose spend this run fills it from the
   left, and four permission keys under it, each lit in the ink when the agent may act without asking. The strip has
   the enable key (the one yellow) and the spend limit. Nothing slides: a key lights on the frame, and a drag across
   it ends on a side. At the limit the agent stops and asks, drawn on the object in red. */
(function () {
  const S = ".fs-switch";
  const TICK = 120;
  const PERMS = [
    { key: "read", label: "Read files" },
    { key: "write", label: "Write files" },
    { key: "run", label: "Run commands" },
    { key: "net", label: "Network" },
  ];
  const LIMIT = { min: 0.25, max: 10, step: 0.25, def: 2 };
  /* The policy on load: enable, then each permission in turn, and Network back to Ask. */
  const POLICY = [[1, "power", true], [3, "read", true], [5, "write", true], [7, "run", true], [9, "net", true], [15, "net", false]];
  const RUN = 9, RATE = 0.19;
  const money = (v) => `$${v.toFixed(2)}`;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let uid = 0;

  /* A toggle key, lit when on. A tap flips it; a drag across it ends on a side. */
  function toggleKey(btn, ctx, onChange) {
    let on = false;
    const set = (x, user) => { if (x === on) return; on = x; btn.setAttribute("aria-checked", on ? "true" : "false"); onChange(on, user); };
    const sig = { signal: ctx.signal };
    let down = null;
    btn.addEventListener("pointerdown", (e) => { if (e.button !== 0) return; btn.setPointerCapture(e.pointerId); down = { x: e.clientX }; }, sig);
    btn.addEventListener("pointerup", (e) => {
      if (!down) return;
      const moved = Math.abs(e.clientX - down.x) > 6; down = null;
      if (btn.disabled) return;
      if (!moved) return set(!on, true);
      const r = btn.getBoundingClientRect();
      set(e.clientX > r.left + r.width / 2, true);
    }, sig);
    btn.addEventListener("pointercancel", () => (down = null), sig);
    btn.addEventListener("click", (e) => { if (e.detail === 0) set(!on, true); }, sig);
    return { get on() { return on; }, set };
  }

  FlatPlayer.register({
    slug: "switch",
    title: "Switch",
    tagline: "An agent's permissions: keys that light on the frame, and a limit it asks at.",
    css: `
${S} .pm { width: min(100%, 330px); background: var(--panel); border-radius: var(--r-panel); overflow: hidden; font-size: 12px; user-select: none; -webkit-user-select: none;
  --hue: var(--clip-orange); --tint: var(--clip-orange-tint); --text: var(--clip-orange-text) }
${S} .pm-strip { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 6px; background: var(--panel-2) }
${S} .pm-strip b { font-weight: 600; margin-right: auto }
${S} .pm-lbl { color: var(--muted); font-size: 11px }
${S} .pm-val { height: 22px; min-width: 52px; display: flex; align-items: center; justify-content: flex-end; padding: 0 6px; border-radius: var(--r-control); background: var(--cut); box-shadow: var(--edge);
  font: 600 11px/1 var(--mono); font-variant-numeric: tabular-nums; cursor: ns-resize; touch-action: none }
${S} .pm-val:active { box-shadow: var(--edge-press) }
${S} .pm-surface { display: grid; gap: 10px; padding: 14px }
${S} .pm-agent { position: relative; height: 64px; border-radius: var(--r-control); background: var(--tint); box-shadow: inset 0 0 0 1px var(--hue); color: var(--text); overflow: hidden;
  transition: box-shadow var(--cut-in) var(--ease-out) }
${S} .pm-agent i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: color-mix(in oklab, var(--hue) 22%, var(--tint)); transform-origin: left center; transform: scaleX(var(--f, 0)) }
${S} .pm-agent > span { position: absolute; left: 7px; top: 6px; font: 600 11px/1 var(--font) }
${S} .pm-agent > em { position: absolute; right: 7px; bottom: 6px; font: 600 11px/1 var(--mono); font-style: normal; font-variant-numeric: tabular-nums }
${S} .pm-agent > small { position: absolute; left: 7px; bottom: 6px; font-size: 11px; font-weight: 500 }
${S} .pm-agent.is-over { box-shadow: inset 0 0 0 1px var(--danger) }
${S} .pm-agent.is-over > small, ${S} .pm-agent.is-over > em { color: var(--danger) }
${S} .pm-agent.is-off { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--muted) }
${S} .pm-agent.is-off i { display: none }
${S} .pm-keys { display: grid; grid-template-columns: 1fr 1fr; gap: 4px }
${S} .pm-key { all: unset; box-sizing: border-box; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-control); background: var(--block); box-shadow: var(--edge);
  font: 600 11px/1 var(--font); color: var(--muted); cursor: pointer; touch-action: pan-y; white-space: nowrap;
  transition: background-color var(--cut-in) var(--ease-out), color var(--cut-in) var(--ease-out) }
${S} .pm-key:hover { background: var(--block-hover) }
${S} .pm-key:active { box-shadow: var(--edge-press); scale: 0.98 }
${S} .pm-key[aria-checked="true"] { background: var(--ink); color: var(--panel) }
${S} .pm-key.is-power { width: 22px; height: 22px; flex: none }
${S} .pm-key.is-power svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square }
${S} .pm-key.is-power[aria-checked="true"] { background: var(--accent); color: var(--accent-fg) }
${S} .pm-key:disabled { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--disabled); cursor: default }
${S} .pm-key:focus-visible, ${S} .pm-val:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px }
@container (min-width: 560px) {
  ${S} .pm { width: 480px } ${S} .pm-surface { padding: 16px; gap: 12px }
  ${S} .pm-agent { height: 96px } ${S} .pm-agent > span, ${S} .pm-agent > em { font-size: 12px }
  ${S} .pm-keys { grid-template-columns: repeat(4, 1fr) } ${S} .pm-key { height: 30px }
}
`,
    mount(host, ctx) {
      const id = "fs-pm2-" + ++uid;
      host.innerHTML = `
<section class="pm" aria-labelledby="${id}">
  <div class="pm-strip">
    <button type="button" class="pm-key is-power" role="switch" aria-checked="false" data-k="power" aria-label="Coder enabled"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1v4M2.6 2.8a3.2 3.2 0 1 0 4.8 0"/></svg></button>
    <b id="${id}">Permissions</b>
    <span class="pm-lbl" aria-hidden="true">Limit</span>
    <span class="pm-val" role="slider" tabindex="0" aria-label="Spend limit per run" aria-valuemin="${LIMIT.min}" aria-valuemax="${LIMIT.max}"></span>
  </div>
  <div class="pm-surface">
    <div class="pm-agent" aria-hidden="true"><i></i><span>Coder</span><small></small><em>$0.00</em></div>
    <div class="pm-keys" role="group" aria-label="Allowed without asking">
      ${PERMS.map((p) => `<button type="button" class="pm-key" role="switch" aria-checked="false" data-k="${p.key}">${p.label}</button>`).join("")}
    </div>
  </div>
  <p class="sr-only" aria-live="polite"></p>
</section>`;
      const agent = host.querySelector(".pm-agent"), spentEl = agent.querySelector("em"), word = agent.querySelector("small");
      const limitBox = host.querySelector(".pm-val"), live = host.querySelector("[aria-live]");
      const sig = { signal: ctx.signal };
      let spent = 0, t = 0, held = false, limit = LIMIT.def;

      const keys = {};
      function paint() {
        const on = keys.power.on, over = spent >= limit;
        agent.classList.toggle("is-off", !on);
        agent.classList.toggle("is-over", on && over);
        agent.style.setProperty("--f", clamp(spent / limit, 0, 1).toFixed(4));
        spentEl.textContent = money(spent);
        word.textContent = !on ? "Off" : over ? "At limit, asking" : "";
        for (const p of PERMS) keys[p.key].el.disabled = !on;
        if (on && over && !held) live.textContent = "Coder reached its spend limit and is asking";
        held = on && over;
      }
      const pk = host.querySelector('[data-k="power"]');
      keys.power = Object.assign(toggleKey(pk, ctx, (on, user) => { paint(); if (user) live.textContent = `Coder ${on ? "enabled" : "off"}`; }), { el: pk });
      for (const p of PERMS) {
        const b = host.querySelector(`[data-k="${p.key}"]`);
        keys[p.key] = Object.assign(toggleKey(b, ctx, () => {}), { el: b });
      }

      /* The limit: a value box, dragged up and down 1:1 (Shift for fine), arrows step, double-click resets. */
      const paintLimit = () => { const s = money(limit); limitBox.textContent = s; limitBox.setAttribute("aria-valuenow", String(limit)); limitBox.setAttribute("aria-valuetext", s); paint(); };
      const setLimit = (v) => { limit = clamp(Math.round(v / LIMIT.step) * LIMIT.step, LIMIT.min, LIMIT.max); paintLimit(); };
      let drag = null;
      limitBox.addEventListener("pointerdown", (e) => { if (e.button !== 0) return; limitBox.setPointerCapture(e.pointerId); limitBox.focus({ preventScroll: true }); drag = { y: e.clientY, v: limit }; e.preventDefault(); }, sig);
      limitBox.addEventListener("pointermove", (e) => { if (!drag) return; setLimit(drag.v + ((drag.y - e.clientY) / 120) * (LIMIT.max - LIMIT.min) * (e.shiftKey ? 0.1 : 1)); if (e.shiftKey) { drag.y = e.clientY; drag.v = limit; } }, sig);
      limitBox.addEventListener("pointerup", () => (drag = null), sig);
      limitBox.addEventListener("pointercancel", () => (drag = null), sig);
      limitBox.addEventListener("dblclick", () => setLimit(LIMIT.def), sig);
      limitBox.addEventListener("keydown", (e) => {
        const d = { ArrowUp: LIMIT.step, ArrowRight: LIMIT.step, ArrowDown: -LIMIT.step, ArrowLeft: -LIMIT.step, PageUp: 1, PageDown: -1 }[e.key];
        if (d !== undefined) { e.preventDefault(); setLimit(limit + d); }
      }, sig);
      paintLimit();

      const timers = [];
      if (ctx.reduced()) { for (const [, k, on] of POLICY) keys[k].set(on, false); spent = 0.84; paint(); }
      else {
        for (const [b, k, on] of POLICY) timers.push(ctx.after(b * TICK, () => keys[k].set(on, false)));
        /* The spend is the work, so it is what moves; a run ends and the next starts at $0. */
        ctx.loop((dt) => {
          if (!keys.power.on) return;
          t += dt;
          if (t > RUN) { t = 0; spent = 0; }
          else if (!held) spent += dt * RATE * (0.6 + 0.8 * Math.abs(Math.sin(t * 1.7)));
          paint();
        });
      }
      ctx.onHand(() => timers.forEach(clearTimeout));
    },
  });
})();

</script>
<script>
/* tape-reels.js */
/* Tape Reels, Rack 2.0: the progress bar underneath the reels, as a deploy. One surface carries three stages as a
   staircase over two minutes (Build blue, Test green, Deploy orange), and the deploy head crosses them; what is done shows
   in its colour, what waits is greyed. Progress arrives in uneven steps, as a pipeline reports it, and the head cuts to
   each report: time moves it, nothing glides. The strip holds the clock and the one key: Deploy (lit while running),
   Pause, Resume. */
(function () {
  const SECONDS = 120;
  const STAGES = [
    { name: "Build", hue: "blue", from: 0, to: 52 },
    { name: "Test", hue: "green", from: 52, to: 92 },
    { name: "Deploy", hue: "orange", from: 92, to: 120 },
  ];
  const clock = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

  FlatPlayer.register({
    slug: "tape-reels",
    title: "Tape Reels",
    tagline: "A deploy you can watch cross its stages.",
    css: `
.fs-tape-reels .dp { width: min(100%, 520px); font-size: 12px; background: var(--panel); border-radius: var(--r-panel); overflow: hidden; -webkit-user-select: none; user-select: none }
.fs-tape-reels .dp-strip { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 10px; background: var(--panel-2); white-space: nowrap }
.fs-tape-reels .dp-strip b { font-weight: 600; margin-right: auto }
.fs-tape-reels .dp-clock { height: 22px; min-width: 52px; padding: 0 8px; display: inline-grid; place-items: center; border-radius: var(--r-control); background: var(--cut); box-shadow: var(--edge);
  font: 600 11px var(--mono) }
.fs-tape-reels .dp-key { height: 22px; min-width: 64px; padding: 0 8px; border: 0; border-radius: var(--r-control); background: var(--block); box-shadow: var(--edge); color: var(--ink);
  font: 600 11px var(--font); cursor: pointer; transition: background-color var(--cut-in) var(--ease-out), color var(--cut-in) var(--ease-out) }
.fs-tape-reels .dp-key:hover { background: var(--block-hover) }
.fs-tape-reels .dp-key:active { box-shadow: var(--edge-press); transform: scale(0.98) }
.fs-tape-reels .dp-key[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
.fs-tape-reels .dp-wrap { padding: 12px }
.fs-tape-reels .dp-surface { position: relative; display: grid; gap: 8px; padding: 12px; background: var(--cut); border-radius: var(--r-control); box-shadow: var(--edge) }
.fs-tape-reels .dp-row { position: relative; height: 34px }
.fs-tape-reels .dp-st { position: absolute; top: 0; bottom: 0; padding: 5px 6px; border-radius: var(--r-control); font-weight: 600; font-size: 11px; white-space: nowrap; overflow: hidden }
.fs-tape-reels .dp-st[data-tone="blue"] { background: var(--clip-blue-tint); box-shadow: inset 0 0 0 1px var(--clip-blue); color: var(--clip-blue-text) }
.fs-tape-reels .dp-st[data-tone="green"] { background: var(--clip-green-tint); box-shadow: inset 0 0 0 1px var(--clip-green); color: var(--clip-green-text) }
.fs-tape-reels .dp-st[data-tone="orange"] { background: var(--clip-orange-tint); box-shadow: inset 0 0 0 1px var(--clip-orange); color: var(--clip-orange-text) }
.fs-tape-reels .dp-span { position: absolute; inset: 12px; pointer-events: none }
.fs-tape-reels .dp-wait { position: absolute; top: 0; bottom: 0; right: 0; left: calc(var(--p, 0) * 100%); background: var(--cut); opacity: 0.7 }
.fs-tape-reels .dp-head { position: absolute; top: -4px; bottom: -4px; left: calc(var(--p, 0) * 100%); width: 1.5px; margin-left: -0.75px; background: var(--ink) }
`,
    mount(host, ctx) {
      const rows = STAGES.map((s) => '<div class="dp-row"><span class="dp-st" data-tone="' + s.hue + '" style="left:' + (s.from / SECONDS) * 100 + "%;width:" + ((s.to - s.from) / SECONDS) * 100 + '%">' + s.name + "</span></div>").join("");
      host.innerHTML = `
<div class="dp">
  <div class="dp-strip"><b>Deploy</b><span class="dp-clock" aria-hidden="true"></span><button class="dp-key" type="button"></button></div>
  <div class="dp-wrap"><div class="dp-surface" role="progressbar" aria-label="Deploying main to production" aria-valuemin="0" aria-valuemax="100">
    ${rows}<div class="dp-span" aria-hidden="true"><span class="dp-wait"></span><span class="dp-head"></span></div>
  </div></div>
  <p class="sr-only" role="status" aria-live="polite"></p>
</div>`;
      const sig = { signal: ctx.signal };
      const surface = host.querySelector(".dp-surface"), span = host.querySelector(".dp-span"), clockEl = host.querySelector(".dp-clock");
      const key = host.querySelector(".dp-key"), live = host.querySelector("[role=status]");
      let progress = 0, phase = "idle", handed = false, writer = 0, cycle = 0;

      function render() {
        span.style.setProperty("--p", progress.toFixed(4));
        surface.setAttribute("aria-valuenow", String(Math.round(progress * 100)));
        clockEl.textContent = phase === "done" ? "Live" : clock(progress * SECONDS);
        key.textContent = phase === "run" ? "Pause" : phase === "pause" ? "Resume" : "Deploy";
        key.setAttribute("aria-pressed", String(phase === "run"));
      }
      const stop = () => { if (writer) clearInterval(writer); writer = 0; if (cycle) clearTimeout(cycle); cycle = 0; };
      function start() {
        stop(); if (progress >= 1) progress = 0;
        phase = "run"; render();
        writer = ctx.every(110, () => {
          progress = Math.min(1, progress + 0.012 + Math.random() * 0.02);
          if (progress >= 1) {
            clearInterval(writer); writer = 0; phase = "done"; render(); live.textContent = "Deployed. Live in production.";
            if (!handed) cycle = ctx.after(1400, () => { if (!handed) { progress = 0; start(); } });
            return;
          }
          render();
        });
      }
      key.addEventListener("click", () => {
        if (phase === "run") { stop(); phase = "pause"; render(); live.textContent = "Paused at " + Math.round(progress * 100) + " percent"; }
        else { start(); live.textContent = "Deploying"; }
      }, sig);
      ctx.onHand(() => { handed = true; if (cycle) { clearTimeout(cycle); cycle = 0; } });
      render();
      if (ctx.reduced()) { progress = 0.62; phase = "pause"; render(); }
      else ctx.after(300, () => { if (!handed) start(); });
      return { destroy: stop };
    },
  });
})();

</script>
<script>
/* ticker.js */
/* Ticker, after litterthanlit/components (ticker.tsx), in Rack 2.0.
 * An agent console's activity, as one surface. The title strip holds the queue's position between two step keys, Send
 * and Follow (the lit key). The surface holds the messages as objects, newest on top, each in its agent's colour (a
 * soft tint, a 1px edge in the hue, the agent's name small in the hue's text tone) with the message under it; the one
 * the line is on is selected with a 2px edge. A message cuts in by opacity; on the selected object a message longer
 * than its box holds, runs along at a steady speed (time moves it, not the UI), holds at its end and jumps back. With
 * Follow on, the selection advances through the queue by itself; stepping by hand turns Follow off. Hover or focus
 * pauses. Under reduced motion nothing runs along: a long message pages through a boxful of whole words at a time. */
(function () {
  const DWELL = 2000; // ms a message that fits stays, plus a little per character
  const HOLD = 1000; // ms a long message holds at its start and its end
  const PAGE = 2400; // ms per boxful under reduced motion
  const SPEED = 60; // px a second
  const LIMIT = 5;
  const GAP = 2600; // ms between arrivals while untouched
  let uid = 0;

  const AGENTS = {
    planner: { name: "Planner", hue: "purple" },
    research: { name: "Researcher", hue: "blue" },
    coder: { name: "Coder", hue: "orange" },
    review: { name: "Reviewer", hue: "green" },
  };
  const TONES = { info: "", warn: "Warning", alert: "Failed" };
  const ARRIVALS = [
    { src: "research", text: "Read 14 pages on rate limits", tone: "info" },
    { src: "coder", text: "Opened branch fix/auth-retry", tone: "info" },
    { src: "planner", text: "Budget at 88 %, 4 steps left", tone: "warn" },
    { src: "review", text: "Preview build ran out of memory. Raise the limit to 4 GB and run it again", tone: "alert" },
  ];
  const SAMPLES = [
    { src: "review", text: "Approved 3 of 4 diffs", tone: "info" },
    { src: "coder", text: "Tests passing, 212 of 212", tone: "info" },
    { src: "research", text: "Search tool rate limited", tone: "alert" },
    { src: "planner", text: "Waiting for approval to spend $4.00", tone: "warn" },
    ...ARRIVALS,
  ];

  const css = `
.fs-ticker [hidden] { display: none !important; }
.fs-ticker .tk { width: min(100%, 520px); background: var(--panel); border-radius: var(--r-panel); overflow: hidden; font-size: 12px;
  -webkit-user-select: none; user-select: none; }
.fs-ticker .tk-strip { display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 6px 0 14px; background: var(--panel-2); }
.fs-ticker .tk-strip > b { font-weight: 600; margin-right: auto; }
.fs-ticker .tk-key { height: 22px; min-width: 22px; padding: 0 8px; border: 0; border-radius: var(--r-control); background: var(--block);
  box-shadow: var(--edge); color: var(--ink); font: 600 11px var(--font); cursor: pointer; display: inline-grid; place-items: center;

  const TRI_L = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M7.5 1.5v7L2 5z"/></svg>';

    const id = "fs-tk-" + ++uid;

      <div class="tk">
        <div class="tk-strip">
          <b>Activity</b>
          <button type="button" class="tk-key tk-prev" tabindex="-1" aria-label="Previous message">${TRI_L}</button>
          <span class="tk-pos" aria-hidden="true">0/0</span>
          <button type="button" class="tk-key tk-next" tabindex="-1" aria-label="Next message">${TRI_R}</button>
          <button type="button" class="tk-key tk-send">Send</button>
          <button type="button" class="tk-key tk-follow" aria-pressed="true">Follow</button>

        <div class="tk-surface" role="group" tabindex="0" aria-label="Agent activity" aria-describedby="${id}-now ${id}-hint"></div>

        <p class="sr-only" id="${id}-hint">Hover or focus to pause. Left and right arrows step through the messages; F turns Follow on or off.</p>
