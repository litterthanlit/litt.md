          const next = d !== undefined ? snap(t.value + d) : e.key === "Home" ? 0 : e.key === "End" ? 100 : null;
          if (next === null) return;
          e.preventDefault(); override(t); set(t, next);
        });
        /* A hand sets the value 1:1 and it stays: on the fader, beside the thumb it jumps there; on the value box it drags. */
        const grab = (el, e, jump) => {
          if (e.button !== 0 || t.drag) return;
          e.preventDefault();
          t.fader.focus({ preventScroll: true });
          el.setPointerCapture(e.pointerId);

          t.lastDown = { at: dbl ? -Infinity : e.timeStamp, y: e.clientY };
          if (dbl) { set(t, UNITY); return; }
          const box = t.fader.getBoundingClientRect(), travel = box.height - 12;
          if (jump) {
            const thumbTop = box.bottom - 12 - (t.value / 100) * travel;
            if (e.clientY < thumbTop - 2 || e.clientY > thumbTop + 14) set(t, snap(clamp((box.bottom - 6 - e.clientY) / travel, 0, 1) * 100));
          }
          t.fader.dataset.held = "";
          t.drag = { el, id: e.pointerId, y: e.clientY, from: t.value, raw: t.value, travel, fine: e.shiftKey, caught: t.value === UNITY };
        };

          const d = t.drag;
          if (!d || d.id !== e.pointerId) return;
          if (e.shiftKey !== d.fine) { d.from = d.raw; d.y = e.clientY; d.fine = e.shiftKey; }
          let raw = d.from - ((e.clientY - d.y) / d.travel) * 100 * (d.fine ? FINE : 1);
          if (raw > 100 || raw < 0) { raw = clamp(raw, 0, 100); d.from = raw; d.y = e.clientY; }
          const off = raw - UNITY;
          let next;
          if (d.caught && Math.abs(off) <= RELEASE) next = UNITY;
          else if (!d.caught && Math.abs(off) <= CATCH) { d.caught = true; next = UNITY; }
          else { d.caught = false; next = snap(raw); }
          d.raw = raw;
          if (next !== t.value) set(t, next);
        };
        const end = (e) => { if (!t.drag || t.drag.id !== e.pointerId) return; t.drag = null; delete t.fader.dataset.held; };
        for (const [el, jump] of [[t.fader, true], [t.val, false]]) {
          on(el, "pointerdown", (e) => grab(el, e, jump));
          on(el, "pointermove", move);
          on(el, "pointerup", end);
          on(el, "pointercancel", end);
        }
      });

      TRACKS.forEach(({ key }) => { set(tr[key], AUTO[key](reduced ? 1.6 : 0)); renderAuto(tr[key]); });
      renderPlay();
      if (selfRun) start();
    },
  });
})();

<script>
/* gradient-keys.js */
/* Gradient Keys, after litterthanlit/components, redesigned in Rack.
   The product underneath is a look launcher for a video or motion tool: a preview device beside a column of clips,
   each a look (a long exposure in a traditional Japanese palette). Launching a clip queues it, and on the next tick the
   preview cuts to it, as Live launches a clip on its quantise. The playing clip's bar runs with the clock. The clips
   wear the hue of their palette (green, blue, pink); the preview's power is the one lit key. The streaks are the
   original's WebGL shader, the work that moves; the palette change is a cut, not a sweep. */
(function () {
  const VERTEX = "attribute vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }";
  const FRAGMENT = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes; uniform float uTime; uniform vec2 uMouse; uniform float uHover; uniform vec3 uRipple;
uniform float uSeed; uniform vec3 uFrom[5]; uniform vec3 uTo[5]; uniform float uMix;
const float ZOOM = 1.35;
float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float noise(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 3; i++) { v += a * noise(p); p = p * 2.03 + 17.0; a *= 0.5; } return v / 0.875; }

      const PLAY = '<svg viewBox="0 0 10 10" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.4"><path d="M2.5 1v8M2.5 6.5c0-2 5-1.5 5-4.5"/></svg>', STOP = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1h8v8H1z"/></svg>';
      let deleted = false, back = 0;
      const selName = () => TRACKS[SEL.t].clips[SEL.c];
      const gone = { on: false };
      function render(cutIn) {
        tracksEl.textContent = "";
        TRACKS.forEach((t, ti) => {
          const dev = document.createElement("div");
          dev.className = "hk-dev";
          dev.style.cssText = "--hue: var(--clip-" + t.hue + "); --tint: var(--clip-" + t.hue + "-tint); --txt: var(--clip-" + t.hue + "-text)";
          dev.innerHTML = '<div class="hk-strip"></div><ol class="hk-slots"></ol>';
          dev.querySelector(".hk-strip").textContent = t.name;
          const ol = dev.querySelector("ol"); ol.setAttribute("aria-label", t.name + " branches");
          t.clips.forEach((c, ci) => {
            const here = ti === SEL.t && ci === SEL.c, empty = !c || (here && gone.on);
            const li = document.createElement("li");
            li.className = "hk-slot" + (empty ? " is-empty" : "") + (here && cutIn ? " is-in" : "");
            li.setAttribute("aria-current", String(here && !empty));

        });

        del.hidden = deleted; undo.hidden = !deleted;
      }
      render();

      /* The fill: linear while held, runs back when let go; full, it holds a moment and the branch goes. */
      let p = 0, holding = false, ghost = false, litUntil = 0, loop = null;
      const draw = () => del.style.setProperty("--p", p.toFixed(4));
      function frame(dt, now) {
        if (holding) {
          p = Math.min(1, p + (dt * 1000) / DURATION);
          if (p >= 1) { holding = false; litUntil = now + HOLD_LIT; del.removeAttribute("data-pressed"); if (!ghost) ctx.after(HOLD_LIT, confirm); }
        } else if (now >= litUntil) p = Math.max(0, p - (dt * 1000) / REWIND);
        draw();

      }
      const run = () => { if (!loop) loop = ctx.loop(frame); };

        if (deleted || holding || performance.now() < litUntil) return;

      function release() { if (!holding) return; holding = false; del.removeAttribute("data-pressed"); run(); }
      function confirm() {
        p = 0; draw();
        gone.on = true; deleted = true; render();
        live.textContent = selName() + " deleted. Undo is available.";
        if (del === document.activeElement || document.activeElement === document.body) undo.focus({ preventScroll: true });
        /* The agent opens the branch again a while later, so the demo can go again. */
        back = ctx.after(4000, () => { gone.on = false; deleted = false; render(true); live.textContent = ""; });
      }
      undo.addEventListener("click", () => {
        clearTimeout(back); gone.on = false; deleted = false; render(true);
        live.textContent = selName() + " restored"; del.focus({ preventScroll: true });
      }, sig);

      del.addEventListener("pointerdown", (e) => { if (e.button === 0) press(false); }, sig);
      for (const t of ["pointerup", "pointerleave", "pointercancel"]) del.addEventListener(t, release, sig);
      del.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); press(false); } }, sig);
      del.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") release(); }, sig);
      del.addEventListener("contextmenu", (e) => e.preventDefault(), sig);
      del.addEventListener("click", (e) => e.preventDefault(), sig);

      let handed = false;
      ctx.onHand(() => { handed = true; if (ghost && holding) release(); });
      if (!ctx.reduced()) {
        const rehearse = () => { if (handed || deleted) return; press(true); ctx.after(DURATION * 0.6, () => { if (!handed && ghost) release(); }); };
        ctx.after(500, rehearse);
        ctx.every(3000, rehearse);
      }
    },
  });
})();

/* knob.js */
/* Knob, in Rack: a design tool's property device. The Card component's Radius, Padding and Border as three square dials,
   each with an arc in its property's colour and its value in words under it, beside a Preview panel that draws the card
   with those values. Drag up to turn (Shift for fine), arrows step, double-click returns to the default, and it stays where
   the hand left it. Variations A and B jump every dial to its value on the tick, one column after another (60 ms): no
   glide. The values keep their detents. The device's power key is its one lit key; off, the preview drops the props. */

  const SWEEP = 270, PX_PER_DETENT = 4;

    const f = taper === "log" ? Math.log(v / min) / Math.log(max / min) : (v - min) / (max - min);
    return Math.round(Math.min(1, Math.max(0, f)) * detents);

    return Math.round(v * 100) / 100;

    { key: "pad", label: "Padding", hue: "cyan", min: 0, max: 32, detents: 16, home: 8, format: (v) => Math.round(v) + " px" },
    { key: "border", label: "Border", hue: "purple", min: 0, max: 4, detents: 8, home: 2, format: (v) => v.toFixed(1) + " px" },
  ];

  FlatPlayer.register({
    slug: "knob",
    title: "Knob",
    tagline: "Component props that recall their variations on the tick.",
    css: `
.fs-knob .kd { width: min(330px, 100%); font: 400 12px/1.35 var(--font); background: var(--body); padding: 3px; border-radius: 8px; display: grid; gap: 3px;
  -webkit-user-select: none; user-select: none }
.fs-knob .kd-pv { background: var(--panel); border-radius: var(--r-panel); overflow: hidden; display: grid; grid-template-rows: auto 1fr }
.fs-knob .kd-pv-h { display: flex; align-items: center; justify-content: space-between; height: 24px; padding: 0 8px; background: var(--panel-2); font-weight: 600 }

.fs-knob .kd-card { display: grid; gap: 4px; width: 132px; background: var(--clip-blue-tint); color: var(--clip-blue-text); box-shadow: inset 0 0 0 var(--bw, 0) var(--clip-blue);
  border-radius: var(--rad, 0); padding: var(--pd, 0) }
.fs-knob .kd-card b { font-weight: 600; font-size: 12px }

.fs-knob .kd-card i + i { width: 60% }

.fs-knob .kd-dev { background: var(--panel); border-radius: var(--r-panel); overflow: hidden }
.fs-knob .kd-head { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px; background: var(--panel-2) }

.fs-knob .kd-val { width: 100%; max-width: 76px; height: 20px; display: grid; place-items: center; border-radius: var(--r-control); background: var(--cut); box-shadow: var(--edge);
  font: 600 11px var(--mono); white-space: nowrap; overflow: hidden }

.fs-knob.is-tile .kd { grid-template-columns: 1fr 112px } .fs-knob.is-tile .kd-card { width: 92px } .fs-knob.is-tile .kd-dial { max-width: 54px }
@container (min-width: 520px) { .fs-knob .kd { width: 560px; grid-template-columns: 1fr 200px; font-size: 13px } .fs-knob .kd-dial, .fs-knob .kd-val { max-width: 96px } }
`,
    mount(host, ctx) {
      const id = "kd" + ++n;
      host.innerHTML = `
<div class="kd"><div class="kd-dev">
  <div class="kd-head">
    <button class="kd-key kd-power" type="button" aria-pressed="true" aria-label="Device on"><svg viewBox="0 0 10 10"><path d="M5 1v4M2.6 2.8a3.4 3.4 0 1 0 4.8 0"/></svg></button>
    <b>Card</b>
    <div class="kd-vars" role="radiogroup" aria-label="Variation">
      <button class="kd-key" type="button" role="radio" data-v="A" aria-label="Variation A">A</button><button class="kd-key" type="button" role="radio" data-v="B" aria-label="Variation B">B</button>
    </div>
  </div>
  <div class="kd-dials"></div>
  <div class="kd-foot" aria-hidden="true"><span class="kd-state"></span><span>Shift-drag for fine</span></div>
</div>
<div class="kd-pv" aria-hidden="true"><div class="kd-pv-h">Preview<span>Card</span></div><div class="kd-stage"><div class="kd-card"><b>Card title</b><i></i><i></i></div></div></div>

      let handed = false;

  });

<script>
/* magnetic-button.js */
/* Magnetic Button, in Rack: the gravity becomes a design tool's snapping. On a canvas with a Header (purple) and a

  .fs-magnetic-button:not(.is-tile) .mg { grid-template-columns: 1fr }
  .fs-magnetic-button .mg-layers { display: none }
  .fs-magnetic-button .mg-props { grid-template-columns: auto 1fr auto 1fr }
}
`,
  mount(host, ctx) {
    const W = 480, H = 240, REACH = 6; // design px; inside REACH an edge or centre catches the card
    const GRIDS = [4, 8, 16];
    const STATIC = [
      { name: "Header", tone: "purple", x: 24, y: 16, w: 432, h: 32 },
      { name: "Sidebar", tone: "green", x: 24, y: 64, w: 112, h: 160 },
    ];
    const HOME = { x: 216, y: 88 }, CW = 160, CH = 96;
    host.innerHTML = `<div class="mg">
      <div class="mg-dev">
        <div class="mg-strip"><b>Canvas</b><span class="mg-lbl">Grid</span><button type="button" class="mg-box" aria-label="Grid size">8 px</button>
          <button type="button" class="mg-key" aria-pressed="true">Snap</button></div>
        <div class="mg-wrap"><div class="mg-canvas">
          <svg aria-hidden="true" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="mg-grid"></svg>
          ${STATIC.map((f) => `<div class="mg-f" data-tone="${f.tone}" aria-hidden="true" style="left:${(f.x / W) * 100}%;top:${(f.y / H) * 100}%;width:${(f.w / W) * 100}%;height:${(f.h / H) * 100}%">${f.name}</div>`).join("")}
          <div class="mg-guides" aria-hidden="true"></div>
          <div class="mg-f mg-card" data-tone="pink" tabindex="0" role="button" aria-roledescription="movable frame" aria-label="Card frame. Arrows move it.">Card</div>
        </div></div>
      </div>
      <div class="mg-dev mg-side">
        <div class="mg-strip"><b>Inspector</b></div>
        <div class="mg-props"><span class="mg-lbl">X</span><b class="mg-x"></b><span class="mg-lbl">Y</span><b class="mg-y"></b><span class="mg-lbl">W</span><b>${CW}</b><span class="mg-lbl">H</span><b>${CH}</b></div>
        <ul class="mg-layers" aria-hidden="true"><li class="is-sel" style="--tone:var(--clip-pink)">Card</li>${STATIC.map((f) => `<li style="--tone:var(--clip-${f.tone})">${f.name}</li>`).join("")}</ul>
        <p class="mg-say" aria-hidden="true"></p>
      </div>
      <p class="sr-only" aria-live="polite"></p>
    </div>`;
    const canvas = host.querySelector(".mg-canvas"), card = host.querySelector(".mg-card"), guides = host.querySelector(".mg-guides"), gridSvg = host.querySelector(".mg-grid");
    const snapKey = host.querySelector(".mg-key"), gridBox = host.querySelector(".mg-box"), xEl = host.querySelector(".mg-x"), yEl = host.querySelector(".mg-y");
    const sayEl = host.querySelector(".mg-say"), live = host.querySelector("[aria-live]");
    const opt = { signal: ctx.signal };

    let snap = true, gi = 1, x = HOME.x, y = HOME.y, caught = "";
    const unit = () => canvas.clientWidth / W;
    function drawGrid() {
      const g = GRIDS[gi] * 2; // one line every two grid steps, so the canvas stays quiet
      let d = "";
      for (let i = g; i < W; i += g) d += `M${i} 0V${H}`;
      for (let i = g; i < H; i += g) d += `M0 ${i}H${W}`;
      gridSvg.innerHTML = `<path d="${d}" stroke="var(--line-strong)" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.35" fill="none"/>`;
      gridBox.textContent = GRIDS[gi] + " px";
    }
    function paint(lines) {
      card.style.left = (x / W) * 100 + "%"; card.style.top = (y / H) * 100 + "%";
      card.style.width = (CW / W) * 100 + "%"; card.style.height = (CH / H) * 100 + "%";
      xEl.textContent = Math.round(x); yEl.textContent = Math.round(y);
      const key = (lines || []).map((l) => l.join(":")).join("|");
      if (key !== guides.dataset.key) {
        guides.dataset.key = key;
        guides.innerHTML = (lines || []).map(([axis, v]) => axis === "x" ? `<i class="mg-guide is-x" style="left:${(v / W) * 100}%"></i>` : `<i class="mg-guide is-y" style="top:${(v / H) * 100}%"></i>`).join("");
      }
    }
    /* One axis at a time: the card's three lines (start, centre, end) against every other frame's three and the
       canvas's; the nearest within reach wins. Otherwise the grid, if Snap is lit. */
    function snapAxis(raw, size, axis) {
      const targets = [0, axis === "x" ? W / 2 : H / 2, axis === "x" ? W : H];
      for (const f of STATIC) { const a = axis === "x" ? f.x : f.y, s = axis === "x" ? f.w : f.h; targets.push(a, a + s / 2, a + s); }
      let best = null;
      for (const off of [0, size / 2, size]) for (const t of targets) {
        const d = Math.abs(raw + off - t);
        if (d <= REACH && (!best || d < best.d)) best = { d, v: t - off, line: t };
      }
      if (best) return best;
      return { v: snap ? Math.round(raw / GRIDS[gi]) * GRIDS[gi] : Math.round(raw), line: null };
    }
    function place(rx, ry) {
      rx = Math.max(0, Math.min(W - CW, rx)); ry = Math.max(0, Math.min(H - CH, ry));
      const sx = snapAxis(rx, CW, "x"), sy = snapAxis(ry, CH, "y");
      x = sx.v; y = sy.v;
      const lines = [];
      if (sx.line !== null) lines.push(["x", sx.line]);
      if (sy.line !== null) lines.push(["y", sy.line]);
      caught = lines.length ? "Aligned" : snap ? "On the grid" : "Placed";
      paint(lines);
    }
    function settle(word) {
      paint(guides.dataset.key ? guides.dataset.key.split("|").map((s) => { const [a, v] = s.split(":"); return [a, +v]; }) : []);
      sayEl.innerHTML = `<b>${word}</b> at ${Math.round(x)}, ${Math.round(y)}`;
      live.textContent = `Card ${word.toLowerCase()} at ${Math.round(x)}, ${Math.round(y)}`;
    }

    /* The hand: 1:1, and the card stays where it is let go. */
    let drag = null, ghost = !ctx.reduced();
    card.addEventListener("pointerdown", (e) => {
      if (e.button > 0) return;
      ghost = false;
      drag = { id: e.pointerId, px: e.clientX, py: e.clientY, x, y };
      card.setPointerCapture(e.pointerId); card.classList.add("is-held"); e.preventDefault(); card.focus({ preventScroll: true });
    }, opt);
    card.addEventListener("pointermove", (e) => { if (drag && e.pointerId === drag.id) place(drag.x + (e.clientX - drag.px) / unit(), drag.y + (e.clientY - drag.py) / unit()); }, opt);
    const up = (e) => { if (!drag || e.pointerId !== drag.id) return; drag = null; card.classList.remove("is-held"); settle(caught); };
    card.addEventListener("pointerup", up, opt); card.addEventListener("pointercancel", up, opt);
    card.addEventListener("dblclick", () => { x = HOME.x; y = HOME.y; paint([]); settle("Back"); }, opt);
    card.addEventListener("keydown", (e) => {
      const d = e.shiftKey ? GRIDS[gi] : 1;
      const m = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[e.key];
      if (!m) return;
      e.preventDefault();
      x = Math.max(0, Math.min(W - CW, x + m[0])); y = Math.max(0, Math.min(H - CH, y + m[1]));
      paint([]); settle("Moved");
    }, opt);
    snapKey.addEventListener("click", () => { snap = !snap; snapKey.setAttribute("aria-pressed", String(snap)); live.textContent = snap ? "Snap on" : "Snap off"; }, opt);
    gridBox.addEventListener("click", () => { gi = (gi + 1) % GRIDS.length; drawGrid(); live.textContent = "Grid " + GRIDS[gi] + " pixels"; }, opt);

    drawGrid(); paint([]); sayEl.textContent = "Drag the card";

    /* The self-run: an unseen hand drags the card around the canvas; edges catch it as it passes, so it moves in cuts
       where it aligns. It lets go every few seconds, and the card stays put while it rests. */
    if (ghost) {
      let t = 0, pause = 0, last = 0;
      ctx.loop((dt) => {
        if (!ghost) return false;
        if (pause > 0) { pause -= dt; return; }
        t += dt;
        place(HOME.x + 130 * Math.sin(t * 0.6), HOME.y + 60 * Math.sin(t * 1.1 + 0.4));
        if (t - last > 3.2) { last = t; pause = 0.9; settle(caught); }
      });
    }
    ctx.onHand(() => { ghost = false; });
  },
});

</script>
<script>
/* number-ticker.js */
/* Number Ticker, after litterthanlit/components, redesigned for Rack: an agent's token usage as a device.
   The count is the study's one readout; when it changes, its digits cut to their new figures from the right,
   a tick (60ms) apart, each by opacity alone: nothing rolls or travels. Intl.NumberFormat does the grouping
   and the currency, so the Locale box (a value you step) regroups the same count and cost for en-US, de-DE,
   fr-FR or en-IN. Tokens per day are a clip in the agent's orange, and today's bar grows as requests come in.
   Live is the lit key: on, requests arrive by themselves; a hand ends that. */
(function () {
  const S = ".fs-number-ticker";
  const LOCALES = ["en-US", "de-DE", "fr-FR", "en-IN"];
  const DAYS = 14;
  const PRICE = 0.000015; // dollars a token
  const moneyIn = (l) => new Intl.NumberFormat(l, { style: "currency", currency: "USD" });
  let uid = 0;

  FlatPlayer.register({
    slug: "number-ticker",
    title: "Number Ticker",
    tagline: "Tokens and cost that cut in digit by digit, in any locale.",
    css: `
${S} .nt { width: min(100%, 420px); background: var(--body); padding: 3px; border-radius: 9px }
${S} .nt-dev { background: var(--panel); border-radius: var(--r-panel); overflow: hidden }
${S} .nt-strip { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 10px; background: var(--panel-2) }
${S} .nt-strip b { font-size: 12px; font-weight: 600 }
${S} .nt-track { height: 20px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: var(--r-control); background: var(--clip-orange-tint);
  color: var(--clip-orange-text); font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; margin-right: auto }
${S} .nt-key { height: 20px; min-width: 44px; padding: 0 8px; border: 0; border-radius: var(--r-control); background: var(--block); box-shadow: var(--edge);
  font-size: 11px; font-weight: 600; cursor: pointer; flex: none }
${S} .nt-key:hover { background: var(--block-hover) }
${S} .nt-key:active { box-shadow: var(--edge-press); transform: scale(0.98) }
${S} .nt-key[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
${S} .nt-body { padding: 12px; display: grid; gap: 10px }
${S} .nt-read { display: flex; align-items: baseline; gap: 8px; min-width: 0 }
${S} .nt-num { margin: 0; font: 600 24px/1 var(--mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: pre }
${S} .nt-num span { display: inline-block }
${S} .nt-unit { font-size: 12px; color: var(--muted) }
${S} .nt-delta { margin-left: auto; font: 500 11px var(--mono); color: var(--success); white-space: nowrap }
${S} .nt-clip { position: relative; height: 44px; border-radius: var(--r-control); background: var(--clip-orange-tint); padding: 4px 4px 0; display: grid; grid-template-columns: repeat(${DAYS}, 1fr); gap: 2px; align-items: end }
${S} .nt-clip i { display: block; background: var(--clip-orange); border-radius: 1px 1px 0 0; min-height: 1px }
${S} .nt-clip i:last-child { background: var(--clip-orange-text) }
${S} .nt-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
${S} .nt-row > span { font-size: 11px; color: var(--muted) }
${S} .nt-box { height: 22px; min-width: 60px; display: inline-flex; align-items: center; justify-content: flex-end; padding: 0 7px; border-radius: var(--r-control);
  background: var(--cut); box-shadow: var(--edge); font: 500 11px var(--mono); font-variant-numeric: tabular-nums; cursor: ns-resize; user-select: none; touch-action: none }
${S} .nt-box:active { box-shadow: var(--edge-press) }
${S} .nt-box.is-static { cursor: default }
${S} .nt-gap { flex: 1 }
@container (max-width: 380px) { ${S} .nt-body { padding: 10px; gap: 8px } ${S} .nt-num { font-size: 22px } ${S} .nt-clip { height: 36px } }
@container (min-width: 600px) { ${S} .nt { width: 480px } ${S} .nt-clip { height: 60px } }
`,
    mount(host, ctx) {
      const id = "nt" + ++uid;
      host.innerHTML = `
<div class="nt">
  <div class="nt-dev" role="group" aria-labelledby="${id}-t">
    <div class="nt-strip"><b id="${id}-t">Usage</b><span class="nt-track">Coder agent</span><button class="nt-key" type="button" aria-pressed="true">Live</button></div>
    <div class="nt-body">
      <div class="nt-read"><p class="nt-num" aria-hidden="true"></p><span class="nt-unit">tokens this month</span><span class="nt-delta"></span></div>
      <div class="nt-clip" aria-hidden="true"></div>
      <div class="nt-row">
        <span id="${id}-l">Locale</span><span class="nt-box" role="spinbutton" aria-labelledby="${id}-l" tabindex="0"></span>
        <span class="nt-gap"></span>
        <span>Cost</span><span class="nt-box is-static nt-today" aria-hidden="true"></span>
      </div>
      <p class="sr-only nt-said" role="status"></p>
    </div>
  </div>
</div>`;
      const $ = (s) => host.querySelector(s);
      const num = $(".nt-num"), deltaEl = $(".nt-delta"), clip = $(".nt-clip"), localeBox = $('[role="spinbutton"]'), todayBox = $(".nt-today"), said = $(".nt-said"), liveKey = $(".nt-key");
      if (ctx.tile) { localeBox.tabIndex = -1; liveKey.tabIndex = -1; }

      // Tokens per day, in hundreds: a seeded clip, today last.
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const days = Array.from({ length: DAYS }, (_, i) => Math.round(900 + 700 * Math.sin(i / 2.3) + rnd() * 500));
      days[DAYS - 1] = 410;
      const bars = days.map(() => { const b = document.createElement("i"); clip.appendChild(b); return b; });
      const paintClip = () => { const max = Math.max(...days); bars.forEach((b, i) => (b.style.height = ((days[i] / max) * 100).toFixed(1) + "%")); };

      let count = 2148032, locale = 0, fmt = new Intl.NumberFormat(LOCALES[0]), money = moneyIn(LOCALES[0]);
      let shownChars = [];
      const cutTimers = [];
      /* Cut to the new figure from the right, a beat apart, each by opacity alone; unchanged digits stay. */
      function paint(first) {
        const text = fmt.format(count);
        const chars = [...text];
        const reshape = chars.length !== shownChars.length || chars.some((c, i) => /\d/.test(c) !== /\d/.test(shownChars[i] || ""));
        if (reshape) num.replaceChildren(...chars.map((c) => { const sp = document.createElement("span"); sp.textContent = c; return sp; }));
        const spans = [...num.children];
        cutTimers.forEach(clearTimeout); cutTimers.length = 0;
        let order = 0;
        for (let i = chars.length - 1; i >= 0; i--) {
          const s = spans[i], c = chars[i];
          if (!reshape && s.textContent === c) continue;
          const delay = first || ctx.reduced() ? 0 : order++ * 60;
          const cut = () => { s.textContent = c; if (!first && !ctx.reduced()) s.animate([{ opacity: 0.35 }, { opacity: 1 }], { duration: 100, easing: "cubic-bezier(0.23, 1, 0.32, 1)" }); };
          if (delay) cutTimers.push(ctx.after(delay, cut)); else cut();
        }
        shownChars = chars;
        said.textContent = text + " tokens this month, " + money.format(count * PRICE);
        localeBox.textContent = LOCALES[locale];
        localeBox.setAttribute("aria-valuetext", LOCALES[locale] + ", " + text);
        localeBox.setAttribute("aria-valuenow", String(locale + 1));
        todayBox.textContent = money.format(count * PRICE);
        deltaEl.textContent = "+" + fmt.format(Math.round(days[DAYS - 1] * 100)) + " today";
        paintClip();
      }
      localeBox.setAttribute("aria-valuemin", "1"); localeBox.setAttribute("aria-valuemax", String(LOCALES.length));

      function setLocale(i) {
        locale = (i + LOCALES.length) % LOCALES.length;
        fmt = new Intl.NumberFormat(LOCALES[locale]); money = moneyIn(LOCALES[locale]);
        shownChars = []; // regroup: every digit cuts again, from the right
        paint(false);
      }
      function add(n) { count += n; days[DAYS - 1] += n / 100; paint(false); }

      paint(true);

      // Requests arrive by themselves, a tick at a time, while Live is lit.
      let liveOn = !ctx.reduced(), timer = 0;
      const run = () => { clearInterval(timer); if (liveOn) timer = ctx.every(1500, () => add(400 + Math.floor(Math.random() * 3200))); };
      liveKey.setAttribute("aria-pressed", String(liveOn));
      run();
      ctx.onHand(() => { liveOn = false; liveKey.setAttribute("aria-pressed", "false"); run(); });
      liveKey.addEventListener("click", () => { liveOn = !liveOn; liveKey.setAttribute("aria-pressed", String(liveOn)); run(); said.textContent = liveOn ? "Live" : "Paused"; }, { signal: ctx.signal });

      // The Locale box: a value you set. Arrows step, a vertical drag steps every 16px (1:1, it stays), double-click returns to en-US.
      localeBox.addEventListener("keydown", (e) => {
        const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
        if (e.key === "Home") { e.preventDefault(); setLocale(0); return; }
        if (e.key === "End") { e.preventDefault(); setLocale(LOCALES.length - 1); return; }
        if (!d) return;
        e.preventDefault(); setLocale(locale + d);
      }, { signal: ctx.signal });
      let drag = null;
      localeBox.addEventListener("pointerdown", (e) => { if (e.button) return; drag = { y: e.clientY, from: locale, moved: false }; localeBox.setPointerCapture(e.pointerId); }, { signal: ctx.signal });
      localeBox.addEventListener("pointermove", (e) => {
        if (!drag) return;
        const steps = Math.trunc((drag.y - e.clientY) / 16);
        if (steps) drag.moved = true;
        const want = (((drag.from + steps) % LOCALES.length) + LOCALES.length) % LOCALES.length;
        if (want !== locale) setLocale(want);
      }, { signal: ctx.signal });
      localeBox.addEventListener("pointerup", () => { if (drag && !drag.moved) setLocale(locale + 1); drag = null; }, { signal: ctx.signal });
      localeBox.addEventListener("pointercancel", () => { drag = null; }, { signal: ctx.signal });
      localeBox.addEventListener("dblclick", () => setLocale(0), { signal: ctx.signal });

      return { destroy() { cutTimers.forEach(clearTimeout); } };
    },
  });
})();

</script>
<script>

   small device. Six value boxes (light cuts in the control line), one figure each in the
   mono; the box the next figure goes into is outlined in the ink with a still caret. It is one real input
   laid over them, so paste ("482-913" lands as 482913), autofill and native selection work. The code's window
   runs on a clock (time moves things: a slot drains linearly, the seconds count down). A right code fills
   the boxes with the agent's colour column by column, a tick apart; a wrong one turns

  background: var(--cut); box-shadow: var(--edge); font: 500 11px var(--mono); font-variant-numeric: tabular-nums }

`,
    mount(host, ctx) {
      const id = "oc" + ++uid;
      host.innerHTML = `
<div class="oc">
  <div class="oc-dev" role="group" aria-labelledby="${id}-t">
    <div class="oc-strip"><b id="${id}-t">Authorize</b><span class="oc-clip">Deploy agent</span></div>
    <div class="oc-body">
      <p class="oc-label">Code from your authenticator app, to let it push to main</p>
      <div class="oc-field">
        <div class="oc-cells" aria-hidden="true"></div>
        <input class="oc-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="${LENGTH}"
          spellcheck="false" autocorrect="off" autocapitalize="off" aria-label="Code" aria-describedby="${id}-s">
      </div>

      <div class="oc-status"><span class="oc-word" id="${id}-s"></span><button class="oc-key" type="button">New code</button></div>
    </div>
  </div>
  <p class="sr-only" role="status"></p>
  <p class="sr-only" role="alert"></p>
</div>`;
      const $ = (s) => host.querySelector(s);
      const root = $(".oc"), cellsEl = $(".oc-cells"), input = $(".oc-input"), word = $(".oc-word"), slot = $(".oc-slot i"), left = $(".oc-left"), newKey = $(".oc-key");
      const statusLive = $('[role="status"]'), alertLive = $('[role="alert"]');
      const on = (el, type, fn) => el.addEventListener(type, fn, { signal: ctx.signal });
      if (ctx.tile) input.tabIndex = -1;
      const cells = [];
      for (let i = 0; i < LENGTH; i++) {
        if (i === LENGTH / 2) { const g = document.createElement("span"); g.className = "oc-gap"; cellsEl.appendChild(g); }
        const c = document.createElement("span"); c.className = "oc-cell"; cellsEl.appendChild(c); cells.push(c);
      }

      let code = "", sel = { start: 0, end: 0 }, status = "idle", engaged = false;
      let round = 0, ghost = !ctx.reduced(), edits = 0, windowStart = performance.now();
      const ghostTimers = [], litTimers = [];
      const later = (ms, fn) => { const t = ctx.after(ms, fn); ghostTimers.push(t); return t; };
      const sentNow = () => ROUNDS[round % ROUNDS.length].sent;

      function render() {
        const start = Math.min(sel.start, code.length), end = Math.min(sel.end, code.length);
        const locked = status === "pending" || status === "success";
        const at = !locked && start === end && start < LENGTH && (engaged || (code.length > 0 && code.length < LENGTH)) ? start : -1;
        cellsEl.dataset.s = status;
        cells.forEach((c, i) => {
          const ch = code[i] || "";
          c.textContent = ch;
          c.classList.toggle("is-sel", engaged && start !== end && i >= start && i < end);
          c.classList.toggle("is-at", i === at);
          if (i === at && ch === "") { const k = document.createElement("span"); k.className = "oc-caret"; c.appendChild(k); }
        });

        statusLive.textContent = status === "success" ? "Authorized" : status === "pending" ? "Checking" : "";
        alertLive.textContent = status === "error" ? "Wrong code" : "";
        if (document.activeElement === input && (input.selectionStart !== start || input.selectionEnd !== end)) input.setSelectionRange(start, end);
      }
      /* A right code lights the boxes column by column, a beat apart; anything else puts them out at once. */
      function light(on) {
        litTimers.forEach(clearTimeout); litTimers.length = 0;
        cells.forEach((c, i) => {

        });

      function setStatus(s) { status = s; light(s === "success"); render(); }
      function commit(next, caret) {
        sel = { start: caret, end: caret };
        if (next !== code) {
          code = next; edits++;
          if (status === "error") status = "idle";
          if (next.length === LENGTH) { verify(next); return; }
        }
        render();
      }
      function insert(text, from, to) {
        const digits = String(text).replace(/\D/g, "");
        if (!digits || status === "pending" || status === "success") return false;
        if (digits.length >= LENGTH) { commit(digits.slice(0, LENGTH), LENGTH); return true; }
        let a = Math.min(from, code.length), b = Math.min(to, code.length);
        if (a === b && code.length >= LENGTH) { if (a >= LENGTH) return false; b = Math.min(LENGTH, a + digits.length); }
        const next = (code.slice(0, a) + digits + code.slice(b)).slice(0, LENGTH);
        commit(next, Math.min(next.length, a + digits.length));
        return true;
      }
      function erase(from, to) {
        if (status === "pending" || status === "success") return false;
        if (from === to) { if (from === 0) return false; from -= 1; }
        commit(code.slice(0, from) + code.slice(to), from);
        return true;
      }
      function fresh() { // a new window and an empty field
        round++; windowStart = performance.now(); code = ""; sel = { start: 0, end: 0 }; status = "idle"; light(false); render();
      }
      const ghostPress = (k) => k === "back" ? erase(Math.min(sel.start, code.length), Math.min(sel.end, code.length)) : insert(k, Math.min(sel.start, code.length), Math.min(sel.end, code.length));
      function type(keys, at) { let t = at; for (const k of keys) { later(t, () => ghostPress(k)); t += beat(); } return t; }
      function playRound(r, at) { if (!ghost) return; const { sent, slip } = ROUNDS[r % ROUNDS.length]; type([...(slip || sent)], at); }
      function verify(c) {
        setStatus("pending");
        const sent = sentNow();
        ctx.after(VERIFY, () => {
          if (code !== c) return;
          const ok = c === sent;
          setStatus(ok ? "success" : "error");
          if (!ghost) { const at = edits; if (ok) ctx.after(2400, () => { if (edits === at) fresh(); }); return; }
          if (ok) later(1600, () => { fresh(); playRound(round, 400); });
          else { const t = type(["back", "back"], 700); type([...sent.slice(4)], t + 120); }

      function takeOver() {
        if (!ghost) return;

      on(root, "focusin", () => { takeOver(); engaged = true; render(); });

      on(input, "beforeinput", (e) => {
        if (e.inputType !== "insertText" || e.data == null || !e.cancelable) return;
        e.preventDefault();
        insert(e.data, input.selectionStart ?? code.length, input.selectionEnd ?? code.length);
      });
      on(input, "input", () => {
        const raw = input.value, next = raw.replace(/\D/g, "").slice(0, LENGTH);
        commit(next, Math.min(next.length, raw.slice(0, input.selectionStart ?? raw.length).replace(/\D/g, "").length));
      });
      on(input, "paste", (e) => { e.preventDefault(); insert(e.clipboardData.getData("text"), input.selectionStart ?? code.length, input.selectionEnd ?? code.length); });
      const selectionChanged = () => {
        if (document.activeElement !== input) return;

        if (sel.start !== a || sel.end !== b) { sel = { start: a, end: b }; render(); }
      };
      on(input, "select", selectionChanged);
      on(document, "selectionchange", selectionChanged);
      on(input, "click", (e) => {
        if (e.detail > 1 || input.selectionStart !== input.selectionEnd) return;
        const i = cells.findIndex((c) => e.clientX < c.getBoundingClientRect().right);
        const at = Math.min(i === -1 ? LENGTH : i, code.length);
        input.setSelectionRange(at, at < code.length ? at + 1 : at);
        selectionChanged();
      });
      on(newKey, "click", () => { fresh(); statusLive.textContent = "New code window"; input.focus(); });

      /* The window: a clock, so it runs even under reduced motion; it steps once a second there. */
      let lastSec = -1;
      const tick = () => {
        const el = (performance.now() - windowStart) / 1000;
        if (el >= WINDOW) { if (status !== "success") { ghostTimers.forEach(clearTimeout); fresh(); if (ghost) playRound(round, 400); } else windowStart = performance.now(); return; }
        const secs = Math.ceil(WINDOW - el);
        const frac = ctx.reduced() ? secs / WINDOW : 1 - el / WINDOW;
        slot.style.transform = "scaleX(" + frac.toFixed(4) + ")";
        if (secs !== lastSec) { lastSec = secs; left.textContent = "0:" + String(secs).padStart(2, "0"); }

      tick();

        try { navigator.credentials.get({ otp: { transport: ["sms"] }, signal: ctx.signal }).then((cr) => { if (cr && cr.code && !ctx.signal.aborted) insert(cr.code, 0, LENGTH); }).catch(() => {}); } catch (e) {}
      }

      render();
      if (ghost) playRound(0, START);
      return { destroy() { ghostTimers.forEach(clearTimeout); litTimers.forEach(clearTimeout); } };
    },
  });
})();

</script>
<script>
/* segmented-control.js */
/* Segmented Control, in Rack: a design tool's breakpoint picker. Four square boxes joined edge to edge, the chosen
   width the lit key (yellow, on the frame; no indicator travels). Under it the frame itself: its layers rearranged
   for that width, the cards cutting in a column at a time on the tick, and the props that changed as value boxes,
   the changed ones marked. Each layer keeps its colour everywhere it shows: Header purple, Card pink, Button cyan. */
FlatPlayer.register({
  slug: "segmented-control",
  title: "Segmented Control",
  tagline: "A breakpoint picker: one lit box, and what changes under it.",
  css: `
.fs-segmented-control .bp { width: min(100%, 640px); background: var(--panel); border-radius: var(--r-panel); overflow: hidden; font-size: 12px }

.fs-segmented-control .bp-body { padding: 10px; display: grid; gap: 10px }
.fs-segmented-control .bp-label { color: var(--muted); font-size: 11px; margin-bottom: 4px; display: block }

  white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: background-color var(--cut-in) var(--ease-out) }

  font: 600 8px/1 var(--font); color: var(--clip-purple-text) }

  justify-content: space-between; font: 600 8px/1 var(--font); color: var(--clip-pink-text) }
.fs-segmented-control .bp-btn { align-self: flex-start; width: 60%; height: 9px; border-radius: var(--r-control); background: var(--clip-cyan-tint); box-shadow: inset 0 0 0 1px var(--clip-cyan) }
@keyframes fs-bp-in { from { opacity: 0 } }
.fs-segmented-control .bp-props { display: grid; gap: 4px }

.fs-segmented-control .bp-prop b { height: 22px; padding: 0 6px; background: var(--cut); box-shadow: var(--edge); border-radius: var(--r-control); font: 600 11px/22px var(--mono);
  color: var(--ink); white-space: nowrap }

`,
  mount(host, ctx) {
    const BPS = [
      { v: "phone", label: "Phone", w: 390, h: 844, cols: 1, gutter: 12, margin: 16, type: 15, frameW: 0.32 },
      { v: "tablet", label: "Tablet", w: 768, h: 1024, cols: 2, gutter: 16, margin: 24, type: 15, frameW: 0.6 },
      { v: "desktop", label: "Desktop", w: 1280, h: 800, cols: 3, gutter: 24, margin: 40, type: 16, frameW: 0.86 },
      { v: "wide", label: "Wide", w: 1440, h: 900, cols: 4, gutter: 24, margin: 64, type: 16, frameW: 1 },
    ];
    const PROPS = [["Columns", (b) => String(b.cols)], ["Gutter", (b) => b.gutter + " px"], ["Margin", (b) => b.margin + " px"], ["Body type", (b) => b.type + " px"]];
    const uid = "bp" + Math.random().toString(36).slice(2, 7);
    host.innerHTML = `<div class="bp">
      <div class="bp-strip"><b>Frame</b><span>Pricing page</span><span class="bp-size"></span></div>
      <div class="bp-body">
        <div><span class="bp-label" id="${uid}">Breakpoint</span>
          <div class="bp-seg" role="radiogroup" aria-labelledby="${uid}">${BPS.map((b) => `<button type="button" class="bp-opt" role="radio" data-v="${b.v}" aria-label="${b.label}, ${b.w} pixels"><span>${b.label}</span><i>${b.w}</i></button>`).join("")}</div></div>
        <div class="bp-main">
          <div class="bp-canvas" aria-hidden="true"><div class="bp-frame"><div class="bp-layer bp-head">Header</div><div class="bp-cards"></div></div></div>
          <div class="bp-props">${PROPS.map(([n]) => `<div class="bp-prop"><span>${n}</span><b></b></div>`).join("")}<p class="bp-note"></p></div>
        </div>
      </div>
      <p class="sr-only" aria-live="polite"></p>
    </div>`;
    const group = host.querySelector(".bp-seg"), opts = [...host.querySelectorAll(".bp-opt")], frame = host.querySelector(".bp-frame");
    const cards = host.querySelector(".bp-cards"), props = [...host.querySelectorAll(".bp-prop")], note = host.querySelector(".bp-note");
    const size = host.querySelector(".bp-size"), live = host.querySelector("[aria-live]"), head = host.querySelector(".bp-head");
    const opt = { signal: ctx.signal };

    let value = null;
    function select(v, focus, quiet) {
      const prev = BPS.find((b) => b.v === value), bp = BPS.find((b) => b.v === v);
      value = v;
      opts.forEach((o) => { const on = o.dataset.v === v; o.setAttribute("aria-checked", String(on)); o.tabIndex = on ? 0 : -1; });
      if (focus) opts.find((o) => o.dataset.v === v).focus();
      size.textContent = `${bp.w} × ${bp.h}`;
      frame.style.width = bp.frameW * 100 + "%";
      /* The frame's cards come in a column at a time, a tick (60ms) apart, like a set launching. */
      cards.style.gridTemplateColumns = `repeat(${bp.cols}, 1fr)`;
      const n = bp.cols * 2;
      cards.innerHTML = Array.from({ length: n }, (_, i) => `<div class="bp-layer bp-card" style="animation-delay:calc(${i % bp.cols} * var(--beat))">Card<span class="bp-btn"></span></div>`).join("");
      head.style.animation = "none"; void head.offsetWidth; head.style.animation = "";
      let changed = 0;
      PROPS.forEach(([name, f], i) => {
        const now = f(bp), was = prev ? f(prev) : now, diff = now !== was;
        props[i].querySelector("b").textContent = now;
        props[i].classList.toggle("is-changed", diff);
        if (diff) changed++;
      });
      note.textContent = prev ? `${changed} ${changed === 1 ? "prop changes" : "props change"} from ${prev.label}` : "Pick a width";
      if (!quiet) live.textContent = `${bp.label}, ${bp.w} by ${bp.h}. ${bp.cols} ${bp.cols === 1 ? "column" : "columns"}.`;
    }
    opts.forEach((o) => o.addEventListener("click", () => select(o.dataset.v), opt));
    group.addEventListener("keydown", (e) => {
      const i = BPS.findIndex((b) => b.v === value), n = BPS.length;
      let next;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (i + 1) % n;
      else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (i - 1 + n) % n;
      else if (e.key === "Home") next = 0;
      else if (e.key === "End") next = n - 1;
      else return;
      e.preventDefault(); select(BPS[next].v, true);
    }, opt);
    select("desktop", false, true);

    /* The self-run: someone checks each width in turn, a beat apart, until a hand arrives. */
    let ghost = !ctx.reduced();
    const order = ["phone", "tablet", "wide", "desktop"];
    let k = 0;
    if (ghost) ctx.every(1800, () => { if (ghost) select(order[k++ % order.length], false, true); });
    ctx.onHand(() => { ghost = false; });
  },
});

</script>
<script>
/* spotlight-card.js */
/* Spotlight Card, in Rack: the light that follows the pointer becomes a redline inspector. Over a frame of layers
   (Header purple, Avatar green, Sidebar blue, Card pink, Button cyan), the pointer's position rides with it as a
   value box, and the layer under it is outlined in its own colour with redlines to its neighbours or its parent,
   each distance in a box. The pointer's position goes straight to CSS variables; the redlines cut in when the layer
   under the hand changes, and nothing trails. Arrow keys step through the layers. */
FlatPlayer.register({
  slug: "spotlight-card",

  cursor: crosshair; touch-action: none; outline-offset: 2px }

        running = true; head = { step: -1, bar: 0 }; queue = []; step = 0; at = performance.now() + 40;
        schedule(); schedTimer = ctx.every(INTERVAL, schedule);
        drawLoop = ctx.loop((dt, now) => {
          let shown = -1;
          while (queue.length && queue[0].at <= now) shown = queue.shift().step;
          if (shown >= 0) {
            head = { step: shown, bar: shown === 0 ? head.bar + 1 : head.bar };
            if (!wide && now > pinned && Math.floor(shown / PAGE) !== page) { page = Math.floor(shown / PAGE); build(); }
            paint(); paintTop();
          }
          return running;
        });
        paintTop(); paint();
      }
      function stop() {
        if (!running) return;
        running = false; clearInterval(schedTimer); schedTimer = 0; if (drawLoop) drawLoop.stop = true;
        paintTop(); paint();
      }

      /* Moves. */
      const pin = () => (pinned = performance.now() + PIN);
      grid.addEventListener("click", (e) => {
        const b = e.target.closest(".sq-cell"); if (!b) return;
        const row = +b.dataset.row, col = +b.dataset.col;
        pattern[row][col] = !pattern[row][col]; cursor = { row, col }; pin(); paint();
      }, sig);
      grid.addEventListener("keydown", (e) => {
        const b = e.target.closest(".sq-cell"); if (!b) return;
        let r = +b.dataset.row, c = +b.dataset.col;
        const k = e.key;
        if (k === "ArrowRight") c++; else if (k === "ArrowLeft") c--; else if (k === "ArrowDown") r++; else if (k === "ArrowUp") r--;
        else if (k === "Home") c = 0; else if (k === "End") c = STEPS - 1; else return;
        e.preventDefault();
        if (r < 0 || r >= TRACKS.length || c < 0 || c >= STEPS) return;
        cursor = { row: r, col: c }; pin();
        if (!wide && Math.floor(c / PAGE) !== page) { page = Math.floor(c / PAGE); build(); }
        else paint();
        cellAt(r, c)?.focus({ preventScroll: true });
      }, sig);
      pageBtns.forEach((b) => b.addEventListener("click", () => { pin(); const p = +b.dataset.page; if (p !== page) { page = p; build(); } }, sig));
      play.addEventListener("click", () => {
        if (running) { stop(); live.textContent = "Stopped"; } else { start(); live.textContent = "Replaying the schedule"; }
      }, sig);

      function setTempo(next) { stepMs = Math.min(STEP_MS.max, Math.max(STEP_MS.min, Math.round(next / 10) * 10)); paintTop(); }
      card.addEventListener("keydown", (e) => {
        const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 10, PageDown: -10 }[e.key];
        if (d) setTempo(stepMs + d * 10); else if (e.key === "Home") setTempo(STEP_MS.min); else if (e.key === "End") setTempo(STEP_MS.max); else return;
        e.preventDefault();
      }, sig);
      card.addEventListener("dblclick", () => setTempo(STEP_MS.initial), sig);
      /* Drag the step box up for a longer step, 5 ms a pixel (Shift for fine); it stays where you leave it. */
      let drag = null;
      card.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        card.setPointerCapture(e.pointerId);
        drag = { id: e.pointerId, x: e.clientX, y: e.clientY, from: stepMs };
      }, sig);
      card.addEventListener("pointermove", (e) => { if (drag && drag.id === e.pointerId) setTempo(drag.from + (drag.y - e.clientY) * (e.shiftKey ? 1 : 5)); }, sig);
      const end = (e) => { if (drag && drag.id === e.pointerId) drag = null; };
      card.addEventListener("pointerup", end, sig); card.addEventListener("pointercancel", end, sig);

      /* Sixteen steps once there's room for them. */
      const ro = new ResizeObserver(([entry]) => { const w = entry.contentRect.width >= WIDE; if (w !== wide) { wide = w; build(); } });
      ro.observe(root);
      wide = root.getBoundingClientRect().width >= WIDE;
      build(); paintTop();
      /* It plays from the first frame; under reduced motion it waits for Play. */
      if (!ctx.reduced()) start();
      return { destroy() { ro.disconnect(); running = false; } };
    },
  });
})();

<script>
/* switch.js */
/* Switch, after litterthanlit/components, redesigned in Rack: an agent's permissions, as a device. Each agent is a
   device in its own colour: a title strip with its enable key (the one lit yellow key), what this run has spent so far
   against its budget, and five permissions, each a toggle key with its word on its face (Allow, or Ask) and a value
   box for its limit. Nothing slides: a key lights on the frame, and a drag across it ends on a side. On load the
   policy applies a key at a time on the tick; after that the only thing that moves is the spend, because it is the
   work. */
(function () {
  const S = ".fs-switch";
  const TICK = 120; // ms between keys as the policy applies
  const AGENTS = [
    { id: "coder", name: "Coder", model: "Large", hue: "orange", at: 0, rate: 0.19 },
    { id: "research", name: "Researcher", model: "Small", hue: "blue", at: TICK, rate: 0.11 },
  ];
  const money = (v) => `$${v.toFixed(2)}`;
  const PERMS = [
    { key: "read", label: "Read files", min: 0, max: 1000, step: 10, def: 200, fmt: (v) => `${v} files`, name: "Read limit" },
    { key: "write", label: "Write files", min: 0, max: 100, step: 1, def: 20, fmt: (v) => `${v} files`, name: "Write limit" },
    { key: "run", label: "Run commands", min: 5, max: 600, step: 5, def: 30, fmt: (v) => `${v} s`, name: "Command timeout" },
    { key: "net", label: "Network", min: 0, max: 20, step: 1, def: 4, fmt: (v) => `${v} hosts`, name: "Network hosts" },
    { key: "spend", label: "Spend", min: 0.25, max: 10, step: 0.25, def: 2, fmt: money, name: "Spend limit per run" },
  ];
  /* The policy on load: enable, then each permission in turn, and Network back to Ask. */
  const POLICY = [[1, "power", true], [3, "read", true], [5, "write", true], [7, "run", true], [9, "net", true], [11, "spend", true], [16, "net", false]];
  const RUN = 9; // s a demo run lasts before the next begins
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let uid = 0;

  /* A value box: role slider, drag up and down 1:1 (Shift for fine), arrows step, double-click returns to default. */
  function valueBox(el, s, ctx) {
    let v = s.def;
    const snap = (x) => clamp(Math.round(x / s.step) * s.step, s.min, s.max);
    const paint = () => { const t = s.fmt(v); el.textContent = t; el.setAttribute("aria-valuenow", String(v)); el.setAttribute("aria-valuetext", t); };
    const set = (x) => { const n = snap(x); if (n !== v) { v = n; paint(); } };
    const sig = { signal: ctx.signal };
    let drag = null;
    el.addEventListener("pointerdown", (e) => { if (e.button !== 0 || el.getAttribute("aria-disabled") === "true") return; el.setPointerCapture(e.pointerId); el.focus({ preventScroll: true }); drag = { y: e.clientY, v }; e.preventDefault(); }, sig);
    el.addEventListener("pointermove", (e) => {
      if (!drag) return;
      set(drag.v + ((drag.y - e.clientY) / 120) * (s.max - s.min) * (e.shiftKey ? 0.1 : 1));
      if (e.shiftKey) { drag.y = e.clientY; drag.v = v; }
    }, sig);
    const end = () => (drag = null);
    el.addEventListener("pointerup", end, sig); el.addEventListener("pointercancel", end, sig);
    el.addEventListener("dblclick", () => set(s.def), sig);
    el.addEventListener("keydown", (e) => {
      if (el.getAttribute("aria-disabled") === "true") return;
      const big = (s.max - s.min) / 10;
      const d = { ArrowUp: s.step, ArrowRight: s.step, ArrowDown: -s.step, ArrowLeft: -s.step, PageUp: big, PageDown: -big }[e.key];
      if (d !== undefined) { e.preventDefault(); set(v + d); }
      else if (e.key === "Home") { e.preventDefault(); set(s.min); }
      else if (e.key === "End") { e.preventDefault(); set(s.max); }
    }, sig);
    paint();
    return { get value() { return v; } };
  }

  /* A toggle key: its word on its face, lit when on. A tap flips it; a drag across it ends on a side. */
  function toggleKey(btn, ctx, onChange) {
    let on = false;
    const set = (x, user) => { if (x === on) return; on = x; btn.setAttribute("aria-checked", on ? "true" : "false"); onChange(on, user); };
    const sig = { signal: ctx.signal };
    let down = null;
    btn.addEventListener("pointerdown", (e) => { if (e.button !== 0) return; btn.setPointerCapture(e.pointerId); down = { x: e.clientX }; }, sig);
    btn.addEventListener("pointerup", (e) => {
      if (!down) return;
      const moved = Math.abs(e.clientX - down.x) > 6; down = null;

      set(e.clientX > r.left + r.width / 2, true);
    }, sig);
    btn.addEventListener("pointercancel", () => (down = null), sig);
    btn.addEventListener("click", (e) => { if (e.detail === 0) set(!on, true); }, sig);
    return { get on() { return on; }, set };
  }

  FlatPlayer.register({
    slug: "switch",
    title: "Switch",
    tagline: "An agent's permissions: toggle keys that light on the frame, each with its limit.",
    css: `
${S} .pm { width: min(100%, 330px); display: grid; gap: 3px; padding: 3px; background: var(--body); border-radius: var(--r-panel); user-select: none; -webkit-user-select: none }
${S} .pm-dev { background: var(--panel); border-radius: var(--r-panel); overflow: hidden; min-width: 0 }
${S} .pm-dev + .pm-dev { display: none }
${S} .pm-strip { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 5px; background: var(--panel-2) }
${S} .pm-title { font-size: 12px; font-weight: 600; white-space: nowrap }
${S} .pm-tag { height: 18px; padding: 0 6px; display: inline-flex; align-items: center; border-radius: var(--r-control); font: 600 10px/1 var(--mono);
  background: var(--tint); color: var(--text); white-space: nowrap }
${S} .pm-state { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap }
${S} .pm-state.is-danger { color: var(--danger) }
${S} .pm-body { display: grid; gap: 4px; padding: 6px 6px 7px }
${S} .pm-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 44px; align-items: center; gap: 4px; min-height: 22px }
${S} .pm-label { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
${S} .pm-use { display: grid; grid-template-columns: auto minmax(0, 1fr) 70px; align-items: center; gap: 6px; padding-bottom: 5px; margin-bottom: 1px; border-bottom: 1px solid var(--line) }
${S} .pm-slot { position: relative; height: 8px; border-radius: var(--r-control); background: var(--slot); overflow: hidden }
${S} .pm-slot i { position: absolute; inset: 0; background: var(--hue); transform-origin: left center; transform: scaleX(var(--f, 0)) }
${S} .pm-slot.is-over i { background: var(--danger) }
${S} .pm-val { height: 22px; display: flex; align-items: center; justify-content: flex-end; padding: 0 6px; border-radius: var(--r-control); background: var(--cut); box-shadow: var(--edge);
  font: 500 11px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; overflow: hidden; cursor: ns-resize; touch-action: none }
${S} .pm-val:active { box-shadow: var(--edge-press) }
${S} .pm-val[aria-disabled="true"] { color: var(--disabled); cursor: default }
${S} .pm-val.is-read { background: transparent; box-shadow: none; cursor: default; color: var(--ink) }
${S} .pm-val.is-over { color: var(--danger) }
${S} .pm-key { all: unset; box-sizing: border-box; height: 22px; display: grid; place-items: center; border-radius: var(--r-control); background: var(--block); box-shadow: var(--edge);
  font: 600 11px/1 var(--font); color: var(--muted); cursor: pointer; touch-action: pan-y; transition: background-color var(--cut-in) var(--ease-out), color var(--cut-in) var(--ease-out) }
${S} .pm-key > span { grid-area: 1 / 1 } ${S} .pm-key .w-on { visibility: hidden }
${S} .pm-key[aria-checked="true"] .w-on { visibility: visible } ${S} .pm-key[aria-checked="true"] .w-off { visibility: hidden }
${S} .pm-key:hover { background: var(--block-hover) }
${S} .pm-key:active { box-shadow: var(--edge-press); scale: 0.98 }
${S} .pm-key[aria-checked="true"] { background: var(--ink); color: var(--panel) }
${S} .pm-key.is-power { width: 18px; height: 18px; flex: none }

${S} .pm-key.is-power[aria-checked="true"] { background: var(--accent); color: var(--accent-fg) }
${S} .pm-key:disabled { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--disabled); cursor: default }
${S} .pm-key:focus-visible, ${S} .pm-val:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px }
${S} .pm-dev:not(.is-on) .pm-body { opacity: 0.55 }
@container (min-width: 600px) {
  ${S} .pm { width: 640px; grid-template-columns: 1fr 1fr }
  ${S} .pm-dev + .pm-dev { display: block }
}
`,
    mount(host, ctx) {
      const id = "fs-pm-" + ++uid;
      host.innerHTML = `
<div class="pm">
  ${AGENTS.map((a) => `<section class="pm-dev" data-a="${a.id}" aria-labelledby="${id}-${a.id}" style="--hue: var(--clip-${a.hue}); --tint: var(--clip-${a.hue}-tint); --text: var(--clip-${a.hue}-text)">
    <div class="pm-strip">
      <button type="button" class="pm-key is-power" role="switch" aria-checked="false" data-k="power" aria-label="${a.name} enabled"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1v4M2.6 2.8a3.2 3.2 0 1 0 4.8 0"/></svg></button>
      <span class="pm-title" id="${id}-${a.id}">${a.name}</span><span class="pm-tag">${a.model}</span>
      <span class="pm-state" aria-hidden="true">Off</span>
    </div>
    <div class="pm-body">
      <div class="pm-use"><span class="pm-label">This run</span><span class="pm-slot" aria-hidden="true"><i></i></span><span class="pm-val is-read" aria-hidden="true">$0.00</span></div>
      ${PERMS.map((p) => `<div class="pm-row"><span class="pm-label">${p.label}</span>
        <span class="pm-val" role="slider" tabindex="0" data-v="${p.key}" aria-label="${p.name}" aria-valuemin="${p.min}" aria-valuemax="${p.max}"></span>
        <button type="button" class="pm-key" role="switch" aria-checked="false" data-k="${p.key}" aria-label="${p.label}, allow without asking"><span class="w-off" aria-hidden="true">Ask</span><span class="w-on" aria-hidden="true">Allow</span></button></div>`).join("")}
    </div>
  </section>`).join("")}
  <p class="sr-only" aria-live="polite"></p>
</div>`;
      const live = host.querySelector("[aria-live]");
      const devs = AGENTS.map((a) => {
        const el = host.querySelector(`.pm-dev[data-a="${a.id}"]`);
        const dev = { a, el, keys: {}, vals: {}, state: el.querySelector(".pm-state"), slot: el.querySelector(".pm-slot"), read: el.querySelector(".pm-use .pm-val"),
          spent: 0, t: 0, run: 1, held: false };
        const enabled = () => {
          const on = dev.keys.power.on;
          el.classList.toggle("is-on", on);

          paint(dev);
        };

        dev.keys.power = Object.assign(toggleKey(k, ctx, (on, user) => { enabled(); if (user) live.textContent = `${a.name} ${on ? "enabled" : "off"}`; }), { el: k });
        for (const p of PERMS) {
          const b = el.querySelector(`[data-k="${p.key}"]`), v = el.querySelector(`[data-v="${p.key}"]`);
          dev.keys[p.key] = Object.assign(toggleKey(b, ctx, () => paint(dev)), { el: b });
          dev.vals[p.key] = Object.assign(valueBox(v, p, ctx), { el: v });
        }
        enabled();
        return dev;
      });

      /* What the run has spent against its limit. At the limit, or with Spend set to Ask, the agent stops and asks. */
      function paint(dev) {
        const limit = dev.vals.spend.value, over = dev.spent >= limit, asking = !dev.keys.spend.on || over;
        dev.slot.style.setProperty("--f", clamp(dev.spent / limit, 0, 1).toFixed(4));
        dev.slot.classList.toggle("is-over", over); dev.read.classList.toggle("is-over", over);
        dev.read.textContent = money(dev.spent);
        dev.state.classList.toggle("is-danger", over && dev.keys.power.on);
        dev.state.textContent = !dev.keys.power.on ? "Off" : over ? "At limit, asking" : asking ? "Asks to spend" : `Run ${dev.run}`;
        const held = dev.keys.power.on && asking;
        if (held && !dev.held && dev.keys.power.on && dev.keys.spend.on) live.textContent = `${dev.a.name} reached its spend limit and is asking`;
        dev.held = held;
      }

      const timers = [];
      const finish = () => devs.forEach((dev) => { for (const [, key, on] of POLICY) dev.keys[key].set(on, false); });
      if (ctx.reduced()) { finish(); devs.forEach((dev, i) => { dev.spent = 0.84 - i * 0.37; paint(dev); }); }
      else {
        for (const dev of devs) for (const [b, key, on] of POLICY) timers.push(ctx.after(dev.a.at + b * TICK, () => dev.keys[key].set(on, false)));
        ctx.loop((dt) => {
          for (const dev of devs) {
            if (!dev.keys.power.on) continue;

            if (dev.t > RUN) { dev.t = 0; dev.spent = 0; dev.run++; }
            else if (!dev.held) dev.spent += dt * dev.a.rate * (0.6 + 0.8 * Math.abs(Math.sin(dev.t * 1.7)));
            paint(dev);
          }
        });
      }
      ctx.onHand(() => timers.forEach(clearTimeout));
    },
  });
})();

<script>

   One readout: the clock. */

    slug: "ticker",
    title: "Ticker",
    tagline: "An agent console's activity line, every message logged by agent.",
    css,
    mount,

<script>

   The product underneath is an agent console's activity: what finished while you were building (a run, a tool call that
   failed, an approval waiting, a deploy). In Rack nothing travels, so the stack doesn't fan: collapsed, the newest
   message shows with "2 more" under it; look at the panel (hover or focus) and the rest cut in one beat apart, every
   timer paused. Each message wears the colour of the agent it is about (its tab, the agent's name and the bar of time
   it has left, which runs linearly and stops while you read). Failed is said in red; dismiss is a square key. */

    { title: "Run finished", track: "Planner", detail: "12 steps, 0:41", hue: "purple" },
    { title: "Approval needed", track: "Coder", detail: "npm install zod", hue: "orange" },
    { title: "Deploy ready", track: "Reviewer", detail: "preview-42, main", hue: "green" },

  FlatPlayer.register({
    slug: "toast-stack",
    title: "Toast Stack",
    tagline: "An agent console's activity: the newest shows, the rest cut in when you look.",
    css: `
.fs-toast-stack .rk { width: min(100%, 400px); background: var(--body); border-radius: var(--r-panel); padding: 3px; display: grid; gap: 3px; font-family: var(--font); user-select: none; -webkit-user-select: none }
.fs-toast-stack .rk-panel { background: var(--panel); border-radius: var(--r-panel); overflow: hidden }
.fs-toast-stack .rk-strip { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 8px; background: var(--panel-2); min-height: 30px }
.fs-toast-stack .rk-name { font-size: 12px; font-weight: 600; color: var(--ink); margin-right: auto }

.fs-toast-stack .rk-key { all: unset; box-sizing: border-box; display: grid; place-items: center; height: 22px; min-width: 22px; padding: 0 8px; border-radius: var(--r-control); background: var(--block);
  box-shadow: var(--edge); font: 500 11px/1 var(--font); color: var(--ink); cursor: pointer; transition: background-color var(--cut-in) var(--ease-out) }

.fs-toast-stack .rk-key:active { box-shadow: var(--edge-press); transform: scale(0.98) }
.fs-toast-stack .rk-key.is-pressed { box-shadow: var(--edge-press); background: var(--block-hover) }

.fs-toast-stack .rk-key svg { width: 10px; height: 10px }
.fs-toast-stack .rk-key.is-x { padding: 0 }
.fs-toast-stack .rk-list { margin: 0; padding: 6px; list-style: none; display: grid; gap: 3px; min-height: 58px; align-content: start }
.fs-toast-stack .rk-msg { position: relative; display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 6px 9px 0;
  border-radius: var(--r-control); background: var(--panel-2); overflow: hidden; animation: ts-cut var(--cut-in) var(--ease-out) both }

    mount(host, ctx) {

<div class="rk"><section class="rk-panel" aria-label="Activity">
  <div class="rk-strip"><span class="rk-name">Activity</span><span class="rk-box rk-count" aria-hidden="true">0</span><button type="button" class="rk-key rk-send">Run</button><button type="button" class="rk-key rk-clear">Clear</button></div>
  <ol class="rk-list" role="status" aria-live="polite"></ol>
  <p class="rk-more" aria-hidden="true"></p>
</section></div>`;
      const panel = host.querySelector("section"), list = host.querySelector(".rk-list"), more = host.querySelector(".rk-more"), count = host.querySelector(".rk-count");
      const send = host.querySelector(".rk-send"), clear = host.querySelector(".rk-clear");

        const live = msgs.filter((m) => !m.leaving);

        live.forEach((m, i) => { // newest first in the list
          const show = i < shown, was = !m.el.hidden;

        li.style.setProperty("--c", `var(--clip-${s.hue})`); li.style.setProperty("--c-text", `var(--clip-${s.hue}-text)`);

      }

        if (m.leaving) return;
        disarm(m); m.leaving = true;
        const hadFocus = m.el.contains(document.activeElement);
        m.el.classList.add("is-leaving");
        render(false);
        if (hadFocus) { const f = msgs.find((u) => !u.leaving); (f ? f.el.querySelector(".rk-key") : send).focus(); }
        ctx.after(reduced ? 0 : 80, () => { m.el.remove(); msgs = msgs.filter((u) => u !== m); render(false); });
      }
      function setExpanded(on) {
        if (on === expanded) return;
        expanded = on; msgs.forEach(on ? disarm : arm); render(on);
      }

      ctx.loop(() => {
        const now = performance.now();

      });

      ctx.onHand(() => {
        if (ghost) { ghost = false; if (!panel.matches(":hover") && !panel.contains(document.activeElement)) setExpanded(false); }
        if (!timersOn) { timersOn = true; msgs.forEach(arm); }

        ctx.after(3300, () => { if (!ghost) return; setExpanded(false); ctx.every(2600, () => ghost && press()); });
      }
    },
  });
})();

<script>
/* vu-meter.js */
/* VU Meter, in Rack: level meters for an agent team, no needles. Each agent (Planner purple, Researcher blue, Coder

   falls at a steady rate, like a meter, with a peak line that holds 900 ms and then falls. The part over the rate limit is
   red; the limit is a value box you drag. Each agent's peak sits in a box you click to clear, and the run's cost counts
   up in another. A ghost runs the team until a hand arrives; Run starts it again. Time moves the bars; nothing else moves. */

    { name: "Researcher", hue: "blue", rate: 110, burst: 0.5 },
    { name: "Coder", hue: "orange", rate: 120, burst: 0.6 },

  FlatPlayer.register({
    slug: "vu-meter",

    css: `
.fs-vu-meter .mx { width: min(340px, 100%); font: 400 12px/1.35 var(--font); background: var(--body); padding: 3px; border-radius: 8px; display: grid; gap: 3px;
  -webkit-user-select: none; user-select: none }

.fs-vu-meter .mx-key { height: 22px; padding: 0 8px; border: 0; border-radius: var(--r-control); background: var(--block); box-shadow: var(--edge); color: var(--ink);
  font: 500 12px var(--font); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: background-color var(--cut-in) var(--ease-out), color var(--cut-in) var(--ease-out) }
.fs-vu-meter .mx-key:hover { background: var(--block-hover) }
.fs-vu-meter .mx-key:active { box-shadow: var(--edge-press); transform: scale(0.98) }
.fs-vu-meter .mx-key[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
.fs-vu-meter .mx-key svg { width: 9px; height: 9px; fill: currentColor }
.fs-vu-meter .mx-clock { font: 600 18px/1 var(--mono); letter-spacing: -0.02em; margin: 0 auto 0 4px }
.fs-vu-meter .mx-box { height: 20px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: var(--r-control); background: var(--cut); box-shadow: var(--edge);
  font: 600 11px var(--mono); white-space: nowrap; color: var(--ink); border: 0 }
.fs-vu-meter .mx-limit { cursor: ns-resize; touch-action: none }
.fs-vu-meter .mx-strips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) 26px; gap: 3px }
.fs-vu-meter .mx-strip { background: var(--panel); border-radius: var(--r-panel); padding: 4px; display: grid; gap: 4px; justify-items: center; min-width: 0 }
.fs-vu-meter .mx-name { width: 100%; height: 20px; display: grid; place-items: center; padding: 0 3px; border-radius: var(--r-control); background: var(--tint); color: var(--txt);
  font-weight: 600; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.fs-vu-meter .mx-box.is-over { background: var(--danger); color: var(--panel) }

    mount(host, ctx) {

      const scale = [200, 150, 100, 50, 0].map((r) => '<span style="bottom:' + pos(r) * 100 + '%">' + r + "</span>").join("");
      host.innerHTML = `
<div class="mx">
  <div class="mx-bar">
    <button class="mx-key" type="button" data-k="run" aria-pressed="false"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 0.5 9.5 5l-8 4.5z"/></svg><span>Run</span></button>
    <span class="mx-clock" aria-hidden="true">0:00.0</span>
    <span class="mx-box mx-cost" aria-hidden="true">$0.000</span>
    <span class="mx-box mx-limit" role="slider" tabindex="0" aria-label="Rate limit, tokens per second" aria-describedby="${id}-hint" aria-orientation="vertical" aria-valuemin="40" aria-valuemax="200"></span>
  </div>
  <div class="mx-strips">${strips}<div class="mx-scale" aria-hidden="true">${scale}</div></div>
  <p id="${id}-hint" class="sr-only">Drag up or down, or use the arrow keys, to set the limit. Double-click for 160.</p>
  <p class="sr-only" aria-live="polite"></p>
</div>`;
      const sig = { signal: ctx.signal };
      const root = host.querySelector(".mx"), chans = [...host.querySelectorAll(".mx-ch")], boxes = [...host.querySelectorAll(".mx-strip > .mx-box")];
      const run = host.querySelector('[data-k="run"]'), clockEl = host.querySelector(".mx-clock"), costEl = host.querySelector(".mx-cost"), limitEl = host.querySelector(".mx-limit");
      const live = host.querySelector("[aria-live]");

      function drawLimit() {
