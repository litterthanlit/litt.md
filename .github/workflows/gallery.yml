# The PR check: the same chain Vercel runs (verify, then build), plus the litt.md checks and every page check from a
# build (axe, the WCAG regressions, the page checks, reduced motion). A preview deploy can fail without marking the PR,
# so this does.
#
# The page checks run as a matrix of parallel jobs, each on its own build, so the run takes as long as its slowest
# shard rather than the sum: in series they take well over an hour. GitHub's free plan runs at most 20 jobs at once, so
# more shards than that only queue; make a check faster before giving it another shard. A job that grows past about
# 6 minutes gets rebalanced (a11y.mjs, reduced-motion.mjs, wall.mjs, study.mjs and playground.mjs take --shard k/n).
# Read the job's steps before rebalancing: a slow job is often a slow install, not a slow check.
#
# a11y.mjs and reduced-motion.mjs deal pages by weight (scripts/shard.mjs): each page weighs the seconds it took last
# time (scripts/page-costs.json), longest first to the lightest shard, the same split in every job. test:shards (part of
# verify) reads the --shard jobs below and fails unless every page lands in exactly one. Re-measure when the shards
# drift: npm run test:a11y --prefix gallery -- --record-costs, and the same for test:motion, then commit the file.
#
# Playwright's system packages come from the Ubuntu mirror, which can crawl (58 kB/s, ten minutes for one job, on
# 2026-11-18). So the browser and the .debs it pulls are cached per runner image and Playwright version, and a warm job
# installs the .debs from disk without touching the mirror.
#
# A pull request that changes nothing the gallery is built from (taste/, proposals/, evals/, notes) skips the page
# checks; check still runs. A push to main always runs everything.
name: Gallery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # the changes job lists the PR's files

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the page checks can see this change: the gallery, the skill it builds from (tokens, the lint) and CI.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gallery: ${{ github.event_name == 'push' || steps.filter.outputs.gallery == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            gallery:
              - 'gallery/**'
              - 'skills/**'
              - '.github/workflows/**'

  check:
    # Pinned: ubuntu-latest moved to 26.04 on 2026-11-11, where Playwright 1.56.1 (below) cannot install Chromium.
    # Move this and the Playwright version together, and re-run every page check when you do.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gallery/package-lock.json

      - name: litt.md checks
        run: node skills/litt-md/scripts/check.mjs

      - name: Install
        run: npm ci --prefix gallery

      - name: Verify (tokens, docs data, registry and its versions, agent docs, typecheck, lint, lint self-test, class collisions)
        run: npm run verify --prefix gallery

      # verify rewrites registry.lock.json when an item changed and CHANGELOG.md names it. The lock must be committed
      # with the change, or the next change to that item would be compared against the wrong hash.
      - name: Registry lock is committed
        run: git diff --exit-code -- gallery/registry.lock.json || (echo "::error::registry.lock.json changed in verify. Run npm run gen:registry --prefix gallery and commit it." && exit 1)

      - name: Build
        run: npm run build --prefix gallery

  pages:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.gallery == 'true'
    runs-on: ubuntu-24.04 # pinned with the Playwright version; see the check job
    timeout-minutes: 25
    strategy:
      fail-fast: false # one failing suite should not hide what the others found
      matrix:
        include:
          # Every page in every world (scripts/routes.mjs, about 640 addresses). GitHub runs at most 20 jobs at once and
          # check takes one, so the checks fill 19 jobs of about five minutes each.
          # axe on every page, light and dark, desktop and phone, six tabs at once, dealt by weight across six shards.
          - { name: "Accessibility 1/6", run: "npm run test:a11y --prefix gallery -- --shard 1/6" }
          - { name: "Accessibility 2/6", run: "npm run test:a11y --prefix gallery -- --shard 2/6" }
          - { name: "Accessibility 3/6", run: "npm run test:a11y --prefix gallery -- --shard 3/6" }
          - { name: "Accessibility 4/6", run: "npm run test:a11y --prefix gallery -- --shard 4/6" }
          - { name: "Accessibility 5/6", run: "npm run test:a11y --prefix gallery -- --shard 5/6" }
          - { name: "Accessibility 6/6", run: "npm run test:a11y --prefix gallery -- --shard 6/6" }
          # Nothing moves on any page or overlay, desktop and phone, dealt by weight. The self-test runs with motion allowed and must
          # see motion, so a check that has gone blind fails too; it loads only the four pages it judges.
          - { name: "Reduced motion 1/5", run: "npm run test:motion --prefix gallery -- --shard 1/5 && npm run test:motion --prefix gallery -- --self-test" }
          - { name: "Reduced motion 2/5", run: "npm run test:motion --prefix gallery -- --shard 2/5" }
          - { name: "Reduced motion 3/5", run: "npm run test:motion --prefix gallery -- --shard 3/5" }
          - { name: "Reduced motion 4/5", run: "npm run test:motion --prefix gallery -- --shard 4/5" }
          - { name: "Reduced motion 5/5", run: "npm run test:motion --prefix gallery -- --shard 5/5" }
          # The WCAG regressions and the page checks, each with its self-test, paired to about five minutes a job.
          # One command a line under set -e, so any failure fails the job (a failure inside `a && b` in a loop does not).
          # Seconds of each check on 2026-11-18, with its self-test, to pair them: reflow and forced colors 245, text zoom
          # and focus 278, corners 317, gaps 276, home 13, worlds 74, materials 115, sound 61, studies 253 and 171.
          - name: Reflow, forced colors and worlds
            run: |
              set -e
              npm run test:reflow --prefix gallery
              npm run test:reflow --prefix gallery -- --self-test
              npm run test:forced-colors --prefix gallery
              npm run test:forced-colors --prefix gallery -- --self-test
              npm run test:worlds --prefix gallery
              npm run test:worlds --prefix gallery -- --self-test
          - name: Text zoom, focus and sound
            run: |
              set -e
              npm run test:text-zoom --prefix gallery
              npm run test:text-zoom --prefix gallery -- --self-test
              npm run test:focus --prefix gallery
              npm run test:focus --prefix gallery -- --self-test
              npm run test:sound --prefix gallery
              npm run test:sound --prefix gallery -- --self-test
          - { name: "Corners", run: "npm run test:corners --prefix gallery && npm run test:corners --prefix gallery -- --self-test" }
          - name: Gaps and home
            run: |
              set -e
              npm run test:gaps --prefix gallery
              npm run test:gaps --prefix gallery -- --self-test
              npm run test:home --prefix gallery
          # Each world's player; the self-test opens only the worlds its breaks land in.
          - { name: "Playground", run: "npm run test:playground --prefix gallery && npm run test:playground --prefix gallery -- --self-test" }
          # The wall: every material, size and theme with every tile mounted, one accent fill, nothing sideways or empty.
          - { name: "Wall", run: "npm run test:wall --prefix gallery" }
          # Every study page has its sections, anatomy parts resolve, the material frame matches pixel for pixel.
          # The self-test runs unsharded, on the Button study.
          - { name: "Studies 1/2", run: "npm run test:study --prefix gallery -- --shard 1/2 && npm run test:study --prefix gallery -- --self-test" }
          - name: Studies 2/2 and materials
            run: |
              set -e
              npm run test:study --prefix gallery -- --shard 2/2
              npm run test:materials --prefix gallery
              npm run test:materials --prefix gallery -- --self-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gallery/package-lock.json

      - name: Install
        run: npm ci --prefix gallery

      - name: Build
        run: npm run build --prefix gallery

      # The browser and the system packages Playwright installs, per runner image (a new image may carry newer
      # libraries, so it resolves them afresh) and Playwright version. Move the key's version with the one below.
      - name: Playwright cache key
        id: pw
        run: echo "key=playwright-1.56.1-debs3-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/playwright-debs
          key: ${{ steps.pw.outputs.key }}

      # Playwright and axe-core stay out of the gallery's package.json, so Vercel never installs them. The system
      # packages Playwright lists are fetched into ~/playwright-debs with --download-only on a cold cache, and every job
      # installs them from there with dpkg -i (apt-get install ./x.deb fetches from the mirror anyway whenever its lists
      # carry the same version). Then every package is checked, and the mirror is used only if one is still missing.
      - name: Install Playwright and axe-core
        run: |
          npm install --prefix "$RUNNER_TEMP/a11y" --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3
          PW="$RUNNER_TEMP/a11y/node_modules/.bin/playwright"
          PKGS=$("$PW" install-deps --dry-run chromium | sed -n 's/.*--no-install-recommends \([^"]*\)".*/\1/p')
          test -n "$PKGS" || { echo "::error::could not read Playwright's package list"; exit 1; }
          missing() { for p in $PKGS; do [ "$(dpkg-query -W -f='${Status}' "$p" 2> /dev/null)" = "install ok installed" ] || echo "$p"; done; }
          if ! ls ~/playwright-debs/*.deb > /dev/null 2>&1 && [ -n "$(missing)" ]; then
            mkdir -p ~/playwright-debs/partial
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends --download-only -o Dir::Cache::Archives="$HOME/playwright-debs/" $PKGS
            sudo rm -rf ~/playwright-debs/partial ~/playwright-debs/lock
            sudo chown -R "$USER" ~/playwright-debs
          fi
          echo "$(ls ~/playwright-debs/*.deb 2> /dev/null | wc -l) cached .debs"
          if ls ~/playwright-debs/*.deb > /dev/null 2>&1; then sudo dpkg -i ~/playwright-debs/*.deb; fi
          MISSING=$(missing)
          if [ -n "$MISSING" ]; then echo "::warning::not in the cache, from the mirror: $(echo $MISSING)"; "$PW" install-deps chromium; fi
          "$PW" install chromium

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
        env:
          A11Y_TOOLS: ${{ runner.temp }}/a11y
