schema_version: "1.0"
name: negative-unrelated
description: An unrelated coding task must not load litt-md.
tags: [trigger, negative]
runs: 1
execution:
  prompt: |
    Write a Python function that parses an ISO 8601 timestamp string and returns a timezone-aware datetime.
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: does-not-load-litt-md
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?litt-md"'
    min: 0
    max: 0
